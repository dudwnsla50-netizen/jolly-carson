<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중요도별 문제 리스트</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="yearly_exam.css">
    <link rel="stylesheet" href="importance_list.css">
</head>

<body>
    <div class="container">
        <header>
            <a href="yearly_exam.html" class="back-btn">
                <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i> 모의고사 화면으로
            </a>
            <h1>중요도별 문제 리스트</h1>
            <p class="subtitle">과목과 중요도를 기준으로 문제·정답·해설을 한눈에 훑어봅니다. 중요도는 바로 수정할 수 있습니다.</p>
        </header>

        <div class="il-filter-bar">
            <select id="il-filter-subject">
                <option value="all">전체 과목</option>
                <option value="PM">사업관리</option>
                <option value="SE">소프트웨어공학</option>
                <option value="DB">데이터베이스</option>
                <option value="SA">시스템아키텍처</option>
                <option value="SC">보안</option>
            </select>
            <select id="il-filter-importance">
                <option value="all">전체 중요도</option>
                <option value="상" selected>상</option>
                <option value="중">중</option>
                <option value="하">하</option>
                <option value="예외">예외</option>
            </select>
            <span class="il-count-text" id="il-count-text"></span>
            <button type="button" class="il-save-btn" id="il-save-all-btn" onclick="ilSaveAllChanges()" disabled>저장</button>
        </div>

        <!-- [로딩 화면] -->
        <div id="il-loading-view" class="status-screen">
            <div class="spinner"></div>
            <h3 style="color: var(--text-primary); font-weight: 600; margin-bottom: 0.5rem;">문항을 불러오는 중입니다</h3>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">잠시만 기다려 주십시오...</p>
        </div>

        <!-- [빈 상태] -->
        <div id="il-empty-view" class="status-screen" style="display: none;">
            <i data-lucide="inbox" style="width: 40px; height: 40px; color: var(--text-muted); margin-bottom: 1rem;"></i>
            <p style="color: var(--text-secondary);">조건에 해당하는 문항이 없습니다.</p>
        </div>

        <div class="il-list" id="il-list" style="display: none;"></div>

        <div class="il-toast" id="il-toast"><i data-lucide="check-circle" style="width: 16px; height: 16px;"></i><span id="il-toast-text"></span></div>
    </div>

    <script src="importance_list.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();
        });
    </script>
</body>

</html>
