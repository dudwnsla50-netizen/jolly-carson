<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>년도별 120제 모의고사</title>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap"
        rel="stylesheet">
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="yearly_exam.css">
    <script src="../js/data/new_trend_mapping.js"></script>
</head>

<body>
    <div class="container">
        <!-- 상단 헤더 -->
        <header>
            <a href="../db_official_scopes.html" class="back-btn" id="home-link">
                <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i> 대시보드로 돌아가기
            </a>
            <h1 id="view-title">년도별 120제 모의고사</h1>
            <p class="subtitle" id="view-subtitle">연도별 1회분 기출문제(120문항) 전체 또는 과목 범위를 선택해 타이머 측정과 함께 응시합니다.</p>
        </header>

        <!-- [미동기화 데이터 싱크 알림 배너] -->
        <div class="sync-banner" id="sync-banner-element">
            <div class="sync-banner-text">
                <i data-lucide="cloud-lightning" style="width: 18px; height: 18px; color: #a78bfa;"></i>
                <span>로컬 장치에 데이터베이스와 동기화되지 않은 풀이 결과가 <strong id="pending-sync-count">0</strong>건 있습니다.</span>
            </div>
            <button class="sync-banner-btn" onclick="syncPendingSubmits()">
                <i data-lucide="refresh-cw" style="width: 14px; height: 14px;"></i> DB에 즉시 반영하기
            </button>
        </div>

        <!-- [로딩 화면] -->
        <div id="loading-screen" class="status-screen">
            <div class="spinner"></div>
            <h3 style="color: #ffffff; font-weight: 600; margin-bottom: 0.5rem;">데이터를 불러오는 중입니다</h3>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">잠시만 기다려 주십시오...</p>
        </div>

        <!-- [1. 연도 선택 화면] -->
        <div id="selection-view">
            <div class="exam-grid" id="exam-card-container">
                <!-- API 조회를 통해 연도별 카드가 동적으로 주입됩니다. -->
            </div>
        </div>
    </div>

    <!-- 비즈니스 로직 스크립트 -->
    <script src="yearly_exam.js"></script>
<script src="../js/quick_add.js"></script>
</body>

</html>
