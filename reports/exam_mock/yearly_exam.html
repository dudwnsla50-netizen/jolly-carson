<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>년도별 120제 모의고사</title>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap"
        rel="stylesheet">
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="yearly_exam.css">
    <script src="../js/data/new_trend_mapping.js"></script>
</head>

<body>
    <div class="container">
        <!-- 상단 헤더 -->
        <header>
            <a href="../db_official_scopes.html" class="back-btn" id="home-link">
                <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i> 대시보드로 돌아가기
            </a>
            <h1 id="view-title">년도별 120제 모의고사</h1>
            <p class="subtitle" id="view-subtitle">연도별 1회분 기출문제(120문항) 전체 또는 과목 범위를 선택해 타이머 측정과 함께 응시합니다.</p>
        </header>

        <!-- [미동기화 데이터 싱크 알림 배너] -->
        <div class="sync-banner" id="sync-banner-element">
            <div class="sync-banner-text">
                <i data-lucide="cloud-lightning" style="width: 18px; height: 18px; color: #a78bfa;"></i>
                <span>로컬 장치에 데이터베이스와 동기화되지 않은 풀이 결과가 <strong id="pending-sync-count">0</strong>건 있습니다.</span>
            </div>
            <button class="sync-banner-btn" onclick="syncPendingSubmits()">
                <i data-lucide="refresh-cw" style="width: 14px; height: 14px;"></i> DB에 즉시 반영하기
            </button>
        </div>

        <!-- [로딩 화면] -->
        <div id="loading-screen" class="status-screen">
            <div class="spinner"></div>
            <h3 style="color: #ffffff; font-weight: 600; margin-bottom: 0.5rem;">데이터를 불러오는 중입니다</h3>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">잠시만 기다려 주십시오...</p>
        </div>

        <!-- [1. 연도 선택 화면] -->
        <div id="selection-view">
            <div class="exam-grid" id="exam-card-container">
                <!-- API 조회를 통해 연도별 카드가 동적으로 주입됩니다. -->
            </div>
        </div>
    </div>

    <!-- [신규] 모의고사 풀이 이력 모달 -->
    <div id="history-modal" class="modal-overlay" onclick="closeHistoryModal(event)" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(8, 11, 19, 0.85); backdrop-filter: blur(12px); z-index: 1000; align-items: center; justify-content: center;">
        <div class="modal-card" onclick="event.stopPropagation()" style="background: var(--card-bg); border: 1px solid var(--accent-violet); border-radius: 20px; width: 100%; max-width: 750px; padding: 2rem; box-shadow: 0 15px 45px rgba(139, 92, 246, 0.25); display: flex; flex-direction: column; gap: 1.5rem; position: relative;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 0.8rem;">
                <h3 id="history-modal-title" style="font-family: 'Outfit', sans-serif; font-size: 1.25rem; font-weight: 800; color: #ffffff; display: flex; align-items: center; gap: 0.5rem; margin: 0;">
                    <i data-lucide="history" style="color: var(--accent-violet); width: 22px; height: 22px;"></i> 년도별 풀이 이력 조회
                </h3>
                <button onclick="closeHistoryModal()" style="background: none; border: none; color: var(--text-secondary); font-size: 1.3rem; cursor: pointer; line-height: 1; outline: none; padding: 0.2rem 0.5rem; transition: color 0.2s;" onmouseover="this.style.color='#ffffff'" onmouseout="this.style.color='var(--text-secondary)'">✕</button>
            </div>
            <div id="history-modal-body" style="max-height: 380px; overflow-y: auto; padding-right: 0.5rem; scrollbar-width: thin;">
                <!-- 동적으로 테이블이 주입됩니다. -->
            </div>
            <div style="text-align: right; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 0.8rem;">
                <button onclick="closeHistoryModal()" style="background: var(--accent-gradient); border: none; color: #ffffff; padding: 0.55rem 1.2rem; border-radius: 8px; font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(139, 92, 246, 0.25);" onmouseover="this.style.opacity='0.9'" onmouseout="this.style.opacity='1'">닫기</button>
            </div>
        </div>
    </div>

    <!-- 비즈니스 로직 스크립트 -->
    <script src="yearly_exam.js"></script>
<script src="../js/quick_add.js"></script>
</body>

</html>
