<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보안 12개년 빈출 개념 정밀 뷰어</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080b13;
            --card-bg: rgba(17, 24, 39, 0.75);
            --border-color: rgba(255, 255, 255, 0.06);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent-violet: #8b5cf6;
            --accent-blue: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%);
            --accent-glow: rgba(139, 92, 246, 0.12);
            --success: #10b981;
            --card-hover-border: rgba(139, 92, 246, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 2.5rem 1.5rem;
            min-height: 100vh;
            background-image: 
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.06) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.06) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.6rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.6rem;
            letter-spacing: -0.03em;
        }

        header p.subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
        }

        .meta-badges {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .badge {
            background: var(--border-color);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 0.35rem 0.9rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 500;
            backdrop-filter: blur(8px);
        }

        .badge.accent {
            background: rgba(139, 92, 246, 0.12);
            border-color: rgba(139, 92, 246, 0.25);
            color: #c084fc;
        }

        .filter-section {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.45rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .filter-btn:hover, .filter-btn.active {
            border-color: var(--accent-violet);
            color: #ffffff;
            background: rgba(139, 92, 246, 0.08);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .accordion-list {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-bottom: 4rem;
        }

        .accordion-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .accordion-item:hover {
            border-color: var(--card-hover-border);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .accordion-trigger {
            width: 100%;
            background: none;
            border: none;
            color: inherit;
            padding: 1.6rem 1.8rem;
            text-align: left;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .card-title-group {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .rank-badge {
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .concept-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        .category-tag {
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            padding: 0.15rem 0.45rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .freq-count-badge {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.15);
            color: var(--success);
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .card-meta-grid {
            display: grid;
            grid-template-columns: 90px 1fr;
            row-gap: 0.5rem;
            column-gap: 0.8rem;
            width: 100%;
            font-size: 0.88rem;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 0.8rem;
            margin-top: 0.2rem;
        }

        .meta-label {
            color: var(--text-muted);
            font-weight: 600;
        }

        .meta-value {
            color: var(--text-secondary);
            word-break: keep-all;
        }

        .meta-value.accent {
            color: #c8a2c8;
        }

        .accordion-trigger .arrow {
            transition: transform 0.3s ease;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .accordion-item.active .accordion-trigger .arrow {
            transform: rotate(180deg);
            color: var(--accent-violet);
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            background: rgba(0, 0, 0, 0.18);
        }

        .accordion-inner {
            padding: 1.6rem 1.8rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .section-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 0.3rem;
            margin-top: 0.2rem;
        }

        .year-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .year-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.35rem 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .year-btn:hover {
            background: var(--accent-gradient);
            border-color: transparent;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.25);
            transform: translateY(-1px);
        }

        .year-btn.active-btn {
            background: var(--accent-gradient);
            border-color: transparent;
            box-shadow: 0 4px 10px rgba(139, 92, 246, 0.3);
            color: #ffffff;
        }

        .year-btn .num-label {
            opacity: 0.7;
            font-size: 0.7rem;
        }

        .inline-question-viewer {
            background: #090d16;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            transition: all 0.3s ease;
        }

        .viewer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 0.5rem;
        }

        .viewer-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #60a5fa;
            font-family: 'Outfit', sans-serif;
        }

        .viewer-close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: color 0.2s;
        }

        .viewer-close-btn:hover {
            color: #ef4444;
        }

        .viewer-body {
            font-size: 0.92rem;
            line-height: 1.7;
            color: #d1d5db;
            white-space: pre-wrap;
            overflow-y: auto;
            max-height: 400px;
            padding-right: 0.5rem;
        }

        .viewer-body::-webkit-scrollbar {
            width: 6px;
        }
        .viewer-body::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.01);
        }
        .viewer-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .memo-section {
            background: rgba(139, 92, 246, 0.02);
            border: 1px dashed rgba(139, 92, 246, 0.15);
            border-radius: 8px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-bottom: 0.5rem;
        }

        .memo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.04);
            padding-bottom: 0.4rem;
        }

        .memo-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #c084fc;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .memo-date {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .memo-content-box {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #d1d5db;
            white-space: pre-wrap;
            min-height: 24px;
        }

        .memo-placeholder {
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.85rem;
        }

        .memo-textarea {
            width: 100%;
            min-height: 150px;
            background: #090d16;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: var(--text-primary);
            padding: 0.8rem 1rem;
            font-family: inherit;
            font-size: 0.92rem;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .memo-textarea:focus {
            border-color: var(--accent-violet);
            box-shadow: 0 0 8px rgba(139, 92, 246, 0.2);
        }

        .memo-btn-group {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
        }

        .memo-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.3rem 0.7rem;
            border-radius: 4px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .memo-btn:hover {
            color: #ffffff;
            border-color: var(--text-muted);
        }

        .memo-btn.save {
            background: var(--accent-gradient);
            border: none;
            color: #ffffff;
        }

        .memo-btn.save:hover {
            box-shadow: 0 2px 8px rgba(139, 92, 246, 0.3);
        }

        .memo-btn.delete {
            color: #f87171;
            border-color: rgba(248, 113, 113, 0.2);
        }

        .memo-btn.delete:hover {
            background: rgba(248, 113, 113, 0.05);
            border-color: #f87171;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>보안 기출 정밀 분석 대시보드</h1>
        <p class="subtitle">12개년 기출 전수 조사 기반 3회 이상 빈출 세부 토픽 분석 엔진</p>
        <div class="meta-badges">
            <span class="badge">기출 범위: 2015년 ~ 2026년</span>
            <span class="badge accent">총 분석 데이터: 240 문항</span>
            <span class="badge">검출된 빈출 세부 토픽: <span id="topic-count-badge">0</span>개</span>
            <span id="storage-badge" class="badge" style="cursor: help;">저장소 로딩 중...</span>
        </div>
    </header>

    <div id="migration-banner" style="display: none; background: rgba(139, 92, 246, 0.12); border: 1px solid rgba(139, 92, 246, 0.3); padding: 1.2rem; border-radius: 10px; margin-bottom: 2rem; text-align: center; backdrop-filter: blur(10px); box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
        <div style="font-size: 0.95rem; font-weight: 600; color: #ffffff; margin-bottom: 0.5rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
            <span>💡 이전 브라우저(LocalStorage)에 작성된 공부 코멘트 <span id="migration-count" style="color: #c084fc; font-weight: 700;">0</span>개가 발견되었습니다.</span>
        </div>
        <div style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.8rem;">
            이 코멘트들을 서버 파일 저장소(`data/sc_memos.json`)로 안전하게 가져와서 영구 보존할 수 있습니다.
        </div>
        <button onclick="migrateMemos()" style="background: var(--accent-gradient); border: none; color: #ffffff; padding: 0.4rem 1.2rem; border-radius: 6px; font-size: 0.82rem; font-weight: 700; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 8px rgba(139, 92, 246, 0.3);">
            파일 서버로 코멘트 동기화하기
        </button>
    </div>

    <div class="filter-section">
        <button class="filter-btn active" onclick="filterCategory('전체')">전체</button>
        <button class="filter-btn" onclick="filterCategory('공통 보안 기술')">공통 보안 기술</button>
        <button class="filter-btn" onclick="filterCategory('네트워크 및 시스템 보안')">네트워크 및 시스템 보안</button>
        <button class="filter-btn" onclick="filterCategory('응용 및 신기술 보안')">응용 및 신기술 보안</button>
        <button class="filter-btn" onclick="filterCategory('개발 및 운영 보안')">개발 및 운영 보안</button>
        <button class="filter-btn" onclick="filterCategory('정보보호 법규 및 개인정보보호')">정보보호 법규 및 개인정보보호</button>
    </div>

    <div class="accordion-list" id="accordion-container">
        <!-- Javascript will inject accordion elements here -->
    </div>
</div>

<script>
    const examDatabase = {
  "2015_101": "101. 개인정보보호법상 암호화하여야 하는 개인정보\n대상이 아닌 것은?\n① 비밀번호 ② 고유식별번호\n③ 바이오정보 ④ 신용카드정보",
  "2015_102": "102. S/MIME(Secure/Multipurpose Internet Mail Ext-\nension)에 대한 설명 중 틀린 것은?\n① 네트워크계층에서의 보안을 제공한다.\n② 평문메시지에 공개키 암호방식을 적용하여 보안성을\n제공한다.\n③ 이진값으로 암호화된 본문이나 서명 부분은 모두\nMIME으로 변환되어 전송한다.\n④ 세션키를 분배하기 위하여 Diffie-Hellman 방식과\nRSA 공개키 방식을 사용한다.",
  "2015_103": "103. SSL(Secure Socket Layer)에 관한 설명 중 틀린\n것은?\n① SSL 레코드 프로토콜은 기밀성과 메시지 무결성,\n부인 방지 서비스를 제공한다.\n② SSL 레코드 프로토콜은 단편화, 압축, 메시지\n인증 코드 계산, 암호화의 순서로 수행된다.\n③ SSL은 TCP를 이용하여 신뢰할 수 있는 종단-대-\n종단 보안 서비스를 제공하기 위해 설계되었다.\n④ 경고(Alert) 프로토콜은 SSL 관련 경고를 전달\n하기 위해 사용된다.",
  "2015_104": "104. 국내 정보보호관리체계(ISMS) 인증기준 중 정보\n보호 대책에 해당되지 않는 것은?\n① 정보보호 조직\n② 정보보호 교육\n③ 침해사고 관리\n④ 법적 요구사항 준수 검토\n- 24",
  "2015_105": "105. 정보보호관리체계에 대한 설명 중 가장 거리가\n먼 것은?\n① 취약성은 자산의 잠재적 속성으로서 위협의 이용\n대상으로 정의된다.\n② 관리체계 인증기준과 기업 내 현재의 보호대책\n적용 현황과의 수준 차이를 파악하기 위해 위협\n분석을 수행한다.\n③ 정보보호관리체계 구축을 위한 수행조직은 프로\n젝트팀으로 구성될 수 있으며 우선적으로 관리\n체계 도입 배경과 경영진을 이해시키고 설득할\n수 있는 자료 등을 준비한다.\n④ 정보보호대책이란 위험에 대응하여 자산을 보호하기\n위한 관리적, 물리적, 기술적 대책으로 정의된다.",
  "2015_106": "106. 개인정보처리자가 개인정보의 수집 시 정보주체의\n동의를 받지 않아도 되는 경우로 가장 적절한\n것은?\n① 개인정보취급 방침에 명시한 경우\n② 경제적, 기술적인 사유로 통상적인 동의를 받는\n것이 뚜렷하게 곤란한 경우\n③ 법률에 특별한 규정이 있거나 법령상 의무를\n준수하기 위하여 불가피한 경우\n④ 요금 부과를 위해 필요한 경우",
  "2015_107": "107. 해시 함수(hash function)의 특성에 대한 설명\n으로 틀린 것은?\n① 임의의 크기를 갖는 메시지에 고정된 길이의 해시\n값을 생성한다.\n② 해시 값을 계산하기 쉽다.\n③ 해시 값에 대한 해시 함수의 입력 메시지를 찾는\n것이 불가능하다는 것은 해시 함수의 충돌방지\n특성이다.\n④ 해시 알고리즘으로 MD5, SHA-1, SHA-2가 있다.\n4 -\n\n=== NEW PAGE ===",
  "2015_108": "108. 포렌식을 통해 획득한 증거는 법적인 효력을\n가져야할 필요가 있다. 포렌식의 기본원칙에\n대한 설명 중 가장 거리가 먼 것은?\n① 재현의 원칙 : 증거를 복구하는 과정에서 똑같은\n환경에서 같은 결과가 나오도록 재현할 수 있어야 함.\n② 신속성의 원칙 : 시스템 안의 디스크 또는 메모리\n정보가 휘발되기 전에 빠르게 획득하여야 함.\n③ 정당성의 원칙 : 모든 증거는 적법한 절차를\n거쳐서 획득하여야 함.\n④ 무결성의 원칙 : 증거의 이송/분석/보관/법정 제출\n이라는 일련의 과정에 대한 추적이 가능해야 함.",
  "2015_109": "109. “소프트웨어 개발 보안 가이드(2013.11)”에서\n제시한 안전한 코딩 기법 중, 프로그램 입력값에\n대한 검증 누락 또는 부적절한 검증, 데이터의\n잘못된 형식지정으로 인해 발생할 수 있는 공격을\n예방하기 위한 기법과 가장 거리가 먼 것은?\n① 외부의 입력을 자원(파일, 소켓 등) 식별자로\n사용하는 경우, 적절한 검증을 거치도록 한다.\n② 쿠키의 만료시간은 세션이 지속되는 시간과 관련\n하여 최소한으로 설정하고 영속적인 쿠키에는 사용자\n권한 등급, 세션 ID가 포함되지 않도록 한다.\n③ HTML 태그를 허용하는 게시판에서는 지원가능한\n태그리스트를 선정한 후 해당 태그만 허용한다.\n④ 사용자 입력값을 자동 연결할 사이트 주소로 사용\n하는 경우에는 입력된 값이 화이트 리스트에\n존재하는지 확인하도록 한다.",
  "2015_110": "110. 위험분석 방법 중 정성적 분석방법이 아닌 것은?\n① 델파이법 ② 시나리오법\n③ 확률분포법 ④ 순위결정법\n- 25",
  "2015_111": "111. 스마트폰 애플리케이션과 관련하여 악성 애플리\n케이션이 유통되지 않도록 마켓에서 판매되는\n애플리케이션에 대한 보안성 검증을 강화하면서\n애플리케이션 개발자의 신원 확인/인증을 강화\n하기 위해 사용된 기술은?\n① repackaging\n② decompile\n③ code signing\n④ mobile trusted module",
  "2015_112": "112. 다음은 C 프로그램의 일부분이다. 진하게 표시\n된 부분에는 어떤 보안 약점이 존재하는가?\nint main()\n{\nchar* rPort = getenv(“rPort”);\nstruct sockaddr_in serv_addr;\nint sockfd = 0;\n...\nserv_addr.sin_port = htons(atoi(rPort));\nif (connect(sockfd, &serv_addr, sizeof(serv_addr)) < 0) {\nexit(1);\n}\nreturn 0;\n}\n① 부적절한 인가\n② 포맷 스트링 삽입\n③ 경로 조작 및 자원 삽입\n④ 시스템 데이터 정보 노출",
  "2015_113": "113. 모바일 단말기를 통해 외부에서 업무를 처리하\n는 모바일 오피스 환경에서 BYOD(Bring Your Own\nDevice) 서비스 제공을 위한 보안 강화 기술과\n가장 관련된 것은? (2개 선택)\n① NAC(Network Access Control)\n② proof carrying code\n③ MDM(Mobile Device Management)\n④ SecureMSM(Mobile Station Modem)\n5 -\n\n=== NEW PAGE ===",
  "2015_114": "114. 스마트카드를 이용하여 동적 데이터 인증 과정을\n수행하기 위해 스마트카드 단말기에 배포되어야\n하는 것은?\n① 인증기관(CA)의 공개키\n② 스마트카드의 개인키\n③ 응용 프로그램 데이터와 스마트카드 공개키에\n대해 발행자의 개인키를 이용하여 서명한 값\n④ 발행자의 공개키에 대해 인증기관(CA)의 개인키를\n이용하여 서명한 값",
  "2015_115": "115. 위장 공격(masquerade attack)을 통해 발생 가능한\n인증(authentication) 보안 위협을 방지하기 위한\n암호 기술과 가장 거리가 먼 것은?\n① 공개키 암호 ② 일방향 해시 함수\n③ 메시지 인증 코드 ④ 디지털 서명",
  "2015_116": "116. 다음 보기의 설명을 통해 기업에서 설치해야하는\n정보보호 시스템을 올바르게 짝지은 것은?\nIP주소 및 port 번호를 기반으로 외부에서 유입\n되는 트래픽을 사전에 차단하기를 원하며, 기업\n외부에서 내부망으로 접근하여 업무를 수행할\n경우 암호통신을 통한 통신내용 보호를 원한다.\n① 침입차단시스템 - VPN\n② 웹방화벽 - 침입탐지시스템\n③ 침입차단시스템 - 안티바이러스\n④ 안티바이러스 - VPN",
  "2015_117": "117. 패킷의 헤더 뿐만 아니라 메시지 수준에서 모니\n터링 및 차단이 가능하도록 하기를 원할 때\n활용할 수 있는 침입차단시스템 유형으로 가장\n적절한 것은?\n① 어플리케이션 프록시\n② 패킷 필터링 라우터\n③ 상태검사 패킷필터\n④ 회로레벨 게이트웨이\n- 26",
  "2015_118": "118. 개인정보보호인증(PIPL) 기준 중 인증 신청 기관이\n중소기업인 경우, 필수 적용되는 기준과 가장\n거리가 먼 것은?\n① 개인정보보호 관리계획 수립을 통해 명확한 방침\n및 방향 제시를 보증하여야 하며, 이에 대해 개인\n정보보호 책임자의 검토와 승인을 거쳐야 한다.\n② 개인정보보호 활동을 수행하고 관리하는 구성원들에\n대한 책임, 역할 및 권한을 정의하여야 한다.\n③ 개인정보처리자는 개인정보를 취급하는 업무(서비스)에\n대하여 적합한 위험관리 계획을 수립하고, 위험관리\n계획에 따라 보호대책을 수립하여야 한다.\n④ 식별된 개인정보 자산에 영향을 줄 수 있는 모든\n위협과 취약성, 위험을 개인정보의 흐름에 따라\n식별하고 분류하여야 하며, 이 개인정보 자산의\n가치와 위험을 고려하여 잠재적 손실에 대한\n영향을 식별·분석하여야 한다.",
  "2015_119": "119. 최근 최고경영층의 정보보호에 대한 역할과\n책임을 강조하는 정보보호 거버넌스의 중요성이\n인식되고 있다. 관련 국제표준인 ISO/IEC 27014\n에서 명시하고 있는 정보보호 거버넌스의 원칙과\n가장 거리가 먼 것은?\n① 현업부서를 포함하는 전사적 보안 구현\n② 효율적 보안운영을 위한 계획 수립\n③ 긍정적 보안문화 형성\n④ 정보보호 투자에 대한 방향 설정",
  "2015_120": "120. 2013년에 개정된 국제표준 ISO/IEC 27001에서\nISMS 구현을 위해 요구하는 일곱 가지 사항과\n가장 거리가 먼 것은?\n① 조직의 보안환경 분석\n② 최고경영층의 리더십\n③ 컴플라이언스 관리\n④ 위험관리\n6 -",
  "2016_101": "101)h로\n가정하고 고장 발생 시각의 단위는 시[hour]임)\n고장 발생 시각 수리 시간\na 23h a′- a 0.7h\nb 45h b′- b 1.5h\nc 75h c′- c 0.8h\nd 100h d′- d 1.0h\n① 약 90% ② 약 93% ③ 약 96% ④ 약 99%\n9 -\n\n=== NEW PAGE ===\n\n42. ISO/IEC 25010에서는 ISO/IEC 9126-2의 표준 문서\n에서 제시한 소프트웨어 품질 평가의 6가지 품질\n특성에 2가지의 품질 특성을 추가하여 8개의\n소프트웨어 품질 특성에 대해 평가방안을 제시하고\n있다. ISO/IEC 25010에 추가된 2가지의 소프트웨어\n품질 특성으로 가장 적절한 것은?\n① 상호운용성과 이식성 ② 상호운용성과 보안성\n③ 유지보수성과 이식성 ④ 유지보수성과 보안성\n43. 다음은 사용자 인터뷰 일부를 발췌한 것이다. 이와\n관련된 ISO 9126 품질 특성으로 가장 적절한 것은?\n요즘 컴퓨터가 재부팅하면 20초 내에 켜지는 것처럼\n만약 시스템이 멈추게 되어도 20초 내에 정상작동이\n되도록 해주세요. 그리고 절대 저 이외에는 다른\n사람들이 이 시스템을 껐다 켜지 못하게 해야 합니다.\n아무나 껐다 켤 수 있다면 정말 큰일 나니까요.\n① 효율성, 신뢰성 ② 기능성, 신뢰성\n③ 기능성, 유지보수성 ④ 사용성, 이식성\n44. COCOMO II(COnstructive COst MOdel II) 비용 예측\n모델에 대한 설명으로 가장 적절하지 않은 것은?\n① COCOMO II는 재사용성 강화 및 컴포넌트를 이용한\n조립 개발 환경을 반영하여 COCOMO 비용 예측\n모델을 보완하였다.\n② COCOMO II는 3가지의 대표 모델, 즉 애플리케이션\n구성 모델, 초기 추정 모델, 후반 구조 모델을\n포함하고 있다.\n③ COCOMO II는 원시 코드의 라인 수를 정확히 예측\n하기 어렵다는 점을 고려하여 원시코드를 사용\n하지 않고, 단계별로 정의된 방법으로 값을\n계산하고 인건비를 예측하는 방식이다.\n④ COCOMO II에 적용되는 기본 공식은 E = b × Sc\n× m(X)이다. 단, 여기서 b × Sc는 기초 소요\n노력 예측값, m(X)는 비용 승수의 벡터를 의미한다.\n- 10\n45. 다음 표는 두 조직이 수행하고 있는 소프트웨어\n개발 프로젝트에 대한 요약이다. B 조직의 개발자\n1인당 평균 생산성은 A 조직의 개발자 1인당 평균\n생산성의 1.5배로 알려져 있다고 가정할 때,\n(가)와 (나)의 값으로 가장 적절한 것은?\n개발 조직 A\n개발 언어 C++\n언어별 평균 소스 라인수/FP 50 SLOC/FP (C++ 언어)\n추정된 소프트웨어의 라인수 150,000 SLOC\n투입되는 개발자 수 6명\n소프트웨어 개발 완료 소요시간 10개월\n개발자 1인당 월평균 생산성 (가)\n개발 조직 B\n개발 언어 C\n언어별 평균 소스 라인수/FP 130 SLOC/FP (C 언어)\n추정된 소프트웨어의 라인수 390,000 SLOC\n투입되는 개발자 수 5명\n소프트웨어 개발 완료 소요시간 (나)\n개발자 1인당 월평균 생산성 1.5 * (가)\n① (가) 40 FP/month, (나) 15개월\n② (가) 50 FP/month, (나) 12개월\n③ (가) 40 FP/month, (나) 10개월\n④ (가) 50 FP/month, (나) 8개월\n46. 다음 중 COCOMO II 모델에서 기능 점수 1 FP에 대한\nSLOC가 큰 것에서 작은 언어 순으로 나타낸 것은?\n① Assembly > Unix Shell Scripts > C > Java > Powerbuilder\n② Assembly > C > Unix Shell Scripts > Java > Powerbuilder\n③ Assembly > C > Unix Shell Scripts > Powerbuilder > Java\n④ Assembly > C > Powerbuilder > Unix Shell Scripts > Java\n0 -\n\n=== NEW PAGE ===\n\n47. 다음 중에서 서비스 지향 아키텍처(SOA)와 관련된\n표준에 대한 설명으로 가장 거리가 먼 것은?\n① 속성-값의 쌍으로 이루어진 데이터 객체를 전달하기\n위한 경량의 데이터 교환 표준\n② 다양한 서비스를 포함하는 프로세스 프로그램을 정의\n하는 데 이용되는 워크플로 언어를 위한 표준\n③ 서비스의 존재를 찾기 위해 이용될 수 있는 서비스\n명세의 컴포넌트에 대한 정의\n④ 서비스의 인터페이스와 바인딩에 대한 표준\n48. 다음과 같은 특징을 갖는 미들웨어 아키텍처로 가장\n적절한 것은?\n- 대규모 엔터프라이즈 시스템을 구축할 때 중요한\n기술이며, 서로 다른 독립적인 애플리케이션을 하\n나의 통합된 시스템으로 묶기 위한 접착제 같은 역\n할을 한다.\n- 여러 가지 애플리케이션을 다양한 기술과 다양한\n플랫폼을 이용하여 구축할 수 있으나 이 미들웨어를\n사용하면 사용자는 현재의 애플리케이션을 엔터프\n라이즈급의 애플리케이션에 추가하기 위하여 다시\n구축하거나 근본적인 변경을 가할 필요가 없다.\n- 기본적으로 느슨한 결합의 비동기 기술이며, 동기화\n미들웨어 기술과는 다르게 CORBA에서 볼 수 있는\n것처럼 수신측과 송신측이 강하게 결합되어 있지\n않다.\n① RPC(Remote Procedure Call) Middleware\n② MOM(Message Oriented Middleware)\n③ ORB(Object Request Broker) Middleware\n④ WAS(Web Application Server) Middleware\n49. 다음은 서비스 지향 아키텍처(SOA)에서 비즈니스 서비스의\n통합을 위해 사용되는 개념에 대한 설명이다. 설명에\n해당하는 개념으로 가장 적절한 것은?\n- 비즈니스 협업 관점에서 비즈니스 서비스 통합\n- 여러 참여자가 거래 파트너끼리 메시지 교환\n- 비즈니스 프로세스 안에서 다수의 참여자가 peer-to-peer\n방식으로 협업\n- 기업 사이의 프로세스 통합에 많이 사용됨\n- 11\n① Service Orchestration\n② Service Choreography\n③ Enterprise Service Bus\n④ Enterprise Application Integration\n50. 다음 그림은 XP(eXtreme Programming) 개발 프로세스를\n나타낸 것이다. (가), (나), (다)에 해당하는 과정으로\n가장 적절한 것은? (단, 그림에서 OOOO로 표시된 부분은\n내용을 가리기 위해 의도적으로 사용하였음)\n① (가) 사용자 스토리, (나) 인수 테스트, (다) 작은\n릴리즈\n② (가) 프로젝트 계획, (나) 인수 테스트, (다) 새로운\n애플리케이션\n③ (가) 유스케이스, (나) 통합 테스트, (다) 컴포\n넌트 조립\n④ (가) 사용자 스토리, (나) 통합 테스트, (다) 새로운\n애플리케이션\n1 -\n\n=== NEW PAGE ===\n\n데이터베이스\n51. 현재 가장 널리 사용되는 빅데이터의 속성을 3V라고\n정의할 때, 3V의 세 가지 속성이 바르게 짝지어진\n것은?\n① 규모(Volume), 다양성(Variety), 속도(Velocity)\n② 규모(Volume), 다변성(Verbosity), 가시성(Visibility)\n③ 가시성(Visibility), 다변성(Verbosity), 변동성(Var-\niability)\n④ 변동성(Variability), 다양성(Variety), 속도\n(Velocity)\n52. 다음과 같은 상품 구매 트랜잭션에 대해 연관규칙\n탐사를 수행했다고 하자. 이 때 계산된 지지도(support)\n와 신뢰도(confidence)로 옳지 않은 것은?\nT1 = {milk, coke, beer}\nT2 = {milk, pepsi, juice}\nT3 = {milk, beer}\nT4 = {coke, juice}\nT5 = {milk, pepsi, beer}\n① 항목집합 {beer, milk}의 지지도는 3/5이다.\n② {milk} → beer의 지지도는 4/5이다.\n③ {milk} → beer의 신뢰도는 3/4이다.\n④ {juice} → milk의 신뢰도는 1/2이다.\n53. 데이터 객체에 대한 제어 기법 중 필수 접근 제어\n(mandatory access control)에 대한 설명으로\n옳지 않은 것은?\n① 데이터 객체에 대해서는 일정한 비밀 등급이, 사\n용자에 대해서는 일정한 허가 등급이 지정된다.\n② 사용자의 허가 등급이 데이터의 비밀 등급보다\n크거나 같은 경우에 판독이 가능하다.\n③ 사용자의 허가 등급이 데이터의 비밀 등급보다\n커야 갱신이 가능하다.\n④ 보안 등급은 극비(top secret) > 비밀(secret) >\n대외비(confidential) > 일반(unclassified)의\n순서이다.\n- 12\n54. 2단계 로킹 규약(2 phase locking protocol)의\n로크 전환(혹은 로크 변환)에 대한 다음 설명\n중 옳은 것은?\n① 항목 X에 read_lock(X)를 수행하여 공유 로크를\n획득한 후 나중에 write_lock(X)를 수행하여 배\n타적 로크로 로크를 상승(upgrade)시킬 수 있다.\n② 항목 X에 write_lock(X)를 수행하여 배타적\n로크를 획득한 후 나중에 read_lock(X)를 수행\n하여 공유 로크로 로크를 상승시킬 수 있다.\n③ 항목 X에 read_lock(X)를 수행하여 공유 로크를\n획득한 후 나중에 write_lock(X)를 수행하여 배타적\n로크로 로크를 하강(downgrade)시킬 수 있다.\n④ 항목 X에 read_lock(X)를 수행하여 배타적 로크를\n획득한 후 나중에 write_lock(X)를 수행하여 공유\n로크로 로크를 하강시킬 수 있다.\n55. 다음 스케줄에 대해 타임스탬프 순서 기법을 적용\n하였을때 설명이 올바른 것은? (TS(Ti)는 트랜잭션\nTi의 타임스탬프이고, read_TS(x)는 read(x) 연산을\n성공적으로 수행한 트랜잭션들의 타임스탬프 중 가장\n큰 것이고, write_TS(x)는 write(x) 연산을 성공적\n으로 수행한 트랜잭션들의 타임스탬프 중 가장 큰\n것이다. read_TS(x)와 write_TS(x)의 초기값은 모두\n1이라고 가정한다.)\n2시: T1 read(x)\n3시: T2 write(x)\n4시: T1 write(x)\n① T1은 read(x)를 실행하고 read_TS(x)를 그대로\n둔다.\n② T2의 write(x)는 TS(T2) ≥ write_TS(x)이므로\n거부된다.\n③ 타임스탬프 순서 기법을 적용하면, 위에 주어진\n스케줄은 직렬 가능하다.\n④ 토마스(Thomas)의 기록 규칙을 적용하면, T1의\nwrite(x)는 무시된다.\n2 -\n\n=== NEW PAGE ===\n\n56. 다음은 두 릴레이션 R, S에 대해 어떤 관계 대수\n연산을 적용한 결과 릴레이션을 보이고 있다. R\n과 S에 대해 적용된 관계 대수 연산은?\nR S\nA B B C\na 1 1 x\nb 2 2 y\nc 1 3 z\n결과 테이블\nA B B C\na 1 2 y\na 1 3 z\nb 2 3 z\nc 1 2 y\nc 1 3 z\n① R⋈S\nN\n② R⋈ S\nB=B\n③ R⋈ S\nB<B\n④ R×S\n57. 릴레이션 E, W가 아래와 같을 때, 완전외부조인\n(full outer join) E W의 실행결과 중 옳은\n것은?\nE\nMember City Country\nKim Seoul Korea\nSusan London England\nSmith Austin USA\nNakamura Tokyo Japan\nW\nMember Gender Age\nKim Female 39\nSusan Female 32\nGates Male 53\nNakamura Male 39\n①\nMember City Country Gender Age\nKim Seoul Korea Female 39\nSusan London England Female 32\nNakamura Tokyo Japan Male 39\n- 13\n②\nMember City Country Gender Age\nKim Seoul Korea Female 39\nSusan London England Female 32\nNakamura Tokyo Japan Male 39\nSmith Austin USA null null\n③\nMember City Country Gender Age\nKim Seoul Korea Female 39\nSusan London England Female 32\nNakamura Tokyo Japan Male 39\nGates null null Male 53\n④\nMember City Country Gender Age\nKim Seoul Korea Female 39\nSusan London England Female 32\nNakamura Tokyo Japan Male 39\nSmith Austin USA null null\nGates null null Male 53\n58. 내장 SQL(Embedded SQL)은 C, Java, JSP 등 프로\n그래밍 언어(호스트 언어)에 SQL을 직접 끼워넣어\n사용하며 SQL 전처리 컴파일러(precompiler)가\n번역을 한다. 내장 SQL에 대한 다음 설명 중\n옳지 않은 것은?\n① SQL 문 결과를 행단위로 처리하기 위하여 호스트\n언어에 추가적인 명령문이 사용된다.\n② SQL 문에서는 호스트 언어에 의하여 선언된 변수를\n참조할 수 없다.\n③ 호스트 언어에 의하여 선언된 변수를 이용하여\nSQL 문의 실행 결과를 저장할 수 있다.\n④ 데이터베이스에 NULL 값을 삽입할 수 있으며,\nNULL 값을 읽어낼 수 있다.\n3 -\n\n=== NEW PAGE ===\n\n59. 릴레이션 STUDENT가 다음과 같을 때, 관계 대수\n 와 동일한 결과를 얻는 SQL\n\n문장을 바르게 나타낸 것은?\nSTUDENT\nFname Lname StudID Sex GPA DeptNo\nChulsoo Kim 20160395 M A 5\nGilok Hong 20152932 F B 4\nYoosin Kim 20160244 M C 5\nSoonhee Lee 20140294 F A 5\nChansoo Shim 20151285 M A 5\nSoonsin Lee 20140893 M B 4\nDasol Park 20150203 F B 4\nKyunghee Jung 20162011 F A 5\n① SELECT ALL Sex, GPA FROM STUDENT;\n② ALL SELECT Sex, GPA FROM STUDENT;\n③ DISTINCT SELECT Sex, GPA FROM STUDENT;\n④ SELECT DISTINCT Sex, GPA FROM STUDENT;\n※ 다음 릴레이션을 읽고 60번~61번에 대하여 답하시오.\n직원 정보를 저장하는 릴레이션 EMPLOYEE\nCREATE TABLE EMPLOYEE\n(NAMEVARCHAR(30) NOT NULL,\nSSN CHAR(9) NOT NULL,\nADDRVARCHAR(30),\nPHONE CHAR(10),\nPRIMARY KEY (SSN));\n부양가족 정보를 저장하는 릴레이션 DEPENDENT\nCREATE TABLE DEPENDENT\n(ESSN CHAR(9) NOT NULL,\nDEPNAMEVARCHAR(30)NOT NULL,\nAGE INT,\nPRIMARY KEY (ESSN, DEPNAME),\nFOREIGN KEY (ESSN) REFERENCES EMPLOYEE (SSN));\n60. “부양가족이 없는 직원의 이름을 검색하라”라는 SQL\n질의를 다음과 같이 작성했다고 할 때, ㉮, ㉯, ㉰에\n들어갈 내용으로 바르게 구성된 것은?\nSELECT NAME\nFROM EMPLOYEE\nWHERE ㉮ (SELECT ㉯ FROM DEPENDENT WHERE ㉰) ;\n- 14\n번호 ㉮ ㉯ ㉰\n① NOT IN * NAME=DEPNAME\n② NOT EXISTS * SSN=ESSN\n③ NOT IN ESSN SSN=ESSN\n④ NOT EXISTS ESSN NAME=DEPNAME\n61. 두 릴레이션 EMPLOYEE, DEPENDENT로부터 다음과\n같이 EMPDEPEND라는 뷰(view)를 생성하고자 할\n때, ㉱와 ㉲에 들어갈 내용이 바르게 짝지어진\n것은? (단, EMPDEPEND에서 EMPSSN과 EMPNAME은\n직원의 SSN과 이름을 각각 나타내고, NO_DEPS와\nM_AGE는 해당 직원의 부양가족 수와 부양가족의\n나이 평균을 각각 나타낸다.)\nEMPDEPEND\nEMPSSN EMPNAME NO_DEPS M_AGE\nCREATE VIEW EMPDEPEND(EMPSSN, EMPNAME, NO_DEPS,\nM_AGE) AS\nSELECT SSN, NAME, ㉱, ㉲\nFROM EMPLOYEE, DEPENDENT\nWHERE SSN=ESSN\nGROUP BY SSN;\n㉱ ㉲\n① UNIQUE(*) MEDIAN(AGE)\n② COUNT(*) MEDIAN(AGE)\n③ COUNT(*) AVG(AGE)\n④ UNIQUE(*) AVG(AGE)\n4 -\n\n=== NEW PAGE ===\n\n62. SQL 문으로 테이블 DEPT와 EMP를 생성하고 뷰\nEMPDEPT를 생성하였다. 뷰 생성과 투플 삽입 후\n아래 문장을 실행했을 때 오류가 발생하지 않는 것은?\n(SQL 문)\nCREATE TABLE DEPT(\nDEPTNO INTEGER PRIMARY KEY,\nDNAME VARCHAR(14) NOT NULL,\nLOC VARCHAR(13)\n);\nINSERT INTO DEPT VALUES(10, 'sales', 'seoul');\nCREATE TABLE EMP (\nEMPNO INTEGER PRIMARY KEY,\nENAME VARCHAR(10),\nJOB VARCHAR(9),\nDEPTNO INTEGER REFERENCES DEPT(DEPTNO)\n);\nINSERT INTO EMP VALUES(1, 'park', 'managing', 10);\nCREATE VIEW EMPDEPT AS\nSELECT ENAME, DNAME, JOB, DEPT.DEPTNO\nFROM EMP, DEPT\nWHERE EMP.DEPTNO=DEPT.DEPTNO;\n① INSERT INTO EMPDEPT VALUES ('kim', 'sales',\n'managing', 10);\n② CREATE VIEW EMPDNAME AS SELECT ENAME, DNAME\nFROM EMPDEPT;\n③ CREATE INDEX E_01 ON EMPDEPT(ENAME);\n④ UPDATE EMPDEPT SET DEPTNO=20 WHERE JOB LIKE\n'managing';\n63. 권한(authorization)을 부여하는 ㉮와 회수하는\n㉯를 SQL로 바르게 표현한 것은?\n㉮ 테이블 EMPLOYEE에 대한 SELECT 권한을 계정\nMary와 John에게 부여한다.\n㉯ 테이블 EMPLOYEE에 대한 SELECT 권한을 계정\nJohn으로부터 회수한다.\n- 15\n① ㉮ = GRANT SELECT ON EMPLOYEE TO Mary, John;\n㉯ = REVOKE SELECT ON EMPLOYEE FROM John;\n② ㉮ = AUTHORIZE SELECT ON EMPLOYEE TO Mary, John;\n㉯ = CANCEL SELECT ON EMPLOYEE FROM John;\n③ ㉮ = GRANT EMPLOYEE TO Mary, John ON SELECT;\n㉯ = REVOKE EMPLOYEE FROM John ON SELECT;\n④ ㉮ = AUTHORIZE EMPLOYEE TO Mary, John ON SELECT;\n㉯ = CANCEL EMPLOYEE FROM John ON SELECT;\n64. 데이터베이스 시스템의 데이터 독립성에 대한 설명\n중 옳지 않은 것은?\n① ANSI 3단계 스키마 아키텍쳐는 내부단계(내부스\n키마), 개념단계(개념스키마), 외부단계(외부스\n키마)로 나눈다. 3단계 스키마의 목적은 물리적\n데이터베이스로부터 사용자의 응용을 분리시키는\n것이다.\n② 외부스키마는 데이터베이스의 물리적 저장구조를,\n개념스키마는 특정 사용자 그룹이 관심을 갖는\n데이터베이스 부분을, 내부스키마는 모든 사용\n자를 위한 전체 데이터베이스 구조를 기술한다.\n③ 물리적 데이터 독립성은 개념스키마를 변경하지\n않으면서 내부스키마를 변경할 수 있음을 말한다.\n내부스키마의 접근 구조 변경이나, 파일 재구성이\n개념스키마에 가능한 한 영향을 주지 않도록 한다.\n④ 논리적 데이터 독립성은 외부스키마를 변경하지\n않으면서 개념스키마를 변경하는 것을 말한다.\n개념스키마의 데이터베이스 확장, 제약조건 갱신\n등 변경이 외부스키마에 가능한 한 영향을 주지\n않도록 한다.\n5 -\n\n=== NEW PAGE ===\n\n65. 데이터 품질에 관한 다음 설명 중 옳지 않은 것은?\n① 데이터 품질은 조직의 목적 달성을 위하여 관리\n되는 데이터가 이용자의 만족을 충족시킬 수 있\n는 수준을 말한다.\n② 데이터 품질 관리는 조직이 운영하는 정보시스\n템을 활용하는 이용자의 기대를 만족시키기 위\n하여 수행하는 데이터 관리 활동이다.\n③ 데이터 품질 진단의 종류 중 데이터 구조 진단은\n데이터 관리 프로세스를 분석하여 문제점을 도\n출하고, 이를 개선할 수 있는 핵심 업무 프로\n세스를 최적화한다.\n④ 데이터 품질 진단을 위한 데이터 프로파일링은\n데이터의 중요 정보와 통계 값을 수집하는 정보\n분석 기법이다.\n66. 상품(상품번호, 상품명, 담당부서, 구매자) 릴레이션\n에서 상품번호와 상품명은 각각 후보키이고 구매자는\n하나의 부서(담당부서)에 속한다고 하자. 이 릴레\n이션의 정규형과 관련된 설명 중 옳은 것을 모두\n고르시오. (2개 선택)\n① 이 릴레이션이 속한 최고차 정규형은 1NF이다.\n② 이 릴레이션은 현재 담당부서→구매자의 함수\n종속이 성립한다.\n③ 이 릴레이션은 현재 상품명→(상품번호, 담당부서,\n구매자)의 함수 종속이 성립한다.\n④ R1(구매자, 담당부서), R2(상품번호, 상품명,\n구매자)로 분해하면 두 릴레이션은 BCNF에 속하게\n된다.\n67. 다음의 릴레이션과 함수 종속을 고려해 보자. 이\n릴레이션의 현재 속한 정규형과 BCNF로 분해 후\n릴레이션의 수를 올바르게 나타낸 것은?\nR(A,B,C,D,E)\n후보키: (A,C)\n함수종속: A→B, C→D, (A,C)→E\n① 1NF, 3\n② 2NF, 2\n③ 2NF, 3\n④ 3NF, 2\n- 16\n68. 뷰에 대한 갱신은 기본 릴레이션에 대한 갱신으로\n변환되는데, 이 때 대부분의 관계 DBMS에서 갱신이\n가능한 뷰로 가장 적절한 것은?\n① 기본키가 포함된 한 릴레이션 위에 정의된 뷰\n② 두 개 이상의 릴레이션 위에 조인으로 정의된 뷰\n③ 집단 함수가 포함된 뷰\n④ 기본 릴레이션의 애트리뷰트들 중에서 뷰에\n포함되지 않은 애트리뷰트에 대해 NOT NULL이\n지정되어 있을 때의 뷰\n69. 다음의 스케줄대로 트랜잭션을 실행했을 때 발생하는\n문제는? (트랜잭션 연산 앞의 표기는 시간을 시:\n분:초로 표시한 것임)\n00:00:00 T1 read(x)\n00:00:01 T1 x = x - N\n00:00:02 T1 write(x)\n00:00:03 T2 read(x)\n00:00:04 T2 x = x + M\n00:00:05 T2 write(x)\n00:00:06 T1 read(y)\n00:00:07 T1 fail\n① 갱신 손실(lost update) 문제\n② 부정확한 요약(incorrect summary) 문제\n③ 반복할 수 없는 읽기(unrepeatable read) 문제\n④ 오손 읽기(dirty read) 문제\n70. 공공데이터에 대한 다음 설명 중 가장 거리가 먼\n것은?\n① Open API를 활용하려면 정보제공자에게 활용신청\n을 해야하며, 승인을 받은 후 인증키를 받아 사\n용한다.\n② 공공데이터 또는 Open API로 제공되는 데이터는\n특별한 사유가 존재하지 않는 한 상업적으로\n이용이 가능하다.\n③ 공공데이터는 공공기관 등에서 데이터의 공개\n여부를 판단하여 제공하며, 미제공 데이터에\n대해 일반 사용자가 공개를 신청하는 것은 허용\n되지 않는다.\n④ 공공데이터 서비스 유형은 SOAP, REST, RSS, LINK\n등이 있다.\n6 -\n\n=== NEW PAGE ===\n\n71. 테이블 BOOK(bookid, bookname, price)에 대해 2\n개의 트랜잭션 T1과 T2가 동시에 실행된다고 하자.\n사용자가 입력한 명령을 시간별로 다음과 같이 실\n행했을 경우, ㉮와 ㉯에 출력되는 결과 값으로\n옳은 것은? (단, BOOK 테이블을 읽거나 쓰는 트랜\n잭션은 T1과 T2만 있으며, BOOK 테이블에 bookid\n가 1인 투플이 존재한다고 가정한다.)\n트랜잭션 T1 트랜잭션 T2\nBEGIN TRANSACTION\nSET TRANSACTION ISOLATION\nLEVEL READ COMMITTED;\nselect sum(price) as 총액\nfrom book;\n(결과 값) 10000\nBEGIN TRANSACTION\nSET TRANSACTION ISOLATION\nLEVEL REPEATABLE READ;\nselect sum(price) as 총액\nfrom book;\n(결과 값) 10000\nupdate book set\nprice=price+100\nwhere bookid=1;\n/* 여기서 대기상태 */\nselect sum(price) as 총액\nfrom book;\n(결과 값) ㉮\nCOMMIT;\nselect sum(price) as 총액\nfrom book;\n(결과 값) ㉯\nCOMMIT;\n㉮ ㉯\n① 10000 10000\n② 10000 10100\n③ 10100 10000\n④ 10100 10100\n72. 다음 표는 문서들에 대한 검색을 수행한 결과,\n검색된(retrieved) 문서와 적합한(relevant)\n문서의 수를 각각 나타낸다. 재현율(recall)과\n정확률(precision)을 각각 바르게 계산한 것은?\n- 17\n적합한(관련된) 문서 수\n(Number of relevant documents)\n구 분\nYes No\n검색된 문서 수 Yes 75 50\n(Number of\nretrieved\ndocuments) No 45 30\n재현율 정확률\n① 0.375 0.150\n② 0.375 0.400\n③ 0.525 0.475\n④ 0.625 0.600\n73. 다음 문장에서 빈칸 ㉮와 ㉯에 들어갈 용어로\n적절한 것은?\n예측 모델링(Predictive Modeling)은 목표 변수를\n설명 변수의 함수 모델로 생성하는 작업을 말한다.\n예측 모델링은 이산형 목표 변수에 사용되는 ( ㉮ )\n과(와) 연속형 목표 변수에 사용하는 ( ㉯ )의 두\n가지 유형이 있다.\n㉮ ㉯\n① 군집(clustering) 서술(descriptive)\n② 군집(clustering) 분류(classification)\n③ 분류(classification) 회귀(regression)\n④ 회귀(regression) 서술(descriptive)\n7 -\n\n=== NEW PAGE ===\n\n74. 다음은 회사 데이터베이스를 표현한 E-R 다이어\n그램의 일부를 보이고 있다. 속성 이름에 밑줄 친\n것은 키 속성을 의미한다. 이 E-R 다이어그램과\n관련된 설명으로 적절한 것을 모두 고르시오.\n(2개 선택) (단, 이 E-R 다이어그램은 DEPARTMENT와\nEMPLOYEE 릴레이션으로만 변환된다고 가정한다.)\n① 특정 부서에 배치되지 않은 직원이 존재\n할 수 있다.\n② 직원이 없는 부서가 존재할 수 있다.\n③ DEPARTMENT 개체를 릴레이션으로 변환하면\nDEPARTMENT(DNO, DName)이 된다.\n④ EMPLOYEE 개체를 릴레이션으로 변환하면 EMPLOYEE\n(ENO, Name)이 된다.\n75. 다음은 대학 데이터베이스의 일부를 E-R 다이어\n그램으로 표현한 것이다. 이 다이어그램에 대한\n설명으로 옳지 않은 것은? (단, 수퍼타입과 서브\n타입을 연결하는 중간 원안의 표시 ‘d’는 dis-\njoint를, PERSON 개체 쪽의 단일선은 partial을\n표현한다고 하자.)\n① 이 E-R 다이어그램은 세분화(specialization) 관계를\n표현한 것이다.\n② PERSON이 수퍼클래스에 해당하는 개체이다.\n③ FACULTY나 STUDENT가 아닌 PERSON 개체는 없다.\n④ FACULTY 개체이면서 동시에 STUDENT 개체일 수는\n없다.\n- 18\n8 -\n\n=== NEW PAGE ===\n\n시스템 구조\n76. 군집분석(Cluster Analytics)은 전체 데이터를\n군집을 통해 구분하는 것으로 다양한 특징을 가진\n관찰 대상으로부터 동일집단을 분류하는데 사용\n한다. 이러한 군집분석은 크게 계층적 군집분석과\n비계층적 군집분석으로 분류할 수 있다. 다음 중\n계층적 군집분석으로 가장 거리가 먼 것은?\n① Ward법\n② 단일연결방식(Single Linkage Method)\n③ 평균연결방식(Average Linkage Method)\n④ K-평균(Means)법\n77. 트랜잭션 성능을 예측하는 TPC(Transaction Proc-\nessing Performance Council) 벤치마크(Bechmark)인\nTPC-C 트랜잭션 유형이 아닌 것은?\n① 신규주문(new-order)\n② 주문상태(order-status)\n③ 매매결과(trade-result)\n④ 배송(delivery)\n78. 지역적으로 분산된 IT자원의 할당과 사용을 향상\n시키기 위한 클러스터 방식 중 고가용성(high-\navailability) 클러스터에 대한 설명으로 가장\n적절한 것은? (2개 선택)\n① IT자원의 중앙관리를 유지하면서 IT자원량을 증가\n시키기 위하여 작업부하를 분산시키는 방식이다.\n② 다중 노드의 실패 이벤트에 대해 시스템 가용성을\n유지하고 클러스터된 IT자원의 전부 혹은 일부를\n중복 구현한다.\n③ 클러스터 관리 플랫폼 내에 내장 혹은 분리된 IT\n자원을 설정하는 특정 메커니즘을 구현한다.\n④ 실패조건을 모니터링하고 실패된 노드로부터 작\n업부하를 자동으로 변경하는 대체 작동시스템\n메커니즘을 구현한다.\n- 19\n79. 메시지 큐(Message Queue)를 이용한 비동기 패턴에\n대한 설명으로 가장 적절한 것은?\n메시지 큐를 사용하는 패턴 중에서 가장 일반적인\n비동기 호출 패턴으로, 클라이언트가 호출한 후 큐\n에 메시지가 제대로 들어갔으면 메시지의 처리 결과\n에 관계없이 응답을 기다리지 않고 바로 반환한다.\n① Fire & Forget 패턴\n② Publish & Subscribe 패턴\n③ Routing 패턴\n④ Call Back 패턴\n80. 클라우드 가상자원 성능 측정 항목 및 지침(정보\n통신단체표준, TTAK.KO-10.0798)은 클라우드 가\n상자원의 성능 측정항목, 지표단위 및 측정방법을\n정의하고 있다. 다음 중 가상자원의 성능 측정\n지표의 측정방법에 대한 설명으로 가장 적절하지\n않은 것은?\n① CPU : CPU가 수행한 연산수를 측정하는 것으로\nTPS(Transaction Per Second)를 단위로 사용한다.\n② 웹 요청 처리율 : 웹 페이지 요청 후 응답 성공\n여부를 측정하는 것으로 %를 단위로 사용한다.\n③ TCP 대역폭 : 60초간 TCP 패킷 전송 평균 속도를\n측정하는 것으로 Kbps를 단위로 사용한다.\n④ DB 트랜잭션 시간 : DB 트랜잭션(개) 처리 속도를\n측정하는 것으로 Second를 단위로 사용한다.\n81. NFC(Near Field Communication)에 대한 설명으로\n적절하지 않은 것은?\n① 다양한 모바일 기기에 포함되어 10cm 이내의\n가까운 거리에서 비접촉 통신이 가능하다.\n② 13.56GHz 주파수 대역을 이용하는 RFID(Radio\nFrequency IDentification)의 일종으로 최대\n424Kbps의 속도로 통신이 가능하다.\n③ Card Emulation Mode, Peer-to-Peer Mode, Reader\n/Writer Mode 등 3가지 동작모드를 갖는다.\n④ 능동통신모드(Active Communication Mode)와 수동\n통신모드(Passive Communication Mode)를 지원\n한다.\n9 -\n\n=== NEW PAGE ===\n\n82. 동시사용자(Concurrent User)가 400명이고 평균\n응답시간(Average Response Time)이 2초이며,\n사용자요청간의 대기시간(Think Time)이 10초인\n시스템의 활성사용자(Active User)수는? (계산\n결과는 소수점이하 첫번째 자리에서 반올림)\n① 50\n② 67\n③ 80\n④ 95\n83. 자바 애플리케이션은 JVM(Java Virtual Machine)\n상에서 작동한다. JVM이 동작하는데 있어서 메모리\n구조와 GC(Garbage Collection : 쓰레기수집)는\n애플리케이션의 응답시간과 성능에 밀접한 관련을\n갖는다. JVM에서의 GC에 대한 설명으로 ( )안에\n가장 적절한 것은?\nJDK 1.4부터 지원하는 ( )는 Minor GC를\n동시에 다수의 스레드(thread)를 이용해서 GC를\n수행하는 방식으로 하나의 스레드를 이용하는\n것보다 훨씬 빨리 GC을 수행할 수 있다. ( )는\n크게 2가지 옵션을 가지고 있는데 Low-pause\n방식과 Throughput방식이 있다.\n① Default GC\n② Incremental GC\n③ Concurrent GC\n④ Parallel GC\n84. 공급사슬관리(SCM: Supply Chain Management)에\n대한 설명으로 가장 적절하지 않은 것은?\n① 공급사슬은 원재료를 획득하고, 이 원재료를\n중간재나 최종재로 변환하여, 최종제품을 고객\n에게 유통시키기 위한 조직 및 비즈니스 프로\n세스들의 네트워크이다.\n② 공급사슬은 제품 및 서비스가 근원지로부터 소비에\n이르는 단계에 공급될 수 있도록 공급업체, 제조\n업체, 유통업체, 고객들을 연결하는 것으로\n공급사슬상의 정보는 양방향으로 흐른다.\n- 20\n③ 공급사슬상의 제조업체를 중심으로 공급사슬의\n상류(Upstream)지역에는 최종 고객에게 제품을\n전달하는 조직과 프로세스들로 구성되며, 주문,\n반환요청, 지불 등의 정보가 유통된다.\n④ 공급사슬관리에서 나타나는 문제 중 하나는 채찍\n효과(bullwhip effect)로 이것은 제품에 대한\n수요정보가 공급사슬을 구성하고 있는 상류방향\n으로 거쳐 나갈 때마다 점점 왜곡되는 현상을\n말한다.\n85. SDN(Software Defined Networking) 기술을 주도\n하고 있는 그룹 중 하나인 ONF(Open Networking\nFoundation)에서는 SDN 아키텍처를 애플리케이션\n계층(Application Layer), 컨트롤 계층(Control\nLayer), 인프라스트럭처 계층(Infrastructure Layer)\n으로 구분했다. 이와 관련된 기술에 대한 설명으로\n가장 거리가 먼 것은?\n① SDN에서 컨트롤 계층은 소프트웨어 기반의 컨트\n롤러에 의해 동작한다.\n② ODL(OpenDaylight) 컨트롤러는 대표적인 SDN 컨\n트롤러 중 하나이다.\n③ 오픈플로우(OpenFlow)는 대표적인 노스바운드\n인터페이스 프로토콜 중 하나이다.\n④ 애플리케이션 계층과 컨트롤 계층 간의 통신을\n위해 노스바운드(NorthBound) 인터페이스를\n사용한다.\n86. 3GPP Release 10을 기반으로 완성된 WCDMA 계열의\n4세대 이동통신 규격인 LTE-A(Long Term Evolution\n-Advanced)에 대한 설명으로 가장 거리가 먼 것은?\n① 무선접속 기술로 다운링크는 OFDMA(Orthogonal\nFrequency Division Multiple Access)를, 업링크는\nSC(Single Carrier)-FDMA를 사용한다.\n② LTE-A의 핵심기술로는 CA, eICIC, MIMO(Multiple\n-Input Multiple-Output antenna), CoMP(Coord-\ninated Multi-Point) 등이 있다.\n③ eICIC(Enhanced Inter-Cell Interference Coord-\nination)는 펨토셀 간의 간섭현상을 완화시키기\n위한 기술이다.\n④ CA(Carrier Aggregation)는 서로 다른 주파수\n대역을 하나의 주파수 대역처럼 묶어 광대역\n효과를 만들어주는 기술이다.\n0 -\n\n=== NEW PAGE ===\n\n87. IPv6의 확장 헤더(extension header)에 대한\n설명으로 가장 거리가 먼 것은 ?\n① Destination 옵션은 발신지가 특정한 목적지에\n정보를 전달하고자 할 때 사용된다.\n② Timestamp 옵션은 왕복시간(round trip time)을\n측정하는데 사용할 수 있다.\n③ ESP(Encrypted Security Payload) 옵션은 도청에\n대한 방지책을 제공할 수 있다.\n④ Authentication 옵션은 송신자를 확인하고 데이\n터의 무결성을 증명하는데 사용된다.\n88. MPLS(Multi-Protocol Label Switching)에 대한\n설명으로 가장 거리가 먼 것은?\n① MPLS를 사용하여 VPN(Virtual Private Network)\n을 구성할 수 있다.\n② MPLS는 자체적인 암호화 기능을 제공한다.\n③ MPLS를 사용하여 TE(Traffic Engineering)이\n가능하다.\n④ 하나의 MPLS 패킷에 여러 개의 라벨(label)을\n사용할 수 있다.\n89. 라우팅 프로토콜이 최적 경로를 선택하는 기준을\n메트릭(metric)이라고 한다. 다음 중 라우팅 프로\n토콜과 그 프로토콜이 사용하는 메트릭 값이 가장\n적절하게 연결된 것은?\n① EIGRP: 정책(policy)만을 메트릭으로 이용\n② OSPF: 신뢰도(reliability)만을 메트릭으로 이용\n③ BGP: 지연(delay)만을 메트릭으로 이용\n④ RIP: 홉 수(hop count)만을 메트릭으로 이용\n90. 아날로그 정보를 디지털 신호로 바꿔주는 부호화\n방법으로 가장 적절한 것은?\n① PCM(Pulse Code Modulation)\n② FSK(Frequency Shift Keying)\n③ PM(Phase Modulation)\n④ NRZ(Non Return to Zero)\n- 21\n91. IEEE 802.11 무선랜(Wireless LAN)에 대한 설명\n으로 가장 거리가 먼 것은?\n① 포인트 조정함수(Point Coordination Function,\nPCF)는 매체 접근 방법으로 CSMA/CA(Carrier Sense\nMultiple Access/Collision Avoidance)를 사용한다.\n② 분산 조정함수(Distributed Coordination Function,\nDCF)는 중앙집중적이고 충돌 없는 폴링 접근\n방법이다.\n③ IEEE 802.11n에서는 다중입출력안테나(Multiple\n-Input Multiple-Output antenna, MIMO)기술\n을 사용해 잡음 문제를 해결하였다.\n④ 지국이 분산 조정함수(DCF)를 사용하고 AP(Access\nPoint)가 포인트 조정함수(PCF)를 사용하는 경우\n지국이 우선권을 갖는다.\n92. 블루투스(Bluetooth)는 짧은 거리에서 전화기,\n노트북, 카메라 등 서로 다른 기능을 가진 장치를\n연결하기 위해 설계된 무선 LAN 기술이다. 다음\n중 블루투스에 대한 설명으로 가장 거리가 먼\n것은?\n① 블루투스 네트워크의 하나인 피코넷(piconet)은\n하나의 주국(primary)과 최대 7개의 종국(secondary)을\n가질 수 있다.\n② ACL 링크에서 데이터를 교환하기 위해 L2CAP(Logical\nLink Control and Adaption Protocol)을 사용한다.\n③ ACL(Asynchronous Connectionless) 링크는 실시간\n오디오 전송과 같이 지연을 피하는 것이 무결성\n보다 중요할 때 사용한다.\n④ 간섭을 피하기 위해 물리층에서 FHSS(Frequency\n-Hopping Spread Spectrum) 방식을 사용한다.\n93. 객체 식별자(Object Identifier) 기반 사물인터넷\n디바이스 식별체계(TTAK.KO-06.0365/R1)는 객체\n식별자 기반 사물인터넷 디바이스 식별체계를 정의\n하고 있다. 다음 중 식별체계에 속하지 않는 것은?\n① 제조국가 식별 노드\n② 제조사 식별 노드\n③ 모델 식별 노드\n④ 일련번호 식별 노드\n1 -\n\n=== NEW PAGE ===\n\n94. 서버 가상화시 물리적 또는 논리적 파티셔닝(par-\ntitioning)을 사용하여 서버를 분할하는 방식이\n있다. 다음 중 파티셔닝 방식으로 가장 적절한\n것은 ?\n가. 물리 파티셔닝 방식은 하드웨어 자원에 장애가\n발생하거나, 다른 파티션에 과부하가 걸렸을 경우\n해당 파티션은 영향을 받을 수 있다.\n나. 논리 파티셔닝 방식은 서버구성을 유연하게 할\n수 있다.\n다. 물리 파티셔닝 방식은 하드웨어 자원이 물리적\n으로 분할되기 때문에 가상화에 따른 오버\n헤드가 없다.\n라. 논리 파티셔닝 방식은 파티션별 높은 독립성과\n신뢰성을 확보할 수 있다.\n① 가, 다 ② 가, 라 ③ 나, 다 ④ 나, 라\n95. 국토교통부의 지능형교통체계 표준 노드·링크\n구축기준(국토교통부고시 제2015-756호)에 의한\n노드·링크 구축방법에 대한 설명으로 가장 거리가\n먼 것은?\n① 평면교차로는 분기시에 교차로의 시종점 접속부에\n노드를 설정함을 원칙으로 한다.\n② 톨게이트(요금소), 검문소 등 차량운행이 물리\n적으로 통제되며, 통제지점의 명칭이 부여되어\n있는 경우에 노드를 설정한다.\n③ 시/도 경계, 시/군 경계로 구분되는 지점에\n노드를 설정한다.\n④ 일반적인 도로구간의 링크는 보도, 차도를 포함한\n도로의 중심선을 기준으로 방향별로 이격하여\n생성하는 것을 원칙으로 한다.\n96. 행정·공공기관 웹사이트 구축‧운영 가이드 (2016년\n1월, 행정자치부)가 권고하는 웹사이트 기획에 대한\n기본원칙에 해당하지 않는 것은?\n① 목적의 명확성: 웹사이트에서 제공하고자 하는\n서비스의 목적과 대상을 명확히 하고 세분화된\n서비스 및 콘텐츠 정의를 통하여 목적 지향적인\n서비스를 제공해야 함\n- 22\n② 확장성: 웹사이트를 통한 서비스 콘텐츠 확대\n및 서비스 분야의 확장을 고려하여, 서비스의 구성\n및 정보구조 등에 대한 유연성을 확보하여야 함\n③ 접근성 및 사용자지향: 이용자가 전문적인 능력\n없이도 웹사이트에서 제공하는 모든 정보를 동\n등하게 접근 및 이용할 수 있도록 웹사이트의\n접근 환경 및 수준을 사용자 관점에서 이해하고\n구현, 관리하여야 함\n④ 성능 확보성: 웹사이트 이용자가 웹사이트를 이\n용함에 있어서 불편함이 없는 정도의 웹사이트의\n각종 성능 지표를 미리 마련하고 이러한 성능\n지표를 만족시킬 수 있어야 함\n97. 임의의 호스트 A에 할당된 IPv4 주소가 200.45.\n34.56이고 그 호스트 A가 위치한 네트워크에서의\n서브넷 마스크(subnet mask)가 255.255.240.0일 때,\n호스트 A가 위치한 네트워크의 서브넷 주소 (Subnet\nAddress)는?\n① 200.45.16.0/21\n② 200.45.32.0/20\n③ 200.45.64.0/19\n④ 200.45.128.0/18\n98. 다음과 같은 네트워크 구성에서 충돌 도메인(Col-\nlision Domain)과 브로드캐스트 도메인(Broadcast\nDomain)의 수로 가장 적절한 것은? (단, 라우터나\n스위치는 고유의 기능만 제공)\n① Collision Domain : 4개, Broadcast Domain : 3개\n② Collision Domain : 7개, Broadcast Domain : 4개\n③ Collision Domain : 9개, Broadcast Domain : 5개\n④ Collision Domain : 10개, Broadcast Domain : 7개\n2 -\n\n=== NEW PAGE ===\n\n99. 다음에서 설명하는 프레임워크 기술로 가장 적합\n한 것은?\n-자바 엔터프라이즈 애플리케이션(Java Enterprise\nApplication)개발에 사용되는 프레임워크다.\n-자바 객체가 생성되고 동작하는 방식에 대한 틀을\n제공하고 애플리케이션 코드를 어떻게 작성하는\n지에 대한 설계 원칙과 기준도 제시한다.\n-IoC(Inversion of Control)/DI(Dependency Injection)\n로 불리는 객체의 생명주기와 의존 관계에 대한 프\n로그래밍 모델을 지원한다.\n-대한민국 전자정부 표준 프레임워크로 선정되어\n활용 하고 있다.\n① 닷넷(.NET)\n② 스프링(Spring)\n③ EJB(Enterprise Javabeans)\n④ 스트럿츠(Struts)\n100. 가정 내에 설치된 전력선을 이용한 통신기술로\n가장 거리가 먼 것은?\n➀ HomePlug\n➁ CEBus\n➂ LonWorks\n➃ IEEE 1394\n- 23\n3 -\n\n=== NEW PAGE ===\n\n보 안\n101. UNIX 시스템의 패스워드 암호화에 활용되는 것으로\n다음 내용에 대한 설명으로 가장 적절한 것은?\n사용자의 패스워드에 덧붙여져서 암호 함수의 입\n력을 정해진 길이로 만들기 위해 활용된다. 이를\n통해 패스워드의 길이가 늘어나고, 동일한 패스워\n드를 사용하는 사용자의 암호화 된 값이 다른 값을\n갖게 되는 효과가 있다.\n① 솔트(salt)\n② 키(key)\n③ 해쉬값(hash value)\n④ 사전(dictionary)",
  "2016_102": "102. 다음 중「개인정보 보호법」에서 규정하고 있지\n않은 것은?\n① 개인정보의 수집 제한\n② 개인정보의 목적 외 이용·제공 제한\n③ 개인정보 이용내역의 통지\n④ 개인정보영향평가",
  "2016_103": "103. 다음과 같은 네트워크 구축 요구사항을 충족하기\n위한 것으로 가장 거리가 먼 것은?\n우리 기업의 네트워크를 내부망과 외부망으로 구분\n하고 외부에 공개해야 하는 웹서비스는 구분된\n네트워크에서 운영하고자 한다. 또한 외부망에서\n내부망으로 암호터널을 이용하여 안전한 통신을\n제공하고자 한다.\n① 방화벽(Firewall)\n② 중간지점(DMZ)\n③ 가상사설망(VPN)\n④ 안티바이러스(Anti-Virus)\n- 24",
  "2016_104": "104. “소프트웨어 개발 보안 가이드(2013.11)”에서\n보안 약점은 7개의 유형으로 분류하여 정의하고\n있다. 다음 중 ‘입력데이터 검증 및 표현’ 유형에\n해당하는 보안약점과 가장 거리가 먼 것은?\n① 부적절한 인가\n② 경로 조작 및 자원 삽입\n③ XPath 삽입\n④ 정수형 오버플로우",
  "2016_105": "105. 시큐어코딩 점검 시 보안약점 탐지에 관한 설명으로\n가장 거리가 먼 것은?\n① 보안약점이 내포된 Bad 코드에서 취약한 함수의\n위치를 정확하게 탐지한 경우 True Positive로\n판정한다.\n② 보안약점이 존재하지 않는 Good 코드에서 보안\n약점의 위치를 탐지하지 못한 경우 False Positive로\n판정한다.\n③ 보안약점이 내포된 Bad 코드에서 취약한 함수의\n위치를 탐지하지 못한 경우 False Negative로 판정\n한다.\n④ 시큐어코딩 점검 시 False Positive에 대해 효과적\n으로 관리하지 못하면 Good 코드에 대해서\n계속적인 분석을 하게 되어 점검효율이 떨어진다.",
  "2016_106": "106. 정보보호 위험관리에서 정성적(Qualitative)\n위험분석이 갖는 특징으로 틀린 것은?\n① 손실크기를 화폐가치로 측정할 수 없어 위험을\n기술변수로 표현하는 경우 주관적이며, 근거가\n제공되지 않지만 시간, 노력, 비용이 적게 든다.\n② 델파이법, 시나리오법, 순위결정법, 질문서법\n등이 해당된다.\n③ 위험의 우선순위 파악이 용이하다는 장점이\n있다.\n④ 많은 데이터의 입력과 복잡한 계산이 필요하다는\n단점이 있다.\n4 -\n\n=== NEW PAGE ===",
  "2016_107": "107. 다음은 위험관리 국제표준 ISO/IEC 13335의 위험\n처리 절차이다. (가) ~ (라)에 해당되는 위험\n처리 방법으로 올바르게 짝지어진 것은?\n① (가)위험 회피, (나)위험 감소, (다)위험 전가,\n(라)위험 수용\n② (가)위험 수용, (나)위험 감소, (다)위험 전가,\n(라)위험 회피\n③ (가)위험 감소, (나)위험 회피, (다)위험 전가,\n(라)위험 수용\n④ (가)위험 수용, (나)위험 회피, (다)위험 전가,\n(라)위험 감소",
  "2016_108": "108. 데이터베이스에 대한 감사에서 수집하는 정보로\n적절하지 않은 것은?\n① 데이터베이스 서버의 설정 및 운영과 관련된 정보 변경\n② 데이터베이스 암호화 키\n③ 객체 생성 및 변경 내역\n④ 주요 데이터의 조회 및 이동 내역",
  "2016_109": "109. 다음과 같은 네트워크 보안관리 요구사항에서\n제시하고 있는 기능을 수행하기 위한 네트워크\n장비로 가장 적절한 것은?\n내부망의 컴퓨터가 사용하는 IP 주소와 port 번호를\n외부망에서 알아낼 수 없도록 하고, 특히 외부망\n에서 스니퍼를 통해서 패킷을 수집해서 보더라도\n내부망의 어떤 IP 주소 및 port 번호와 통신하는지\n알아내지 못하게 하고 싶다.\n- 25\n① IDS\n② Anti-Virus\n③ NAT\n④ Honeypot",
  "2016_110": "110. OWASP TOP 10 애플리케이션 보안 위험(2013)에\n대한 설명으로 가장 적절하지 않은 것은?\n① 인젝션은 신뢰할 수 없는 데이터가 명령어나 질\n의문의 일부분으로서 인터프리터에 보내질 때\n발생한다.\n② 크로스 사이트 스크립팅(XSS)은 로그온 된 피해\n자의 취약한 웹 애플리케이션에 피해자의 세션\n쿠키와 기타 다른 인증정보를 자동으로 포함하여\n위조된 HTTP 요청을 강제로 보내도록 하는 것이다.\n③ 취약한 직접 객체 참조는 개발자가 파일, 디렉\n토리, 데이터베이스 키와 같은 내부 구현 객체\n를 참조하는 것을 노출시킬 때 발생한다.\n④ 인증 및 세션 관리 취약점은 공격자가 로그인을\n하지 않은 상태로 서비스에 접근하거나, 다른\n사용자 ID로 가장할 수 있는 방법을 제공한다.",
  "2016_111": "111. 시스템 또는 네트워크에 손상을 입히는 악성\n소프트웨어에 대한 다음 설명으로 가장 적절한\n것은?\n① 트랩도어(Trap Doors)는 세션 하이제킹의\n기본이 되는 기술로 IP 주소를 속여서 공격\n하는 기법이다.\n② 논리 폭탄(Logic Bomb)은 특정한 조건이 만족\n되면 특정형태의 공격을 하는 기법이다.\n③ 트로이목마(Trojan Horses)는 자기 복제 능력이\n있으며 다른 파일을 감염시키는 기법이다.\n④ 웜(Worms)은 인증절차 없이 시스템에 접근하기\n위한 방법을 미리 설정해 놓는 기법이다.",
  "2016_112": "112. 개인정보의 기술적·관리적 보호조치 기준과 관련\n하여 암호화 방식이 다른 것은?\n① 비밀번호\n② 신용카드번호\n③ 계좌번호\n④ 주민등록번호\n5 -\n\n=== NEW PAGE ===",
  "2016_113": "113. DRM의 요소 기술에 관한 설명 중 가장 거리가\n먼 것은?\n① 메타데이터는 저자, 저작권자, 발행일 등 저작권\n관리를 위해 필요한 데이터 구조 및 정보이다.\n② 권리 표현 언어는 DOI, MPEG-21 DII 등이 있다.\n③ 패키징은 시큐어 콘테이너를 구성하는 과정을\n의미한다.\n④ DRM에서 인증은 사용자 인증, 디바이스 인증\n그리고 이 둘을 결합한 방식으로 나뉜다.",
  "2016_114": "114. 다음 중 분석대상 네트워크에 현재 열려 있는\n포트를 확인하여 어떤 서비스가 운영 중인지를\n파악하기 위한 것으로 가장 적절한 것은?\n① iptable\n② snort\n③ nmap\n④ tripwire",
  "2016_115": "115. S/MIME에서는 암호처리 외에도 부가적인 전자우편\n보안 서비스들을 제공한다. 다음 중 S/MIME 보안\n서비스와 가장 거리가 먼 것은?\n① 신뢰망(Web of Trust)\n② 서명된 수령증(Signed Receipts)\n③ 보안 레이블(Security Labels)\n④ 안전한 메일링리스트(Secure Mailing Lists)",
  "2016_116": "116. 디지털 포렌식 과정에서 수집된 디지털 증거가\n법적 효력을 가지고 증거 능력을 인정받기 위한\n원칙 중 다음 설명에 가장 적절한 것은?\n증거는 획득되고 난 뒤 이송/분석/보관/법정 제출\n이라는 일련의 과정이 명확해야 하고 이러한 과정에\n대한 추적이 가능해야 한다.\n① 정당성의 원칙\n② 무결성의 원칙\n③ 재현의 원칙\n④ 연계 보관성의 원칙(Chain of Custody)\n- 26",
  "2016_117": "117. ISO/IEC 27014에서 명시하고 있는 정보보호 거버\n넌스 프로세스에 대한 설명 중 가장 거리가 먼\n것은?\n① Evaluate: 정보보호 활동의 조직 목표 지원 여\n부를 확인하기 위해 현재의 정보보호 수준을 평\n가해야 한다.\n② Direct: 최고경영층은 정보보호 목표 및 전략에\n대한 방향을 제시해야 한다.\n③ Monitor: 정보보호 활동의 모니터링을 위해서는\n비즈니스 관점의 성과척도를 적용해야 한다.\n④ Assure: 최고경영층은 정보보호 활동의 적절성을\n외부 이해관계자들에게 보고해야 한다.",
  "2016_118": "118. 다음 중 커버로스(Kerberos)에 대한 설명으로\n가장 거리가 먼 것은?\n① 커버로스는 키분배센터(KDC: Key Distribution\nCenter) 기반의 키 관리를 수행한다.\n② 커버로스는 타임스탬프를 이용하여 재전송 공격을\n방지한다.\n③ 커버로스는 RFC 표준으로 키분배뿐만 아니라 사\n용자 인증을 제공한다.\n④ 커버로스를 이용하여 사용자는 키분배 센터로\n부터 상대방의 공개키를 안전하게 수신한다.",
  "2016_119": "119. 다음 설명과 관련성이 가장 많은 프로토콜은?\n- 동일 LAN 상에서 동작하는 컴퓨터들 간에 공격\n발생이 가능함\n- MITM(Man-in-the-Middle) 형태의 공격 발생이\n가능함\n- IP 주소를 MAC 주소로 대응시키기 위해 사용됨\n① ARP\n② RIP\n③ TCP\n④ ICMP\n6 -\n\n=== NEW PAGE ===",
  "2016_120": "120. 정보보호 관리과정 중 다음과 같은 요구사항에\n해당하는 것은?\n- 정보보호 관리체계를 운영하는 과정에서 상시적인\n모니터링을 수행\n- 정기적인 내부감사를 통해 정책 준수 상황을 확인\n- 정보보호 관리체계를 재검토\n- 관리 체계 개선\n① 정보보호 정책 수립 및 범위설정\n② 경영진 책임 및 조직구성\n③ 정보보호대책 구현\n④ 사후관리\n- 27\n7 -",
  "2017_101": "101)\n④ SELECT STUDENTID\nFROM ENROLL E\nWHERE E.COURSEID=100 AND E.COURSEID=101\n58. 다음 SQL 문과 질의에 대한 결과 값으로 맞는 것은?\n(SQL CREATE, INSERT 문)\nCREATE TABLE TEST(A INTEGER, B VARCHAR(10));\nINSERT INTO TEST VALUES (1, 'kim');\nINSERT INTO TEST VALUES (2, ' ');\nINSERT INTO TEST VALUES (3, NULL);\nINSERT INTO TEST VALUES (4, 'park');\nINSERT INTO TEST VALUES (5, NULL);\nINSERT INTO TEST VALUES (6, 'lee');\n(Oracle DBMS의 SQL 문)\nSELECT X, X-Y, Z\nFROM (SELECT COUNT(*) AS X, COUNT(B) AS Y,\nCOUNT(CASE WHEN B IS NOT NULL AND LTRIM(B) IS NULL\nTHEN '1' END) AS Z\nFROM TEST) T;\n(SQL Server DBMS의 SQL 문)\nSELECT X, X-Y, Z\nFROM (SELECT COUNT(*) AS X, COUNT(B) AS Y,\nCOUNT(CASE WHEN B IS NOT NULL AND LEN(LTRIM(B)) = 0\nTHEN '1' END) AS Z\nFROM TEST) T;\n- 13\n① 6, 2, 1 ② 6, 3, 0\n③ 6, 2, 0 ④ 6, 3, 1\n59. 다음의 데이터베이스에서“3명 이상의 사원이 근무하는\n각 부서에서 부서 번호, 부서 이름, 그리고 그 부서에서\n연봉이 4만불 이상인 사원의 수를 검색하라”는 질의를\nSQL로 올바르게 표시한 것은?\nEMPLOYEE(Name, Ssn, Salary, Sex, Dno)\nDEPARMENT(Dname, Dnumber, Mgr_ssn)\n① SELECT Dnumber, Dname, COUNT(*)\nFROM DEPARTMENT, EMPLOYEE\nWHERE Dnumber = Dno AND\nSalary >= 40000 AND\nDno IN (SELECT Dno\nFROM EMPLOYEE\nGROUP BY Dno\nHAVING COUNT(*) > 2)\nGROUP BY Dnumber;\n② SELECT Dnumber, Dname, COUNT(*)\nFROM DEPARTMENT, EMPLOYEE\nWHERE Dnumber = Dno AND\nSalary >= 40000 AND\nCOUNT(*) > 2\nGROUP BY Dnumber, Dname;\n③ SELECT Dnumber, Dname, COUNT(*)\nFROM DEPARTMENT, EMPLOYEE\nWHERE Dnumber = Dno AND\nSalary >= 40000 AND\nDno IN (SELECT Dno\nFROM EMPLOYEE\nGROUP BY Dno\nHAVING COUNT(*) > 2)\nGROUP BY Dnumber, Dname;\n④ SELECT Dnumber, Dname, COUNT(*)\nFROM DEPARTMENT, EMPLOYEE\nWHERE Dnumber = Dno AND\nDno IN (SELECT Dno\nFROM EMPLOYEE\nWHERE Salary >= 40000\nGROUP BY Dno\nHAVING COUNT(*) > 2)\nGROUP BY Dnumber, Dname;\n3 -\n\n=== NEW PAGE ===\n\n60. EMPLOYEE(Eno, Name, DeptName, Salary) 테이블에 대해\n“평균 봉급이 가장 높은 부서명(DeptName)을 검색” 하는\n질의를 다음과 같이 작성한다고 할 때, 밑줄 친 부분에\n들어갈 내용으로 맞는 것은?\nSELECT DeptName\nFROM EMPLOYEE\nGROUP BY DeptName\n㉠ >= ㉡ (SELECT AVG(Salary)\nFROM EMPLOYEE\n㉢ DeptName);\n㉠ ㉡ ㉢\n① WHERE Salary all ORDER BY\n② WHERE AVG(Salary) some GROUP BY\n③ HAVING Salary some ORDER BY\n④ HAVING AVG(Salary) all GROUP BY\n61. 인덱스의 생성 여부를 결정하기 위해 고려할 사항에 대한\n설명이 잘못된 것은? (2개 선택)\n① 유일한 키 속성에 대해서는 인덱스를 생성한다.\n② 실렉션 조건이나 조인 조건에서 사용되는 속성에 대해서는\n인덱스를 생성한다.\n③ 인덱스 탐색만을 통해 답변이 가능한 질의에 대해서는\n클러스터 인덱스를 고려한다.\n④ 동등 조건과 범위 질의에 사용되는 속성에 대해서는 해\n시 인덱스가 유리하다.\n62. EMPLOYEE(Eno, Name, Salary, CommissionPercent) 테이블에\n대한 다음과 같은 질의가 있다.\nSELECT Name\nFROM EMPLOYEE\nWHERE ((Salary * CommissionPercent) + Salary) > 15000;\n이러한 유형의 질의의 경우 실행 빈도가 높을 가능성이 많지만\nSalary 열에 대한 인덱스가 존재한다고 하더라도 제대로 이용\n하지 못할 것이다. 이러한 경우에 활용할 수 있는 가장 적절한\n인덱싱 기법은?\n① Bitmap indexing\n② Function-based indexing\n③ Hash indexing\n④ R-tree indexing\n- 14\n63. 트랜잭션 T1, T2가 수행되는 다음 그림에서, T1의 연산\n결과(x + 100)가 T2의 연산 결과(x * 2)로 인해 바르게\n저장되지 않는 현상이 발생할 수 있다. 이 같은 현상을\n무엇이라고 하는가?\n① 갱신 손실(lost update)\n② 오손 읽기(dirty read)\n③ 지연 갱신(deferred update)\n④ 갱신 충돌(update conflict)\n64. 트랜잭션 T1은 x와 y에 100을 더하고, 트랜잭션 T2는 y와 x에\n2를 곱하는 트랜잭션이다. 두 트랜잭션이 다음과 같은\n순서로 실행이 되었을 때 발생한 상황은?\n시간1: T1 lock(x); read(x);\n시간2: T2 lock(y); read(y);\n시간3: T1 x = x + 100\n시간4: T2 y = y * 2\n시간5: T1 write(x)\n시간6: T2 write(y)\n시간7: T1 lock(y)\n시간8: T2 lock(x)\n① 갱신 손실(lost update)\n② 교착 상태(deadlock)\n③ 오손 읽기(dirty read)\n④ 철회(rollback)\n65. 데이터 마이닝 분석기법과 관련된 이론을 가장 적절하게\n연결한 것은?\n① 지지도(support) - 인공신경망\n② 시그모이드(sigmoid) 함수 - 의사결정트리\n③ 맨하튼 거리(manhattan distance) - 군집분석\n④ 엔트로피(entropy) - 연관분석\n4 -\n\n=== NEW PAGE ===\n\n66. 다음 두 릴레이션 R과 S에 대해 조인 연산을 수행했다\n고 할 때, 이 연산의 조인 선택률(join selectivity)은?\nR ⋈ S\nD1 < D4\n① 1 ② 4/9 ③ 5/9 ④ 5\n67. 물리적 데이터베이스 설계 단계에서 색인 구조를 결정하\n는데 도움이 되는 지침으로 틀린 것은?\n① 한 애트리뷰트에 들어 있는 상이한 값들의 개수가 전체\n레코드의 수와 비슷하고 검색에서 해당 애트리뷰트에\n대한 동등 조건이 사용된다면 비 클러스터링(non-clustering)\n색인을 생성하는 것이 좋다.\n② 갱신이 빈번하게 이루어지는 릴레이션에 대해서 색인을\n많이 생성하여 갱신의 효율성을 증진할 수 있다.\n③ 가능하면 정수형 애트리뷰트에 색인을 만드는 것이 좋고\n반대로 VARCHAR 데이터 타입을 갖는 애트리뷰트에는 색\n인을 만드는 것을 피해야 한다.\n④ 대량의 데이터를 삽입할 때는 모든 색인들을 제거하고\n데이터 삽입이 끝난 후에 색인들을 다시 생성하는 것이\n효율적이다.\n68. 질의 최적화 기법에 대한 설명으로 틀린 것은?\n① 주기억장치보다 더 큰 용량의 데이터에 대하여 SQL의 order\nby 절을 수행하기 위해서는 정렬-합병 전략의 외부 정렬을\n수행해야 한다.\n② 관계대수의 실렉트 연산을 수행하기 위해서는 데이터베\n이스 전체를 읽어들이는 파일 스캔 탐색이나 인덱스를\n활용한 인덱스 스캔 탐색을 수행한다.\n③ 두 릴레이션 R과 S에 대하여 조인 연산을 수행할 때, R과\nS의 레코드들이 조인 애트리뷰트 A와 B값에 물리적으로\n정렬되어 있으면 분할-해시 조인이 가장 효율적으로\n구현될 수 있다.\n④ 외부 조인은 중첩 루프 조인이나 단일 루프 조인 알고리즘\n중 하나를 수정하여 구현할 수 있다.\n- 15\n69. 사용자 U1이 생성한 EMPLOYEE(Eno, Name, Salary) 테이블에\n대해 다음의 SQL 명령을 순서대로 실행할 때, 권한 부여\n에러가 발생하는 위치를 모두 모아놓은 것은?\n1 U1: GRANT INSERT, DELETE ON EMPLOYEE TO U2;\nU1: GRANT SELECT ON EMPLOYEE TO U3 WITH\n2\nGRANT OPTION;\n3 U2: GRANT INSERT ON EMPLOYEE TO U4;\n4 U3: GRANT SELECT ON EMPLOYEE TO U5;\n5 U5: GRANT SELECT ON EMPLOYEE TO U6;\n6 U1: GRANT SELECT ON EMPLOYEE TO U6;\n7 U1: REVOKE SELECT ON EMPLOYEE FROM U3;\n8 U6: SELECT * FROM EMPLOYEE;\n9 U5: SELECT * FROM EMPLOYEE;\n10 U6: UPDATE EMPLOYEE SET Salary = Salary * 1.1;\n① 2, 3, 5 ② 3, 5, 10\n③ 3, 5, 9, 10 ④ 3, 5, 8, 9, 10\n70. 트랜잭션 T1, T2, T3에 대하여 스케줄 s1, s2 중에서 충돌\n직렬 가능한(conflict serializable) 것은?\nT1: r1(x); r1(z); w1(x);\nT2: r2(z); r2(y); w2(z);\nT3: r3(x); r3(y); w3(y);\ns1: r1(x); r2(z); r1(z); r3(x); r3(y); w1(x); w3(y); r2(y); w2(z);\ns2: r1(x); r2(z); r3(x); r1(z); r2(y); r3(y); w1(x); w2(z); w3(y);\n① s1 ② s2 ③ s1, s2 ④ 없음\n71. 다음 그림은 의사결정 트리(decision tree)를 구축하는데\n있어서, 분리되기 전 노드(P)와 분리된 후 노드(C1, C2)\n의 상태를 나타낸다. 그림에서 N()은 노드에 속한 엔트리\n개수, E()는 해당 노드의 엔트로피(entropy)를 나타낸다\n고 할 때, 노드 분리에 따른 정보 이득(information gain)은?\n① 0.54 ② 0.40 ③ 0.30 ④ 0.16\n5 -\n\n=== NEW PAGE ===\n\n72. 대용량의 데이터 처리의 필요성이 커짐에 따라 NoSQL\n기술에 대한 수요도 증가하고 있다. 관계형 데이터베\n이스와 비교했을 때, NoSQL의 특징에 대한 설명으로\n가장 적절한 것은?\n① 각 데이터가 독립적으로 설계되어 있어 데이터를 여러\n서버에 분산하여 작업하며 다양한 조인 연산도 지원한다.\n② NoSQL 데이터베이스는 키-값형 스토어, 문서형 데이터베\n이스, 컬럼형 데이터베이스, 그래프 데이터베이스 등으로\n구분할 수 있다.\n③ MongoDB는 문서형 데이터베이스로서, 문서(document)는\n관계형 데이터베이스의 테이블을 구성하는 열들의 집합에\n해당한다.\n④ 대부분의 NoSQL에서는 비정형 대용량의 데이터를 다루므로,\n관계형 데이터베이스에서 활용되던 인덱스 구조를 사용\n하지 않는다.\n73. 분산 데이터베이스 설계에서 분할(fragmentation)에 관한\n설명 중 가장 거리가 먼 것은?\n① 응용에 필요한 데이터들을 모아서 필요한 곳에 가까이\n저장하기 위해 분할이 필요하다.\n② 분할의 방법에는 수직 분할, 수평 분할, 혼합 분할 방법이\n있다.\n③ 분할 이전의 전역 릴레이션에 포함된 튜플은 분할 후 반\n드시 한 개의 분할 단편에 포함되어야 한다.\n④ 모든 분할 방법에 대해 조인 연산을 이용하여 분할 이전과\n동등한 결과를 얻을 수 있어야 한다.\n74. 데이터마이닝 분류 분석을 위한 다음 오분류표의\n평가 지표에 대한 설명으로 가장 거리가 먼 것은?\n예측값(검색결과 포함) 예측값(검색결과에 미포함)\n실제값 참(P) TP(True Positive) FN(False Negative)\n실제값 거짓(N) FP(False Positive) TN(True Negative)\n① 민감도(sensitivity) – TP / P\n② 특이도(specificity) – TN / N\n③ 정확도(precision) – TP / (TP + FP)\n④ 재현률(recall) – TP / (TP + TN)\n- 16\n75. Google의 PageRank 알고리즘과 관련하여 3개의 웹사이트가\n다음 그림과 같이 연결되어 있다고 하자. 이 웹에 대한\n전이 행렬(transition matrix) M의 i번째 행, j번째 열의\n원소 m 는 다음과 같이 정의된다. 전이 행렬 M에서 그 값이\nij\n1/2인 원소의 개수와 1인 원소의 개수를 올바르게 나열한\n것은?\n- 페이지 j가 페이지 i에 대한 링크를 가지고 있고 j가\n링크한 전체 페이지 수가 r(≥1) 페이지일 때 m = 1/r\nij\n- 그렇지 않으면 m = 0\nij\n① 2, 1 ② 3, 2 ③ 4, 1 ④ 5, 0\n6 -\n\n=== NEW PAGE ===\n\n시스템 구조\n76. 스마트 웨어러블 상호운용성 참조모델 - 제2부 :\n네트워크/미들웨어 요구사항(정보통신단체표준,\nTTAK.KO-06.0445-part2, 2016.12.27)은 네트워크와\n미들웨어 계층에서 고려할 요구사항을 제시한다.\n다음 중 이 두 계층에서 고려해야 할 요구사항으로\n가장 적절하지 않은 것은?\n① 네트워크 계층은 공통적으로 IP 계층을 구현한다.\n(IPv6 권장)\n② 네트워크 계층은 타 기기에 대한 탐색(discovery)이\n가능해야 한다.\n③ 미들웨어 계층은 인증, 허가, 접근제어, 데이터\n암호화 등과 같은 보안기능을 지원해야 한다.\n④ 미들웨어 계층은 제한적 성능을 가지는 기기\n(constrained devices)에 적합한 메시지 전송\n프로토콜을 지원해야 한다.\n77. 무선 통신 기술에 대한 설명으로 가장 거리가 먼\n것은?\n① Bluetooth 통신 네트워크는 Master-Slave 방식을\n지원하며 데이터 전송을 위해 주파수 호핑(freq-\nuency hopping) 등을 사용한다.\n② ZigBee는 주파수 충돌을 피하기 위하여 CSMA/CD\n(Carrier Sense Multiple Access/Collision\nDetection) 방법을 사용한다.\n③ NFC는 무선태그(RFID) 기술 중 하나로 13.56MHz의\n주파수 대역을 사용하는 비접촉식 통신 기술이다.\n통신거리가 짧기 때문에 상대적으로 보안이\n우수한 근거리 통신 기술이다.\n④ Wi-Fi 통신은 AP(Access Point)와 단말 간의 통신\n이며 QAM(Quadrature Amplitude Modulation) 등의\n변복조 기술을 사용한다.\n78. 실시간 스트리밍 데이터 분석 프레임워크로 가장\n적절한 것은?\n① Apache Storm ② Facebook Scribe\n③ Cloudera Flume ④ Linkedin Kafka\n- 17\n79. ‘3D 프린터 선정 지침(정보통신단체표준, TTAK.KO\n-10.0789-Part15, 2015.12.16.)’에 따르면 3D 프\n린터는 재료 및 출력 방식이 다양하다. 다음의\n설명에 해당하는 3D 프린터의 종류는 무엇인가?\n액상수지(Liquid Photopolymer)를 재료로 사용하며,\n자외선 성분의 빛을 받으면 굳어지는 특수한 액체\n성분의 레진을 이용하는 방식으로, 조금씩 굳어지는\n부분을 쌓아가면서 3D 물체를 출력\n① FDM(Fused Deposition Modeling)\n② SLA(Stereolithography Apparatus)\n③ SLS(Selective Laser Sintering)\n④ LOM(Laminated Object Manufacturing)\n80. 정보시스템 하드웨어 규모산정 지침(정보통신단\n체표준, TTAK.KO-10.0292, 2008.12.19)에서 OLTP\n서버의 CPU 산정을 위한 보정치로 적절하지 않은\n것은?\n① 데이터베이스 크기보정\n② 애플리케이션 부하보정\n③ 인터페이스 부하보정\n④ 클러스터 보정\n81. 다음에서 설명하는 센서(sensor)로 가장 적절한\n것은?\n- 한축 또는 여러축의 회전 움직임의 각 변화량,\n즉 각속도를 측정한다.\n- 움직이는 물체의 기본축에 대한 회전과 방향을\n정확하게 측정할 수 있다.\n- 중력이나 자기장과 같은 외부의 힘에 영향을\n받지 않고 독자적으로 동작한다.\n① 자이로 센서(Gyroscope)\n② 방향 센서(Orientation Sensor)\n③ 가속도 센서(Accelerometer Sensor)\n④ 이미지 센서(Image Sensor)\n7 -\n\n=== NEW PAGE ===\n\n82. ‘사물인터넷 참조모델(정보통신단체표준, TTAK.KO\n-06.0346, 2013.12.18)‘에 대한 설명으로 적절하지\n않은 것은?\n① 사물인터넷 참조모델은 응용계층, 서비스 지원\n및 응용 지원 계층, 네트워크 계층, 디바이스\n계층 등 4개의 계층과 각 계층에 적용되는 관리\n기능과 보안기능으로 구성된다.\n② 응용계층은 다양한 사물인터넷 응용들에게 공통\n으로 필요한 기능을 제공하는 계층으로 정보처리\n및 정보저장기능 등을 포함한다.\n③ 네트워크 계층은 제어, 이동성관리, AAA(Authen\ntication, Authorization and Accounting)등\n네트워크 연결을 위한 제어기능을 수행한다.\n④ 디바이스 계층은 네트워크와의 직접 통신 등을\n수행하는 디바이스 기능과 다양한 인터페이스를\n지원하는 게이트웨이 기능으로 구성된다.\n83. RFID(Radio Frequency IDentification)시스템에\n대한 설명으로 가장 적절하지 않은 것은?\n① 공급사슬 전반에 걸쳐 재화의 움직임을 추적할\n수 있는 강력한 기술적 수단이다.\n② RFID 태그는 바코드와는 달리 판독을 위해서 라인\n오브 사이트(Line of Sight) 방식을 요구하지 않는다.\n③ 액티브(active) RFID는 내장전지에서 전력을\n얻으며 일반적으로 패시브(passive) RFID보다\n데이터 전송거리가 짧다.\n④ 패시브 RFID는 자체적인 전력원을 가지고 있지\n않으며, 운영전력으로 RFID 판독기가 방출하는\n전력을 사용한다.\n84. MQTT(Message Queue Telemetry Transport)에 대한\n설명으로 적절하지 않은 것은?\n① MQTT는 게시(publish)/구독(subscribe) 패턴을\n기반으로 동작한다.\n② MQTT는 일반적으로 TCP 프로토콜을 사용한다.\n③ MQTT는 메시지를 게시할 때 QoS 수준을 지정할\n수 있다.\n④ MQTT는 중개자(broker) 없이 게시자와 구독자\n사이의 직접적인 통신으로 메시지가 전달된다.\n- 18\n85. 빅데이터 플랫폼의 요소기술을 처리과정별로 수집,\n저장 및 관리, 처리, 분석 등의 기술로 나눌 때\n수집과 관련된 기술과 가장 거리가 먼 것은?\n① ZooKeeper ② Chukwa ③ Scribe ④ Flume\n86. CPU의 k-단계 명령어 파이프라이닝(instruction\npipelining)에 대한 설명으로 가장 적절한 것은?\n① k-단계 명령어 파이프라인을 사용하면 k배를\n초과하는 속도 향상을 얻을 수 있다.\n② 파이프라인 클록은 처리시간이 가장 짧은 단계를\n기준으로 정해진다.\n③ 수퍼파이프라이닝(superpipelining) 기술은\n단계들을 더욱 작게 분할하는 기술이다.\n④ 구조 해저드(structural hazard) 문제를 해결하기\n위해 지연 분기(delayed branch) 또는 루프 버퍼\n기법을 사용한다.\n87. ‘정보시스템 백업 지침(정보통신단체표준, TTAS.\nKO-10.0253, 2007.12.26)‘에는 전체백업(full\nbackup), 차별증분(differential incremental)\n백업, 적증분(cumulative incremental) 백업 등이\n설명되어 있다. 각 백업 방식을 사용하여 복구를\n수행하는 경우 복구 시간이 짧은 방식부터 순서대로\n나열한 것으로 가장 적절한 것은?\n① 전체 백업 – 적증분 백업 – 차별증분 백업\n② 전체 백업 – 차별증분 백업 – 적증분 백업\n③ 적증분 백업 – 차별증분 백업 – 전체 백업\n④ 차별증분 백업 – 적증분 백업 – 전체 백업\n88. ‘행정공공기관 영상회의시스템 상호연계 기술 표준\n규격(행정업무용 표준, 2015.6.)‘은 영상회의시\n스템 간 연동을 위해 영상회의 단말과 호처리\n서버에서 갖춰야 할 필수 기능을 제시한다. 다음\n중 영상회의 단말에서만 필수 기능인 것은?\n① 호출 기능 ② 화면 공유 기능\n③ 암호화 기능 ④ 응답 기능\n8 -\n\n=== NEW PAGE ===\n\n89. 3분짜리 음악을 8KHz로 샘플링하고 16 Bit로 양자\n화하여 A/D변환 했다면 데이터 크기는 얼마인가?\n① 3,800,000 byte ② 3,880,000 byte\n③ 2,800,000 byte ④ 2,880,000 byte\n90. 다음 괄호 안에 들어갈 용어로 가장 적절한 것은?\n( )는 웹서버를 대신하여 HTTP 요구를 충족\n시키는 네트워크 개체로서 요청된 객체의 사본\n이 지역적으로 저장되어 있는지 확인하여 만일\n저장되어 있다면 클라이언트 브라우저로 HTTP\n응답 메시지와 함께 해당 객체를 전송한다.\n① 프록시 서버\n② 스토리지 캐시\n③ DNS(Domain Name System) 서버\n④ 버퍼\n91. 다음의 (가), (나)에 들어갈 표현으로 적절한 것은?\nIPv4 Class형 주소체계에서 C클래스의 경우,\n클래스와 네트워크 ID는 주소의 앞쪽 (가)로\n식별하고 호스트 ID는 뒤쪽 (나)로 식별한다.\n① (가) 8비트 (나) 16비트\n② (가) 16비트 (나) 8비트\n③ (가) 24비트 (나) 8비트\n④ (가) 16비트 (나) 16비트\n92. 다음의 단일 정정(single error correction) 해밍\n코드 워드에서 한 비트가 오류일 때 이를 올바르게\n교정한 결과는?\n행 1 2 3 4 5 6 7\nC1 C2 8 C4 4 2 1\n0 0 0 0 1 0 1\n- C1 : 행 1, 3, 5, 7에 대해 짝수 패리티 체크\n- C2 : 행 2, 3, 6, 7에 대해 짝수 패리티 체크\n- C4 : 행 4, 5, 6, 7에 대해 짝수 패리티 체크\n① 1000101 ② 0100101\n③ 0010101 ④ 0001101\n- 19\n93. TCP/IP 계층모델에서 전송계층의 프로토콜이 아닌\n것은?\n① TCP(Transmission Control Protocol)\n② UDP(User Datagram Protocol)\n③ SCTP(Stream Control Transmission Protocol)\n④ 정답없음\n94. 정보시스템 운영 성과관리 지침(행정자치부 고시\n제2015-44호, 2015.12.14)에서 성과 측정은 비용\n측면과 업무 측면으로 구분하여 시행한다. 비용\n측면의 운영 성과에 대한 측정 항목으로 가장\n거리가 먼 것은?\n① 비용의 효율성 ② 사용상의 편의성\n③ 운영의 적정성 ④ 유지의 용의성\n95. 데이터 “1 0 1 0 0 1”에 대한 여러 가지 부호화 방\n식을 그림으로 표현하였다. 아래 그림 중에서 맨\n체스터 코딩 방식을 표현한 것은?\n1 0 1 0 0 1\n①\n②\n③\n④\n96. 30개의 노드로 구성된 통신망에서 각 노드가 모든\n다른 노드와 point-to-point 방식으로 연결될 때\n필요한 에지(edge) 수는?\n➀ 30 ➁ 29 ➂ 135 ➃ 435\n97. 데이터워드가 “111111“인 경우에 CRC(Cyclic Redund-\nancy Check) 기반의 코드워드를 구하려고 한다. 제수\n(divisor)가 “1010“이고 몫(quotient)이 “110011“,\n나머지(remainder)가 “110“이라면 코드워드는 무엇인가?\n➀ 1111111010 ➁ 111111110011\n➂ 111111110 ➃ 110011110\n9 -\n\n=== NEW PAGE ===\n\n98. RIP(Routing Information Protocol)에 대한 설\n명으로 가장 거리가 먼 것은?\n① 거리벡터에 근거한 간단하고 견고한 알고리즘을\n사용하므로 중소규모 네트워크보다 대규모 네트\n워크에서 더 효율적이다.\n② 홉 계수가 무한히 증가하는 라우팅 순환(routing\nloop)을 막기 위하여 홉 계수 제한(hop count\nlimit)을 한다.\n③ 라우팅 정보를 수신한 인터페이스로 동일한\n라우팅 정보를 전송하지 않는 스플릿 호라이즌\n(split horizon) 방식을 사용한다.\n④ RIP는 경로 설정 정보를 교환할 때 브로드캐스팅\n방식을 사용한다.\n99. ‘정보기술아키텍처 도입·운영 지침(행정자치부고시\n제2014-4호, 2014.12.23)‘에 제시된 범정부 정보\n기술아키텍처 참조모형의 종류에 대한 설명으로\n가장 거리가 먼 것은?\n① 성과참조모형은 정보화 성과 제고 및 품질향상을\n위한 성과요소들을 분류하고 정의한 체계이다.\n② 업무참조모형은 정보시스템에서 업무를 지원하는\n응용기능을 구현하기 위하여 필요한 정보기술\n및 표준들을 분류하고 정의한 체계이다.\n③ 데이터참조모형은 데이터표준화 및 재사용과 데\n이터관리를 지원하기 위하여 데이터를 분류하고\n표준 데이터구조를 정의한 체계이다.\n④ 서비스참조모형은 응용서비스의 재활용과 효율적\n관리를 위하여 업무 및 조직에 독립적인 응용컴포\n넌트를 기반으로 응용서비스를 분류하고 정의한\n체계이다.\n- 20\n100. 하나의 벤치마크 프로그램의 실행 시간이 100초\n인데 이 중 80초가 CPU 시간이고 나머지가 입출력\n시간이다. CPU 시간은 CPU의 개수에 정비례하여\n감소하고 (예: CPU 2개를 사용하면 CPU 시간은 1/2\n로 감소) 입출력 시간은 CPU 개수에 상관없이 동일\n하다. 개별 CPU의 속도는 동일하고 CPU의 개수가\n2년마다 두 배씩 증가한다고 가정할 때, 6년 후에\n이 프로그램의 실행 시간과 그 중 입출력 시간이\n차지하는 비율을 설명한 것 중 가장 적절한 것은?\n① 실행 시간: 50초, 입출력 시간: 50%\n② 실행 시간: 50초, 입출력 시간: 66.6%\n③ 실행 시간: 30초, 입출력 시간: 50%\n④ 실행 시간: 30초, 입출력 시간: 66.6%\n0 -\n\n=== NEW PAGE ===\n\n보 안\n101. 일회용 비밀번호(OTP: One-Time Password)에 대한\n설명으로 가장 적절한 것은?\n① 벨 연구소(Bell Lab.)에서 개발한 S/KEY 방식은\n유닉스 계열 운영체제의 인증에 사용된다.\n② 생성되어 한번 사용된 인증 값이 노출되는 경우\n재사용이 가능하다.\n③ 이벤트 동기화 방식은 OTP를 생성하기 위해 입력\n값으로 시각을 사용하는 방식이다.\n④ 도전-응답(challenge-response) 방식은 OTP를 생성\n하기 위해 카운트 값을 동일하게 증가시켜 입력\n하는 방식이다.",
  "2017_102": "102. VPN을 구축하기 위해 사용하는 터널링 프로토콜에\n대한 설명으로 가장 적절하지 않은 것은?\n① IPSec은 IP 망에서 안전하게 정보를 전송하는 표\n준화된 3계층 프로토콜로 전송모드와 터널모드가\n있다.\n② Layer2 터널링은 링크 계층에서 구현된 프로토콜로\n비용면에서는 효율적이지만, 터널 종단에서만 인\n증을 제공하므로 다른 계층의 프로토콜과 함께\n사용되는 것이 일반적이다.\n③ PPTP(Point to Point Tunneling Protocol)는 Mic-\nrosoft사가 제안한 방식으로 이동 중인 사용자가\n기업의 home server에 다이얼 업 접속을 하고자\n할 때 사용하는 방식이다.\n④ SSL은 원격 다이얼 업 사용자가 터널링을 통해\n공중망으로 사설망에 연결될 수 있는 기능을\n제공한다.",
  "2017_103": "103. DRM 시스템을 위한 핵심 요소 기술과 가장\n거리가 먼 것은?\n① DOI(Digital Object Identifier)\n② XrML\n③ MPEG\n④ Finger Print Watermarking\n- 21",
  "2017_104": "104. 다음의 개인정보 비식별 조치 방법(’개인정보 비식별\n조치 가이드라인’)은 어떤 것에 해당 하는가?\n홍길동, 35세, 서울 거주, 한국대학 재학\n→ 홍OO, 35세, 서울 거주, OO대학 재학\n① 가명처리(pseudonymization)\n② 데이터 마스킹(data masking)\n③ 데이터 범주화(data suppression)\n④ 총계처리(aggregation)",
  "2017_105": "105. SSL이 제공하는 보안 기능에 대한 설명으로 적절\n하지 않은 것은?\n① 서버와 클라이언트 사이에 전송되는 메시지에 대한\n기밀성 기능을 제공한다.\n② 클라이언트는 신뢰된 인증기관(certificate authority)\n에서 발행된 서버의 인증서를 이용하여 서버를\n인증할 수 있다.\n③ 서버와 클라이언트의 인증서를 이용하여 송/수신\n한 메시지에 대한 부인방지 기능을 제공한다.\n④ 해시 함수(hash function)를 이용하여 서버와 클\n라이언트 사이에 전송되는 메시지에 대한 무결성\n기능을 제공한다.",
  "2017_106": "106. 다음 설명에 가장 적절한 것은?\n디지털 포렌식 과정에서 구동되고 있는 시스템의 휘\n발성 정보를 수집하는 행위를 의미하며, 수집 가능한\n모든 정보의 수집/분석과 함께 이를 바탕으로 한\n사고의 처리까지를 포함한다.\n① 연계 보관성(chain of custody)\n② 법 집행(law enforcement)\n③ 라이브 리스판스(live response)\n④ 디스크 스패닝(disk spanning)\n1 -\n\n=== NEW PAGE ===",
  "2017_107": "107. 전자서명(digital signature) 메커니즘이 제공하는\n기능으로 가장 거리가 먼 것은?\n① 전자서명 메시지에 대한 부인방지(non-repudiation)\n② 전자서명 검증 과정을 통한 메시지의 무결성(integrity)\n③ 메시지 송신자에 대한 인증(authentication)\n④ 송수신 메시지에 대한 비밀성(confidentiality)",
  "2017_108": "108. 소프트웨어 개발시 다음과 같은 HTML 코드에서\n발생 가능한 보안 취약점으로 가장 적절한 것은?\n1: ......\n2: <form name=“MyForm” method=“get” action=“customer.do”>\n3: <input type=text name=“txt1”>\n4: <input type=submit value=“보내기”>\n5: </form>\n6: ......\n① 크로스사이트 요청 위조(CSRF)\n② HTTP 응답 분할\n③ XPath 삽입\n④ LDAP 삽입",
  "2017_109": "109. 평문 11001010을 키 01101100을 이용하여 스트림\n암호 시스템으로 암호화하였을 때 생성된 암호문\n으로 적절한 것은?\n① 10100111 ② 10110111\n③ 10110110 ④ 10100110",
  "2017_110": "110. ‘전자정부 SW 개발·운영자를 위한 소프트웨어 개발\n보안 가이드(행정자치부)‘에서 제시된 소프트웨어\n개발시 업로드 및 다운로드 파일에 대한 검증\n과정과 가장 거리가 먼 것은?\n① 업로드되어 저장되는 파일의 타입, 크기, 개수,\n실행 권한을 제한해야 한다.\n② 업로드되어 저장되는 파일은 외부에서 식별되지\n않아야 한다.\n③ 다운로드되어 저장되는 파일의 중요 기능과 리소\n스에 대해 부인방지 기능을 적용해야 한다.\n④ 파일 다운로드 요청시에 요청 파일명에 대한 검증\n작업을 수행해야 한다.\n- 22",
  "2017_111": "111. 무선 랜(LAN)의 보안 설정으로 가장 거리가 먼\n것은?\n① WPA(Wi-Fi Protected Access)-PSK(Pre-Shared Key)를\n이용하여 암호화를 설정한다.\n② AP(Access Point) 보안을 위해 SSID(Service Set\nIdentifier) 브로드캐스팅을 허용한다.\n③ 무선 랜의 암호화 통신을 위하여 WEP(Wired Equi-\nvalent Privacy) 키를 설정한다.\n④ IEEE 802.1x 솔루션을 도입하여 EAP(Extensible\nAuthentication Protocol)와 함께 무선 랜 인증을\n수행한다.",
  "2017_112": "112. 정보보호 관리체계로 알려져 있는 ISMS(Information\nSecurity Management System)의 업무 수행 절차를\n적절한 순서로 배열한 것은?\n① ISMS 수립 → ISMS 구현과 운영 → ISMS 관리와\n개선 → ISMS 모니터링과 검토\n② ISMS 수립 → ISMS 모니터링과 검토 → ISMS\n구현과 운영 → ISMS 관리와 개선\n③ ISMS 수립 → ISMS 구현과 운영 → ISMS 모니터\n링과 검토 → ISMS 관리와 개선\n④ ISMS 수립 → ISMS 관리와 개선 → ISMS 구현과\n운영 → ISMS 모니터링과 검토",
  "2017_113": "113. 다음 설명에 가장 적절한 것은?\n블루투스의 취약점을 이용하여 장비의 임의 파일에\n접근하는 공격이다. 공격자는 블루투스 장치끼리 인증\n없이 정보를 간편하게 교환하기 위해 개발된 OPP(Object\nPush Profile) 기능을 사용하여 블루투스 장치로부터\n주소록 또는 달력 등의 내용을 요청해 이를 열람하\n거나 취약한 장치의 파일에 접근할 수 있다.\n① 블루스나프(BlueSnarf)\n② 블루프린팅(BluePrinting)\n③ 블루버그(BlueBug)\n④ 워 드라이빙(War Driving)\n2 -\n\n=== NEW PAGE ===",
  "2017_114": "114. 다음은 정보보호의 3대 요소 중 무엇에 관한\n설명인가?\n적절한 권한을 가진 사용자에 의해 인가된 방법\n으로만 정보를 변경할 수 있도록 보장하는 것을\n의미한다.\n① 기밀성(Confidentiality)\n② 완전성(Completeness)\n③ 무결성(Integrity)\n④ 가용성(Availability)",
  "2017_115": "115. 스니퍼(sniffer)는 LAN 카드의 promiscuous mode\n에서 동작하는데, 이 모드를 사용하는 이유로 가장\n적절한 것은?\n① 모든 유입 트래픽 차단\n② 자신의 네트워크에 접근하는 모든 패킷 읽기\n③ 해당 호스트가 다른 호스트와 통신을 원활하게\n할 수 있도록 구성\n④ 해당 NIC(Network Interface Card)로 들어오는\n모든 패킷들을 해당 네트워크 세그먼트로 재전송",
  "2017_116": "116. ‘정보시스템 개발·운영자를 위한 홈페이지 취약점\n진단·제거 가이드(KISA)‘에서 제시된 웹 애플리케이\n션의 취약점으로 인해 발생하는 공격의 피해 형\n태가 나머지 셋과 다른 것은?\n① URL/파라미터 변조 취약점\n② 불충분한 세션 관리 취약점\n③ 디렉터리 인덱싱 취약점\n④ 크로스 사이트 요청 위조(CSRF) 취약점",
  "2017_117": "117. ‘개인정보보호 관리체계(PIMS)의 개인정보보호 관리\n과정(개인정보보호관리체계 인증 등에 관한 고시)‘ 중\n“검토 및 모니터링” 과정에 포함되어야 하는 가장\n적절한 세부 관리과정을 고르시오.(2개 선택)\n① 내부감사\n② 개인정보보호 개선 활동\n③ 법적 요구사항 준수검토\n④ 내부 공유 및 교육\n- 23",
  "2017_118": "118. 다음 설명에 가장 적절한 보안 위협은?\n신뢰할 수 없는 데이터가 명령어나 쿼리문의 일부분\n으로서 인터프리터로 보내질 때 발생되는 보안 위협\n① 인젝션\n② 보안 설정 오류\n③ 알려진 취약점 있는 컴포넌트 사용\n④ 인증 및 세션 관리 취약점",
  "2017_119": "119. 클라우드에서 개인정보 보호에 초점을 맞춘 국제\n표준은?\n① ISO/IEC 27001 ② ISO/IEC 27014\n③ ISO/IEC 27017 ④ ISO/IEC 27018",
  "2017_120": "120. TCP/IP 프로토콜에서 각 계층별 보안 프로토콜이\n잘못 연결된 것은 어느 것인가?\n① 네트워크 접근계층(network access layer) – PGP\n② 인터넷 계층(internet layer) – IPsec\n③ 전송 계층(transport layer) - SSL\n④ 응용 계층(application layer) – S/MIME\n3 -",
  "2018_101": "101. 다음과 같은 침입차단시스템(firewall)의 기본\n구조로 가장 적절한 것은?\n이 방식은 외부 네트워크와 내부 네트워크가 분리\n되어 있는 네트워크를 구성하며, 내외부 네트워크\n사이에 DMZ라고 불리는 완충지대를 둔다. 이를 위\n해 이중 라우터 구조를 사용한다.\n① 단일 홈 게이트웨이(single homed gateway)\n② 이중 홈 게이트웨이(dual homed gateway)\n③ 스크리닝 라우터(screening router)\n④ 스크린드 서브넷 게이트웨이(screened subnet\ngateway)",
  "2018_102": "102. 공개키 암호 알고리즘을 이용하는 전자서명에 대한 설\n명으로 가장 적절한 것을 모두 고르시오.(2개 선택)\n① 권한이 있는 사용자들만 서명의 정당성을 검증할\n수 있다.\n② 한 번 생성된 서명은 동일한 서명자의 다른 문서에\n재사용할 수 있다.\n③ 서명된 문서가 변경된 경우에 수신자는 변경 여\n부를 확인할 수 있다.\n④ 전자서명을 생성한 서명자는 나중에 서명한 사실\n을 부인할 수 없다.",
  "2018_103": "103. DRM(Digital Right Management) 시스템에서 권리\n표현에 관한 설명으로 가장 거리가 먼 것은?\n① REL(Rights Expression Language)은 XML을 기반\n으로 이루어져 있다.\n② XACML(eXtensible Access Control Markup Language)\n은 대표적인 DRM 권리 표현 언어이다.\n③ 대부분의 REL은 일반 언어와 똑같이 어휘(semantics)와\n어휘에 대한 구조(syntax)를 포함한다.\n④ MPEG-21 REL에서는 리소스를 디지털 포맷으로 제\n한하나, ODRL(Open Digital Right Language)에서\n는 모든 포맷을 허용한다.\n- 20",
  "2018_104": "104. 리눅스 시스템에서는 파일 생성시 기본 권한이\n부여되는데, 이 기본 권한을 결정할 때 사용되\n는 것은?\n① chmod ② umask ③ fdisk ④ dmesg",
  "2018_105": "105. 접근제어 모델에 관한 설명 중 가장 적절하지 않은\n것은?\n① 임의적 접근제어는 정보의 소유자가 보안 레벨을\n결정하고 이에 대한 정보의 접근 제어를 설정하\n는 방식이다.\n② 강제적 접근제어는 중앙에서 정보를 수집하고 분\n류하여 보안 레벨을 결정하고 정책적으로 접근제\n어를 수행하는 방식이다.\n③ 강제적 접근제어 방식인 벨 라파둘라 모델에서는\n자신보다 높은 보안 레벨의 문서에 대해 읽기와\n쓰기가 불가능하다.\n④ 역할기반 접근제어는 사람이 아닌 직책에 대해\n권한을 부여함으로써 효율적인 권한 관리가 가\n능하다.",
  "2018_106": "106. SSO(Single Sign-On)에 대한 설명 중 가장 적절\n하지 않은 것은?\n① SSO는 인증 정책과 절차를 일관되게 적용하기 위\n해 분산화된 관리를 제공한다.\n② 사용자는 단 한번만 로그인 하면 되므로 보다 강\n력한 패스워드를 사용해야 한다.\n③ 정적 패스워드는 보안에 취약하므로 이중요소 인\n증이나 동적(일회용) 패스워드가 필요하다.\n④ SSO 서버는 타임아웃 임계치의 설정을 허용하고\n일정 기간 동작하지 않은 경우 연결을 종료한다.",
  "2018_107": "107. 다음 중 일방향 해시 함수의 응용 예로 가장 적\n절하지 않은 것은?\n① 재전송 공격 방지\n② 메시지 인증 코드 생성\n③ 소프트웨어 변경 여부 검출\n④ 패스워드 기반 암호 시스템\n0 -\n\n=== NEW PAGE ===",
  "2018_108": "108. 다음 설명에 해당하는 제도로 가장 적절한 것은?\n- 조직이 보존해야 할 정보 자산의 기밀성, 무결\n성, 가용성을 실현하는 절차와 과정을 체계적으\n로 수립하고 이를 문서화함\n- 관리 및 운영하는 조직의 체계가 인증 기준에\n적합한지 심사하여 인증을 부여하는 제도\n① CC(Common Criteria) 인증\n② ISMS(Information Security Management System) 인증\n③ TCSEC(Trusted Computer Security Evaluation Criteria)\n④ PIMS(Personal Information Management System) 인증",
  "2018_109": "109. 정량적 위험분석 과정에서 파일서버에 대한 위험,\n가치, 노출 인자(EF : Exposure Factor), 연간\n발생빈도(ARO : Annual Rate of Occurrence)가 다음과\n같을 때, 단일 예상손실액(SLE : Single Loss Ex-\npectancy)과 연간 예상 손실액(ALE : Annual\nLoss Expectancy)은 각각 얼마인가?\n자산 위험 가치 EF SLE ARO ALE\n파일 디스크\n$50,000 0.5 0.2\n서버 장애\n① $50,000, $5,000 ② $25,000, $5,000\n③ $50,000, $10,000 ④ $25,000, $10,000",
  "2018_110": "110. 유닉스/리눅스 환경에서 다음 설명에 해당하는\n것으로 가장 적절한 것은?\n- 본 설정을 하게 되면 프로세스가 실행 도중 일\n시적으로 특정한 권한을 갖게 되어 보안상의 문\n제를 일으킬 수 있음\n- 해당 설정이 버퍼 오버플로우 공격을 통해 악용\n될 경우 루트 권한의 쉘을 공격자가 소유하게\n되기도 함\n① 환경변수 PATH 설정\n② 디렉토리에 대한 sticky 비트 설정\n③ 일반 사용자로의 chown 설정\n④ 실행 파일에 대한 SetUID 설정\n- 21",
  "2018_111": "111. 다음 설명에 해당하는 공격 방법으로 가장 적절\n한 것은?\n공개키 암호 방식을 사용하는 프로토콜에서 통신\n객체(송/수신자)가 전송하는 공개키를 공격자의\n공개키로 바꾸는 공격으로, 사용자의 공개키가 인\n증되지 않은 경우에 가능한 공격 기법\n① 재전송 공격 ② 사전 공격\n③ 중간자 공격 ④ 반사 공격",
  "2018_112": "112. 다음에 제시한 취약점을 이용한 공격 기법으로\n가장 적절한 것은?\n공격자가 작성한 스크립트가 다른 사용자에게 전달\n되는 것으로, 다른 사용자의 웹브라우저 안에서 적\n절한 검증 없이 실행되어 사용자의 세션을 탈취하\n거나 웹사이트를 변조하기도 하며 악의적인 사이트\n로 이동할 수 있음\n① XSS 공격 ② 레이스 컨디션 공격\n③ SQL 인젝션 ④ 디렉토리 리스팅",
  "2018_113": "113. 안드로이드 개발 환경에서 안드로이드 단말기 내\n의 보호대상 자원 혹은 정보에 접근하기 위해 개\n발자가 필요한 권한을 명시해 놓은 파일은?\n① AndroidManifest.xml\n② strings.xml\n③ res/layout activity_프로젝트명.xml\n④ styles.xml",
  "2018_114": "114. 디지털 포렌식과 관련하여 다음에 제시된 하드디\n스크 상의 특정 위치를 지칭하는 용어는?\n- 물리적으로 파일에 할당된 공간이지만 논리적\n으로 사용할 수 없는 공간을 말함\n- 디스크의 경우 512바이트 단위로 접근을 하기\n때문에 해당 공간에 300바이트만 채워진 경우\n212바이트의 유휴 공간이 발생하여 공격자의\n정보 은닉이나 제대로 지워지지 않은 데이터\n의 유출이 발생 가능함\n① 부트 블록 공간 ② 수퍼 블록 공간\n③ 주 파티션 공간 ④ 슬랙 공간\n1 -\n\n=== NEW PAGE ===",
  "2018_115": "115. 개인정보의 안전성 확보조치 기준에서 명시하고\n있는 정보통신망에 대한 불법적인 접근 및 침해\n사고 방지를 위한 접근 통제 조치에 대한 설명으\n로 가장 적절하지 않은 것은?\n① 개인정보처리시스템에 대한 접속 권한을 IP(Internet\nProtocol) 주소 등으로 제한하여 인가받지 않은\n접근을 제한해야 한다.\n② 개인정보처리시스템에 접속한 IP 주소 등을 분석\n하여 불법적인 개인정보 유출 시도를 탐지 및 대\n응해야 한다.\n③ 개인정보처리자는 개인정보의 유출을 방지하기\n위해 개인정보취급자가 정보통신망을 통해 외부\n에서 개인정보처리시스템에 접속할 수 없도록\n해야 한다.\n④ 고유식별 정보를 처리하는 개인정보처리자는 인\n터넷 홈페이지를 통해 고유식별 정보가 유출·변\n조·훼손되지 않도록 연 1회 이상 취약점을 점검\n하고 필요한 보완 조치를 하여야 한다.",
  "2018_116": "116. 다음에 제시된 시스템으로 가장 적절한 것은?\n- 수많은 IT 시스템 및 보안 시스템에서 발생하\n는 로그를 분석하여 이상징후를 파악하고 그\n결과를 경영진에게 보고할 수 있도록 분석결과\n를 종합해 주는 시스템\n- 최근 빅데이터 분석 및 인공지능 기술의 발전\n으로 정보보안 분야에 적극적으로 활용 되는\n시스템\n① DLP(Data Loss Prevention)\n② IPS(Intrusion Prevention System)\n③ MDM(Mobile Device Management)\n④ SIEM(Security Information Event Management)",
  "2018_117": "117. 정보보호 관리체계 인증 등에 관한 고시(과기정\n통부고시 제2017-7호)의 [별표 7] 정보보호 관리\n체계 인증기준 중 물리적 보안 통제분야의 통제\n사항과 가장 거리가 먼 것은?\n① 개발과 운영환경 분리 ② 출입통제\n③ 시스템 배치 및 관리 ④ 개인업무 환경보안\n- 22",
  "2018_118": "118. 주요 통제 목표가 목표복구시간과 목표복구대상\n이며, 전사적인 차원에서 이루어지는 관리활동으\n로 가장 적절한 것은?\n① 위험관리 ② 전사적 자원 관리\n③ 업무 연속성 관리 ④ 재난 복구 계획 관리",
  "2018_119": "119. 정보통신서비스 제공자가 이용자의 동의 없이 개\n인정보를 수집·이용할 수 있는 경우로 가장 거\n리가 먼 것은?\n① 이용자 또는 그 법정대리인이 의사표시를 할 수\n없는 상태에 있거나 주소불명 등으로 사전 동의를\n받을 수 없는 경우\n② 정보통신서비스의 제공에 관한 계약을 이행하기\n위하여 필요한 개인정보로서 경제적·기술적인\n사유로 통상적인 동의를 받는 것이 뚜렷하게 곤\n란한 경우\n③ 정보통신서비스의 제공에 따른 요금정산을 위하여\n필요한 경우\n④ 정보통신망법 또는 다른 법률에 특별한 규정이\n있는 경우",
  "2018_120": "120. 위험관리 과정에서 위험완화 방법에 대한 설명으\n로 가장 거리가 먼 것은?\n① 회피(avoidance): 위험이 존재하는 프로세스나\n사업을 수행하지 않는 것\n② 이전(transfer): 위험의 잠재적 비용을 상대방에게\n이전하거나 분배하는 것\n③ 감소(reduction): 위험을 감소시킬 수 있는 대책\n을 채택하여 구현하는 것\n④ 수용(acceptance): 위험을 받아들이고 비용을 감\n수하는 것\n2 -",
  "2019_101": "101. BIBA 모델에서 주체는 자신보다 낮은 무결성 수\n준의 데이터를 읽을 수 없다는 규칙으로 가장\n적절한 것은?\n① 단순 보안 규칙(simple security rule)\n② 스타 보안 규칙(*-security rule)\n③ 단순 무결성 규칙(simple integrity rule)\n④ 스타 무결성 규칙(*-integrity rule)",
  "2019_102": "102. RSA 전자서명에서 서명자의 공개키가 (e, n)이고 개인\n키가 (d, n)일 때 메시지 m에 대한 서명은 md mod n\n으로 계산된다. 다음과 같은 절차를 통해 계산되는 서\n명의 유형으로 가장 적절한 것은?\n1) 메시지 작성자가 메시지 m을 작성한 다음 1부터\nn 사이에서 n과 서로소인 난수 k를 선택한 후\nt ≡ mke mod n를 계산하여 서명자에게 전달한다.\n2) 서명자는 u ≡ td mod n, 즉, (mke)d mod n ≡\nmdked mod n ≡ kmd mod n을 계산한 후 메시지\n작성자에게 전달한다.\n3) 메시지 작성자는 u/k ≡ md mod n을 계산하여\n메시지 m에 대한 서명을 구한다.\n① 위임 서명(proxy signature)\n② 은닉 서명(blind signature)\n③ 다중 서명(multi signature)\n④ 부인방지 서명(undeniable signature)",
  "2019_103": "103. 하드디스크에서 일반 사용자가 볼 수 없는 숨김\n영역으로 ATA(AT Attachment)-4에 추가되었으며,\n사용자가 하드디스크를 포맷하거나 삭제했을 때\n도 데이터를 보존할 수 있는 영역으로 가장 적절\n한 것은?\n① HPA(Host Protected Area)\n② MBR(Master Boot Record)\n③ GPT(GUID Partition Table)\n④ Swap Space\n- 21",
  "2019_104": "104. 다음에서 설명하는 공격 방법으로 가장 적절한 것은?\n공격자가 다양한 첨단 보안 위협을 이용하여 특정 기\n업이나 조직의 네트워크에 지능적인 방법을 사용하여\n지속적으로 가하는 공격으로, 제로데이 공격과 같이\n기존에 알려지지 않았던 취약점을 다양하게 활용하여\n공격한다.\n① MACOF 공격 ② XSS 공격\n③ APT 공격 ④ DLL 인젝션",
  "2019_105": "105. 다음 중 정성적 위험분석 방법과 가장 거리가 먼 것은?\n① 수학공식 접근법 ② 델파이법\n③ 시나리오법 ④ 순위결정법",
  "2019_106": "106. 무선랜 보안을 위한 표준인 IEEE 802.11i에서는\n데이터 무결성과 기밀성을 제공하기 위해 CCMP\n(Counter mode with CBC-MAC Protocol) 프로토\n콜을 규정하고 있다. CCMP에서 사용하는 암호화\n알고리즘으로 맞는 것은?\n① RC4 ② AES ③ 3DES ④ TKIP",
  "2019_107": "107. 유닉스 로그에 대한 설명으로 바르게 연결된 것은?\n(가) 은(는) 현재 로그인 사용자의 아이디, 사용자\n프로세스, 실행 레벨, 로그인 종류 등을 기록\n(나) 은(는) 사용자 로그인·로그아웃 시간, 세션\n지속 시간, 시스템 종료·시작 시간을 기록\n(다) 은(는) 명령 창에서 실행한 명령을 기록\n(가) (나) (다)\n① wtmp utmp history\n② wtmp history utmp\n③ utmp wtmp history\n④ utmp history wtmp",
  "2019_108": "108.「개인정보보호법」상 공공기관의 장이 개인정보\n영향평가를 하는 경우 고려해야 할 사항으로\n가장 거리가 먼 것은?\n① 개인정보 취급자 역량\n② 개인정보의 제3자 제공 여부\n③ 정보주체의 권리를 해할 가능성 및 그 위험 정도\n④ 처리하는 개인정보의 수\n1 -\n\n=== NEW PAGE ===",
  "2019_109": "109.「개인정보의 기술적·관리적 보호조치 기준」상\n정보통신서비스 제공자 등이 개인정보처리시스\n템에 대한 접근권한과 접속기록의 위·변조 방\n지에 관한 조항의 일부이다. (가), (나)에 들\n어갈 내용으로 바르게 연결한 것은?\n제4조(접근통제) ① 정보통신서비스 제공자 등은\n개인정보처리시스템에 대한 접근권한을 서비스\n제공을 위하여 필요한 개인정보관리책임자 또는\n개인정보취급자에게만 부여한다.\n② 정보통신서비스 제공자 등은 전보 또는 퇴직 등\n인사이동이 발생하여 개인정보취급자가 변경되었\n을 경우 지체 없이 개인정보처리시스템의 접근권\n한을 변경 또는 말소한다.\n③ 정보통신서비스 제공자 등은 제1항 및 제2항에\n의한 권한 부여, 변경 또는 말소에 대한 내역을\n기록하고, 그 기록을 최소 (가)간 보관한다.\n제5조(접속기록의 위·변조방지) ① 정보통신서비스\n제공자 등은 개인정보취급자가 개인정보처리시스\n템에 접속한 기록을 월 1회 이상 정기적으로 확\n인·감독하여야 하며, 시스템 이상 유무의 확인\n등을 위해 최소 (나) 이상 접속기록을 보존·관\n리하여야 한다.\n② 단, 제1항의 규정에도 불구하고 「전기통신사업법」\n제5조의 규정에 따른 기간통신사업자의 경우에는\n보존·관리해야할 최소 기간을 2년으로 한다.\n① (가) 5년 (나) 3개월\n② (가) 5년 (나) 6개월\n③ (가) 3년 (나) 3개월\n④ (가) 3년 (나) 6개월",
  "2019_110": "110. 유닉스 계열 시스템에서 발생 가능한 공격 유형\n중의 하나를 설명하고 있다. 다음에서 설명하는\n공격 유형으로 가장 적절한 것은?\n권한 수준이 다른 두 프로세스의 경쟁 관계를 이용한\n공격으로, 관리자의 권한으로 실행되는 프로그램 중간\n에 끼어들어 자신이 원하는 작업을 수행하는 것이다.\n① 트랩 도어(trap door)\n② 포맷 스트링(format string)\n③ 레이스 컨디션(race condition)\n④ 버퍼 오버플로우(buffer overflow)\n- 22",
  "2019_111": "111. 디지털 포렌식의 기본원칙에 대한 설명 중 가장\n적절하지 않은 것은?\n① 정당성의 원칙이란 모든 증거는 적법한 절차를\n통해 획득해야 한다는 것을 의미한다.\n② 재현의 원칙이란 증거를 제출하려면 환경이나\n조건이 바뀌어도 같은 결과가 나오도록 재현할\n수 있어야 한다는 것을 의미한다.\n③ 신속성의 원칙이란 컴퓨터 내부의 정보는 휘발\n성을 가진 것이 많기 때문에 신속하게 이뤄져야\n한다는 것을 의미한다.\n④ 무결성의 원칙이란 각 단계를 거치는 과정에서\n증거가 위조 및 변조되어서는 안되며, 이러한\n사항을 매번 확인해야 한다는 것을 의미한다.",
  "2019_112": "112. 웹 애플리케이션에서 발생하는 취약점을 예방하\n기 위해 사용하는 입력값 검증 방법에 대한 설\n명으로 가장 옳지 않은 것은?\n① 크로스사이트 스크립팅 공격을 예방하려면 외부\n에서 스크립트 코드를 입력하지 못하도록 방어\n하는 방법이 효과적이다.\n② 입력값 검증 시 대부분의 입력값은 허용하고 일\n부 특정 입력값만 차단하는 방식을 블랙리스트\n필터링 방식이라 한다.\n③ 사용자 입력값 검증 코드는 클라이언트 측에서\n자바 스크립트 등을 이용하여 필터링 하는 방식\n으로 구현하는 것이 가장 안전하다.\n④ SQL 인젝션 공격을 예방하려면 prepared statement\n객체를 이용하여 데이터베이스에 컴파일 된 쿼\n리문을 전달하는 방식이 안전하다.",
  "2019_113": "113. 웹 취약점을 이용한 공격 방법의 하나인 CSRF\n(Cross-Site Request Forgery)에 대한 설명으로\n가장 적절하지 않은 것은?\n① 웹 페이지에 삽입되어 있는 공격 코드가 이용된다.\n② 웹 서버에 접속해 있는 사용자에 대한 서버의\n신뢰를 악용하는 공격이다.\n③ 공격 대상 클라이언트 호스트의 웹 브라우저를\n통해 클라이언트 상의 사용자 정보가 유출될 수\n있다.\n④ XSS(Cross-Site Script)와 마찬가지로 공격\n코드는 자바스크립트 형태로 삽입될 수 있다.\n2 -\n\n=== NEW PAGE ===",
  "2019_114": "114. OSI 7계층 참조모델의 응용계층에 대한 공격 기\n법에 해당하는 것은?\n① TCP SYN flooding 공격 ② smurf 공격\n③ ARP spoofing 공격 ④ slowloris 공격",
  "2019_115": "115. 카나리 단어(canary word) 기법이나 ASLR(Address\nSpace Layout Randomization)은 어떠한 유형의\n공격에 대응하기 위한 방법들인가?\n① 업로드 공격 ② XSS 공격\n③ 버퍼 오버플로우 공격 ④ 인젝션 공격",
  "2019_116": "116. 다음 공격 시나리오가 제시하는 2단계의 공격\n기법으로 가장 적절한 것은?\n같은 네트워크 내에 위조된 웹서버를 설치하고 공\n격대상의 특정 웹사이트에 대한 접속 시도 시 위\n조된 웹서버에 접속하는 상황을 만들고자 한다.\n공격자 컴퓨터 역시 같은 네트워크에서 공격 성공\n을 위해 2단계 공격을 진행한다.\n(1단계) 공격대상 클라이언트가 요청하는 URL을\n가로채 어떤 서버에 접근하는지를 알아낸다.\n(2단계) 요청 URL에 대응되는 위조된 웹페이지의\n컴퓨터 주소를 공격 대상 클라이언트에 전달해준다.\n① 1단계: ARP spoofing 공격, 2단계: SYN flooding 공격\n② 1단계: smurf 공격, 2단계: ping sweep 공격\n③ 1단계: ARP spoofing 공격, 2단계: DNS spoofing 공격\n④ 1단계: ping sweep 공격, 2단계: SYN flooding 공격",
  "2019_117": "117. 다음에서 설명하는 악성코드로 가장 적절한 것은?\n보안관리자나 보안 시스템의 탐지를 피하면서 시스\n템을 제어하기 위해 공격자가 설치하는 악성파일로\n운영체제의 합법적인 명령어를 해킹하여 모아놓은\n것을 말한다. 컴퓨터의 운영체제에서 실행 파일과\n실행 중인 프로세스를 숨김으로써 운영체제 검사\n및 백신 프로그램의 탐지를 피할 수 있다.\n① 웜(worm) ② 루트킷(rootkit)\n③ 논리폭탄(logic bomb) ④ 스파이웨어(spyware)\n- 23",
  "2019_118": "118. 아래의 블록 암호 운용 모드 중 평문 블록의 변\n경이 해당 블록의 암호문만 변경시킬 뿐 다른\n블록의 암호문에는 전혀 영향을 미치지 않는 모\n드는 모두 몇 개인가?\n- ECB(Electronic CodeBook)\n- CBC(Cipher Block Chaining)\n- CFB(Cipher FeedBack)\n- OFB(Output FeedBack)\n- CTR(CounTeR)\n① 1개 ② 2개 ③ 3개 ④ 4개",
  "2019_119": "119. 다음 중 블록체인의 각 블록들을 연결해 주고\n트랜잭션의 위·변조를 막기 위해 활용될 수 있\n는 암호기술로 가장 적절한 것은?\n① AES ② DES ③ SHA ④ RSA",
  "2019_120": "120. SSL(Secure Socket Layer) 프로토콜에 대한 설명\n으로 가장 거리가 먼 것은?\n① 네트워크 계층에 적용되며 패킷 단위의 데이터\n암호화 기능을 제공한다.\n② 서버 인증, 클라이언트 인증, 암호화 세션 기능을\n제공한다.\n③ SSL이 적용된 웹 애플리케션의 URL은 http://\n대신에 https://를 사용한다.\n④ 웹 서비스, 이메일 및 다른 애플리케이션에서도\n사용될 수 있다.\n3 -",
  "2020_101": "101. 다음 설명에 해당하는 SSL 프로토콜으로 가장 적\n절한 것은?\n상위 계층으로부터 오는 메시지를 전달하며, 메시\n지는 단편화되거나 선택적으로 압축된다. MAC은\n협의된 해시 알고리즘을 사용하여 압축된 메시지\n를 추가한다. 압축된 단편화와 MAC은 협의된 암호\n화 알고리즘을 사용하여 암호화된다.\n① Record 프로토콜\n② Alert 프로토콜\n③ ChangeCipherSpec 프로토콜\n④ Handshake 프로토콜",
  "2020_102": "102. 다음에서 설명하는 보호대책을 통해 방어하고자\n하는 공격 유형으로 가장 적절한 것은?\n방어 기법 1. 주소공간 배치에 대한 난수화 설정\n으로 공격자가 메모리 내 특정 정보의 위치를 추\n정하지 못하게 한다.\n방어 기법 2. 프로그램 내 스택에서의 명령어 실행\n기능을 제한해야 한다.\n방어 기법 3. 스택가드(stack guard) 기능을 활성화\n하여 스택을 보호하는 것이 필요하다.\n① 버퍼 오버플로우(buffer overflow) 공격\n② 레이스 컨디션(race condition) 악용\n③ SQL 인젝션(injection)\n④ 환경변수 취약점 공격",
  "2020_103": "103. 위험 평가 방법 중 정량적 분석법에 대한 설명으로\n가장 적절하지 않은 것은?\n① 많은 데이터의 입력이 필요하며 복잡한 계산을\n필요로 한다.\n② 금액으로 산정하기 어려운 정보의 평가에 용이하게\n사용된다.\n③ 정보보호 대책의 비용을 정당화하고 위험 분석의\n결과를 이해하기 쉽다.\n④ 과거자료 접근법, 수학공식 접근법, 확률분포 추정법\n등이 이에 포함된다.\n- 21",
  "2020_104": "104. 보안시스템의 개발 원칙에 대한 설명 중 가장 적절\n하지 않은 것은?\n① Complete mediation : 모든 접근 시도는 접근 통\n제 메카니즘에 의해 점검되어야 한다.\n② Fail-safe default : 시스템의 보안성 유지가 안\n된다면, 시스템 운영을 중단하는 것이 좋다.\n③ Least privilege : 시스템을 사용하는 모든 이용\n자는 업무(task)를 수행하는데 필요한 최소의 권\n한만이 주어져야 하고 주어진 권한도 시간에 따라\n달라진다.\n④ Open design : 보안 메카니즘은 비밀로 유지하지\n않고 공개하는 것이 좋다.",
  "2020_105": "105. 다음에서 설명하는 웹 서비스의 주요 구성 요소로\n가장 적절한 것은?\n(가) 웹 서버에서 생성된 난수 값을 클라이언트\n컴퓨터에 저장하여 다음 접속 시 해당 클라\n이언트 컴퓨터를 식별한다.\n(나) 다수 개의 웹 클라이언트들이 동일한 정보를\n요청하는 것에 대비하여 로컬 네트워크 서\n버에 첫 번째 요청된 웹페이지의 내용을 저\n장한다.\n① (가) 웹 방화벽 (나) 웹 로그\n② (가) 웹 로그 (나) 웹 캐시\n③ (가) 쿠키 (나) 웹 방화벽\n④ (가) 쿠키 (나) 웹 캐시",
  "2020_106": "106. 포맷 스트링(format string) 취약점에 대한 설명\n으로 가장 적절하지 않은 것은?\n① printf 함수가 가지고 있는 선택적 매개변수(opt\nional argument)의 특성은 취약점이 될 수 있다.\n② 소프트웨어의 사용자가 포맷 스트링을 지정할 수\n있는 것을 불허하여 취약점 이용에 대처할 수 있다.\n③ 포맷 스트링 %n을 이용하여 메모리의 특정 위치(주\n소)에 값을 지정할 수 있다.\n④ 포맷 스트링 취약점을 이용하여 악성코드를 실행\n하는 것은 불가능하다.\n1 -\n\n=== NEW PAGE ===",
  "2020_107": "107. 클라우드 책임공유 모델(cloud shared responsibility\nmodel)에 따라, SaaS(Software as a Service)를\n사용하는 고객의 보안 책임으로 가장 적절한 것은?\n① 물리 기반 환경에 대한 보안(physical infrastru\n-cture security)\n② 가상화 기반 환경에 대한 보안(virtualized infr\n-astructure security)\n③ 운영체제 시스템에 대한 보안(operating system\nsecurity)\n④ 데이터 접근에 대한 보안(data access security)",
