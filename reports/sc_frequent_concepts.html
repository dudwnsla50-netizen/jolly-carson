  "2025_119": "119. 다음 중 OECD 개인정보보호 원칙으로 가장 적절\n하지 않은 것은?\n① 수집 제한의 원칙 : 개인정보는 적법하고 공정한\n방법을 통해 수집되어야 한다.\n② 정보 정확성의 원칙 : 이용 목적상 필요한 범위\n내에서 개인정보의 정확성, 완전성, 최신성이 확보\n되어야 한다.\n③ 안전성 확보의 원칙 : 개인정보의 침해, 누설, 도용\n등을 방지하기 위한 물리적·조직적·기술적 안전\n조치를 확보해야 한다.\n④ 비공개의 원칙 : 개인정보의 처리 및 보호를 위\n한 정책과 관리자의 정보는 비공개하여야 한다.",
  "2025_120": "120. 다음 중 가명정보의 기술적 보호조치에 대한 설\n명으로 가장 적절하지 않은 것은?\n① 추가정보와 가명정보는 분리하여 보관하는 것을\n원칙으로 하고, 불가피한 사유로 물리적인 분리\n가 어려운 경우 DB 테이블 분리 등 논리적으로\n분리하는 것도 가능하다.\n② 가명정보처리자는 추가정보의 분리 보관, 접근권한\n관리, 접근통제 및 접속기록의 보관/점검 등의\n기술적 보호조치를 취한다.\n③ 추가정보의 활용 목적달성 및 불필요한 경우에는\n추가정보를파기할 수있으며파기에대한 기록을\n작성하고 보관한다.\n④ 개인정보처리자는 가명정보 또는 추가정보에\n접근할 수 있는 담당자를 업무목적 달성에\n필요한 적정 인원으로 지정하며, 접근권한은\n업무에 상관없이 균등 부여한다.\n22 -",
  "2026_101": "101. 다음은 SQL Injection 공격을 예방하기 위한 시큐어\n코딩 기법에 대한 설명이다. SQL Injection 공격을\n예방하기 위해 권장되는 방법을 모두 고른 것으로\n가장 적절한 것은?\n<보기>\nㄱ. Parameterized Query는 SQL 질의문과 사용자 입력\n데이터를 분리하여 처리함으로써 사용자 입력이\nSQL 구문으로 해석되는 것을 방지하는 방법이다.\nㄴ. Stored Procedure는 데이터베이스 내부에 정의된\n프로시저를 사용하여 SQL 문을 실행하는 방식으로,\n입력값을 파라미터로 처리하면 SQL Injection 공격을\n줄일 수 있다.\nㄷ. Dynamic SQL은 프로그램에서 SQL 문을 문자열\n형태로 조합하여 실행하는 방식으로 SQL Injection\n공격을 예방하는 대표적인 방법이다.\nㄹ. 입력값 검증(Input Validation)은 사용자 입력값의\n형식, 길이, 범위 등을 검사하여 악성 입력이 시스템에\n전달되는 것을 차단하는 보안 기법이다.\n① ㄱ, ㄴ ② ㄱ, ㄴ, ㄹ\n③ ㄱ, ㄷ ④ ㄱ, ㄴ, ㄷ, ㄹ",
  "2026_102": "102. 웹 서비스에서 이미지 업로드 기능을 제공하면서,\n확장자 검사와 함께 MIME 타입을 확인하도록\n구현하였으나 여전히 서버 측 스크립트 실행 위험이\n존재한다. 다음 중 가장 적절한 보완 방안은?\n① 업로드된 파일의 파일명을 무작위로 변경하여\n공격자가 경로를 예측하지 못하도록 한다.\n② 업로드 파일 크기를 제한하여 대용량 공격을 방지\n한다.\n③ 이미지 파일은 안전하다고 가정하고 별도의 처리\n없이 웹 루트에 저장한다.\n④ 업로드 파일을 실행 불가능한 별도 저장소에 두고,\n서버에서 직접 해석되지 않도록 분리한다.\n- 21",
  "2026_103": "103. 소스코드 취약점 유형 중에서 다음과 같은 Java\n코드에 존재하는 취약점으로 가장 적절한 것은?\nString price = request.getRawParameter(\"price\");\nint p = Integer.parseInt(price);\ntotal = total + p;\n① SQL Injection 여부\n② 입력값 검증 및 범위 체크\n③ 위험한 형식의 파일 업로드 취약점\n④ 디렉토리 경로 조작",
  "2026_104": "104. 다음은 API 보안 취약점에 대한 설명이다. 각 설명에\n해당하는 취약점으로 가장 올바르게 짝지은 것은?\nA. API에서 요청 대상이 되는 리소스 식별자(resource\nidentifier)를 변경하거나 조작하여 권한이 없는\n다른 사용자의 데이터나 리소스에 접근할 수\n있는 취약점이다. 이 취약점은 API 서버가 요청된\n리소스에 대해 사용자의 접근 권한을 충분히\n검증하지 않을 때 발생한다.\nB. API 요청 처리 과정에서 인증 또는 권한 검증\n절차가 미흡하여, 공격자가 관리자 기능 또는\n민감한 API 기능을 실행할 수 있는 취약점이다.\nAPI에서 인증 정보(예: 토큰, 세션, API Key)의\n검증 또는 관리가 부적절하여 공격자가 정상\n사용자의 인증 상태를 위조하거나 우회하여\nAPI 기능에 접근할 수 있는 취약점이다.\nㄱ. Broken Object Level Authorization\nㄴ. Broken Authentication\nㄷ. Unrestricted Resource Consumption\nㄹ. Security Misconfiguration\n① A-ㄱ, B-ㄴ ② A-ㄴ, B-ㄱ\n③ A-ㄱ, B-ㄷ ④ A-ㄹ, B-ㄴ\n1 -",
  "2026_105": "105. 다음 중 개인정보보호법에 대한 설명으로 적절한\n것을 모두 고른 것은?\n<보기>\nㄱ. 개인정보처리자가 개인정보의 분실·도난·유출\n사실을 알게 된 경우에는, 유출된 개인정보의 항목,\n유출 시점과 경위, 피해 최소화 방법, 개인정보\n처리자의 대응조치 및 구제절차 등을 지체 없이\n정보주체에게 통지하여야 한다.\nㄴ. 개인정보처리자가 개인정보 처리 업무를 제3자에게\n위탁하는 경우에는, 수탁자가 개인정보를 안전하게\n처리하도록 위탁계약에 보호조치 사항 등을 반영\n하고, 수탁자의 처리 실태를 관리·감독하여야 한다.\nㄷ. 개인정보 영향평가(PIA)는 개인정보파일 운영과\n관련된 법정 보유기간이 경과한 개인정보 처리\n기록을 삭제·파기하기 위하여 사후적으로 실시하는\n절차이다.\nㄹ. 개인정보처리자가 개인정보 처리 업무를 위탁하는\n경우에는 위탁하는 업무의 내용과 수탁자의 성명\n(명칭)을 정보주체가 언제든지 쉽게 확인할 수\n있도록 공개하여야 한다.\n① ㄱ, ㄴ ② ㄱ, ㄷ\n③ ㄴ, ㄷ, ㄹ ④ ㄱ, ㄴ, ㄹ",
  "2026_106": "106. 다음 중 정보보호 위험 평가 및 정량적 위험 분석에\n대한 설명으로 가장 적절하지 않은 것은?\n① 정보보호 위험은 일반적으로 위협이 취약점을 이용\n하여 정보 자산에 손실을 발생시킬 가능성과 그\n영향의 결합으로 정의되며, 위험 수준은 보통\nRisk = Likelihood × Impact 형태로 표현된다.\n② 정량적 위험 분석에서는 자산 가치, 위협 발생\n빈도, 취약성 수준 등을 수치화하여 위험도를\n계산할 수 있으며, 일반적으로 Risk = Asset Value ×\nThreat Frequency × Vulnerability 형태로 표현된다.\n③ 연간 예상 손실(ALE: Annualized Loss Expectancy)은\n1회 사고 발생 시 예상 손실(SLE)에 연간 발생\n빈도(ARO)를 곱하여 산정하며, 이는 보안 투자 의사\n결정에 활용될 수 있다.\n④ 정보보호 위험은 시스템의 처리 성능과 네트워크\n처리 속도의 곱으로 산정되며, 성능이 높을수록\n위험 수준은 감소한다.\n- 22",
  "2026_107": "107. 다음 중 클라우드 환경에서 웹 애플리케이션을\n운영할 때, 보안사고 발생 시 신속한 원인 분석과\n대응을 위해 가장 우선적으로 준비해야 할 사항\n으로 적절한 것은?\n① 백업 시스템 도입 및 정책 강화\n② 애플리케이션 코드의 주기적 취약점 점검\n③ 클라우드 리소스의 접근 권한 최소화\n④ 로그 및 감사 기록의 중앙 집중화와 실시간 모니\n터링 체계 구축",
  "2026_108": "108. 다음 중 개인정보보호법 상 개인정보처리자가\n개인정보의 처리에 대하여 정보주체의 동의를\n받는 방법으로 가장 적절하지 않은 것은?\n① 동의 내용이 적힌 서면을 정보주체에게 직접 발급\n하거나 우편 또는 팩스 등의 방법으로 전달하고,\n정보주체가 서명하거나 날인한 동의서를 받는 방법\n② 전화를 통하여 동의 내용을 정보주체에게 알리고\n동의의 의사표시를 확인하는 방법\n③ 전화를 통하여 동의 내용을 정보주체에게 알리고\n정보주체에게 인터넷주소 등을 통하여 동의 사항을\n확인하도록 하는 방법\n④ 인터넷 홈페이지 등에 동의 내용을 게재하고 정보\n주체가 동의 여부를 표시하도록 하는 방법",
  "2026_109": "109. 다음 중 스트림 암호(Stream Cipher)의 일반적인\n특성에 대한 설명으로 가장 적절하지 않은 것은?\n① 스트림 암호는 일반적으로 평문(plaintext)과 키 스트림\n(key stream)을 XOR 연산하여 암호문(ciphertext)을\n생성한다.\n② 스트림 암호는 보통 블록 암호보다 지연(latency)이\n낮고 실시간 통신 환경에서 효율적으로 사용될\n수 있다.\n③ 동일한 키와 초기값(IV)을 의사난수 생성기(PRNG)에\n입력하여 생성된 키 스트림을 서로 다른 여러\n메시지에 재사용할 경우 보안 취약점이 발생할\n수 있다.\n④ 스트림 암호는 전송 중 암호문 내 하나의 비트\n에서 오류가 발생하면, 복호화 과정에서 해당\n위치 이후의 모든 평문 데이터에 오류가 전파되는\n특성을 갖는다.\n2 -",
  "2026_110": "110. 위험관리 시 사이버보안 보험(Insurance)의 가입을\n진행할 경우 이를 지칭하는 잔여위험 처리 방법으로\n적절한 것은?\n① 위험경감 ② 위험회피\n③ 위험전가 ④ 위험수용",
  "2026_111": "111. 금융기관의 배포 보안 강화를 위해 다음과 같은\n통제 요건을 설계하고자 한다. 이에 가장 부합하는\n접근 제어 방식은?\nŸ 소스코드 저장소 접근권한과 배포 승인권한의 분리\nŸ 운영자의 비밀번호 인지 없이 수행되는 야간\n자동배포\nŸ 장애 시 한시적 권한 상향 및 사후 감사 추적성\n확보\n① 역할 기반 접근 제어(RBAC)를 적용해 운영자와\n배포 승인자를 분리하고, 서비스 계정은 고정\n비밀번호를 공유하되 변경 이력만 관리한다.\n② 속성 기반 접근 제어(ABAC)를 적용해 시간, 승인\n상태, 장애 여부 같은 조건에 따라 권한을 판단\n하고, 서비스 계정은 비밀관리 시스템에서 단기\n자격증명으로 발급받아 사용한다.\n③ 임의 접근 제어(DAC)로 저장소 소유자가 권한을\n위임할 수 있게 하고, 긴급 상황에서는 운영자가\n필요한 권한을 직접 추가한다.\n④ 강제 접근 제어(MAC)로 모든 사용자의 접근 등급을\n통합 관리하고, 배포 승인과 운영 권한은 시스템\n관리자가 수동으로 일괄 승인한다.",
  "2026_112": "112. 다음 중 클라우드 환경에서 API 키가 코드 저장소에\n노출된 사실이 확인되었을 때, 즉각적인 대응으로\n가장 적절한 것은?\n① 노출된 키를 폐기하고 새 키를 발급한다.\n② 코드 저장소 접근 권한을 제한한다.\n③ API 키는 일정 기간 후 자동 만료되므로 별도의\n조치는 필요치 않다.\n④ 키를 암호화 시킨다.\n- 23",
  "2026_113": "113. 다음 암호에 대한 설명 중 가장 적절하지 않은\n것은?\n① ID기반 암호는 각 개체의 ID나 메일주소 등을 기\n반으로 공개키가 생성되어 키 관리가 용이하다.\n② 동형암호는 암호화된 데이터의 내용을 모르고\n암호화된 채로 더하거나 곱할 수 있는 암호방\n식으로 클라우드 환경에서 대용량의 민감정보\n를 처리하는 서비스에는 적절하지 못하다.\n③ 프록시 재암호는 암호문을 해독하지 않고 다른\n사람이 해독할 수 있는 암호문으로 변환하는\n암호방식으로 클라우드 서비스에 적용하기 좋\n은 암호이다.\n④ 속성기반 암호는 키와 암호 해독자의 속성을\n지정하여 암호를 해독할 수 있는지 여부를 제어\n할 수 있는 암호방식이다.",
  "2026_114": "114. IoT(사물인터넷) 기기 간의 신뢰 네트워크를 구\n축하기 위해 블록체인 기술을 도입할 때, 보안\n및 운영 측면에서 기대할 수 있는 효과나 고려\n사항으로 다음 중 가장 적절한 것은?\n① 블록체인의 합의 알고리즘을 통해 IoT 기기의\n물리적 복제 방지 기능(PUF)을 소프트웨어적으\n로 대체할 수 있다.\n② 스마트 컨트랙트를 활용하여 기기 간의 인증 및\n접근 제어 로직을 분산화함으로써 중앙 서버의\n단일 장애점(SPOF) 문제를 완화할 수 있다.\n③ 퍼블릭 블록체인을 활용하면 별도의 암호화\n과정 없이도 IoT 기기에서 전송되는 민감 데이터\n의 기밀성을 보장할 수 있다.\n④ 모든 IoT 기기가 풀 노드(Full Node)로 참여하게\n함으로써 네트워크 전체의 에너지 효율성을\n제고하고 통신 지연을 제거할 수 있다.\n3 -",
  "2026_115": "115. 다음은 인공지능(AI) 및 머신러닝 모델에 대한\n보안 공격 유형에 관한 설명이다. 각 설명에 해\n당하는 공격 유형으로 가장 올바르게 짝지어진 것은?\nA. 머신러닝 모델의 학습 단계(training phase)에서\n공격자가 의도적으로 조작된 데이터 또는 잘못된\n라벨이 포함된 데이터를 학습 데이터셋에 삽입하여\n모델이 잘못된 패턴을 학습하도록 만드는 공격이다.\n이 공격은 모델의 학습 과정 자체를 왜곡하여 특정\n입력에 대해 오분류가 발생하도록 유도하거나 모델\n전체의 예측 성능을 저하시킬 수 있다.\nB. 이미 학습이 완료된 머신러닝 모델의 추론 단계\n(inference phase)에서 입력 데이터에 사람이 인식\n하기 어려운 수준의 미세한 변형(perturbation)을\n적용하여 모델의 분류 경계를 교란하고 잘못된\n예측 결과를 출력하도록 만드는 공격이다.\nㄱ. Model Extraction Attack\nㄴ. Model Inversion Attack\nㄷ. Data Poisoning Attack\nㄹ. Adversarial Attack\n① A-ㄹ, B-ㄴ ② A-ㄴ, B-ㄱ\n③ A-ㄱ, B-ㄷ ④ A-ㄷ, B-ㄹ",
  "2026_116": "116. 다음 설명이 지칭하는 공격기법으로 가장 적절한\n것은?\n공격대상 시스템에 설치되어 지속적으로 외부에서\n접근이 가능한 상태를 만들고, 보이지 않는 공격자의\n진입점을 구성하여 권한 있는 명령을 실행할 수\n있도록 한다.\n① 루트킷 ② 웜\n③ 바이러스 ④ 봇넷\n- 24",
  "2026_117": "117. 다음 중에서 웹 응용 프로그램에 대한 DoS 공격\n유형에 대한 설명으로 가장 적절하지 않은 것은?\n① 동적 HTTP Reply 공격은 웹 페이지 응답 메시지를\n지속적으로 요구하는 공격이다.\n② Slow HTTP Header DoS 공격은 서버로 전달할\nHTTP 메시지의 헤더 정보를 비정상적으로 조작해\n웹 서버가 헤더 정보를 완전히 수신할 때까지\n연결을 유지하도록 하는 공격이다.\n③ Slow HTTP POST 공격은 사용자가 웹 서버에\n아이디, 패스워드, 게시글 등을 전송할 때\nPOST 메소드를 이용하여 서버와의 커넥션을\n오래 유지해 웹서버가 정상적인 사용자 접속을\n받아들일 수 없게 하는 공격이다.\n④ HTTP GET Flooding 공격은 GET 메소드를 통해\n특정 페이지를 무한대로 요구하는 공격이다.",
  "2026_118": "118. 다음 중 블록체인 네트워크에서 이클립스 공격\n(Eclipse Attack)에 대한 설명으로 가장 적절한\n것은?\n① 공격자가 네트워크 해시 파워의 과반수를 확보\n하여 블록 생성과 체인 선택을 좌우하고, 특정\n거래를 되돌리거나 이중지불을 수행할 수 있게\n하는 합의(Consensus) 공격이다.\n② 공격자가 다수의 가짜 노드를 생성해 네트워크\n참여자를 압도함으로써, 투표 기반 합의에서\n다수결을 장악하거나 네트워크 신뢰 모델을 붕\n괴시키는 공격이다.\n③ 공격자가 특정 노드의 피어 연결을 의도적으로\n편향 또는 고립시켜 해당 노드가 공격자가 통제\n하는 피어들과만 연결되도록 만들고, 블록 및\n트랜잭션 전파 정보를 왜곡하여 피해 노드의 체인\n인식, 거래 전파, 검증 판단에 영향을 주는 네\n트워크 계층 공격이다.\n④ 생략\n4 -",
  "2026_119": "119. 다음은 방화벽에 대한 설명이다. 이 중 가장\n적절하지 않은 설명은?\n① 상태 기반 방화벽(Stateful Firewall)은 연결 상태\n정보를 추적하여 패킷을 필터링한다.\n② 애플리케이션 방화벽은 HTTP, FTP 등 응용계층\n트래픽을 제어할 수 있다.\n③ 패킷 필터링 방화벽은 데이터의 내용(payload)을\n깊이 분석하여 공격을 탐지한다.\n④ 방화벽은 네트워크 경계에서 접근제어 정책을\n적용한다.",
  "2026_120": "120. 다음은 네트워크 보안 기술 및 대표적인 네트워크\n공격 유형에 대한 설명이다. 이 중 가장 적절하지\n않은 설명은?\n① 네트워크 세그멘테이션(Network Segmentation)은\n네트워크를 여러 보안 영역으로 논리적 또는\n물리적으로 분리하여 공격 확산을 방지하고\n보안 정책 적용을 용이하게 하는 보안 기법이다.\n② TLS(Transport Layer Security)는 통신 데이터의\n기밀성과 무결성 기능 대신에 안전한 네트워크\n라우팅 기능을 제공하기 위한 보안 프로토콜이다.\n③ DNSSEC(Domain Name System Security Extensions)는\nDNS 응답 데이터의 무결성(integrity)과 출처 인증\n(authentication of origin)을 제공하기 위한 보안\n기술이다.\n④ Smurf Attack은 네트워크 자원을 소모시켜 정상\n적인 서비스를 제공하지 못하게 하는 서비스 거부\n공격(DoS) 유형에 해당한다.\n- 25\n5 -"

                            </div>
                            
                            <div id="memo-edit-mode-${idx}" style="display: none;">
                                <textarea class="memo-textarea" id="memo-input-${idx}" placeholder="이 개념에 대해 암기해야 할 사항이나 팁을 기록해보세요..."></textarea>
                                <div class="memo-btn-group" style="margin-top: 0.5rem;">
                                    <button class="memo-btn save" onclick="saveMemo(${idx}, '${item.concept}')">저장</button>
                                    <button class="memo-btn" onclick="cancelMemoEdit(${idx})">취소</button>
                                </div>
                            </div>
                        </div>

                        <div class="section-title">출제 기출문제 선택 (클릭 시 하단에 문제 전환)</div>
                        <div class="year-grid">
                            ${yearButtonsHtml}
                        </div>
                        
                        <div class="inline-question-viewer" id="viewer-${idx}" style="display: none;">
                            <div class="viewer-header">
                                <span class="viewer-title" id="viewer-title-${idx}"></span>
                                <button class="viewer-close-btn" onclick="closeInlineViewer(${idx}, event)">문제 숨기기</button>
                            </div>
                            <div class="viewer-body" id="viewer-body-${idx}"></div>
                            
                            <div class="viewer-img-container" id="viewer-img-container-${idx}" style="margin-top: 1rem; border-top: 1px dashed rgba(255,255,255,0.06); padding-top: 1rem;">
                                <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.6rem; font-weight: 700;">
                                    ▼ 시험지 원본 이미지 (다이어그램 및 수식 확인용)
                                </div>
                                <img src="" id="viewer-img-${idx}" class="question-img" style="max-width: 100%; height: auto; border-radius: 6px; border: 1px solid rgba(255,255,255,0.05); display: block;" onerror="hideImageContainer(${idx})">
                            </div>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(accItem);
            loadMemo(idx, item.concept);
        });
    }

    function hideImageContainer(idx) {
        const container = document.getElementById(`viewer-img-container-${idx}`);
        if (container) {
            container.style.display = 'none';
        }
    }

    let isServerConnected = false;
    let serverMemos = {};
    const API_URL = 'http://127.0.0.1:5000/api/sc/memos';

    async function initMemos() {
        const badge = document.getElementById('storage-badge');
        try {
            const response = await fetch(API_URL, {
                method: 'GET',
                mode: 'cors'
            });
            if (response.ok) {
                serverMemos = await response.json();
                isServerConnected = true;
                
                badge.className = 'badge accent';
                badge.style.background = 'rgba(16, 185, 129, 0.12)';
                badge.style.borderColor = 'rgba(16, 185, 129, 0.25)';
                badge.style.color = '#10b981';
                badge.innerHTML = '● 파일 저장 모드 (Active)';
                badge.title = '공부 코멘트가 e:\jolly-carson\data\sc_memos.json 파일에 영구 보존됩니다.';
                
                checkMigration();
            } else {
                throw new Error("API response error");
            }
        } catch (e) {
            isServerConnected = false;
            badge.className = 'badge';
            badge.style.background = 'rgba(239, 68, 68, 0.12)';
            badge.style.borderColor = 'rgba(239, 68, 68, 0.25)';
            badge.style.color = '#f87171';
            badge.innerHTML = '● 브라우저 저장 모드 (Offline)';
            badge.title = 'Flask 서버가 꺼진 상태입니다. 복구를 위해 임시로 브라우저 LocalStorage에 저장됩니다.';
        }
        
        topicMapping.forEach((item, idx) => {
            loadMemo(idx, item.concept);
        });
    }

    function checkMigration() {
        const localKeys = [];
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && key.startsWith('sc_memo_')) {
                localKeys.push(key);
            }
        }
        
        if (localKeys.length > 0) {
            const banner = document.getElementById('migration-banner');
            const countEl = document.getElementById('migration-count');
            if (banner && countEl) {
                countEl.textContent = localKeys.length;
                banner.style.display = 'block';
            }
        }
    }

    async function migrateMemos() {
        const localKeys = [];
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && key.startsWith('sc_memo_')) {
                localKeys.push(key);
            }
        }
        
        if (localKeys.length === 0) return;
        
        if (!confirm(`브라우저에 임시 저장된 공부 노트 ${localKeys.length}개를 서버 파일로 통합하시겠습니까? (이전 완료 시 브라우저 내의 데이터는 정리됩니다.)`)) {
            return;
        }
        
        let successCount = 0;
        const banner = document.getElementById('migration-banner');
        
        for (const key of localKeys) {
            const conceptName = key.replace('sc_memo_', '');
            try {
                const dataStr = localStorage.getItem(key);
                if (dataStr) {
                    const data = JSON.parse(dataStr);
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            concept: conceptName,
                            text: data.text,
                            updatedAt: data.updatedAt,
                            action: 'save'
                        })
                    });
                    
                    if (response.ok) {
                        localStorage.removeItem(key);
                        serverMemos[conceptName] = {
                            text: data.text,
                            updatedAt: data.updatedAt
                        };
                        successCount++;
                    }
                }
            } catch (err) {
                console.error(`마이그레이션 오류 (${conceptName}):`, err);
            }
        }
        
        alert(`공부 코멘트 ${successCount}개가 성공적으로 서버 파일(sc_memos.json)에 병합되었습니다.`);
        banner.style.display = 'none';
        
        renderTopics();
    }

    function loadMemo(idx, conceptName) {
        const displayEl = document.getElementById(`memo-display-${idx}`);
        const dateEl = document.getElementById(`memo-date-${idx}`);
        const deleteBtn = document.getElementById(`memo-delete-btn-${idx}`);
        const inputEl = document.getElementById(`memo-input-${idx}`);
        
        let memoData = null;
        
        if (isServerConnected) {
            if (serverMemos && serverMemos[conceptName]) {
                memoData = serverMemos[conceptName];
            }
        } else {
            const key = `sc_memo_${conceptName}`;
            const dataStr = localStorage.getItem(key);
            if (dataStr) {
                try {
                    memoData = JSON.parse(dataStr);
                } catch (e) {
                    localStorage.removeItem(key);
                }
            }
        }
        
        if (displayEl && dateEl && deleteBtn && inputEl) {
            if (memoData) {
                displayEl.innerHTML = '';
                displayEl.textContent = memoData.text;
                dateEl.textContent = `최근 수정: ${memoData.updatedAt}`;
                deleteBtn.style.display = 'inline-block';
                inputEl.value = memoData.text;
            } else {
                displayEl.innerHTML = `<span class="memo-placeholder">등록된 공부 메모가 없습니다. 나만의 학습 팁을 적어 수험 공부 효율을 높여보세요!</span>`;
                dateEl.textContent = '최근 수정일시 없음';
                deleteBtn.style.display = 'none';
                inputEl.value = '';
            }
        }
    }

    function enableMemoEdit(idx) {
        document.getElementById(`memo-view-mode-${idx}`).style.display = 'none';
        document.getElementById(`memo-edit-mode-${idx}`).style.display = 'block';
        
        const content = document.getElementById(`accordion-${idx}`).querySelector('.accordion-content');
        content.style.maxHeight = 'none';
        setTimeout(() => {
            content.style.maxHeight = content.scrollHeight + 'px';
        }, 50);
    }

    function cancelMemoEdit(idx) {
        document.getElementById(`memo-view-mode-${idx}`).style.display = 'block';
        document.getElementById(`memo-edit-mode-${idx}`).style.display = 'none';
        
        const content = document.getElementById(`accordion-${idx}`).querySelector('.accordion-content');
        content.style.maxHeight = 'none';
        setTimeout(() => {
            content.style.maxHeight = content.scrollHeight + 'px';
        }, 50);
    }

    async function saveMemo(idx, conceptName) {
        const text = document.getElementById(`memo-input-${idx}`).value.trim();
        if (!text) {
            alert("공부 메모 내용을 입력해주세요.");
            return;
        }
        
        const now = new Date();
        const formattedDate = now.getFullYear() + '-' + 
            String(now.getMonth() + 1).padStart(2, '0') + '-' + 
            String(now.getDate()).padStart(2, '0') + ' ' + 
            String(now.getHours()).padStart(2, '0') + ':' + 
            String(now.getMinutes()).padStart(2, '0') + ':' + 
            String(now.getSeconds()).padStart(2, '0');
            
        if (isServerConnected) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        concept: conceptName,
                        text: text,
                        updatedAt: formattedDate,
                        action: 'save'
                    })
                });
                
                if (response.ok) {
                    serverMemos[conceptName] = {
                        text: text,
                        updatedAt: formattedDate
                    };
                } else {
                    const errData = await response.json();
                    throw new Error(errData.message || "서버 파일 저장에 실패했습니다.");
                }
            } catch (err) {
                alert(`[오류] 서버 파일 저장 실패: ${err.message}. 임시로 브라우저에 저장합니다.`);
                localStorage.setItem(`sc_memo_${conceptName}`, JSON.stringify({ text, updatedAt: formattedDate }));
            }
        } else {
            localStorage.setItem(`sc_memo_${conceptName}`, JSON.stringify({ text, updatedAt: formattedDate }));
        }
        
        document.getElementById(`memo-view-mode-${idx}`).style.display = 'block';
        document.getElementById(`memo-edit-mode-${idx}`).style.display = 'none';
        loadMemo(idx, conceptName);
        
        const content = document.getElementById(`accordion-${idx}`).querySelector('.accordion-content');
        content.style.maxHeight = 'none';
        setTimeout(() => {
            const newHeight = content.scrollHeight;
            content.style.maxHeight = newHeight + 'px';
        }, 50);
    }

    async function deleteMemo(idx, conceptName) {
        if (!confirm("작성하신 공부 노트를 완전히 삭제하시겠습니까?")) {
            return;
        }
        
        if (isServerConnected) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        concept: conceptName,
                        action: 'delete'
                    })
                });
                
                if (response.ok) {
                    if (serverMemos[conceptName]) {
                        delete serverMemos[conceptName];
                    }
                } else {
                    const errData = await response.json();
                    throw new Error(errData.message || "서버 파일 삭제에 실패했습니다.");
                }
            } catch (err) {
                alert(`[오류] 서버 파일 삭제 실패: ${err.message}.`);
                return;
            }
        } else {
            const key = `sc_memo_${conceptName}`;
            localStorage.removeItem(key);
        }
        
        loadMemo(idx, conceptName);
        
        const content = document.getElementById(`accordion-${idx}`).querySelector('.accordion-content');
        content.style.maxHeight = 'none';
        setTimeout(() => {
            const newHeight = content.scrollHeight;
            content.style.maxHeight = newHeight + 'px';
        }, 50);
    }

    function filterCategory(category) {
        currentCategory = category;
        document.querySelectorAll('.filter-btn').forEach(btn => {
            if (btn.textContent === category) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        renderTopics();
    }

    function toggleAccordion(index) {
        const item = document.getElementById(`accordion-${index}`);
        const content = item.querySelector('.accordion-content');
        const isActive = item.classList.contains('active');

        document.querySelectorAll('.accordion-item').forEach((el, i) => {
            if (i !== index) {
                el.classList.remove('active');
                el.querySelector('.accordion-content').style.maxHeight = '0px';
            }
        });

        if (!isActive) {
            item.classList.add('active');
            
            let filtered = topicMapping;
            if (currentCategory !== '전체') {
                filtered = topicMapping.filter(item => item.category === currentCategory);
            }
            const dataObj = filtered[index];
            
            if (dataObj && dataObj.rep_question) {
                const viewer = document.getElementById(`viewer-${index}`);
                const titleEl = document.getElementById(`viewer-title-${index}`);
                const bodyEl = document.getElementById(`viewer-body-${index}`);
                const imgEl = document.getElementById(`viewer-img-${index}`);
                const imgContainer = document.getElementById(`viewer-img-container-${index}`);
                
                titleEl.textContent = `[대표 문제 예시] ${dataObj.rep_year}년 기출 ${dataObj.rep_num}번`;
                bodyEl.textContent = dataObj.rep_question;
                
                if (imgEl && imgContainer) {
                    imgContainer.style.display = 'block';
                    imgEl.src = `images/${dataObj.rep_year}_${dataObj.rep_num}.png`;
                }
                
                viewer.style.display = 'flex';
                
                item.querySelectorAll('.year-btn').forEach(btn => btn.classList.remove('active-btn'));
                setTimeout(() => {
                    const activeBtn = item.querySelector(`.q-btn-${dataObj.rep_year}-${dataObj.rep_num}`);
                    if (activeBtn) {
                        activeBtn.classList.add('active-btn');
                    }
                }, 50);
            }
            
            setTimeout(() => {
                content.style.maxHeight = content.scrollHeight + 'px';
            }, 150);
        } else {
            item.classList.remove('active');
            content.style.maxHeight = '0px';
        }
    }

    function openQuestion(year, num, idx, btnElement) {
        const key = `${year}_${num}`;
        const questionText = examDatabase[key] || "해당 기출문제를 데이터베이스에서 찾을 수 없습니다.";
        
        const item = document.getElementById(`accordion-${idx}`);
        const content = item.querySelector('.accordion-content');
        
        item.querySelectorAll('.year-btn').forEach(btn => btn.classList.remove('active-btn'));
        
        if (btnElement) {
            btnElement.classList.add('active-btn');
        }
        
        const viewer = document.getElementById(`viewer-${idx}`);
        const titleEl = document.getElementById(`viewer-title-${idx}`);
        const bodyEl = document.getElementById(`viewer-body-${idx}`);
        const imgEl = document.getElementById(`viewer-img-${idx}`);
        const imgContainer = document.getElementById(`viewer-img-container-${idx}`);
        
        titleEl.textContent = `${year}년도 감리사 기출 ${num}번`;
        bodyEl.textContent = questionText;
        
        if (imgEl && imgContainer) {
            imgContainer.style.display = 'block';
            imgEl.src = `images/${year}_${num}.png`;
        }
        
        viewer.style.display = 'flex';
        
        content.style.maxHeight = 'none';
        setTimeout(() => {
            const newHeight = content.scrollHeight;
            content.style.maxHeight = newHeight + 'px';
        }, 50);
    }

    function closeInlineViewer(idx, event) {
        if (event) event.stopPropagation();
        
        const item = document.getElementById(`accordion-${idx}`);
        const content = item.querySelector('.accordion-content');
        
        item.querySelectorAll('.year-btn').forEach(btn => btn.classList.remove('active-btn'));
        
        const viewer = document.getElementById(`viewer-${idx}`);
        viewer.style.display = 'none';
        
        content.style.maxHeight = 'none';
        setTimeout(() => {
            const newHeight = content.scrollHeight;
            content.style.maxHeight = newHeight + 'px';
        }, 50);
    }

    // [세부 토픽 목록 모달 열기]
    window.openTopicListModal = function() {
        const modal = document.getElementById('topic-modal');
        const listEl = document.getElementById('modal-topic-list');
        listEl.innerHTML = '';
        
        let filtered = topicMapping;
        if (currentCategory !== '전체') {
            filtered = topicMapping.filter(item => item.category === currentCategory);
        }
        
        filtered.forEach((item, idx) => {
            const li = document.createElement('li');
            li.className = 'modal-topic-item';
            li.style.cursor = 'pointer';
            li.onclick = () => {
                closeTopicModal();
                setTimeout(() => {
                    const itemEl = document.getElementById(`accordion-${idx}`);
                    if (itemEl && !itemEl.classList.contains('active')) {
                        toggleAccordion(idx);
                    }
                    if (itemEl) {
                        itemEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 200);
            };
            
            li.innerHTML = `
                <span class="modal-topic-name">${idx + 1}. ${item.concept}</span>
                <span class="modal-topic-count">${item.count}회 출제</span>
            `;
            listEl.appendChild(li);
        });
        
        modal.style.display = 'flex';
        setTimeout(() => {
            modal.classList.add('show');
        }, 10);
    };

    // [세부 토픽 목록 모달 닫기]
    window.closeTopicModal = function(event) {
        const modal = document.getElementById('topic-modal');
        modal.classList.remove('show');
        setTimeout(() => {
            modal.style.display = 'none';
        }, 250);
    };

    renderTopics();
    initMemos();
</script>

<!-- 세부 토픽 목록 팝업 모달 -->
<div id="topic-modal" class="modal-overlay" onclick="closeTopicModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-card-header">
            <h2 class="modal-card-title">🔍 검출된 빈출 세부 토픽 목록</h2>
            <button class="modal-close-x" onclick="closeTopicModal()">✕</button>
        </div>
        <div class="modal-card-body">
            <ul id="modal-topic-list" class="modal-topic-list">
                <!-- 자바스크립트로 동적 로딩 -->
            </ul>
        </div>
    </div>
</div>
</body>
</html>
