<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보안 12개년 빈출 개념 정밀 뷰어</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080b13;
            --card-bg: rgba(17, 24, 39, 0.75);
            --border-color: rgba(255, 255, 255, 0.06);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent-violet: #8b5cf6;
            --accent-blue: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%);
            --accent-glow: rgba(139, 92, 246, 0.12);
            --success: #10b981;
            --card-hover-border: rgba(139, 92, 246, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 2.5rem 1.5rem;
            min-height: 100vh;
            background-image: 
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.06) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.06) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.6rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.6rem;
            letter-spacing: -0.03em;
        }

        header p.subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
        }

        .meta-badges {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .badge {
            background: var(--border-color);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 0.35rem 0.9rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 500;
            backdrop-filter: blur(8px);
        }

        .badge.accent {
            background: rgba(139, 92, 246, 0.12);
            border-color: rgba(139, 92, 246, 0.25);
            color: #c084fc;
        }

        .filter-section {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.45rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .filter-btn:hover, .filter-btn.active {
            border-color: var(--accent-violet);
            color: #ffffff;
            background: rgba(139, 92, 246, 0.08);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .accordion-list {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-bottom: 4rem;
        }

        .accordion-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .accordion-item:hover {
            border-color: var(--card-hover-border);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .accordion-trigger {
            width: 100%;
            background: none;
            border: none;
            color: inherit;
            padding: 1.6rem 1.8rem;
            text-align: left;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .card-title-group {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .rank-badge {
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .concept-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        .category-tag {
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            padding: 0.15rem 0.45rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .freq-count-badge {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.15);
            color: var(--success);
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .card-meta-grid {
            display: grid;
            grid-template-columns: 90px 1fr;
            row-gap: 0.5rem;
            column-gap: 0.8rem;
            width: 100%;
            font-size: 0.88rem;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 0.8rem;
            margin-top: 0.2rem;
        }

        .meta-label {
            color: var(--text-muted);
            font-weight: 600;
        }

        .meta-value {
            color: var(--text-secondary);
            word-break: keep-all;
        }

        .meta-value.accent {
            color: #c8a2c8;
        }

        .accordion-trigger .arrow {
            transition: transform 0.3s ease;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .accordion-item.active .accordion-trigger .arrow {
            transform: rotate(180deg);
            color: var(--accent-violet);
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            background: rgba(0, 0, 0, 0.18);
        }

        .accordion-inner {
            padding: 1.6rem 1.8rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .section-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 0.3rem;
            margin-top: 0.2rem;
        }

        .year-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .year-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.35rem 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .year-btn:hover {
            background: var(--accent-gradient);
            border-color: transparent;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.25);
            transform: translateY(-1px);
        }

        .year-btn.active-btn {
            background: var(--accent-gradient);
            border-color: transparent;
            box-shadow: 0 4px 10px rgba(139, 92, 246, 0.3);
            color: #ffffff;
        }

        .year-btn .num-label {
            opacity: 0.7;
            font-size: 0.7rem;
        }

        .inline-question-viewer {
            background: #090d16;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            transition: all 0.3s ease;
        }

        .viewer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 0.5rem;
        }

        .viewer-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #60a5fa;
            font-family: 'Outfit', sans-serif;
        }

        .viewer-close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: color 0.2s;
        }

        .viewer-close-btn:hover {
            color: #ef4444;
        }

        .viewer-body {
            font-size: 0.92rem;
            line-height: 1.7;
            color: #d1d5db;
            white-space: pre-wrap;
            overflow-y: auto;
            max-height: 400px;
            padding-right: 0.5rem;
        }

        .viewer-body::-webkit-scrollbar {
            width: 6px;
        }
        .viewer-body::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.01);
        }
        .viewer-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
        /* 뱃지 호버 효과 */
        a.badge {
            transition: all 0.2s ease;
        }
        a.badge:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            color: var(--text-primary) !important;
        }

        /* [검출 토픽 팝업 모달 스타일] */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 11, 19, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-card {
            background: rgba(17, 24, 39, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            max-height: 80%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(139, 92, 246, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform: scale(0.9);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-overlay.show .modal-card {
            transform: scale(1);
        }
        .modal-card-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-card-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
        }
        .modal-close-x {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.4rem;
            cursor: pointer;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close-x:hover {
            color: #ffffff;
        }
        .modal-card-body {
            padding: 1rem 1.5rem 1.5rem 1.5rem;
            overflow-y: auto;
        }
        .modal-topic-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .modal-topic-item {
            padding: 0.8rem 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            transition: all 0.2s ease;
            border-radius: 8px;
        }
        .modal-topic-item:hover {
            background: rgba(139, 92, 246, 0.08);
            transform: translateX(4px);
        }
        .modal-topic-name {
            font-size: 0.92rem;
            font-weight: 500;
            color: var(--text-primary);
        }
        .modal-topic-count {
            background: rgba(139, 92, 246, 0.15);
            color: #c084fc;
            border: 1px solid rgba(139, 92, 246, 0.2);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 50px;
            white-space: nowrap;
        }
        span.badge[onclick]:hover {
            background: rgba(255, 255, 255, 0.08) !important;
            border-color: rgba(255, 255, 255, 0.15) !important;
            color: var(--text-primary) !important;
        }

        /* ==================================
           반응형 미디어 쿼리 (모바일 최적화)
        ================================== */
        @media (max-width: 768px) {
            body {
                padding: 1.5rem 0.8rem;
            }

            header h1 {
                font-size: 1.8rem;
                line-height: 1.3;
            }

            header p.subtitle {
                font-size: 0.88rem;
                padding: 0 0.5rem;
                word-break: keep-all;
            }

            .meta-badges {
                gap: 0.5rem;
            }

            .badge {
                padding: 0.25rem 0.6rem;
                font-size: 0.72rem;
            }

            .filter-section {
                gap: 0.4rem;
                margin-bottom: 1.5rem;
            }

            .filter-btn {
                padding: 0.35rem 0.7rem;
                font-size: 0.78rem;
            }

            .accordion-trigger {
                padding: 1.2rem 1rem;
                gap: 0.6rem;
            }

            .concept-title {
                font-size: 1.05rem;
            }

            .rank-badge {
                font-size: 1rem;
            }

            .category-tag, .freq-count-badge {
                font-size: 0.7rem;
                padding: 0.1rem 0.35rem;
            }

            .card-meta-grid {
                grid-template-columns: 80px 1fr;
                font-size: 0.82rem;
                row-gap: 0.4rem;
            }

            .accordion-inner {
                padding: 1.2rem 1rem;
                gap: 1rem;
            }

            .section-title {
                font-size: 0.75rem;
            }

            .year-btn {
                padding: 0.3rem 0.6rem;
                font-size: 0.75rem;
            }

            .inline-question-viewer {
                padding: 0.9rem;
            }

            .viewer-body {
                font-size: 0.85rem;
                max-height: 300px;
            }
            .modal-card {
                width: 95%;
                max-height: 90%;
            }

            .modal-card-header {
                padding: 1rem;
            }

            .modal-card-title {
                font-size: 1.05rem;
            }

            .modal-card-body {
                padding: 0.8rem 1rem 1.2rem 1rem;
            }

            .modal-topic-item {
                padding: 0.6rem 0.8rem;
            }

            .modal-topic-name {
                font-size: 0.85rem;
            }
        }
    
        /* [설계 의도] 시안A: 모드 토글 스위치 및 최적화된 내비게이션 스타일 */
        .navigation-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
            margin-bottom: 2rem;
            width: 100%;
        }
        .mode-switch-wrapper {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(255, 255, 255, 0.02);
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
        }
        .mode-label {
            font-size: 0.88rem;
            font-weight: 600;
            transition: color 0.25s ease;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.08);
            transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px; width: 18px;
            left: 3px; bottom: 3px;
            background-color: #ffffff;
            transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        input:checked + .slider {
            background: var(--accent-gradient);
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.2);
        }
        input:checked + .slider:before {
            transform: translateX(22px);
        }
        .slider.round { border-radius: 34px; }
        .slider.round:before { border-radius: 50%; }
        
        .badge.accent {
            background: rgba(139, 92, 246, 0.12) !important;
            border-color: rgba(139, 92, 246, 0.25) !important;
            color: #ffffff !important;
        }

    </style>
</head>
<body>



<div class="container">
    <header>
        <h1>보안 기출 정밀 분석 대시보드</h1>
        <p class="subtitle">12개년 기출 전수 조사 기반 3회 이상 빈출 세부 토픽 분석 엔진</p>
        
                <div class="navigation-container">
            <div class="mode-switch-wrapper">
                <span class="mode-label" id="label-freq">🔥 빈출 개념순</span>
                <label class="switch">
                    <input type="checkbox" id="dashboard-mode-toggle" onchange="toggleDashboardMode(this)">
                    <span class="slider round"></span>
                </label>
                <span class="mode-label" id="label-official">📋 공식 범위순</span>
            </div>
            
            <div class="meta-badges" id="dynamic-nav-badges">
                <a href="#" class="badge home-badge" onclick="goToHome(event)" style="text-decoration: none; background: var(--accent-gradient); color: #ffffff; border: none; font-weight: 700;">🏠 퀴즈 홈으로</a>
                <a href="se_frequent_concepts.html" class="badge subject-badge" data-freq="se_frequent_concepts.html" data-official="se_official_scopes.html" style="text-decoration: none;">소프트웨어공학</a>
                <a href="pm_frequent_concepts.html" class="badge subject-badge" data-freq="pm_frequent_concepts.html" data-official="pm_official_scopes.html" style="text-decoration: none;">프로젝트 관리</a>
                <a href="db_frequent_concepts.html" class="badge subject-badge" data-freq="db_frequent_concepts.html" data-official="db_official_scopes.html" style="text-decoration: none;">데이터베이스</a>
                <a href="sa_frequent_concepts.html" class="badge subject-badge" data-freq="sa_frequent_concepts.html" data-official="sa_official_scopes.html" style="text-decoration: none;">시스템 아키텍처</a>
                <a href="sc_frequent_concepts.html" class="badge subject-badge" data-freq="sc_frequent_concepts.html" data-official="sc_official_scopes.html" style="text-decoration: none;">보안</a>
            </div>
        </div>
        
        <div class="meta-badges">
            <span class="badge">기출 범위: 2015년 ~ 2026년</span>
            <span class="badge accent">총 분석 데이터: 240 문항</span>
            <span class="badge" onclick="openTopicListModal()" style="cursor: pointer; transition: all 0.2s;" title="클릭 시 검출된 세부 토픽 목록 팝업 열기">
                검출된 빈출 세부 토픽: <span id="topic-count-badge">0</span>개
            </span>
            </div>
    </header>

    <div id="accordion-container" class="accordion-list"></div>


    
<script>

    // [설계 의도] 로컬 오프라인 실행(file:///)과 웹 서버 호스팅(http://) 환경 양쪽 모두에서 퀴즈 대시보드 홈으로 매끄럽게 이동하도록 분기 처리합니다.
    function goToHome(event) {
        event.preventDefault();
        if (window.location.protocol === 'file:') {
            window.location.href = '../index.html';
        } else {
            window.location.href = '/';
        }
    }

    // [설계 의도] 학습 모드 변경에 따라 과목 뱃지의 링크 목적지를 실시간 동적 갱신하고 즉시 이동 처리합니다.
    function toggleDashboardMode(toggleEl) {
        const isOfficial = toggleEl.checked;
        
        // 라벨 색상 하이라이트 전환
        document.getElementById('label-freq').style.color = isOfficial ? 'var(--text-secondary)' : '#ffffff';
        document.getElementById('label-official').style.color = isOfficial ? '#ffffff' : 'var(--text-secondary)';
        
        // 과목별 이동 경로 실시간 매핑
        const badges = document.querySelectorAll('.subject-badge');
        const isLocal = window.location.protocol === 'file:';
        
        badges.forEach(badge => {
            const target = isOfficial ? badge.getAttribute('data-official') : badge.getAttribute('data-freq');
            if (isLocal) {
                badge.href = target;
            } else {
                badge.href = '/reports/' + target;
            }
        });

        // 사용자의 현재 보고 있는 과목에 매칭되는 대시보드로 즉각 리다이렉트
        const currentPath = window.location.pathname;
        let targetRedirect = "";
        badges.forEach(badge => {
            const freqPath = badge.getAttribute('data-freq');
            const officialPath = badge.getAttribute('data-official');
            if (currentPath.includes(freqPath) && isOfficial) {
                targetRedirect = officialPath;
            } else if (currentPath.includes(officialPath) && !isOfficial) {
                targetRedirect = freqPath;
            }
        });

        if (targetRedirect) {
            if (isLocal) {
                window.location.href = targetRedirect;
            } else {
                window.location.href = '/reports/' + targetRedirect;
            }
        }
    }

    // [설계 의도] 페이지 로드 시 현재 페이지 파일명에 매핑되는 모드 스위치 상태 및 배지 컬러를 활성화합니다.
    function initDashboardNav() {
        const toggle = document.getElementById('dashboard-mode-toggle');
        const currentPath = window.location.pathname;
        const isOfficialPage = currentPath.includes('official_scopes');
        
        if (toggle) {
            toggle.checked = isOfficialPage;
            // 라벨 색상 하이라이트 초기화
            document.getElementById('label-freq').style.color = isOfficialPage ? 'var(--text-secondary)' : '#ffffff';
            document.getElementById('label-official').style.color = isOfficialPage ? '#ffffff' : 'var(--text-secondary)';
        }

        const badges = document.querySelectorAll('.subject-badge');
        const isLocal = window.location.protocol === 'file:';
        
        badges.forEach(badge => {
            const target = isOfficialPage ? badge.getAttribute('data-official') : badge.getAttribute('data-freq');
            if (isLocal) {
                badge.href = target;
            } else {
                badge.href = '/reports/' + target;
            }

            // 활성화 배지 하이라이트 (현재 페이지 파일명이 target을 포함하는 경우)
            if (currentPath.includes(target)) {
                badge.classList.add('accent');
                badge.style.color = '#ffffff';
                badge.style.background = 'rgba(139, 92, 246, 0.12)';
                badge.style.borderColor = 'rgba(139, 92, 246, 0.25)';
            } else {
                badge.classList.remove('accent');
            }
        });
    }

    // DOMContentLoaded 시점에 즉시 내비게이션 초기화 적용
    document.addEventListener('DOMContentLoaded', initDashboardNav);

  "2015_105": "105. 정보보호관리체계에 대한 설명 중 가장 거리가\n먼 것은?\n① 취약성은 자산의 잠재적 속성으로서 위협의 이용\n대상으로 정의된다.\n② 관리체계 인증기준과 기업 내 현재의 보호대책\n적용 현황과의 수준 차이를 파악하기 위해 위협\n분석을 수행한다.\n③ 정보보호관리체계 구축을 위한 수행조직은 프로\n젝트팀으로 구성될 수 있으며 우선적으로 관리\n체계 도입 배경과 경영진을 이해시키고 설득할\n수 있는 자료 등을 준비한다.\n④ 정보보호대책이란 위험에 대응하여 자산을 보호하기\n위한 관리적, 물리적, 기술적 대책으로 정의된다.",

  "2016_104": "104. “소프트웨어 개발 보안 가이드(2013.11)”에서\n보안 약점은 7개의 유형으로 분류하여 정의하고\n있다. 다음 중 ‘입력데이터 검증 및 표현’ 유형에\n해당하는 보안약점과 가장 거리가 먼 것은?\n① 부적절한 인가\n② 경로 조작 및 자원 삽입\n③ XPath 삽입\n④ 정수형 오버플로우",
  "2016_105": "105. 시큐어코딩 점검 시 보안약점 탐지에 관한 설명으로\n가장 거리가 먼 것은?\n① 보안약점이 내포된 Bad 코드에서 취약한 함수의\n위치를 정확하게 탐지한 경우 True Positive로\n판정한다.\n② 보안약점이 존재하지 않는 Good 코드에서 보안\n약점의 위치를 탐지하지 못한 경우 False Positive로\n판정한다.\n③ 보안약점이 내포된 Bad 코드에서 취약한 함수의\n위치를 탐지하지 못한 경우 False Negative로 판정\n한다.\n④ 시큐어코딩 점검 시 False Positive에 대해 효과적\n으로 관리하지 못하면 Good 코드에 대해서\n계속적인 분석을 하게 되어 점검효율이 떨어진다.",

  "2016_110": "110. OWASP TOP 10 애플리케이션 보안 위험(2013)에\n대한 설명으로 가장 적절하지 않은 것은?\n① 인젝션은 신뢰할 수 없는 데이터가 명령어나 질\n의문의 일부분으로서 인터프리터에 보내질 때\n발생한다.\n② 크로스 사이트 스크립팅(XSS)은 로그온 된 피해\n자의 취약한 웹 애플리케이션에 피해자의 세션\n쿠키와 기타 다른 인증정보를 자동으로 포함하여\n위조된 HTTP 요청을 강제로 보내도록 하는 것이다.\n③ 취약한 직접 객체 참조는 개발자가 파일, 디렉\n토리, 데이터베이스 키와 같은 내부 구현 객체\n를 참조하는 것을 노출시킬 때 발생한다.\n④ 인증 및 세션 관리 취약점은 공격자가 로그인을\n하지 않은 상태로 서비스에 접근하거나, 다른\n사용자 ID로 가장할 수 있는 방법을 제공한다.",
  "2016_111": "111. 시스템 또는 네트워크에 손상을 입히는 악성\n소프트웨어에 대한 다음 설명으로 가장 적절한\n것은?\n① 트랩도어(Trap Doors)는 세션 하이제킹의\n기본이 되는 기술로 IP 주소를 속여서 공격\n하는 기법이다.\n② 논리 폭탄(Logic Bomb)은 특정한 조건이 만족\n되면 특정형태의 공격을 하는 기법이다.\n③ 트로이목마(Trojan Horses)는 자기 복제 능력이\n있으며 다른 파일을 감염시키는 기법이다.\n④ 웜(Worms)은 인증절차 없이 시스템에 접근하기\n위한 방법을 미리 설정해 놓는 기법이다.",

  "2016_116": "116. 디지털 포렌식 과정에서 수집된 디지털 증거가\n법적 효력을 가지고 증거 능력을 인정받기 위한\n원칙 중 다음 설명에 가장 적절한 것은?\n증거는 획득되고 난 뒤 이송/분석/보관/법정 제출\n이라는 일련의 과정이 명확해야 하고 이러한 과정에\n대한 추적이 가능해야 한다.\n① 정당성의 원칙\n② 무결성의 원칙\n③ 재현의 원칙\n④ 연계 보관성의 원칙(Chain of Custody)\n- 26",
  "2016_117": "117. ISO/IEC 27014에서 명시하고 있는 정보보호 거버\n넌스 프로세스에 대한 설명 중 가장 거리가 먼\n것은?\n① Evaluate: 정보보호 활동의 조직 목표 지원 여\n부를 확인하기 위해 현재의 정보보호 수준을 평\n가해야 한다.\n② Direct: 최고경영층은 정보보호 목표 및 전략에\n대한 방향을 제시해야 한다.\n③ Monitor: 정보보호 활동의 모니터링을 위해서는\n비즈니스 관점의 성과척도를 적용해야 한다.\n④ Assure: 최고경영층은 정보보호 활동의 적절성을\n외부 이해관계자들에게 보고해야 한다.",
  "2016_118": "118. 다음 중 커버로스(Kerberos)에 대한 설명으로\n가장 거리가 먼 것은?\n① 커버로스는 키분배센터(KDC: Key Distribution\nCenter) 기반의 키 관리를 수행한다.\n② 커버로스는 타임스탬프를 이용하여 재전송 공격을\n방지한다.\n③ 커버로스는 RFC 표준으로 키분배뿐만 아니라 사\n용자 인증을 제공한다.\n④ 커버로스를 이용하여 사용자는 키분배 센터로\n부터 상대방의 공개키를 안전하게 수신한다.",
  "2016_119": "119. 다음 설명과 관련성이 가장 많은 프로토콜은?\n- 동일 LAN 상에서 동작하는 컴퓨터들 간에 공격\n발생이 가능함\n- MITM(Man-in-the-Middle) 형태의 공격 발생이\n가능함\n- IP 주소를 MAC 주소로 대응시키기 위해 사용됨\n① ARP\n② RIP\n③ TCP\n④ ICMP\n6 -",
  "2016_120": "120. 정보보호 관리과정 중 다음과 같은 요구사항에\n해당하는 것은?\n- 정보보호 관리체계를 운영하는 과정에서 상시적인\n모니터링을 수행\n- 정기적인 내부감사를 통해 정책 준수 상황을 확인\n- 정보보호 관리체계를 재검토\n- 관리 체계 개선\n① 정보보호 정책 수립 및 범위설정\n② 경영진 책임 및 조직구성\n③ 정보보호대책 구현\n④ 사후관리\n- 27",
  "2017_101": "101. 일회용 비밀번호(OTP: One-Time Password)에 대한\n설명으로 가장 적절한 것은?\n① 벨 연구소(Bell Lab.)에서 개발한 S/KEY 방식은\n유닉스 계열 운영체제의 인증에 사용된다.\n② 생성되어 한번 사용된 인증 값이 노출되는 경우\n재사용이 가능하다.\n③ 이벤트 동기화 방식은 OTP를 생성하기 위해 입력\n값으로 시각을 사용하는 방식이다.\n④ 도전-응답(challenge-response) 방식은 OTP를 생성\n하기 위해 카운트 값을 동일하게 증가시켜 입력\n하는 방식이다.",
  "2017_102": "102. VPN을 구축하기 위해 사용하는 터널링 프로토콜에\n대한 설명으로 가장 적절하지 않은 것은?\n① IPSec은 IP 망에서 안전하게 정보를 전송하는 표\n준화된 3계층 프로토콜로 전송모드와 터널모드가\n있다.\n② Layer2 터널링은 링크 계층에서 구현된 프로토콜로\n비용면에서는 효율적이지만, 터널 종단에서만 인\n증을 제공하므로 다른 계층의 프로토콜과 함께\n사용되는 것이 일반적이다.\n③ PPTP(Point to Point Tunneling Protocol)는 Mic-\nrosoft사가 제안한 방식으로 이동 중인 사용자가\n기업의 home server에 다이얼 업 접속을 하고자\n할 때 사용하는 방식이다.\n④ SSL은 원격 다이얼 업 사용자가 터널링을 통해\n공중망으로 사설망에 연결될 수 있는 기능을\n제공한다.",
  "2017_103": "103. DRM 시스템을 위한 핵심 요소 기술과 가장\n거리가 먼 것은?\n① DOI(Digital Object Identifier)\n② XrML\n③ MPEG\n④ Finger Print Watermarking\n- 21",
  "2017_104": "104. 다음의 개인정보 비식별 조치 방법(’개인정보 비식별\n조치 가이드라인’)은 어떤 것에 해당 하는가?\n홍길동, 35세, 서울 거주, 한국대학 재학\n→ 홍OO, 35세, 서울 거주, OO대학 재학\n① 가명처리(pseudonymization)\n② 데이터 마스킹(data masking)\n③ 데이터 범주화(data suppression)\n④ 총계처리(aggregation)",
  "2017_105": "105. SSL이 제공하는 보안 기능에 대한 설명으로 적절\n하지 않은 것은?\n① 서버와 클라이언트 사이에 전송되는 메시지에 대한\n기밀성 기능을 제공한다.\n② 클라이언트는 신뢰된 인증기관(certificate authority)\n에서 발행된 서버의 인증서를 이용하여 서버를\n인증할 수 있다.\n③ 서버와 클라이언트의 인증서를 이용하여 송/수신\n한 메시지에 대한 부인방지 기능을 제공한다.\n④ 해시 함수(hash function)를 이용하여 서버와 클\n라이언트 사이에 전송되는 메시지에 대한 무결성\n기능을 제공한다.",
  "2017_106": "106. 다음 설명에 가장 적절한 것은?\n디지털 포렌식 과정에서 구동되고 있는 시스템의 휘\n발성 정보를 수집하는 행위를 의미하며, 수집 가능한\n모든 정보의 수집/분석과 함께 이를 바탕으로 한\n사고의 처리까지를 포함한다.\n① 연계 보관성(chain of custody)\n② 법 집행(law enforcement)\n③ 라이브 리스판스(live response)\n④ 디스크 스패닝(disk spanning)\n1 -",
  "2017_107": "107. 전자서명(digital signature) 메커니즘이 제공하는\n기능으로 가장 거리가 먼 것은?\n① 전자서명 메시지에 대한 부인방지(non-repudiation)\n② 전자서명 검증 과정을 통한 메시지의 무결성(integrity)\n③ 메시지 송신자에 대한 인증(authentication)\n④ 송수신 메시지에 대한 비밀성(confidentiality)",
  "2017_108": "108. 소프트웨어 개발시 다음과 같은 HTML 코드에서\n발생 가능한 보안 취약점으로 가장 적절한 것은?\n1: ......\n2: <form name=“MyForm” method=“get” action=“customer.do”>\n3: <input type=text name=“txt1”>\n4: <input type=submit value=“보내기”>\n5: </form>\n6: ......\n① 크로스사이트 요청 위조(CSRF)\n② HTTP 응답 분할\n③ XPath 삽입\n④ LDAP 삽입",
  "2017_109": "109. 평문 11001010을 키 01101100을 이용하여 스트림\n암호 시스템으로 암호화하였을 때 생성된 암호문\n으로 적절한 것은?\n① 10100111 ② 10110111\n③ 10110110 ④ 10100110",
  "2017_110": "110. ‘전자정부 SW 개발·운영자를 위한 소프트웨어 개발\n보안 가이드(행정자치부)‘에서 제시된 소프트웨어\n개발시 업로드 및 다운로드 파일에 대한 검증\n과정과 가장 거리가 먼 것은?\n① 업로드되어 저장되는 파일의 타입, 크기, 개수,\n실행 권한을 제한해야 한다.\n② 업로드되어 저장되는 파일은 외부에서 식별되지\n않아야 한다.\n③ 다운로드되어 저장되는 파일의 중요 기능과 리소\n스에 대해 부인방지 기능을 적용해야 한다.\n④ 파일 다운로드 요청시에 요청 파일명에 대한 검증\n작업을 수행해야 한다.\n- 22",
  "2017_111": "111. 무선 랜(LAN)의 보안 설정으로 가장 거리가 먼\n것은?\n① WPA(Wi-Fi Protected Access)-PSK(Pre-Shared Key)를\n이용하여 암호화를 설정한다.\n② AP(Access Point) 보안을 위해 SSID(Service Set\nIdentifier) 브로드캐스팅을 허용한다.\n③ 무선 랜의 암호화 통신을 위하여 WEP(Wired Equi-\nvalent Privacy) 키를 설정한다.\n④ IEEE 802.1x 솔루션을 도입하여 EAP(Extensible\nAuthentication Protocol)와 함께 무선 랜 인증을\n수행한다.",
  "2017_112": "112. 정보보호 관리체계로 알려져 있는 ISMS(Information\nSecurity Management System)의 업무 수행 절차를\n적절한 순서로 배열한 것은?\n① ISMS 수립 → ISMS 구현과 운영 → ISMS 관리와\n개선 → ISMS 모니터링과 검토\n② ISMS 수립 → ISMS 모니터링과 검토 → ISMS\n구현과 운영 → ISMS 관리와 개선\n③ ISMS 수립 → ISMS 구현과 운영 → ISMS 모니터\n링과 검토 → ISMS 관리와 개선\n④ ISMS 수립 → ISMS 관리와 개선 → ISMS 구현과\n운영 → ISMS 모니터링과 검토",
  "2017_113": "113. 다음 설명에 가장 적절한 것은?\n블루투스의 취약점을 이용하여 장비의 임의 파일에\n접근하는 공격이다. 공격자는 블루투스 장치끼리 인증\n없이 정보를 간편하게 교환하기 위해 개발된 OPP(Object\nPush Profile) 기능을 사용하여 블루투스 장치로부터\n주소록 또는 달력 등의 내용을 요청해 이를 열람하\n거나 취약한 장치의 파일에 접근할 수 있다.\n① 블루스나프(BlueSnarf)\n② 블루프린팅(BluePrinting)\n③ 블루버그(BlueBug)\n④ 워 드라이빙(War Driving)\n2 -",
  "2017_114": "114. 다음은 정보보호의 3대 요소 중 무엇에 관한\n설명인가?\n적절한 권한을 가진 사용자에 의해 인가된 방법\n으로만 정보를 변경할 수 있도록 보장하는 것을\n의미한다.\n① 기밀성(Confidentiality)\n② 완전성(Completeness)\n③ 무결성(Integrity)\n④ 가용성(Availability)",
  "2017_115": "115. 스니퍼(sniffer)는 LAN 카드의 promiscuous mode\n에서 동작하는데, 이 모드를 사용하는 이유로 가장\n적절한 것은?\n① 모든 유입 트래픽 차단\n② 자신의 네트워크에 접근하는 모든 패킷 읽기\n③ 해당 호스트가 다른 호스트와 통신을 원활하게\n할 수 있도록 구성\n④ 해당 NIC(Network Interface Card)로 들어오는\n모든 패킷들을 해당 네트워크 세그먼트로 재전송",
  "2017_116": "116. ‘정보시스템 개발·운영자를 위한 홈페이지 취약점\n진단·제거 가이드(KISA)‘에서 제시된 웹 애플리케이\n션의 취약점으로 인해 발생하는 공격의 피해 형\n태가 나머지 셋과 다른 것은?\n① URL/파라미터 변조 취약점\n② 불충분한 세션 관리 취약점\n③ 디렉터리 인덱싱 취약점\n④ 크로스 사이트 요청 위조(CSRF) 취약점",
  "2017_117": "117. ‘개인정보보호 관리체계(PIMS)의 개인정보보호 관리\n과정(개인정보보호관리체계 인증 등에 관한 고시)‘ 중\n“검토 및 모니터링” 과정에 포함되어야 하는 가장\n적절한 세부 관리과정을 고르시오.(2개 선택)\n① 내부감사\n② 개인정보보호 개선 활동\n③ 법적 요구사항 준수검토\n④ 내부 공유 및 교육\n- 23",
  "2017_118": "118. 다음 설명에 가장 적절한 보안 위협은?\n신뢰할 수 없는 데이터가 명령어나 쿼리문의 일부분\n으로서 인터프리터로 보내질 때 발생되는 보안 위협\n① 인젝션\n② 보안 설정 오류\n③ 알려진 취약점 있는 컴포넌트 사용\n④ 인증 및 세션 관리 취약점",
  "2017_119": "119. 클라우드에서 개인정보 보호에 초점을 맞춘 국제\n표준은?\n① ISO/IEC 27001 ② ISO/IEC 27014\n③ ISO/IEC 27017 ④ ISO/IEC 27018",
  "2017_120": "120. TCP/IP 프로토콜에서 각 계층별 보안 프로토콜이\n잘못 연결된 것은 어느 것인가?\n① 네트워크 접근계층(network access layer) – PGP\n② 인터넷 계층(internet layer) – IPsec\n③ 전송 계층(transport layer) - SSL\n④ 응용 계층(application layer) – S/MIME\n3 -",
  "2018_101": "101. 다음과 같은 침입차단시스템(firewall)의 기본\n구조로 가장 적절한 것은?\n이 방식은 외부 네트워크와 내부 네트워크가 분리\n되어 있는 네트워크를 구성하며, 내외부 네트워크\n사이에 DMZ라고 불리는 완충지대를 둔다. 이를 위\n해 이중 라우터 구조를 사용한다.\n① 단일 홈 게이트웨이(single homed gateway)\n② 이중 홈 게이트웨이(dual homed gateway)\n③ 스크리닝 라우터(screening router)\n④ 스크린드 서브넷 게이트웨이(screened subnet\ngateway)",
  "2018_102": "102. 공개키 암호 알고리즘을 이용하는 전자서명에 대한 설\n명으로 가장 적절한 것을 모두 고르시오.(2개 선택)\n① 권한이 있는 사용자들만 서명의 정당성을 검증할\n수 있다.\n② 한 번 생성된 서명은 동일한 서명자의 다른 문서에\n재사용할 수 있다.\n③ 서명된 문서가 변경된 경우에 수신자는 변경 여\n부를 확인할 수 있다.\n④ 전자서명을 생성한 서명자는 나중에 서명한 사실\n을 부인할 수 없다.",
  "2018_103": "103. DRM(Digital Right Management) 시스템에서 권리\n표현에 관한 설명으로 가장 거리가 먼 것은?\n① REL(Rights Expression Language)은 XML을 기반\n으로 이루어져 있다.\n② XACML(eXtensible Access Control Markup Language)\n은 대표적인 DRM 권리 표현 언어이다.\n③ 대부분의 REL은 일반 언어와 똑같이 어휘(semantics)와\n어휘에 대한 구조(syntax)를 포함한다.\n④ MPEG-21 REL에서는 리소스를 디지털 포맷으로 제\n한하나, ODRL(Open Digital Right Language)에서\n는 모든 포맷을 허용한다.\n- 20",
  "2018_104": "104. 리눅스 시스템에서는 파일 생성시 기본 권한이\n부여되는데, 이 기본 권한을 결정할 때 사용되\n는 것은?\n① chmod ② umask ③ fdisk ④ dmesg",
  "2018_105": "105. 접근제어 모델에 관한 설명 중 가장 적절하지 않은\n것은?\n① 임의적 접근제어는 정보의 소유자가 보안 레벨을\n결정하고 이에 대한 정보의 접근 제어를 설정하\n는 방식이다.\n② 강제적 접근제어는 중앙에서 정보를 수집하고 분\n류하여 보안 레벨을 결정하고 정책적으로 접근제\n어를 수행하는 방식이다.\n③ 강제적 접근제어 방식인 벨 라파둘라 모델에서는\n자신보다 높은 보안 레벨의 문서에 대해 읽기와\n쓰기가 불가능하다.\n④ 역할기반 접근제어는 사람이 아닌 직책에 대해\n권한을 부여함으로써 효율적인 권한 관리가 가\n능하다.",
  "2018_106": "106. SSO(Single Sign-On)에 대한 설명 중 가장 적절\n하지 않은 것은?\n① SSO는 인증 정책과 절차를 일관되게 적용하기 위\n해 분산화된 관리를 제공한다.\n② 사용자는 단 한번만 로그인 하면 되므로 보다 강\n력한 패스워드를 사용해야 한다.\n③ 정적 패스워드는 보안에 취약하므로 이중요소 인\n증이나 동적(일회용) 패스워드가 필요하다.\n④ SSO 서버는 타임아웃 임계치의 설정을 허용하고\n일정 기간 동작하지 않은 경우 연결을 종료한다.",
  "2018_107": "107. 다음 중 일방향 해시 함수의 응용 예로 가장 적\n절하지 않은 것은?\n① 재전송 공격 방지\n② 메시지 인증 코드 생성\n③ 소프트웨어 변경 여부 검출\n④ 패스워드 기반 암호 시스템\n0 -",
  "2018_108": "108. 다음 설명에 해당하는 제도로 가장 적절한 것은?\n- 조직이 보존해야 할 정보 자산의 기밀성, 무결\n성, 가용성을 실현하는 절차와 과정을 체계적으\n로 수립하고 이를 문서화함\n- 관리 및 운영하는 조직의 체계가 인증 기준에\n적합한지 심사하여 인증을 부여하는 제도\n① CC(Common Criteria) 인증\n② ISMS(Information Security Management System) 인증\n③ TCSEC(Trusted Computer Security Evaluation Criteria)\n④ PIMS(Personal Information Management System) 인증",
  "2018_109": "109. 정량적 위험분석 과정에서 파일서버에 대한 위험,\n가치, 노출 인자(EF : Exposure Factor), 연간\n발생빈도(ARO : Annual Rate of Occurrence)가 다음과\n같을 때, 단일 예상손실액(SLE : Single Loss Ex-\npectancy)과 연간 예상 손실액(ALE : Annual\nLoss Expectancy)은 각각 얼마인가?\n자산 위험 가치 EF SLE ARO ALE\n파일 디스크\n$50,000 0.5 0.2\n서버 장애\n① $50,000, $5,000 ② $25,000, $5,000\n③ $50,000, $10,000 ④ $25,000, $10,000",
  "2018_110": "110. 유닉스/리눅스 환경에서 다음 설명에 해당하는\n것으로 가장 적절한 것은?\n- 본 설정을 하게 되면 프로세스가 실행 도중 일\n시적으로 특정한 권한을 갖게 되어 보안상의 문\n제를 일으킬 수 있음\n- 해당 설정이 버퍼 오버플로우 공격을 통해 악용\n될 경우 루트 권한의 쉘을 공격자가 소유하게\n되기도 함\n① 환경변수 PATH 설정\n② 디렉토리에 대한 sticky 비트 설정\n③ 일반 사용자로의 chown 설정\n④ 실행 파일에 대한 SetUID 설정\n- 21",
  "2018_111": "111. 다음 설명에 해당하는 공격 방법으로 가장 적절\n한 것은?\n공개키 암호 방식을 사용하는 프로토콜에서 통신\n객체(송/수신자)가 전송하는 공개키를 공격자의\n공개키로 바꾸는 공격으로, 사용자의 공개키가 인\n증되지 않은 경우에 가능한 공격 기법\n① 재전송 공격 ② 사전 공격\n③ 중간자 공격 ④ 반사 공격",
  "2018_112": "112. 다음에 제시한 취약점을 이용한 공격 기법으로\n가장 적절한 것은?\n공격자가 작성한 스크립트가 다른 사용자에게 전달\n되는 것으로, 다른 사용자의 웹브라우저 안에서 적\n절한 검증 없이 실행되어 사용자의 세션을 탈취하\n거나 웹사이트를 변조하기도 하며 악의적인 사이트\n로 이동할 수 있음\n① XSS 공격 ② 레이스 컨디션 공격\n③ SQL 인젝션 ④ 디렉토리 리스팅",
  "2018_113": "113. 안드로이드 개발 환경에서 안드로이드 단말기 내\n의 보호대상 자원 혹은 정보에 접근하기 위해 개\n발자가 필요한 권한을 명시해 놓은 파일은?\n① AndroidManifest.xml\n② strings.xml\n③ res/layout activity_프로젝트명.xml\n④ styles.xml",
  "2018_114": "114. 디지털 포렌식과 관련하여 다음에 제시된 하드디\n스크 상의 특정 위치를 지칭하는 용어는?\n- 물리적으로 파일에 할당된 공간이지만 논리적\n으로 사용할 수 없는 공간을 말함\n- 디스크의 경우 512바이트 단위로 접근을 하기\n때문에 해당 공간에 300바이트만 채워진 경우\n212바이트의 유휴 공간이 발생하여 공격자의\n정보 은닉이나 제대로 지워지지 않은 데이터\n의 유출이 발생 가능함\n① 부트 블록 공간 ② 수퍼 블록 공간\n③ 주 파티션 공간 ④ 슬랙 공간\n1 -",
  "2018_115": "115. 개인정보의 안전성 확보조치 기준에서 명시하고\n있는 정보통신망에 대한 불법적인 접근 및 침해\n사고 방지를 위한 접근 통제 조치에 대한 설명으\n로 가장 적절하지 않은 것은?\n① 개인정보처리시스템에 대한 접속 권한을 IP(Internet\nProtocol) 주소 등으로 제한하여 인가받지 않은\n접근을 제한해야 한다.\n② 개인정보처리시스템에 접속한 IP 주소 등을 분석\n하여 불법적인 개인정보 유출 시도를 탐지 및 대\n응해야 한다.\n③ 개인정보처리자는 개인정보의 유출을 방지하기\n위해 개인정보취급자가 정보통신망을 통해 외부\n에서 개인정보처리시스템에 접속할 수 없도록\n해야 한다.\n④ 고유식별 정보를 처리하는 개인정보처리자는 인\n터넷 홈페이지를 통해 고유식별 정보가 유출·변\n조·훼손되지 않도록 연 1회 이상 취약점을 점검\n하고 필요한 보완 조치를 하여야 한다.",
  "2018_116": "116. 다음에 제시된 시스템으로 가장 적절한 것은?\n- 수많은 IT 시스템 및 보안 시스템에서 발생하\n는 로그를 분석하여 이상징후를 파악하고 그\n결과를 경영진에게 보고할 수 있도록 분석결과\n를 종합해 주는 시스템\n- 최근 빅데이터 분석 및 인공지능 기술의 발전\n으로 정보보안 분야에 적극적으로 활용 되는\n시스템\n① DLP(Data Loss Prevention)\n② IPS(Intrusion Prevention System)\n③ MDM(Mobile Device Management)\n④ SIEM(Security Information Event Management)",
  "2018_117": "117. 정보보호 관리체계 인증 등에 관한 고시(과기정\n통부고시 제2017-7호)의 [별표 7] 정보보호 관리\n체계 인증기준 중 물리적 보안 통제분야의 통제\n사항과 가장 거리가 먼 것은?\n① 개발과 운영환경 분리 ② 출입통제\n③ 시스템 배치 및 관리 ④ 개인업무 환경보안\n- 22",
  "2018_118": "118. 주요 통제 목표가 목표복구시간과 목표복구대상\n이며, 전사적인 차원에서 이루어지는 관리활동으\n로 가장 적절한 것은?\n① 위험관리 ② 전사적 자원 관리\n③ 업무 연속성 관리 ④ 재난 복구 계획 관리",
  "2018_119": "119. 정보통신서비스 제공자가 이용자의 동의 없이 개\n인정보를 수집·이용할 수 있는 경우로 가장 거\n리가 먼 것은?\n① 이용자 또는 그 법정대리인이 의사표시를 할 수\n없는 상태에 있거나 주소불명 등으로 사전 동의를\n받을 수 없는 경우\n② 정보통신서비스의 제공에 관한 계약을 이행하기\n위하여 필요한 개인정보로서 경제적·기술적인\n사유로 통상적인 동의를 받는 것이 뚜렷하게 곤\n란한 경우\n③ 정보통신서비스의 제공에 따른 요금정산을 위하여\n필요한 경우\n④ 정보통신망법 또는 다른 법률에 특별한 규정이\n있는 경우",
  "2018_120": "120. 위험관리 과정에서 위험완화 방법에 대한 설명으\n로 가장 거리가 먼 것은?\n① 회피(avoidance): 위험이 존재하는 프로세스나\n사업을 수행하지 않는 것\n② 이전(transfer): 위험의 잠재적 비용을 상대방에게\n이전하거나 분배하는 것\n③ 감소(reduction): 위험을 감소시킬 수 있는 대책\n을 채택하여 구현하는 것\n④ 수용(acceptance): 위험을 받아들이고 비용을 감\n수하는 것\n2 -",
  "2019_101": "101. BIBA 모델에서 주체는 자신보다 낮은 무결성 수\n준의 데이터를 읽을 수 없다는 규칙으로 가장\n적절한 것은?\n① 단순 보안 규칙(simple security rule)\n② 스타 보안 규칙(*-security rule)\n③ 단순 무결성 규칙(simple integrity rule)\n④ 스타 무결성 규칙(*-integrity rule)",
  "2019_102": "102. RSA 전자서명에서 서명자의 공개키가 (e, n)이고 개인\n키가 (d, n)일 때 메시지 m에 대한 서명은 md mod n\n으로 계산된다. 다음과 같은 절차를 통해 계산되는 서\n명의 유형으로 가장 적절한 것은?\n1) 메시지 작성자가 메시지 m을 작성한 다음 1부터\nn 사이에서 n과 서로소인 난수 k를 선택한 후\nt ≡ mke mod n를 계산하여 서명자에게 전달한다.\n2) 서명자는 u ≡ td mod n, 즉, (mke)d mod n ≡\nmdked mod n ≡ kmd mod n을 계산한 후 메시지\n작성자에게 전달한다.\n3) 메시지 작성자는 u/k ≡ md mod n을 계산하여\n메시지 m에 대한 서명을 구한다.\n① 위임 서명(proxy signature)\n② 은닉 서명(blind signature)\n③ 다중 서명(multi signature)\n④ 부인방지 서명(undeniable signature)",
  "2019_103": "103. 하드디스크에서 일반 사용자가 볼 수 없는 숨김\n영역으로 ATA(AT Attachment)-4에 추가되었으며,\n사용자가 하드디스크를 포맷하거나 삭제했을 때\n도 데이터를 보존할 수 있는 영역으로 가장 적절\n한 것은?\n① HPA(Host Protected Area)\n② MBR(Master Boot Record)\n③ GPT(GUID Partition Table)\n④ Swap Space\n- 21",
  "2019_104": "104. 다음에서 설명하는 공격 방법으로 가장 적절한 것은?\n공격자가 다양한 첨단 보안 위협을 이용하여 특정 기\n업이나 조직의 네트워크에 지능적인 방법을 사용하여\n지속적으로 가하는 공격으로, 제로데이 공격과 같이\n기존에 알려지지 않았던 취약점을 다양하게 활용하여\n공격한다.\n① MACOF 공격 ② XSS 공격\n③ APT 공격 ④ DLL 인젝션",
  "2019_105": "105. 다음 중 정성적 위험분석 방법과 가장 거리가 먼 것은?\n① 수학공식 접근법 ② 델파이법\n③ 시나리오법 ④ 순위결정법",
  "2019_106": "106. 무선랜 보안을 위한 표준인 IEEE 802.11i에서는\n데이터 무결성과 기밀성을 제공하기 위해 CCMP\n(Counter mode with CBC-MAC Protocol) 프로토\n콜을 규정하고 있다. CCMP에서 사용하는 암호화\n알고리즘으로 맞는 것은?\n① RC4 ② AES ③ 3DES ④ TKIP",
  "2019_107": "107. 유닉스 로그에 대한 설명으로 바르게 연결된 것은?\n(가) 은(는) 현재 로그인 사용자의 아이디, 사용자\n프로세스, 실행 레벨, 로그인 종류 등을 기록\n(나) 은(는) 사용자 로그인·로그아웃 시간, 세션\n지속 시간, 시스템 종료·시작 시간을 기록\n(다) 은(는) 명령 창에서 실행한 명령을 기록\n(가) (나) (다)\n① wtmp utmp history\n② wtmp history utmp\n③ utmp wtmp history\n④ utmp history wtmp",
  "2019_108": "108.「개인정보보호법」상 공공기관의 장이 개인정보\n영향평가를 하는 경우 고려해야 할 사항으로\n가장 거리가 먼 것은?\n① 개인정보 취급자 역량\n② 개인정보의 제3자 제공 여부\n③ 정보주체의 권리를 해할 가능성 및 그 위험 정도\n④ 처리하는 개인정보의 수\n1 -",
  "2019_109": "109.「개인정보의 기술적·관리적 보호조치 기준」상\n정보통신서비스 제공자 등이 개인정보처리시스\n템에 대한 접근권한과 접속기록의 위·변조 방\n지에 관한 조항의 일부이다. (가), (나)에 들\n어갈 내용으로 바르게 연결한 것은?\n제4조(접근통제) ① 정보통신서비스 제공자 등은\n개인정보처리시스템에 대한 접근권한을 서비스\n제공을 위하여 필요한 개인정보관리책임자 또는\n개인정보취급자에게만 부여한다.\n② 정보통신서비스 제공자 등은 전보 또는 퇴직 등\n인사이동이 발생하여 개인정보취급자가 변경되었\n을 경우 지체 없이 개인정보처리시스템의 접근권\n한을 변경 또는 말소한다.\n③ 정보통신서비스 제공자 등은 제1항 및 제2항에\n의한 권한 부여, 변경 또는 말소에 대한 내역을\n기록하고, 그 기록을 최소 (가)간 보관한다.\n제5조(접속기록의 위·변조방지) ① 정보통신서비스\n제공자 등은 개인정보취급자가 개인정보처리시스\n템에 접속한 기록을 월 1회 이상 정기적으로 확\n인·감독하여야 하며, 시스템 이상 유무의 확인\n등을 위해 최소 (나) 이상 접속기록을 보존·관\n리하여야 한다.\n② 단, 제1항의 규정에도 불구하고 「전기통신사업법」\n제5조의 규정에 따른 기간통신사업자의 경우에는\n보존·관리해야할 최소 기간을 2년으로 한다.\n① (가) 5년 (나) 3개월\n② (가) 5년 (나) 6개월\n③ (가) 3년 (나) 3개월\n④ (가) 3년 (나) 6개월",
  "2019_110": "110. 유닉스 계열 시스템에서 발생 가능한 공격 유형\n중의 하나를 설명하고 있다. 다음에서 설명하는\n공격 유형으로 가장 적절한 것은?\n권한 수준이 다른 두 프로세스의 경쟁 관계를 이용한\n공격으로, 관리자의 권한으로 실행되는 프로그램 중간\n에 끼어들어 자신이 원하는 작업을 수행하는 것이다.\n① 트랩 도어(trap door)\n② 포맷 스트링(format string)\n③ 레이스 컨디션(race condition)\n④ 버퍼 오버플로우(buffer overflow)\n- 22",
  "2019_111": "111. 디지털 포렌식의 기본원칙에 대한 설명 중 가장\n적절하지 않은 것은?\n① 정당성의 원칙이란 모든 증거는 적법한 절차를\n통해 획득해야 한다는 것을 의미한다.\n② 재현의 원칙이란 증거를 제출하려면 환경이나\n조건이 바뀌어도 같은 결과가 나오도록 재현할\n수 있어야 한다는 것을 의미한다.\n③ 신속성의 원칙이란 컴퓨터 내부의 정보는 휘발\n성을 가진 것이 많기 때문에 신속하게 이뤄져야\n한다는 것을 의미한다.\n④ 무결성의 원칙이란 각 단계를 거치는 과정에서\n증거가 위조 및 변조되어서는 안되며, 이러한\n사항을 매번 확인해야 한다는 것을 의미한다.",
  "2019_112": "112. 웹 애플리케이션에서 발생하는 취약점을 예방하\n기 위해 사용하는 입력값 검증 방법에 대한 설\n명으로 가장 옳지 않은 것은?\n① 크로스사이트 스크립팅 공격을 예방하려면 외부\n에서 스크립트 코드를 입력하지 못하도록 방어\n하는 방법이 효과적이다.\n② 입력값 검증 시 대부분의 입력값은 허용하고 일\n부 특정 입력값만 차단하는 방식을 블랙리스트\n필터링 방식이라 한다.\n③ 사용자 입력값 검증 코드는 클라이언트 측에서\n자바 스크립트 등을 이용하여 필터링 하는 방식\n으로 구현하는 것이 가장 안전하다.\n④ SQL 인젝션 공격을 예방하려면 prepared statement\n객체를 이용하여 데이터베이스에 컴파일 된 쿼\n리문을 전달하는 방식이 안전하다.",
  "2019_113": "113. 웹 취약점을 이용한 공격 방법의 하나인 CSRF\n(Cross-Site Request Forgery)에 대한 설명으로\n가장 적절하지 않은 것은?\n① 웹 페이지에 삽입되어 있는 공격 코드가 이용된다.\n② 웹 서버에 접속해 있는 사용자에 대한 서버의\n신뢰를 악용하는 공격이다.\n③ 공격 대상 클라이언트 호스트의 웹 브라우저를\n통해 클라이언트 상의 사용자 정보가 유출될 수\n있다.\n④ XSS(Cross-Site Script)와 마찬가지로 공격\n코드는 자바스크립트 형태로 삽입될 수 있다.\n2 -",
  "2019_114": "114. OSI 7계층 참조모델의 응용계층에 대한 공격 기\n법에 해당하는 것은?\n① TCP SYN flooding 공격 ② smurf 공격\n③ ARP spoofing 공격 ④ slowloris 공격",
  "2019_115": "115. 카나리 단어(canary word) 기법이나 ASLR(Address\nSpace Layout Randomization)은 어떠한 유형의\n공격에 대응하기 위한 방법들인가?\n① 업로드 공격 ② XSS 공격\n③ 버퍼 오버플로우 공격 ④ 인젝션 공격",
  "2019_116": "116. 다음 공격 시나리오가 제시하는 2단계의 공격\n기법으로 가장 적절한 것은?\n같은 네트워크 내에 위조된 웹서버를 설치하고 공\n격대상의 특정 웹사이트에 대한 접속 시도 시 위\n조된 웹서버에 접속하는 상황을 만들고자 한다.\n공격자 컴퓨터 역시 같은 네트워크에서 공격 성공\n을 위해 2단계 공격을 진행한다.\n(1단계) 공격대상 클라이언트가 요청하는 URL을\n가로채 어떤 서버에 접근하는지를 알아낸다.\n(2단계) 요청 URL에 대응되는 위조된 웹페이지의\n컴퓨터 주소를 공격 대상 클라이언트에 전달해준다.\n① 1단계: ARP spoofing 공격, 2단계: SYN flooding 공격\n② 1단계: smurf 공격, 2단계: ping sweep 공격\n③ 1단계: ARP spoofing 공격, 2단계: DNS spoofing 공격\n④ 1단계: ping sweep 공격, 2단계: SYN flooding 공격",
  "2019_117": "117. 다음에서 설명하는 악성코드로 가장 적절한 것은?\n보안관리자나 보안 시스템의 탐지를 피하면서 시스\n템을 제어하기 위해 공격자가 설치하는 악성파일로\n운영체제의 합법적인 명령어를 해킹하여 모아놓은\n것을 말한다. 컴퓨터의 운영체제에서 실행 파일과\n실행 중인 프로세스를 숨김으로써 운영체제 검사\n및 백신 프로그램의 탐지를 피할 수 있다.\n① 웜(worm) ② 루트킷(rootkit)\n③ 논리폭탄(logic bomb) ④ 스파이웨어(spyware)\n- 23",
  "2019_118": "118. 아래의 블록 암호 운용 모드 중 평문 블록의 변\n경이 해당 블록의 암호문만 변경시킬 뿐 다른\n블록의 암호문에는 전혀 영향을 미치지 않는 모\n드는 모두 몇 개인가?\n- ECB(Electronic CodeBook)\n- CBC(Cipher Block Chaining)\n- CFB(Cipher FeedBack)\n- OFB(Output FeedBack)\n- CTR(CounTeR)\n① 1개 ② 2개 ③ 3개 ④ 4개",
  "2019_119": "119. 다음 중 블록체인의 각 블록들을 연결해 주고\n트랜잭션의 위·변조를 막기 위해 활용될 수 있\n는 암호기술로 가장 적절한 것은?\n① AES ② DES ③ SHA ④ RSA",
  "2019_120": "120. SSL(Secure Socket Layer) 프로토콜에 대한 설명\n으로 가장 거리가 먼 것은?\n① 네트워크 계층에 적용되며 패킷 단위의 데이터\n암호화 기능을 제공한다.\n② 서버 인증, 클라이언트 인증, 암호화 세션 기능을\n제공한다.\n③ SSL이 적용된 웹 애플리케션의 URL은 http://\n대신에 https://를 사용한다.\n④ 웹 서비스, 이메일 및 다른 애플리케이션에서도\n사용될 수 있다.\n3 -",
  "2020_104": "104. 보안시스템의 개발 원칙에 대한 설명 중 가장 적절\n하지 않은 것은?\n① Complete mediation : 모든 접근 시도는 접근 통\n제 메카니즘에 의해 점검되어야 한다.\n② Fail-safe default : 시스템의 보안성 유지가 안\n된다면, 시스템 운영을 중단하는 것이 좋다.\n③ Least privilege : 시스템을 사용하는 모든 이용\n자는 업무(task)를 수행하는데 필요한 최소의 권\n한만이 주어져야 하고 주어진 권한도 시간에 따라\n달라진다.\n④ Open design : 보안 메카니즘은 비밀로 유지하지\n않고 공개하는 것이 좋다.",
  "2020_105": "105. 다음에서 설명하는 웹 서비스의 주요 구성 요소로\n가장 적절한 것은?\n(가) 웹 서버에서 생성된 난수 값을 클라이언트\n컴퓨터에 저장하여 다음 접속 시 해당 클라\n이언트 컴퓨터를 식별한다.\n(나) 다수 개의 웹 클라이언트들이 동일한 정보를\n요청하는 것에 대비하여 로컬 네트워크 서\n버에 첫 번째 요청된 웹페이지의 내용을 저\n장한다.\n① (가) 웹 방화벽 (나) 웹 로그\n② (가) 웹 로그 (나) 웹 캐시\n③ (가) 쿠키 (나) 웹 방화벽\n④ (가) 쿠키 (나) 웹 캐시",
  "2020_106": "106. 포맷 스트링(format string) 취약점에 대한 설명\n으로 가장 적절하지 않은 것은?\n① printf 함수가 가지고 있는 선택적 매개변수(opt\nional argument)의 특성은 취약점이 될 수 있다.\n② 소프트웨어의 사용자가 포맷 스트링을 지정할 수\n있는 것을 불허하여 취약점 이용에 대처할 수 있다.\n③ 포맷 스트링 %n을 이용하여 메모리의 특정 위치(주\n소)에 값을 지정할 수 있다.\n④ 포맷 스트링 취약점을 이용하여 악성코드를 실행\n하는 것은 불가능하다.\n1 -",
  "2020_111": "111. 다음 중 공개키 기반 구조(PKI: Public Key Infrastru\n-cture)에 대한 설명으로 가장 적절하지 않은 것은?\n① 공개키 인증서를 위해 X.509 표준 인증서 형식을\n사용한다.\n② PKI는 인증, 기밀성, 부인방지와 메시지의 무결성을\n제공한다.\n③ PKI 전반에 사용되는 정책과 절차를 생성하는\n기관은 PAA(Policy Approving Authority)다.\n④ 공개키 기반 구조에서 공개키 인증서는 CA(Certi\n-ficate Authority)의 공개키를 이용하여 전자\n서명을 생성한다.",
  "2020_112": "112. 다음 중 IPSec(Internet Protocol Security)에\n대한 설명 중 가장 적절하지 않은 것은?\n① AH와 ESP 모두 메시지 무결성을 제공한다.\n② AH는 메시지에 대한 기밀성을 제공하지만, ESP는\n기밀성을 제공하지 않는다.\n③ IPSec을 이용하여 재전송 공격 방지 기능을 제공\n할 수 있다.\n④ IPSec 운영 모드는 터널모드와 전송모드로 나뉜다.",
  "2020_113": "113. 다음 설명에 해당하는 것으로 가장 적절한 것은?\n도메인을 탈취하거나 DNS(Domain Name System) 등의 주\n소를 변조하여 사용자들로 하여금 진짜 사이트로\n오인 접속하도록 유도한 뒤에 개인 정보를 탈취하는 행\n위이다.\n① 스미싱(smishing) ② 파밍(pharming)\n③ 큐싱(qshing) ④ 스니핑(sniffing)",
  "2020_114": "114. 리눅스 환경에서 traceroute 명령이 활용하는 IP\n헤더 필드 및 ICMP 메시지의 종류로 가장 적절\n하게 짝지어진 것은?\n① TTL – ICMP time exceeded\n② SYN flag – ICMP echo request\n③ Fragment offset – ICMP redirect\n④ Header checksum – ICMP destination unreachable\n2 -",
  "2020_118": "118. 다음 설명에 해당하는 것으로 가장 적절한 것은?\n데이터의 불법복제를 방지하고 소유자의 저작권과\n소유권을 보호하기 위해 디지털 콘텐츠에 사용자만이\n알 수 있는 아이디(ID) 또는 정보 등의 부호를\n삽입하거나, 영상·음성 등의 신호에 특정한 코드나\n유형 등을 삽입하는 기술이다. 사용자가 소프트웨어를\n사용하거나 이미지를 보는데 전혀 지장을 주지\n않으면서도 원본의 출처나 복제 경로를 찾아내는데\n효과적이다.\n① Digital envelope ② Digital watermark\n③ Digital forensic ④ Digital wallet",
  "2020_119": "119. 전자서명(digital signature)이란 서명한 사람의\n신분을 증명하는 방식으로, 특정 사용자를 인증\n하기 위해 사용한다. 다음 중 전자서명에 대한\n설명으로 가장 적절한 것은?\n① 전자서명은 부인방지 기능을 제공하지 않는다.\n② 비대칭키 암호 시스템을 사용하여 전자서명\n서비스를 제공할 수 있다.\n③ 서명용 공개키를 이용하여 누구든지 서명문을 생성\n할 수 있으므로 위조가 가능하다.\n④ DSA(Digital Signature Algorithm)는 AES(Advanced\nEncryption Standard) 알고리즘을 기반으로 전자\n서명을 생성한다.",
  "2020_120": "120. 대칭키 암호방식과 공개키 암호방식의 장점을\n조합한 하이브리드 암호 시스템에 대한 설명으로\n가장 적절하지 않은 것은?\n① 암호화 과정에서는 공개키 암호방식보다 상대적\n으로 빠른 대칭키 암호방식을 이용하여 메시지를\n암호화 한다.\n② 복호화 과정에서는 세션키를 먼저 복호화한 후\n메시지를 복호화한다.\n③ 메시지 암호화에 사용한 세션키는 송신자의 공개키를\n이용하여 암호화한다.\n④ 생성된 암호문은 세션키에 대한 암호 부분과 메시\n지에 대한 암호 부분으로 구성된다.\n3 -",
  "2021_104": "104. 타원곡선 암호기술(ECC : Elliptic Curve Crypto-\ngraphy)에 대한 설명으로 가장 적절하지 않은 것은?\n① 타원곡선 암호기술은 소인수분해 문제에 기반을\n둔다.\n② 타원곡선 암호기술은 키 교환, 전자서명에 사용\n될 수 있다.\n③ 타원곡선 암호기술은 다른 공개키 알고리즘에 비해\n계산량이 적다는 장점을 갖는다.\n④ 타원곡선 암호기술은 비교적 짧은 키 길이를 이용\n하여 RSA와 동일한 수준의 보안을 제공한다.",
  "2021_105": "105. 다음 중 무선 통신 암호화 기술에 대한 설명으로\n가장 적절하지 않은 것은?\n① WPA2는 CCMP 알고리즘을 사용하여 암호화한다.\n② WPA2는 Access Point에 접속하는 단말기마다 지\n정된 암호화 키를 재사용한다.\n③ WPA-EAP는 사용자가 입력하는 아이디, 패스워드\n를 사용하는 사용자 인증 방식이다.\n④ WPA-EAP는 사용자별 무선랜 연결 세션마다 지정\n된 암호화 키를 재사용한다.",
  "2021_106": "106. SHA-2를 대체하기 위해서 발표한 해시함수인 SHA-3에\n대한 설명으로 가장 적절하지 않은 것은?\n① SHA-3의 입력되는 데이터의 크기는 2128-1로 제한\n된다.\n② SHA-1, SHA-2와는 전혀 다른 스펀지 구조가 사용\n되고 있다.\n③ 출력 비트열의 길이에 따라 SHA3-224, SHA3-256,\nSHA3-384, SHA3-512의 4종류가 있다.\n④ SHA-3는 해시값 생성 뿐만 아니라 의사난수 생성기,\n스트림 암호 등의 기능에도 활용할 수 있다.",
  "2021_107": "107. 다음 중 데이터베이스 보안 요구사항으로 가장\n적절하지 않은 것은?\n① 데이터에 대한 허용 값을 통제함으로써, 변경 데\n이터의 논리적 일관성을 보장한다.\n② 중요 데이터에 대한 기밀성을 보호하고, 인가된\n사용자만 접근을 허용해야 한다.\n③ 사용자가 통계 집합적 데이터로부터 개별적인 데\n이터 항목에 대한 정보를 추적할 수 있어야 한다.\n④ 트랜잭션의 병행처리시 데이터에 대한 논리적 일관\n성이 보장되어야 한다.\n3 -",
  "2021_111": "111. TCP 세션 하이재킹 공격을 탐지하는 방법으로 가장\n적절하지 않은 것은?\n① 서버와 시퀀스 넘버를 주기적으로 체크하여 비동\n기화 상태에 빠지는지 탐지한다.\n② 공격자가 중간에 끼어 작동하므로 패킷의 유실\n및 재전송이 증가하는지 탐지한다.\n③ SYN 패킷의 비율이 급격히 늘어나는 현상인 SYN\nStorm이 발생하는지 탐지한다.\n④ 세션을 빼앗기거나 공격에 실패하는 경우 세션이\n리셋되므로 예상치 못한 접속의 리셋을 탐지한다.",
  "2021_112": "112. 다음 중 블록체인 기술의 특성으로 가장 적절하지\n않은 것은?\n① 암호기술을 적용하여 인증 및 검증 가능한 트랜잭\n션을 보장한다.\n② 블록체인 플랫폼에 참여하는 노드들의 합의를 통해\n신뢰를 형성한다.\n③ 블록체인에 기록된 민감 정보들은 선택적 비공개\n가 가능하며 일부 수정이 가능하다.\n④ 스마트 계약은 블록체인 트랜잭션 데이터베이스에\n포함되어 트랜잭션과 함께 실행되는 비즈니스 규\n약이다.",
  "2021_113": "113. 다음 SW 개발과정에서 발생할 수 있는 취약점 설명에\n대한 내용으로 가장 적절한 것은?\n악성 스크립트가 포함된 URL을 공격자가 클라이언트에게\n노출시켜 클릭을 유도하고, 쿠키 정보를 탈취하거나\n피싱 사이트, 불법 광고 사이트로 이동하게 만든다.\n① Stored XSS ② Reflective XSS\n③ SQL Injection ④ Command Injection",
  "2021_114": "114. 다음 중 개인정보 비식별화 방법(조치)으로 가장\n적절하지 않은 것은?\n① 데이터 합성(data synthesis)\n② 데이터 삭제(data reduction)\n③ 데이터 범주화(data suppression)\n④ 총계처리(aggregation)\n4 -",
  "2021_118": "118.‘개인정보보호법’ 및 ‘개인정보의 안전성 확보\n조치 기준’에 따라 개인정보처리자가 주민등록\n번호, 비밀번호, 바이오정보 등을 저장할 때 적\n용할 암호화 알고리즘으로 가장 적절한 것은?\n주민등록번호 비밀번호 바이오정보\n① SHA-256 AES-256 SHA-256\n② SHA-256 SHA-256 AES-256\n③ AES-256 SHA-256 AES-256\n④ AES-256 AES-256 SHA-256",
  "2021_119": "119. 다음의 C 코드가 갖는 문제점으로 가장 적절하지\n않은 것은?\nint CheckLogin()\n{\nchar* _username = (char*) malloc(32);\nchar username[32];\nscanf(\"%s\", _username);\nstrcpy(username, _username);\n...\n}\n① 스택 오버플로우(stack overflow)\n② 힙 오버플로우(heap overflow)\n③ 메모리 접근 위반(memory access violation)\n④ 정수 오버플로우(integer overflow)",
  "2021_120": "120.‘개인정보 보호법’에서 정하고 있는 개인정보\n보호 원칙에 관한 규정으로 가장 적절하지 않은 것은?\n① 개인정보처리자는 정보주체의 사생활 침해를 최\n소화하는 방법으로 개인정보를 처리하여야 한다.\n② 개인정보처리자는 개인정보 처리방침 등 개인정보\n의 처리에 관한 사항은 비공개하여야 하며, 열람\n청구권 등 정보주체의 권리를 보장하여야 한다.\n③ 개인정보처리자는 개인정보의 처리 목적에 필요한\n범위에서 개인정보의 정확성, 완전성 및 최신성이\n보장되도록 하여야 한다.\n④ 개인정보처리자는 개인정보를 익명 또는 가명으로\n처리하여도 개인정보 수집목적을 달성할 수 있는 경우\n익명처리가 가능한 경우에는 익명에 의하여 처리하고,\n익명처리로 목적을 달성할 수 없는 경우에는 가명에\n의하여 처리될 수 있도록 하여야 한다.\n5 -",
  "2022_104": "104. 메시지 인증 코드(MAC)는 메시지의 인증에 사용\n되는 작은 크기의 정보이다. 다음 중 메시지 인\n증 코드에 대한 설명으로 가장 적절한 것은?\n① 메시지 인증 코드는 두 사용자만이 공유한 키를\n사용하기 때문에 부인 방지가 가능하다.\n② 블록 암호와 CBC 블록암호 모드를 사용하여 메\n시지 인증 코드를 구현할 수 있다.\n③ 메시지 인증 코드를 사용하면 메시지에 대한 기\n밀성과 무결성을 모두 제공한다.\n④ 메시지 인증 코드는 키에 의존하는 양방향 해시\n함수이다.",
  "2022_105": "105. 다음 설명에 해당하는 공격으로 가장 적절한 것은?\n공격자 AP(Access Point)는 정상적인 AP보다 강력\n한 전파를 발생시켜 무선랜 이용자가 공격자 AP에\n접속하도록 유도한 후, 무선랜 이용자의 정보를 중\n간에서 획득하는 공격\n① Evil Twin AP 공격 ② Hacktivism AP 공격\n③ Proxy AP 공격 ④ AP to AP 공격",
  "2022_106": "106. TCP SYN FLOODING 공격이 성공하기 위해서는 서\n버의 TCB 큐에 연결요청이 쌓여서 더 이상의 연\n결요청을 받지 못하는 상황이 되어야 한다. 아\n래 설명 중 TCB 큐에 연결정보를 제거(Dequeue)\n시키는 상황으로 가장 적절하지 않은 것은?\n① 클라이언트가 3-way handshake 과정을 종료함\n② TCB 큐의 레코드가 정해진 기준시간 보다 더 길\n게 머무름\n③ 공격자가 SYN 패킷을 보낼 때 랜덤하게 생성한\n근원지 IP 주소를 사용함\n④ TCB 큐의 레코드에 해당하는 연결에 대해 RST\n패킷이 도착함\n21 -",
  "2022_109": "109. 리눅스 시스템의 기본 방화벽인 iptables에서\n192.168.20.22 으로부터 들어오는 패킷들을 차\n단하는 정책으로 가장 적절한 명령어는?\n① # iptables –A INPUT 192.168.20.22 –j DROP\n② # iptables –I INPUT 192.168.20.22 –j LOG\n③ # iptables –A INPUT 192.168.20.22 –j ACCEPT\n④ # iptables –A INPUT 192.168.20.22 –j RETURN",
  "2022_110": "110. 다음 중 ARP Poisoning 공격을 방지하는 방법으로\n가장 적절하지 않은 것은?\n① ARP request 및 ARP reply를 이용하여 MAC 주소\n를 현행화하지 못하도록 한다.\n② 외부 PC가 로컬 네트워크에 접근하지 못하도록\n한다.\n③ 정적 ARP table을 사용하도록 세팅한다.\n④ 컴퓨터의 MAC 주소를 주기적으로 변경해 준다.",
  "2022_111": "111. 악성 프로그램은 컴퓨터, 서버, 클라이언트 및\n컴퓨터 네트워크에 악영향을 끼칠 수 있는 소프\n트웨어이다. 다음 중 악성 프로그램과 그 특징\n에 대한 설명으로 가장 적절하지 않은 것은?\n① 트로이 목마(Trojan horse)는 정상적인 기능을\n하는 프로그램 속에 숨어 정보를 빼내거나 원\n격으로 제어 받도록 하는 악성 프로그램이다.\n② 스파이웨어(Spyware)는 사용자의 정보를 빼내서\n전송하는 악성 프로그램이다.\n③ 드로퍼(Dropper)는 다른 프로그램을 감염시키지\n는 않지만 네트워크를 통해 자기 복제를 하며\n전파된다.\n④ 펍(PUP)은 사용자의 동의를 얻어 설치되었으나\n프로그램과는 상관없이 시스템의 성능 저하 또\n는 사용자의 결제를 유도하기도 한다.",
  "2022_112": "112. 다음 중 공격자가 리눅스 시스템을 원격에서 공\n격하지 못하도록 root 계정으로 원격 접속을 금\n지하고자 할 때 파일 내용을 수정해야 하는 것\n으로 가장 적절한 것은?\n① /etc/passwd, /etc/crontab\n② /etc/pam.d/login, /etc/shadow\n③ /etc/passwd, /etc/securetty\n④ /etc/pam.d/login, /etc/securetty\n22 -",
  "2022_116": "116. 딥페이크(Deepfake)에 대한 설명으로 가장 적절\n하지 않은 것은?\n① 딥페이크는 인공지능 기술을 이용하여 진위 여\n부를 구별하기 어려운 가짜 이미지나 영상물을\n제작하는 기술이다.\n② 딥페이크를 이용한 가짜뉴스, 불법 성인용 콘텐\n츠 제작으로 인한 피해를 감소시키기 위해 법적\n단속이 강화되고 있다.\n③ 딥페이크는 영화제작 분야에서 활용되는 등 부\n작용 없이 사회, 정치 분야에 도움이 되고 있\n다.\n④ 딥페이크 기술이 스캔들의 진위여부에도 영향을\n미치는 등 사회적 파급력이 커지고 있다.",
  "2022_117": "117. 블록체인(Blockchain)은 P2P 방식을 기반으로\n생성된 체인 형태의 연결고리 기반 분산 데이터\n저장 환경이다. 다음 중 블록체인에 대한 설명\n으로 가장 적절하지 않은 것은?\n① 블록체인의 블록 내 헤더에는 해시 값과 거래별\n트랜잭션의 원본 값이 저장된다.\n② 블록체인 기반 시스템은 거래기록이 구성원들에\n게 공개되기 때문에 거래의 투명성을 보장한다.\n③ 블록체인은 참여한 구성원이 네트워크를 통해\n서로 데이터를 검증함으로써 임의적인 조작이\n어렵도록 설계되었다.\n④ 퍼블릭 블록체인(Public Blockchain)은 모든 구\n성원들이 참여 가능하나, 비교적 네트워크 확\n장이 어렵고 거래 속도가 느리다.",
  "2022_118": "118. 다음 중 클라우드 보안 위협에 대한 설명으로\n가장 적절하지 않은 것은?\n① 고객 정보에 대해 제3자 위탁 저장방식을 활용\n할 경우 클라우드 사업자 내부의 관리 부주의로\n인한 정보 유출의 위협이 있다.\n② 여러 고객사의 정보가 클라우드에 집중됨에 따라\nDDoS, APT 공격 등 다양한 공격의 목표가 될 수\n있다.\n③ 논리적 자원을 물리적으로 통합 및 재분배하여\n사용함에 따라 가상화 문제가 발생된다.\n④ 인프라 서비스(IaaS) 이용시 효과적인 자원의 분리\n가 이뤄지지 않을 경우 클라우드 서버 내부의 가상\n머신 간 도청 및 해킹 피해가 발생할 수 있다.\n23 -",
  "2023_104": "104. VPN(Virtual Private Network) Tunneling Protocol\n에 대한 설명으로 가장 적절하지 않은 것은?\n① IPSec VPN은 IP망에서 안전한 데이터를 전송하\n는 프로토콜로, 터널모드는 IP 페이로드를 암호\n화하여 IP 헤더로 캡슐화하며, 전송모드는 IP\n패킷을 모두 암호화하여 전송한다.\n② SSL VPN은 Application 보호를 위해 사용하는\n보안 프로토콜로 데이터 암호화와 인증을 통해\n송수신 경로의 안전성을 보장한다.\n③ L2TP 프로토콜은 PPTP와 L2F의 장점을 통합한\n것으로, 주로 Remote Dial-Up User가 공중망에\n서 터널링을 통하여 사설망에 연결하는 기능을\n제공한다.\n④ L2F는 Cisco 사에서 개발한 터널링 프로토콜로\n데이터 링크 계층에서 캡슐화를 지원한다.",
  "2023_105": "105. 다음 중 서비스 거부 공격에 대한 설명으로 가\n장 적절하지 않은 것은?\n① TearDrop 공격은 IP 패킷의 시퀀스 넘버가 서로\n중첩되도록 조작하여 수신측의 IP 패킷 재조합\n시 오류를 발생시키는 공격이다.\n② TCP SYN 플러딩 공격은 TCP의 연결 과정인 3-Way\nHandshaking의 문제점을 악용한 공격이다.\n③ Smurf 공격은 브로드캐스팅 방식으로 동작할 수\n있는 ICMP 프로토콜의 특성을 악용한 공격이다.\n④ Bonk 공격은 패킷을 전송할 때 IP 주소와 목적지\nIP 주소 값을 동일하게 작성하여 공격 대상에게\n보내는 공격이다.",
  "2023_106": "106. 다음 설명에 해당하는 공격으로 가장 적절한 것은?\n블루투스 장치의 펌웨어 취약점을 이용하여 장치\n내에 저장된 데이터에 대한 접근을 허용하는 공격\n① Blueprinting ② BlueSnarfing\n③ BlueBorne ④ Bluejacking\n9 -",
  "2023_110": "110. 다음 중 실행파일에 대해 리버스 엔지니어링을\n수행하고자 할 때 활용가능한 도구로 가장 적합\n한 것은?\n① OllyDBG ② Wireshark\n③ OpenVAS ④ Snort",
  "2023_111": "111. 다음 중 웹서버의 보안을 강화하기 위한 조치로\n가장 적절하지 않은 것은?\n① IIS의 WebDAV 서비스는 인터넷 상에서 원격 사\n용자들간에 파일을 공동으로 사용하게 하므로\n비활성화하도록 설정한다.\n② 웹 서버를 실행시키는 운영체제의 사용자에게\n충분한 서비스를 제공하기 위하여 최대한 많은\n권한을 허용한다.\n③ 웹 브라우저가 웹 서버로 디렉토리의 정보를 요\n청했을 때 디렉토리를 검색해 파일 목록을 보여\n주는 기능은 불가능하도록 설정한다.\n④ 파일 업로드 및 다운로드 시 허용 가능한 최대\n크기를 설정한다.",
  "2023_112": "112. 인공지능에 수많은 쿼리를 수행한 후 산출된 결\n과를 분석하여 인공지능에서 사용된 데이터를\n추출하는 공격으로 가장 적절한 것은?\n① Poisoning Attack ② Inversion Attack\n③ Evasion Attack ④ Replay Attack",
  "2023_113": "113. 다음 중 DRM(Digital Rights Management)에 관\n한 설명 중 가장 적절하지 않은 것은?\n① 디지털 자산을 보호하는 기술이며, 대표적으로\n문서를 암호화하는 기술이 포함된다.\n② 기업 내에서 생성되는 문서의 생명주기에 많이\n사용되므로 Enterprise DRM이라고도 불린다.\n③ 인가된 사용자만 접근할 수 있도록 문서를 암호\n화하거나 접근 통제를 적용한다.\n④ 사용자별로는 권한 관리가 가능하나 프로세스별\n로는 권한관리 기능을 제공하지 않는다.",
  "2023_114": "114. 다음 중 웹 취약점 진단을 위한 도구와 가장 거\n리가 먼 것은?\n① Burp Suite ② Hydra\n③ Paros ④ WebScarab\n0 -",
  "2023_118": "118. 다음 중 애플리케이션 취약성을 이용한 공격과\n가장 거리가 먼 것은?\n① 버퍼 오버플로우 공격\n② SQL 인젝션 공격\n③ 레인보우 테이블 공격\n④ 원격 코드 실행 공격",
  "2023_119": "119. '개인정보 보호법'에서 정하고 있는 개인정보\n보호 원칙에 관한 규정으로 가장 적절하지 않은\n것은?\n① 개인정보처리자는 개인정보의 처리 방법 및 종\n류 등에 따라 정보주체의 권리가 침해받을 가능\n성과 그 위험 정도를 고려하여 개인정보를 안전\n하게 관리하여야 한다.\n② 개인정보처리자는 개인정보의 처리 목적을 명확\n하게 하지 않아도 그 목적에 필요한 경우 최소\n한의 개인정보만을 적법하게 수집하여야 한다.\n③ 개인정보처리자는 이 법 및 관계 법령에서 규정하\n고 있는 책임과 의무를 준수하고 실천함으로써 정\n보주체의 신뢰를 얻기 위하여 노력하여야 한다.\n④ 개인정보처리자는 개인정보의 처리 목적에 필요\n한 범위에서 개인정보의 정확성, 완전성 및 최\n신성이 보장되도록 하여야 한다.",
  "2023_120": "120. 다음 중 정보보호 위험관리 절차에 대한 설명으\n로 가장 적절하지 않은 것은?\n① 현황 및 흐름분석 : 관리체계 전 영역에 대한 정\n보서비스 및 개인정보 처리 현황을 분석하고 업무\n절차와 흐름을 파악하여 문서화하며 이를 주기적\n으로 검토하여 최신성을 유지한다.\n② 위험평가 : 조직의 대내외 환경분석을 통해 유\n형별 위협정보를 수집하고 조직에 적합한 위험\n평가 방법을 선정하여 관리체계 영역에 대한 위\n험을 평가한다.\n③ 정보자산 식별 : 조직의 업무 특성에 따라 관리\n체계 범위 내 일부 중요 정보자산만을 식별하고\n중요도를 산정한다.\n④ 보호대책 선정 : 위험 평가 결과에 따라 식별된\n위험을 처리하기 위하여 조직에 적합한 보호대\n책을 선정하고, 보호대책의 우선순위와 일정·\n담당자·예산 등을 포함한 이행계획을 수립하여\n야 한다.\n1 -",
  "2024_101": "101. 다음 리눅스 명령어 혹은 서비스 중 외부에서 시\n스템에 등록된 사용자의 정보를 확인하기 위해\n직접적으로 활용되며 권한탈취를 위한 사전조사\n용도로 사용되는 것으로 가장 적절한 것은?\n① finger ② echo\n③ NFS ④ talk",
  "2024_102": "102. 제로 트러스트(Zero Trust) 개념에 대한 설명으로\n가장 적절하지 않은 것은?\n① 정보시스템 및 서비스에 대한 접속요구가 있을\n때 네트워크가 이미 침해된 것으로 간주하고 불\n확실성을 최소화하도록 설계된 개념이다.\n② 악의적인 상대에 의해 지속적으로 노출되고 잠\n재적으로 침해될 수 있는 시스템의 구성요소,\n서비스 및 사용자를 다루는 일련의 원칙으로 정\n의할 수 있다.\n③ 보안위협이 언제 어디서든 발생 가능하다는 전\n제하에 요건(신뢰도 평가, 인증, 권한부여 등)을\n갖추지 않은 사용자·기기는 데이터, 컴퓨팅 서\n비스 등의 접근을 제한한다.\n④ 내부 데이터 보호보다는 기관·기업의 경계 기\n반 보안체계 구축을 더욱 강화하여야 한다는 개\n념이다.",
  "2024_103": "103. 보안 솔루션에 대한 설명으로 가장 적절한 것은?\n① DNS : 메일 서버 앞단에 위치하여 프록시 메일\n서버로 동작하며 SMTP 프로토콜을 이용한 DoS\n공격이나 폭탄 메일, 스팸 메일을 차단한다.\n② DLP : 문서 보안에 초점을 둔 기술로 문서의 열\n람, 편집, 인쇄에 접근권한을 설정하여 통제하는\n방식을 이용한다.\n③ DRM : 사용자 수준에서 조직의 기밀정보가 유\n출되는 것을 막는 솔루션으로 사용자의 다양한\n데이터 전송 인터페이스를 제어하는 방식을 이\n용한다.\n④ NAC : 네트워크 접근제어 솔루션으로 엔드 포\n인트 단말기가 회사의 내부 네트워크에 접속을\n시도할 때 이를 제어하고 통제한다.\n- 19",
  "2024_104": "104. 웹서버 보안을 위해 위험한 형식의 파일 업로드를\n막기 위한 보안 대책으로 가장 적절하지 않은 것은?\n① 파일들이 서버에서 실행될 수 없도록 실행 속성\n을 제거한다.\n② 화이트 리스트 방식으로 허용된 형식의 파일만\n업로드 되도록 한다.\n③ 파일들이 저장되는 경로가 웹 서버의 문서 디렉\n터리 내부에 고정되도록 설정한다.\n④ 서버에 파일을 저장할 때 파일 이름과 경로를\n사용자가 유추할 수 없는 임의의 문자열로 변\n경하여 저장한다.",
  "2024_105": "105. 다음 C언어 코드가 갖는 문제점을 지칭하는 취약\n점으로 가장 적절한 것은?\n#include <stdio.h>\nint main() {\nchar name[100];\nprintf(\"Enter your name: \");\nscanf(\"%99s\", name);\nprintf(name);\n...\nreturn 0;\n}\n① 스택 오버플로우 취약점\n② 경쟁 조건 취약점\n③ 포맷 스트링 취약점\n④ 명령어 주입 취약점",
  "2024_106": "106. 블록 암호 시스템의 운용 모드 중 GCM(Galois/\nCounter Mode)에 대한 설명으로 가장 적절하지\n않은 것은?\n① 메시지 암호화를 위해 CTR 모드를 이용한다.\n② 메시지 인증코드(MAC) 값을 생성하기 위해서는\n해시 함수를 사용한다.\n③ 각 블록을 병렬처리 하는 게 가능하므로 실행\n속도를 높일 수 있다.\n④ 전송하는 메시지에 대한 기밀성은 제공하지만\n메시지 무결성은 보장하지 않는다.\n9 -",
  "2024_107": "107. 다음 설명에 해당하는 것으로 가장 적절한 것은?\n조직이 자신에게 적합한 보안 정책을 수립하고\n수립된 보안 정책에 의해 보안 관련 조직을 구성\n하여 일련의 보안 활동을 수행하는 것\n① 권한관리 ② 보안 거버넌스\n③ 위험분석 ④ 접근통제",
  "2024_108": "108. 다음 「개인정보보호법」 제3절 가명정보의 처\n리에 관한 특례 사항에 대한 설명으로 가장 적\n절하지 않은 것은?\n① 개인정보처리자는 통계작성, 과학적 연구, 공익\n적 기록보존 등을 위하여 정보주체의 동의 없\n이 가명정보를 처리할 수 있다.\n② 개인정보처리자는 가명정보를 처리하는 과정에\n서 특정 개인을 알아볼 수 있는 정보가 생성된\n경우에는 지체 없이 정보주체에게 통지한 후\n정보를 처리할 수 있다.\n③ 가명정보를 처리하는 자는 특정 개인을 알아보\n기 위한 목적으로 가명정보를 처리해서는 아니\n된다.\n④ 개인정보처리자는 가명정보를 처리하고자 하는\n경우에는 가명정보의 처리 목적, 제3자 제공 시\n제공받는 자 등 가명정보의 처리 내용을 관리\n하기 위하여 대통령령으로 정하는 사항에 대한\n관련 기록을 작성하여 보관하여야 한다.",
  "2024_109": "109. 다음 중 VLAN에 대한 설명으로 가장 적절하지\n않은 것은?\n① 하나의 VLAN내 ARP Request, NetBIOS Name\nQuery와 같은 브로드캐스트 패킷을 분할된 여\n러 개의 전체 네트워크로 확장·전송하는 기능\n을 제공한다.\n② 웜과 같은 악성 코드가 발생하는 경우 범위는\n제한할 수 있어 목적별로 네트워크를 분리하여\n보안 수준을 높일 수 있다.\n③ 하나의 스위치에 연결된 2계층 네트워크를 VLAN\n으로 분할하면 여러개로 구별되는 브로드캐스\n트 도메인을 만들 수 있다.\n④ 클라이언트가 특정 VLAN에 할당되어 있을 때,\n클라이언트는 자신이 속한 VLAN을 인식하지 못\n한 채 일반적인 통신을 할 때와 똑같이 프레임\n을 스위치에 전달한다.\n- 20",
  "2024_110": "110. 외부 IP 주소의 임의 포트에서 내부 ftp 서버로\n접속하려는 트래픽을 탐지 및 차단하기 위한\nSnort 탐지규칙으로 가장 적절한 것은?\n① alert tcp !192.168.0.0/24 any → 192.168.0.0/24\n21 (msg:“illegal ftp attempt”)\n② drop tcp !192.168.0.0/24 any → 192.168.0.0/24\n21 (msg:“illegal ftp attempt”)\n③ alert tcp 192.168.0.0/24 any → !192.168.0.0/24\n21 (msg:“illegal ftp attempt”)\n④ drop tcp 192.168.0.0/24 any → !192.168.0.0/24\n21 (msg:“illegal ftp attempt”)",
  "2024_111": "111. 「개인정보보호법」에 따라 개인정보처리자는\n개인정보가 분실·도난·유출되었음을 알게 되\n었을 때, 지체없이 정보주체에게 알려야 할 사\n항으로 가장 적절하지 않은 것은?\n① 정보주체에게 피해가 발생한 경우 신고 등을 접\n수할 수 있는 담당 부서 및 연락처\n② 유출 등이 된 시점과 그 경위\n③ 유출된 개인정보의 규모 및 피해액\n④ 유출 등으로 인하여 발생할 수 있는 피해를 최\n소화하기 위하여 정보주체가 할 수 있는 방법\n등에 관한 정보",
  "2024_112": "112. 다음과 같은 업무 환경에서 사용자들이 활용하게 할\n수 있는 정보보호 시스템으로 가장 적절한 것은?\n감리 대상 기업 A는 외주 근로자가 많아 이들이\n내부망에 접속 시 안전하게 관리해야 하는 필요성\n이 있음. 서울시에 본사 및 세종시에 지사가 존재\n하는 기업이며 이 두 개 지역의 네트워크를 안전\n하게 연결해야 함\n① Firewall ② VPN\n③ PGP ④ IPS",
  "2024_113": "113. 스푸핑을 통해 공격자는 자신의 신분을 위장하여\n정보시스템에서 허가되지 않은 정보의 열람 혹은\n거짓정보의 전송이 가능해진다. 이러한 스푸핑 기\n술 중 IP 주소와 해당 MAC 주소의 매핑 정보를 위\n조하는 기법을 사용하는 것으로 가장 적절한 것은?\n① ARP 스푸핑 ② IP 스푸핑\n③ ICMP 리다이렉트 ④ DNS 스푸핑\n0 -",
  "2024_114": "114. SSO(Single Sign On)에 대한 설명으로 가장 적절\n하지 않은 것은?\n① SSO 서버로부터 인증에 성공하면 SSO 서버가\n관리하는 다른 시스템에 대한 접근권한을 모두\n얻을 수 있다.\n② 대표적인 인증 방법으로는 커버로스(Kerberos)를\n이용한 윈도우 액티브 디렉터리가 있다.\n③ 보안을 강화하기 위해 중요 정보에 접근할 때는\n지속적인 재인증을 요구하기도 한다.\n④ 각 시스템마다 인증 정보를 저장하므로 단일 장\n애점(single point of failure) 문제가 존재하지\n않는다.",
  "2024_115": "115. 공개키 암호 시스템에 대한 설명으로 가장 적절\n하지 않은 것은?\n① 공개키 암호 방식에서는 공개키와 개인키 키 쌍\n이 존재하며, 암복호화에 서로 다른 키를 사용\n하므로 비대칭키 암호 방식이라고도 한다.\n② 송신자가 수신자의 공개키를 이용하여 암호화\n한 메시지를 전송하면 수신자는 자신의 개인키\n를 이용하여 복호화를 수행한다.\n③ 공개키 암호 방식은 대칭키 암호화 방식에 비해\n관리해야 할 키의 개수가 많지만, 계산 속도가\n빨라 메시지 암호화에 주로 사용한다.\n④ 타원곡선 상의 이산대수 문제를 이용하는 ECC\n(Elliptic curve cryptography) 알고리즘은 RSA\n등에 비해 상대적으로 짧은 길이의 키를 사용\n하여 대등한 수준의 안전성을 제공할 수 있다\n는 장점이 있다.",
  "2024_116": "116. 해시 함수를 이용하는 메시지 인증 코드(HMAC :\nHashed MAC)에 대한 설명으로 가장 적절하지\n않은 것은?\n① 수신자는 메시지의 변경 여부 뿐만 아니라 올바\n른 송신자가 생성한 메시지임을 확인할 수 있다.\n② 송신자와 수신자 사이에 메시지 인증을 제공하\n지만, 제3자를 위한 증명은 제공할 수 없다.\n③ 송신자가 메시지를 보낸 사실을 부인하는 경우\n수신자는 송신자가 메시지를 보낸 사실을 증명\n할 수 있다.\n④ 메시지 인증코드를 생성하기 위해 송신자와 수\n신자는 사전에 공통의 비밀키를 공유해야 한다.\n- 21",
  "2024_117": "117. 하이브리드 암호 시스템에 대한 설명으로 가장\n적절하지 않은 것은?\n① 대칭키 암호화 방식에서 사용하는 세션키는 공\n격자의 추측 공격에 대응하기 위해 의사난수 생\n성기를 이용하여 생성한다.\n② 메시지를 암호화할 때는 공개키 암호 시스템을\n이용하므로 별도의 키 분배 과정을 필요로 하지\n않는다.\n③ 메시지 암호화에 사용한 세션키는 수신자의 공개\n키로 암호화하여 암호문과 결합하여 전송한다.\n④ 전자메일 암호화 도구인 PGP에서도 하이브리드\n암호 시스템을 이용하여 암호화를 수행한다.",
  "2024_118": "118. 다음 중 인증 방식에 대한 설명으로 가장 적절\n하지 않은 것은?\n① 사용자가 알고있는 정보에 의존하는 지식 기반\n인증방식은 관리 비용이 상대적으로 저렴하지만\n공격자에 의한 추측 가능성의 위험이 있다.\n② 사용자가 가지고 있는 인증 수단을 이용하는 소\n유 기반 인증 방식은 복제 가능성이 있고 분\n실·파손·고장 등이 발생하는 경우 인증이 불\n가능하다는 단점이 있다.\n③ 지문, 망막, 홍채 등을 이용하는 생체 인증방식은\n생체 템플릿이라고 불리는 자신의 생체 정보를\n데이터베이스 등에 등록 없이 인증이 가능하다.\n④ 지식, 소유, 존재 및 행위에 의한 인증 수단 중\n2가지의 인증 수단을 결합하여 사용하는 인증\n방식을 이중(Two-factor) 인증이라 한다.",
  "2024_119": "119. 다음 중 정상적인 네트워크 접근을 공격시도로\n오인하여 가용성이 침해받는 경우에 해당하는\n것으로 가장 적절한 것은?\n① True-Positive ② True-Negative\n③ False-Positive ④ False-Negative",
  "2024_120": "120. 다음 중 블록체인을 대상으로 한 보안 공격 유\n형으로 가장 적절하지 않은 것은?\n① 이중 지불 공격(Double Spending Attack)\n② 허위 정보 전파 공격(Eclipse Attack)\n③ 재진입 공격(Reentrancy Attack)\n④ 스머프 공격(Smurf Attack)\n1 -",
  "2025_104": "104. 다음 그림과 같이 암호화를 수행하는 블록 암호\n시스템의 운용 모드에 대한 설명으로 가장 적절\n하지 않은 것은?\n① 암호화/복호화를 수행하는 과정에서 병렬처리가\n가능하므로 고속 구현이 가능하다.\n② 초기 벡터(IV) 값은 송·수신자 사이에 미리\n약속되어 있어야 하지만 공개된 값을 사용해도\n무방하다.\n③ 암호문 블록 1개가 손상되는 경우, 복호화 수행 시\n평문 블록에 미치는 영향은2개의 블록에 그친다.\n④ 이전 단계에서 암호화한 결과로 출력된 암호화\n블록에대해서는이번단계평문블록과XOR한후\n암호화 과정을 수행한다.",
  "2025_105": "105. 다음 중 SSL/TLS의 핸드셰이크 프로토콜에서\n이루어지는 작업과 가장 거리가 먼 것은?\n① 클라이언트 인증\n② 서버 인증\n③ HTTP 전송데이터에대한MAC계산및암호화\n④ 암호 알고리즘 협상",
  "2025_106": "106. DNS 스푸핑에 대한 설명으로 가장 적절하지 않은\n것은?\n① DNS 질의/응답에 사용하는 UDP 프로토콜의\n비연결 취약성을 이용한 공격이다.\n② 공격자는DNS스푸핑을수행하기위해공격대상이\n보내는 메시지를 스니핑해야 한다.\n③ 공격대상에게 전달되는 DNS 질의 메시지를\n조작하거나 DNS 서버의 캐시 정보를 삭제하는\n방법을 이용한다.\n④ 공격이 성공하는 경우, 공격대상은 정상적인\nURL로 접속하지만 실제로는 공격자가 만든 가짜\n사이트로 접속하게 된다.\n20 -",
  "2025_107": "107. VPN 터널링 프로토콜 L2TP(Layer 2 Tunneling\nProtocol)와 SSTP(Secure Socket Tunneling\nProtocol)에서 기밀성, 인증 등의 보안 서비스를\n제공하기 위해 사용되는 프로토콜로 가장 적절하게\n짝지어진 것은?\n① L2TP – IPSec, SSTP – TLS\n② L2TP – PAP, SSTP – SSH\n③ L2TP – TLS, SSTP – PAP\n④ L2TP – SSH, SSTP – IPSec",
  "2025_108": "108. 다음 설명에 대한 보안 기술로 가장 적절한 것은?\n과거의 IP 관리 시스템에서 발전한 솔루션으로,\nMAC 주소를 기반으로 접근 제어 및 인증을 수행\n하여 임의의 사용자가 접속하는 것을 차단한다.\n① VPN (Virtual Private Network)\n② VLAN (Virtual Local Area Network)\n③ DRM (Digital Right Management)\n④ NAC (Network Access Control)",
  "2025_109": "109. 다음에서 설명하는 악성코드로 가장 적절한것은?\n자신의 내부에 압축 또는 암호화된 형태로 포함되어\n있는 데이터를 이용하여 악성코드를 생성하는 방식\n으로 동작하며, 백신 프로그램을 통한 탐지가 어렵고\n실제 실행을 해보지 않고서는 악성코드 여부를 확인\n하는 것이 어렵다.\n① Dropper ② Keylogger\n③ Adware ④ Spyware",
  "2025_110": "110. 다음 중 아래와 같은 사물인터넷 디바이스 관련\n보안 위협에 대한 설명으로 가장 적절한 것은?\nDevice Pool에잘못된시간정보를송신하여디바이스\n가계속적으로시간을교정하는데자원을소모하도록\n하는 공격이다.\n① Spoofing ② De­synchronization\n③ Sybil ④ Eavesdropping\n- 2",
  "2025_111": "111. 다음 중 선처리 구문(Prepared Statement)과 저장\n프로시저(Stored Procedure)의 사용을 통해 제공할\n수있는취약점방어형태로가장적절한것은?\n① 쿠키 변조 ② SQL 삽입\n③ 파일 업로드 ④ 취약한 비밀번호",
  "2025_112": "112. 다음 중 데이터베이스 암호화 기술에 대한 설명\n으로 가장 적절하지 않은 것은?\n① Plug-In 방식은 DB 서버에 암복호화 모듈이 설\n치되는 방식으로, 구축 시 응용 프로그램의 수\n정을 최소화할 수 있다.\n② API 방식은 DB 서버에 영향을 주지 않아 DB 서\n버의 성능 저하는 적은 편이지만, 구축 시 응용\n프로그램 전체 또는 일부의 수정이 필요하다.\n③ Plug-In 방식은 암복호화 모듈이 라이브러리\n형태로 각 애플리케이션 서버에 설치되고, 응용\n프로그램에서 해당 암복호화 모듈을 호출하는\n방식이다.\n④ API 방식과 Plug-In 방식의 장점을 혼용한 하이\n브리드 방식에서는 대용량 트랜잭션 처리에\nPlug-In 방식을 사용하고, 성능 저하가 발생할\n수 있는 부분은 API 방식을 사용한다.",
  "2025_113": "113. 다음과 같은 웹 애플리케이션 취약점에 대한 설명\n으로 가장 적절한 것은?\n웹 애플리케이션을 사용해서 다른 최종 사용자의 클라\n이언트에서임의의스크립트가실행되는취약점이다.\n① Directory Indexing\n② XPath Injection\n③ Cross-Site Request Forgery(CSRF)\n④ Cross Site Scripting(XSS)",
  "2025_114": "114. 블록체인은참여자들이수행하는모든트랜잭션들을\n모은 장부라고 할 수 있다. 다음 중 블록체인의\n특성에대한설명으로가장적절하지않은것은?\n① 블록체인은 분산시스템이다.\n② 블록체인상의 트랜잭션 유효성에 대한 검증은\n어떤 참여자라도 수행할 수 있다.\n③ 블록체인상의 트랜잭션에 대한 취소는 해당\n트랜잭션의 삭제를 통해 이루어진다.\n④ 블록체인을 보호하기 위해 공개키 암호, 해시함수\n등과 같은 기술을 사용할 수 있다.\n21 -",
  "2025_119": "119. 다음 중 OECD 개인정보보호 원칙으로 가장 적절\n하지 않은 것은?\n① 수집 제한의 원칙 : 개인정보는 적법하고 공정한\n방법을 통해 수집되어야 한다.\n② 정보 정확성의 원칙 : 이용 목적상 필요한 범위\n내에서 개인정보의 정확성, 완전성, 최신성이 확보\n되어야 한다.\n③ 안전성 확보의 원칙 : 개인정보의 침해, 누설, 도용\n등을 방지하기 위한 물리적·조직적·기술적 안전\n조치를 확보해야 한다.\n④ 비공개의 원칙 : 개인정보의 처리 및 보호를 위\n한 정책과 관리자의 정보는 비공개하여야 한다.",
  "2025_120": "120. 다음 중 가명정보의 기술적 보호조치에 대한 설\n명으로 가장 적절하지 않은 것은?\n① 추가정보와 가명정보는 분리하여 보관하는 것을\n원칙으로 하고, 불가피한 사유로 물리적인 분리\n가 어려운 경우 DB 테이블 분리 등 논리적으로\n분리하는 것도 가능하다.\n② 가명정보처리자는 추가정보의 분리 보관, 접근권한\n관리, 접근통제 및 접속기록의 보관/점검 등의\n기술적 보호조치를 취한다.\n③ 추가정보의 활용 목적달성 및 불필요한 경우에는\n추가정보를파기할 수있으며파기에대한 기록을\n작성하고 보관한다.\n④ 개인정보처리자는 가명정보 또는 추가정보에\n접근할 수 있는 담당자를 업무목적 달성에\n필요한 적정 인원으로 지정하며, 접근권한은\n업무에 상관없이 균등 부여한다.\n22 -",
  "2026_101": "101. 다음은 SQL Injection 공격을 예방하기 위한 시큐어\n코딩 기법에 대한 설명이다. SQL Injection 공격을\n예방하기 위해 권장되는 방법을 모두 고른 것으로\n가장 적절한 것은?\n<보기>\nㄱ. Parameterized Query는 SQL 질의문과 사용자 입력\n데이터를 분리하여 처리함으로써 사용자 입력이\nSQL 구문으로 해석되는 것을 방지하는 방법이다.\nㄴ. Stored Procedure는 데이터베이스 내부에 정의된\n프로시저를 사용하여 SQL 문을 실행하는 방식으로,\n입력값을 파라미터로 처리하면 SQL Injection 공격을\n줄일 수 있다.\nㄷ. Dynamic SQL은 프로그램에서 SQL 문을 문자열\n형태로 조합하여 실행하는 방식으로 SQL Injection\n공격을 예방하는 대표적인 방법이다.\nㄹ. 입력값 검증(Input Validation)은 사용자 입력값의\n형식, 길이, 범위 등을 검사하여 악성 입력이 시스템에\n전달되는 것을 차단하는 보안 기법이다.\n① ㄱ, ㄴ ② ㄱ, ㄴ, ㄹ\n③ ㄱ, ㄷ ④ ㄱ, ㄴ, ㄷ, ㄹ",
  "2026_102": "102. 웹 서비스에서 이미지 업로드 기능을 제공하면서,\n확장자 검사와 함께 MIME 타입을 확인하도록\n구현하였으나 여전히 서버 측 스크립트 실행 위험이\n존재한다. 다음 중 가장 적절한 보완 방안은?\n① 업로드된 파일의 파일명을 무작위로 변경하여\n공격자가 경로를 예측하지 못하도록 한다.\n② 업로드 파일 크기를 제한하여 대용량 공격을 방지\n한다.\n③ 이미지 파일은 안전하다고 가정하고 별도의 처리\n없이 웹 루트에 저장한다.\n④ 업로드 파일을 실행 불가능한 별도 저장소에 두고,\n서버에서 직접 해석되지 않도록 분리한다.\n- 21",
  "2026_103": "103. 소스코드 취약점 유형 중에서 다음과 같은 Java\n코드에 존재하는 취약점으로 가장 적절한 것은?\nString price = request.getRawParameter(\"price\");\nint p = Integer.parseInt(price);\ntotal = total + p;\n① SQL Injection 여부\n② 입력값 검증 및 범위 체크\n③ 위험한 형식의 파일 업로드 취약점\n④ 디렉토리 경로 조작",
  "2026_104": "104. 다음은 API 보안 취약점에 대한 설명이다. 각 설명에\n해당하는 취약점으로 가장 올바르게 짝지은 것은?\nA. API에서 요청 대상이 되는 리소스 식별자(resource\nidentifier)를 변경하거나 조작하여 권한이 없는\n다른 사용자의 데이터나 리소스에 접근할 수\n있는 취약점이다. 이 취약점은 API 서버가 요청된\n리소스에 대해 사용자의 접근 권한을 충분히\n검증하지 않을 때 발생한다.\nB. API 요청 처리 과정에서 인증 또는 권한 검증\n절차가 미흡하여, 공격자가 관리자 기능 또는\n민감한 API 기능을 실행할 수 있는 취약점이다.\nAPI에서 인증 정보(예: 토큰, 세션, API Key)의\n검증 또는 관리가 부적절하여 공격자가 정상\n사용자의 인증 상태를 위조하거나 우회하여\nAPI 기능에 접근할 수 있는 취약점이다.\nㄱ. Broken Object Level Authorization\nㄴ. Broken Authentication\nㄷ. Unrestricted Resource Consumption\nㄹ. Security Misconfiguration\n① A-ㄱ, B-ㄴ ② A-ㄴ, B-ㄱ\n③ A-ㄱ, B-ㄷ ④ A-ㄹ, B-ㄴ\n1 -",
  "2026_105": "105. 다음 중 개인정보보호법에 대한 설명으로 적절한\n것을 모두 고른 것은?\n<보기>\nㄱ. 개인정보처리자가 개인정보의 분실·도난·유출\n사실을 알게 된 경우에는, 유출된 개인정보의 항목,\n유출 시점과 경위, 피해 최소화 방법, 개인정보\n처리자의 대응조치 및 구제절차 등을 지체 없이\n정보주체에게 통지하여야 한다.\nㄴ. 개인정보처리자가 개인정보 처리 업무를 제3자에게\n위탁하는 경우에는, 수탁자가 개인정보를 안전하게\n처리하도록 위탁계약에 보호조치 사항 등을 반영\n하고, 수탁자의 처리 실태를 관리·감독하여야 한다.\nㄷ. 개인정보 영향평가(PIA)는 개인정보파일 운영과\n관련된 법정 보유기간이 경과한 개인정보 처리\n기록을 삭제·파기하기 위하여 사후적으로 실시하는\n절차이다.\nㄹ. 개인정보처리자가 개인정보 처리 업무를 위탁하는\n경우에는 위탁하는 업무의 내용과 수탁자의 성명\n(명칭)을 정보주체가 언제든지 쉽게 확인할 수\n있도록 공개하여야 한다.\n① ㄱ, ㄴ ② ㄱ, ㄷ\n③ ㄴ, ㄷ, ㄹ ④ ㄱ, ㄴ, ㄹ",
  "2026_106": "106. 다음 중 정보보호 위험 평가 및 정량적 위험 분석에\n대한 설명으로 가장 적절하지 않은 것은?\n① 정보보호 위험은 일반적으로 위협이 취약점을 이용\n하여 정보 자산에 손실을 발생시킬 가능성과 그\n영향의 결합으로 정의되며, 위험 수준은 보통\nRisk = Likelihood × Impact 형태로 표현된다.\n② 정량적 위험 분석에서는 자산 가치, 위협 발생\n빈도, 취약성 수준 등을 수치화하여 위험도를\n계산할 수 있으며, 일반적으로 Risk = Asset Value ×\nThreat Frequency × Vulnerability 형태로 표현된다.\n③ 연간 예상 손실(ALE: Annualized Loss Expectancy)은\n1회 사고 발생 시 예상 손실(SLE)에 연간 발생\n빈도(ARO)를 곱하여 산정하며, 이는 보안 투자 의사\n결정에 활용될 수 있다.\n④ 정보보호 위험은 시스템의 처리 성능과 네트워크\n처리 속도의 곱으로 산정되며, 성능이 높을수록\n위험 수준은 감소한다.\n- 22",
  "2026_107": "107. 다음 중 클라우드 환경에서 웹 애플리케이션을\n운영할 때, 보안사고 발생 시 신속한 원인 분석과\n대응을 위해 가장 우선적으로 준비해야 할 사항\n으로 적절한 것은?\n① 백업 시스템 도입 및 정책 강화\n② 애플리케이션 코드의 주기적 취약점 점검\n③ 클라우드 리소스의 접근 권한 최소화\n④ 로그 및 감사 기록의 중앙 집중화와 실시간 모니\n터링 체계 구축",
  "2026_108": "108. 다음 중 개인정보보호법 상 개인정보처리자가\n개인정보의 처리에 대하여 정보주체의 동의를\n받는 방법으로 가장 적절하지 않은 것은?\n① 동의 내용이 적힌 서면을 정보주체에게 직접 발급\n하거나 우편 또는 팩스 등의 방법으로 전달하고,\n정보주체가 서명하거나 날인한 동의서를 받는 방법\n② 전화를 통하여 동의 내용을 정보주체에게 알리고\n동의의 의사표시를 확인하는 방법\n③ 전화를 통하여 동의 내용을 정보주체에게 알리고\n정보주체에게 인터넷주소 등을 통하여 동의 사항을\n확인하도록 하는 방법\n④ 인터넷 홈페이지 등에 동의 내용을 게재하고 정보\n주체가 동의 여부를 표시하도록 하는 방법",
  "2026_109": "109. 다음 중 스트림 암호(Stream Cipher)의 일반적인\n특성에 대한 설명으로 가장 적절하지 않은 것은?\n① 스트림 암호는 일반적으로 평문(plaintext)과 키 스트림\n(key stream)을 XOR 연산하여 암호문(ciphertext)을\n생성한다.\n② 스트림 암호는 보통 블록 암호보다 지연(latency)이\n낮고 실시간 통신 환경에서 효율적으로 사용될\n수 있다.\n③ 동일한 키와 초기값(IV)을 의사난수 생성기(PRNG)에\n입력하여 생성된 키 스트림을 서로 다른 여러\n메시지에 재사용할 경우 보안 취약점이 발생할\n수 있다.\n④ 스트림 암호는 전송 중 암호문 내 하나의 비트\n에서 오류가 발생하면, 복호화 과정에서 해당\n위치 이후의 모든 평문 데이터에 오류가 전파되는\n특성을 갖는다.\n2 -",
  "2026_110": "110. 위험관리 시 사이버보안 보험(Insurance)의 가입을\n진행할 경우 이를 지칭하는 잔여위험 처리 방법으로\n적절한 것은?\n① 위험경감 ② 위험회피\n③ 위험전가 ④ 위험수용",
  "2026_111": "111. 금융기관의 배포 보안 강화를 위해 다음과 같은\n통제 요건을 설계하고자 한다. 이에 가장 부합하는\n접근 제어 방식은?\nŸ 소스코드 저장소 접근권한과 배포 승인권한의 분리\nŸ 운영자의 비밀번호 인지 없이 수행되는 야간\n자동배포\nŸ 장애 시 한시적 권한 상향 및 사후 감사 추적성\n확보\n① 역할 기반 접근 제어(RBAC)를 적용해 운영자와\n배포 승인자를 분리하고, 서비스 계정은 고정\n비밀번호를 공유하되 변경 이력만 관리한다.\n② 속성 기반 접근 제어(ABAC)를 적용해 시간, 승인\n상태, 장애 여부 같은 조건에 따라 권한을 판단\n하고, 서비스 계정은 비밀관리 시스템에서 단기\n자격증명으로 발급받아 사용한다.\n③ 임의 접근 제어(DAC)로 저장소 소유자가 권한을\n위임할 수 있게 하고, 긴급 상황에서는 운영자가\n필요한 권한을 직접 추가한다.\n④ 강제 접근 제어(MAC)로 모든 사용자의 접근 등급을\n통합 관리하고, 배포 승인과 운영 권한은 시스템\n관리자가 수동으로 일괄 승인한다.",
  "2026_112": "112. 다음 중 클라우드 환경에서 API 키가 코드 저장소에\n노출된 사실이 확인되었을 때, 즉각적인 대응으로\n가장 적절한 것은?\n① 노출된 키를 폐기하고 새 키를 발급한다.\n② 코드 저장소 접근 권한을 제한한다.\n③ API 키는 일정 기간 후 자동 만료되므로 별도의\n조치는 필요치 않다.\n④ 키를 암호화 시킨다.\n- 23",
  "2026_113": "113. 다음 암호에 대한 설명 중 가장 적절하지 않은\n것은?\n① ID기반 암호는 각 개체의 ID나 메일주소 등을 기\n반으로 공개키가 생성되어 키 관리가 용이하다.\n② 동형암호는 암호화된 데이터의 내용을 모르고\n암호화된 채로 더하거나 곱할 수 있는 암호방\n식으로 클라우드 환경에서 대용량의 민감정보\n를 처리하는 서비스에는 적절하지 못하다.\n③ 프록시 재암호는 암호문을 해독하지 않고 다른\n사람이 해독할 수 있는 암호문으로 변환하는\n암호방식으로 클라우드 서비스에 적용하기 좋\n은 암호이다.\n④ 속성기반 암호는 키와 암호 해독자의 속성을\n지정하여 암호를 해독할 수 있는지 여부를 제어\n할 수 있는 암호방식이다.",
  "2026_114": "114. IoT(사물인터넷) 기기 간의 신뢰 네트워크를 구\n축하기 위해 블록체인 기술을 도입할 때, 보안\n및 운영 측면에서 기대할 수 있는 효과나 고려\n사항으로 다음 중 가장 적절한 것은?\n① 블록체인의 합의 알고리즘을 통해 IoT 기기의\n물리적 복제 방지 기능(PUF)을 소프트웨어적으\n로 대체할 수 있다.\n② 스마트 컨트랙트를 활용하여 기기 간의 인증 및\n접근 제어 로직을 분산화함으로써 중앙 서버의\n단일 장애점(SPOF) 문제를 완화할 수 있다.\n③ 퍼블릭 블록체인을 활용하면 별도의 암호화\n과정 없이도 IoT 기기에서 전송되는 민감 데이터\n의 기밀성을 보장할 수 있다.\n④ 모든 IoT 기기가 풀 노드(Full Node)로 참여하게\n함으로써 네트워크 전체의 에너지 효율성을\n제고하고 통신 지연을 제거할 수 있다.\n3 -",
  "2026_115": "115. 다음은 인공지능(AI) 및 머신러닝 모델에 대한\n보안 공격 유형에 관한 설명이다. 각 설명에 해\n당하는 공격 유형으로 가장 올바르게 짝지어진 것은?\nA. 머신러닝 모델의 학습 단계(training phase)에서\n공격자가 의도적으로 조작된 데이터 또는 잘못된\n라벨이 포함된 데이터를 학습 데이터셋에 삽입하여\n모델이 잘못된 패턴을 학습하도록 만드는 공격이다.\n이 공격은 모델의 학습 과정 자체를 왜곡하여 특정\n입력에 대해 오분류가 발생하도록 유도하거나 모델\n전체의 예측 성능을 저하시킬 수 있다.\nB. 이미 학습이 완료된 머신러닝 모델의 추론 단계\n(inference phase)에서 입력 데이터에 사람이 인식\n하기 어려운 수준의 미세한 변형(perturbation)을\n적용하여 모델의 분류 경계를 교란하고 잘못된\n예측 결과를 출력하도록 만드는 공격이다.\nㄱ. Model Extraction Attack\nㄴ. Model Inversion Attack\nㄷ. Data Poisoning Attack\nㄹ. Adversarial Attack\n① A-ㄹ, B-ㄴ ② A-ㄴ, B-ㄱ\n③ A-ㄱ, B-ㄷ ④ A-ㄷ, B-ㄹ",
  "2026_116": "116. 다음 설명이 지칭하는 공격기법으로 가장 적절한\n것은?\n공격대상 시스템에 설치되어 지속적으로 외부에서\n접근이 가능한 상태를 만들고, 보이지 않는 공격자의\n진입점을 구성하여 권한 있는 명령을 실행할 수\n있도록 한다.\n① 루트킷 ② 웜\n③ 바이러스 ④ 봇넷\n- 24",
  "2026_117": "117. 다음 중에서 웹 응용 프로그램에 대한 DoS 공격\n유형에 대한 설명으로 가장 적절하지 않은 것은?\n① 동적 HTTP Reply 공격은 웹 페이지 응답 메시지를\n지속적으로 요구하는 공격이다.\n② Slow HTTP Header DoS 공격은 서버로 전달할\nHTTP 메시지의 헤더 정보를 비정상적으로 조작해\n웹 서버가 헤더 정보를 완전히 수신할 때까지\n연결을 유지하도록 하는 공격이다.\n③ Slow HTTP POST 공격은 사용자가 웹 서버에\n아이디, 패스워드, 게시글 등을 전송할 때\nPOST 메소드를 이용하여 서버와의 커넥션을\n오래 유지해 웹서버가 정상적인 사용자 접속을\n받아들일 수 없게 하는 공격이다.\n④ HTTP GET Flooding 공격은 GET 메소드를 통해\n특정 페이지를 무한대로 요구하는 공격이다.",
  "2026_118": "118. 다음 중 블록체인 네트워크에서 이클립스 공격\n(Eclipse Attack)에 대한 설명으로 가장 적절한\n것은?\n① 공격자가 네트워크 해시 파워의 과반수를 확보\n하여 블록 생성과 체인 선택을 좌우하고, 특정\n거래를 되돌리거나 이중지불을 수행할 수 있게\n하는 합의(Consensus) 공격이다.\n② 공격자가 다수의 가짜 노드를 생성해 네트워크\n참여자를 압도함으로써, 투표 기반 합의에서\n다수결을 장악하거나 네트워크 신뢰 모델을 붕\n괴시키는 공격이다.\n③ 공격자가 특정 노드의 피어 연결을 의도적으로\n편향 또는 고립시켜 해당 노드가 공격자가 통제\n하는 피어들과만 연결되도록 만들고, 블록 및\n트랜잭션 전파 정보를 왜곡하여 피해 노드의 체인\n인식, 거래 전파, 검증 판단에 영향을 주는 네\n트워크 계층 공격이다.\n④ 생략\n4 -",
  "2026_119": "119. 다음은 방화벽에 대한 설명이다. 이 중 가장\n적절하지 않은 설명은?\n① 상태 기반 방화벽(Stateful Firewall)은 연결 상태\n정보를 추적하여 패킷을 필터링한다.\n② 애플리케이션 방화벽은 HTTP, FTP 등 응용계층\n트래픽을 제어할 수 있다.\n③ 패킷 필터링 방화벽은 데이터의 내용(payload)을\n깊이 분석하여 공격을 탐지한다.\n④ 방화벽은 네트워크 경계에서 접근제어 정책을\n적용한다.",
  "2026_120": "120. 다음은 네트워크 보안 기술 및 대표적인 네트워크\n공격 유형에 대한 설명이다. 이 중 가장 적절하지\n않은 설명은?\n① 네트워크 세그멘테이션(Network Segmentation)은\n네트워크를 여러 보안 영역으로 논리적 또는\n물리적으로 분리하여 공격 확산을 방지하고\n보안 정책 적용을 용이하게 하는 보안 기법이다.\n② TLS(Transport Layer Security)는 통신 데이터의\n기밀성과 무결성 기능 대신에 안전한 네트워크\n라우팅 기능을 제공하기 위한 보안 프로토콜이다.\n③ DNSSEC(Domain Name System Security Extensions)는\nDNS 응답 데이터의 무결성(integrity)과 출처 인증\n(authentication of origin)을 제공하기 위한 보안\n기술이다.\n④ Smurf Attack은 네트워크 자원을 소모시켜 정상\n적인 서비스를 제공하지 못하게 하는 서비스 거부\n공격(DoS) 유형에 해당한다.\n- 25"
};

    let currentCategory = '전체';

    function renderTopics() {
        const container = document.getElementById('accordion-container');
        container.innerHTML = '';
        
        let filtered = topicMapping;
        if (currentCategory !== '전체') {
            filtered = topicMapping.filter(item => item.category === currentCategory);
        }

        document.getElementById('topic-count-badge').textContent = filtered.length;

            const accItem = document.createElement('div');
            accItem.className = 'accordion-item';
            accItem.id = `accordion-${idx}`;

            let yearButtonsHtml = '';
            item.questions.forEach(q => {
                yearButtonsHtml += `<button class="year-btn q-btn-${q.year}-${q.num}" onclick="openQuestion('${q.year}', '${q.num}', ${idx}, this)">
                    ${q.year}년 <span class="num-label">${q.num}번</span>
                </button>`;
            });

            accItem.innerHTML = `
                <button class="accordion-trigger" onclick="toggleAccordion(${idx})">
                    <div class="card-header-row">
                        <div class="card-title-group">
                            <span class="rank-badge">RANK ${String(idx + 1).padStart(2, '0')}</span>
                            <span class="concept-title">${item.concept}</span>
                            <span class="category-tag">${item.category}</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 0.8rem;">
                            <span class="freq-count-badge">총 ${item.count}회 기출</span>
                            <span class="arrow">▼</span>
                        </div>
                    </div>
                    <div class="card-meta-grid">
                        <div class="meta-label">출제 범위</div>
                        <div class="meta-value accent">${item.scope}</div>

                        <div class="meta-value" style="font-weight: 500; color: #ffffff;">${item.core_concept}</div>

                        <div class="meta-value">${item.features}</div>
                        <div class="meta-label">기출 연도</div>
                        <div class="meta-value">${item.years.join(', ')}년</div>

                </button>
                <div class="accordion-content" style="max-height: 0px;">
                    <div class="accordion-inner">
                        <div class="section-title">출제 기출문제 선택 (클릭 시 하단에 문제 전환)</div>
