<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시스템구조 12개년 빈출 개념 정밀 뷰어</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080b13;
            --card-bg: rgba(17, 24, 39, 0.75);
            --border-color: rgba(255, 255, 255, 0.06);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent-violet: #8b5cf6;
            --accent-blue: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%);
            --accent-glow: rgba(139, 92, 246, 0.12);
            --success: #10b981;
            --card-hover-border: rgba(139, 92, 246, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 2.5rem 1.5rem;
            min-height: 100vh;
            background-image: 
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.06) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.06) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.6rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.6rem;
            letter-spacing: -0.03em;
        }

        header p.subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
        }

        .meta-badges {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .badge {
            background: var(--border-color);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 0.35rem 0.9rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 500;
            backdrop-filter: blur(8px);
        }

        .badge.accent {
            background: rgba(139, 92, 246, 0.12);
            border-color: rgba(139, 92, 246, 0.25);
            color: #c084fc;
        }

        .filter-section {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.45rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .filter-btn:hover, .filter-btn.active {
            border-color: var(--accent-violet);
            color: #ffffff;
            background: rgba(139, 92, 246, 0.08);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .accordion-list {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-bottom: 4rem;
        }

        .accordion-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .accordion-item:hover {
            border-color: var(--card-hover-border);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .accordion-trigger {
            width: 100%;
            background: none;
            border: none;
            color: inherit;
            padding: 1.6rem 1.8rem;
            text-align: left;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .card-title-group {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .rank-badge {
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .concept-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        .category-tag {
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            padding: 0.15rem 0.45rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .freq-count-badge {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.15);
            color: var(--success);
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .card-meta-grid {
            display: grid;
            grid-template-columns: 90px 1fr;
            row-gap: 0.5rem;
            column-gap: 0.8rem;
            width: 100%;
            font-size: 0.88rem;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 0.8rem;
            margin-top: 0.2rem;
        }

        .meta-label {
            color: var(--text-muted);
            font-weight: 600;
        }

        .meta-value {
            color: var(--text-secondary);
            word-break: keep-all;
        }

        .meta-value.accent {
            color: #c8a2c8;
        }

        .accordion-trigger .arrow {
            transition: transform 0.3s ease;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .accordion-item.active .accordion-trigger .arrow {
            transform: rotate(180deg);
            color: var(--accent-violet);
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            background: rgba(0, 0, 0, 0.18);
        }

        .accordion-inner {
            padding: 1.6rem 1.8rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .section-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 0.3rem;
            margin-top: 0.2rem;
        }

        .year-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .year-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.35rem 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .year-btn:hover {
            background: var(--accent-gradient);
            border-color: transparent;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.25);
            transform: translateY(-1px);
        }

        .year-btn.active-btn {
            background: var(--accent-gradient);
            border-color: transparent;
            box-shadow: 0 4px 10px rgba(139, 92, 246, 0.3);
            color: #ffffff;
        }

        .year-btn .num-label {
            opacity: 0.7;
            font-size: 0.7rem;
        }

        .inline-question-viewer {
            background: #090d16;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            transition: all 0.3s ease;
        }

        .viewer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 0.5rem;
        }

        .viewer-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #60a5fa;
            font-family: 'Outfit', sans-serif;
        }

        .viewer-close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: color 0.2s;
        }

        .viewer-close-btn:hover {
            color: #ef4444;
        }

        .viewer-body {
            font-size: 0.92rem;
            line-height: 1.7;
            color: #d1d5db;
            white-space: pre-wrap;
            overflow-y: auto;
            max-height: 400px;
            padding-right: 0.5rem;
        }

        .viewer-body::-webkit-scrollbar {
            width: 6px;
        }
        .viewer-body::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.01);
        }
        .viewer-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .memo-section {
            background: rgba(139, 92, 246, 0.02);
            border: 1px dashed rgba(139, 92, 246, 0.15);
            border-radius: 8px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-bottom: 0.5rem;
        }

        .memo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.04);
            padding-bottom: 0.4rem;
        }

        .memo-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #c084fc;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .memo-date {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .memo-content-box {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #d1d5db;
            white-space: pre-wrap;
            min-height: 24px;
        }

        .memo-placeholder {
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.85rem;
        }

        .memo-textarea {
            width: 100%;
            min-height: 150px;
            background: #090d16;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: var(--text-primary);
            padding: 0.8rem 1rem;
            font-family: inherit;
            font-size: 0.92rem;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .memo-textarea:focus {
            border-color: var(--accent-violet);
            box-shadow: 0 0 8px rgba(139, 92, 246, 0.2);
        }

        .memo-btn-group {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
        }

        .memo-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.3rem 0.7rem;
            border-radius: 4px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .memo-btn:hover {
            color: #ffffff;
            border-color: var(--text-muted);
        }

        .memo-btn.save {
            background: var(--accent-gradient);
            border: none;
            color: #ffffff;
        }

        .memo-btn.save:hover {
            box-shadow: 0 2px 8px rgba(139, 92, 246, 0.3);
        }

        .memo-btn.delete {
            color: #f87171;
            border-color: rgba(248, 113, 113, 0.2);
        }

        .memo-btn.delete:hover {
            background: rgba(248, 113, 113, 0.05);
            border-color: #f87171;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>시스템구조 기출 정밀 분석 대시보드</h1>
        <p class="subtitle">12개년 기출 전수 조사 기반 3회 이상 빈출 세부 토픽 분석 엔진</p>
        <div class="meta-badges">
            <span class="badge">기출 범위: 2015년 ~ 2026년</span>
            <span class="badge accent">총 분석 데이터: 300 문항</span>
            <span class="badge">검출된 빈출 세부 토픽: <span id="topic-count-badge">0</span>개</span>
            <span id="storage-badge" class="badge" style="cursor: help;">저장소 로딩 중...</span>
        </div>
    </header>

    <div id="migration-banner" style="display: none; background: rgba(139, 92, 246, 0.12); border: 1px solid rgba(139, 92, 246, 0.3); padding: 1.2rem; border-radius: 10px; margin-bottom: 2rem; text-align: center; backdrop-filter: blur(10px); box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
        <div style="font-size: 0.95rem; font-weight: 600; color: #ffffff; margin-bottom: 0.5rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
            <span>💡 이전 브라우저(LocalStorage)에 작성된 공부 코멘트 <span id="migration-count" style="color: #c084fc; font-weight: 700;">0</span>개가 발견되었습니다.</span>
        </div>
        <div style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.8rem;">
            이 코멘트들을 서버 파일 저장소(`data/sa_memos.json`)로 안전하게 가져와서 영구 보존할 수 있습니다.
        </div>
        <button onclick="migrateMemos()" style="background: var(--accent-gradient); border: none; color: #ffffff; padding: 0.4rem 1.2rem; border-radius: 6px; font-size: 0.82rem; font-weight: 700; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 8px rgba(139, 92, 246, 0.3);">
            파일 서버로 코멘트 동기화하기
        </button>
    </div>

    <div class="filter-section">
        <button class="filter-btn active" onclick="filterCategory('전체')">전체</button>
        <button class="filter-btn" onclick="filterCategory('공통기술')">공통기술</button>
        <button class="filter-btn" onclick="filterCategory('아키텍처 설계 및 구축')">아키텍처 설계 및 구축</button>
        <button class="filter-btn" onclick="filterCategory('데이터 통신 및 네트워크 설계')">데이터 통신 및 네트워크 설계</button>
        <button class="filter-btn" onclick="filterCategory('기타 신기술')">기타 신기술</button>
    </div>

    <div class="accordion-list" id="accordion-container">
        <!-- Javascript will inject accordion elements here -->
    </div>
</div>

<script>
    const examDatabase = {
  "2015_76": "76. 다음 그림은 인터넷에서 수집한 IP 패킷의 헤더\n(header)를 16진수로 나타낸 것으로 검사합(checksum)\n부분을 제거하고 ‘checksum’으로 나타냈다. 검\n사합의 값으로 맞는 것은? (비트의 나열 순서는\n좌에서 우, 위에서 아랫방향이다.)\n4 5 0 0 0 0 2 8\n3 e c 9 0 0 0 0\n2 5 0 6 checksum\na d c 2 4 8 5 e\n0 a 5 a 1 5 b 9\n① 25c2\n② 40d4\n③ 25c9\n④ 40d5",
  "2015_77": "77. SCTP(Stream Control Transport Protocol)에 관한\n설명으로 가장 거리가 먼 것은?\n① SCTP 연결(Association)은 다중 스트림을 지원한다.\n② SCTP 연결(Association)은 각 단말의 다중 IP\n주소들을 허용한다.\n③ SCTP에서 개별 스트림을 구분하기 위해 SSN(Stream\nSequence Number)을 이용한다.\n④ SCTP에서 제어 정보와 데이터 정보는 각각 다른\n청크(chunk)에 실려 전달된다.",
  "2015_78": "78. 다음 중 ( ㉮ )에 들어갈 용어로 가장 적절한 것은?\nIPv6는 호스트가 직접 IP주소를 설정할 수 있는\n자동설정(autoconfiguration)기능을 가지고 있다.\n이를 위해 호스트는 먼저 링크 로컬 주소를\n생성하고 생성된 링크 로컬 주소가 서브넷 내에서\n유일함을 확인하기 위해 ( ㉮ )를 전송한다.\n① neighbor solicitation message(이웃간청메시지)\n② neighbor advertisement message(이웃광고메시지)\n③ router solicitation message(라우터간청메시지)\n④ router advertisement message(라우터광고메시지)\n- 19",
  "2015_79": "79. 다음 중 ICMPv6에서 사용하고 있는 오류 메시지\n(error message)로 가장 거리가 먼 것은?\n① 목적지 도달 불가(destination unreachable)\n② 너무 큰 패킷(packet too big)\n③ 발신지 억제(source-quench)\n④ 매개변수 문제(parameter problem)",
  "2015_80": "80. LTE(Long Term Evolution)보다 향상된 성능을 제공\n하기 위해 LTE-A(LTE-Advanced)가 채택하고 있는\n기술과 가장 거리가 먼 것은?\n① carrier aggregation\n② 8x8 MIMO(Multi-Input Multi-Output)\n③ CoMP(Coordinated Multipoint)\n④ HR-DSSS(High Rate Direct Sequence Spread\nSpectrum)",
  "2015_81": "81. 클라우드 전달 모델은 크게 IaaS(Infrastructure\n-as-a-Service), PaaS(Platform-as-a-Service),\nSaaS(Software-as-a-Service)로 구분할 수 있다.\n다음 중 IaaS에 대한 설명으로 가장 거리가 먼\n것은?\n① 클라우드 서비스 기반 인터페이스와 툴을 이용\n하여 접근하고 관리하는, 인프라 중심의 IT 자원\n으로 구성된 필요 시설을 서비스 해주는 IT\n환경을 말한다.\n② 전통적인 호스팅이나 아웃소싱 환경과 달리 IT\n자원을 가상화하고 패키지화하여, 번들로 제공\n해서 런타임 선행 확장과 인프라를 원하는 대로\n만드는 것을 간단하게 할 수 있다.\n③ IaaS 환경을 바탕으로 이용 가능한 IT 자원은\n대부분 초기화된 가상 인스턴스 형태로 제공되며,\n전형적인 IaaS 환경의 중심에 있는 IT 자원은\n바로 가상 서버이다.\n④ 클라우드 공급자에게 클라우드를 설정하고 활용\n하는 높은 수준의 책임과 제어를 제공하는 것으로,\nIaaS가 제공하는 IT 자원에 대한 직접 관리의\n책임은 클라우드 공급자에게 있다.\n9 -\n\n=== NEW PAGE ===",
  "2015_82": "82. SONET(Synchronous Optical Network)에 대한 설명\n으로 가장 거리가 먼 것은?\n① STS-1의 데이터 전송률은 103.68Mbps이다.\n② STS 다중화기(MUX)는 여러 개의 전기적인 신호를\n광신호로 다중화 한다.\n③ STS-3의 전송률은 STS-1의 3배이다.\n④ SONET 계층은 Photonic Layer, Section Layer,\nLine Layer, Path Layer로 이루어져있다.",
  "2015_83": "83. 다음은 네트워크 인프라에 소프트웨어의 장점을\n적용하는 기술에 대한 설명이다. ( ㉮ )와 ( ㉯ )에\n들어갈 용어로 가장 적절한 것은?\n( ㉮ )는(은) 네트워크의 제어부와 전달부를\n분리하고 제어부의 소프트웨어와 전달부 하드\n웨어 사이에 개방형 인터페이스를 정의하여,\n운영자는 제어부를 프로그래밍하여 원하는\n방식으로 제어하는 기술이며, ( ㉯ )는(은)\n방화벽(Firewall), 네트워크 주소 변환(NAT),\n부하분산기(load balancer) 등의 전용 하드\n웨어 장비를 소프트웨어화하여 범용 하드웨어\n장비에 설치하는 기술이다.\n※ SDN(Software-Defined Networking)\nNFV(Network Function Virtualization)\nCDN(Content Delivery Network)\n㉮ ㉯\n① SDN NFV\n② OpenFlow SDN\n③ CDN NFV\n④ OpenFlow CDN",
  "2015_84": "84. 블루투스의 L2CAP(Logical Link Control and Adaption\nProtocol)의 기능으로 가장 거리가 먼 것은?\n① 다중화 ② 분할 및 재조립\n③ 변조 ④ 서비스 품질\n- 20",
  "2015_85": "85. 기가비트 이더넷(gigabit ethernet)의 반이중 모드\n(half-duplex)에서 전통적인 이더넷과 같이 512\n비트의 최소 프레임 길이를 사용하면 네트워크의\n최대 길이가 제한된다. 이를 해결하기 위한 방법\n으로 적절한 것은? (2개 선택)\n① carrier extension\n② frame bursting\n③ 4D-PAM\n④ CSMA/CD",
  "2015_86": "86. “서비스 수준 협약(service level agreement, SLA)에\n관한 표준(SLA를 강화한 정보시스템 운영계약 참조\n모델, TTAS.KO-10.0254)”을 제정하였다. 이\n표준에 따른 서비스 수준 협약에 대한 설명으로\n가장 거리가 먼 것은?\n① 서비스 제공자와 서비스 사용자가 제공될 서비스\n및 그와 연관된 여러 조건들에 대한 서로의\n책임과 의무사항을 기술해 놓은 협약서이다\n② 계약서에는 계약 사항에 대한 설명과, 계약\n대상자와 계약 대상자의 서명, 계약의 시작과\n종료 일시, 합의 범위, 계약 대상자의 역할과\n책임, 계약 내용 등이 명시되어야 한다.\n③ 서비스의 범위 및 항목의 정의는 운영자 중심으로\n서버, 네트워크, 어플리케이션으로 정리하여\n관리한다.\n④ 서비스 수준과 측정항목, 측정기준, 측정치들이\n정의되면 각 항목들을 평가할 수 있는 방안이\n마련되어야 한다.",
  "2015_87": "87. 정보통신기술협회(TTA)는 2013년 12월 “사물\n인터넷(internet of things, IoT)에 관한 표준\n(사물인터넷 정의 및 참조모델, TTAK.KO-06.0346)”을\n제정하였다. 이 표준에 따른 사물인터넷 참조\n모델의 계층(layer)들과 가장 거리가 먼 것은?\n① 응용계층\n② 서비스 지원 및 응용 지원 계층\n③ 전송계층\n④ 네트워크계층\n0 -\n\n=== NEW PAGE ===",
  "2015_88": "88. 라우팅의 경우 동일한 AS(Autonomous System) 내부\n에서 사용되는 intra-AS 라우팅 알고리즘 기반의\n프로토콜과 AS와 AS간에 사용되는 inter-AS 라우팅\n알고리즘 기반의 프로토콜이 있는데 다음 중 inter\n-AS 라우팅 알고리즘 기반의 프로토콜로 가장 적\n절한 것은?\n① RIP(Routing Information Protocol)\n② IGRP(Interior Gateway Routing Protocol)\n③ OSPF(Open Shortest Pass First)\n④ BGP(Border Gateway Protocol)",
  "2015_89": "89. “모바일 전자정부 서비스 사용자 인터페이스 설계\n가이드라인(2014)”에 나오는 모바일 서비스 UX\n디자인 기본원칙에서 ‘앱(App)개발 시 예외 항목’에\n해당하지 않는 것은? (2개 선택)\n① 정보소외계층의 접근성을 고려한다.\n② 웹표준을 준수하여 개발한다.\n③ 서비스의 호환성과 확장성을 고려한다.\n④ 일관성을 유지한다.",
  "2015_90": "90. 실시간시스템에서 우선순위 역전에 대한 설명으로\n가장 거리가 먼 것은?\n① 우선순위 역전은 우선순위를 기반으로 하는 선점\n모드로 동작하는 스케줄링 방식에서 발생한다.\n② 우선순위 역전에 대한 해결 방안으로는 우선순위\n상속(priority inheritance) 방식과 우선순위\n올림(priority ceiling) 방식이 있다.\n③ 우선순위 상속 프로토콜은 자원을 대기하는\n태스크의 우선순위를 해당 자원을 점유한 태스크의\n우선순위로 상속하는 기법이다.\n④ 우선순위 올림 기법은 자원에도 우선순위를\n동적으로 할당하여 자원의 우선순위를 자원을\n이용하는 태스크가 할당받는 기법이다.\n- 21",
  "2015_91": "91. HDFS(Hadoop Distributed File System) 설계 측면\n에서 HDFS의 응용 분야로 가장 적절한 것은?\n① 데이터 액세스를 스트리밍 방식으로 요구하는\n응용 분야\n② 빠른 응답시간의 데이터 액세스를 요구하는 응용\n분야\n③ 많은 수의 작은 파일을 지원해야 하는 응용 분야\n④ 다중 쓰기 작업과 임의의 위치에 파일의 수정이\n이루어지는 응용 분야",
  "2015_92": "92. 24시간 온라인 정보서비스를 제공하는 기업의\n시스템관리자는 연간시스템의 가용목표를 99.9%로\n정했다. 이러한 목표를 달성하려면 1년간 허용할\n수 있는 최대 서비스 중지기간(손상된 애플리\n케이션과 데이터베이스를 수리해 시스템을 유지\n하고 재가동하는데 사용되는 시간)은 얼마인가?\n(단, 1년은 365일=8,760시간으로 본다)\n① 4.38시간 ② 43.8시간\n③ 8.76시간 ④ 87.6시간",
  "2015_93": "93. 데이터센터 에너지 효율 측정 지표 중 대표적인\n지표로 사용되고 있는 전력사용효율지수 (PUE, Power\nUsage Effectiveness)에 대한 설명이다. 가장\n거리가 먼 것은?\n① IT 장비가 사용한 전력 대비 데이터센터 시설의\n전체 사용 전력 비율로 정의된다.\n② 숫자가 낮을수록 데이터센터의 본질적 기능이\n강화되고 전력 사용이 효율적이 된다는 것을\n의미한다.\n③ 건축, 전기, 공조, 공조, 방재, 보안, 운영 등\n기반 설비의 에너지 효율을 IT 장비 전력 사용에\n대비하여 평가하는 지표로 사용될 수 있다.\n④ IT 장비가 사용하는 에너지값을 이용하여 데이터\n센터의 에너지 효율을 산출하므로 IT 장비 자체의\n효율을 측정할 수 있다는 장점을 갖는다.\n1 -\n\n=== NEW PAGE ===",
  "2015_94": "94. 다음은 SPEC(Standard Performance Evaluation\nCorporation)의 성능 벤치마크(benchmark)에 대한\n특징을 설명한 것이다. 가장 적절한 것은?\n가. 스토리지 솔루션을 제공 할 수 있는 최대\n지속 가능한 처리량을 측정하는 데 사용\n되는 벤치마크로서 프로토콜에 독립적임.\n나. 벤치마크는 응용 계층에 파일을 제공하는\n저장 솔루션의 성능을 측정하고 워크스\n테이션 그룹상에서 동작함.\n① SPECjms2007\n② SPECjEnterprise2010\n③ SPEC OMP2012\n④ SPEC SFS2014",
  "2015_95": "95. 시스템의 성능은 일반적으로 초당 처리할 수 있는\n트랜잭션(TPS : Transaction Per Second)으로 정\n의하며, 용량산정을 위해서 피크(peak)타임의 동\n시사용자(concurrent user)와 목표 평균 응답시간\n(average response time)을 사용한다. 만약 현재\n시스템의 동시 사용자가 400명이고, 목표 평균\n응답시간이 3초이며, 평균 대기시간(average think\ntime)이 12초라면 이때의 목표 성능은?(계산\n결과는 소수점 이하 2자리에서 반올림)\n① 15.6tps ② 18.2tps\n③ 22.4tps ④ 26.7tps\n- 22",
  "2015_96": "96. 트랜잭션은 원자성(atomicity), 일관성(consistency),\n고립성(isolation), 영속성(durability) 등 네 가지\n주요한 특성을 갖는다. 다음 중 ( ㉮ )에 들어갈\n용어로 가장 적절한 것은?\nA계정에서 B계정으로 백만원을 이체하는 트랜\n잭션을 실행한다고 가정해보자. 이 트랜잭션\n프로그램은 A계정에서 백만원을 출금하여 B\n계정으로 백만원을 입금시킨다. 이를 트랜잭션\n으로 실행할 때, 그 트랜잭션은 ( ㉮ )이\n있어야 한다. 즉, 모두 실행하거나 어느 쪽도\n실행하지 말아야 한다. 둘 중 하나만 갱신\n되어서는 안 된다.\n① 원자성 ② 일관성\n③ 고립성 ④ 영속성",
  "2015_97": "97. 독립적인 TP(Transaction Processing) 애플리\n케이션의 통합은 일반적으로 통신 프로토콜, 애플리\n케이션 기능, 메시지 포맷이 이질적이기 때문에\n어렵다. 이들의 조정을 위한 아키텍처로 브로커\n기반 아키텍처(broker-based architecture)와 버스\n기반 아키텍처(bus-based architecture) 두 가지를\n들 수 있다. 이들에 대한 설명 중 가장 거리가\n먼 것은?\n① 브로커기반 아키텍처에서 메시지서버는 이질적인\n애플리케이션 사이의 교량역할을 수행한다.\n② 브로커기반 아키텍처에서는 클라이언트와 애플리\n케이션이 직접 통신하지 않고 브로커와 통신한다.\n③ 버스기반 아키텍처에서 TP시스템은 파라메타와\n메시지를 위한 포맷간의 변환을 해야만 한다.\n④ 버스기반 아키텍처에서 클라이언트 애플리케이션\n으로 묶여질 수 있는 변환기능은 공유라이브러리를\n이용하여 수행된다.\n2 -\n\n=== NEW PAGE ===",

  "2015_99": "99.9%로\n정했다. 이러한 목표를 달성하려면 1년간 허용할\n수 있는 최대 서비스 중지기간(손상된 애플리\n케이션과 데이터베이스를 수리해 시스템을 유지\n하고 재가동하는데 사용되는 시간)은 얼마인가?\n(단, 1년은 365일=8,760시간으로 본다)\n① 4.38시간 ② 43.8시간\n③ 8.76시간 ④ 87.6시간\n93. 데이터센터 에너지 효율 측정 지표 중 대표적인\n지표로 사용되고 있는 전력사용효율지수 (PUE, Power\nUsage Effectiveness)에 대한 설명이다. 가장\n거리가 먼 것은?\n① IT 장비가 사용한 전력 대비 데이터센터 시설의\n전체 사용 전력 비율로 정의된다.\n② 숫자가 낮을수록 데이터센터의 본질적 기능이\n강화되고 전력 사용이 효율적이 된다는 것을\n의미한다.\n③ 건축, 전기, 공조, 공조, 방재, 보안, 운영 등\n기반 설비의 에너지 효율을 IT 장비 전력 사용에\n대비하여 평가하는 지표로 사용될 수 있다.\n④ IT 장비가 사용하는 에너지값을 이용하여 데이터\n센터의 에너지 효율을 산출하므로 IT 장비 자체의\n효율을 측정할 수 있다는 장점을 갖는다.\n1 -\n\n=== NEW PAGE ===\n\n94. 다음은 SPEC(Standard Performance Evaluation\nCorporation)의 성능 벤치마크(benchmark)에 대한\n특징을 설명한 것이다. 가장 적절한 것은?\n가. 스토리지 솔루션을 제공 할 수 있는 최대\n지속 가능한 처리량을 측정하는 데 사용\n되는 벤치마크로서 프로토콜에 독립적임.\n나. 벤치마크는 응용 계층에 파일을 제공하는\n저장 솔루션의 성능을 측정하고 워크스\n테이션 그룹상에서 동작함.\n① SPECjms2007\n② SPECjEnterprise2010\n③ SPEC OMP2012\n④ SPEC SFS2014\n95. 시스템의 성능은 일반적으로 초당 처리할 수 있는\n트랜잭션(TPS : Transaction Per Second)으로 정\n의하며, 용량산정을 위해서 피크(peak)타임의 동\n시사용자(concurrent user)와 목표 평균 응답시간\n(average response time)을 사용한다. 만약 현재\n시스템의 동시 사용자가 400명이고, 목표 평균\n응답시간이 3초이며, 평균 대기시간(average think\ntime)이 12초라면 이때의 목표 성능은?(계산\n결과는 소수점 이하 2자리에서 반올림)\n① 15.6tps ② 18.2tps\n③ 22.4tps ④ 26.7tps\n- 22\n96. 트랜잭션은 원자성(atomicity), 일관성(consistency),\n고립성(isolation), 영속성(durability) 등 네 가지\n주요한 특성을 갖는다. 다음 중 ( ㉮ )에 들어갈\n용어로 가장 적절한 것은?\nA계정에서 B계정으로 백만원을 이체하는 트랜\n잭션을 실행한다고 가정해보자. 이 트랜잭션\n프로그램은 A계정에서 백만원을 출금하여 B\n계정으로 백만원을 입금시킨다. 이를 트랜잭션\n으로 실행할 때, 그 트랜잭션은 ( ㉮ )이\n있어야 한다. 즉, 모두 실행하거나 어느 쪽도\n실행하지 말아야 한다. 둘 중 하나만 갱신\n되어서는 안 된다.\n① 원자성 ② 일관성\n③ 고립성 ④ 영속성\n97. 독립적인 TP(Transaction Processing) 애플리\n케이션의 통합은 일반적으로 통신 프로토콜, 애플리\n케이션 기능, 메시지 포맷이 이질적이기 때문에\n어렵다. 이들의 조정을 위한 아키텍처로 브로커\n기반 아키텍처(broker-based architecture)와 버스\n기반 아키텍처(bus-based architecture) 두 가지를\n들 수 있다. 이들에 대한 설명 중 가장 거리가\n먼 것은?\n① 브로커기반 아키텍처에서 메시지서버는 이질적인\n애플리케이션 사이의 교량역할을 수행한다.\n② 브로커기반 아키텍처에서는 클라이언트와 애플리\n케이션이 직접 통신하지 않고 브로커와 통신한다.\n③ 버스기반 아키텍처에서 TP시스템은 파라메타와\n메시지를 위한 포맷간의 변환을 해야만 한다.\n④ 버스기반 아키텍처에서 클라이언트 애플리케이션\n으로 묶여질 수 있는 변환기능은 공유라이브러리를\n이용하여 수행된다.\n2 -\n\n=== NEW PAGE ===\n\n98. 서버의 가용성을 극대화하기 위한 주백업 모델\n(primary-backup model)에 대한 설명이다. ㉮ 와\n㉯ 에 들어갈 용어로 가장 적절한 것은?\n백업서버의 준비정도는 ( ㉮ ) 결정에 가장\n주요한 요소로 ( ㉮ )을 감소시켜야 서버의\n가용성을 향상시킬 수 있다. 주서버에 장애가\n있을 시 사실상의 지연시간 없이 항상 이어받을\n준비를 갖추도록 하기 위하여 백업서버를 최신\n상태로 유지하는 경우에 이것을 ( ㉯ )이라 한다.\n㉮ ㉯\n① 평균가동시간(MTBF) 핫 백업(hot-backup)\n② 평균고장시간(MTTR) 핫 백업(hot-backup)\n③ 평균가동시간(MTBF) 웜 백업(warm-backup)\n④ 평균고장시간(MTTR) 웜 백업(warm-backup)\n99. 개방형 플랫폼 서비스(open platform service)하\n에서의 멀티테넌트(multi-tenant) 실행 환경을\n위한 소프트웨어 공유 구조를 설명한 것으로 가장\n거리가 먼 것은?\n① 공유 OS-분리 VM 구조(shared OS–separate VM\narchitecture)에서 테넌트들은 가상 머신(VM)\n수준에서 분리되어 소프트웨어 서비스가 제공된다.\n② 공유 응용코드-분리 응용 인스턴스 구조(shared\napplication code–separate application instance\narchitecture)에서는 테넌트들 간에 공용 프로\n그램 코드까지 공유되며, 응용 인스턴스만 분리\n되는 형태로 소프트웨어 서비스가 제공된다.\n③ 공유 VM-분리 응용 코드 구조(shared VM–separate\napplication code architecture)는 VM에서 제공\n하는 기능에 의해 보안이 이루어지므로, 대부분\n가상머신의 사용자 수준에서 보안이 이루어진다.\n④ 공유 응용 인스턴스 구조(shared application\ninstance architecture)는 보안이 취약할 가능성이\n가장 낮으며, 테넌트마다 인스턴스를 만들지\n않으므로 비용 소모가 가장 적다.\n- 23",
  "2015_100": "100. 그림과 같이 모바일 호스트(mobile host)가 홈\n네트워크(home network)에서 외부 네트워크(for-\neign network)로 이동한 상황에서 모바일 IP에\n대한 설명으로 가장 거리가 먼 것은?\n① 이동한 모바일 호스트는 홈 주소(home address)와\n의탁주소(care-of address)라는 두 개의 주소를\n가진다.\n② 이동한 모바일 호스트는 외부 에이전트(Foreign\nagent)에게 의탁주소(care-of address)를 받기\n위해 ICMP의 router solicitation 메시지를\n이용한다.\n③ 이동한 모바일 호스트가 외부 에이전트(foreign\nagent)에 등록하기 위해서 TCP 포트를 이용하여\n등록 요청(registration request)을 보낸다.\n④ 이동한 모바일 호스트가 원격지 호스트(remote\nhost)와 패킷을 주고받을 때 더블 크로싱(double\ncrossing)이 발생할 수 있다.\n3 -\n\n=== NEW PAGE ===\n\n보 안",
  "2018_76": "76. 다음에 설명하는 RAID(Redundant Array of Inexpen-\nsive Disk) 기술로 가장 적절한 것은?\n데이터가 블록단위로 분산 저장된 여러 개의 데\n이터 디스크들과 하나의 패리티 디스크로 구성된\nRAID로 블록 인터리브된 패리티(block-interleav\ned striping with parity) 방식이라고도 한다.\n① RAID 1 ② RAID 4 ③ RAID 5 ④ RAID 6",
  "2018_77": "77. 비동기식 버스(asynchronous bus)에 대한 설명으로\n가장 거리가 먼 것은?\n① 공통 클럭을 사용하지 않고 상대방 이벤트를\n위한 시그널을 전파한다.\n② 핸드쉐이킹(handshaking) 신호를 송수신하는\n제어선이 추가적으로 필요하다.\n③ 비동기식 버스의 제어 신호는 고정길이를\n사용한다.\n④ 비동기식 프로토콜은 시그널 에지로 표시된\n이벤트가 버스를 통해 전파되기 때문에 버스\n지연시간이 길다.",
  "2018_78": "78. 트랜잭션 성능을 예측하는 TPC(Transaction Pro-\ncessing Performance Council)의 벤치마크(Ben-\nchmark)인 TPC-E에 대한 설명으로 가장 거리가\n먼 것은?\n① TPC-E는 도매 공급자를 위한 애플리케이션을\n모델로 한다.\n② TPC-C와 다르게 트랜잭션 미들웨어를 포함하지\n않으며, 데이터베이스 성능 만을 측정한다.\n③ TPC-C에 비해 현재의 TP(Transaction Processing)\n애플리케이션을 대표하는 더 크고 복잡한\n데이터베이스와 트랜잭션 작업부하를 나타낸다.\n④ TPC-E는 TPC-C에 비해 트랜잭션이 더 적은 I/O를\n발생시킨다.\n- 16",
  "2018_79": "79. 어떤 공공기관의 민원서비스시스템이 다음과\n같이 3계층(3-tier)으로 구성되어 있다고 하자.\n애플리케이션 서버는 웹서버의 비즈니스 기능을\n백엔드(back-end)의 메인프레임으로 전송하는\n트랜잭션으로 변환한다. 만약 이 민원서비스\n시스템에 10,000명의 사용자가 동시에 로그인\n했을 때, 시간당 180만개의 비즈니스 기능을\n처리한다면 각 사용자당 평균 응답시간은?\n① 10초 ② 15초 ③ 20초 ④ 25초",
  "2018_80": "80. 빅데이터 처리(bigdata processing)는 빅데이터\n에서 유용한 정보와 의미있는 지식을 찾아내기\n위한 데이터 가공이나 분석을 지원하는 과정이다.\n이러한 빅데이터 처리과정에 대한 설명으로\n가장 거리가 먼 것은?\n① 빅데이터 처리는 기존의 데이터 처리(OLAP, EDW)\n와 다르게 의사결정의 즉시성이 덜 요구된다.\n② 대용량의 데이터에 기반을 둔 분석 위주로 장\n기적이고 전략적인데, 때때로 일회성 처리나\n행동 분석을 지원하여야 한다.\n③ 빅데이터는 처리해야 할 데이터량이 방대하고\n대용량 및 복잡한 처리를 특징으로 하고 있어\n실시간 처리가 보장되어야 하는 자료 처리에\n적합하다.\n④ 단순한 프로세싱 모델이 아닌 다양한 소스, 복\n잡한 로직 처리 등으로 인하여 처리 복잡도가\n매우 높고 통상적으로 분산처리 기술을 요구한다.\n6 -\n\n=== NEW PAGE ===",
  "2018_81": "81. 다음에 설명하는 와이파이(Wi-Fi) 규격으로\n가장 적절한 것은?\n무선 기가비트 연합(wireless gigabit alliance)\n에서 만들어낸 고속무선네트워크 규격으로 기존의\n와이파이에서 사용하는 2.4GHz나 5GHz와 같은 비\n면허 대역(unlicensed band)과 60GHz 대역에서 최대\n7Gbps의 속도로 와이파이 통신이 가능하다. 즉,\n2.4GHz, 5GHz, 60GHz 대역을 모두 이용할 수 있어\n수용성이 뛰어난 기술이라 할 수 있다.\n① 802.11a ② 802.11ad ③ 802.11b ④ 802.11n",
  "2018_82": "82. 프라이빗 클라우드(private cloud)와 퍼블릭\n클라우드(public cloud)의 장점과 단점을 비교\n한 설명으로 가장 거리가 먼 것은?\n① 프라이빗 클라우드는 특정기관 만을 대상으로\n사용자 층이 한정되어 있는 반면, 퍼블릭 클\n라우드는 불특정 다수가 사용자이다.\n② 프라이빗 클라우드는 퍼블릭 클라우드에 비해\n데이터 보호와 개인정보 보호가 향상된다는\n장점이 있다.\n③ 퍼블릭 클라우드는 불특정 다수를 대상으로\n서비스를 제공하므로 자원 사용량에 대한 예\n측이 불가능하다는 단점이 있다.\n④ 퍼블릭 클라우드는 프라이빗 클라우드에 비해\n클라우드 서비스 접근성에 대해 한계가 있으며,\n낮은 수준의 보안이 필요하다.",
  "2018_83": "83. 어떤 기관의 호스트에서 사용하는 IPv4 주소가\n클래스 없는(classless) 주소지정 방식으로 168.\n199.160.82/27 이다. 이 네트워크에 속하는\n마지막 IP 주소는?\n① 168.199.160.63 ② 168.199.160.95\n③ 168.199.160.127 ④ 168.199.160.255\n- 17",
  "2018_84": "84. TCP 혼잡 제어에 대한 설명으로 가장 거리가 먼 것은?\n① 기본 원칙은 느린 시작, 혼잡 회피, 혼잡 감\n지의 세 단계에 기반한다.\n② 혼잡이 발생하면 혼잡 회피를 위해 혼잡 윈도\n우의 크기를 선형적으로 증가시킨다.\n③ 느린 시작 단계에서 혼잡 윈도우의 크기는 임\n계치에 도달할 때까지 지속적으로 증가한다.\n④ 송신측에서의 실제 윈도우 크기는 수신측이\n알려주는 윈도우 크기와 혼잡 윈도우 크기 중\n에서 작은 값으로 결정한다.",
  "2018_85": "85. 다음에 설명하는 가상화 기술로 가장 적절한\n것은?\n- 전통적인 하이퍼바이저와 달리 운영체제 수준\n에서 가상화를 제공하며, 특정 응용을 위한 독\n립된 공간을 제공한다.\n- GuestOS를 설치하지 않으며 필요한 라이브러리와\n응용만 설치하면 되기 때문에 패키징과 마이그\n레이션 적용이 쉽다.\n- 대표적인 사례로 도커(docker)가 있다.\n① 전 가상화 ② 서버 가상화\n③ 프로세스 가상화 ④ 컨테이너 기반 가상화",
  "2018_86": "86. Go-Back-N 프로토콜에서 송신 윈도우의 크기가\n2m-1일 때, 수신 윈도우의 크기로 가장 적절한\n것은?(여기서, m은 순서번호 필드의 비트 수를\n나타낸다.)\n① 1 ② 2m-1 ③ 2m ④ 정답 없음",
  "2018_87": "87. 특정 언어로 작성된 응용 프로그램이 컴퓨터에서\n10초에 실행되었다. 새로운 컴파일러가 발표되\n었는데 이전의 컴파일러에 비하여 명령어 개수의\n비율은 0.5, CPI(Clock cycles Per Instruction)의\n비율은 1.1이 되었다. 새로운 컴파일러를 사용\n하는 경우에 응용 프로그램의 실행 시간은?\n \n① ≃초 ② ×초\n ×  \n\n③\n \n×≃초 ④ ××초\n7 -\n\n=== NEW PAGE ===",
  "2018_88": "88. 딥러닝에서 사용되는 ReLU(Rectified Linear Unit)\n함수로 가장 적합한 것은? (는 입력값, 는\n출력값이다.)\n\n①   ②    \n\n③  max ④    ",
  "2018_89": "89. 2GHz 클럭의 컴퓨터 A에서 실행시간이 10초인\n프로그램이 있다. 이 프로그램을 8초에 실행시\n킬 수 있는 컴퓨터 B를 설계하고자 한다. 클럭\n속도를 빠르게 하면 CPU의 다른 부분 설계에\n영향을 미치게 되어, 이 프로그램을 수행하기\n위하여 컴퓨터 A보다 1.2배 많은 클럭 사이클을\n필요로 하게 된다. 컴퓨터 B의 클럭 속도는?\n① 2.4GHz ② 3GHz ③ 3.5GHz ④ 4GHz",
  "2018_90": "90. P2P(Peer-to-Peer) 네트워크 기반의 블록체인\n네트워크에서 사용되는 기술에 대한 설명으로\n가장 거리가 먼 것은?\n① PoW(Proof of Work)는 byzantine fault를 대응\n하지 않는 방식이다.\n② PoS(Proof of Stake)는 화폐량을 더 많이 소유하는\n승인자가 우선적으로 블록을 생성하는 방식이다.\n③ PBFT(Practical Byzantine Fault Tolerance)는\n다수결로 의사결정한 뒤 블록을 생성하는 방식이다.\n④ Paxos는 과반수의 동의를 얻은 경우에 동의\n내용이 나중에 변경되지 않도록 하는 방식이다.",
  "2018_91": "91. CRUD(Create, Read, Update, Delete)를 처리하는\nHTTP 메소드에 대한 설명 중 가장 거리가 먼\n것은?\n① 리소스의 생성에 해당하는 메소드는 POST와\nPUT이다.\n② POST로 리소스를 생성하는 경우에 클라이언트는\n리소스의 URI를 지정할 수 없다.\n③ PUT은 멱등(idempotence)이지만 안전(safe)하지\n않다.\n④ DELETE와 POST는 멱등이지도 안전하지도 않다.\n- 18",
  "2018_92": "92. 사물인터넷 서비스를 편리하게 구현할 수 있는\n통신 기술에 대한 설명으로 가장 거리가 먼 것은?\n① REST(Representation State Transfer)는 분산\n하이퍼미디어 시스템을 위한 규격으로 리소스의\nCRUD(Create, Read, Update, Delete) 처리를\n지원한다.\n② MQTT(Message Queuing Telemetry Transport)\n는 제한된 컴퓨팅 성능과 네트워크 환경에서\n메시지를 안정적으로 전달하는 프로토콜로\nPublish/Subscribe 형태를 취한다.\n③ XMPP(eXtensible Messaging and Presence Pro-\ntocol)는 XML을 기반으로 한 메시지 지향 미\n들웨어용 통신 프로토콜로 3개 이상의 통신\n노드 간에 실시간 메시지 교환이 가능하다.\n④ CoAP(Constrained Environment Application\nProtocol)은 제한된 컴퓨팅 성능을 갖는 디바\n이스를 위한 동기 통신 프로토콜로 보안을 위\n하여 TLS(Transport Layer Security)를 채\n택한다.",
  "2018_93": "93. 가상메모리 시스템에서 다중 프로그래밍의 정\n도가 높아질수록 CPU의 이용률은 증가된다. 그\n러나 어느 정도를 넘어서면 CPU의 이용률이 급\n격히 떨어지면서 디스크 장치의 이용률이 증가\n한다. 이러한 현상을 지칭하는 용어는?\n① swap out ② blocking\n③ fragmentation ④ thrashing",
  "2018_94": "94. 페이지 기반 가상 메모리 시스템의 성능을 높\n이기 위한 기법과 가장 거리가 먼 것은?\n① TLB(Translation Lookaside Buffer)를 페이지\n테이블의 캐쉬로 활용한다.\n② 주소 변환 정보를 담은 페이지 테이블은 가급적\n하드 디스크에 저장하여 빠른 접근 시간을 보\n장한다.\n③ 사용 빈도가 높은 페이지는 주 메모리(main\nmemory)에 유지한다.\n④ 주 메모리의 가용 페이지가 부족할 때는 향후\n사용 가능성이 낮은 페이지를 교체해야 한다.\n8 -\n\n=== NEW PAGE ===",
  "2018_95": "95. 낸드 플래시 메모리(NAND flash memory)는 집\n적도가 높고 충격에 강하며, 소음과 진동이\n적다는 등의 장점으로 인해 스마트폰, 디지털\n카메라, 태블릿 등 다양한 모바일 시스템의\n저장 매체로 사용되고 있다. 낸드 플래시 메모\n리의 특성에 대한 설명으로 가장 적절한 것은?\n① DRAM과 마찬가지로 전원이 인가되지 않으면\n데이터가 사라지는 휘발성(volatile) 저장 매체이다.\n② 하나의 셀(cell)로 여러 비트를 저장하는 것이\n가능하다.\n③ 읽기/쓰기 연산은 바이트 단위로 수행된다.\n④ 삭제 연산은 바이트 단위로 수행된다.",
  "2018_96": "96. 서버 부하 분산 기술에 대한 설명으로 가장 적\n절하지 않은 것은?\n① DNS 라운드 로빈 방식은 하나의 도메인 네임에\n복수의 서버 IP 주소를 할당하여 클라이언트\n요청을 각 서버에 순서대로 보내 주는 방식이다.\n② DNS 라운드 로빈 방식의 문제점 중 하나는 특정\nIP의 서버에 장애가 발생하더라도 이 사실을\n즉시 인지하기 어렵다는 점이다.\n③ DNS 라운드 로빈 방식의 장점은 특정 복제 서\n버에 부하가 과도하게 걸리면 해당 복제 서버\n로 가는 부하를 줄이기 쉽다는 점이다.\n④ 계층4 (L4) 부하 분산은 부하 분산기를 활용하여\nTCP 세션을 서버들로 분산하는 방식이다.",
  "2018_97": "97. 오픈 소스 라이선스에 대한 설명으로 가장\n적절한 것은?\n① 소스 코드 상단에 명기되어 있는 라이선스 관련\n문구를 수정하거나 삭제하는 것이 가능하다.\n② 서로 다른 라이선스로 배포된 오픈소스 소프\n트웨어들은 결합시킬 수 없다.\n③ LGPL(Lesser General Public License) 2.1 라\n이선스로 배포된 라이브러리를 다른 응용프로\n그램에 링크시킬 경우 해당 응용프로그램의\n소스 코드도 함께 공개해야 한다.\n④ GPL(General Public License) 2.0 라이선스로\n배포된 프로그램의 소스코드를 다른 프로그램\n코드에 삽입하거나 링크시켜 배포하는 경우\n개발된 프로그램의 소스 코드도 함께 공개해야 한다.\n- 19",
  "2018_98": "98. IPv6 데이터그램 형식은 기본 헤더와 사용자\n데이터 영역으로 구분되고 사용자 데이터 영역은\n다시 확장 헤더와 데이터 영역으로 구분된다.\n다음 중 IPv6의 확장 헤더 유형으로 가장 적합\n하지 않은 것은?\n① 홉간 옵션 헤더 ② 소스라우팅 헤더\n③ 목적지 옵션 헤더 ④ 우선순위 헤더",
  "2018_99": "99. 네트워크 장비의 라우팅 테이블에 포함되는 항\n목으로 가장 적합하지 않은 것은?\n① 목적지 IP 주소\n② 목적지로 가기위한 후속 라우터의 IP 주소\n③ 발신지 IP 주소\n④ IP 패킷을 내보낼 네트워크 인터페이스 정보",
  "2018_100": "100. 전송계층의 TCP의 동작을 순조롭게 하기 위하여\n사용하는 TCP 타이머에 대한 설명으로 가장\n적합하지 않은 것은?\n① 재전송 타이머(retransmission timer)는 정해진\n시간내에 세그먼트의 확인응답이 없는 경우의\n재전송을 위해 사용한다.\n② 영속 타이머(persistence timer)는 윈도우의\n크기 결정을 위하여 사용한다.\n③ 연결유지 타이머(keepalive timer)는 이미 설\n정된 연결을 동작 상태와 상관없이 계속 유지\n하기 위하여 사용한다.\n④ 시간대기 타이머(2 maximum segment lifetime timer)\n는 연결이 종료되는 동안 이미 전송된 패킷이\n폐기되는 것을 방지하기 위하여 사용한다.\n9 -\n\n=== NEW PAGE ===\n\n보 안",
  "2019_76": "76. 정보시스템 하드웨어 규모산정 지침(TTAK.KO-10.\n0292/R2, 2018.12.19.)에서 스토리지 성능은 서\n버 성능을 기준으로 산정한다. 만약 OLTP&Batch\n서버의 성능이 1,200,000tpmC로 주어졌다면, 이\n때의 스토리지 성능 IOPS(Input/Output Operation\nper Second) 값으로 가장 적절한 것은?\n① 6,000 IOPS ② 12,000 IOPS\n③ 24,000 IOPS ④ 48,000 IOPS",
  "2019_77": "77. 컨테이너(container)에 대한 설명으로 가장 적절\n한 것은?\n① 컨테이너는 하나의 서버 리소스에 여러 개의 서\n버 환경을 할당하고, 각각의 환경에 OS와 애플\n리케이션을 실행할 수 있게 한다.\n② 컨테이너는 멀티 OS 환경 위에 하나의 호스트\n환경을 구현하여 애플리케이션을 효율적으로 실\n행할 수 있게 한다.\n③ 컨테이너는 빠른 시작과 정지가 가능하나, 가상\n화 오버헤드로 인하여 가상 서버보다는 성능의\n저하가 발생한다.\n④ 다양한 종류의 OS를 지원하는 템플릿으로 컨테\n이너를 만들 수 있으므로, 하나의 호스트 OS에\n서 멀티 OS 환경을 구현할 수 있다.",
  "2019_78": "78. 기계 학습의 일종으로 데이터가 어떻게 구성되었는\n지를 알아내는 문제의 범주에 속하며 입력값에 대\n한 목표치가 주어지지 않는데, 통계의 밀도 추정\n(density estimation)과 깊은 연관이 있다. 예로\n서 클러스터링(clustering)을 들 수 있는 기계\n학습 방법론은 무엇인가?\n① 지도 학습(supervised learning)\n② 비지도 학습(unsupervised learning)\n③ 강화 학습(reinforcement learning)\n④ 메타 러닝(meta learning)\n- 17",
  "2019_79": "79. 하나의 CPU를 장착하고 있는 컴퓨터 시스템이 라\n운드 로빈(round-robin) CPU 스케줄링 정책을 사\n용하며, 라운드 로빈 정책의 타임 슬라이스 (time\nslice)를 3ms로 설정하였을 때, 프로세스들이 다\n음과 같이 생성된다면 시스템 부팅 후 15ms가 지\n났을 때 실행 중인 프로세스는? (단, 문맥 교환\n(context switching)을 수행하는 시간 오버헤드\n는 0으로 가정한다.)\n- 시스템 부팅 시에, 프로세스 P0가 최초로 생성\n되었다. P0의 CPU 실행 시간은 5ms이다.\n- 부팅 후 1ms가 지났을 때, 프로세스 P1이 생성\n되었다. P1의 CPU 실행 시간은 10ms이다.\n- 부팅 후 2ms가 지났을 때, 프로세스 P2가 생성\n되었다. P2의 CPU 실행 시간은 20ms이다.\n- 부팅 후 4ms가 지났을 때, 프로세스 P3가 생성\n되었다. P3의 CPU 실행 시간은 25ms이다.\n① P0 ② P1 ③ P2 ④ P3",
  "2019_80": "80. 사물인터넷(IoT)을 위한 초소형 운영체제(OS)인\nTinyOS에 대한 설명으로 가장 거리가 먼 것은?\n① 리눅스 기반의 오픈소스 플랫폼으로 다양한 기\n기에 탑재할 수 있어 크로스 카테고리 플랫폼\n(cross category platform)이라고 불린다.\n② 무선 센서 네트워크의 제한된 자원과 저전력 특성\n을 극복하면서 환경변화에 실시간으로 반응하며\n다양한 응용분야에 활용을 목표로 설계되었다.\n③ C 언어의 일종인 nesC언어를 이용해 컴포넌트 기\n반의 시스템과 프로그래밍 구조를 가진다.\n④ 기존 멀티스레드(multi-thread) 방식의 단점을\n개선해 적은 메모리로 멀티태스킹(multi-tasking)\n을 지원한다.",
  "2019_81": "81. 한 개의 CPU를 사용하여 1,000개의 인스트럭션\n(instruction)으로 구성된 프로그램이 실행되는\n데 걸리는 시간이 2sec라고 가정하자. 이 프로\n그램에서 한 개의 인스트럭션을 실행하는데 평균\n적으로 5개의 clock cycle이 사용된다면 이 CPU\n의 clock 속도는 얼마인가?\n① 1.0GHz ② 2.5GHz ③ 25GHz ④ 100GHz\n7 -\n\n=== NEW PAGE ===",
  "2019_82": "82. 프로세스 간 통신을 위하여 일반적으로 공유 메모리\n(shared memory)와 메시지 전달(message passing)\n두가지 방식이 사용된다. 메시지 전달 시스템에\n대한 설명으로 가장 거리가 먼 것은?\n① 공유 메모리보다 빠르다.\n② 프로세스간 충돌을 회피할 필요가 없으므로 적은\n양의 데이터 교환에 유용하다.\n③ 분산 시스템에서 공유메모리보다 구현하기 쉽다.\n④ 시스템 호출(system call)을 필요로 한다.",
  "2019_83": "83. 다음의 메모리 반도체 중 전원이 인가되지 않으면\n데이터가 유지되지 않는 휘발성(volatile) 특성을\n갖는 메모리는?\n① PRAM (Phase-change Random Access Memory)\n② ReRAM (Resistive Random Access Memory)\n③ SRAM (Static Random Access Memory)\n④ NAND flash memory",
  "2019_84": "84. 에너지 전력 분야 사물인터넷(e-IoT) (정보통신\n단체표준, TTAK.KO-10.1121-part1)은 e-IoT 장치\n식별자를 정의하고 있다. 전력회사의 장치 식별\n자 계층 구조(arc : architecture)에 대한 설명\n으로 가장 적절한 것은?\n① 5th arc : e-IoT device indication ID\n② 6th arc : standard ID\n③ 7th arc : energy service ID\n④ 8th arc : model ID",
  "2019_85": "85. 실제 메모리가 총 3개의 페이지로 구성된 페이지\n기반 가상 메모리 시스템에서 페이지가 다음과\n같은 순서로 참조될 때 페이지 적중률(hit ratio)\n이 가장 높은 페이지 교체 정책은?\n페이지 번호 참조 순서: 5, 3, 2, 8, 2, 5, 3, 2\n① FIFO (First In First Out)\n② LRU (Least Recently Used)\n③ MRU (Most Recently Used)\n④ 모두 동일함\n- 18",
  "2019_86": "86. 다음 중에 오버커미트(overcommit)에 대한 설\n명으로 가장 적합한 것은?\n① 실제 머신에 탑재되어 있는 CPU보다 큰 처리 능\n력을 가상 머신에 할당하는 것이다.\n② 실제 용량보다 큰 크기의 디스크 용량을 할당하\n는 것이다.\n③ 데이터를 캡슐화하고 태그를 추가하여 실제 네트워\n크 용량보다 많은 통신을 가능하게 하는 것이다.\n④ 실제로 처리 가능한 트랜잭션보다 많은 처리 능\n력을 부여하는 것이다.",
  "2019_87": "87. 캐시를 사용하는 시스템에서 캐시 실패(cache miss)\n가 발생하였을 경우, 요구되는 데이터를 캐시에 넣기\n위하여 캐시 블록 한 개가 교체되어야 한다. 아래의\n캐시 사상 방식 중 캐시 실패 시 교체될 수 있는 후\n보 캐시 블록이 가장 많은 것은?\n① 직접 사상 (direct mapping)\n② 완전 연관 사상 (fully associative mapping)\n③ 집합 연관 사상 (set associative mapping)\n④ 정답 없음",
  "2019_88": "88. 페이징을 사용하는 메모리 시스템에서 TLB\n(Translation Lookaside Buffer)에 대한 설명으\n로 거리가 가장 먼 것은?\n① 빠른 메모리 접근을 위해 사용된다.\n② TLB를 채택한 시스템에서는 PTBR (Page Table\nBase Register)을 구현할 필요가 없다.\n③ 각 엔트리에는 페이지 번호와 프레임 번호가 들\n어간다.\n④ associative memory로 구현된다.",
  "2019_89": "89. 하드웨어 기반의 가상화에 대한 설명으로 가장\n적절하지 않은 것은?\n① 호스트 운영체제를 우회하기 위해서 물리 호스트\n하드웨어에 가상화 소프트웨어를 내장하고 있다.\n② 가상화 소프트웨어를 하이퍼바이저(hypervisor)\n라고 칭하며, 단순한 사용자 인터페이스를 가진다.\n③ 가상 서버가 호스트 운영체제 중재하에 하드웨\n어와 통신하도록 함으로써 더욱 효율적이다.\n④ 하드웨어 기반 가상화의 주요 문제점 중 하나는\n하드웨어 장치와의 호환성이다.\n8 -\n\n=== NEW PAGE ===",
  "2019_90": "90. 가용성은 시스템이 하드웨어나 소프트웨어 장애,\n운영 오류, 정전 등과 같은 이유로 다운되지 않\n고 정상적으로 운영되고 있는 시간을 의미하며,\n시스템 능력을 평가하는 매우 중요한 요소이다.\n만약 어떤 시스템(24시간/일, 주7일 운영)이 연간\n2시간의 다운시간(down-time)을 갖는다면, 이때의\n가용성(%)은 얼마인가?(단, 소수점 이하 4번째\n자리에서 반올림, 1년은 365일로 본다.)\n① 99.962% ② 99.977%\n③ 99.987% ④ 99.998%",
  "2019_91": "91. 인터 네트워킹(inter-networking) 장비에 대한\n설명으로 거리가 먼 것은?\n① 리피터(repeater)는 계층2를 지원하며, 한쪽 단\n에서 들어온 비트신호를 증폭하여 다른 단으로\n단순 전송하는 역할을 수행한다.\n② 브리지(bridge)는 한쪽 단에 들어온 프레임 MAC 계층 헤\n더를 다른 단의 MAC 계층 헤더로 변형해 전송할 수 있다.\n③ 브리지(bridge)는 수신한 프레임의 목적지 주소와\n송신 호스트의 주소가 같은 LAN에 소속되어 있으\n면 아무 행동도 하지 않는다.\n④ 라우터(router)는 교환기능을 수행할 수 있으므\n로 여러 포트를 사용해 다수의 LAN을 연결하는\n구조를 지원한다.",
  "2019_92": "92. 신경망에서 활용되는 확률적 경사하강법(stochastic\ngradient descent)의 학습(learning)에 대한 설명\n중에 가장 거리가 먼 것은?\n① 학습은 훈련(training) 데이터 샘플과 그에 상\n응하는 타깃이 주어졌을 때 이득 함수를 최소화\n하는 모델 파라미터의 조합을 찾는 것을 의미한다.\n② 데이터 샘플과 타깃의 배치를 랜덤하게 뽑고 이 배치\n에서 손실에 대한 파라미터의 그래디언트(gradient)\n를 계산하므로써 학습이 진행된다.\n③ 네트워크의 파라미터는 그래디언트의 반대 방향으로\n조금씩(학습률에 의해 정의된 크기만큼) 움직인다.\n④ 현재 파라미터와 배치 데이터를 그래디언트 값에\n매핑해 주는 그래디언트 함수를 구성하기 위해 미\n분의 연쇄 법칙을 사용한다.\n- 19",
  "2019_93": "93. 큰 작업부하(workload)를 효과적으로 처리하기 위해\nTP(Transaction Processing)시스템을 확장할 때,\n다양한 확장기법을 사용하면 TP시스템에 대한 데\n이터 접근 공유능력을 향상시킬 수 있다. 다음에\n설명하는 확장기법으로 가장 적절한 것은?\n다수의 동일한 서버 전체에 걸쳐 작업부하를 분산하는\n기법으로 클라이언트 작업을 특정 서버에 요청할 수 있고,\n큐에 넣어 두고 서버가 가져가게 할 수 있다.\n① 리소스 풀링(resource pooling)\n② 복제(replication)\n③ 캐싱(caching)\n④ 파티셔닝(partitioning)",
  "2019_94": "94. IPv6에 대한 설명으로 가장 적절하지 않은 것은?\n① IP 주소로 128 비트를 사용한다.\n② IPv6는 유니캐스트, 애니캐스트, 멀티캐스트, 브로드\n캐스트를 지원한다.\n③ IPv6 패킷은 기본 헤더와 확장 헤더를 포함한다.\n④ IPv6는 확장 헤더를 통해 QoS 기능과 보안 기능을\n지원한다.",
  "2019_95": "95. ARP(Address Resolution Protocol) 프로토콜에\n대한 설명으로 가장 거리가 먼 것은?\n① 네트워크 환경에서 수신 호스트의 MAC 주소를\n얻는데 이용한다.\n② 사용자는 일반적으로 도메인을 입력하는데 도메\n인 이름은 ARP 프로토콜을 이용해 IP 주소로 쉽\n게 변환할 수 있다.\n③ 송신 호스트의 MAC 주소는 자신의 LAN 카드에 내\n장되어 있어 쉽게 얻을 수 있으나 수신 호스트의\nMAC 주소는 ARP 프로토콜을 이용해서 얻어야 한다.\n④ 데이터를 전송할 때 마다 ARP 프로토콜을 사용해 패\n킷을 브로드캐스팅(broadcasting)하면 네트워크 트래\n픽이 증가한다.\n9 -\n\n=== NEW PAGE ===",
  "2019_96": "96. 블록체인 기반의 FIDO(Fast Identity Online) 범용\n인증 프레임워크 요구사항(정보통신단체표준, TTA\nK.KO-12.0337)은 5개의 요구사항을 정의하고 있다.\n요구사항에 대한 설명으로 가장 적절한 것은?\n① 블록체인에 참여하는 모든 노드가 동일한 FIDO\n검증 기능을 공유하고 실행할 수 있는 AAID\n(Authenticator Attestation ID)가 필요하다.\n② 블록체인에 기록되어 있는 사용자의 FIDO 인증\n정보를 식별할 수 있는 정보가 필요하며 모든\n참여 노드들이 그 식별 정보를 확인할 수 있는\n방법이 필요하다.\n③ 블록체인으로 구성되어 있는 모든 노드가 블록\n체인으로 공유되는 두 개 이상의 FIDO 인증정보\n를 이용하기 위해서 복수 도메인으로 구성되어\n야 하는 설계 요구 사항이 필요하다.\n④ FIDO 인증장치의 메타데이터 명세서에는 FIDO 인\n증장치가 생성하고 블록체인에 등록하는 크리덴셜\n(credential)에 대한 신뢰성을 검증할 수 있는 비\n공개키 인증서와 같은 정보가 포함되어야 한다.",
  "2019_97": "97. 비트코인에 대한 기술 중 가장 거리가 먼 것은?\n① 거래를 블록이라는 단위로 결합하고 앞의 블록\n정보를 포함한 해시 값을 생성하여 불가역 데이\n터로 만든다.\n② 변조를 방지하기 위하여 새로운 블록을 만들기 위\n해 계산량이 큰 문제를 푸는 방식을 도입하였다.\n③ 비잔티움 장군 문제를 해결하기 위해서 블록체\n인 분기 현상이 발생되지 않도록 하였다.\n④ 블록을 만든 사람에게 CPU 사용에 대한 보상으\n로 새로운 비트코인을 발행하여 제공한다.",
  "2019_98": "",
  "2019_99": "99.962% ② 99.977%\n③ 99.987% ④ 99.998%\n91. 인터 네트워킹(inter-networking) 장비에 대한\n설명으로 거리가 먼 것은?\n① 리피터(repeater)는 계층2를 지원하며, 한쪽 단\n에서 들어온 비트신호를 증폭하여 다른 단으로\n단순 전송하는 역할을 수행한다.\n② 브리지(bridge)는 한쪽 단에 들어온 프레임 MAC 계층 헤\n더를 다른 단의 MAC 계층 헤더로 변형해 전송할 수 있다.\n③ 브리지(bridge)는 수신한 프레임의 목적지 주소와\n송신 호스트의 주소가 같은 LAN에 소속되어 있으\n면 아무 행동도 하지 않는다.\n④ 라우터(router)는 교환기능을 수행할 수 있으므\n로 여러 포트를 사용해 다수의 LAN을 연결하는\n구조를 지원한다.\n92. 신경망에서 활용되는 확률적 경사하강법(stochastic\ngradient descent)의 학습(learning)에 대한 설명\n중에 가장 거리가 먼 것은?\n① 학습은 훈련(training) 데이터 샘플과 그에 상\n응하는 타깃이 주어졌을 때 이득 함수를 최소화\n하는 모델 파라미터의 조합을 찾는 것을 의미한다.\n② 데이터 샘플과 타깃의 배치를 랜덤하게 뽑고 이 배치\n에서 손실에 대한 파라미터의 그래디언트(gradient)\n를 계산하므로써 학습이 진행된다.\n③ 네트워크의 파라미터는 그래디언트의 반대 방향으로\n조금씩(학습률에 의해 정의된 크기만큼) 움직인다.\n④ 현재 파라미터와 배치 데이터를 그래디언트 값에\n매핑해 주는 그래디언트 함수를 구성하기 위해 미\n분의 연쇄 법칙을 사용한다.\n- 19\n93. 큰 작업부하(workload)를 효과적으로 처리하기 위해\nTP(Transaction Processing)시스템을 확장할 때,\n다양한 확장기법을 사용하면 TP시스템에 대한 데\n이터 접근 공유능력을 향상시킬 수 있다. 다음에\n설명하는 확장기법으로 가장 적절한 것은?\n다수의 동일한 서버 전체에 걸쳐 작업부하를 분산하는\n기법으로 클라이언트 작업을 특정 서버에 요청할 수 있고,\n큐에 넣어 두고 서버가 가져가게 할 수 있다.\n① 리소스 풀링(resource pooling)\n② 복제(replication)\n③ 캐싱(caching)\n④ 파티셔닝(partitioning)\n94. IPv6에 대한 설명으로 가장 적절하지 않은 것은?\n① IP 주소로 128 비트를 사용한다.\n② IPv6는 유니캐스트, 애니캐스트, 멀티캐스트, 브로드\n캐스트를 지원한다.\n③ IPv6 패킷은 기본 헤더와 확장 헤더를 포함한다.\n④ IPv6는 확장 헤더를 통해 QoS 기능과 보안 기능을\n지원한다.\n95. ARP(Address Resolution Protocol) 프로토콜에\n대한 설명으로 가장 거리가 먼 것은?\n① 네트워크 환경에서 수신 호스트의 MAC 주소를\n얻는데 이용한다.\n② 사용자는 일반적으로 도메인을 입력하는데 도메\n인 이름은 ARP 프로토콜을 이용해 IP 주소로 쉽\n게 변환할 수 있다.\n③ 송신 호스트의 MAC 주소는 자신의 LAN 카드에 내\n장되어 있어 쉽게 얻을 수 있으나 수신 호스트의\nMAC 주소는 ARP 프로토콜을 이용해서 얻어야 한다.\n④ 데이터를 전송할 때 마다 ARP 프로토콜을 사용해 패\n킷을 브로드캐스팅(broadcasting)하면 네트워크 트래\n픽이 증가한다.\n9 -\n\n=== NEW PAGE ===\n\n96. 블록체인 기반의 FIDO(Fast Identity Online) 범용\n인증 프레임워크 요구사항(정보통신단체표준, TTA\nK.KO-12.0337)은 5개의 요구사항을 정의하고 있다.\n요구사항에 대한 설명으로 가장 적절한 것은?\n① 블록체인에 참여하는 모든 노드가 동일한 FIDO\n검증 기능을 공유하고 실행할 수 있는 AAID\n(Authenticator Attestation ID)가 필요하다.\n② 블록체인에 기록되어 있는 사용자의 FIDO 인증\n정보를 식별할 수 있는 정보가 필요하며 모든\n참여 노드들이 그 식별 정보를 확인할 수 있는\n방법이 필요하다.\n③ 블록체인으로 구성되어 있는 모든 노드가 블록\n체인으로 공유되는 두 개 이상의 FIDO 인증정보\n를 이용하기 위해서 복수 도메인으로 구성되어\n야 하는 설계 요구 사항이 필요하다.\n④ FIDO 인증장치의 메타데이터 명세서에는 FIDO 인\n증장치가 생성하고 블록체인에 등록하는 크리덴셜\n(credential)에 대한 신뢰성을 검증할 수 있는 비\n공개키 인증서와 같은 정보가 포함되어야 한다.\n97. 비트코인에 대한 기술 중 가장 거리가 먼 것은?\n① 거래를 블록이라는 단위로 결합하고 앞의 블록\n정보를 포함한 해시 값을 생성하여 불가역 데이\n터로 만든다.\n② 변조를 방지하기 위하여 새로운 블록을 만들기 위\n해 계산량이 큰 문제를 푸는 방식을 도입하였다.\n③ 비잔티움 장군 문제를 해결하기 위해서 블록체\n인 분기 현상이 발생되지 않도록 하였다.\n④ 블록을 만든 사람에게 CPU 사용에 대한 보상으\n로 새로운 비트코인을 발행하여 제공한다.\n98. 아래와 같은 3개의 입력과 1개의 출력을 갖는 1층\n의 전결합 신경망에서 평균 제곱오차(mean square\nerror)로 가장 적합한 것은?\n가중치는 w=(w1 w2 w3 b) = (1 0 1 0), b는 bias 이다.\n입력 데이터 지도 학습\n번호\nx1 x2 x3 데이터\n1 1 2 3 4\n2 5 6 7 7\n① 3.5 ② 7.0 ③ 10.0 ④ 12.5\n- 20\n99. MQTT(Message Queuing Telemetry Transport)에\n대한 설명 중에 가장 거리가 먼 것은?\n① 열악한 네트워크 환경에서 대량의 장치에 대한\n모니터링을 목적으로 데이터 수집을 용이하게\n하기 위해서 IBM이 1999년에 개발한 메시지 프\n로토콜이다.\n② 메시지 전송 패턴은 request-response를 채택하\n여 실시간 데이터를 취득하기에 유리하다.\n③ 저전력, 전송 지연 및 손실이 있는 네트워크 환\n경을 고려하였으며 1:N 또는 M:N의 전송에 적합\n하다.\n④ 요구사항에 따라 상이한 QoS 레벨을 정의하고 있어,\n메시지의 전달에 신뢰성을 보장할 수 있다.",
  "2019_100": "100. 지능형 서비스 로봇 온톨로지 (정보통신단체표\n준, TTAK.KO-10.1070-part2)는 지능형 로봇 온\n톨로지 지능 프레임워크 구성 요소를 정의하고\n있다. 프레임워크 구성요소에 대한 설명으로 가\n장 적절하지 않은 것은?\n① 지능형 로봇은 일정, 지도 등 스스로 관리할 필\n요가 없거나 외부에서 관리되는 정보 및 서비스\n를 연계할 수 있는 연계 인터페이스를 보유하여\n야 한다.\n② 지능형 로봇은 환경으로부터 생산, 추론되는 데\n이터와 축적된 지식 정보를 바탕으로 실시간으\n로 합리적인 의사 결정을 수행하고 로봇의 행위\n를 제어 및 모니터링 할 수 있는 작업관리자 기\n능을 제공하여야 한다.\n③ 지능형 로봇은 유동적인 환경을 실시간으로 인식\n하여 추론 가능한 지식의 형태로 가공할 수 있\n고, 가공된 지식을 바탕으로 의사 결정을 지원하\n는 새로운 지식을 추론할 수 있는 지식관리자 기\n능을 필요로 한다.\n④ 지능형 로봇은 환경을 추론하고 합리적인 의사\n결정이 가능하기 위하여 다양한 센서 모듈과 소\n프트웨어 서비스에서 생산하는 데이터를 1:N,\nN:1, N:N 등의 교환이 가능할 수 있도록 데이터\n게이트웨이를 필요로 한다.\n0 -\n\n=== NEW PAGE ===\n\n보 안",
  "2020_76": "76. 현재 상태에서 보상을 최대화하는 방향으로 행동을\n선택하도록 학습이 진행되는 머신러닝 방법으로\n가장 적절한 것은?\n① 지도학습(supervised learning)\n② 강화학습(reinforcement learning)\n③ 분류학습(classification learning)\n④ 비지도학습(unsupervised learning)",
  "2020_77": "77. 다음 중 무손실 압축기법과 가장 거리가 먼 것은?\n① 반복길이(run-length) 부호화\n② LZW 부호화\n③ 산술 부호화\n④ 예측 부호화",
  "2020_78": "78. OSI 7 계층에 대한 설명으로 가장 적절하지\n않은 것은?\n① 데이터 링크 계층(data link layer)은 MAC 주소를\n사용한다.\n② 네트워크 계층(network layer)은 TCP를 사용하여\n최종 목적지까지 경로를 설정한다.\n③ 전송 계층(transport layer)에서는 프로세스 간\n전송을 지원한다.\n④ 세션 계층(session layer)에서는 세션의 생성,\n설정, 그리고 조율 등을 지원한다.",
  "2020_79": "79. TCP와 UDP에 대한 설명으로 가장 적절하지 않은 것은?\n① TCP는 연결지향(connection-oriented) 프로토콜\n이고 UDP는 비연결지향(connectionless-oriented)\n프로토콜이다.\n② UDP는 오류 정정(error correction) 기능을 지원\n한다.\n③ TCP는 흐름 제어(flow control)와 혼잡 제어\n(congestion control)를 지원한다.\n④ UDP는 체크섬(checksum) 기능을 지원한다.\n- 17",
  "2020_80": "80. 다음에 설명하는 라우팅 프로토콜로 가장 적절한\n것은?\n가. 홉수 기반 거리벡터 라우팅 알고리즘이다.\n나. 원래는 벨먼-포드 알고리즘을 사용하였고 최\n근에는 가변길이 서브넷도 지원한다.\n다. 소규모 네트워크에 적합하다.\n① RIP ② OSPF ③ BGP ④ MOSPF",
  "2020_81": "81. 네트워크의 노드들을 연결하는 토폴로지 방법으로는\n성형(star), 버스형(bus), 그물형(mesh) 등이 있다.\n그물형 토폴로지일 때, 노드의 수가 6이라면 연결이\n필요한 총 회선수로 가장 적절한 것은?\n① 12 ② 14 ③ 15 ④ 19",
  "2020_82": "82. '클라우드컴퓨팅서비스 품질·성능 안내서(정보통\n신산업진흥원, 2019.8)' 에서 클라우드서비스의\n신뢰성을 측정하는 품질·성능 세부기준으로 가장\n적절하지 않은 것은?\n① 응답 시간 ② 백업 준수율\n③ 서비스 회복시간 ④ 백업 데이터 보관 기간",
  "2020_83": "83. 다음 중 디지털 데이터를 아날로그 신호로 변환\n하는 방법이 아닌 것은?\n① DM(Delta Modulation)\n② FSK(Frequency Shift Keying)\n③ PSK(Phase Shift Keying)\n④ QAM(Quadrature Amplitude Modulation)",
  "2020_84": "84. 아날로그 데이터를 디지털 신호로 변환하는 기법\n중에서 PCM(Pulse Code Modulation) 과정을\n순서대로 나열한 것으로 가장 적절한 것은?\n① 아날로그 신호-양자화-표본화-부호화-디지털 신호\n② 아날로그 신호-양자화-부호화-표본화-디지털 신호\n③ 아날로그 신호-표본화-부호화-양자화-디지털 신호\n④ 아날로그 신호-표본화-양자화-부호화-디지털 신호\n7 -\n\n=== NEW PAGE ===",
  "2020_85": "85. RAID에 대한 설명으로 가장 적절하지 않은 것은?\n① RAID-1은 디스크 미러링(disk mirroring)이라고\n한다.\n② RAID-2는 디스크 배열에서 각 디스크에 데이터를\n비트 단위로 인터리빙(interleaving)하는 방식\n으로서 RAID-1보다 많은 수의 디스크가 필요하다.\n③ RAID-3은 많은 수의 패리티 디스크를 사용하는\nRAID-2의 단점을 보완한 방식으로 한 개의 패리티\n디스크만 추가한 방식이다.\n④ RAID-5는 RAID-4에서 발생하는 패리티 디스크의\n병목 현상을 완화시킬 수 있다.",
  "2020_86": "86. C 클래스 네트워크에서 서브넷마다 5개의 호스트가\n연결될 수 있는 서브넷을 최대한 많이 만들고자\n한다. 이를 위한 서브넷 마스크로 가장 적절한 것은?\n① 255.255.255.192 ② 255.255.255.224\n③ 255.255.255.240 ④ 255.255.255.248",
  "2020_87": "87. 다음 매체 접근 제어 방식에 대한 설명으로 가\n장 적절하지 않은 것은?\n① CSMA방식은 반송파 감지(carrier sense) 메커\n니즘을 사용하여 다른 지국이 회선을 사용하는\n지 알 수 있다.\n② CSMA/CD 방식에서 충돌이 발생하면 고정된 시간을\n대기하였다가 다시 접근을 시도한다.\n③ CSMA/CA 방식은 무선 LAN에서 주로 사용한다.\n④ CSMA/CD 방식은 유선 LAN에서 주로 사용한다.",
  "2020_88": "88. 텐서플로우에 대한 설명으로 가장 적절하지 않은\n것은?\n① 구글에서 공개한 오픈소스 소프트웨어이다.\n② 머신러닝과 딥러닝에 특화된 소프트웨어 개발\n플랫폼이다.\n③ 아파치 2.0 라이선스에 의해서 비상업적 용도\n로만 자유롭게 사용 가능하다.\n④ 파이썬을 위한 텐서플로우 라이브러리가 제공된다.\n- 18",
  "2020_89": "89. 신경망에서 과대적합(overfitting)에 관한 설명\n으로 가장 적절하지 않은 것은?\n① 드롭아웃은 학습 과정 중에 일부 노드들을 무\n작위로 제외함으로써 과대적합을 완화하는 기\n법이다.\n② 과대적합을 피하기 위한 방법으로 더 다양한\n데이터를 확보하여 부족한 학습 데이터를\n채우는 방법이 있다.\n③ 학습 데이터의 정확도를 증가시키기 위해 학습\n반복 횟수를 늘림으로써 과대적합 문제를 회피\n할 수 있다.\n④ 검증 데이터로 모델 정확도를 측정하여 검증\n정확도가 지속적으로 하강하는 시점에서 학습을\n중단함으로써 과대적합을 완화할 수 있다.",
  "2020_90": "90. 다음 중 사물인터넷에서 부각되고 있는 LoRa\n통신과 LoRa WAN 네트워크에 대한 설명으로\n가장 적절하지 않은 것은?\n① LoRa는 대표적인 저전력 통신방식으로 LoRa\n얼라이언스를 중심으로 개발되고 있다.\n② ISM 비면허 대역 공간에 기반을 두고 있다.\n③ LoRa는 매우 넓은 커버리지를 갖는 장거리 통신\n방식이다.\n④ LoRa WAN에는 LTE에서 사용되는 공통 기술은\n모두 포함되어 있다.",
  "2020_91": "91. 다음에 설명하는 라우팅 기법으로 가장 적절한\n것은?\n가. 패킷을 전송하는 호스트가 목적지 호스트까지\n전달경로를 스스로 결정하는 방식이다.\n나. 이러한 방식을 지원하려면 송신 호스트의 라우팅\n테이블에서 패킷을 수신 호스트까지 전달하기\n위한 정보경로를 관리하여야 하며, 경로 정보를\n패킷에 기록해야 한다.\n① 소스라우팅(source routing)\n② 분산라우팅(distributed routing)\n③ 중앙라우팅(centralized routing)\n④ 계층라우팅(hierarchical routing)\n8 -\n\n=== NEW PAGE ===",
  "2020_92": "92. 다음 중 전자우편 서비스를 위해서 사용되는\n프로토콜로 가장 적절하지 않은 것은?\n① SMTP ② DNS ③ POP3 ④ IMAP",
  "2020_93": "93. 64비트 CPU를 위한 주기억장치 모듈(용량:8KB)을\n1K×8비트 조직의 램(RAM)을 이용하여 구성하고자\n할 때, 가장 적절한 방법은?\n① 8개 RAM을 직렬 연결\n② 8개 RAM을 병렬 연결\n③ 16개 RAM을 직렬 연결\n④ 16개 RAM을 병렬 연결",
  "2020_94": "94. '사이버-물리 시스템(CPS: Cyber-Physical Systems)의\n안전·신뢰성 확보 지침 제1부 : CPS 사고분석모델\n(정보통신단체표준, TTAK.KO-11.0268-Part1)' 에서 C\nPS의 안전·신뢰성을 확보하기 위해 고려할 특징으로\n가장 적절하지 않은 것은?\n① CPS는 가상세계와 물리세계가 서로 다른 메커\n니즘으로 동작하기 때문에 예측하지 못한 다양한\n변수가 있다.\n② CPS는 다양한 장치 및 서브시스템이 긴밀하게\n연결되어 있어, 다양한 요인의 복합적 작용에\n의해 CPS 사고가 발생한다.\n③ 다양한 이해관계자들의 서브시스템이 융합되면서\n부정확한 요구사항의 반영 혹은 같은 작업에\n대해 서로 대비되는 요구사항의 설정으로 시스템\n오작동이 발생한다.\n④ 인공지능은 학습을 통해 획득한 결론에 대해 그\n원인과 과정을 알 수 있기에, 인공지능의 활용은\n불확실성을 감소시켜 시스템의 안전성, 신뢰성\n측면의 분석을 용이하게 만든다.",
  "2020_95": "95. 버스의 성능을 나타내는 척도는 버스 대역폭(bus\nbandwidth)으로 일반적으로 버스 클록 주기와 버스\n폭에 의해서 결정된다. 만약 버스 클록률이 50Mhz\n이고 버스 폭이 32비트라면 이때의 버스 대역폭으로\n가장 적절한 것은?\n① 80M 바이트/초 ② 100M 바이트/초\n③ 200M 바이트/초 ④ 400M 바이트/초\n- 19",
  "2020_96": "96. 다음에 설명하는 TCP에서 네트워크 효율을 높이기\n위한 알고리즘으로 가장 적절한 것은?\n가. 소량의 데이터가 들어오는 경우 바로 네트\n워크에 전송하지 않고 버퍼에 넣어 두고\n이전에 송신한 데이터에 대한 ACK가 수신\n되면 버퍼에 쌓여 있는 데이터를 한 번에\n송신한다.\n나. 네트워크 상에서 오가는 패킷수를 줄임으로써\n효율성을 높일 수 있다는 장점은 있으나 송신\n호스트가 ACK를 받을 때까지 기다렸다 송신해야\n하므로 성능저하 가능성이 존재한다.\n① 네이글(Nagle’s) 알고리즘\n② 데이크스트라(Dijkstra’s) 알고리즘\n③ 슬라이딩 윈도우 알고리즘\n④ 전송보장 알고리즘\n",
  "2020_97": "97.\n\n=10000 일 때 이를 [] 단위로 변환한 값으로 가장\n\n적절한 것은? (단, 여기서 는 신호 전력, 은 잡음\n전력을 나타낸다.)\n① 10 ② 20\n③ 30 ④ 40",
  "2020_98": "98. 다음은 컨테이너(container) 및 도커(docker)에\n관한 설명이다. (ㄱ)~(ㄹ)에 들어갈 것으로 가장\n적절한 것은?\n가. ㈀는/은 오픈소스 프로젝트로서 애플리케이션을\n경량 ㈁로 패키징하고 배포하는 기능을 제공한다.\n나. ㈂는/은 가상머신과 비슷하나 호스트 머신의\n커널을 공유하면서 유저 스페이스 격리기능을\n제공한다는 점이 다르다.\n다. ㈃는/은 하나의 서비스를 패키지로 만들어 구동\n한다.\n① ㈀ 도커 ㈁ 컨테이너 ㈂ OS 컨테이너\n㈃ 애플리케이션 컨테이너\n② ㈀ 도커 ㈁ 컨테이너 ㈂ 애플리케이션 컨테이너\n㈃ OS 컨테이너\n③ ㈀ 컨테이너 ㈁ 도커 ㈂ OS 컨테이너\n㈃ 애플리케이션 컨테이너\n④ ㈀ 컨테이너 ㈁ 도커 ㈂ 애플리케이션 컨테이너\n㈃ OS 컨테이너\n9 -\n\n=== NEW PAGE ===",
  "2020_99": "99. '네트워크 구축을 위한 장비 규모산정지침(TTAK.KO-0\n1.0103/R1, 2017.6.28.)'에서 접속형 L2/L3 스위치\n(라우터 포함)를 위한 규모산정 항목으로 가장 적절\n하지 않은 것은?\n① 이론적 패킷처리상수 ② 업링크 포트 이중화\n③ 양방향 상수 ④ 시스템 확장 고려상수",
  "2020_100": "100. 다중 프로세서 시스템 구조에 대한 설명으로\n가장 적절하지 않은 것은?\n① 공유 기억장치(shared memory) 시스템 구조는 별도의\n프로세서 간 통신 메커니즘 없이도 프로세서 간\n통신이 가능한 구조이다.\n② 공유 기억장치(shared memory) 시스템 구조는 프로\n세서들과 기억장치들 간의 통로 상에 통신량이\n많아져 경합으로 인한 지연시간이 발생할 수 있다.\n③ 분산 기억장치(distributed memory) 시스템 구조는\n프로세서 간 통신을 위해 메시지 패싱 방식을 사용\n하므로 통신 시간이 감소한다.\n④ 크로스바 스위치(crossbar switch) 구조에서 두 개\n혹은 그 이상의 프로세서가 동일한 기억장치 모듈을\n동시에 접근하고자 할 때에는 충돌이 발생하고 이런 경\n우에는 중재를 받아서 순서대로 접근해야 한다.\n- 20\n0 -\n\n=== NEW PAGE ===\n\n보 안",
  "2021_76": "76. 하드 드라이브, RAID 배열, 비디오-캡쳐 박스 및 네트\n워크 인터페이스와 같은 주변장치들을 위하여 데이터,\n비디오, 오디오 및 전력을 하나의 고속 연결선으로 통\n합한 초고속 주변 장치 접속 기술로 가장 적절한 것은?\n① 아이비브리지(IvyBridge)\n② QPI(Quick Path Interconnect)\n③ 샌디브리지(SandyBridge)\n④ 선더볼트(Thunderbolt)",
  "2021_77": "77. 도커 컨테이너에 관한 설명으로 가장 적절하지 않은 것은?\n① 가상화된 공간을 프로세스 단위의 격리 환경으로\n만들어 준다.\n② 호스트 커널을 공유하고 컨테이너 안에는 애플리\n케이션을 구동하는데 필요한 라이브러리와 실행\n파일만 존재한다.\n③ 컨테이너를 이미지로 만들어 배포하는 시간은 빠\n르나 이미지 공간이 기존의 하이퍼바이저를 이용\n한 가상머신 방식보다 더 많이 필요하다.\n④ 게스트 운영체제와 하이퍼바이저가 존재하지 않기\n때문에 일반 호스트에 비해 성능 손실이 적다.",
  "2021_78": "78. 5G 기반 스마트시티(smart city) 영상 정보 수집\n시스템(정보통신단체표준, TTAK.KO-10.1266-Part1,\n2020-12-10 제정)에 대한 요구사항으로 가장 옳은 것은?\n① 이벤트 메타데이터 기반 즉시 대응 처리 기능을\n제공해야 한다.\n② 추출된 이벤트 객체를 기반으로 프레임 메타데이터\n및 이벤트 메타데이터를 생성해야 한다.\n③ 영상에서 시티(city) 객체를 추출해야 한다.\n④ 프레임 메타데이터 생성 주기는 입력없이 시스템\n에서 설정되도록 해야 한다.",
  "2021_79": "79. 다음 중 머신러닝 모델 성능을 평가하는 지표로\n가장 올바르게 정의된 것은?\n(T:True, P:Positive, F:False, N:Negative)\n① 정확도(Accuracy) = (TP+FP)/(TP+TN+FP+FN)\n② 정밀도(Precision) = TN/(TN+FN)\n③ F1-점수(F1-score) = 2FP/(2FP+FN+TP)\n④ 재현율(Recall) = TP/(TP+FN)\n- 19",
  "2021_80": "80. 다음 중 IP 터널링에 대한 설명으로 가장 올바르지\n않은 것은?\n① 홈 에이전트로 라우팅 된 패킷을 이동 호스트에\n전달하려면 터널을 통해 전달해야 한다.\n② 이동 호스트에는 고유 IP주소인 홈 주소(home address)\n가 할당되고, 이 주소는 호스트의 위치가 바뀌면\n새로 할당되어야 한다.\n③ COA(Care of Address)는 이동 호스트가 위치를\n변경할 때 새로 이동한 지역에서 일시적으로 할\n당된 IP주소를 의미한다.\n④ 터널이 있으면 송신 호스트와 수신 호스트 사이에\n동작하는 IP 프로토콜과는 별도로 추가적인 IP 프\n로토콜을 사용하여 패킷을 중개해야 한다.",
  "2021_81": "81. 다음 중 직접 사상(direct mapped) 캐시와 완전\n연관(fully associative) 캐시에 대한 설명으로\n가장 적절한 것은?\n① 직접 사상 캐시를 사용하면 메모리의 블록이 캐\n시의 어느 블록에나 배치될 수 있다.\n② 직접 사상 캐시를 사용할 때, 일반적으로 LRU\n(Least Recently Used) 교체 정책의 캐시 적중\n률이 임의(random) 교체 정책보다 우수하다.\n③ 완전 연관 캐시를 사용하면 전체 캐시가 n개의\n집합으로 분리되며 사상되는 메모리 블록은 이\n중 특정 집합 내로 배치된다.\n④ 완전 연관 캐시에서 특정 메모리 블록을 찾기 위\n해 순차적 검색을 사용하면, 검색 소요 시간이\n직접 사상 캐시보다 길다.",
  "2021_82": "82. 월요일부터 금요일까지 매일 24시간 동안 운영하는\n시스템에서 다음과 같이 장애가 발생했을 때 MTTR\n(Mean Time To Repair)로 가장 적절한 것은?\nŸ 월요일: 13:00부터 14:00까지 장애 발생\nŸ 화요일: 장애 없음\nŸ 수요일: 장애 없음\nŸ 목요일: 16:00부터 19:00까지 장애 발생\nŸ 금요일: 장애 없음\n① 1시간 ② 2시간\n③ 3시간 ④ 4시간\n9 -\n\n=== NEW PAGE ===",
  "2021_83": "83. 스토리지 용량이 1TB로 동일한 하드디스크들을 RAID\n(Redundant Array of Inexpensive Disk)로 구성하여\n3TB의 스토리지 시스템을 구현할 때 가장 많은 하드\n디스크가 필요한 RAID 레벨로 가장 적절한 것은?\n① RAID 0 ② RAID 0 + 1\n③ RAID 4 ④ RAID 6",
  "2021_84": "84. 다음 중 패킷교환(packet switching)과 회선교환\n(circuit switching)에 대한 설명으로 가장 적절\n한 것은?\n① 패킷교환에서는 종단간 연결(end-to-end connection)을\n위해 링크와 같은 자원을 예약한다.\n② 패킷교환은 일반적으로 회선교환 대비 링크 자원의\n활용률(utilization)이 낮다.\n③ 회선교환에서는 종단간의 전송률을 보장할 수 있다.\n④ 회선교환에서는 링크 자원의 공유가 허용되지 않\n는다.",
  "2021_85": "85. 컨볼루션 신경망에서 원본 이미지가 5×5 크기의\n행렬로 주어지고 3×3 크기의 필터 행렬이 합성곱\n연산에 적용되는 경우, 이때 생성되는 특징 맵 행렬\n의 크기로 옳은 것은? (단, 스트라이드(stride)는\n1이고 패딩연산은 적용하지 않는다.)\n① 2×2 ② 3×3\n③ 4×4 ④ 5×5",
  "2021_86": "86. 다음 중 SDN(Software Defined Networking) 오버\n레이(overlay)의 수행 방법(혹은 기술)으로 가장\n적절하지 않은 것은?\n① VXLAN(Virtual eXtensible LAN)\n② NVGRE(Network Virtualization with GRE)\n③ NVO3(Network Virtualization Overlays)\n④ CDPI(Control to Data-Plane Interface)",
  "2021_87": "87. 빅데이터 아키텍처는 역할별로 수집, 적재, 처리\n및 탐색, 분석 및 응용이라는 6개의 레이어로 나눌\n수 있다. 다음 중 수집 레이어 기술로 가장 적절하지\n않은 것은?\n① 머하웃(mahout) ② 스톰(storm)\n③ 카프카(kafka) ④ 플럼(flume)\n- 20",
  "2021_88": "88. 백업 방식에 대한 설명으로 가장 적절한 것은?\n① 증분(incremental) 백업은 전체 백업 이후에 변경\n된 모든 데이터를 백업하는 방식이다.\n② 차등(differential) 백업은 최종 전체 백업 또는\n최종 증분 백업 이후에 변경된 파일만을 백업하는\n방식이다.\n③ 합성(synthetic) 백업은 기본 백업과 후속 차등\n백업으로부터 전체 백업을 구성하거나 통합하는\n방식이다.\n④ 중복제거(deduplication) 백업은 여러 개의 파일\n에서 동일한 부분은 하나만 저장하고 나머지 파일\n구조는 메타데이터로 저장하는 방식이다.",
  "2021_89": "89. RIP(Routing Information Protocol) 사용시 발생\n가능한 문제점들을 해결하기 위한 방안 중에서\n라우터가 회선이 고장 난 것을 감지하면 즉시 해당\n경로의 홉을 16으로 지정하여 전체 네트워크에 전송\n함으로써 도달 불가능을 신속하게 알리는 방식\n으로 가장 적절한 것은?\n① Hold Down ② Poisoning\n③ Split Horizon ④ Triggered Update",
  "2021_90": "90. 오픈스택(openstack)의 코어 서비스에서 가상 머신\n의 라이프사이클(생성과 폐기관리, 스케줄링 등)을\n관리하는 프로젝트명으로 가장 적절한 것은?\n① Cinder ② Keystone\n③ Neutron ④ Nova",
  "2021_91": "91. SDN(Software Defined Networking)의 가장 중요한\n기술로서 평가받는 OpenFlow는 SDN에서 컨트롤러와\n네트워크 장비간의 인터페이스를 위한 규격으로 사용\n되는 기술이다. OpenFlow의 기술 또는 구성요소로\n가장 적절하지 않은 것은?\n① 플로우 테이블(flow table)\n② 그룹 테이블(group table)\n③ 네트워크 기능 가상화(network function virtualization)\n④ 파이프라인 처리(pipelining)\n0 -\n\n=== NEW PAGE ===",
  "2021_92": "92. 일반적인 응답시간(response time)은 요청(request)\n한 후 응답(response)을 받을 때까지 소요되는 시간\n으로, 측정하는 위치에 따라 여러 가지 유형으로\n나뉜다. 아래의 설명에 해당하는 응답시간 유형으로\n가장 적절한 것은?\nŸ 사용자 요청이 클라이언트 네트워크에서 전송된\n후부터 클라이언트 네트워크에 도달하기까지의\n경과된 시간을 의미한다.\nŸ HTTP나 TP 모니터 테스트시에 측정된 로드 러너\n(Load Runner) 응답시간이다.\nŸ 응답시간을 세분화하면 DNS Look-up 시간과 서비\n스 업로드/다운로드에 소요된 시간 그리고 서버\n응답시간을 포함한다.\n① 클라이언트 응답시간 ② 네트워크 응답시간\n③ 서버 응답시간 ④ 연계 응답시간",
  "2021_93": "93. OSI 7계층에서 주요 계층별 대표 프로토콜을 짝지은\n것으로 가장 올바른 것은?\n① 2계층(데이터 링크) : FDDI, PPP, SLIP, ATM\n② 3계층(네트워크) : IP, ICMP, OSPF, DDP\n③ 4계층(전송) : TCP, UDP, ARP, MTP\n④ 5계층(세션) : Socket session, Named pipe, SPX,\nNet-Bios",
  "2021_94": "94. 다음 중 스위치(switch)에 대한 설명으로 가장 올바른 것은?\n① L2 스위치는 MAC이 수집 가능한 로컬 네트워크\n구간에서 스위칭이 가능하고 특정 IP주소에 대해\n내부 네트워크 혹은 라우터 중 어디로 보낼지를\n판단할 수 있다.\n② L3 스위치는 3계층인 네트워크에서 사용하는 목적지\n주소인 IP에 대한 스위칭이 가능하다. 이는 라우터\n와 유사한 기능이나 라우터가 훨씬 더 다양한 기능\n을 수행한다.\n③ L4 스위치는 IP 주소를 기반으로 스위칭 할 수\n있으며, 특정 IP의 포트 번호로 들어온 프레임을\n여러 서버의 특정 포트 번호로 재분배하는 것이\n가능해서 부하분산에 많이 사용된다.\n④ L7 스위치는 애플리케이션 계층을 인식할 수 있\n으며, HTTP의 URL이나 FTP의 파일명, UDP의 주소\n등을 인식할 수 있어 다양한 방식으로 스위칭 할\n수 있으나 부하분산 기능은 없다.\n- 21",
  "2021_95": "95. 마이크로서비스 아키텍처(micro service architecture)\n에 대한 설명으로 가장 적절하지 않은 것은?\n① 하나의 거대한 코드베이스에 모든 개발자가 함께\n작업하는 방식에서 벗어나 작은 코드 베이스를\n여러 개 만들어 소규모 팀이 기민하게 대응하는 방\n식이다.\n② 비즈니스 기능과 우선순위를 중심으로 설계하며\n다양한 컴포넌트 서비스로 구성되는데 분산 제어\n구조를 해치지 않으면서 독립적인 자동화 배치가\n가능하다.\n③ 모놀리틱(monolitic) 아키텍처가 구현하기 어려\n운 모듈화를 추구하여 개별서비스를 빠르게 구현\n할 수 있으며 이해 및 관리가 쉽다.\n④ 마이크로서비스에서는 개별서비스를 지속적으로\n배치할 수 있으며, 모놀리틱 아키텍처에 비해\n마이크로서비스 애플리케이션은 테스트가 쉽다.",
  "2021_96": "96. 하이퍼바이저에 대한 설명으로 가장 적절하지 않은\n것은?\n① 반가상화 방식은 가상화를 위해 하이퍼바이저가\n특권모드를 차지한다.\n② Type1 기법은 하이퍼바이저가 직접 하드웨어를\n제어하는 방식이다.\n③ Type1 기법은 Type2 기법보다 동작과정에 오버헤\n드가 있지만 하이퍼바이저가 가볍다는 장점이 있다.\n④ Type2 기법에는 VirtualBox, Virtual PC 등이 있다.",
  "2021_97": "97. 컴퓨터 네트워크 보안에 관한 설명으로 옳지 않은\n것은?\n① 대칭 키 암호화는 암호화와 복호화에 동일한 키를\n사용하는 방식이다.\n② 서비스 거부(denial of service)는 가용성을 위\n협하는 공격이다.\n③ 스테가노그래피(steganography)는 비밀기록(secret\n-writing)을 의미하는 암호와는 대조적으로 감\n춰진 기록(covered writing)을 의미한다.\n④ 무결성(integrity)은 변경이 인가된 자에 의해\n인가된 메커니즘을 통해서 이루어져야 한다는\n것으로 무결성 침해는 악의적인 행동의 결과로만\n발생한다.\n1 -\n\n=== NEW PAGE ===",
  "2021_98": "98. 다음 중 여러 분류기를 하나의 메타 분류기로 연결\n하여 개별 분류기보다 더 좋은 성능을 달성하는 머\n신러닝 기법으로 가장 적절한 것은?\n① 다변량 선형회귀(multivariate linear regression)\n② 앙상블 학습(ensemble learning)\n③ K-평균(K-means) 알고리즘\n④ LSTM(Long Short-Term Memory)",
  "2021_99": "99. 다음은 오픈소스 기반의 서버리스 프레임워크 도입\n(TTAK.KO-10.1271)에 관한 설명이다. ㉮~㉱에 들\n어갈 내용으로 가장 올바른 것은?\n가. 서버리스 서비스 함수 내용이 컨테이너 단위로\n빌드되어 산출된 결과물을 위한 저장소인 (㉮)\n를(을) 구축\n나. 컨테이너 단위로 배포된 서버리스 함수를 운영,\n관리하기 위해서는 (㉯)라 불리우는 자동화 운영\n도구를 설치\n다. (㉯) 설치 후, 컨테이너 운영환경을 관리하는\n(㉰)와 컨테이너 기능 수행을 위한 (㉱)가 포함\n된 클러스터를 구성\n① ㉮ 컨테이너 레지스트리\n㉯ 컨테이너 오케스트레이터\n㉰ 마스터 노드\n㉱ 워커 노드\n② ㉮ 컨테이너 레지스트리\n㉯ 컨테이너 오케스트레이터\n㉰ 워커 노드\n㉱ 마스터 노드\n③ ㉮ 컨테이너 오케스트레이터\n㉯ 컨테이너 레지스트리\n㉰ 마스터 노드\n㉱ 워커 노드\n④ ㉮ 컨테이너 오케스트레이터\n㉯ 컨테이너 레지스트리\n㉰ 워커 노드\n㉱ 마스터 노드\n- 22",
  "2021_100": "100. IPv6에 관한 설명으로 가장 올바르지 않은 것은?\n① 128비트 주소 체계로 구성되어 있다.\n② 실시간으로 멀티미디어 데이터를 처리할 수 있다.\n③ 고속망과 저속망에서 효율적으로 동작하도록 설계\n되었다.\n④ 이중 스택(dual stack)은 IPv6 패킷을 IPv4 패킷\n안에 넣어서 IPv4 네트워크를 통하여 상대방의\nIPv6 네트워크나 IPv6 장비로 패킷을 전송하는\n것이다.\n2 -\n\n=== NEW PAGE ===\n\n보 안",
  "2022_76": "76. 네트워크 장비를 그 기능에 따라 OSI 7 계층과 올\n바르게 매핑한 것을 모두 고른 것은?\n가. 라우터 – 네트워크 계층\n나. 브리지 – 데이터링크 계층\n다. 허브 – 물리 계층\n① 가, 나 ② 가, 다\n③ 나, 다 ④ 가, 나, 다",
  "2022_77": "77. 성형(star) 토폴로지에 대한 설명으로 적절한 것\n을 모두 고른 것은?\n가. 5개의 노드를 연결할 때 필요한 링크의 개수\n는 4개이다.\n나. 연결하는 노드의 개수가 동일할 때, 버스형\n(bus) 토폴로지에 비해 네트워크 구축 비용이\n상대적으로 높다.\n다. 임의의 한 노드에 장애가 발생해도 전체 네트\n워크는 다운되지 않는다.\n① 가, 나 ② 가, 다\n③ 나, 다 ④ 가, 나, 다",
  "2022_78": "78. 다음 프로토콜 중에서 링크 계층의 주소를 네트\n워크 계층의 주소로 변환하는 기능을 제공하는\n프로토콜로 가장 적절한 것은?\n① ARP(Address Resolution Protocol)\n② RARP(Reverse Address Resolution Protocol)\n③ ICMP(Internet Control Message Protocol)\n④ NAT(Network Address Translation)",
  "2022_79": "79. 짝수 패리티 기법을 적용하여, 패리티 비트 포함\n8비트로 이루어진 아스키코드 대문자 B를 인코딩\n할 때 올바른 메모리 비트 값으로 가장 적절한\n것은? (단, 패리티 비트는 MSB에 위치하며, 대문\n자 A의 아스키코드 값은 10진수 65임)\n① 0100 0010 ② 0100 1010\n③ 1100 0010 ④ 1100 1010\n- 1",
  "2022_80": "80. 컴퓨터는 2의 보수 (2`s complement) 체계를 사\n용해 정수를 표현한다. 10진수 –5에 대한 4비트\n를 사용한 2의 보수로 가장 적절한 것은?\n① 1110 ② 1101\n③ 1011 ④ 1010",
  "2022_81": "81. 다음 중 선점(preemptive) CPU 스케줄링 정책에\n대한 설명으로 적절한 것을 모두 고른 것은?\n가. 라운드로빈 스케줄링 정책은 선점 스케줄링\n정책에 속한다.\n나. 선점 스케줄링 정책을 사용하면 비선점 스케\n줄링 정책을 사용할 때보다 문맥 교환이 덜\n빈번하다.\n다. 선점 스케줄링 정책에서는 현재 실행 중인 프\n로세스가 종료될 때와 블록(대기) 상태로 전\n환될 때만 CPU 스케줄링이 실행된다.\n① 가 ② 가, 나\n③ 가, 다 ④ 나, 다",
  "2022_82": "82. 다음 중 경로설정(routing)에 대한 설명으로 가\n장 적절하지 않은 것은?\n① 경로설정 테이블(routing table)은 정적 혹은\n동적으로 구성될 수 있다.\n② 유니캐스트 경로설정 프로토콜과 멀티캐스트 경로\n설정 프로토콜이 존재한다.\n③ 자율 시스템(Autonomous System)내에서 사용되는\nIGP와 자율 시스템 간에 사용하는 EGP로 구분된\n다.\n④ Bellman-Ford 알고리즘을 사용하는 링크 상태\n라우팅과 Dijkstra 알고리즘을 사용하는 거리\n벡터 라우팅으로 구분된다.",
  "2022_83": "83. TCP(Transmission Control Protocol) 헤더에 있\n는 체크섬 계산에는 IP 헤더로부터 일부 필드\n정보를 가져와서 사용하며 이를 가상 헤더라\n(Pseudoheader) 한다. 다음 중 가상 헤더 필드\n로 가장 적절하지 않은 것은?\n① 프로토콜 ② 수신자 IP 주소\n③ 송신자 IP 주소 ④ 생존시간(TTL)\n18 -\n\n=== NEW PAGE ===",
  "2022_84": "84. 명령어 파이프라인은 해저드(Hazard)라는 중대한\n문제를 발생시킨다. 다음 중 일반적인 파이프라인\n해저드의 종류로 가장 적절하지 않은 것은?\n① Structural Hazard ② Register Hazard\n③ Data Hazard ④ Control Hazard",
  "2022_85": "85. 하둡 Ver 3.0에서 새로 추가된 기술로 가장 적절\n한 것은?\n① Erasure Coding\n② Resource Manager\n③ Secondary Namenode\n④ YARN(Yet Another Resource Negotiator)",
  "2022_86": "86. 두 네트워크 간의 상호 경쟁을 통해 네트워크의\n성능을 향상시키는 개념을 포함하고 있는 딥러닝\n방식으로 가장 적절한 것은?\n① CNN(Convolutional Neural Network)\n② GAN(Generative Adversarial Network)\n③ RNN(Recurrent Neural Network)\n④ SVM(Support Vector Machine)",
  "2022_87": "87. 분산 패리티 기법을 사용하는 RAID 5 구축에 요구\n되는 최소 디스크의 수로 가장 적절한 것은?\n① 2개 ② 3개\n③ 4개 ④ 5개",
  "2022_88": "88. SDN(Software Defined Network) 기술 중 자신이\n속한 도메인에 있는 모든 네트워크 기기들과 대\n화하고 관련 네트워크를 프로그래밍할 수 있는\n기술로 가장 적절한 것은?\n① 스위칭 기술 ② 오버레이 기술\n③ 라우팅 기술 ④ 컨트롤러 기술",
  "2022_89": "89. LAN 스위칭 기술을 구분할 때, Cut-Through 스위\n치, Interim Cut-Through 스위치, Store-and\n-Forward 스위치로 나눌 수 있다. 이를 구분하는\n기준으로 가장 적절한 것은?\n① 포트 인터페이스 ② 학습 로직\n③ 입출력 포트 ④ 전송 로직\n- 1",
  "2022_90": "90. IPv4에서 단편화(fragmentation)가 발생된 패킷\n은 헤더의 내용이 수정되어야 한다. 다음 IPv4\n의 헤더 정보 중에서 변경되지 않는 헤더의 정\n보로 가장 적절한 것은?\n① 전체 길이 정보\n② 체크섬(checksum) 정보\n③ 식별자(identification) 정보\n④ 단편화 오프셋(fragmentation offset) 정보",
  "2022_91": "91. 다음 멀티캐스트 라우팅 프로토콜 중에서 그룹\n공유 트리(group-shared tree) 방식을 사용하는\n프로토콜로 가장 적절한 것은?\n① MOSPF ② DVMRP\n③ CBT ④ PIM-DM",
  "2022_92": "92. 다음 그림은 SCTP(Stream Control Transmission\nProtocol)의 연결설정 과정을 보여주고 있다. 괄호\n에 들어가야 하는 메시지로 가장 적절한 것은?\n① COOKIE ECHO ② COOKIE INIT\n③ COOKIE REQ ④ COOKIE SYN",
  "2022_93": "93. NAT(network address translation)에 대해 올바\n르게 설명한 것을 모두 고른 것은?\n가. DNAT(Dynamic NAT) 방식에서는 내부(사설) 네트\n워크의 사설 IP주소가 외부에 공개되므로, 외부\n컴퓨터는 사설 IP로 내부 컴퓨터에 접속한다.\n나. SNAT(Static NAT) 방식에서는 사설 IP와 공인\nIP가 일대일로 매핑된다.\n다. PAT(Port Address Translation) 방식에서는\n소수의 공인 IP를 내부 네트워크의 다수의 컴\n퓨터가 공유해서 사용할 수 있다.\n① 가, 나 ② 가, 다\n③ 나, 다 ④ 다\n19 -\n\n=== NEW PAGE ===",
  "2022_94": "94. 다음 활성화 함수 중에 오류 역전파 학습 알고리\n즘의 적용에 필수인 미분 가능한 특징을 갖고 있\n지만 기울기 소실(vanishing gradient) 문제를\n발생시키는 활성화 함수로 가장 적절한 것은?\n① 계단 함수 ② 렐루 함수\n③ 시그모이드 함수 ④ 선형 함수",
  "2022_95": "95. 다음 중 오픈소스 라이선스를 침해하는 행위에\n해당하는 것을 모두 고른 것은?\n가. GPL3.0 라이브러리를 정적 링크 방식으로 연결\n하여 상업용 소프트웨어를 개발, 배포하고 자체\n개발한 모듈의 소스코드를 공개하지 않았다.\n나. LGPL3.0 라이브러리를 정적 링크 방식으로 연결\n하여 상업용 소프트웨어를 개발, 배포하고 자체\n개발한 모듈의 소스코드를 공개하지 않았다.\n다. Apache2.0 라이브러리를 정적 링크 방식으로 연\n결하여 상업용 소프트웨어를 개발, 배포하고 자\n체 개발한 모듈의 소스코드를 공개하지 않았다.\n① 가 ② 가, 나\n③ 가, 나, 다 ④ 모두 해당 없음",
  "2022_96": "96. 다음 중 시계열 데이터를 예측하는데 주로 사용\n되는 딥러닝 모델로서 시간 t에서의 은닉층\n(hidden layer) 출력값이 시간 t+1에서의 은닉층\n입력값으로 사용되는 특징을 가진 것으로 가장\n적절한 것은?\n① 로지스틱회귀(logistic regression)\n② 순환신경망(recurrent neural network)\n③ 퍼셉트론(perceptron)\n④ 합성곱신경망(convolutional neural network)",
  "2022_97": "97. 정보시스템 하드웨어 규모산정 지침(정보통신단체\n표준, TTAK.KO-10.0292, 2018.12.19.)에서 CPU의\n규모를 산정할 때 OLTP와 WEB/WAS 서버 모두에서 고\n려하는 공통 항목으로 가장 적절하지 않은 것은?\n① 사용자당 오퍼레이션 수\n② 시스템 목표 활용률\n③ 클러스터 보정\n④ 피크타임 부하 보정\n- 2",
  "2022_98": "98. 인-메모리 방식으로 연산을 수행하는 Spark에 관\n한 설명으로 가장 적절하지 않은 것은?\n① 하둡2.0(YARN 환경)에서는 Spark를 지원하지 않는\n다.\n② 맵리듀스 연산에 비해 그 계산 속도가 매우 빠\n르다,\n③ 파이썬, 스칼라, 자바 언어를 사용하여 개발할\n수 있다.\n④ 기계학습, 그래프 연산 등 반복적인 계산 문제\n를 해결하는 데 적합하다.",
  "2022_99": "99. 다음 중 DHCP(Dynamic Host Configuration\nProtocol) 프로토콜에서 사용하는 메시지에 대한\n설명으로 가장 적절하지 않은 것은?\n① DHCP ACK는 DHCP Request에 대한 응답으로 보낸다.\n② DHCP Request는 클라이언트가 DHCP 서버에게 IP\n주소를 요청한다.\n③ DHCP Discover는 DHCP 서버가 IP 주소 할당 서\n버임을 알린다.\n④ DHCP Offer는 DHCP 서버가 요청 클라이언트에게\n할당할 IP주소를 제공한다.",
  "2022_100": "100. 읽기 및 쓰기 성능이 각각 100,000 IOPS(Input\n/Output Operations Per Second)인 8개의 동일한\n하드디스크로 RAID 10을 구성할 때 RAID 10의 읽\n기 성능과 쓰기 성능으로 가장 적절한 것은?\n① 읽기: 400,000 IOPS, 쓰기: 400,000 IOPS\n② 읽기: 400,000 IOPS, 쓰기: 800,000 IOPS\n③ 읽기: 800,000 IOPS, 쓰기: 400,000 IOPS\n④ 읽기: 800,000 IOPS, 쓰기: 800,000 IOPS\n20 -\n\n=== NEW PAGE ===\n\n보 안",
  "2023_76": "76. 가상 메모리를 관리하기 위한 페이지 교체 알고\n리즘으로 가장 오랫동안 사용하지 않은 페이지를\n교체하는 알고리즘으로 가장 적절한 것은?\n① FIFO ② LRU\n③ Round-Robin ④ SPN",
  "2023_77": "77. 다음 중 TCP와 UDP 프로토콜의 헤더 정보에 공통\n적으로 존재하는 필드로 가장 적절한 것은?\n① 체크섬(Checksum)\n② 순서 번호(Sequence number)\n③ 긴급 포인터(Urgent pointer)\n④ ACK 번호(Acknowledgment number)",
  "2023_78": "78. 디지털 창작물이 생성된 일시, 크기, 창작자 서\n명, 소유권과 판매 이력 등의 데이터를 분산 저\n장하는 것으로서 마치 등기부등본처럼 원본의 소\n유권이 이전되었을 때에도 투명하게 보증하는 것\n으로 가장 적절한 것은?\n① NFT ② 블록체인\n③ 암호화폐 ④ 메타버스",
  "2023_79": "79. 다음 설명하는 RAID(Redundant Array of Independent\nDisk) 유형으로 가장 적절한 것은?\n데이터를 블록 단위로 분산하고 패리티도 분산하여\n통합 저장한 하드디스크로 구성된 RAID로 블록 인터\n리브된 분산 패리티(block-interleaved striping\nwith distributed parity)방식이라고 한다. 패리티\n도 모든 하드디스크에 분산하여 저장하기 때문에 패\n리티 디스크의 병목 현상을 없앨 수 있다.\n① RAID 2 ② RAID 3\n③ RAID 4 ④ RAID 5",
  "2023_80": "80. HTTP 메소드 중 메시지 몸체(body)를 통해 신규\n데이터 등록에 필요한 요청 자료를 서버에 전달\n하는 것으로 가장 적절한 것은?\n① GET ② POST\n③ DELETE ④ HEAD\n- 16",
  "2023_81": "81. 32-bit로 구성된 임의의 16진수 Ox12345678을 메\n모리 0번지부터 Little-Endian 방식으로 저장한\n16진수 값으로 가장 적절한 것은?\n① 0번지:12, 1번지:34, 2번지:56, 3번지:78\n② 0번지:21, 1번지:43, 2번지:65, 3번지:87\n③ 0번지:78, 1번지:56, 2번지:34, 3번지:12\n④ 0번지:87, 1번지:65, 2번지:43, 3번지:21",
  "2023_82": "82. C 프로그램 코드 char C =‘9’; 와 같이 8-bit 문자\n변수 C에‘9’를 할당하였을 때, 문자변수 C의 메모리\n값을 16진법으로 표시한 것으로 가장 적절한 것은?\n(단, ASCII Code 표에서 문자 ‘0’은 0011 0000 임)\n① 0x09 ② 0x19\n③ 0x29 ④ 0x39",
  "2023_83": "83. 다음 중 유닉스 운영체제의 파일 관리에 대해 적\n절하게 설명한 것을 모두 고른 것은?\n가. 파이프 파일은 프로세스간 선입선출 방식으\n로 데이터를 전달하기 위해 사용한다.\n나. 단말기나 프린터와 같은 장치들은 특수파일\n로 관리한다.\n다. 파일은 inode를 통해 운영체제가 관리한다.\n라. inode는 파일 소유자의 이름을 포함한다.\n① 가, 나, 다 ② 가, 나, 라\n③ 가, 다, 라 ④ 나, 다, 라",
  "2023_84": "84. 다음 중 네트워크 계층의 주소를 링크 계층의 주\n소로 변환하는 기능을 제공하는 프로토콜로 가장\n적절한 것은?\n① ARP ② RARP\n③ ICMP ④ IGMP",
  "2023_85": "85. 다음은 에러 검출을 위해 사용하는 CRC(Cyclic\nRedundancy Check)의 생성다항식이다. 생성다항\n식에 대응하는 비트열로 가장 적절한 것은?\n생성다항식 : x16 + x12 + x5 + 1\n① 1000 1000 0001 0001\n② 0111 0111 1110 1110\n③ 1 0001 0000 0010 0001\n④ 0 1110 1111 1101 1110\n6 -\n\n=== NEW PAGE ===",
  "2023_86": "86. ‘정보시스템 하드웨어 규모산정 지침(TTAK.KO-10.\n0292/R2, 2018.12.19.)’에서 WEB/WAS의 산정항목\n및 적용값에 대한 설명으로 가장 적절한 것은?\n① 기본 OPS보정은 실험 환경에서 측정한 OPS 수치\n를 복잡한 실제 환경에 맞게 적용하기 위한 보\n정으로 고정값 6을 적용한다.\n② 인터페이스 부하보정은 서버가 타 서버와 통신\n하게 될 때 인터페이스에서 발생하는 부하를 고\n려한 보정으로 적용범위는 2.0 ~ 2.3이다.\n③ 클러스터 보정은 클러스터 환경에서 장애 발생\n시를 대비한 보정으로 2-NODE의 경우 1.3을 적\n용한다.\n④ 업무용도 보정은 적용 대상 시스템 유형에 따른 보\n정으로 WEB은 0.7을 그리고 WAS는 2를 적용한다.",
  "2023_87": "87. 다음 중 이더넷과 같은 링크계층 프로토콜에서\n사용하는 MAC(Media Access Control) 주소 유형\n으로 가장 적절하지 않은 것은?\n① 유니캐스트(Unicast) 주소\n② 애니캐스트(Anycast) 주소\n③ 멀티캐스트(Multicast) 주소\n④ 브로드캐스트(Broadcast) 주소",
  "2023_88": "88. 다음 설명하는 소켓함수로 가장 적절한 것은?\n상대 프로세스가 전송한 데이터를 소켓을 통해서\n읽을 수 있으며, 연결성 서비스에 사용한다.\n① connect( ) ② listen( )\n③ recv( ) ④ sendto( )",
  "2023_89": "89. 다음 중 BGP4(Border Gateway Protocol Version 4)\n에 대한 설명으로 가장 적절하지 않은 것은?\n① 자신의 BGP 정보를 상대방에게 알려주기 위해서\nNotification 메시지를 사용한다.\n② BGP 이웃(neighbor)들과의 정보 교환은 TCP를\n이용하며, 포트 번호는 179번이다.\n③ AS(Autonomous System) 간에 경로 설정 정보를\n교환하기 위한 외부 게이트웨이 프로토콜이다.\n④ eBGP(external BGP)는 서로 다른 AS 간에 사용\n되며, iBGP(internal BGP)는 동일 AS 안에서 사\n용된다.\n- 17",
  "2023_90": "90. 다음 설명하는 프로토콜로 가장 적절한 것은?\n멀티캐스트 라우터는 멀티캐스트 패킷을 호스트로\n전달해야 하는데, 이 프로토콜은 멀티캐스트 가입\n상태에 대한 정보를 줄 수 있다. 멀티캐스트 가입\n에 관한 내용을 확인하거나 응답하는 메시지를 갖\n고 있으며, IP 패킷으로 캡슐화되어 전송된다.\n① CBT(Core-Based Tree)\n② PIM(Protocol Independent Multicast)\n③ IGMP(Internet Group Management Protocol)\n④ DVMRP(Distance Vector Multicast Routing Protocol)",
  "2023_91": "91. 다음 중 PPP(Point-to-Point Protocol)와 관련된 프\n로토콜에 대한 설명으로 가장 적절하지 않은 것은?\n① LCP(Link Control Protocol)는 링크를 설정하고\n구성하며 해제하기 위해 사용된다.\n② NCP(Network Control Protocol)들은 네트워크 계\n층 프로토콜을 설정하고 구성하기 위해 사용된다.\n③ IPCP(Internet Protocol Control Protocol)는\n인터넷 프로토콜을 설정하고 구성하기 위한\nNCP(Network Control Protocol)이다.\n④ CHAP(Challenge Handshake Authentication Protocol)\n은 인증을 위해 사용하는 프로토콜로서 클라이\n언트가 인증요청 패킷에서 사용자 이름과 비밀\n번호를 보낸다.",
  "2023_92": "92. 다음과 같은 IP주소와 마스크가 주어진 경우, 네\n트워크 주소로 가장 적절한 것은?\n206.17.38.36/28\n① 206.17.38.32 ② 206.17.38.34\n③ 206.17.38.36 ④ 206.17.38.38",
  "2023_93": "93. kNN(k-Nearest Neighbor)알고리즘의 특징에 대한\n설명으로 가장 적절하지 않은 것은?\n① 기계학습 알고리즘 중 비교적 간단하고 이해하\n기 쉬운 형태의 분류 알고리즘이다.\n② 새로운 데이터를 가까운 이웃 클래스에 할당한다.\n③ 가까운 이웃을 찾기 위해 많은 계산시간이 필요\n하다.\n④ 학습 시 교사가 존재하지 않는 비지도학습에 속한다.\n7 -\n\n=== NEW PAGE ===",
  "2023_94": "94. 다음 중 신경망 기반의 기계학습 알고리즘으로 가\n장 적절하지 않은 것은?\n① SVM(Support Vector Machine)\n② GAN(Generative Adversarial Network)\n③ DBN(Deep Belief Network)\n④ VAE(Variational Auto Encoder)",
  "2023_95": "95. 다음 중 컨테이너를 사용한 가상화에 대해 적절\n하게 설명한 것을 모두 고른 것은?\n가. 컨테이너를 사용한 가상화의 경우 하이퍼바이저\n를 사용하여 높은 입출력 성능을 보인다.\n나. 컨테이너를 사용한 가상화의 경우 프로세스 수\n준에서 가상화가 구현된다.\n다. 컨테이너를 사용한 가상화의 경우 가상머신을 사\n용하는 가상화 보다 자원 사용을 절감할 수 있다.\n라. 컨테이너를 사용한 가상화의 경우 응용을 위한\n별도의 분리된 환경을 제공하므로 가상머신\n보다 높은 보안성을 갖는다.\n① 가, 나 ② 가, 라\n③ 나, 다 ④ 다, 라",
  "2023_96": "96. 다음 중 가상화에 대한 설명으로 가장 적절한 것은?\n① 전가상화는 게스트 운영체제에서 물리적인 컴퓨\n터 자원인 하드웨어에 대한 직접적인 접근 기능\n을 제공한다.\n② 전가상화는 하드웨어와 게스트 운영체제 중간에\n하이퍼바이저가 위치하므로 커널 코드 변경이\n필요하다.\n③ 반가상화는 게스트 운영체제의 커널을 수정하여야\n하는 단점이 있으며 젠서버가 대표적인 예이다.\n④ 전가상화는 반가상화보다 성능이 우수하다.",
  "2023_97": "97. 다음 중 신경망 학습을 위한 활성함수로 가장 적\n절한 것은?\n① RMSProp\n② ReLU\n③ SGD(Stochastic Gradient Descent)\n④ Adam(Adaptive Moment Estimation)\n- 18",
  "2023_98": "98. 다음 괄호 안에 들어갈 용어를 순서대로 나열한 것\n으로 가장 적절한 것은?\n( ㄱ )는 자연어 문장 생성에 특화된 모델로, 트랜\n스포머의 디코더 부분만 따로 떼어서 학습 모형으\n로 사용했다. 반면, ( ㄴ )는 트랜스포머의 인코드\n부분을 떼어서 사용했다. 따라서, ( ㄱ )가 단방향\n혹은 순방향으로의 셀프 어텐션만을 사용하는 것에\n반해, ( ㄴ )는 양방향 셀프 어텐션을 모두 활용할\n수 있다.\n( ㄱ ) ( ㄴ )\n① BERT GPT\n② GPT CBOW\n③ CBOW BERT\n④ GPT BERT",
  "2023_99": "99. 대규모 신경망을 학습시키는 데는 매우 많은 시\n간이 걸리며 데이터도 대량으로 필요하므로, 이\n런 경우 대량의 데이터로 미리 학습되어 공개된\n모델을 이용하는 것이 효과적이다. 학습된 모델\n을 이용하여 새로운 모델을 학습시키는 것으로\n가장 적절한 것은?\n① 사전 학습 ② 전이 학습\n③ 지도 학습 ④ 강화 학습",
  "2023_100": "100. 다음 중 TCP/IP 모델의 트랜스포트 계층 프로토\n콜에서 사용하는 포트 번호(Port Number)에 대\n한 설명으로 가장 적절한 것은?\n① 소스 포트 번호는 일반적으로 32비트를 사용한다.\n② 포트 번호는 프로세스 간의 전달(process-to-\nprocess delivery)을 위해서 사용된다.\n③ TCP에서 사용하는 포트 번호와 UDP에서 사용하\n는 포트 번호는 중복될 수 없다.\n④ 소스 포트 번호는 클라이언트 프로그램에서 주\n로 사용하는 Well-known 포트 번호와 서버 프로\n그램에서 주로 사용하는 동적 포트 번호 등이\n있다.\n8 -\n\n=== NEW PAGE ===\n\n보 안",
  "2024_76": "76. 「디지털서비스 제공역량(디지털서비스 심사∙선정\n등에 관한 고시(과학기술정보통신부고시 제2023-43\n호))」에서 제공하는 서비스제공자의 가용률 보장\n정책으로 가장 적절한 것은?\n① PaaS : 99.9% 이상\n② IaaS : 99.5% 이상\n③ SaaS : 99.9% 이상\n④ 그 외 서비스 : 99.9% 이상",
  "2024_77": "77. 디지털논리회로 중에서 다수의 입력 단자 중에서\n조건에 맞는 하나를 선택하여 단일 출력 단자로\n연결하는 조합회로로 가장 적절한 것은?\n① 인코더 ② 디코더\n③ 멀티플렉서 ④ 디멀티플렉서",
  "2024_78": "78. 다음 중 리눅스의 파일 종류로 가장 적절하지 않은\n것은?\n① FIFO 파일 ② 가상 파일\n③ 일반 파일 ④ 디렉토리 파일",
  "2024_79": "79. 다음 그림은 전가산기(full adder) 4개를 사용한 4비\n트 가산기를 나타낸 것이다. 2의 보수로 표현된 수\n들 간의 덧셈에서 상태 비트 제어 회로의 오버플로\n우 플래그(V) 논리식으로 가장 적절한 것은?\n①  ② ⋅\n   \n③    ④ ⊕\n   \n- 16",
  "2024_80": "80. 시스템 업타임은 시스템이 액세스 가능한 상태인\n시간이다. 액세스 가능하지 않은 시간은 시스템\n다운타임이다. 어떤 서비스가 “5개의 9 가용성”\n이라고 하면 1년에 99.999% 시간 동안 사용 가능\n함을 의미한다. “5개의 9 가용성”일 때 1년당\n다운 타임으로 가장 적절한 것은?\n① 31.5초 ② 5.25분\n③ 52.5분 ④ 8시간 45분",
  "2024_81": "81. SSD의 구성요소인 플래시 메모리는 블록 단위의\n삭제만 가능하기 때문에 쓰레기 수집(garbage\ncollection) 과정이 요구된다. 이 과정의 효율성을\n증대시키기 위해 운영체제 차원에서 지원하는 기\n능으로 가장 적절한 것은?\n① TRIM ② 미러링\n③ 마모 평준화 ④ 캐시 교체 정책",
  "2024_82": "82. 큰 데이터 블록을 전송하는 경우에는 CPU가 그\n동작들을 수행하는데 많은 시간을 소모해야 하\n고, 시스템 버스도 대부분의 시간 동안 그러한\nI/O 동작들을 위해 사용될 수 밖에 없다. 이 문제\n점을 해결하기 위해, CPU의 개입 없이 I/O 장치\n와 기억장치 간에 데이터 전송을 수행하도록 지\n원하는 메커니즘으로 가장 적절한 것은?\n① DMA ② Daisy-chain\n③ Software polling ④ Memory-mapped I/O",
  "2024_83": "83. RAID(Redundant Array of Independant Disk)의 특성에\n대한 설명으로 가장 적절하지 않은 것은?\n① RAID-0은 성능을 추구하고 RAID-1은 안정성을\n추구한 방식이다.\n② RAID-2와 RAID-3은 성능향상을 위해 실제 데이\n터를 저장하는 디스크를 RAID-0으로 구성한 방\n식이다.\n③ RAID-3은 데이터 복구를 위해 해밍코드를 사용하고,\nRAID-4는 패리티 코드를 이용한다.\n④ RAID-5와 RAID-6은 데이터 복구를 위해 다른 디\n스크에 패리티 정보를 함께 저장해 안정성을 높\n인 방식이다.\n6 -\n\n=== NEW PAGE ===",
  "2024_84": "84. 다음 중 광역 통신망의 데이터 송수신(교환) 방법\n중에서 회선 교환(Circuit Switching)에 대한 설명\n으로 옳은 것은?\n① 축적 전송 방식(Store-and-Forward)이라고도 한다.\n② 데이터를 전송하지 않는 유휴 시간에도 회선을\n점유하므로 비효율적이다.\n③ 전송할 메시지를 패킷 단위로 나누어 우선순위\n가 높은 패킷을 먼저 전송할 수 있다.\n④ 실시간 통신이나 대화형 통신보다는 지연이 상\n대적으로 중요하지 않은 이메일·파일 전송 등\n에 적합하다.",
  "2024_85": "85. 다음 중 데이터 통신에서 사용하는 에러검출 방식\n으로 가장 적절하지 않은 것은?\n① 블록합검사(Block Sum Check)\n② 패리티검사(Parity Check)\n③ 순환중복검사(Cyclic Redundancy Check)\n④ 허프만코딩검사(Huffman Coding Check)",
  "2024_86": "86. 다음에서 설명하는 라우팅 기법으로 가장 적절한 것은?\nŸ 패킷을 전송하는 호스트가 목적지 호스트까지\n전달경로를 스스로 결정하는 방식\nŸ 이 방식을 지원하려면 송신 호스트의 라우팅\n테이블에서 패킷을 수신 호스트까지 전달하기\n위한 정보경로를 관리하여야 하며, 경로 정보를\n패킷에 기록해야 함\n① 계층라우팅(Hierarchical Routing)\n② 분산라우팅(Distributed Routing)\n③ 소스라우팅(Source Routing)\n④ 중앙라우팅(Centralized Routing)",
  "2024_87": "87. 다음 보기의 IP주소를 가진 노드가 속하는 LAN에서\n디폴트 게이트웨이 IP주소로 가장 적절한 것은? (단,\n디폴트 게이트웨이의 IP주소에서 호스트 아이디 부\n분은 1로 가정한다.)\n182.75.187.69/27\n① 182.75.187.1\n② 182.75.187.5\n③ 182.75.187.65\n④ 182.75.187.255\n- 17",
  "2024_88": "88. 다음 중 IP에 대한 설명으로 가장 적절한 것은?\n① IPv4 헤더는 옵션이 없을 경우 20바이트이다.\n② IPv6 헤더의 크기는 40바이트이며 IPv4와 마찬\n가지로 옵션을 가진다.\n③ IPv6 헤더에도 IPv4에서 패킷 단편화에 필요했던\nID Number, Don’t Fragment, More Fragment\n필드가 존재한다.\n④ IPv4 패킷 단편화와 관련된 3가지 필드 중 분할\n된 패킷이 여러 개 있는 경우, 같은 원본 패킷\n에 속한 것인지를 확인할 수 있는 것은 More\nFragment이다.",
  "2024_89": "89. NAT(Network Address Translation)와 사설 IP주소에\n대한 설명으로 옳지 않은 것은?\n① 13.234.23.87은 사설 IP주소로 활용할 수 있다.\n② 사설 IP주소와 공인 IP주소를 1대1로 고정적으\n로 매핑하는 것을 Static NAT라고 한다.\n③ 내부 네트워크(LAN)에서 사용하는 사설 IP주소\n와 외부 인터넷에서 사용하는 공인 IP주소를 변\n환하는 것을 의미한다.\n④ IP주소뿐만 아니라 포트 번호를 사용하는 NAPT\n(Network Address Port Translation) 또는 PAT(Port\nAddress Translation) 방법이 있다.",
  "2024_90": "90. 다음에 해당하는 장비로 가장 적합한 것은?\n하나의 LAN 내부에 속하는 여러 단말노드를 연결\n하기 위한 장비로서, 이더넷(Ethernet) 방식의 네\n트워크에서는 충돌 도메인(Collision Domain)을 나\n누는 역할을 수행할 수 있다.\n① 모뎀(MODEM) ② 리피터(Repeater)\n③ L2 스위치(L2 Switch) ④ USB 허브(USB Hub)",
  "2024_91": "91. FSK(Frequency Shift Keying)에 대한 설명으로 가\n장 적절한 것은?\n① 주파수와 위상이 일정하게 유지된다.\n② 최대진폭과 위상이 일정하게 유지된다.\n③ 최대진폭과 주파수가 일정하게 유지된다.\n④ ASK(Amplitude Shift Keying)에 비해 잡음과 간섭\n에 매우 민감하다.\n7 -\n\n=== NEW PAGE ===",
  "2024_92": "92. 다음 중 RIP(Routing Information Protocol)에 대한\n설명으로 옳지 않은 것은?\n① 정적(Static) 라우팅 프로토콜이다.\n② 일반적으로 도착 가능한 최대 홉 카운트는 15이다.\n③ 거리 벡터(Distance Vector) 알고리즘을 기반으\n로 한다.\n④ RIP를 사용하는 라우터에서는 일반적으로 일정\n주기로 라우팅 테이블을 업데이트한다.",
  "2024_93": "93. 다음 중 GPU 컴퓨팅에 대한 설명으로 가장 적합\n하지 않은 것은?\n① GPU는 자체 지역메모리를 사용한다.\n② GPU는 고도의 하드웨어 멀티스레딩(multi-threading)\n을 사용한다.\n③ GPU를 사용하기 위해 CUDA와 같은 플랫폼을\n사용할 수 있다.\n④ GPU는 메모리 지연시간을 극복하기 위해 중앙처\n리장치를 사용한다.",
  "2024_94": "94. 다음 중 트랜스포머 모델에 대한 설명으로 가장\n적절한 것은?\n가. 멀티 헤드 어텐션 기법을 사용할 수 있다.\n나. 대표적인 트랜스포머 모델에는 RNN이 있다.\n다. 인코더는 생성문장을 출력한다.\n라. 인코더와 디코더로 구성된 모델이다.\n① 가, 나 ② 나, 다\n③ 가, 라 ④ 다, 라",
  "2024_95": "95. BERT(Bidirectional Encoder Representation from\nTransformer)에 대한 설명으로 가장 적절하지 않은\n것은?\n① 위치 임베딩을 사용한다.\n② 인코더와 디코더를 갖는다.\n③ 트랜스포머 모델을 기반으로 한다.\n④ 자연어 처리를 위한 딥러닝 아키텍처 중 하나이다.",
  "2024_96": "96. 다음 중 신경망 기반의 기계학습알고리즘으로 가장\n적절하지 않은 것은?\n① DBN(Deep Belief Network)\n② SVM(Support Vector Machine)\n③ VAE(Variational Auto Encoder)\n④ GAN(Generative Adversarial Network)\n- 18",
  "2024_97": "97. 다음 중 UDP 기반의 응용계층 프로토콜에 가장\n적합한 것은?\n① telnet\n② IMAP(Internet Message Access Protocol)\n③ SMTP(Simple Mail Transfer Protocol)\n④ SNMP(Simple Network Management Protocol)",
