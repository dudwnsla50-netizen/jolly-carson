<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로젝트 관리 공식 범위별 기출 뷰어</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080b13;
            --card-bg: rgba(17, 24, 39, 0.75);
            --border-color: rgba(255, 255, 255, 0.06);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent-violet: #8b5cf6;
            --accent-blue: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%);
            --accent-glow: rgba(139, 92, 246, 0.12);
            --success: #10b981;
            --card-hover-border: rgba(139, 92, 246, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 2.5rem 1.5rem;
            min-height: 100vh;
            background-image: 
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.06) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.06) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.6rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.6rem;
            letter-spacing: -0.03em;
        }

        header p.subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
        }

        .meta-badges {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .badge {
            background: var(--border-color);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 0.35rem 0.9rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 500;
            backdrop-filter: blur(8px);
        }

        .badge.accent {
            background: rgba(139, 92, 246, 0.12);
            border-color: rgba(139, 92, 246, 0.25);
            color: #c084fc;
        }

        /* Category Filter Badges */
        .filter-section {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.45rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .filter-btn:hover, .filter-btn.active {
            border-color: var(--accent-violet);
            color: #ffffff;
            background: rgba(139, 92, 246, 0.08);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* Main Accordion List */
        .accordion-list {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-bottom: 4rem;
        }

        .accordion-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .accordion-item:hover {
            border-color: var(--card-hover-border);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .accordion-trigger {
            width: 100%;
            background: none;
            border: none;
            color: inherit;
            padding: 1.6rem 1.8rem;
            text-align: left;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .card-title-group {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .rank-badge {
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .concept-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        .category-tag {
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            padding: 0.15rem 0.45rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .freq-count-badge {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.15);
            color: var(--success);
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .card-meta-grid {
            display: grid;
            grid-template-columns: 90px 1fr;
            row-gap: 0.5rem;
            column-gap: 0.8rem;
            width: 100%;
            font-size: 0.88rem;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 0.8rem;
            margin-top: 0.2rem;
        }

        .meta-label {
            color: var(--text-muted);
            font-weight: 600;
        }

        .meta-value {
            color: var(--text-secondary);
            word-break: keep-all;
        }

        .meta-value.accent {
            color: #c8a2c8;
        }

        .accordion-trigger .arrow {
            transition: transform 0.3s ease;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .accordion-item.active .accordion-trigger .arrow {
            transform: rotate(180deg);
            color: var(--accent-violet);
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            background: rgba(0, 0, 0, 0.18);
        }

        .accordion-inner {
            padding: 1.6rem 1.8rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .section-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 0.3rem;
            margin-top: 0.2rem;
        }

        .year-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .year-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.35rem 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .year-btn:hover {
            background: var(--accent-gradient);
            border-color: transparent;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.25);
            transform: translateY(-1px);
        }

        .year-btn.active-btn {
            background: var(--accent-gradient);
            border-color: transparent;
            box-shadow: 0 4px 10px rgba(139, 92, 246, 0.3);
            color: #ffffff;
        }

        .year-btn .num-label {
            opacity: 0.7;
            font-size: 0.7rem;
        }

        .inline-question-viewer {
            background: #090d16;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            transition: all 0.3s ease;
        }

        .viewer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 0.5rem;
        }

        .viewer-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #60a5fa;
            font-family: 'Outfit', sans-serif;
        }

        .viewer-close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: color 0.2s;
        }

        .viewer-close-btn:hover {
            color: #ef4444;
        }

        .viewer-body {
            font-size: 0.92rem;
            line-height: 1.7;
            color: #d1d5db;
            white-space: pre-wrap;
            overflow-y: auto;
            max-height: 400px;
            padding-right: 0.5rem;
        }

        /* 스크롤바 디자인 */
        .viewer-body::-webkit-scrollbar {
            width: 6px;
        }
        .viewer-body::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.01);
        }
        .viewer-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
        .viewer-body::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        a.badge {
            transition: all 0.2s ease;
        }
        a.badge:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            color: var(--text-primary) !important;
        }

        /* [검출 토픽 팝업 모달 스타일] */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 11, 19, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-card {
            background: rgba(17, 24, 39, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            max-height: 80%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(139, 92, 246, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform: scale(0.9);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-overlay.show .modal-card {
            transform: scale(1);
        }
        .modal-card-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-card-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
        }
        .modal-close-x {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.4rem;
            cursor: pointer;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close-x:hover {
            color: #ffffff;
        }
        .modal-card-body {
            padding: 1rem 1.5rem 1.5rem 1.5rem;
            overflow-y: auto;
        }
        .modal-topic-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .modal-topic-item {
            padding: 0.8rem 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            transition: all 0.2s ease;
            border-radius: 8px;
        }
        .modal-topic-item:hover {
            background: rgba(139, 92, 246, 0.08);
            transform: translateX(4px);
        }
        .modal-topic-name {
            font-size: 0.92rem;
            font-weight: 500;
            color: var(--text-primary);
        }
        .modal-topic-count {
            background: rgba(139, 92, 246, 0.15);
            color: #c084fc;
            border: 1px solid rgba(139, 92, 246, 0.2);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 50px;
            white-space: nowrap;
        }
        span.badge[onclick]:hover {
            background: rgba(255, 255, 255, 0.08) !important;
            border-color: rgba(255, 255, 255, 0.15) !important;
            color: var(--text-primary) !important;
        }

        /* 반응형 모바일 최적화 */
        @media (max-width: 768px) {
            body { padding: 1.5rem 0.8rem; }
            header h1 { font-size: 1.8rem; line-height: 1.3; }
            header p.subtitle { font-size: 0.88rem; padding: 0 0.5rem; word-break: keep-all; }
            .meta-badges { gap: 0.5rem; }
            .badge { padding: 0.25rem 0.6rem; font-size: 0.72rem; }
            .filter-section { gap: 0.4rem; margin-bottom: 1.5rem; }
            .filter-btn { padding: 0.35rem 0.7rem; font-size: 0.78rem; }
            .accordion-trigger { padding: 1.2rem 1rem; gap: 0.6rem; }
            .concept-title { font-size: 1.05rem; }
            .rank-badge { font-size: 1rem; }
            .category-tag, .freq-count-badge { font-size: 0.7rem; padding: 0.1rem 0.35rem; }
            .card-meta-grid { grid-template-columns: 80px 1fr; font-size: 0.82rem; row-gap: 0.4rem; }
            .accordion-inner { padding: 1.2rem 1rem; gap: 1rem; }
            .section-title { font-size: 0.75rem; }
            .year-btn { padding: 0.3rem 0.6rem; font-size: 0.75rem; }
            .inline-question-viewer { padding: 0.9rem; }
            .viewer-body { font-size: 0.85rem; max-height: 300px; }
            .modal-card { width: 95%; max-height: 90%; }
            .modal-card-header { padding: 1rem; }
            .modal-card-title { font-size: 1.05rem; }
            .modal-card-body { padding: 0.8rem 1rem 1.2rem 1rem; }
            .modal-topic-item { padding: 0.6rem 0.8rem; }
            .modal-topic-name { font-size: 0.85rem; }
        }
    
        /* [설계 의도] 시안A: 모드 토글 스위치 및 최적화된 내비게이션 스타일 */
        .navigation-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
            margin-bottom: 2rem;
            width: 100%;
        }
        .mode-switch-wrapper {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(255, 255, 255, 0.02);
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
        }
        .mode-label {
            font-size: 0.88rem;
            font-weight: 600;
            transition: color 0.25s ease;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.08);
            transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px; width: 18px;
            left: 3px; bottom: 3px;
            background-color: #ffffff;
            transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        input:checked + .slider {
            background: var(--accent-gradient);
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.2);
        }
        input:checked + .slider:before {
            transform: translateX(22px);
        }
        .slider.round { border-radius: 34px; }
        .slider.round:before { border-radius: 50%; }
        
        .badge.accent {
            background: rgba(139, 92, 246, 0.12) !important;
            border-color: rgba(139, 92, 246, 0.25) !important;
            color: #ffffff !important;
        }

    </style>
</head>
<body>



<div class="container">
    <header>
        <h1>프로젝트 관리 공식 범위별 기출 대시보드</h1>
        <p class="subtitle">공식 시험 가이드라인(PM.txt) 4대 단원 및 11개 중단원 매핑 기출 뷰어</p>
        
                <div class="navigation-container">
            <div class="mode-switch-wrapper">
                <span class="mode-label" id="label-freq">🔥 빈출 개념순</span>
                <label class="switch">
                    <input type="checkbox" id="dashboard-mode-toggle" onchange="toggleDashboardMode(this)">
                    <span class="slider round"></span>
                </label>
                <span class="mode-label" id="label-official">📋 공식 범위순</span>
            </div>
            
            <div class="meta-badges" id="dynamic-nav-badges">
                <a href="#" class="badge home-badge" onclick="goToHome(event)" style="text-decoration: none; background: var(--accent-gradient); color: #ffffff; border: none; font-weight: 700;">🏠 퀴즈 홈으로</a>
                <a href="se_frequent_concepts.html" class="badge subject-badge" data-freq="se_frequent_concepts.html" data-official="se_official_scopes.html" style="text-decoration: none;">소프트웨어공학</a>
                <a href="pm_frequent_concepts.html" class="badge subject-badge" data-freq="pm_frequent_concepts.html" data-official="pm_official_scopes.html" style="text-decoration: none;">프로젝트 관리</a>
                <a href="db_frequent_concepts.html" class="badge subject-badge" data-freq="db_frequent_concepts.html" data-official="db_official_scopes.html" style="text-decoration: none;">데이터베이스</a>
                <a href="sa_frequent_concepts.html" class="badge subject-badge" data-freq="sa_frequent_concepts.html" data-official="sa_official_scopes.html" style="text-decoration: none;">시스템 아키텍처</a>
                <a href="sc_frequent_concepts.html" class="badge subject-badge" data-freq="sc_frequent_concepts.html" data-official="sc_official_scopes.html" style="text-decoration: none;">보안</a>
            </div>
        </div>
        
        <div class="meta-badges">
            <span class="badge">기출 범위: 2015년 ~ 2026년</span>
            <span class="badge accent">총 분석 데이터: 300 문항</span>
            <span class="badge" onclick="openTopicListModal()" style="cursor: pointer; transition: all 0.2s;" title="클릭 시 중단원 목록 팝업 열기">
                매핑된 공식 중단원: <span id="topic-count-badge">0</span>개
            </span>
            </div>
    </header>

    <div id="accordion-container" class="accordion-list"></div>


    
<script>

    // [설계 의도] 로컬 오프라인 실행(file:///)과 웹 서버 호스팅(http://) 환경 양쪽 모두에서 퀴즈 대시보드 홈으로 매끄럽게 이동하도록 분기 처리합니다.
    function goToHome(event) {
        event.preventDefault();
        if (window.location.protocol === 'file:') {
            window.location.href = '../index.html';
        } else {
            window.location.href = '/';
        }
    }

    // [설계 의도] 학습 모드 변경에 따라 과목 뱃지의 링크 목적지를 실시간 동적 갱신하고 즉시 이동 처리합니다.
    function toggleDashboardMode(toggleEl) {
        const isOfficial = toggleEl.checked;
        
        // 라벨 색상 하이라이트 전환
        document.getElementById('label-freq').style.color = isOfficial ? 'var(--text-secondary)' : '#ffffff';
        document.getElementById('label-official').style.color = isOfficial ? '#ffffff' : 'var(--text-secondary)';
        
        // 과목별 이동 경로 실시간 매핑
        const badges = document.querySelectorAll('.subject-badge');
        const isLocal = window.location.protocol === 'file:';
        
        badges.forEach(badge => {
            const target = isOfficial ? badge.getAttribute('data-official') : badge.getAttribute('data-freq');
            if (isLocal) {
                badge.href = target;
            } else {
                badge.href = '/reports/' + target;
            }
        });

        // 사용자의 현재 보고 있는 과목에 매칭되는 대시보드로 즉각 리다이렉트
        const currentPath = window.location.pathname;
        let targetRedirect = "";
        badges.forEach(badge => {
            const freqPath = badge.getAttribute('data-freq');
            const officialPath = badge.getAttribute('data-official');
            if (currentPath.includes(freqPath) && isOfficial) {
                targetRedirect = officialPath;
            } else if (currentPath.includes(officialPath) && !isOfficial) {
                targetRedirect = freqPath;
            }
        });

        if (targetRedirect) {
            if (isLocal) {
                window.location.href = targetRedirect;
            } else {
                window.location.href = '/reports/' + targetRedirect;
            }
        }
    }

    // [설계 의도] 페이지 로드 시 현재 페이지 파일명에 매핑되는 모드 스위치 상태 및 배지 컬러를 활성화합니다.
    function initDashboardNav() {
        const toggle = document.getElementById('dashboard-mode-toggle');
        const currentPath = window.location.pathname;
        const isOfficialPage = currentPath.includes('official_scopes');
        
        if (toggle) {
            toggle.checked = isOfficialPage;
            // 라벨 색상 하이라이트 초기화
            document.getElementById('label-freq').style.color = isOfficialPage ? 'var(--text-secondary)' : '#ffffff';
            document.getElementById('label-official').style.color = isOfficialPage ? '#ffffff' : 'var(--text-secondary)';
        }

        const badges = document.querySelectorAll('.subject-badge');
        const isLocal = window.location.protocol === 'file:';
        
        badges.forEach(badge => {
            const target = isOfficialPage ? badge.getAttribute('data-official') : badge.getAttribute('data-freq');
            if (isLocal) {
                badge.href = target;
            } else {
                badge.href = '/reports/' + target;
            }

            // 활성화 배지 하이라이트 (현재 페이지 파일명이 target을 포함하는 경우)
            if (currentPath.includes(target)) {
                badge.classList.add('accent');
                badge.style.color = '#ffffff';
                badge.style.background = 'rgba(139, 92, 246, 0.12)';
                badge.style.borderColor = 'rgba(139, 92, 246, 0.25)';
            } else {
                badge.classList.remove('accent');
            }
        });
    }

    // DOMContentLoaded 시점에 즉시 내비게이션 초기화 적용
    document.addEventListener('DOMContentLoaded', initDashboardNav);

  "2015_10": "10. 과거 자료가 없거나 활동 소요시간을 산출하기\n어려운 신제품 개발과 같은 프로젝트의 활동\n소요시간 산정 시 3점 산정법(three-point\nestimation)방식을 활용한다. 3점 산정법을 활용\n하여 프로젝트 활동 소요시간 예측 시 고려되지\n않는 것은?\n① 낙관시간: 관련 활동을 좋은 조건에서 수행할\n경우 소요되는 예상 시간치\n② 최소시간: 관련활동에 모든 자원을 최대로 투입\n할 경우 소요되는 예상 시간치\n③ 비관시간: 관련활동을 나쁜 환경에서 수행할\n경우 소요되는 예상 시간치\n④ 최빈시간: 관련활동의 소요시간에 가장 근접\n하다고 판단되는 예상 시간치",
  "2015_11": "11. 프로젝트 수행 특징상 방대한 정보 또는 수많은\n수신자간에 정보 공유가 필요하다. 이때 의사소\n통방법 중 가장 적절한 것은?\n① 유인식 의사소통\n② 전달식 의사소통\n③ 대화식 의사소통\n④ 통보식 의사소통",
  "2015_12": "12. 프로젝트를 통합 관리하는 활동 중 프로젝트 성과\n모니터링은 프로젝트 활동을 지속적으로 모니터링\n하여 프로젝트 관리 계획서 및 프로젝트 기준을\n준수하는지를 확인하는 활동이다. 다음 중 프로젝트\n성과 모니터링 대상 중 가장 거리가 먼 것은?\n① 범위기준선\n② 위험기준선\n③ 원가기준선\n④ 일정기준선\n3 -",
  "2015_16": "16. “행정기관 및 공공기관 정보시스템 구축·운영\n지침”의 내용 중 맞는 것을 모두 고른 것은?\n가. 정보화사업 이행에 수년을 요하는 정보\n시스템 유지보수계약에 있어서는 국가\n계약법 및 같은 법 시행령, 지방계약법에\n의하여 장기계속계약을 체결할 수 있다.\n나. 사업대가를 기능점수로 산정한 경우에는\n제안요청서에 투입인력의 수와 기간에\n의한 방식에 관한 요구사항을 명시할\n수 없다.\n다. 계약기간내에 용역을 완성한 후 검사가\n완료된 때에는 인력의 투입도 종료된다.\n라. 행정기관등의 장과 사업자는 단계별 감리\n수행결과보고서에 따라 시정조치를\n수행하여야 한다.\n① 가. 나 ② 가, 나, 라\n③ 나, 다, 라 ④ 가, 나, 다, 라",
  "2015_17": "17. “정보시스템 감리 수행 가이드”에 따른 ‘착수\n/계획’ 감리시점의 ‘사업관리’ 감리영역 점\n검항목으로 가장 거리가 먼 것은?\n① 품질관리체계를 적정하게 수립하여 관리하고\n있는지 여부\n② 일정관리체계를 적정하게 수립하여 관리하고\n있는지 여부\n③ 비용관리체계를 적정하게 수립하여 관리하고\n있는지 여부\n④ 범위관리체계를 적정하게 수립하여 관리하고\n있는지 여부",
  "2015_18": "18. “전자정부서비스 호환성 준수지침”에서 모바일\n전자정부서비스 웹호환성 진단에 있어서 ‘동작\n호환성 확보 여부’를 진단하는 방법으로 가장\n적절한 것은?\n① W3C Markup Validator\n② W3C CSS Validator\n③ 크로스 브라우징 테스트\n④ 플러그인 동작 테스트\n4 -",
  "2015_23": "23. “정보시스템 감리원 윤리 가이드”에서 윤리\n강령의 준수에 지장을 초래할 수 있는 잠재적인\n위협 중 정보시스템 감리원 본인이 재무적 이해\n관계가 있는 경우에 발생하는 위협으로 가장\n적절한 것은?\n① 이기적 위협\n② 자기검토 위협\n③ 유착 위협\n④ 압력 위협",
  "2015_24": "24. “SW사업 대가산정 가이드”에서 소프트웨어 재\n개발비의 변경률 산정에 관한 설명으로 가장 거리가\n먼 것은?\n① 설계 변경률이 높다면 소프트웨어의 재개발\n노력이 증가함을 의미한다.\n② 트랜잭션 설계 변경률은 사용자인터페이스, 업무\n처리로직, 데이터처리로직의 변경 정도에 따라\n산정된다.\n③ 코드 변경률은 설계 변경률보다 작은 값을 갖는다.\n④ 설계 변경률과 코드 변경률이 0%인 경우에도 통합\n및 시험 변경률이 50%인 경우가 있을 수 있다",
  "2015_25": "25. “정보시스템 감리 수행 가이드”의 시정조치 확인\n세부절차를 실행 순서대로 나열할 때 가장 적절한\n것은?\n① 시정조치 결과 확인계획 공유 → 시정조치 결과\n확인 → 미조치/오조치 사항에 대한 개선의견\n제시 → 발주자/사업자 면담 → 상호 검토\n② 시정조치 결과 확인 → 시정조치 결과 확인계획\n공유 → 발주자/사업자 면담 → 상호 검토 →\n미조치/오조치 사항에 대한 개선의견 제시\n③ 시정조치 결과 확인계획 공유 → 발주자/사업자\n면담 → 시정조치 결과 확인 → 상호 검토 →\n미조치/오조치 사항에 대한 개선의견 제시\n④ 시정조치 결과 확인계획 공유 → 시정조치 결과\n확인 → 상호 검토 → 발주자/사업자 면담 →\n미조치/오조치 사항에 대한 개선의견 제시\n5 -",
  "2016_1": "1. 이해당사자의 요구가 있어 프로젝트 진행 중 3곳의\n작업이 추가되었다고 가정할 때, CPI(Cost Perfor-\nmance Index)에는 어떤 영향을 줄 수 있는가?\n① CPI가 상승한다.\n② CPI가 하락한다.\n③ CPI는 변하지 않는다.\n④ 현재 조건으로 판단할 수 없다.",
  "2016_2": "2. 제품 및 서비스를 제공하는 판매자인 “을” 계약자\n에게 원가와 이익 및 손실에 대한 모든 책임과\n위험을 전가하는 계약 방식은?\n① 실비정산 계약\n② 고정가격 계약\n③ 기간 및 재료 계약\n④ 비확정 납기 계약",
  "2016_3": "3. 품질 비용의 종류와 그 예에 관한 설명으로 가장\n적절하지 않은 것은?\n① 평가비용 – 시험기기의 보전 비용\n② 내부실패비용 – 작업중단 비용\n③ 외부실패비용 – 재검사 비용\n④ 예방비용 – 공정설계 비용",
  "2016_4": "4. 갈등해결에 대한 방법 중 상대방의 목표와 자신의\n목표 모두를 중요하게 여기는 갈등해결 방식으로\n가장 적절한 것은?\n① 철수(Withdrawing)\n② 양보(Smoothing)\n③ 타협(Compromising)\n④ 문제해결(Problem Solving)",
  "2016_5": "5. 획득가치분석을 적용할 때 프로젝트 일정이 계획\n보다 지연되고 있지만 실제 비용은 당초 예산보다\n절감되고 있다고 판단하는 경우는?\n① EV = 200, PV = 180, AC = 210\n② EV = 200, PV = 180, AC = 190\n③ EV = 200, PV = 210, AC = 180\n④ EV = 200, PV = 210, AC = 220\n- 2",
  "2016_6": "6. 다음의 활동-마디 프로젝트 네트워크에 관련된\n설명으로 가장 거리가 먼 것은?\n① 주경로의 길이는 19이다.\n② 활동 C가 지연되면 프로젝트 기간이 늘어난다.\n③ 여유시간이 0보다 큰 활동은 없다.\n④ 주경로가 두 개 존재한다.",
  "2016_7": "7. 프로젝트 범위가 결정되어 WBS를 작성하려 한다.\nWBS를 작성하기 위해서 필요한 자료로 가장 거리가\n먼 것은?\n① 조직 프로세스 자산\n② 프로젝트 범위기술서\n③ 기업환경요인\n④ 요구사항 추적 매트릭스",
  "2016_8": "8. 지난 해 A사에서 퇴사한 김과장은 B사에 입사하여\n정보시스템 구축 프로젝트의 팀 리더로 일하고 있다.\n김과장은 B사에서 현재 받고 있는 급여가 A사에서\n자신이 받던 급여에 비해 더 나쁘다고 생각하고\n있다. 공정성 이론의 관점에서 김과장이 사용하고\n있는 비교 기준으로 가장 적절한 것은?\n① 자신 - 내부 ② 자신 - 외부\n③ 타인 - 내부 ④ 타인 - 외부",
  "2016_9": "9. 직무 설계에 관한 설명으로 가장 거리가 먼 것은?\n① 직무 설계는 조직 구성원들이 맡아서 처리해야\n할 일을 구체화하여 할당하는 과정이다.\n② 직무 단순화는 직무를 단순하고 반복적인 일로 구성\n하며, 일을 처리하는 절차를 명확하게 규정한다.\n③ 직무 확대는 직무에 관한 권한을 더 많이 허용\n함으로써 자율성과 책임성을 고취한다.\n④ 직무 순환은 직무 담당자가 일정한 기간을 주기로\n다른 직무를 맡도록 하는 방법이다.\n2 -",
  "2016_10": "10. 프로젝트 조직의 특성을 설명한 것 중 가장 적절\n하지 않은 것은?\n① 조직활동의 초점이 직능상 종적인 상호관계를\n갖는다.\n② 인력 구성상 유연성을 꾀할 수 있다.\n③ 조직의 기동성과 환경 적응력을 높일 수 있다.\n④ PM이 과업 수행에 적합한 능력과 지식을 갖추어\n야만 프로젝트의 원활한 진행이 가능하다.",
  "2016_11": "11. 정보화사업 중 의무 감리 대상이 아닌 것은?\n(단, 사업비는 하드웨어, 소프트웨어의 단순\n구입비를 제외한 금액임)\n① 대국민 서비스를 위한 행정업무 처리용으로\n사용하기 위한 2억원 규모의 시스템 개발 사업\n② 여러 중앙행정기관 등이 공동으로 구축하는 3억원\n규모의 시스템 개발 사업\n③ 사업비가 5억원인 정보시스템 구축 사업\n④ 10억원 규모의 정보화전략계획 수립 사업",
  "2016_12": "12. 모바일 웹 페이지 구축 사업의 총괄감리원으로서\n종료단계 감리의 예비조사를 실시할 경우 시스템\n구조 영역의 감리점검 항목으로 가장 적절하지 않은\n것은? (단, 2단계 감리를 수행하며 설계단계\n감리는 완료한 것으로 가정)\n① 모바일 시스템 도입/설치 및 보안환경의 구축을\n충분하게 수행하였는지 여부\n② 모바일 시스템 구성요소에 대한 검증을 적정하게\n수행하였는지 여부\n③ 모바일 시스템 시험 계획을 적정하게 수립\n하였는지 여부\n④ 모바일 시스템 하드웨어 구성 및 용량산정을\n적정하게 수행하였는지 여부\n- 3",
  "2016_13": "13. 전체 60 MD(Man/Day)를 투입한 감리사업에서\n감리인력 배치가 가장 적절하지 않은 것은? (단,\n시스템 개발 사업으로 2단계감리를 실시하며 상주\n/상시감리를 실시하지 않음)\n① 예비조사를 위하여 설계 및 종료단계 감리 실시\n전에 총 2 MD의 상근감리원을 투입하였다.\n② 설계 및 종료 단계 현장 감리에 총 35MD의 감리원을\n투입하였다. 이중 5MD는 비상근감리원이다.\n③ 설계 및 종료 단계 현장 감리에 비 감리원인 정보\n보호 전문가를 감리원으로 20MD를 투입하였다.\n④ 시정조치확인을 위하여 설계 및 종료단계 감리\n후 총 3MD의 상근감리원을 투입하였다.",
  "2016_14": "14. 전자정부법에서 규정한 감리법인 등록을 반드시\n취소해야 하는 위반행위는?\n가. 최근 3년간 3회 이상의 업무정지처분을 받은 경우\n나. 거짓으로 시정조치확인보고서를 작성한 경우\n다. 거짓이나 부정한 방법으로 등록한 경우\n라. 다른 회사에게 자신의 법인 명칭을 사용하여\n정보시스템 감리를 하게 한 경우\n마. 업무정지 기간에 정보시스템 감리를 한 경우\n① 가, 나, 다 ② 가, 다, 마\n③ 다, 라, 마 ④ 나, 라, 마",
  "2016_15": "15. “정보시스템 감리 수행 가이드”의 검사기준서에\n관한 설명 중 적절하지 않은 것은?\n① 검사기준서는 설계단계 감리에서 필수적으로 점\n검되어야 한다.\n② 검사기준서는 요구사항, 검사항목, 검사기준을\n포함하도록 작성되어야 한다.\n③ 검사기준서는 사업자가 작성하고 감리법인이\n확인한 후 발주기관에 제출한다.\n④ 검사기준서는 세부 과업항목별로 이행여부를 점검\n하기 위한 문서로 요구사항추적표를 활용하거나\n별도의 문서로 작성할 수 있다.\n3 -",
  "2016_16": "16. 정보시스템 감리기준이 요구정의 단계 감리에서\n수행해야 하는 활동을 규정하고 있는 내용으로\n빈칸에 가장 적절한 것은?\n- 감리법인은 사업자로부터 요구사항정의서를 제출\n받은 후 ( 가 )에서 정한 과업내용이 요구사항\n정의서에 적정하게 반영되어 있는지를 점검하고\n그 결과를 감리수행결과보고서에 명시하여 발주\n자등에게 제출하여야 한다.\n- 사업자는 요구사항정의서가 세부항목별로 과업\n내용을 반영하고 있는지 여부를 확인할 수 있도록\n( 나 )를 작성하고 발주자 확인을 거쳐 감리\n법인에게 요구정의단계 감리 실시 전까지 제\n출하여야 한다.\n- ( 다 )는 점검결과에 따라 시정조치를 수행하고\n그 결과를 감리법인에게 제출하여야 한다.\n- 감리법인은 시정조치 결과를 제출받은 경우 이를\n확인하고 그 결과를 시정조치확인보고서에 명시\n하여 발주자등에게 제출하여야 한다.\n① 가. 제안요청서 나. 요구사항추적표 다. 발주자\n② 가. 계약문서 나. 대비표 다. 사업자\n③ 가. 과업내용서 나. 대비표 다. 발주자\n④ 가. 제안서 나. 요구사항추적표 다. 사업자",
  "2016_17": "17. “전자정부지원사업 관리지침”에 규정된 주관\n기관의 역할 중 가장 거리가 먼 것은?\n① 사업계획 수립\n② 제안요청서 작성\n③ 사업관리 및 검사\n④ 인수 및 운영평가",
  "2016_18": "18. 현행 전자정부법에 규정된 정보시스템감리법인의\n업무범위에 해당하지 않는 것은?\n① 과업이행 여부 점검\n② 과업범위 및 요구사항의 설계 반영 및 구체화\n여부 검토·확인\n③ 사업수행계획의 계약내용 반영 여부 검토ㆍ확인\n④ 분야별 정보시스템 구축 활동 및 산출물의 품질\n검토ㆍ확인\n- 4",
  "2016_19": "19. 상주감리원에 대한 설명으로 가장 적절하지 않은\n것은?\n① 프로젝트관리(PM) 또는 품질관리(QA) 분야의\n경력이 3년 이상인 수석감리원 등급을 상주\n감리원으로 배치하였다.\n② 상주감리원의 업무 수행에 적합하다고 발주자가\n인정한 등급의 감리원을 상주감리원으로 배치하였다.\n③ 상주감리원으로서 상세공정표에 따른 계획 대비\n실적 점검 및 이행 상태를 확인하였다.\n④ 상주감리원으로서 발주자의 의사결정지원 및\n자문을 수행하였다.",
  "2016_20": "20. “정보시스템 감리점검가이드”의 운영준비 감리\n영역의 점검항목으로 가장 올바르지 않은 것은?\n① 운영환경의 설치 및 배포를 완전하게 수행\n하였는지 여부\n② 초기데이터 구축 및 데이터 전환/검증을 적정하게\n수행하였는지 여부\n③ 시스템 시험 실시 및 검증을 적정하게 수행\n하였는지 여부\n④ 시스템 및 업무 전환을 적정하게 수행하였는지\n여부",
  "2016_21": "21. “행정기관 및 공공기관 정보시스템 구축·운영\n지침”에 따라 보안약점이 없는 소프트웨어를 개발\n하기 위한 내용으로 적합하지 않은 것을 모두 고른\n것은?\n가. SW 유지보수 사업의 개발보안 범위는 반드시\n소스코드 전체이어야 한다.\n나. 감리법인이 SW 보안약점을 진단할 경우 종료\n단계 감리의 세부 검사항목에 SW 보안약점\n제거 여부를 포함하여야 한다.\n다. 감리 대상 정보화 사업이 아닌 경우에는\n사업자로 하여금 보안약점을 진단·제거하게\n할 수 없다.\n① 가 ② 가, 나\n③ 가, 다 ④ 가, 나, 다\n4 -",
  "2016_22": "22. “공공데이터의 제공 및 이용활성화에 관한 법률”에\n근거하여 고시된 “공공기관의 데이터베이스\n표준화 지침”에 따른 데이터베이스 표준화 활동과\n거리가 먼 것은?\n① 정보시스템의 구축·운영 시 공공DB 표준화를\n위하여 코드정의서, 표준용어정의서, 도메인\n정의서를 작성하여야 한다.\n② 다른 공공기관으로부터 제공받아 사용하는 연계\n데이터는 표준 적용여부와 범위를 자체적으로\n선별 적용할 수 있다.\n③ 패키지나 솔루션 형태의 정보시스템 도입 및\n운영 등으로 데이터베이스 산출물 작업이 불가능\n하더라도 엔티티정의서, 논리데이터모델다이어\n그램은 작성되어야 한다.\n④ 데이터 표준 수립, 데이터 표준 적용 및 현행화\n등의 점검표를 활용하여 소관 공공DB의 표준화\n수준을 년 1회이상 정기적으로 점검하여야 한다.",
  "2016_23": "23. “소프트웨어사업 대가산정 가이드”의 소프트웨어\n재개발비 산정 대상 중 가장 거리가 먼 것은?\n① 신규기능 추가\n② 기존기능 수정 후 재사용\n③ 기존기능 삭제\n④ 기존기능 수정 없이 재사용",
  "2016_24": "24. 소프트웨어산업진흥법에서는 SW 품질성능 평가시험\n(BMT) 결과를 제품구매에 반영하도록 하고 있는데\n이와 관련하여 맞게 설명하고 있는 것은?\n① 소프트웨어 제품 구매 금액이 5천만원 이상인\n분리발주 대상 SW는 모두 BMT 대상이 된다.\n② 분리발주 SW를 구매하려는 경우 SW 사업자가 직접\n실시하거나 또는 지정시험기관에 의뢰하여 BMT\n를 실시할 수 있다.\n③ 구매 대상 분리발주 SW에 대해 지정시험기관에서\n이미 BMT를 실시한 결과가 있는 경우에도 각\n사업마다 실시하여야 한다.\n④ 국가기관이 지정시험기관에 의뢰하여 BMT를 실시\n하는 경우 여기에 소요되는 비용은 SW 공급업체에\n일부 부담시킬 수 있다.\n- 5",
  "2016_25": "25. 행정자치부 고시 “전자정부사업관리 위탁에 관한\n규정”에 따라 전자정부사업관리 업무를 위탁받아\n수행하는 전자정부사업관리자의 집행단계 업무로\n맞는 것을 모두 고른 것은?\n가. 현업부서 등의 의견수렴 및 이해관계 조정\n나. 쟁점 및 위험 등의 식별‧분석‧보고 및 대안제시\n다. 의사결정 사항 지시‧관리 및 이행상황 점검\n라. 위탁대상사업의 관리‧감독\n마. 성과목표 설정 등 성과관리 지원\n① 가, 나, 다 ② 나, 다, 라\n③ 다, 라, 마 ④ 나, 라, 마\n5 -",
  "2017_1": "1. 소프트웨어 형상 관리에 관한 설명으로 가장 거리가\n먼 것은?\n① 형상식별 활동의 대상에 소스코드와 데이터베\n이스는 포함되지만 문서 산출물 등은 제외된다.\n② 소프트웨어 형상관리는 산출물의 품질 향상에\n기여한다.\n③ 테스트에서 결함이 발견되면 프로그램은 수정되고\n버전 통제를 받게 된다.\n④ 대형 소프트웨어 시스템에서는 컴포넌트별로 각각\n상이한 버전들이 존재할 수 있다.",
  "2017_2": "2. 다음 일정 및 원가에 대한 현황 분석표를 보고\n질문에 답하시오.\n활동이름 소요기간 소요원가 직전 선행활동\nA 2 200 -\nB 2 200 A\nC 4 400 A\nD 2 200 A\n프로젝트 시작 시점에서 3일차까지 경과한 프로젝트의\n성과 현황을 파악해보니, 활동A와 활동B는 각각\n100% 완료되었으며, 활동C는 75%, 활동D는 50%가\n진척되었다. 이 프로젝트의 3일차까지의 PV(Planned\nValue)와 EV(Earned Value)를 50-50법칙(rule)을\n적용하여 산정하면 각각 얼마인가?\n① PV=500, EV=800 ② PV=800, EV=700\n③ PV=600, EV=700 ④ PV=700, EV=600",
  "2017_3": "3. ‘프로젝트관리 지식체계 지침서(PMBOK) 5판‘에서 요구사항\n문서를 구성하는 요소 중 가장 적절하지 않은 것은?\n① 수행 조직이 따라야 할 비즈니스 규칙을 포함한\n비즈니스 요구사항\n② 다른 조직 영역에 미치는 영향력을 포함한 이해\n관계자 요구사항\n③ 전환 요구사항\n④ 인수기준을 포함한 해결책 요구사항\n- 2",
  "2017_4": "4. 직무설계 원칙 중 생산성을 높이기 위해 가장\n기본적으로 사용되는 방법은?\n① 직무 충실화 ② 직무 단순화\n③ 직무 확대 ④ 직무 순환",
  "2017_5": "5. 다음과 같이 수행된 A사업의 지체상금 산정을 위한\n지체일수로 가장 적절한 것은?\n- C공공기관의 정보시스템을 구축하는 A사업의 계약\n기간은 1월 1일 ~ 10월 31일까지이다.\n- A사업을 맡은 B사는 계약기간 만료 전에 사업을\n완료하여 10월 15일에 검사를 요청하였다.\n- 검사결과는 불합격이었으며, 10월 25일에 불합격\n통보를 받았다.\n- B사는 불합격통보에 따른 보완을 수행하여 11월\n10일에 재검사를 요청하였다.\n- 재검사결과는 합격이었으며, 11월 15일에 합격통보를\n받았다.\n① 5일 ② 15일 ③ 21일 ④ 31일",
  "2017_6": "6. 프로젝트 일정에서 활동A와 활동B가 있다. 활동A의 소요\n기간(duration)은 2일이며 활동B의 소요기간은 3일로\n계획하고 있다. 두 활동 사이의 의존관계는 시작-시작\n(Start-to-Start)이고, 2일의 선도(Lead) 관계를 갖고\n있다. 연중무휴 근무 조건에서 활동A의 시작일이 7월\n10일이라면 활동B의 예상 종료일로 가능한 것은?\n① 7월 9일 ② 7월 10일\n③ 7월 11일 ④ 7월 12일",
  "2017_7": "7. 프로젝트 관리 과정 다섯 단계(계획, 조직화, 충원,\n지휘, 통제)에 관한 설명으로 가장 거리가 먼 것은?\n① 계획은 목적과 목표를 정하고 이를 달성하기 위한\n행동 방안을 결정하는 것이다.\n② 조직화는 조직 구성원들이 담당할 역할 구조를\n설정하는 것이다.\n③ 충원은 설정된 업무에 인원을 배치하고 인적 자원을\n관리하는 것이다.\n④ 통제는 목표를 달성하도록 동기부여하고 의사소통\n하는 것이다.\n2 -",
  "2017_8": "8. 고객과 개발자가 공동 작업 형태로 요구사항을\n도출하는 방법으로 가장 적절하지 않은 것은?\n① 동료검토(peer review)\n② 요구사항 워크숍\n③ JAD(Joint Application Development)\n④ 일-대-일 인터뷰",
  "2017_9": "9. 과거 축적된 데이터를 이용하여 어떤 프로젝트의\n활동A에 대한 소요기간을 추정하려 한다. 이 데이터에\n의하면, 최소기간이 5일, 최대기간이 17일, 최빈\n기간이 14일이었다. 3점산정법을 이용하여 계산하였\n을 때, 활동A가 9일~17일 사이에 완료될 확률은?\n① 68.3% ② 85.2% ③ 95.5% ④ 99.7%",
  "2017_10": "10. 창의성을 증진하기 위한 다양한 회의진행 기법들\n중 다음에서 설명하고 있는 기법은?\n- 그룹 상호 작용을 방지하여 객관적인 결론을 도출\n할 수 있다.\n- 익명성을 보장하여 자유로운 의견 개진이 가능하다.\n- 개진된 의견들을 피드백 해 줌으로써 의견을 수정\n할 수 있게 해준다.\n① 브레인스토밍\n② 델파이 방법\n③ 명목 집단 기법\n④ 아이디어 맵",
  "2017_11": "11. 리스크 대응 전략 중 위협과 기회에 모두 사용할\n수 있는 전략으로 가장 바람직한 것은?\n① 활용 전략 ② 전가 전략\n③ 공유 전략 ④ 수용 전략",
  "2017_12": "12. 품질 비용에 관한 설명으로 가장 거리가 먼 것은?\n① 신제품 설계의 검토에 소요되는 비용은 예방 비용으로\n간주된다.\n② 통제 비용은 예방 비용과 평가 비용으로 구분할\n수 있다.\n③ 고객 상실로 인한 비용은 내부 실패 비용에 포함된다.\n④ 통제 활동을 강화할수록 실패 비용이 감소한다.\n- 3",
  "2017_13": "13. 변경관리에 관한 설명으로 가장 거리가 먼 것은?\n① 변경 요청의 승인 또는 기각 여부는 보통 변경\n통제 위원회에 의해 결정된다.\n② 변경 통제 위원회는 전략적/조직적 관점보다는\n기술적인 관점에서 변경의 영향을 평가하여야\n한다.\n③ 변경 관리는 필요한 변경을 기술한 변경 요청\n양식을 작성함으로써 시작된다.\n④ 변경 요청이 기각되었을 경우 변경 요청을 제안한\n사람에게 그 이유를 통보해야 한다.",
  "2017_14": "14. ‘정보시스템 감리기준’의 감리 실시시기에 관련한\n내용으로 가장 적절한 것은?\n① 발주자는 감리대상사업의 사업비가 20억원 이상\n이고 사업기간이 6개월 이상인 경우 3단계감리를\n하여야 한다.\n② 2단계감리를 할 경우, 감리법인은 설계단계\n감리에서 요구사항정의서의 과업내용 반영여부\n등을 직접 점검하여야 한다.\n③ 감리대상사업의 위험도·난이도가 높다고 판단\n되는 경우 상주감리를 추가할 수 없다.\n④ 상주감리를 추가로 하는 경우 발주기관이 요구\n사항정의서의 과업내용 반영여부 등을 직접 점검\n하여야 한다.",
  "2017_15": "15. ‘소프트웨어사업 관리감독에 관한 일반기준‘의 ‘소프트\n웨어사업 상세 요구사항 분석·적용기준‘에 있는 요구\n사항 유형에 대한 설명 중 잘못된 것은?\n가. 데이터 요구사항 – 목표 시스템의 서비스에\n필요한 초기자료 구축 및 데이터 변환을 위한\n대상, 방법, 보안이 필요한 데이터 등 데이터를\n구축하기 위해 필요한 요구사항\n나. 시스템 장비 구성 요구사항 - 목표 시스템의\n처리속도 및 시간, 처리량, 동적․정적용량,\n가용성 등 성능에 대한 요구사항\n다. 품질 요구사항 – 목표 사업의 원활한 수행\n및 운영을 위해 관리가 필요한 품질 항목,\n품질 평가 대상 및 목표에 대한 요구사항\n① 가 ② 나 ③ 다 ④ 없음\n3 -",
  "2017_16": "16. 다음 중 ‘정보시스템감리기준‘의 3단계 감리에서\n종료단계의 시정조치확인보고서에 포함되는 항목을\n모두 고른 것은?\n가. 시정조치확인계획\n나. 시정조치확인결과\n다. 과업이행여부 시정조치확인결과\n라. 감리영역별 시정조치확인결과\n① 나, 다, 라 ② 가, 나, 다\n③ 가, 나, 라 ④ 가, 나, 다, 라",
  "2017_17": "17. ‘행정기관 및 공공기관 정보시스템 구축․운영 지침‘에서\n규정한 사항 중 가장 거리가 먼 것은?\n① 행정기관등의 장은 사업자에게 기술적용계획표가\n포함된 제안서 및 사업수행계획서를 제출하게\n하여야 한다.\n② 행정기관등의 장은 운영, 유지보수 등에 필요한\n표준산출물을 지정하여 사업자에게 제출을 요구\n할 수 있다.\n③ 사업자는 운영 및 유지보수를 수행하면서 반복적으로\n수행하는 사항을 매뉴얼로 작성·관리하고, 행정기관\n등의 장이 요구하는 경우 제공하여야 한다.\n④ 사업자는 설계단계 감리 수행시 기술적용결과표를\n작성하여 제출하여야 한다.",
  "2017_18": "18. 다음 중 ‘전자정부법 시행령‘에서 정의하고 있는 감리\n법인의 업무범위에 해당되는 항의 개수는?\n- 사업수행계획의 계약내용 반영 여부 검토·확인\n- 일정 및 산출물 작성계획의 적정성 여부 검토·확인\n- 과업범위 및 요구사항의 설계 반영 및 구체화 여부\n검토·확인\n- 과업 이행 여부 점검\n- 관련 법령등, 규정 및 지침 등의 준수 여부에 대한\n검토·확인\n① 2개 ② 3개 ③ 4개 ④ 5개\n- 4",
  "2017_19": "19. ‘CBD SW개발 표준 산출물 관리 가이드‘에서 제시하고\n있는 표준 산출물과 가장 거리가 먼 것은?\n① 요구사항 추적표\n② 아키텍처 정의서\n③ DB 생성 스크립트\n④ 시스템 설치 결과서",
  "2017_20": "20. ‘정보시스템감리 수행 가이드‘에 제시된 ‘정보화사업\n유형별 표준 점검항목‘ 중 유지보수 사업의 점검\n항목과 가장 거리가 먼 것은?\n① 요구사항 관리의 효율성, 적정성\n② 구성관리, 변경관리 체계를 적정하게 수립하여\n관리하고 있는지 여부\n③ 릴리즈 관리 체계를 적정하게 수립하여 관리하고\n있는지 여부\n④ 장애 및 문제관리 지침/절차를 적정하게 수립하여\n관리하고 있는지 여부",
  "2017_21": "21. 기획재정부 계약 예규인 ‘용역계약 일반조건‘ 중\n‘소프트웨어용역 계약조건‘에서 정의하고 있는 사항과\n가장 거리가 먼 것은?\n① 핵심 개발인력이 아닌 지원인력의 근무장소는\n보안 등 특별한 사유가 있는 경우를 제외하고는\n계약상대자가 달리 정할 수 있다.\n② 과업내용 변경에 따른 계약금액의 조정액이 당초\n계약금액의 100분의 5 이상으로 추정될 경우에는\n위원회를 설치하여 과업변경 심의를 하여야 한다.\n③ 계약기간 내에 용역을 완성한 후 검사가 완료된\n때에는 인력의 투입도 종료된다.\n④ 계약상대자는 계약담당공무원이 검사에 의하여\n사업의 완성을 확인한 후 1년간(별도의 관련\n법률에서 따로 정하고 있는 경우는 제외) 계약\n목적물의 하자에 대한 보수책임이 있다.\n4 -",
  "2017_22": "22. 다음 중 ‘전자정부법 시행령‘ 및 ‘정보시스템 감리\n기준‘에서 규정한 정보시스템 감리원 계속교육에\n관한 내용으로 맞는 것을 모두 고른 것은?\n가. 감리업무와 관련된 최신 지식의 지속적인 습득\n및 기술능력 유지를 위한 교육이다.\n나. 모든 등급의 감리원이 받아야 하는 교육이다.\n다. 감리원증을 교부 받은 후 1년이 경과한 경우는\n계속교육을 받아야 하는 사유가 된다.\n라. 교육시간은 3년마다 40시간 이상이다.\n① 가, 나, 다 ② 가, 다, 라\n③ 나, 다, 라 ④ 가, 나, 다, 라",
  "2017_23": "23. ‘SW사업 대가 산정 가이드‘에서 대가산정 방법의\n대가 산정식으로 틀린 것은?\n① 투입공수 방식에 의한 소프트웨어 개발비 = 직접\n인건비 + 제경비 + 기술료 + 직접경비 + 이윤\n② 기능점수 방식에 의한 소프트웨어 개발비 = 개발\n원가 + 직접경비 + 이윤\n③ 요율제 방식에 의한 소프트웨어 유지관리비 =\nSW개발비(현재가치) × 유지관리요율 + 직접경비\n④ 소프트웨어 재개발비 = 보정후 재개발원가 + 직접\n경비 + 이윤",
  "2017_24": "24. WBS(작업분할구조)에 관한 설명으로 가장 거리가\n먼 것은?\n① 작업 패키지들의 상세도 수준은 프로젝트의 규모와\n복잡도에 따라 달라진다.\n② WBS는 조직도(organizational chart), 생선뼈\n그림(fishbone diagram) 등과 같은 다양한 형태로\n표현될 수 있다.\n③ WBS에서 적용할 수 있는 100% 규칙(rule)은\n동일한 수준의 작업들 간에 중복을 허용한다.\n④ 과도한 분할은 자원의 비효율적 활용, 작업 수행\n능률의 저하 등을 초래할 수 있다.\n- 5",
  "2017_25": "25. 다음 프로젝트 네트워크에서 주경로기법을 적용\n할 때 여유시간이 0이 아닌 단위작업(node)은?\n① B ② G ③ H ④ I\n5 -",
  "2018_1": "1. PMBOK ◯R Guide(6판)에서 주공정 경로(critical path)를\n변경하지 않으면서, 프로젝트에 대한 자원요구사항이 미리\n정해진 자원한도를 초과하지 않도록 일정모델의 활동을\n조정하는 기법으로 가장 적합한 것은?\n① 자원평준화 ② 자원균형화\n③ 자원평활화 ④ 자원제한화",
  "2018_2": "2. 획득일정(earned schedule)을 설명한 것 중 적절하지 않은\n것은?\n① 획득일정 이론은 획득일정(ES), 실제시간(AT) 및 예상\n기간을 사용하여 프로젝트 완료일을 예측하는 공식도\n제시한다.\n② 기존의 획득가치관리(EVM)에 사용된 일정차이(SV) 측정\n치를 획득일정(ES) 및 실제시간(AT)으로 대체한다.\n③ 획득일정지표를 사용한 일정성과지수(SPI)는 실제시간\n(AT)/획득일정(ES)으로 표시한다.\n④ 획득일정(ES)이 0보다 큰 경우 프로젝트는 일정보다\n앞선 것으로 간주된다.",
  "2018_3": "3. PMBOK ◯R Guide(6판)에서 프로젝트 통합 변경통제를 설명\n한 것 중 가장 적절하지 않은 것은?\n① 프로젝트 시작에서부터 완료시점까지 수행되는 통합\n변경통제 수행 프로세스의 최종책임자는 프로젝트\n관리자이다.\n② 기준선이 설정되기 전에 통합 변경통제 수행 프로세스를\n통해 공식적으로 변경요청을 통제할 필요가 없다.\n③ 구두요청으로 변경을 접수해서는 안 되며, 변경사항은\n반드시 서면형식으로 기록하여야 한다.\n④ 변경사항은 변경관리 및 형상관리 시스템에 입력하여야\n한다.\n- 2",
  "2018_4": "4. 프로젝트 구성원의 동기부여를 위해 매슬로우의 욕구단계가\n활용된다. 매슬로우 5가지 욕구단계를 순서대로 올바르게\n나열한 것은?\n가. 존경욕구 나. 사회적욕구\n다. 생리적욕구 라. 자아실현욕구 마. 안전욕구\n① 다, 마, 나, 가, 라 ② 다, 나, 가, 라, 마\n③ 다, 마, 가, 나, 라 ④ 다, 나, 마, 가, 라",
  "2018_5": "5. 사업부제 조직의 장점으로 가장 거리가 먼 것은?\n① 각 사업부는 사업목표와 제품을 강조하고 이익 및 책임\n중심으로 운영되므로 경영성과가 향상된다.\n② 환경변화에 대하여 신속하고 탄력적으로 대응할 수 있다.\n③ 관리자를 양성하고 종업원을 동기부여 시키는데 도움을 준다.\n④ 사업부간 협조가 용이하고 과당경쟁이 발생하지 않으며\n공통관리비가 줄어든다.",
  "2018_6": "6. 프로젝트 팀 관리를 위해 사용하는 책임배정 매트릭스\n(RAM : Responsibility Assignment Matrix)를 설명한 내\n용으로 가장 거리가 먼 것은?\n① 프로젝트 범위(project scope)의 각 구성요소가 담당자\n또는 담당조직에게 배정될 수 있도록 표시한 것이다.\n② OBS(Organizational Breakdown Structure)를 WBS(Work\nBreakdown Structure)와 연계시킨 것이다.\n③ 한 그룹에 연관된 모든 활동 혹은 활동에 연관된 모든\n사람이나 조직을 확인할 수 있다.\n④ 직무의 내용을 텍스트 형태로 상세히 기술한 직위설명서\n(position description)이다.",
  "2018_7": "7. 명목집단법(nominal group technique)에 대한 설명으로\n가장 거리가 먼 것은?\n① 사실의 발견, 아이디어 생성, 그리고 최종 의사결정에\n사용될 수 있다.\n② 소그룹으로 편성된 참석자들의 원활한 논의와 토론\n을 통해 사실을 도출한다.\n③ 도출된 아이디어 목록에 대해서 각자 보조 설명이나\n지지하는 이유를 설명한다.\n④ 마무리 단계에서 구성원들이 순위를 매긴 결과를 종합\n하여 최고 득표한 안을 채택한다.\n2 -",
  "2018_8": "8. “4,000시간의 코딩이 필요하고 1년 안에 코딩을 완료해야\n하는 경우 2명의 코딩 담당자가 필요하다”는 등의 계량화된\n자료를 기반으로 더 높은 정확도의 자원산정을 한다면, 이\n방식은 다음 중 어느 방법에 가장 가까운가?\n① 전문가 판단법 ② 상향식 산정법\n③ 유사 산정법 ④ 모수 산정법",
  "2018_9": "9. 획득가치관리(EVM)를 사용하여 수행 중인 프로젝트의\nEV(Earned Value)가 7,300만원, PV(Planned Value)가\n8,200만원, AC(Actual Cost)가 7,750만원 일 때,\nSV(Schedule Variance)는 얼마인가?\n① -900만원 ② 900만원 ③ 450만원 ④ -450만원",
  "2018_10": "10. 네트워크 다이어그램(network diagram)중 ADM(Arrow\nDiagramming Method)에 대한 다음 설명 중 가장\n적절하지 않은 것은?\n① 활동(activity)을 화살표로 표현하는 방식이다.\n② 더미 활동(dummy activity)을 사용할 수 있다.\n③ 선후관계로서 FS, FF, SF, SS 등 다양한 관계를 나타\n내기 용이하다.\n④ 순환루프 관계 또는 조건부 분할을 표현하기는 어렵다.",
  "2018_11": "11. 프로젝트 품질 관리에 관한 설명 중에 맞는 것을 모두\n고른 것은?\n가. 실수를 예방하는 비용은 그 실수가 검사에서 발견되었\n을 때 수정하는 비용보다 저렴하다.\n나. 품질 개선 운동은 프로젝트 제품의 품질 만이 아니라\n프로젝트 자체의 품질도 개선시켜야 한다.\n다. 통제한계(control limit) 밖으로 벗어나면 불량이\n발생했음을 의미한다.\n라. 속성 샘플링(attribute sampling) 결과는 부합하는 정\n도를 나타내는 연속적인 척도이다.\n① 가, 나 ② 다, 라\n③ 가, 다 ④ 나, 라\n- 3",
  "2018_12": "12. 프로젝트 인적자원관리에 사용되는 도표·도구 중에서\n팀원의 투입 시점, 팀원 파견의 해제 시점을 한눈에 알\n수 있게 해주는 것으로 가장 적합한 것은?\n① 자원 간트 차트 ② 자원충원 매트릭스\n③ 자원분류체계도 ④ 자원 히스토그램",
  "2018_13": "13. 주공정법(CPM)을 사용하여 다음과 같은 프로젝트 네트\n워크 일정에서 프로젝트 전체 일정에 영향을 주지 않으\n면서 3일을 지연시킬 수 있는 단위작업(node)은?\n( ) 안의 숫자는 작업소요 일(day) 수를 나타냄\n① B ② C ③ E ④ F",
  "2018_14": "14. ‘공공데이터 관리지침’에서는 기계 판독이 가능한 형태의\n공공데이터 포맷 단계를 5단계로 정의하고 있다. 다음 중\n단계와 지침에서 예시된 해당 단계의 파일포맷을 짝지은\n것 중 가장 거리가 먼 것은?\n① 2단계 - XLS ② 3단계 - CSV\n③ 4단계 - XML ④ 5단계 - LOD",
  "2018_15": "15. ‘전자정부사업관리 위탁에 관한 규정’중 전자정부사업\n관리자의 업무와 가장 거리가 먼 것은?\n① 사업계획 수립 등 사업기획 지원\n② 쟁점 및 위험 등의 식별·분석 및 대안제시\n③ 위탁대상사업 및 위탁용역에 관한 의사결정 및 보고\n체계 정립\n④ 의사결정 사항 지시·관리\n3 -",
  "2018_16": "16. ‘용역계약 일반조건’에 따라 지체기간 산정과정을 가장\n적절하게 표현한 것은? (보기의 용어는 용역계약 일\n반조건의 용어를 기준으로 한다.)\n①\n용역목적물\n용역계수행기한 검사 합격일\n제출일\n(N일) (N + 5일)\n(N - 5일)\n→ 시간의\n↓ ⇓ ↓\n흐름\n지체기간\n②\n용역목적물\n용역계수행기한 검사 합격일\n제출일\n(N일) (N+10일)\n(N+3일)\n⇓ ↓ ↓ → 시간의 흐름\n지체기간\n③\n용역목적물 시정조치를 최종 검사\n용역계수행기한\n제출일 한 날 합격일\n(N일)\n(N - 5일) (N + 5일) (N + 10일)\n→ 시간의\n⇓ ↓ ↓ ↓\n흐름\n지체기간\n④\n용역목적물 시정조치를 최종 검사\n용역계수행기한\n제출일 한 날 합격일\n(N일)\n(N+3일) (N + 5일) (N + 10일)\n→ 시간의\n⇓ ↓ ↓ ↓\n흐름\n지체기간",
  "2018_17": "17. 아래의 사업에 ‘전자정부법’, ‘전자정부법 시행령’,\n‘정보시스템 감리기준’을 적용할 경우에 대한 설명\n중 가장 적절하지 않은 것은?\n< 온라인 신고시스템 구축 사업계획서 >\nㅇ 사업명 : 온라인 신고시스템 구축 사업\nㅇ 발주기관 : MM광역시 NN지방공사(「지방공기업법」에\n따른 지방공사)\nㅇ 사업기간 : 2018.05.01. ~ 2018.11.15.\nㅇ 사업내용 : 발주기관에서 건설한 임대아파트에 대한\n유지보수 온라인 신고 홈페이지 구축\nㅇ 예산 : 6억원(부가세 포함)\n- 시스템 개발비 : 4.5억원\n- DB서버 등 HW 단순 구입비 : 1.5억원\n- 4",
  "2018_18": "18. ‘정보시스템 감리기준’에서 규정하고 있는 감리업무와\n관련되어 설명한 것 중 가장 적절하지 않은 것은?\n① 요구정의단계 감리 시, 사업자는 요구사항정의서가\n세부항목별로 과업내용을 반영하고 있는지 여부를\n확인할 수 있도록 대비표를 작성하고 발주자 확\n인을 거쳐 감리법인에게 요구정의단계 감리 실시\n전까지 제출하여야 한다.\n② 요구정의단계 감리 시, 감리법인은 사업자로부터\n요구사항정의서를 제출받은 후 계약문서에서 정한\n과업내용이 요구사항정의서에 적정하게 반영되어\n있는지를 점검하고 그 결과를 감리수행결과보고\n서에 명시하여 발주자 등에게 제출하여야 한다.\n③ 요구정의단계 감리 시, 사업자는 감리법인의 점\n검결과에 따라 시정조치계획을 수립하여 감리법\n인에게 제출하여야 한다.\n④ 종료단계 감리 시, 감리법인은 감리대상사업 검사\n전까지 세부 검사항목별 과업내용 이행여부를 점\n검하고 그 결과를 감리수행결과보고서에 적합·\n부적합으로 명시하여 발주자 등에게 제출하여야 한다.",
  "2018_19": "19. 다음 중 ‘정보시스템감리 수행가이드’에서 제시하고\n있는 ‘정보화전략계획수립 사업’에 대한 표준 점검\n항목 중 ‘현황분석 및 전략수립’ 감리시점에 적용\n할 점검항목과 가장 거리가 먼 것은?\n① 업무관련 사용자 요구사항 도출 및 분석의 충분성\n② 정보화 관점에서의 개선과제 도출이 적정한지 여부\n③ 보안정책 수립 및 위험분석을 적정하게 수행하였\n는지 여부\n④ 정보화 성과관리 체계를 적정하게 수립하였는지 여부\n4 -",
  "2018_20": "20. 다음 중 ‘정보시스템감리 수행가이드’에서 제시하고\n있는 ‘시스템 개발 사업’에 대한 표준 점검항목 중\n‘시험’ 감리시점에 적용할 점검항목과 가장 거리가\n먼 것은?\n① 시험환경을 충분하게 구축하였는지 여부\n② 통합 시험 계획을 적정하게 수립하였는지 여부\n③ 시스템 시험 실시 및 검증을 적정하게 수행하였\n는지 여부\n④ 시스템 최적화 활동을 적정하게 수행하였는지 여부",
  "2018_21": "21. ‘전자정부사업관리 위탁에 관한 규정’에서 상호간에\n사회통념상 독립성을 침해할 수 있는 특수관계가\n없도록 하여야 할 대상으로 맞는 것을 모두 고른\n것은?\n가. 전자정부사업관리자\n나. 위탁대상사업 수행자\n다. 감리법인\n라. 발주기관\n① 가, 나 ② 가, 다\n③ 가, 나, 다 ④ 가, 나, 다, 라",
  "2018_22": "22. ‘행정기관 및 공공기관 정보시스템 구축·운영지침’\n에서 규정한 보안약점 진단절차 내용과 가장 거리\n가 먼 것은?\n① 행정기관 등의 장은 정보화사업 감리를 수행하는\n경우, 감리법인으로 하여금 사업자가 소프트웨어\n보안약점을 제거하였는지 진단하도록 하여야 한다.\n② 감리법인은 종료단계 감리 시 세부 검사항목에\n소프트웨어 보안약점 제거 여부를 포함하여야 한다.\n③ 감리법인은 소프트웨어 보안약점을 진단할 경우\n소프트웨어 보안약점 진단원을 반드시 배치하여야\n한다.\n④ 감리법인이 소프트웨어 보안약점 진단과정에서\n소프트웨어 보안약점 진단도구를 사용할 경우에는\n국가정보원장이 인증한 보안약점 진단도구를\n사용하여야 한다.\n- 5",
  "2018_23": "23. ‘정보시스템감리 수행 가이드’에 따라 감리원이 과업\n내용 이행여부를 점검한 결과이다.“적/부 판정”으로 가장\n적절하지 않은 것은?\n① 점검 과정에서 테스트 환경이 준비되지 않아 “점\n검제외”로 판정하였다.\n② 발주기관의 요청에 의해 진행 중인 경우라서 “점\n검제외”로 판정하였다.\n③ 선행 기능의 결함으로 점검하지 못한 경우라서\n“부적합”으로 판정하였다.\n④ 검사기준의 검사방법에 따라 점검한 결과가 예상\n결과와 판정기준에 부합하지 않아 “부적합”으로\n판정하였다.",
  "2018_24": "24. ‘정보시스템 감리원 윤리 가이드’에 따르면 정보시스템\n감리원이 감리현장에서 다음과 같은 행위를 한 경우,\n위반한 윤리성 준수 요소로 가장 적합한 것은?\n- 감리기준을 지키지 아니하고 감리업무를 수행\n한 경우\n- 거짓으로 감리보고서를 작성한 경우\n① 공익의 달성\n② 객관성과 공정성 유지\n③ 준법성 및 비밀에 대한 보안유지\n④ 전문성 유지",
  "2018_25": "25. ‘정보시스템 감리기준’의 감리대가 산정기준과 ‘정보\n시스템감리 발주·관리 가이드’에서 정의하고 있는\n사항과 가장 거리가 먼 것은?\n① 감리대상사업비는 감리 대상사업의 부가가치세를\n포함한 실제 계약금액을 적용한다.\n② 감리대가는 기본감리비, 직접경비, 부가가치세의\n합계액으로 산정한다.\n③ 행정기관 등의 지방이전으로 인해 감리가 지방에서\n수행되는 경우가 발생함에 따라 참여감리원에\n대한 여비를 직접경비로 산출할 수 있다.\n④ 추가감리 및 상주감리에서의 투입공수는 일\n단위로 계산하되 월 단위인 경우 한국소프트웨어\n산업협회의 ‘SW기술자 평균임금 공표’에 제시된\n“월평균 근무일수”를 적용한다.\n5 -",
  "2019_1": "1. 다음 네 가지 리스크 중에서 리스크 대응 효율\n성 평가를 위한 리스크 감소 레버리지(RRL :\nRisk Reduction Leverage)가 가장 큰 것은?\n리스크 노출도\n리스크 목록 리스크 감소 비용\n조치 전 조치 후\nA 200 100 200\nB 200 50 200\nC 200 100 100\nD 200 50 100\n① A ② B ③ C ④ D",
  "2019_2": "2. 팀 구축에 관한 터크맨(Tuckman)의 사다리 모형에서\n일반적인 팀 개발의 발생 순서에 따른 일부 단계\n들의 차례를 올바르게 나열한 것은?\n① 규범화(norming)→폭풍(storming)→수행(performing)\n② 수행(performing)→폭풍(storming)→규범화(norming)\n③ 폭풍(storming)→수행(performing)→규범화(norming)\n④ 폭풍(storming)→규범화(norming)→수행(performing)",
  "2019_3": "3. 프로젝트에 배정된 총 예산은 120이다. T 시점에서\n계획 가치(PV)는 100이고, SPI(Schedule Performance\nIndex)는 1.10이다. 계획 가치와 실제 비용의 차이가\n뚜렷한 추세 없이 0을 중심으로 불규칙하고 무작위로\n변동하고 있다. 향후 모든 작업이 예산 책정 비율로\n완수될 것이라고 가정 할 때, 완료까지 추정치(ETC :\nEstimation to Completion)는 얼마인가?\n① 10 ② 20 ③ 1.10 ④ 1.20",
  "2019_4": "4. 프로젝트 활동의 순서를 정할 때 사용하는 도구와\n기법에 관한 설명 중에서 맞는 설명을 모두 고른 것은?\n가. 경주가 끝날 때까지 시상식은 열릴 수 없는 경우를\n나타내는 의존관계는 finish-to-finish이다.\n나. 패스트 트래킹(fast tracking) 기법을 적용할 때,\n의무적 의존관계는 수정이나 제거가 검토될 수 있다.\n다. 리드(leads)는 후행 활동이 선행 활동에 대하여\n당겨질 수 있는 시간의 양을 말한다.\n① 가 ② 나 ③ 다 ④ 가, 나, 다\n- 2",
  "2019_5": "5. 다음 프로젝트 진도관리에 사용하는 간트차트(gantt\nchart)에 대한 설명 중 가장 거리가 먼 것은?\n① 간트차트는 단위작업 사이의 잠재적으로 연계성이\n약한 지점을 파악하기 어렵다.\n② 간트차트는 예상치 못한 지연으로 인한 프로젝트\n팀의 문제를 파악하기 어렵다.\n③ 간트차트는 일정상 중요한 단위작업에 필요한\n각종 자원 및 지원사항을 조율하는데 약점이 있다.\n④ 간트차트는 단위작업의 계획된 상태와 실제 상태의\n차이를 표현하기 어렵다.",
  "2019_6": "6. A 프로젝트에서 현재까지 특정 단위작업이 약 3분의 2\n정도까지 완료된 상태라고 한다. 이때 이 단위작\n업의 진도율 평가에서 가장 높은 진척도를 나타낼\n수 있는 계산 원칙은?\n① 완료율법 ② 0/100의 원칙\n③ 20/80의 원칙 ④ 50/50의 원칙",
  "2019_7": "7. 다음 중 애자일(agile) 소프트웨어 개발 프로젝트\n방식을 설명하는 내용으로 가장 적절한 것은?\n① 프로세스와 도구의 효과적 적용을 강조한다.\n② 동작하는 소프트웨어에 가치를 두기 보다는 포괄적\n문서화를 강조한다.\n③ 고객과의 협력을 강조한다.\n④ 계획에 의한 실행방법을 강조한다.",
  "2019_8": "8. 어느 프로젝트팀에서 개략적인 소요기간이 27주로\n산정된 프로젝트에서, 가장 낙관적으로는 2주를\n줄일 수 있고, 가장 비관적으로는 5주 지연 가능\n성을 보고했다. 베타분포를 이용한 PERT 3점 기법을\n적용하여 산출한 프로젝트 기간 산정 결과(반올림\n처리)는 얼마인가?\n① 25주 ② 26주 ③ 27주 ④ 28주",
  "2019_9": "9. 프로젝트 품질관리에서 사용하는 다음 도구 및 기\n법 중에서 어떤 결함 유형이 가장 흔한지 범주화\n하여 표현하기 위해 사용되는 것은?\n① 관리도 ② 파레토 차트\n③ 런 차트 ④ 흐름도\n2 -",
  "2019_10": "10. 다음 중 KS A ISO 21500에서 리스크를 통제하는\n방법으로 가장 적절하지 않은 것은?\n① 회의 ② 기술적 성과 측정\n③ 예비분석 ④ 델파이 방법",
  "2019_11": "11. 리스크 관리의 촉발(prompt)목록은 대개 이전의\n유사한 프로젝트에서 나타난 축적된 정보와 지식을\n바탕으로 개발된다. 다음 중 리스크 촉발목록에\n대한 설명 중 가장 적절하지 않은 것은?\n① 리스크 분류체계 최하위 단계의 리스크 범주를 개\n별 프로젝트 리스크의 촉발목록으로 사용가능하다.\n② 포괄적 프로젝트 리스크보다 개별 프로젝트 리스\n크를 평가하는 데는 촉발목록에 비해 PESTLE*,\nTECOP**, 또는 VUCA***와 같은 프레임워크가 보\n다 적합하다.\n③ 촉발목록은 리스크 식별을 위한 아이디어 생성에\n사용할 수 있다.\n④ 촉발목록은 포괄적 프로젝트 리스크 유발원 역할도\n할 수 있는 리스크 범주의 미리 결정된 목록이다.\n* PESTLE(Political, Economic, Social, Technological,\nLegal, Environmental)\n** TECOP(Technical, Environmental, Commercial, Operational,\nPolitical)\n*** VUCA(Volatility, Uncertainty, Complexity, Ambiguity)",
  "2019_12": "12. 조직구조를 설계할 때 고려해야 할 6가지 핵심\n요소가 있다. 다음 중 6가지 핵심요소에 포함되지\n않는 것은?\n① 업무전문화 ② 공식화\n③ 지속화 ④ 부서화",
  "2019_13": "13. 프로젝트 원가는 모든 프로젝트 활동에 대해 추정되며\n원가기준선을 설정하기 위해 집계된다. 다음 중 원가\n기준선에 대한 설명 중 가장 적절하지 않은 것은?\n① 작업패키지에 대해 산정된 모든 우발사태 예비와\n함께 작업패키지 원가 산정치가 통제단위로 집계된다.\n② 승인된 시간 단계별 프로젝트 예산이다.\n③ 원가기준에는 관리예비를 포함한 모든 승인된 예산이\n포함된다.\n④ 원가기준선은 'S' 곡선의 형태로 표시될 수 있다.\n- 3",
  "2019_14": "14. 다음 중 ‘전자정부법 및 동법 시행령’에 따라\n정보시스템 감리를 생략할 수 있는 사업을 모두\n고른 것은? (단, 사업비는 총사업비 중에서 하드\n웨어·소프트웨어의 단순한 구입비용을 제외한\n금액을 말함)\n가. 사업비가 4억원이고 사업기간이 5개월인\n대국민 서비스를 위한 행정업무 또는 민원\n처리용 전자정부 사업으로, 전자정부사업관\n리를 위탁한 경우\n나. 사업비가 5억원이고 사업기간이 4개월인 여러\n중앙행정기관 등이 공동으로 구축하거나 사용\n하는 전자정부 사업으로, 전자정부사업관리를\n위탁한 경우\n다. 사업비가 5억원이고 사업기간이 4개월인 정보\n시스템 구축사업으로, 전자정부사업관리를 위\n탁한 경우\n① 가, 나 ② 가, 다\n③ 나, 다 ④ 가, 나, 다",
  "2019_15": "15.‘전자정부법 시행령’에 규정된 위반행위별 1차\n행정처분 기준으로 가장 적절한 것은?\n처분기준\n위반행위\n(1차)\n감리기준을 지키지 아니하고 감리업무를\n(가)\n수행한 경우\n감리원이 아닌 사람에게 감리업무를 수행\n(나)\n하게 한 경우\n거짓으로 감리보고서를 작성한 경우 (다)\n다른 사람에게 자기의 명칭을 사용하게\n(라)\n하여 정보시스템 감리를 하게 한 경우\n① (가) 경고 (나) 경고\n(다) 업무정지 6개월 (라) 업무정지 6개월\n② (가) 경고 (나) 업무정지 6개월\n(다) 경고 (라) 업무정지 6개월\n③ (가) 업무정지 6개월 (나) 경고\n(다) 업무정지 6개월 (라) 경고\n④ (가) 업무정지 6개월 (나) 경고\n(다) 경고 (라) 업무정지 6개월\n3 -",
  "2019_16": "16.‘정보시스템 감리기준’에 규정된 종료단계 감리\n절차 내용이다. 빈칸에 가장 적절한 것은?\n- 사업자는 최종 산출물이 세부항목별로 과업내용을\n반영하였는지 여부를 확인할 수 있도록 (가)를\n작성하고 (나) 확인을 거쳐 (다)에게 종료단계\n감리 실시 전까지 제출하여야 한다.\n- 감리법인은 감리대상사업 (라)까지 세부 검사\n항목별 과업내용 이행여부를 점검하고 그 결과를\n감리수행결과보고서에 적합·부적합으로 명시하여\n발주자등에게 제출하여야 한다.\n① (가) 대비표 (나) 발주자\n(다) 감리법인 (라) 검사 전\n② (가) 대비표 (나) 감리법인\n(다) 발주자 (라) 검사 기한\n③ (가) 과업대비표 (나) 발주자\n(다) 감리법인 (라) 검사 전\n④ (가) 과업대비표 (나) 감리법인\n(다) 발주자 (라) 검사 기한",
  "2019_17": "17. 다음 중‘정보시스템 감리 점검가이드(구 감리지침)’의\n점검프레임워크에 제시된 사업유형에 해당되는 것은\n모두 몇 개인가?\n가. 정보기술아키텍처 구축 나. 정보화전략계획 수립\n다. 업무재설계 라. 정보시스템 마스터플랜\n마. 시스템 개발 바. 데이터베이스구축\n사. 시스템 운영 아. 유지보수\n① 5개 ② 6개 ③ 7개 ④ 8개",
  "2019_18": "18.‘정보시스템 감리 수행 가이드’의 종료단계 감리 시\n과업내용 이행여부에 관한 점검방법으로 가장\n적절하지 않은 것은?\n① 과업이행여부 점검은 검사항목 단위로 실시한다.\n②“적/부 판정”이 “부적합”인 경우 반드시 관련\n증빙을 첨부하여야 한다.\n③“완료여부”는 사업자가 제출한 결과를 기초로\n실제 완료여부를 확인하여 기록한다.\n④“완료여부”가 “진행 중”인 경우에는 종료단계\n이므로 발주기관의 요청이나 합의에 의하여 진행\n중인 경우는 “적합”으로 판정하고, 이외에 미\n완료된 과업은 “부적합”으로 판정한다.\n- 4",
  "2019_19": "19.‘정보시스템 감리기준’에 규정된 내용이다. 빈 칸\n에 가장 적절한 것은?\n- 발주자는 감리법인으로 하여금 3단계 감리를\n하게 하여야 한다. 다만, 감리대상사업의\n사업비가 (가)억원 미만이거나 사업기간이 (나)\n개월 미만인 경우 2단계 감리를 하게 할 수 있\n다.\n- 감리법인은 해당 감리업무 수행에 필요한 자격·\n경력·교육 등 능력과 경험을 갖춘 사람을 감리\n인력으로 배치하여야 한다. 감리인력은 전체\n투입공수의 (다)퍼센트 이상을 해당 감리법인\n소속의 상근 감리원으로 배치하여야 하며 전체\n감리인력의 (라)퍼센트 범위 내에서 유비쿼터스\n기술, 모바일, 정보보호, 법률·회계, 국방 등\n다른 분야의 전문가를 배치할 수 있다.\n① (가) 20 (나) 6 (다) 50 (라) 30\n② (가) 10 (나) 9 (다) 50 (라) 30\n③ (가) 20 (나) 6 (다) 75 (라) 50\n④ (가) 10 (나) 9 (다) 75 (라) 50",
  "2019_20": "20.‘행정기관 및 공공기관 정보시스템 구축·운영 지침’에\n따른 정보화사업의 원가 산정 방법으로 가장 거리가\n먼 것은?\n①‘DB 구축비 대가기준 가이드’를 적용하여 원가를\n산정한다.\n② 조달품목인 경우 조달단가를 적용하여 하드웨어\n구입비를 산정한다.\n③ 조달품목이 아닌 경우 최근 도입가격 또는 유사한\n거래 실례가격을 적용하여 하드웨어 구입비를 산정한다.\n④ 조달품목이 아니고 유사 거래를 찾을 수 없는 경우\n3개 이상의 공급업체로부터 직접 받는 견적가격의\n평균값을 적용하여 하드웨어 구입비를 산정한다.",
  "2019_21": "21.‘SW사업 대가산정 가이드’의 기능점수 방식에 따라\n소프트웨어 개발비를 산정할 때 적용하는 보정요소만\n으로 묶인 것은?\n가. 성능 나. 개발 언어\n다. 보안성 라. 애플리케이션 유형\n마. 연계복잡성\n① 가, 나, 라 ② 가, 다, 마\n③ 나, 라, 마 ④ 나, 다, 라\n4 -",
  "2019_22": "22.‘전자정부 성과관리 지침’에 따라 사전협의 신청이\n있을 경우 협의기관의 장이 종합적으로 검토하는 사\n항에 해당되는 것은 모두 몇 개인가?\n가. 사업계획의 중복성 등 다른 전자정부사업과의\n중복투자에 관한 사항\n나. 다른 전자정부사업 또는 정보시스템과의 연계\n추진 및 공동이용 등에 관한 사항\n다. 추진하고자 하는 전자정부사업 또는 정보시스템의\n성과측정 결과의 반영에 관한 사항\n라. 사업에 적용되는 신기술 관련 과업의 적정성에 관한 사항\n마. 사업내용의 명확성 및 구체성에 관한 사항\n바. 사업에 소요되는 기간의 적정성에 관한 사항\n사. 클라우드 이용여부의 적정성에 관한 사항\n① 4개 ② 5개 ③ 6개 ④ 7개",
  "2019_23": "23.‘공공 데이터 개방 사업수행 방법론 v2.0’을 적용하고\n있는 사업에 대하여 수행과제 간의 연관관계 (가),\n(나)로 가장 적절한 것은?\n수요자 중심\n데이터 개방\n개방 DB 구축 오픈 API 개발\n(가) (나)\n품질진단 및 개선\n① (가) 데이터 셋 표준화 (나) 코딩 가이드\n② (가) 개방 데이터 정제 (나) 코딩 가이드\n③ (가) 개방 데이터 정제 (나) 데이터 셋 표준화\n④ (가) 코딩 가이드 (나) 데이터 셋 표준화",
  "2019_24": "24.‘SW사업 대가산정 가이드’에는 단위기능 산정시\n공통적으로 발생하는 오류가 정리되어 있다. 이\n가이드에서 권고한 단위기능 산정에 관한 해설 내용과\n가장 거리가 먼 것은?\n① 데이터 적재는 외부입력(EI)으로 산정하는 것이 타당함\n② 사용자 인증은 외부조회(EQ)로 산정하는 것이 타당함\n③ 통계 기능은 외부출력(EO)으로 산정하는 것이 타당함\n④ 로그 데이터는 내부논리파일(ILF)로 산정하는 것이\n타당함\n- 5",

  "2020_11": "11. 정보시스템 운영단계에서 요구사항정의서는 고객의\n변경 요구사항 관리에 사용되는 주요 산출물이다.\n다음 중 '정보시스템 운영 및 유지보수 감리 점\n검가이드' 에 제시된 요구사항정의서의 필수항\n목인 상세 요구사항 내용에 속하지 않는 것은 ?\n① 현재 기능 ② 변경 사항\n③ 해결 방안 ④ 담당 인력",
  "2020_12": "12. '정보시스템 감리기준' 에 관련된 설명으로 다음\n중 맞는 것을 모두 고르면?\n가. 사업비가 25억원이지만 사업 기간이 5개월인 사업\n은 2단계감리를 하게 할 수 있다.\n나. 대기업인 소프트웨어사업자의 참여가 제한되는\n경우에는 상주감리를 추가할 수 있다.\n다. 기본감리비를 산정할 때 감리대상사업비는 감리\n대상사업의 계약금액을 말한다.\n① 가, 나 ② 가, 다\n③ 나, 다 ④ 가, 나, 다",
  "2020_13": "13. 다음은 특정 시점에서 세 개의 프로젝트의 획득\n가치 분석을 적용한 결과이다. 지금까지 성과에\n대해 일정은 계획보다 빨리 진행되고 있지만,\n비용은 계획보다 더 많이 지출되고 있는 프로젝트를\n모두 고른 것은?\n· 프로젝트 A: 획득가치(EV) = 200, 계획가치(PV)\n= 150, 실제원가(AC) = 210\n· 프로젝트 B: 일정차이(SV) = 20, 비용차이(CV) = 30\n· 프로젝트 C: 일정성과지수(SPI) = 0.9, 비용성과\n지수(CPI) = 1.1\n① 프로젝트 A\n② 프로젝트 B\n③ 프로젝트 C\n④ 프로젝트 A, 프로젝트 B, 프로젝트 C\n3 -",
  "2020_18": "18. 다음 품질관리 도구와 기법 중 작업분류체계(WBS),\n리스크분류체계(RBS), 조직분류체계(OBS) 등의\n분류체계를 표시하는데 사용할 수 있는 기법으로\n가장 적합한 것은?\n① 프로세스결정 프로그램 차트(PDPC)\n② 연관관계도\n③ 계통도\n④ 활동네트워크도",
  "2020_19": "19. 완료시점 산정치(EAC: Estimate at Complete)를\n나타낸 식으로 가장 적절하지 않은 것은?\nBAC : Budgeted at Complete\nCPI : Cost Performance Index\nSPI : Schedule Performance Index\nEV : Earned Value\nAC : Actual Cost\nETC : Estimate to Complete\n① EAC = BAC / CPI\n② EAC = AC + BAC - EV\n③ EAC = AC + Bottom-up ETC\n④ EAC = AC + [(BAC - EV) / (CPI + SPI)]",
  "2020_20": "20. 사원 A의 프로젝트 팀은 조달관리 계획서 작성에\n관한 작업을 완료하려고 한다. 마지막으로 팀장이\nA에게 조달관리 계획서 안에 있는 모든 내용들이\n적절하게 입력되었는지 확인하라고 했다면, 다음\n중 프로젝트에 대한 조달관리를 계획하기 위한\n투입물로 가장 거리가 먼 것은?\n① 요구사항 문서\n② 요구사항 추적 매트릭스\n③ 이해관계자 관리대장\n④ 공급자 선정기준",
  "2020_21": "21. 다음 직무 만족과 불만족 결정요인을 설명하는\nHerzberg의 동기-위생 모델에서 직무 불만족에\n영향을 미치는 위생요인으로 적절하지 않은 것은?\n① 조직의 규칙과 정책 ② 승진\n③ 임금 ④ 안정성\n4 -",

  "2021_12": "12. 다음 중 ‘공공소프트웨어사업 과업변경 가이드\n(정보통신산업진흥원, 2020)’의 ‘과업변경의 적정성\n판단기준에 따른 적절한 과업변경을 모두 고른 것은?\n가. 법령 개정 등 법·제도의 변경에 따른 과업변경\n나. 수·발주자간에 사업비 조정 없이 가능하다고 합의한\n경미한 과업변경\n다. 기술적·정책적 환경변화 등에 따른 과업변경으로\n금번에 과업변경을 하는 것이 향후 별도 사업을\n통해 동일한 과업내용을 수행하는 것보다 예산\n절감이 가능한 경우\n① 가, 나 ② 가, 다\n③ 나, 다 ④ 가, 나, 다",
  "2021_13": "13.‘정보시스템 감리기준(행정안전부 고시, 2020)’의\n감리업무처리 등에 관한 다음 설명 중 옳은 것을\n모두 고른 것은?\n가. 감리법인은 발주자와 협의하여 사업자와 감리\n계약을 체결할 수 있다.\n나. 상주감리원은 단계별 감리의 감리원으로 참여\n할 수 있다.\n다. 사업자는 설계 산출물이 세부항목별로 과업\n내용을 반영하였는지 여부를 확인할 수 있도록\n대비표를 작성하고 발주자 확인을 거쳐 감리법인에\n설계단계 감리 실시 전까지 제출하여야 한다.\n라. 사업자는 최종 산출물이 세부항목별로 과업내용을\n반영하였는지 여부를 확인할 수 있도록 대비표를\n작성하고 발주자 확인을 거쳐 감리법인에 종료\n단계 감리 실시 전까지 제출하여야 한다.\n① 가, 나 ② 가, 라\n③ 나, 다 ④ 다, 라\n3 -",
  "2021_17": "17.‘정보시스템 감리기준(행정안전부 고시, 2020)’에서\n규정한 3단계 감리의 내용 중 각 빈칸에 가장\n적절한 것은?\n제8조(요구정의단계 감리) ① 감리법인은 사업자로\n부터 요구사항정의서를 제출받은 후 (가)에서 정한\n과업내용이 요구사항정의서에 적정하게 반영되어\n있는지를 점검하고 (생략).\n제9조(설계단계 감리) ① 감리법인은 사업자로부터\n감리대상사업 설계 산출물을 제출받은 후 다음 각\n호의 사항을 점검하고 (생략).\n1. (생략)\n2. 제2항에 따른 (나)가(이) 세부 검사항목별로 적합·\n부적합 판정을 할 수 있도록 구체화되었는지의\n여부\n제10조(종료단계 감리) ① 감리법인은 감리대상사업\n검사 전까지 제9조 제1항 제2호에 따른 (다)별 과업\n내용 이행여부를 점검하고 (생략).\n① (가) 제안요청서 (나) 대비표 (다) 요구사항\n② (가) 계약문서 (나) 대비표 (다) 세부 검사항목\n③ (가) 제안요청서 (나) 설계 산출물 (다) 요구사항\n④ (가) 계약문서 (나) 설계 산출물 (다) 세부 검사항목",
  "2021_18": "18.‘전자정부법 시행령(2021)’에서 규정된 감리법인의\n위반 행위별 행정처분 기준(1차)으로 옳은 것은?\n위반행위 처분기준(1차)\n거짓으로 감리보고서를 작성한 경우 (가)\n거짓이나 그 밖의 부정한 방법으로\n(나)\n등록을 한 경우\n감리기준을 지키지 아니하고 감리\n(다)\n업무를 수행한 경우\n감리원이 아닌 사람에게 감리업무를\n(라)\n수행하게 한 경우\n① (가) 경고 (나) 업무정지 6개월\n(다) 경고 (라) 등록취소\n② (가) 경고 (나) 등록취소\n(다) 경고 (라) 업무정지 6개월\n③ (가) 업무정지 6개월 (나) 경고\n(다) 등록취소 (라) 경고\n④ (가) 등록취소 (나) 경고\n(다) 업무정지 6개월 (라) 경고\n4 -",
  "2021_21": "21.‘공공데이터 관리지침(행정안전부 고시, 2019)’에서\n제시한 공공데이터 특성별 제공 방식 선정 권고\n사항으로 가장 적절한 것은?\n제공\n공공데이터 특성 예시\n방식\n업데이트가 빈번한 대용량 버스운행데이터,\n(가)\n데이터 기상데이터\n주기적으로 업데이트 되는 수출입통계, 범죄\n(나)\n파일 형태의 데이터 통계\n정적(Static) 데이터\n형태로 연관성이 높은 (다) 인물, 지명\n데이터가 많은 경우\n* LOD(Linked Open Data)\n* 오픈 API(Open Application Programming Interface)\n① (가) 오픈API (나) LOD (다) 파일데이터\n② (가) 오픈API (나) 파일데이터 (다) LOD\n③ (가) 파일데이터 (나) LOD (다) 오픈API\n④ (가) 파일데이터 (나) 오픈API (다) LOD",
  "2021_22": "22.‘행정기관 및 공공기관 정보시스템 구축·운영\n지침(행정안전부 고시, 2019)’에 따라 행정기관\n등의 장이 정보화사업 추진 시 소프트웨어 개발보안\n의 적용 범위로 올바르게 묶인 것은?\n가. 상용 소프트웨어\n나. 신규 개발의 경우: 분석단계 산출물\n다. 신규 개발의 경우: 설계단계 산출물 및 소스코드 전체\n라. 유지보수의 경우: 유지보수로 인해 변경된 설계\n단계 산출물 및 소스코드 전체\n① 가, 나 ② 가, 라\n③ 나, 다 ④ 다, 라",
  "2021_23": "23.‘행정기관 및 공공기관 정보시스템 구축·운영\n지침(행정안전부 고시, 2019)’에 따라 행정기관\n등의 장은 제안요청서에 투입인력의 수와 기간에\n의한 방식에 관한 요구사항을 명시할 수 없다.\n다음 중 투입인력별 투입기간을 관리할 수 있는\n예외 사업으로 규정되지 않은 것은?\n① 정보시스템 구축 사업\n② 전자정부사업관리 위탁사업·감리용역 사업\n③ 정보화전략계획수립 등 컨설팅 성격의 사업\n④ DB 구축 및 자료 입력, 디지털콘텐츠 개발 서비스\n사업\n5 -",

  "2022_13": "13. 다음 중 ‘전자정부법 시행령(대통령령, 2021)’\n에서 규정된 감리법인의 업무범위와 가장 거리가\n먼 것은?\n① 과업 이행 여부 점검\n② 전자정부사업관리와 관련된 보고 및 의사결정 지원\n③ 과업범위 및 요구사항의 설계 반영 및 구체화\n여부 검토ㆍ확인\n④ 사업수행계획의 계약내용 반영 여부, 일정 및\n산출물 작성계획의 적정성 여부 검토ㆍ확인",
  "2022_14": "14. ‘SW사업 대가산정 가이드(한국소프트웨어산업협\n회, 2021)’의 소프트웨어 사업 대가 산식 중\n옳지 않은 것은?\n① 투입공수 방식에 의한 정보전략계획(ISP) 및 업\n무재설계(BPR) 수립비 : 컨설팅 대가 = 직접인\n건비 + 제경비 + 기술료 + 직접경비\n② 상용소프트웨어 유지관리비 : 상용SW유지관리비\n= 최초 Licence 구매계약 금액 X 등급별 유지관\n리요율\n③ 기능점수 방식에 의한 소프트웨어 개발비 : SW개\n발비 = 개발원가 + 제경비 + 기술료 + 직접경비\n④ 소프트웨어 재개발비 : 재개발비 = 보정 후 재\n개발원가 + 직접경비 + 이윤",
  "2022_15": "15. 다음은 ‘정보시스템 감리수행 가이드(한국지능\n정보사회진흥원, 2021)’에서 제시한 종료단계\n감리 시점에 관한 설명이다. 빈칸에 가장 적절한\n것은?\n종료단계 감리 시점은 ( 가 ) 이후에 시작하고,\n시정조치 확인 기간이 ( 나 )에 종료될 수 있는\n시점이 적합하다.\n① (가) 통합시험 (나) 검사 이전\n② (가) 통합시험 (나) 검사 완료 이전\n③ (가) 시스템시험 (나) 검사 이전\n④ (가) 시스템시험 (나) 검사 완료 이전\n3 -",
  "2022_19": "19. ‘소프트웨어프로세스 품질인증 운영에 관한 지침\n(과학기술정보통신부고시, 2021)’에서 정한 소\n프트웨어프로세스 품질인증 기준의 ‘영역’과\n‘평가항목’을 잘못 연결한 것은?\n① 소프트웨어 개발 계획수립, 통제 등 관리프로세\n스에 관한 사항 – 협력업체 관리\n② 소프트웨어 개발공정에서 필요한 분석, 설계 등\n개발 프로세스에 관한 사항 – 고객 요구사항 관리\n③ 소프트웨어 품질관리에 필요한 품질보증 등 지\n원프로세스에 관한 사항 - 형상관리\n④ 소프트웨어 프로세스의 유지 및 개선 등에 관한\n사항 – 구성원 교육",
  "2022_20": "20. ‘소프트웨어진흥법’과 ‘소프트웨어사업 계약\n및 관리감독에 관한 지침(과학기술정보통신부고\n시, 2021)’에서 적정 사업기간 산정을 설명한\n것 중 가장 적절한 것은?\n① 적정 사업기간 산정시 1년을 초과하여 산정할\n수 없다.\n② 5억원 이상의 사업의 경우 국가기관등의 장이\n적정 사업기간을 산정할 수 있다.\n③ 정보화전략계획수립(ISP) 사업의 경우에도 적정\n사업기간을 산정하여야 한다.\n④ 기능점수(FP)기반으로 적정 개발기간 산정시, 1\n인 생산성(FP/MM)은 사업규모(FP)에 따라 다르\n게 적용한다.",
  "2022_21": "21. ‘공공기관의 데이터베이스 표준화 지침(행정안\n전부고시, 2021)’에서 업무담당자가 감리법인\n에게 요구하여야 할 점검 사항에 해당되는 것은\n몇 개 인가?\n가. 범정부 및 기관의 데이터 표준 지침 적용 여부\n나. 공공데이터베이스 표준화 체계 정비ㆍ개선 및\n관리방안\n다. 공공데이터베이스 구조설계 및 검증, 관리방안\n라. 데이터 값 검증 방안\n마. 데이터 표준ㆍ구조ㆍ값ㆍ개방 관리체계\n바. 메타데이터 등록 및 현행화 방안\n① 3개 ② 4개\n③ 5개 ④ 6개\n4 -",
  "2022_24": "24. ‘SW사업 대가산정 가이드(한국소프트웨어산업협회,\n2021)’의 소프트웨어 유지관리 유형과 세부 업\n무를 연결한 것으로 가장 적절한 것은?\n① 완전유지관리 - 성능향상을 위한 소프트웨어 개선\n② 적응유지관리 - 대외기관 연계를 위한 소프트웨어\n개선\n③ 수리유지관리 - 시스템 이관에 따른 데이터 전환\n및 수정\n④ 예방유지관리 - 기능사양과 설계내용이 일치되지\n않을 경우 소프트웨어 작성 오류 수정",
  "2022_25": "25. ‘정보시스템 감리기준(행정안전부 고시, 2021)’\n에 관한 설명으로 옳은 것은?\n가. 상주감리를 추가로 하는 경우 총괄감리원이 요\n구사항정의서의 과업내용 반영여부 등을 직접\n점검하여야 한다.\n나. 감리대상사업비는 지식정보자원, 행정정보 등\n데이터베이스 구축비 등을 모두 합산하여 계\n산한다.\n다. 감리대상사업의 사업비가 20억원 미만이거나\n사업기간이 6개월 미만인 경우 2단계감리를\n하게 할 수 있다.\n라. 전체 감리인력의 30퍼센트 범위 내에서 인공지\n능, 빅데이터, 모바일, 정보보호, 법률 및 회계\n등 다른 분야의 전문가를 배치할 수 있다.\n① 가, 나 ② 나, 다\n③ 다, 라 ④ 가, 다\n5 -",

  "2023_13": "13. 다음 중 「정보시스템 감리수행 가이드(2022.2)」\n에서 제시한 기술적용결과표 준수여부를 점검하는\n감리단계로 가장 적절한 것은?\n① 요구정의단계 감리\n② 설계단계 감리\n③ 종료단계 감리\n④ 상주감리",
  "2023_14": "14. 「정보시스템 감리기준(2021.1)」에 따른 감리업무\n절차에 관한 설명으로 가장 적절하지 않은 것은?\n① 발주자는 감리계약을 체결하고자 하는 경우 \"협\n상에 의한 계약체결 방법\"을 우선적으로 적용할\n수 있다.\n② 감리법인은 단계별 감리수행 전에 감리계획서를\n발주자와 사업자 등에게 제출하여야 한다.\n③ 설계단계 감리 시 사업자는 설계 산출물이 세부\n항목별로 과업내용을 반영하였는지 여부를 확인\n할 수 있도록 대비표를 작성하고 감리법인 확인\n을 거쳐 발주자에 설계단계 감리 실시 전까지\n제출하여야 한다.\n④ 종료단계 감리 시 감리법인은 감리대상사업 검\n사 전까지 세부 검사항목별 과업내용 이행여부\n를 점검하고 그 결과를 감리수행결과보고서에\n적합·부적합으로 명시하여 발주자 등에게 제출\n하여야 한다.",
  "2023_15": "15. 「소프트웨어 진흥법(2021.12)」 및 관련 법령에\n따른 ‘적정 사업기간 산정’에 대한 설명 중 가\n장 적절한 것은?\n① 적정 사업기간 산정 대상 사업에는 소프트웨어\n유지관리 사업도 포함된다.\n② 사업금액이 3억원 이하인 사업의 경우에는 국가기\n관 등의 장이 적정 사업기간을 산정할 수 있다.\n③ 사업규모가 1,200 FP인 경우 1인 생산성(FP/MM)\n은 19를 적용한다.\n④ 산정한 적정 사업기간이 1년을 초과하는 경우에는\n「국가를 당사자로 하는 계약에 관한 법률」 제21\n조제2항에 따른 장기계속계약을 체결하여야 한다.\n3 -",
  "2023_19": "19. 다음 중 감리법인의 위반 행위에 대하여 「전자\n정부법 시행령(2022.8)」에 근거한 1차 행정처분\n으로 가장 가벼운 행정처분은?\n① 법 제59조제2항을 위반하여 거짓으로 감리보고\n서를 작성한 경우\n② 법 제58조제2항에 따른 변경 사항을 거짓으로\n변경신고를 한 경우\n③ 법 제59조제3항을 위반하여 다른 사람에게 자기\n의 명칭을 사용하게 하여 정보시스템 감리를 하\n게 한 경우\n④ 법 제59조제1항을 위반하여 감리원이 아닌 사람\n에게 감리업무를 수행하게 한 경우",
  "2023_20": "20. 「정보시스템 감리기준(2021.1)」에 관한 설명으\n로 가장 거리가 먼 것은?\n① 상주감리원은 단계별 감리의 감리원으로 참여할\n수 있다.\n② 감리대상사업의 사업비가 10억원이면 2단계 감\n리를 하게 할 수 있다.\n③ 대기업인 소프트웨어사업자의 참여가 제한되는\n경우에는 상주감리를 추가로 할 수 있다.\n④ 전체 감리인력의 30퍼센트 범위 내에서 인공지\n능, 빅데이터, 모바일, 정보보호, 법률 및 회계\n등 다른 분야의 전문가를 배치할 수 있다.",
  "2023_21": "21. 「ISP․ISMP 수립 공통가이드, 제6판(2022)」의 내\n용으로 가장 적합하지 않은 것은?\n① 기관 중장기 정보화 계획에 근거하여 개별 시스\n템에 대한 구축 예산을 요구하는 것은 불가하다.\n② 법률 개정에 따라 차년도에 시스템을 구축해야\n하는 사업으로, ISP의 기본구성 내용을 모두 포\n함한 산출물을 작성한 경우 ISP 사업 종료 이전\n에 중간산출물 검토가 가능하다.\n③ ISP․ISMP 검토 분야는 사업 타당성, 실현 가능\n성, 규모 적정성, 경제적 효율성 등 4개 분야\n로 구성되어 있다\n④ 자체인력으로 수립한 ISP는 검토 신청이 불가능하다.\n4 -",
  "2023_25": "25. 「행정기관 및 공공기관 정보시스템 구축·운영\n지침(2022.4)」에 관한 설명으로 가장 거리가 먼\n것은?\n① 행정기관 등의 장은 전자적 대민서비스를 구축\n할 때, 사용자가 별도의 소프트웨어 설치 없이\n웹 브라우저만으로 서비스를 이용할 수 있도록\n웹 표준기술을 사용하여 구축하여야 한다.\n② 행정기관 등의 장은 전자적으로 처리할 수 있는\n개인정보파일 및 개인정보처리시스템을 신규 구\n축·운용 또는 변경하려고 하는 경우, 개인정보\n영향평가를 정보시스템 분석완료 전에 수행하여\n야 한다.\n③ 하드웨어 및 소프트웨어 구입비를 산출할 때, 조\n달품목이 아니고 최근 도입가격 또는 유사한 거\n래 실례가격도 없는 경우 3개 이상의 공급업체로\n부터 직접 받은 견적가격을 기준으로 적정가격을\n산출한다.\n④ 총사업비관리대상 사업 중 정보화사업의 총사업\n비는 예비타당성조사, ISMP, 구축단계(분석, 설\n계, 개발) 중 분석, 설계 단계가 완료될 때마다\n기획재정부와 변경여부를 협의하여야 한다.\n5 -",
  "2024_1": "1. 소프트웨어 개발사업의 적정 사업기간 산정 기준에\n따라 다음 조건의 사업에 대하여 산정한 적정 사업\n기간은?\n·기능점수 : 1,320 FP\n·1인 생산성 : 22 FP/MM\n·적정 개발인력 수 : 6명\n① 6개월 ② 8개월\n③ 10개월 ④ 12개월",
  "2024_2": "2. 「SW사업 대가산정 가이드」(한국소프트웨어산업협회,\n2023년 개정판)에 따른 계약금액 조정 방식으로 가장\n적절한 것은?\n① 대가산정 방식(기능점수, 투입공수 등), 보정계수,\n제경비/기술료, 이윤, 할인율 등의 제비율은 변경\n요청 시점의 기준을 적용\n② 대가산정 방식(기능점수, 투입공수 등), 보정계수,\n제경비/기술료, 이윤, 할인율 등의 제비율은 당초\n계약 시의 기준을 동일하게 적용\n③ 대가산정 방식(기능점수, 투입공수 등)은 변경요청\n시점의 기준을 적용하고, 보정계수, 제경비/기술료,\n이윤, 할인율 등의 제비율은 당초 계약 시의\n기준을 동일하게 적용\n④ 대가산정 방식(기능점수, 투입공수 등)은 당초 계약\n시의 기준을 동일하게 적용하고, 보정계수, 제경\n비/기술료, 이윤, 할인율 등의 제비율은 변경요청\n시점의 기준을 적용",
  "2024_3": "3. 「공공기관의 데이터베이스 표준화 지침」에 따라\n데이터베이스 표준 수립 및 적용을 점검하는 경우\n가장 적절하지 않은 것은?\n① 운영 중인 DB의 비표준 데이터는 재구축 이전에\n공통 표준을 적용해야 한다.\n② 기관표준용어 정의 시 공통표준용어를 우선적으로\n적용하여야 한다.\n③ 정보화사업 감리시 감리법인에게 공공데이터\n베이스 표준화 업무를 점검하게 요구하여야 한다.\n④ 공공데이터베이스의 표준화 수준을 매년 1회\n이상 정기적으로 점검한다.\n- 2",
  "2024_4": "4. 「인공지능 학습용 데이터 품질관리 가이드라인 및\n구축안내서 v3.0」에 제시된 품질관리 활동 중 가장\n나중에 수행되는 것은?\n① 품질 목표 및 점검 기준 수립\n② 수집 도구 및 저장 환경 검토\n③ 라벨링 방법 및 기준 현행화\n④ 개인정보/민감정보 비식별화 등 법적 준거 확보",
  "2024_5": "5. 「용역계약일반조건」(기획재정부 계약예규 제582호)에\n관한 설명으로 가장 적절하지 않은 것은?\n① 공유자 일방이 계약목적물에 대한 지식재산권\n지분을 제3자에게 양도하는 경우에는 반드시\n타공유자의 동의를 받아야 한다.\n② 계약서에 반영되어 있지 않더라도 공공복리를\n위해 필요한 경우 발주기관은 개발된 소프트\n웨어를 타기관과 공동으로 활용할 수 있다.\n③ 핵심 개발인력이 아닌 지원인력의 근무장소는\n보안 등 특별한 사유가 있는 경우를 제외하고는\n계약상대자가 달리 정할 수 있다.\n④ 과업내용 변경에 따른 계약금액의 조정액이 당초\n계약금액의 100분의 10 이상으로 추정될 경우에는\n과업변경심의위원회를 설치하여 과업변경 심의를\n하여야 한다.",
  "2024_6": "6. 「CBD SW개발 표준 산출물 관리 가이드」(한국지능\n정보사회진흥원, (구)한국정보화진흥원)에서 제시한\n단계별 산출물로 가장 적절하지 않은 것은?\n① 분석단계: 유스케이스 명세서\n② 설계단계: 단위시험 케이스\n③ 구현단계: 데이터베이스 테이블\n④ 시험단계: 통합시험 시나리오",
  "2024_7": "7. 감리법인의 위법 행위에 대하여 「전자정부법」에 따른\n행정처분 수위가 가장 높은 것은?\n가. 감리법인 등록 조건인 감리원 5명 중 1명이\n퇴사하였으나 기간 내 미신고\n나. 감리계획서에 제출한 감리원 1명을 다른 전문\n가로 대신 참여시켜 감리 수행\n다. 감리기준에서 요구한 종료단계 시정조치 확인\n미수행\n① 가 ② 나\n③ 다 ④ 모두 동일\n2 -",
  "2024_8": "8. 「정보시스템 감리기준」(행정안전부 고시) [별표 1]의\n감리대가 산정 기준에서 보정 전 기본감리비에\n영향을 주는 항목이 아닌 것은?\n① FP 단가\n② 난이도계수 합\n③ IT감리 평균임금\n④ 감리대상사업비 보정금액",
  "2024_9": "9. 「정보시스템 감리 수행가이드」(한국지능정보사회\n진흥원)에서 제시한 과업이행여부 점검결과, 부적합\n판정 평가 기준으로 가장 적절하지 않은 것은?\n① 원인이 규명되지 않은 결함\n② 다른 기능 수행에 영향을 미치는 결함\n③ 중요 과업 요건이 구현되지 않은 경우\n④ 선행 기능의 결함으로 점검하지 못한 경우",
  "2024_10": "10. 「정보시스템 감리 수행가이드」(한국지능정보사회\n진흥원)에서 제시한 객체지향/컴포넌트기반 개발\n모델의 응용시스템 감리영역(요구분석 감리시점)에\n대한 점검항목으로 가장 적절하지 않은 것은?\n① 사용자 요구사항 도출 및 분석의 충분성, 적정성\n② 개념수준의 분석 클래스를 충분히 도출하였는지 여부\n③ 프로세스, 이벤트 모델링 및 기능 도출의 충분성,\n적정성\n④ 시스템 기능에 대한 유스케이스 모형 상세화 수준\n및 적정성",
  "2024_11": "11. 「지능정보기술 감리 실무 가이드」(한국지능정보\n사회진흥원)의 정보시스템 운영단계 점검항목으로\n가장 적절한 것은?\n① 사용자지원 활동을 위한 절차 및 계획을 수립하여\n수행하고 있는가?\n② 개발 소프트웨어 장애관리 활동 절차 및 계획을\n수립하여 이행하고 있는가?\n③ 응용 서비스 모니터링 활동을 위한 절차 및\n계획을 수립하여 수행하고 있는가?\n④ 개발 소프트웨어 성능관리 활동을 위한 절차 및\n계획을 수립하여 수행하고 있는가?\n- 3",
  "2024_12": "12. 설계단계 감리수행결과보고서에 지적한 개선권고\n사항에 대하여 개선유형 및 개선시점을 가장 적정\n하게 판정한 것은?\nDB 테이블정의서에 일부 데이터 컬럼 누락이 발견되어\n프로그램 개발 단계 착수 이전에 반드시 수정하여야 함\n① 필수, 단기\n② 협의, 단기\n③ 권고, 장기\n④ 필수, 장기",
  "2024_13": "13. 「정보시스템 감리기준」(행정안전부 고시) [별표 2]\n감리제안서 기술평가 기준의 평가항목으로 가장\n적절하지 않은 것은?\n① 점검내용 ② 감리인력 구성\n③ 감리일정 및 절차 ④ 감리법인의 실적",
  "2024_14": "14. 「정보시스템 감리원 윤리 가이드」(한국지능정보\n사회진흥원, (구)한국정보화진흥원)에서 제시한\n감리원 윤리 준수 요소로 가장 적절하지 않은 것은?\n① 객관성과 공정성 유지 ② 공익의 달성\n③ 성실성과 책임감 유지 ④ 전문성 유지",
  "2024_15": "15. 「SW 사업자를 위한 정보시스템 감리준비 가이드」(한국\n지능정보사회진흥원)에 따라 SW 사업자가 감리 대응을\n위하여 작성하는 문서를 모두 고르면 몇 개인가?\n가. 과업대비표\n나. 검사기준서\n다. 감리시정조치결과서\n라. 감리시정조치확인보고서\n① 1개 ② 2개\n③ 3개 ④ 4개",
  "2024_16": "16. 정보시스템 감리 사업에 대하여 적용되는 제도로\n올바른 것을 모두 고르시오.\n가. 감리 사업에 대한 과업 심의는 간소화 방식을 적용\n나. 감리 사업은 금액에 관계없이 사전협의 대상에서\n제외\n다. 감리 사업은 투입인력 관리 금지 대상에서 예외\n① 가, 나 ② 나, 다\n③ 가, 다 ④ 가, 나, 다\n3 -",
  "2024_17": "17. 「총사업비 관리지침」(기획재정부훈령 제668호,\n2023. 9. 20)에 관한 설명으로 가장 적절하지 않은\n것은?\n① 중앙관서의 장은 예비타당성조사 후 시스템 구축\n이전에 ISMP를 수립해야 하며, ISMP 수립이 완\n료되면 기획재정부장관과 사업규모, 총사업비,\n사업기간 등을 협의해야 한다.\n② 중앙관서의 장은 구축 단계에서 분석 및 설계가\n완료되면 각 단계별로 계약 체결 이전에 기획재\n정부장관과 사업규모, 총사업비, 사업기간 등을\n협의해야 한다.\n③ 정보화사업에 대한 총사업비의 조정은 ISMP에서\n수립된 구축비, 보상비, 부대경비, 시스템 구축\n후 10년 간 운영‧유지관리비, 추가 구축비를 대상\n으로 한다.\n④ 추가구축비는 시스템 구축 완료 후 기능의 변경\n‧추가‧보완, 소프트웨어 및 하드웨어 증설 등\n시스템의 개선 및 고도화에 소요되는 비용을\n포함한다.",
  "2024_18": "18. 일정 활동에 대한 기간 추정치를 산정하는 경우\n다음 도구 또는 기법 중 가장 적절하지 않은 것은?\n① 전문가 판단 ② 상향식 산정법\n③ 3점 산정 ④ 비용편익 분석",
  "2024_19": "19. 프로젝트관리자는 프로젝트 의사소통의 복잡성에\n대한 지침으로서, 가능한 의사소통 채널 또는\n경로의 수를 고려해야 한다. 어떤 프로젝트에서\n이해관계자의 수가 10명일 경우에 가능한 의사소통\n채널의 총 수는 몇 개인가?\n① 10개 ② 45개\n③ 50개 ④ 90개",
  "2024_20": "20. 상황론적 리더십 이론에서 구성원의 성숙도가 낮음\n에서 높음으로 변화함에 따라 적절한 리더십 유형을\n순서대로 가장 적절하게 나열한 것은?\n① 지시형 → 설득형 → 참여형 → 위임형\n② 지시형 → 설득형 → 위임형 → 참여형\n③ 지시형 → 참여형 → 설득형 → 위임형\n④ 지시형 → 참여형 → 위임형 → 설득형\n- 4",
  "2024_21": "21. 인도 측정(delivery measurements)은 작업 진척과\n관련이 있으며, 이러한 측정은 적응형 접근 방식을\n사용하는 프로젝트에서 자주 사용된다. 다음 중 인도\n측정 항목으로 가장 적절하지 않은 것은?\n① 주기 시간(cycle time)\n② 대기열 크기(queue size)\n③ 배치 크기(batch size)\n④ 프로세스 크기(process size)",
  "2024_22": "22. 다음 중 정량적 리스크 분석을 위한 데이터 분석\n기법으로 가장 적절하지 않은 것은?\n① 데이터 품질 평가 ② 시뮬레이션\n③ 민감도 분석 ④ 영향관계도",
  "2024_23": "23. 위협에 대한 대응 전략과 기회에 대한 대응 전략을\n순서대로 나열한 것은?\n① 공유(share) － 증대(enhance)\n② 수용(accept) － 전가(transfer)\n③ 공유(share) － 수용(accept)\n④ 수용(accept) － 수용(accept)",
  "2024_24": "24. 프로젝트 계획을 세울 때 단기적으로 범위의 매우\n구체적인 측면을 알고 있지만 장기적인 세부 사항은\n아직 명확하지 않은 경우가 많다. 이때 고려해야 할\n방법으로 가장 적절한 것은?\n① 연동 기획 ② 요구사항 수집\n③ 대안 분석 ④ 대체 분석",

  "2025_11": "11. 「인공지능 학습용 데이터 품질관리 가이드라인\nv3.1(2024.01)」에 따른 초거대 AI 데이터 품질관리\n지표 중 검사 방법으로 정성적 검사를 사용하는\n지표로 가장 적절한 것은?\n① 기준적합성 중 신뢰성\n② 유사성 중 내용 중복성\n③ 의미정확성 중 답변 적정성\n④ 편향성 중 유해성",
  "2025_12": "12.「공공부문초거대AI 도입‧활용가이드라인(2024.04.)」\n에따른LLM사용방식을파인튜닝으로결정한경우의\n체크리스트로가장적절하지않은것은?\n① 업무 특성을 반영한 LLM 선정 여부\n② 추가학습을 위한 데이터 준비 여부\n③ 파운데이션 모델 고도화 및 기대 성능 모니터링\n검토\n④ 모델 버전 관리 및 배포 방안 마련 검토",
  "2025_13": "13. 「정보시스템감리기준(2024.06.27.)」에서정한발주자\n또는 사업자의 업무에 대한 설명 중 가장 적절하지\n않은 것은?\n① 발주자는감리대가산정시제경비율은엔지니어링\n사업대가의 기준을 적용한다.\n② 사업자는 요구사항정의서가 세부항목별로 과업\n내용을반영하고있는지여부를확인할수있도록\n대비표를 작성하여야 한다.\n③ 사업자는 감리 점검 결과에 따라 시정조치를\n수행하고 그 결과를 발주자에게 제출하여야\n한다.\n④ 발주자는 감리수행결과보고서를 감리계약 종료일\n로부터 5년간 보관하여야 한다.\n3 -",

  "2025_19": "19. 다음과 같은 행동을 한 A는 「정보시스템 감리원\n윤리 가이드(2014.12.)」의 어떤 윤리 준수 요소를\n위반하였는가?\nA는 감리 수행 중 통합테스트가 적정하게 계획되\n고 수행되지 않았음을 알게 되었다. 초안 보고서에\n대한 피감리업체 담당자 B와의 리뷰과정에서 본\n내용을 보고서에 작성하지 않는다면 감리 종료 이\n후에 반드시 적정한 테스트를 수행하겠다는 말을\n들었다. 피감리업체의 말을 믿은 A는 최대한 애매한\n표현을 사용하여 보고서를 제출하였다.\n① 객관성과 공정성 유지\n② 준법성 유지\n③ 전문성 유지\n④ 사명감과 품위 유지",
  "2025_20": "20.다음 중 대인 의사소통의 기본기술인 경청에 관한\n설명으로 적절한 것은 몇 개인가?\n가. 피드백은 정직, 지지적 및 구체적이어야 효과\n적이다.\n나. 명료화는 상대방의 이야기를 명확하게 이해할\n때까지 질문하는 것이다.\n다. 확인적경청은상대방의말의내용과목소리의톤\n및 얼굴 표정 등이 일치하는가를 관찰하거나\n확인하면서 듣는 것이다.\n라. 개방적 경청은 선입관이나 편견으로 판단하는\n것이 아니라 상대방의 이야기를 있는 그대로\n경청하는 것이다.\n① 1개 ② 2개\n③ 3개 ④ 4개\n4 -",
  "2025_21": "21. 성취감이나 책임감에 의해 동기가 유발되어 있을\n때에 외적인 보상을 도입하면 오히려 동기 유발\n정도가 감소한다고 주장하는 동기 유발 이론으로\n가장 적절한 것은?\n① 공정성 이론(equity theory)\n② 욕구 이론(theory of needs)\n③ 목표 설정 이론(goal-setting theory)\n④ 인지적 평가 이론(cognitive evaluation theory)",
  "2025_22": "22. 다음 그림에서 활동D의 자유 여유(Free Float)는\n얼마인가?\n① 0일 ② 1일\n③ 2일 ④ 3일",
  "2025_23": "23. 「프로젝트관리 표준(ISO 21500) 이행 가이드\n(2013.11.)」에 의하면 리스크관리에는 리스크 식별,\n리스크 평가, 리스크 대처, 리스크 통제의 4가지\n프로세스를포함한다.다음중리스크통제프로세스의\n방법으로 가장 적절하지 않은 것은?\n① 프로세스 분석 ② 기술적 성과측정\n③ 차이 및 추세 분석 ④ 리스크 재평가",
  "2025_24": "24. 작업 패키지 A의 원가를 3점 산정법으로 추정하려\n한다. 이 작업 패키지의 원가에 대한 최빈치는 6,\n낙관치는4, 비관치는14이다.다음중삼각분포에의한\n산정치와 베타분포에 의한 산정치의 계산 결과로\n도출된 값은?\n① 삼각분포 : 7, 베타분포 : 8\n② 삼각분포 : 8, 베타분포 : 10\n③ 삼각분포 : 8, 베타분포 : 7\n④ 삼각분포 : 10, 베타분포 : 8",
  "2025_25": "25. 프로젝트의사소통방법에는전달식, 유인식, 대화식\n의사소통이 포함된다. 다음 중 유인식 의사소통\n방법에 가장 가까운 것은?\n① 이메일 ② 인트라넷\n③ 상태 보고서 ④ 회의\n- 5",
  "2026_1": "1. 다음 중 「SW사업자를 위한 정보시스템감리 준비\n및 대응 가이드(한국지능정보사회진흥원, 2023. 2.)」에\n서 정한 요구정의단계 감리의 점검대상 산출물로\n가장 적절하지 않은 것은?\n① 검사기준서 ② 기술협상서\n③ 과업대비표 ④ 사업수행계획서",
  "2026_2": "2. 다음 중 「정보시스템 감리 수행가이드(한국지능정보\n사회진흥원)」에서 정한 기술적용결과표 준수 여부를\n점검하는 감리단계로 가장 적절한 것은?\n① 요구정의단계 ② 설계단계\n③ 시험단계 ④ 종료단계",
  "2026_3": "3. 「정보시스템 감리 수행가이드(한국지능정보사회진\n흥원)」에서 정한 ‘부적합’판정에 해당하는 평가\n기준은 모두 몇 개인가?\n1. 시스템 동작 중단 결함\n2. 원인이 규명되지 않은 결함\n3. 중요 과업 요건이 구현되지 않은 경우\n4. 다른 기능 수행에 영향을 미치는 결함\n5. 검사기준서의 요건을 충족하지 못한 결함\n6. 감리 기간 내 보완되지 않은 기타 결함\n① 3개 ② 4개\n③ 5개 ④ 6개",
  "2026_4": "4. 다음 중 「공공기관의 데이터베이스 표준화 지침\n(행정안전부 고시)」에 따라 정보시스템 감리 시\n점검하여야 할 공공데이터베이스 표준화 업무로\n가장 적절하지 않은 것은?\n① 데이터 값 검증 방안\n② 공통표준용어의 제ㆍ개정 관리 방안\n③ 메타데이터 등록 및 현행화 방안\n④ 공공데이터베이스 표준화 체계 정비ㆍ개선 및\n관리방안\n- 2",
  "2026_5": "5. 다음 중「정보시스템 감리기준(행정안전부 고시)」\n[별표 2] 감리제안서 기술평가 기준의 평가항목으로\n가장 적절하지 않은 것은?\n① 점검내용 ② 점검방법\n③ 총괄감리원 ④ 감리법인의 감리실적",
  "2026_6": "6. 다음 중 「정보시스템 감리기준(행정안전부 고시)」에\n제시된 감리 실시 시기 및 인력 배치에 대한 내용\n으로 가장 적절하지 않은 것은?\n① 2단계 감리를 하는 경우, 발주자가 요구사항\n정의서의 과업내용 반영여부 등을 직접 점검\n하여야 한다.\n② 상주감리를 추가로 하는 경우, 요구정의단계\n감리는 생략하고, 상주감리원은 요구사항정의서의\n과업내용 반영여부 등을 직접 점검하여야 한다.\n③ 전체 감리인력의 50퍼센트 범위 내에서 인공지능,\n클라우드, 빅데이터, 모바일, 정보보호, 법률 및\n회계 등 다른 분야의 전문가를 배치할 수 있다.\n④ 상주감리원은 감리대상 사업비 20억원 이상의\n감리에 참여한 경력이 3회 이상인 수석감리원을\n배치할 수 있다.",
  "2026_7": "7. 다음 중 「정보시스템 감리 수행가이드(한국지능정보\n사회진흥원)」에서 정한 종료단계 감리의 감리원 활\n동으로 가장 적절하지 않은 것은?\n① 사업자의 과업 대비표 실증 점검\n② 전수조사 및 표본추출 대상 선정\n③ 검사항목별 완료여부 확인 및 적부판정\n④ 점검항목별 설계산출물의 충실도 점검",
  "2026_8": "8. 다음 중 프로젝트 일정 개발에서 사용되는 분석\n기법인 주경로법(critical path method)에 대한 설명\n으로 가장 적절하지 않은 것은?\n① 개발된 하나의 일정에서 주경로(critical path)는\n여러 개가 될 수 있다.\n② 주경로(critical path)란 하나의 일정 내에서 가장\n긴 경로를 의미한다.\n③ 주경로(critical path)의 길이는 프로젝트 전체\n기간과 같다.\n④ 주경로법으로 계산 시 전방계산과 후방계산을\n하는 이유는 일정을 검산하기 위함이다.\n2 -",
  "2026_9": "9. 다음 중 「SW사업 대가산정 가이드(한국소프트웨어\n산업협회, 2025년 개정판)」에 따른 인공지능(AI)\n도입 사업비(사업 유형이 커스터마이징형일 경우)\n비용항목으로 가장 적절한 것은?\n① 서비스 이용료\n② 서비스 이용료, 커스터마이징 작업비용\n③ 서비스 이용료, 구축·개발 비용\n④ 서비스 이용료, 커스터마이징 작업비용,\n구축·개발 비용",
  "2026_10": "10. 다음 표와 같은 프로젝트 일정에서 프로젝트 전체\n완료 기간을 2일 단축하려고 한다. 공정압축법\n(crashing)을 이용할 경우 소요되는 최소 비용은\n얼마인가?\n활동 소요기간(일) 직전선행활동 단위기간당 단축비용\nA 2 - 200만원\nB 4 A 100만원\nC 3 A 200만원\nD 2 B, C 300만원\n(단위기간당 단축비용 : 1일 단축에 소요되는 비용)\n① 200만원 ② 300만원\n③ 400만원 ④ 500만원",
  "2026_11": "11. 다음 중 품질과 관련된 개념에 대한 설명으로 가\n장 적절하지 않은 것은?\n① 정확도(accuracy)란, 측정값이 얼마나 참값(true\nvalue)에 근접해 있느냐를 의미한다.\n② 정밀도(precision)란, 반복하여 수집한 측정값이\n평균에서 얼마나 떨어져 있는가를 의미한다.\n③ 품질(quality)이란, 명시적 혹은 암묵적 요구사항을\n만족시키는 능력에 대한 실체의 총체적인 특성\n이다.\n④ 등급(grade)이란, 기능상 용도는 같지만 서로 다른\n기술적 특성 또는 기능을 갖고 있는 제품의 분류\n기준이다.\n- 3",
  "2026_12": "12. 다음 중 현재의 ‘원가성과지수(CPI)가 앞으로도\n계속 적용될 것으로 예상될 때’ 완료시점산정치\n(EAC)를 계산하는 방법으로 가장 적절한 것은?\n[BAC : 완료시점예산, EV : 획득가치, AC : 실제\n원가, CPI : 원가성과지수, SPI :일정성과지수,\nETC : 잔여분산정치]\n① EAC = AC + [(BAC - EV)/(CPI x SPI)]\n② EAC = AC + (BAC - EV)\n③ EAC = BAC/CPI\n④ EAC = AC + Bottom-up ETC",
  "2026_13": "13. 다음 중 품질 비용 모델 가운데 외부 결함에 대한\n예시로 가장 적절하지 않은 것은?\n① 결함이 있는 자재나 오류 수정과 같은 재작업\n또는 수리\n② 교체된 고장 제품 또는 보증에 따라 재수행된\n서비스와 같은 보증 요청\n③ 결함의 유형 및 심각도에 따라 명성과 대중의\n인식이 손상될 수 있는 평판\n④ 고객 불만 처리 및 서비스 제공과 관련된 모든\n작업과 비용에 대한 불만",
  "2026_14": "14. 다음 중 원가 기준선(Cost Baseline)에 대한 설명\n으로 옳은 것은?\n① 프로젝트 완료 후 실제 비용을 집계하여 만드는\n보고서\n② 프로젝트 팀이 임의로 설정하는 예산 상한선\n③ 승인된 시간단계별 예산으로, 실제 결과와 비교\n하는 기준\n④ 우발사태 예비비와 관리예비를 포함한 활동\n비용의 합",
  "2026_15": "15. 다음 중 프로젝트 리스크관리에서 ‘리스크 대응\n전략’에 대한 설명으로 가장 적절하지 않은 것은?\n① ‘회피’는 리스크로부터 프로젝트를 보호하기\n위해 원래 계획을 변경하는 대응이다.\n② ‘완화’는 계획은 변경하지 않고 리스크가\n발생할 확률이나 영향을 최소화하는 대응이다.\n③ ‘전가’는 다른 당사자에게 리스크관리의 책임을\n주어 리스크 자체를 제거하는 대응이다.\n④ ‘수용’은 리스크에 대해 대응하지 않고 계획도\n변경하지 않는 대응이다.\n3 -",
  "2026_16": "16.‘프로젝트에 의해 제공될 제품 서비스 또는 결과를\n자세히 기술한 문서’로 가장 적합한 것은?\n① RPS (Request proposal statement)\n② RFQ (Request for Quotation)\n③ RFI (Request for Information)\n④ SOW (statement of work)",
  "2026_17": "17. 다음 중 프로젝트 인적자원관리에서 ‘프로젝트 팀\n개발(develop project team)’과 관련된 활동에 대한\n설명으로 가장 적절하지 않은 것은?\n① 프로젝트 팀 개발은 프로젝트 성과를 향상하기\n위해 팀원의 역량 향상, 팀원 간 협력체계 등을\n구축하는 활동이다.\n② 프로젝트 팀이 높은 성과를 창출하는 강력한 조직\n으로 변신하기 위해서 도전적 목표와 기회를 부\n여한다.\n③ 프로젝트에서 경험이나 스킬(skill)이 많은 사람\n과 적은 사람을 의도적으로 짝을 지워주는 것을\n스토밍(storming)이라고 한다.\n④ 프로젝트 관리자는 프로젝트 팀을 구성한 이후\n중간 이탈방지를 위한 팀원 유지활동을 수행\n한다.",
  "2026_18": "18. 다음 사례를「고영향 인공지능 판단 가이드라인」에\n따라 고영향 인공지능에 해당하는지 판단한 결과로\n가장 적절한 것은?\n가. A 선사에는 선박 운항의 효율성을 높이기 위해\n선박 자율 제어 기술을 통한 자율운항 인공지능\n시스템을 활용하고 있다.\n나. B 지방자치단체에서는 인공지능 기반 스마트\n수질 모니터링 시스템을 이용하여 상수원에서\n나오는 수질을 실시간으로 감시하고 있다.\n다. C 항공사는 D 인공지능시스템을 통해 운항 중인\n객실 내에서 승객의 행동을 분석하여 비상\n상황에 대비하여 신속한 대처방안을 승객에게\n제시하고 있다.\n① (가) 비해당 - (나) 비해당 - (다) 비해당\n② (가) 해당 - (나) 비해당 - (다) 비해당\n③ (가) 비해당 - (나) 해당 - (다) 비해당\n④ (가) 해당 - (나) 해당 - (다) 해당\n- 4",
  "2026_19": "19. 의사소통 당사자의 수가 5명에서 7명으로 2명이\n더 늘었다면 의사소통 채널 수는 현재보다 얼마나\n증가하는가?\n① 2개 ② 4개\n③ 11개 ④ 15개",
  "2026_20": "20. 다음 중 프로젝트 측정과 관련하여 ‘어떤 것을\n측정하는 행위가 행동에 영향을 미치는 것’을\n의미하는 용어로 옳은 것은?\n① 허영 지표 (Vanity metric)\n② 호손 효과 (Hawthorne effect)\n③ 사기 저하 (Demoralization)\n④ 확증 편향 (Confirmation bias)",

  "2026_24": "24. 「국가를 당사자로 하는 계약에 관한 법률 시행\n규칙 (2026.1.2.)」에서 규정한 ‘상용 소프트웨어\n직접구매’ 제외 사유와 거리가 먼 것은?\n① 기존 정보시스템과 통합이 불가능하거나 현저한\n비용상승이 초래되는 경우\n② 소프트웨어 제품을 직접 공급하면 해당 사업이\n기간 내에 완성될 수 없을 정도로 현저하게 지\n연될 우려가 있는 경우\n③ 분리발주로 인한 행정업무 증가 외에 직접 구매\n하는 것이 현저하게 비효율적이라고 판단되는\n경우\n④ 운영 및 유지보수에서 확장성 문제가 발생할 우\n려가 있는 경우",
  "2026_25": "25. 다음 중 몬테카를로 시뮬레이션 분석에 대한 설명\n으로 가장 적절하지 않은 것은?\n① 분석을 위한 투입물 값(원가산정치, 기간산정치\n등)은 반복할 때마다 3점 산정법의 평균값으로\n계산한다.\n② 시뮬레이션의 산출물은 프로젝트 종료날짜나 완료\n시점의 프로젝트 원가 등과 같은 프로젝트의\n가능한 결과물 범위를 나타낸다.\n③ 프로젝트 목표 달성에 미칠 잠재적 영향을 평가\n하기 위해 개별 프로젝트 리스크 및 기타 불확\n실성 원인의 종합적 영향을 분석할 때 사용할 수\n있다.\n④ 일반적인 산출물에는 시뮬레이션에서 특정 결과를\n얻은 반복(iteration) 횟수를 나타내는 히스토그램\n또는 특정 결과를 달성할 확률 또는 그 미만을\n나타내는 누적 확률분포(S-곡선)가 포함된다.\n- 5"

    function hideImageContainer(idx) {
        const container = document.getElementById(`viewer-img-container-${idx}`);
        if (container) {
            container.style.display = 'none';
        }
    }

    function filterCategory(category) {
        currentCategory = category;
        document.querySelectorAll('.filter-btn').forEach(btn => {
            if (btn.textContent === '전체' && category === '전체') {
                btn.classList.add('active');
            } else if (category !== '전체' && btn.textContent.includes(category.split(' ').slice(1).join(' ').trim())) {
                btn.classList.add('active');
            } else if (category !== '전체' && category.includes('법/제도') && btn.textContent.includes('법/제도')) {
                btn.classList.add('active');
            } else if (category !== '전체' && category.includes('감리') && btn.textContent.includes('감리')) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        renderTopics();
    }

    function toggleAccordion(index) {
        const item = document.getElementById(`accordion-${index}`);
        const content = item.querySelector('.accordion-content');
        const isActive = item.classList.contains('active');

        document.querySelectorAll('.accordion-item').forEach((el, i) => {
            if (i !== index) {
                el.classList.remove('active');
                el.querySelector('.accordion-content').style.maxHeight = '0px';
            }
        });

        if (!isActive) {
            item.classList.add('active');
            
            let filtered = topicMapping;
            if (currentCategory !== '전체') {
                filtered = topicMapping.filter(item => item.category === currentCategory);
            }
            const dataObj = filtered[index];
            
            if (dataObj && dataObj.rep_question) {
                const viewer = document.getElementById(`viewer-${index}`);
                const titleEl = document.getElementById(`viewer-title-${index}`);
                const bodyEl = document.getElementById(`viewer-body-${index}`);
                const imgEl = document.getElementById(`viewer-img-${index}`);
                const imgContainer = document.getElementById(`viewer-img-container-${index}`);
                
                titleEl.textContent = `[대표 문제 예시] ${dataObj.rep_year}년 기출 ${dataObj.rep_num}번`;
                bodyEl.textContent = dataObj.rep_question;
                
                if (imgEl && imgContainer) {
                    imgContainer.style.display = 'block';
                    imgEl.src = `images/${dataObj.rep_year}_${dataObj.rep_num}.png`;
                }
                
                viewer.style.display = 'flex';
                
                item.querySelectorAll('.year-btn').forEach(btn => btn.classList.remove('active-btn'));
                setTimeout(() => {
                    const activeBtn = item.querySelector(`.q-btn-${dataObj.rep_year}-${dataObj.rep_num}`);
                    if (activeBtn) {
                        activeBtn.classList.add('active-btn');
                    }
                }, 50);
            }
            
            setTimeout(() => {
                content.style.maxHeight = content.scrollHeight + 'px';
            }, 150);
        } else {
            item.classList.remove('active');
            content.style.maxHeight = '0px';
        }
    }
