  "2021_65": "65. 다음의 두 릴레이션 직원(EMP), 부서(DEPT)의\nCREATE TABLE 문에 포함될 참조무결성 조치에\n대한 설명으로 옳지 않은 것은? (단,\nSuper_ENO는 상사 직원번호, E_DNO는 소속부\n서, Mgr_ENO는 부서 관리자의 직원번호를 나\n타내고, 밑줄은 기본키를 표시한다.)\nEMP(ENO, Name, Super_ENO, E_DNO)\n참조무결성제약 및 조치:\nFOREIGN KEY (Super_ENO) REFERENCES EMP(ENO)\nON DELETE SET NULL ON UPDATE CASCADE\nFOREIGN KEY (E_DNO) REFERENCES DEPT(DNO)\nON DELETE SET DEFAULT ON UPDATE CASCADE\nDEPT(DNO, Dname, Mgr_ENO)\n참조무결성제약 및 조치:\nFOREIGN KEY (Mgr_ENO) REFERENCES EMP(ENO)\nON DELETE SET DEFAULT ON UPDATE CASCADE\n① 직원의 소속 부서가 삭제되면 해당 직원은 디폴\n트 부서로 배치된다.\n② 상사 직원이 삭제되면 해당 직원은 디폴트 상사\n에게 배치된다.\n③ 부서번호(DNO)가 변경되면 해당 부서 소속 직원\n의 소속 부서번호도 동일하게 갱신된다.\n④ 관리자 직원이 삭제되면 삭제된 직원이 관리했\n던 부서의 관리자는 디폴트 관리자로 배치된다.",
  "2021_66": "66. 다음은 확장 가능 해싱(extendible hashing) 기법이\n가지는 디렉토리와 버켓 구조를 나타낸다. 그림에\n서 전역 깊이(global depth)인 (가)와 지역 깊이\n(local depth)인 (나)에 들어가는 숫자로 올바르\n게 짝지어진 것은?\n① (가) 3, (나) 2 ② (가) 4, (나) 2\n③ (가) 3, (나) 1 ④ (가) 4, (나) 1\n6 -\n\n=== NEW PAGE ===",
  "2021_67": "67. 사원 정보를 저장하는 릴레이션 EMPLOYEE와 부양\n가족 정보를 저장하는 릴레이션 DEPENDENT가 다음\n과 같이 정의되었다고 할 때, “부양가족이 없는\n사원의 이름을 검색하라”라는 SQL 질의의 ㉮,\n㉯, ㉰에 들어갈 내용으로 가장 적절한 것은?\nCREATE TABLE EMPLOYEE\n(NAME VARCHAR(30) NOT NULL,\nSSN CHAR(9) NOT NULL,\nADDR VARCHAR(30),\nPHONE CAHR(10),\nPRIMARY KEY (SSN));\nCREATE TABLE DEPENDENT\n(ESSN CHAR(9) NOT NULL,\nDEPNAME VARCHAR(30) NOT NULL,\nAGE INT,\nPRIMARY KEY (ESSN, DEPNAME),\nFOREIGN KEY (ESSN) REFERENCES EMPLOYEE (SSN));\nSELECT NAME\nFROM EMPLOYEE\nWHERE ㉮ (SELECT ㉯ FROM DEPENDENT WHERE ㉰) ;\n㉮ ㉯ ㉰\n① NOT EXISTS * SSN=ESSN\n② NOT IN * NAME=DEPNAME\n③ NOT IN ESSN SSN=ESSN\n④ NOT EXISTS ESSN NAME=DEPNAME",
  "2021_68": "68. 다음 릴레이션 R과 S에 대해 <보기>의 4개 관계\n연산을 수행했을 때 4개 결과 릴레이션의 카디널\n리티(cardinality)의 합으로 옳은 것은?\nR S\nA B C C D\n10 a 1 1 x\n20 b 2 2 y\n30 c 3 4 z\n40 d 2\n50 e 5\n<보기>\nR⋈c<cS (theta join)\nR⋈ S (natural join)\nN\nR⟕c=cS (left outer join)\nR⟖c=cS (right outer join)\n① 15 ② 17 ③ 19 ④ 21\n- 17",
  "2021_69": "69. 대출을 위한 신용 등급 판단을 위해 다음 데이\n터에 대해 나이브 베이지안 분류기를 적용할 경우\n가장 작은 값은?\nTID 집소유 결혼 연봉 신용\n1 예 미혼 125K 우수\n2 아니오 기혼 100K 우수\n3 아니오 미혼 70K 우수\n4 예 기혼 120K 우수\n5 아니오 이혼 95K 불량\n6 아니오 기혼 60K 우수\n7 예 이혼 220K 우수\n8 아니오 미혼 85K 불량\n9 아니오 기혼 75K 우수\n10 아니오 미혼 90K 불량\n① P(집소유=아니오|우수)\n② P(집소유=예|우수)\n③ P(결혼=미혼|우수)\n④ P(결혼=미혼|불량)",
  "2021_70": "70. 모바일 데이터베이스에서 모바일 데이터의 갱신에\n대한 설명 중 옳은 것으로 묶인 것은?\n가. 모바일 호스트가 다른 컴퓨터에 의해 갱신될\n수 있는 데이터를 판독 전용 사본으로 캐시\n하고 있다면, 이렇게 캐시된 데이터는 일관\n성을 유지하고 있다.\n나. 모바일 호스트가 연결되어 있으면 무효로 된\n캐시 항목들을 알려주는 무효 보고서\n(invalidation report)를 전송받을 수 있다.\n다. 모바일 호스트가 단절되어 있어서 무효 보고\n서를 받지 못하는 경우 재연결시 전체 캐시\n를 무효로 할 수 있는데, 이 경우 소요되는\n비용은 무시할 정도로 적다.\n라. 유선 분산 시스템에서는 분할이 장애 모드로\n간주되지만 모바일 컴퓨팅에서는 단절로 인\n한 분할이 정상 작동 모드의 일부가 되므로\n일관성이 손상될 위험이 있더라도 분할 상태\n에서 데이터 접근을 허용할 필요가 있다.\n① 가, 나 ② 가, 다\n③ 나, 라 ④ 다, 라\n7 -\n\n=== NEW PAGE ===",
  "2021_71": "71. 트랜잭션 관리에서 다음과 같이 3개의 트랜잭션에\n대해 검사시점(checkpoint) 회복 기법이 사용될\n때, 시스템이 장애가 발생한 후 트랜잭션들의\nREDO 연산과 UNDO 연산을 수행하는 설명으로 옳\n지 않은 것은?\nŸ 검사시점 C1이 정상적으로 수행되었고 검사시\n점 C2가 수행될 때 장애가 발생했다.\nŸ 트랜잭션 T1은 C1 이전에 시작해서 C1 이전에\n완료되었다.\nŸ 트랜잭션 T2는 C1 이전에 시작해서 C2 이전에\n완료되었다.\nŸ 트랜잭션 T3는 C1 이전에 시작해서 C2일 때\n수행 중이었다.\n① T1은 회복 작업에 관련될 필요가 없다.\n② T2는 처음부터 끝까지 REDO를 수행한다.\n③ T3는 처음부터 끝까지 UNDO를 수행한다.\n④ 회복 작업이 완료될 때까지 시스템은 새로운 트\n랜잭션을 받아들일 수 없다.",
  "2021_72": "72. 릴레이션의 키에 대한 설명 중 맞는 것을 모두\n고른 것으로 가장 적절한 것은?\n가. 모든 릴레이션에는 최소한 하나의 수퍼키와\n후보키가 존재한다.\n나. 릴레이션에서 외래키는 널(NULL) 값을 갖지\n않을 수도 있다.\n다. 하나의 릴레이션에서 후보키의 개수는 수퍼\n키 개수보다 많을 수 없다.\n라. 하나의 릴레이션에서 외래키는 여러 개가\n존재할 수 있다.\n마. 데이터베이스 시스템은 참조된 속성\n(referenced attribute)이 기본키인 경우\n에만 참조무결성 제약조건을 지원한다고\n할 수 있다.\n① 가, 나, 다, 라\n② 나, 다, 라\n③ 나, 다, 라, 마\n④ 가, 나, 다, 라, 마\n- 18",
  "2021_73": "73. 다음은 두 문서의 용어 벡터(term vector)이다. 이\n두 벡터 간 코사인 유사도(cosine similarity)의 계산\n결과로 올바른 것은?\nDocID 사과 감 체리 포도 키위 망고 딸기 배\nDoc1 3 1 0 3 1 2 1 0\nDoc2 1 1 2 1 0 2 4 3\n① 15 ② 0.5 ③   ④ 13",
  "2021_74": "74. 릴레이션 R을 릴레이션 R 과 R 로 분해할 때 바람\n1 2\n직한 분해(decomposition)에 대한 설명으로 가장\n적절하지 않은 것은? (단, R ∩R 는 R 과 R 의 공\n1 2 1 2\n통 속성을 의미한다.)\n① 손실없는 분해(lossless decomposition)가 되어야\n한다.\n② 함수적 종속성(functional dependency) R ∩R →\n1 2\nR 과 R ∩R → R 를 모두 만족하여야 한다.\n1 1 2 2\n③ R ∩R 가 R 의 수퍼키가 된다.\n1 2 1\n④ R의 함수 종속성은 분해 후에도 가급적 보존되\n어야 한다.",
  "2021_75": "75. 연관 규칙 생성을 위한 Apriori 알고리즘을 사용\n하여 {A,B,C,D}(간략히 ABCD라고 함)가 빈발 항\n목집합(frequent itemset)임을 알았다. 그런데,\nABCD에서 만든 규칙 BCD→A가 최소신뢰도 조건을\n만족하지 않아 연관규칙이 될 수 없다면, 이 사\n실로부터 더 이상 고려할 필요가 없는 규칙들로\n만 짝지어진 것은?\n① BD→AC, AB→CD ② AB→CD, A→BCD\n③ BD→AC, D→ABC ④ A→BCD, D→ABC\n8 -\n\n=== NEW PAGE ===\n\n시스템 구조",
  "2022_51": "51. 데이터베이스 구축 방법론 v4.0의 DB구축 공정에서\n다음의 태스크들이 진행되는 세그먼트에 해당하는\n것은?\n- 메타데이터 입력항목 협의\n- 한자 및 다국어 지원협의\n- 표준안수립 및 작업지침 작성\n① 현황조사\n② 구축대상선정\n③ 계획수립\n④ 실행계획",
  "2022_52": "52. 다음은 관계 데이터 모델에서의 주요 제약조건\n네 가지를 나타낸다. 릴레이션에 대한 투플 삽입\n연산이 발생할 경우 위배될 수 있는 제약조건들\n을 모두 나열한 것은?\n가. 도메인 제약조건(domain constraint)\n나. 키 제약조건(key constraint)\n다. 엔티티 무결성 제약조건(entity integrity\nconstraint)\n라. 참조 무결성 제약조건(referential integrity\nconstraint)\n① 가, 나\n② 가, 다, 라\n③ 나, 다, 라\n④ 가, 나, 다, 라",
  "2022_53": "53. 다음 설명 중 개체-관계 모델의 약한 엔티티 타\n입(weak entity type)에 대한 설명이 옳지 않은\n것은?\n① 강한 엔티티 타입이 소유 엔티티 타입이 될 수\n있다.\n② 약한 엔티티 타입은 키를 형성하기에 충분한 애\n트리뷰트들을 갖지 못한 엔티티 타입이다.\n③ 약한 엔티티 타입의 엔티티들을 식별하기 위해\n강한 엔티티 타입의 애트리뷰트들 중 임의의\n하나와 결합해야 한다.\n④ 약한 엔티티 타입이 존재하려면 소유 엔티티 타입이\n있어야 한다.\n- 1",
  "2022_54": "54. 다음과 같은 이벤트참여 릴레이션이 있다고 하자.\n이벤트참여\n고객아이디 이벤트번호 당첨여부 고객이름 등급\nC001 E001 Y Kim GOLD\nC001 E005 N Kim GOLD\nC001 E008 Y Kim GOLD\nC002 E002 N Lee VIP\nC002 E005 N Lee VIP\nC003 E003 Y Park SILVER\nC003 E006 N Park SILVER\n이 릴레이션의 기본 키는 (고객아이디, 이벤트번호)\n이다. 이벤트참여 릴레이션에 존재하는 함수적 종속\n(functional dependency) 관계를 표현한 것 중 옳지\n않은 것은?\n① 고객아이디 → 고객이름\n② 고객아이디 → 당첨여부\n③ {고객아이디, 이벤트번호} → 고객이름\n④ {고객아이디, 이벤트번호} → 당첨여부",
  "2022_55": "55. 다음의 릴레이션 address와 이에 대한 함수적 종\n속들이 다음과 같이 정의되었다. 이것의 정규형\n과 관련된 설명 중에서 옳지 않은 것은?\naddress (street, city, state, zipcode)\n함수적 종속: street → (city, state)\nzipcode → city\n(city, state) → zipcode\n① street는 후보키이다.\n② 릴레이션 address는 제2 정규형이다.\n③ 릴레이션 address에 대한 제3 정규형은\nR1=(street, city, state), R2=(city, state, zipcode)\n이다.\n④ 릴레이션 address에 대한 BCNF 정규형은\nR1 = (street, city), R2 = (city, state),\nR3 = (city, state, zipcode) 이다.\n12 -\n\n=== NEW PAGE ===",
  "2022_56": "56. 다음과 같은 고객 릴레이션과 주문 릴레이션이 있\n다고 하자.\n고객\n고객아이디 고객이름 나이\nC001 Kim 23\nC002 Park 35\nC003 Lee 27\n주문\n주문번호 주문고객 주문제품\n1001 C002 피자\n1002 C001 치킨\n고객 릴레이션의 기본키는 고객아이디이고, 주문 릴\n레이션의 주문고객은 고객 릴레이션의 고객아이디를\n참조하는 외래 키이다. 다음 중 참조 무결성 제약조\n건을 위반하는 경우로만 모두 고른 것은? (단, 삭제\n연산시 NO ACTION을 적용한다.)\n가. 주문 릴레이션에 주문번호 ‘1003’인 투플을 삽\n입하면서 주문고객으로 ‘C004’를 입력\n나. 주문 릴레이션에 주문번호 ‘1003’인 투플을 삽\n입하면서 주문고객으로 NULL을 입력\n다. 고객 릴레이션에서 고객아이디가 ‘C001’인 투\n플을 삭제\n라. 고객 릴레이션에서 고객아이디가 ‘C003’인 투\n플을 삭제\n① 가, 다 ② 가, 라\n③ 나, 다 ④ 나, 라",
  "2022_57": "57. 다음에 주어진 릴레이션 Employee와 Department\n에 대해 각 SQL문을 수행한 결과로 생성되는 레\n코드의 개수가 옳지 않은 것은?\nEmployee\nempno ename job mgr deptno\n7839 KING PRESIDENT NULL NULL\n7698 BLAKE MANAGER 7839 30\n7782 CLARK MANAGER 7839 10\n7566 JONES MANAGER 7839 20\nDepartment\ndeptno dname\n10 ACCOUNTING\n20 RESEARCH\n30 SALES\n40 OPERATIONS\n- 1\nSELECT *\n① FROM Employee as E INNER JOIN Department 3\nas D ON E.deptno = D.deptno;\nSELECT *\n② FROM Employee as E LEFT OUTER JOIN 3\nDepartment as D ON E.deptno = D.deptno;\nSELECT *\n③ FROM Employee as E RIGHT JOIN Department 4\nas D ON E.deptno = D.deptno;\nSELECT *\n④ FROM Employee as E FULL JOIN Department 5\nas D ON E.deptno = D.deptno;",
  "2022_58": "58. 아래의 country 테이블과 city 테이블에 대한 SQL\n질의가 수행될 때, 생성되는 결과 테이블의 차수\n(degree)와 카디널리티(cardinality)로서 옳은 것은?\ncountry\nid country_name country_name_eng country_code\n1 Deutschland Germany DEU\n2 Srbija Serbia SRB\n3 Hrvatska Croatia HRV\n4 United States of America United States of America USA\n5 Polska Poland POL\n6 España Spain ESP\n7 Rossiya Russia RUS\ncity\nid city_name lat long country_id\n1 Berlin 52.520008 13.404954 1\n2 Belgrade 44.787197 20.457273 2\n3 Zagreb 45.815399 15.966568 3\n4 New York 40.730610 -73.935242 4\n5 Los Angles 34.052235 -118.243 4\n6 Warsaw 52.237049 21.017532 5\nSELECT country.country_name, COUNT(city.lat)\nFROM city INNER JOIN country\nON city.country_id = country.id\nGROUP BY country.country_name\nHAVING COUNT(city.lat) <= 1;\n① 차수: 1, 카디널리티: 4\n② 차수: 1, 카디널리티: 5\n③ 차수: 2, 카디널리티: 4\n④ 차수: 2, 카디널리티: 5\n13 -\n\n=== NEW PAGE ===",
  "2022_59": "59. 다음의 릴레이션 R에 대해 릴레이션 C1, C2, C3\n으로 디비전(division) 연산을 수행한 결과 릴레\n이션의 카디널리티(cardinality)의 최소값과 최\n대값을 올바르게 나열한 것은?\nR C1 C2 C3\nA B B B B\n100 C413 C413 C312 C312\n100 E412 C413 C413\n200 C123 E412\n300 C312\n300 C324\n300 C413\n400 C312\n400 C324\n400 C413\n400 E412\n500 C312\n① 1, 2 ② 1, 3\n③ 1, 4 ④ 2, 3",
  "2022_60": "60. 어떤 스포츠클럽의 개체-관계 모델에서 회원(MEMBER)\n개체와 로커(LOCKER) 개체 간에 1:1 관계가 성립한다.\n회원에게는 로커가 필수적으로 배정되지만, 로커는\n회원이 배정되지 않을 수도 있다. 이 개체-관계 모델\n의 두 개체는 각각 회원 테이블과 로커 테이블로 매\n핑이 되고, 회원 테이블의 기본키는 MID, 로커 테이\n블의 기본키는 LID이다. 두 테이블을 정의하기 위한\nSQL DDL문에 대한 설명으로 가장 적절한 것은?\n가. CREATE TABLE MEMBER 정의문 안에 LID를 외래\n키로 정의한다.\n나. CREATE TABLE LOCKER 정의문 안에 MID를 외래\n키로 정의한다.\n다. 두 개체의 1:1 관계를 표현하기 위해 외래키\n로 정의된 속성에 대한 열 제약조건을 NULL로\n정의한다.\n라. 두 개체의 1:1 관계를 표현하기 위해 외래키\n로 정의된 속성에 대한 열 제약조건을 NOT\nNULL로 정의한다.\n① 가, 다 ② 가, 라\n③ 나, 다 ④ 나, 라\n- 1",
  "2022_61": "61. 다음과 같은 등록 데이터를 가지고 있는 ENROL 테\n이블이 있다고 하자. 여기서, SNO, CNO, GRADE는\n각각 학번, 과목번호, 성적을 의미한다.\nENROL\nSNO CNO GRADE\n1001 C001 95\n1001 M001 80\n1002 E001 85\n1003 M001 90\n1004 E001 95\n1004 M001 75\n1004 C001 70\n1005 M002 80\n위 테이블에 대해 다음과 같은 SQL문을 실행했을 때\n의 실행 결과 중 3번째 행으로 옳은 것은?\nSELECT CNO, SNO FROM ENROL ORDER BY CNO DESC, GRADE ASC;\nCNO SNO CNO SNO\n① M001 1004 ② M001 1001\n③ E001 1004 ④ C001 1004",
  "2022_62": "62. 파일 조직의 유형인 비순서 히프파일(heap file)에 대\n한 평균 검색 비용(시간)을 알아보고자 한다. 레코드가\n500,000개, 각 레코드의 길이가 100 바이트, 블록의 크\n기가 4,096 바이트, 한 블록을 읽는데 걸리는 시간은 10\nms 인 매개변수가 주어진 경우, 주어진 특정 레코드를\n찾기 위해 평균적으로 걸리는 시간에 가장 가까운 것은?\n① 121,951 ms ② 125,000 ms\n③ 62,500 ms ④ 31,250 ms",
  "2022_63": "63. 다음은 검사시점 회복(checkpoint recovery) 기법\n에서 진행되는 주요 작업들을 설명한 것이다. 적\n용 순서가 시간 순으로 옳게 나열된 것은?\n가. REDO-list에 있는 트랜잭션에 대해 REDO 연산을\n수행한다.\n나. <T, Commit> 로그 레코드를 만나면 트랜잭션 T를\nUNDO-list에서 삭제하고 REDO-list에 첨가한다.\n다. 변경된 데이터 버퍼 블록을 전부 디스크로 출\n력시킨다.\n라. UNDO-list에 있는 모든 트랜잭션들에 대해\nUNDO 연산을 수행한다.\n① 나, 가, 라, 다 ② 나, 라, 가, 다\n③ 다, 나, 가, 라 ④ 다, 나, 라, 가\n14 -\n\n=== NEW PAGE ===",
  "2022_64": "64. 다음과 같은 STUDENT 릴레이션과 ENROL 릴레이션이\n있다고 하자.\nSTUDENT\nSNO SNAME AGE\nS001 Kim 20\nS002 Park 22\nS003 Lee 21\nS004 Hong 23\nENROL\nENO SNO COURSE\nE001 S001 자료구조\nE002 S001 알고리즘\nE003 S002 자료구조\nE004 S003 알고리즘\nE005 S003 프로그래밍\nE006 S003 데이터베이스\n다음과 같은 실행 결과가 나오는 SQL 질의문으로 옳\n은 것은?\nSNAME COURSE\nKim 자료구조\nKim 알고리즘\nPark 자료구조\nLee 알고리즘\nLee 프로그래밍\nLee 데이터베이스\nHong NULL\n① SELECT STUDENT.SNAME, ENROL.COURSE\nFROM ENROL INNER JOIN STUDENT\nON ENROL.SNO = STUDENT.SNO;\n② SELECT STUDENT.SNAME, ENROL.COURSE\nFROM STUDENT LEFT OUTER JOIN ENROL\nON STUDENT.SNO = ENROL.SNO;\n③ SELECT STUDENT.SNAME, ENROL.COURSE\nFROM ENROL LEFT OUTER JOIN STUDENT\nON ENROL.SNO = STUDENT.SNO;\n④ SELECT STUDENT.SNAME, ENROL.COURSE\nFROM STUDENT RIGHT OUTER JOIN ENROL\nON STUDENT.SNO = ENROL.SNO;\n- 1",
  "2022_65": "65. 데이터베이스 보안 기법 중 필수 접근 제어\n(mandatory access control) 기법에 대한 설명으\n로 옳지 않은 것은?\n① 각 데이터 객체에 적정 비밀 등급을 부여하고\n각 사용자도 허가 등급을 지정하여 데이터 객\n체가 적절한 허가 등급을 가진 사용자에 의해\n서만 접근되도록 한다.\n② 통상적인 보안 등급은 TS(극비), S(비밀), C(대\n외비), U(일반)으로 나누는데 이들 간의 순서는\nTS > S > C > U 가 된다.\n③ 데이터 객체 j를 갱신하기 위해서는 사용자 i의\n허가 등급이 데이터 객체 j의 비밀 등급보다 같\n거나 높아야 한다.\n④ 이 필수 접근 제어 기법을 다단계 보안 기법\n(multilevel security scheme)이라고도 한다.",
  "2022_66": "66. 다음은 데이터베이스 회복(recovery) 기법의 지\n연 갱신(deferred update)과 즉시 갱신\n(immediate update)에 대한 설명이다. 다음 설명\n중에서 옳은 것을 모두 고른 것은?\n가. 지연 갱신에서는 완료(commit) 이전에 실패한\n트랜잭션의 경우 UNDO가 필요하지 않다.\n나. 즉시 갱신은 완료 이후 UNDO와 REDO가 필요하\n지 않기 때문에 NO-UNDO/NO-REDO 알고리즘으\n로 알려져 있다.\n다. 즉시 갱신에서는 완료 이전에 실패한 트랜잭\n션의 경우 UNDO를 수행해야 한다.\n라. 지연 갱신에서는 완료된 트랜잭션에 대해서도\n로그를 사용하여 REDO를 수행해야 할 수 있다.\n① 다, 라 ② 나, 라\n③ 나, 다, 라 ④ 가, 다, 라",
  "2022_67": "67. 다음의 구매 데이터로부터 연관규칙 Apriori 알고\n리즘을 통해 도출할 수 있는 연관규칙 중에서 신\n뢰도(confidence)값이 가장 큰 것은?\n고객ID 구매항목\n1 {A, B, C}\n2 {D, A, E}\n3 {A, B, F, G}\n4 {F, B, E}\n5 {A, C, E}\n6 {C, E, H}\n① A → B ② A → C\n③ B → A ④ B → C\n15 -\n\n=== NEW PAGE ===",
  "2022_68": "68. 뷰(view)는 기본 릴레이션이나 이미 정의된 뷰를 사용\n하여 정의된다. 아래 그림은 뷰의 갱신가능성의 수준에\n따른 뷰들의 유형간 포함 관계를 도식화한 것이다. 갱\n신 가능성을 기준으로 볼 때 (ㄱ), (ㄴ), (ㄷ)에 각각\n(가), (나), (다)의 내용을 가장 가깝게 연결한 것은?\n(가) 사용자가 정의할 수 있는 모든 뷰\n(나) 상용 관계 DBMS들이 갱신을 허용하는 뷰\n(다) 이론적으로 갱신이 가능한 뷰\n① (ㄱ)과 (가), (ㄴ)과 (다), (ㄷ)과 (나)\n② (ㄱ)과 (다), (ㄴ)과 (가), (ㄷ)과 (나)\n③ (ㄱ)과 (나), (ㄴ)과 (다), (ㄷ)과 (가)\n④ (ㄱ)과 (가), (ㄴ)과 (나), (ㄷ)과 (다)",
  "2022_69": "69. 데이터 웨어하우스가 일반 데이터베이스와 다른 특\n징에 대한 설명 중 옳지 않은 것은?\n① 주제 지향적(subject-oriented) 내용 : 일반 데이\n터베이스가 업무 처리 중심의 데이터로 구성된 반\n면 데이터 웨어하우스는 의사 결정이 필요한 주제\n를 중심으로 데이터를 구성한다.\n② 통합된(integrated) 내용 : 데이터 웨어하우스는 여\n러 데이터베이스에서 필요한 데이터를 추출하여 의\n사 결정에 필요한 분석 및 비교 작업을 지원한다.\n③ 시간에 따라 변화하지 않는(time-invariant) 내용 :\n일반 데이터베이스는 현재와 과거 데이터를 함께\n유지하지만 데이터 웨어하우스는 현재 시점의 데\n이터만을 유지한다.\n④ 비소멸성(nonvolatile) 내용 : 일반 데이터베이스\n에 저장된 데이터는 삽입, 삭제, 갱신 연산이 자\n주 발생하지만 데이터 웨어하우스는 검색 작업만\n수행되는 읽기 전용의 데이터를 유지한다.",
  "2022_70": "70. 의사결정트리(decision tree) 구축 과정에서 어떤\n노드 N에 클래스 0인 레코드가 1개, 클래스 1인\n레코드가 5개 해당한다고 하자. 이 노드에 대한\n불순도(impurity)를 표현하는 Gini 값으로 가장\n적절한 것은?\n① 0.0 ② 0.278\n③ 0.5 ④ 0.650\n- 1",
  "2022_71": "71. 다음은 정보 검색, 텍스트 마이닝에서 문서 집합\n과 용어에 대한 TFIDF의 개념을 설명한다. 만일,\n문서 집합 D에 다음과 같이 d1, d2의 두 문서만\n존재한다고 할 때, 용어 “this”에 대한 TFIDF\n값이 옳은 것은?\n- TF는 term frequency의 약어로, 해당 용어가 주어\n진 문서에 얼마나 많이 나타나는지를 나타낸다.\n- IDF는 inverse document frequency의 약어로,\n해당 용어가 문서 집합에 얼마나 많이 나타나는\n지에 대한 역수를 나타낸다.\n- TFIDF는 문서 집합에서 특정 단어가 주어진 문\n서 내에서 얼마나 중요한 것인지를 나타내는 통\n계적 수치이다.\n문서 d1 문서 d2\n용어 출현 횟수 용어 출현 횟수\nthis 1 this 2\nis 1 is 1\na 2 another 1\nsample 1 example 1\n① TFIDF(“this”, d1, D) = 0,\nTFIDF(“this”, d2, D) = 0\n② TFIDF(“this”, d1, D) = 0.1,\nTFIDF(“this”, d2, D) = 0.2\n③ TFIDF(“this”, d1, D) = 0.3,\nTFIDF(“this”, d2, D) = 0.3\n④ TFIDF(“this”, d1, D) = 0.2,\nTFIDF(“this”, d2, D) = 0.4",

  "2022_73": "73.935242 4\n5 Los Angles 34.052235 -118.243 4\n6 Warsaw 52.237049 21.017532 5\nSELECT country.country_name, COUNT(city.lat)\nFROM city INNER JOIN country\nON city.country_id = country.id\nGROUP BY country.country_name\nHAVING COUNT(city.lat) <= 1;\n① 차수: 1, 카디널리티: 4\n② 차수: 1, 카디널리티: 5\n③ 차수: 2, 카디널리티: 4\n④ 차수: 2, 카디널리티: 5\n13 -\n\n=== NEW PAGE ===\n\n59. 다음의 릴레이션 R에 대해 릴레이션 C1, C2, C3\n으로 디비전(division) 연산을 수행한 결과 릴레\n이션의 카디널리티(cardinality)의 최소값과 최\n대값을 올바르게 나열한 것은?\nR C1 C2 C3\nA B B B B\n100 C413 C413 C312 C312\n100 E412 C413 C413\n200 C123 E412\n300 C312\n300 C324\n300 C413\n400 C312\n400 C324\n400 C413\n400 E412\n500 C312\n① 1, 2 ② 1, 3\n③ 1, 4 ④ 2, 3\n60. 어떤 스포츠클럽의 개체-관계 모델에서 회원(MEMBER)\n개체와 로커(LOCKER) 개체 간에 1:1 관계가 성립한다.\n회원에게는 로커가 필수적으로 배정되지만, 로커는\n회원이 배정되지 않을 수도 있다. 이 개체-관계 모델\n의 두 개체는 각각 회원 테이블과 로커 테이블로 매\n핑이 되고, 회원 테이블의 기본키는 MID, 로커 테이\n블의 기본키는 LID이다. 두 테이블을 정의하기 위한\nSQL DDL문에 대한 설명으로 가장 적절한 것은?\n가. CREATE TABLE MEMBER 정의문 안에 LID를 외래\n키로 정의한다.\n나. CREATE TABLE LOCKER 정의문 안에 MID를 외래\n키로 정의한다.\n다. 두 개체의 1:1 관계를 표현하기 위해 외래키\n로 정의된 속성에 대한 열 제약조건을 NULL로\n정의한다.\n라. 두 개체의 1:1 관계를 표현하기 위해 외래키\n로 정의된 속성에 대한 열 제약조건을 NOT\nNULL로 정의한다.\n① 가, 다 ② 가, 라\n③ 나, 다 ④ 나, 라\n- 1\n61. 다음과 같은 등록 데이터를 가지고 있는 ENROL 테\n이블이 있다고 하자. 여기서, SNO, CNO, GRADE는\n각각 학번, 과목번호, 성적을 의미한다.\nENROL\nSNO CNO GRADE\n1001 C001 95\n1001 M001 80\n1002 E001 85\n1003 M001 90\n1004 E001 95\n1004 M001 75\n1004 C001 70\n1005 M002 80\n위 테이블에 대해 다음과 같은 SQL문을 실행했을 때\n의 실행 결과 중 3번째 행으로 옳은 것은?\nSELECT CNO, SNO FROM ENROL ORDER BY CNO DESC, GRADE ASC;\nCNO SNO CNO SNO\n① M001 1004 ② M001 1001\n③ E001 1004 ④ C001 1004\n62. 파일 조직의 유형인 비순서 히프파일(heap file)에 대\n한 평균 검색 비용(시간)을 알아보고자 한다. 레코드가\n500,000개, 각 레코드의 길이가 100 바이트, 블록의 크\n기가 4,096 바이트, 한 블록을 읽는데 걸리는 시간은 10\nms 인 매개변수가 주어진 경우, 주어진 특정 레코드를\n찾기 위해 평균적으로 걸리는 시간에 가장 가까운 것은?\n① 121,951 ms ② 125,000 ms\n③ 62,500 ms ④ 31,250 ms\n63. 다음은 검사시점 회복(checkpoint recovery) 기법\n에서 진행되는 주요 작업들을 설명한 것이다. 적\n용 순서가 시간 순으로 옳게 나열된 것은?\n가. REDO-list에 있는 트랜잭션에 대해 REDO 연산을\n수행한다.\n나. <T, Commit> 로그 레코드를 만나면 트랜잭션 T를\nUNDO-list에서 삭제하고 REDO-list에 첨가한다.\n다. 변경된 데이터 버퍼 블록을 전부 디스크로 출\n력시킨다.\n라. UNDO-list에 있는 모든 트랜잭션들에 대해\nUNDO 연산을 수행한다.\n① 나, 가, 라, 다 ② 나, 라, 가, 다\n③ 다, 나, 가, 라 ④ 다, 나, 라, 가\n14 -\n\n=== NEW PAGE ===\n\n64. 다음과 같은 STUDENT 릴레이션과 ENROL 릴레이션이\n있다고 하자.\nSTUDENT\nSNO SNAME AGE\nS001 Kim 20\nS002 Park 22\nS003 Lee 21\nS004 Hong 23\nENROL\nENO SNO COURSE\nE001 S001 자료구조\nE002 S001 알고리즘\nE003 S002 자료구조\nE004 S003 알고리즘\nE005 S003 프로그래밍\nE006 S003 데이터베이스\n다음과 같은 실행 결과가 나오는 SQL 질의문으로 옳\n은 것은?\nSNAME COURSE\nKim 자료구조\nKim 알고리즘\nPark 자료구조\nLee 알고리즘\nLee 프로그래밍\nLee 데이터베이스\nHong NULL\n① SELECT STUDENT.SNAME, ENROL.COURSE\nFROM ENROL INNER JOIN STUDENT\nON ENROL.SNO = STUDENT.SNO;\n② SELECT STUDENT.SNAME, ENROL.COURSE\nFROM STUDENT LEFT OUTER JOIN ENROL\nON STUDENT.SNO = ENROL.SNO;\n③ SELECT STUDENT.SNAME, ENROL.COURSE\nFROM ENROL LEFT OUTER JOIN STUDENT\nON ENROL.SNO = STUDENT.SNO;\n④ SELECT STUDENT.SNAME, ENROL.COURSE\nFROM STUDENT RIGHT OUTER JOIN ENROL\nON STUDENT.SNO = ENROL.SNO;\n- 1\n65. 데이터베이스 보안 기법 중 필수 접근 제어\n(mandatory access control) 기법에 대한 설명으\n로 옳지 않은 것은?\n① 각 데이터 객체에 적정 비밀 등급을 부여하고\n각 사용자도 허가 등급을 지정하여 데이터 객\n체가 적절한 허가 등급을 가진 사용자에 의해\n서만 접근되도록 한다.\n② 통상적인 보안 등급은 TS(극비), S(비밀), C(대\n외비), U(일반)으로 나누는데 이들 간의 순서는\nTS > S > C > U 가 된다.\n③ 데이터 객체 j를 갱신하기 위해서는 사용자 i의\n허가 등급이 데이터 객체 j의 비밀 등급보다 같\n거나 높아야 한다.\n④ 이 필수 접근 제어 기법을 다단계 보안 기법\n(multilevel security scheme)이라고도 한다.\n66. 다음은 데이터베이스 회복(recovery) 기법의 지\n연 갱신(deferred update)과 즉시 갱신\n(immediate update)에 대한 설명이다. 다음 설명\n중에서 옳은 것을 모두 고른 것은?\n가. 지연 갱신에서는 완료(commit) 이전에 실패한\n트랜잭션의 경우 UNDO가 필요하지 않다.\n나. 즉시 갱신은 완료 이후 UNDO와 REDO가 필요하\n지 않기 때문에 NO-UNDO/NO-REDO 알고리즘으\n로 알려져 있다.\n다. 즉시 갱신에서는 완료 이전에 실패한 트랜잭\n션의 경우 UNDO를 수행해야 한다.\n라. 지연 갱신에서는 완료된 트랜잭션에 대해서도\n로그를 사용하여 REDO를 수행해야 할 수 있다.\n① 다, 라 ② 나, 라\n③ 나, 다, 라 ④ 가, 다, 라\n67. 다음의 구매 데이터로부터 연관규칙 Apriori 알고\n리즘을 통해 도출할 수 있는 연관규칙 중에서 신\n뢰도(confidence)값이 가장 큰 것은?\n고객ID 구매항목\n1 {A, B, C}\n2 {D, A, E}\n3 {A, B, F, G}\n4 {F, B, E}\n5 {A, C, E}\n6 {C, E, H}\n① A → B ② A → C\n③ B → A ④ B → C\n15 -\n\n=== NEW PAGE ===\n\n68. 뷰(view)는 기본 릴레이션이나 이미 정의된 뷰를 사용\n하여 정의된다. 아래 그림은 뷰의 갱신가능성의 수준에\n따른 뷰들의 유형간 포함 관계를 도식화한 것이다. 갱\n신 가능성을 기준으로 볼 때 (ㄱ), (ㄴ), (ㄷ)에 각각\n(가), (나), (다)의 내용을 가장 가깝게 연결한 것은?\n(가) 사용자가 정의할 수 있는 모든 뷰\n(나) 상용 관계 DBMS들이 갱신을 허용하는 뷰\n(다) 이론적으로 갱신이 가능한 뷰\n① (ㄱ)과 (가), (ㄴ)과 (다), (ㄷ)과 (나)\n② (ㄱ)과 (다), (ㄴ)과 (가), (ㄷ)과 (나)\n③ (ㄱ)과 (나), (ㄴ)과 (다), (ㄷ)과 (가)\n④ (ㄱ)과 (가), (ㄴ)과 (나), (ㄷ)과 (다)\n69. 데이터 웨어하우스가 일반 데이터베이스와 다른 특\n징에 대한 설명 중 옳지 않은 것은?\n① 주제 지향적(subject-oriented) 내용 : 일반 데이\n터베이스가 업무 처리 중심의 데이터로 구성된 반\n면 데이터 웨어하우스는 의사 결정이 필요한 주제\n를 중심으로 데이터를 구성한다.\n② 통합된(integrated) 내용 : 데이터 웨어하우스는 여\n러 데이터베이스에서 필요한 데이터를 추출하여 의\n사 결정에 필요한 분석 및 비교 작업을 지원한다.\n③ 시간에 따라 변화하지 않는(time-invariant) 내용 :\n일반 데이터베이스는 현재와 과거 데이터를 함께\n유지하지만 데이터 웨어하우스는 현재 시점의 데\n이터만을 유지한다.\n④ 비소멸성(nonvolatile) 내용 : 일반 데이터베이스\n에 저장된 데이터는 삽입, 삭제, 갱신 연산이 자\n주 발생하지만 데이터 웨어하우스는 검색 작업만\n수행되는 읽기 전용의 데이터를 유지한다.\n70. 의사결정트리(decision tree) 구축 과정에서 어떤\n노드 N에 클래스 0인 레코드가 1개, 클래스 1인\n레코드가 5개 해당한다고 하자. 이 노드에 대한\n불순도(impurity)를 표현하는 Gini 값으로 가장\n적절한 것은?\n① 0.0 ② 0.278\n③ 0.5 ④ 0.650\n- 1\n71. 다음은 정보 검색, 텍스트 마이닝에서 문서 집합\n과 용어에 대한 TFIDF의 개념을 설명한다. 만일,\n문서 집합 D에 다음과 같이 d1, d2의 두 문서만\n존재한다고 할 때, 용어 “this”에 대한 TFIDF\n값이 옳은 것은?\n- TF는 term frequency의 약어로, 해당 용어가 주어\n진 문서에 얼마나 많이 나타나는지를 나타낸다.\n- IDF는 inverse document frequency의 약어로,\n해당 용어가 문서 집합에 얼마나 많이 나타나는\n지에 대한 역수를 나타낸다.\n- TFIDF는 문서 집합에서 특정 단어가 주어진 문\n서 내에서 얼마나 중요한 것인지를 나타내는 통\n계적 수치이다.\n문서 d1 문서 d2\n용어 출현 횟수 용어 출현 횟수\nthis 1 this 2\nis 1 is 1\na 2 another 1\nsample 1 example 1\n① TFIDF(“this”, d1, D) = 0,\nTFIDF(“this”, d2, D) = 0\n② TFIDF(“this”, d1, D) = 0.1,\nTFIDF(“this”, d2, D) = 0.2\n③ TFIDF(“this”, d1, D) = 0.3,\nTFIDF(“this”, d2, D) = 0.3\n④ TFIDF(“this”, d1, D) = 0.2,\nTFIDF(“this”, d2, D) = 0.4\n72. 다음 설명 중에서 NoSQL의 특징이나 장점과 가장 거\n리가 먼 것은?\n① NoSQL 시스템은 노드 추가를 통해 저장 공간과 처리\n능력을 증가시킬 수 있어 높은 확장성을 제공한다.\n② NoSQL 시스템은 데이터를 여러 노드에 복제하여\n저장함으로써 고장 허용(fault tolerance) 기능을\n제공한다.\n③ NoSQL 시스템은 파일 레코드에 대한 샤딩\n(sharding)을 사용하여 부하분산을 이룬다.\n④ NoSQL 시스템은 데이터를 여러 노드에 복제 저장\n함으로써 읽기(조회)와 쓰기(갱신) 성능을 개선한\n다.\n16 -\n\n=== NEW PAGE ===\n\n73. 다음 표의 거래 정보에 대해서 최소지지도\n(minsup)를 0.5로 하여 Apriori 알고리즘을 적\n용하고자 할 때, 빈발 2-항목집합(frequent\n2-itemset) 모두를 옳게 나열한 것은?\n거래ID 거래항목 거래ID 거래항목\n1 {A, B, E, F} 6 {A, B, E, F}\n2 {A, D, F} 7 {B, C, D, F}\n3 {A, C, G} 8 {A, B, C, E}\n4 {C, D, E, G} 9 {A, B, E}\n5 {A, B, D, E} 10 {E, F}\n① {A,B}, {A,E}, {B,E}\n② {A,F}, {B,F}, {E,F}\n③ {A,F}, {A,B}, {A,E}, {B,F}, {E,F}, {B,E}\n④ {A,B}, {A,C}, {A,D}, {E,F}, {E,G}, {F,G}",
  "2022_74": "74. 다음은 스팸(Spam) 메일을 인식하기 위해 구축한\n예측모델로부터 얻어진 혼돈행렬(confusion\nmatrix)이다. 이 혼돈행렬로부터 구할 수 있는\n성능척도 값이 옳지 않은 것은?\n예측 클래스\nSpam Non-Spam\nSpam TP = 45 FN = 20\n정답 클래스\nNon-Spam FP = 5 TN = 30\n\n① 정밀도(precision) =\n\n\n\n② 재현율(recall) =\n\n\n\n③ 특이도(specificity) =\n\n\n\n④ 정확도(accuracy) =\n\n\n- 1",
  "2022_75": "75. 다음은 분산 데이터베이스에서의 투명성(transparency)\n에 대한 설명이다. 다음 투명성에 대한 설명 중\n에서 가장 적절하지 않은 것은?\n① 이름부여 투명성(naming transparency)은 분산\n데이터베이스가 어떻게 설계되는지와 어느 사\n이트에서 트랜잭션이 실행되는지를 사용자에게\n가려주는 것을 의미한다.\n② 분산 투명성(distribution transparency) 또는\n네트워크 투명성(network transparency)은 사\n용자에게 네트워크의 세부 사항과 분산 시스템\n내에서 데이터 저장 장소의 위치를 가려주는\n것을 의미한다.\n③ 위치 투명성(location transparency)은 어떤 작\n업을 수행하기 위해 사용된 명령은 데이터의 위\n치와 명령이 입력된 시스템의 위치와 무관해야\n함을 의미한다.\n④ 중복 투명성(replication transparency)은 높은\n가용성, 성능, 신뢰도를 위해 데이터 사본들이\n여러 사이트에 중복될 수 있음을 의미하며, 중\n복된 사본의 존재를 사용자에게 가려준다.\n17 -\n\n=== NEW PAGE ===\n\n시스템 구조",
  "2023_51": "51. ISO 8000의 데이터 품질 기준 관련하여 다음 괄\n호안에 적합한 용어는?\n( ) 오류는 데이터가 표준 코드 값 또는 표준\n도메인 값에 위배될 경우 발생한다.\n① 충분성 ② 사실성\n③ 적합성 ④ 필수성",
  "2023_52": "52. 고정 길이 레코드 방식을 사용할 때, 레코드의\n길이가 300 바이트, 블록의 크기가 4096 바이트,\n블록 헤더의 길이가 12 바이트라고 가정한다. 다\n음 중 15개의 레코드를 저장하는 상황을 잘 표현\n한 것은?\n① 첫 번째 블록에는 196 바이트가 남는다.\n② 두 번째 블록에는 3,484 바이트가 남는다.\n③ 두 번째 블록에는 3,494 바이트가 남는다.\n④ 두 번째 블록에는 3,784 바이트가 남는다.",
  "2023_53": "53. 다음 ERD(Entity Relationship Diagram)에서\n수퍼키(superkey)에 해당되지 않는 것은? (단,\nRegistration과 Vehicle_id는 각각 후보키이다.)\n① (State, Year, Model)\n② (Vehicle_id, Number)\n③ (Registration, State)\n④ (Registration, Vehicle_id, Year)",
  "2023_54": "54. 릴레이션 R과 S에 대하여 |R| = 7, |S| = 6이다.\n다음 릴레이션 연산결과의 상한값 중 가장 작은\n값은?\n① |R∪S| ② |R∩S|\n③ |R-S| ④ |R×S|\n- 11",
  "2023_55": "55. ER 모델의 약한 개체(weak entity)에 대한 설명\n으로 옳지 않은 것은?\n① 자기 자신의 키 속성을 가지지 않는 개체 타입\n을 약한 개체 타입이라고 한다.\n② 약한 개체를 강한 개체와 연결시키는 관계 타입\n을 식별 관계라고 부른다.\n③ 약한 개체가 식별 관계에 대해 전체 참여 제약\n을 가질 필요는 없다.\n④ 모든 존재 종속(existence dependency)이 약한\n개체 타입이 될 필요는 없다.",
  "2023_56": "56. 다음 ER 다이어그램을 관계 모델로 변환할 경우\n릴레이션의 개수로 가장 적절한 것은? (단, ER\n다이어그램의 이중선은 전체 참여를, 이중타원은\n다치 속성을, 밑줄을 친 속성은 키 속성을 의미\n한다.)\n① 2 ② 3\n③ 4 ④ 5",
  "2023_57": "57. 다음 뷰(view)의 변경 연산에 대해 적절하게 설\n명된 것을 모두 나열한 것은?\n가. 두 개 이상의 테이블이 관련되어 정의된 뷰는\n변경할 수 없다.\n나. DISTINCT, GROUP BY가 사용되어 정의된 뷰는\n변경할 수 없다.\n다. 기본 테이블의 기본 키를 구성하는 속성이 포함\n되어있지 않은 뷰는 변경할 수 없다.\n라. 뷰의 열이 상수나 산술 연산자 또는 함수가 사용\n된 산술식으로 만들어진 뷰는 변경할 수 없다.\n① 가, 다, 라 ② 나, 다, 라\n③ 가, 나, 라 ④ 가, 나, 다, 라\n1 -\n\n=== NEW PAGE ===",
  "2023_58": "58. 속성 X, Y, Z를 포함하는 릴레이션 R(X, Y, Z)에\n존재하는 함수 종속(functional dependency)에서\n항상 성립하는 추론 규칙으로 옳지 않은 것은?\n① X ⊇ Y 이면 X → Y\n② X → YZ 이면 X → Y 이고 X → Z\n③ X → Y 이면 임의의 Z에 대해 XZ → YZ\n④ XZ → YZ 이면 임의의 Z에 대해 X → Y",
  "2023_59": "59. 다음 릴레이션 A(P, Q, R)와 B(Q, R, S)에 대해\n결과 릴레이션 C(P, Q, R, S)가 나오도록 하는\n관계 대수 연산으로 옳은 것은?\nA B C\nP Q R S\np1 q1 r1 s1\nP Q R\np1 q1 r1 s2\nQ R S\np1 q1 r1\np2 q1 r1 s1\nq1 r1 s1\np2 q1 r1\np2 q1 r1 s2\nq1 r1 s2\np3 q1 r2\np3 q1 r2 NULL\nq2 r3 s3\np4 q2 r3\np4 q2 r3 s3\n① A ⋈ B (자연 조인) ② A ⋈+ B (외부 조인)\nN\n③ A ⋉ B (세미 조인) ④ A ⋃+ B (외부 합집합)",
  "2023_60": "60. EMPLOYEE 테이블의 Dno 열에 대해 다음과 같은\n참조 무결성이 선언되었다고 할 때, 이와 관련된\n설명으로 옳은 것은?\nCONSTRAINT EmpDeptFK\nFOREIGN KEY(Dno) REFERENCES DEPARTMENT(Dnumber)\nON DELETE SET DEFAULT\nON UPDATE CASCADE\n① EMPLOYEE 테이블의 Dno 값이 삭제되면 DEPARTMENT\n의 Dnumber 값은 디폴트 값으로 설정된다.\n② EMPLOYEE 테이블의 Dno 값이 갱신되면 DEPARTMENT\n의 Dnumber 값도 그 값으로 갱신된다.\n③ DEPARTMENT의 Dnumber 값이 삭제되면 EMPLOYEE\n테이블의 Dno 값은 NULL 값으로 설정된다.\n④ DEPARTMENT의 Dnumber 값이 갱신되면 EMPLOYEE\n테이블의 Dno 값도 그 값으로 갱신된다.\n- 12",
  "2023_61": "61. 다음과 같은 함수 종속을 가진 릴레이션 R을\nBCNF로 정규화한 결과로 옳은 것은? (단, 아래\n지문에서 밑줄친 열은 기본키, 이탤릭체는 외래\n키를 의미한다.)\nR(A, B, C, D)\n함수종속: A→(B, C, D), B→(A, C, D), D→C\n① R1(A, B, D), R2(D, C)\n② R1(A, B, C), R2(C, D)\n③ R1(A, B, C), R2(B, D)\n④ R1(A, C, D), R2(B, A)",
  "2023_62": "62. 다음 Sailors, Boats, Reserves 3개의 릴레이션에\n서 질의 “color가 'red'인 Boat와 'green'인\nBoat를 모두 reserve한 Sailor의 sname을 검색하\n라.”를 SQL로 나타낸 문장으로 옳은 것은? (단,\nSailors, Boats, Reserves 릴레이션 각각의 기\n본 키는 sid, bid, (sid, bid)이다.)\nSailors(sid, sname, rating, age)\nBoats(bid, bname, color)\nReserves(sid, bid, day)\n① SELECT S.sname\nFROM Sailors S, Reserves R, Boats B\nWHERE S.sid = R.sid AND R.bid = B.bid AND\n(B.color = 'red' OR B.color = 'green');\n② SELECT S.sname\nFROM Sailors S, Reserves R, Boats B\nWHERE S.sid = R.sid AND R.bid = B.bid AND\n(B.color = 'red' AND B.color = 'green');\n③ SELECT S.sname\nFROM Sailors S, Reserves R1, Boats B1,\nReserves R2, Boats B2\nWHERE S.sid = R1.sid AND R1.bid = B1.bid\nAND S.sid = R2.sid AND R2.bid = B2.bid AND\nB1.color = 'red' AND B2.color = 'green';\n④ SELECT S.sname\nFROM Sailors S, Reserves R, Boats B\nWHERE S.sid = R.sid AND R.bid = B.bid AND\nB.color = 'red'\nUNION\nSELECT S2.sname\nFROM Sailors S2, Boats B2, Reserves R2\nWHERE S2.sid = R2.sid AND R2.bid = B2.bid\nAND B2.color = 'green';\n2 -\n\n=== NEW PAGE ===",
  "2023_63": "63. 다음 STUDENT(학생)와 ENROLL(수강) 릴레이션에서\n“Cno가 ‘C413’인 과목을 수강한 학생의 Sname,\nDept와 수강의 Grade를 검색하라.”는 질의를 SQL\n로 나타낸 문장으로 옳은 것은? (단, STUDENT와\nENROLL 릴레이션 각각의 기본 키는 Sno, (Sno,\nCno)이다.)\nSTUDENT(Sno, Sname, Year, Dept)\nENROLL(Sno, Cno, Grade)\n① SELECT Sname, Dept, Grade\nFROM STUDENT JOIN ENROLL WITH(Sno)\nWHERE ENROLL.Cno = 'C413';\n② SELECT Sname, Dept, Grade\nFROM STUDENT NATURAL JOIN ENROLL USING(Sno)\nWHERE ENROLL.Cno = 'C413';\n③ SELECT Sname, Dept, Grade\nFROM STUDENT NATURAL JOIN ENROLL ON\n(STUDENT.Sno = ENROLL.Sno)\nWHERE ENROLL.Cno = 'C413‘;\n④ SELECT Sname, Dept, Grade\nFROM STUDENT JOIN ENROLL ON (STUDENT.Sno =\nENROLL.Sno)\nWHERE ENROLL.Cno = 'C413';",
  "2023_64": "64. 다음 그림은 트랜잭션 T1~T5에 대해 각각의 수행\n시간을 표기하였다. 트랜잭션 수행 중 체크 포인\n트를 실시하였고, 그 이후 시스템이 다운되었다.\n시스템이 재가동될 때 수행되는 회복 기능으로\n가장 적절한 것은?\n① T2, T4 트랜잭션은 재수행한다.\n② T2, T4 트랜잭션은 취소한다.\n③ T3, T4, T5 트랜잭션은 재수행한다.\n④ T3, T4, T5 트랜잭션은 취소한다.\n- 13",
  "2023_65": "65. 다음은 릴레이션 EMPLOYEE와 DEPENDENT를 생성\n하는 데이터 정의문이다. 두 릴레이션에 대해\n“자신의 부양가족과 이름이 같은 직원의 이름\n(Name)을 출력하라”를 처리하는 SQL 질의를 모\n두 나열한 것은?\nCREATE TABLE EMPLOYEE (\nName VARCHAR(15) NOT NULL,\nSsn CHAR(9) NOT NULL,\nPRIMARY KEY (Ssn) );\nCREATE TABLE DEPENDENT (\nEssn CHAR(9) NOT NULL,\nName VARCHAR(15) NOT NULL,\nPRIMARY KEY(Essn, Name),\nFOREIGN KEY(Essn) REFERENCES EMPLOYEE(Ssn) );\n가.SELECT E.Name\nFROM EMPLOYEE AS E\nWHERE E.Ssn IN (SELECT Essn FROM DEPENDENT AS D\nWHERE E.Name=D.Name );\n나.SELECT E.Name\nFROM EMPLOYEE AS E\nWHERE EXISTS (SELECT * FROM DEPENDENT AS D\nWHERE E.Ssn=D.Essn AND E.Name=D.Name );\n다. SELECT E.Name\nFROM EMPLOYEE AS E, DEPENDENT AS D\nWHERE E.Ssn=D.Essn AND E.Name=D.Name;\n① 가, 나 ② 가, 다\n③ 가, 다 ④ 가, 나, 다",
  "2023_66": "66. 다음 그림은 트랜잭션의 동시성 제어에서 격리\n성(isolation)을 나타내는 예로써, 트랜잭션\nT1, T2가 ➀~➄ 순서대로 수행할 때 생길 수 있\n는 현상으로 가장 적절한 것은?\nT1 T2\n➀ SELECT 도시, COUNT(*)\nFROM 고객\nGROUP BY 도시;\n➁ INSERT INTO 고객\n(고객번호, 이름, 도시, 나이)\nVALUES (3, ‘김민재’,\n‘통영’, 27);\n➂ COMMIT;\n➃ SELECT 나이, COUNT(*)\nFROM 고객\nGROUP BY 나이;\n➄ COMMIT;\n① 오손 데이터 읽기(dirty read)\n② 유령 데이터 읽기(phantom read)\n③ 연쇄 데이터 읽기(cascading read)\n④ 직렬 데이터 읽기(serializable read)\n3 -\n\n=== NEW PAGE ===",
  "2023_67": "67. 동시성 제어(concurrency control)의 로킹\n(locking) 단위에 대한 다음 설명 중 옳은 것\n을 모두 나열한 것은?\n가. 로킹 단위가 작아지면 동시성(병행) 수준은\n낮아진다.\n나. 데이터베이스, 파일, 레코드 등은 로킹 단위\n가 될 수 있다.\n다. 로킹 단위가 작아지면 일반적으로 로킹 오버\n헤드가 증가한다.\n라. 한꺼번에 로킹할 수 있는 데이터의 크기를\n로킹 단위라 한다.\n① 가, 다 ② 가, 나, 라\n③ 나, 다, 라 ④ 가, 나, 다, 라",
  "2023_68": "68. 로킹 규약 중에서 strict 2단계 로킹 규약(strict\n2PLP)에 해당하는 설명으로 가장 적절한 것은?\n① 데이터 항목에 대해 read나 write 연산을 하려\n면 반드시 lock을 걸고 트랜잭션 실행을 종료하\n기 전에 unlock을 수행\n② 로크를 걸기만 하는 확장 단계와 로크를 풀기만\n하는 축소 단계로 구성\n③ 로킹이 2단계일 뿐 아니라 모든 독점 로크는 그\n트랜잭션이 완료될 때까지 unlock하지 않고 그\n대로 유지\n④ 로킹이 2단계일 뿐 아니라 모든 로크는 그 트랜잭\n션이 완료될 때까지 unlock하지 않고 그대로 유지",
  "2023_69": "69. 대표적인 분산 파일 시스템인 HDFS(Hadoop\nDistributed File System)는 여러 노드(node)\n로 구성되어 있다. 다음의 (가), (나)에 들어\n갈 노드 이름으로 가장 옳은 것은?\n⦁(가)는 메타정보를 관리하며 데이터 블록들이\n어느 (나)에 있는지를 유지한다.\n⦁(나)는 실제 데이터 블록을 저장하고 클라이언\n트에 이를 제공한다.\n⦁Secondary (가)는 primary (가)가 고장(fail)일\n때를 대비하는 백업 노드이다.\n① (가) master node, (나) data node\n② (가) name node, (나) data node\n③ (가) master node, (나) slave node\n④ (가) name node, (나) slave node\n- 14",
  "2023_70": "70. 다음 SQL 구문은 테이블 STUDENT에 대한 SELECT\n와 UPDATE 권한을 admuser에게 부여하는 기능을\n한다. 그런데 이때 권한을 부여받은 admuser가\n다른 사용자에게 SELECT나 UPDATE 권한을 다시\n부여할 수 있도록 하기 위해서 (가)에 들어갈\n구문으로 가장 옳은 것은?\nGRANT SELECT, UPDATE ON STUDENT TO admuser (가);\n① WITH OPTION GRANT ② WITH OPTION REGRANT\n③ WITH GRANT OPTION ④ WITH REGRANT OPTION",
  "2023_71": "71. 분산 데이터베이스 시스템에서 분산 투명성에 대\n한 설명으로 적절하지 않은 것은?\n① 데이터의 실제 저장 위치를 알 필요 없이 데이\n터베이스의 논리적 이름만으로 데이터에 접근할\n수 있는 위치 투명성(location transparency)을\n보장해야 한다.\n② 분산 데이터베이스와 관련된 트랜잭션들이 동시\n에 수행되더라도 항상 일관성을 유지하는 장애\n투명성(failure transparency)을 보장해야 한다.\n③ 동일한 데이터가 여러 지역에 중복해서 저장되\n는 경우 사용자가 중복을 인식하지 못하게 하는\n중복 투명성(replication transparency)을 보장\n해야 한다.\n④ 하나의 릴레이션을 더 작은 조각(단편)으로 나누\n고 각 조각을 별개의 릴레이션으로 처리할 때 완\n전성, 회복성, 분리성을 보장하는 단편화 투명성\n(fragmentation transparency)을 보장해야 한다.",
  "2023_72": "72. NoSQL 시스템의 특징을 표현하는 CAP 이론에 대\n한 설명으로 가장 적절하지 않은 것은?\n① 복제본을 가지는 분산 시스템의 요구사항을 설\n명한다.\n② 일관성(consistency), 가용성(availability), 분할\n감내(partition tolerance) 성질을 의미한다.\n③ NoSQL 시스템에서는 CAP의 세 가지 성질을 모두\n보장할 것을 요구한다.\n④ NoSQL 시스템에서는 보통 일관성의 완화된 형태\n인 궁극적 일관성(eventual consistency)을 수\n용한다.\n4 -\n\n=== NEW PAGE ===",
  "2023_73": "73. 멀티미디어 데이터에 대한 다양한 유형의 검색\n질의를 처리하기 위한 기법 중 “수학 함수로\n저장된 데이터와 질의 조건으로 주어진 데이터\n간의 유사도를 수학 함수로 계산하여 유사도가\n높은 데이터를 검색한다.”는 어떤 기법을 설명\n한 것인가?\n① 랭킹 기법(ranking technique)\n② 인덱스 기법(index technique)\n③ 매칭 기법(matching technique)\n④ 필터링 기법(filtering technique)",
  "2023_74": "74. 다음 (가)부터 (라)는 관계형 데이터베이스와\nNoSQL의 몇 가지 측면을 기술해 놓은 것이다. 이\n들 중 관계형 데이터베이스보다 비교적 NoSQL에\n가까운 측면을 기술한 것을 모두 선택한 것으로\n가장 적절한 것은?\n(가) 스키마: 스키마가 없거나 변경이 자유롭다.\n(나) 확장성: 클러스터 환경에 적합하다.\n(다) 검색기능: 단순한 데이터 검색 기능을 제공한다.\n(라) 트랜잭션: 일관성 유지를 보장하기 어렵다.\n① 가, 라 ② 가, 나, 라\n③ 나, 다, 라 ④ 가, 나, 다, 라",
  "2023_75": "75. 다음은 k-Means 군집화(k-Means clustering) 알\n고리즘에 대한 설명이다. 옳은 것을 모두 나열\n한 것은?\n(가) 초기 중심점 선택에 따라 군집 결과가 달라\n질 수 있다.\n(나) 군집 모양이 구형(원형)이 아닐 경우에 다른\n방법보다 잘 동작한다.\n(다) 이상치(outlier)를 포함하고 있는 경우 잘\n동작하지 않는다.\n① 가, 나 ② 가, 다\n③ 나, 다 ④ 가, 나, 다\n- 15\n5 -\n\n=== NEW PAGE ===\n\n시스템 구조",
  "2024_51": "51. 다음은 빅데이터 시스템의 NoSQL 데이터 모델\n중 하나를 설명한다. 이 데이터 모델의 명칭으로\n가장 올바른 것은?\n· JSON(JavaScript Object Notation)을 기반으로\n하여 복잡한 구조의 객체를 데이터로 저장한다.\n· 대표적인 제품으로는 MongoDB가 있다.\n① 문서 기반 데이터 모델(document based data model)\n② 객체 지향 데이터 모델(object-oriented data model)\n③ 구조 기반 데이터 모델(structure based data model)\n④ 자바 기반 데이터 모델(Java based data model)",
  "2024_52": "52. 다음에 주어진 관계 대수(relational algebra) 연산의\n결과에서 결과 테이블의 카디널리티(cardinality)가\n가장 큰 것과 가장 작은 것의 합으로 옳은 것은?\nR S\nA B B C\n1 10 10 a\n1 30 20 b\n2 10 30 c\n2 30\n2 20\n3 30\nR÷(∏ (S))\nB\nR⋈ S\nN\nR⋈ S\nR.B<S.B\nσ (R)\nB=10\n① 6 ② 7\n③ 8 ④ 11",
  "2024_53": "53. 릴레이션 R과 S의 속성 A를 통한 이원 조인\n(two-way join)의 구현 방법 중에서 릴레이션 R과\nS가 조인 속성 A에 대해 오름차순으로 정렬되어\n있을 경우에만 적용 가능한 방법은?\n① 중첩 루프 ② 인덱스 검사\n③ 해시 검사 ④ 정렬 합병\n- 10",
  "2024_54": "54. 낙관적 로킹(optimistic locking)과 비관적 로킹\n(pessimistic locking)에 대한 설명 중 옳지 않은 것은?\n① 일반적으로 인터넷은 비정형적이고 체계화되지\n않은 곳이므로 사용자들이 트랜잭션 수행 중에\n작업을 중단하는 등의 예상치 못한 행동을 하여\n비관적 로킹을 사용하는 것이 더 효율적이다.\n② 만약 트랜잭션이 복잡하거나 클라이언트의 속도\n가 느린 경우 낙관적 로킹을 사용하면 극적으로\n생산성을 향상시킬 수 있다.\n③ 낙관적 로킹의 장점은 작업이 종료된 후에만 로\n크를 획득하기 때문에 비관적 로킹보다 로크를\n가지고 있는 시간이 훨씬 짧다는 것이다.\n④ 응용의 특성상 특정한 행에 많은 작업을 해야\n하는 트랜잭션의 경우에는 비관적 로킹을 사용\n하는 것이 더 효율적이다.",
  "2024_55": "55. 세 개의 릴레이션 스키마가 고객(고객번호, 이름,\n주소), 계좌(계좌번호, 지점명, 잔고), 예금자(고객\n번호, 계좌번호, 계좌생성날짜)이고 각각의 기본\n키는 밑줄 친 속성이라고 하자. 계좌 릴레이션의\n투플이 삭제되면 해당 예금자 릴레이션의 투플도\n같이 삭제되도록 하는 방법으로 옳은 것은?\n① 예금자 릴레이션을 생성할 때 FOREIGN KEY(계좌\n번호) REFERENCES 계좌(계좌번호) ON DELETE\nCASCADE 명령어를 추가한다.\n② 예금자 릴레이션을 생성할 때 FOREIGN KEY(계좌\n번호) REFERENCES 계좌(계좌번호) IN DELETE\nCASCADE 명령어를 추가한다.\n③ 계좌 릴레이션을 생성할 때 FOREIGN KEY(계좌번\n호) REFERENCES 예금자(계좌번호) ON DELETE\nCASCADE 명령어를 추가한다.\n④ 계좌 릴레이션을 생성할 때 FOREIGN KEY(계좌번\n호) REFERENCES 예금자(계좌번호) IN DELETE\nCASCADE 명령어를 추가한다.\n0 -\n\n=== NEW PAGE ===",
  "2024_56": "56. 다음 E-R 다이어그램을 관계 모델로 표현한 결과\n로 가장 적절한 것은? (단, 밑줄은 기본 키, 이탤\n릭체는 외래 키를 의미한다.)\n① STUDENT(SNO, Name, CNO, Grade), COURSE(CNO,\nCName)\n② STUDENT(SNO, Name), COURSE(CNO, CName,\nSNO, Grade)\n③ STUDENT(SNO, Name), COURSE(CNO, CName),\nENROL(Grade)\n④ STUDENT(SNO, Name), COURSE(CNO, CName),\nENROL(SNO, CNO, Grade)",
  "2024_57": "57. 다음은 릴레이션 R(A, B, C, D)에 대하여 <함수적\n종속성>과 <분해>를 각각 보인 것이다. 분해한 후 릴\n레이션 R1, R2의 정규형이 모두 BCNF 이상인 것은\n어느 것인가?\n① <함수적 종속성> (A, B)→D, B→C, C→D\n<분해> R1(A, B), R2(B, C, D)\n② <함수적 종속성> A→B, B→C, C→D\n<분해> R1(A, B, C), R2(C, D)\n③ <함수적 종속성> (A, B)→C, C→D, C→A\n<분해> R1(A, B, C), R2(C, D)\n④ <함수적 종속성> (A, B)→CD, C→A\n<분해> R1(A, C), R2(B, C, D)",
  "2024_58": "58. 다음과 같은 다치 종속과 함수 종속이 존재한다고\n할 때 제4정규형(4NF)에 해당하는 테이블로 옳은\n것은?\n직원이름↠학위명, 직원이름↠형제이름,\n직원이름↠담당상품번호,\n파트키트명↠파트명, 파트키트명→가격\n① 직원_학위(직원이름, 학위명)\n② 직원_학위_형제(직원이름, 학위명, 형제이름)\n③ 파트키트_파트_가격(파트키트명, 파트명, 가격)\n④ 직원_상품_학위(직원이름, 담당상품번호, 학위명)\n- 11",
  "2024_59": "59. 인덱스에 저장되어 있는 ROWID는 오브젝트 번호,\n데이터 파일 번호, 블록 번호와 같은 물리적 요소\n들로 구성되어 있다. <보기>는 인덱스 ROWID를\n이용해 테이블 블록을 읽는 전체 메커니즘 중 일\n부 과정을 보여준다. 이를 순서대로 올바르게 나\n열한 것은?\n<보기>\nㄱ. LRU 리스트를 스캔하면서 빈 버퍼를 찾는다.\nㄴ. 디스크에서 블록을 읽어 버퍼 캐시에 적재한다.\nㄷ. 해시 버켓에 연결된 해시 체인을 스캔하면서\n블록 헤더를 찾는다.\nㄹ. 인덱스에서 하나의 ROWID를 읽고 디스크상의\n블록위치정보를 해시 함수에 적용해 해시값을\n확인한다.\nㅁ. Dirty 버퍼를 디스크에 기록해 빈 버퍼를 확보\n한다.\n① ㅁ – ㄱ - ㄴ – ㄹ - ㄷ\n② ㄹ - ㄷ - ㄱ - ㅁ - ㄴ\n③ ㄷ - ㄹ - ㄱ – ㄴ - ㅁ\n④ ㄹ - ㄷ - ㅁ – ㄱ – ㄴ",
  "2024_60": "60. 아래와 같은 STUDENT 테이블과 ENROLL 테이블에\n대한 <SQL 질의문>이 수행될 때, 생성되는 결과 테\n이블의 카디널리티(cardinality)로 옳은 것은?\nSTUDENT\nSNO SNAME AGE\nS01 Kim 20\nS02 Park 22\nS03 Lee 21\nS04 Hong 23\nS05 Hwang 20\nENROLL\nENO SNO GRADE\nE01 S01 B\nE03 S05 A\nE04 S03 C\nE05 S03 B\nE06 S06 A\n<SQL 질의문>\nSELECT STUDENT.SNO, ENROLL.ENO, ENROLL.GRADE\nFROM STUDENT LEFT OUTER JOIN ENROLL\nON STUDENT.SNO = ENROLL.SNO;\n① 4 ② 5 ③ 6 ④ 7\n1 -\n\n=== NEW PAGE ===",
  "2024_61": "61. 다음의 세 테이블로 구성된 회사 데이터베이스에\n서 <보기>의 질의문이 실행되었을 때 질의 결과\n의 내용을 설명한 것으로 옳은 것은? (단, 테이블\n의 기본 키는 밑줄로 표시되어 있다.)\n직원(직원번호, 이름, 생일, 주소, 부서번호)\n부서(부서번호, 부서명, 관리자_직원번호)\n부양가족(부양직원번호, 부양가족이름, 성별, 관계)\n<보기>\nSELECT 이름\nFROM 직원\nWHERE EXISTS (SELECT *\nFROM 부양가족\nWHERE 직원번호 = 부양직원번호)\nAND\nEXISTS (SELECT *\nFROM 부서\nWHERE 직원번호 = 관리자_직원번호);\n① 적어도 한 명의 부양가족을 가진 직원의 이름을\n검색하라.\n② 적어도 한 명의 부양가족을 가진 관리자의 이름\n을 검색하라.\n③ 부양가족이 있거나 관리자 역할을 하는 직원의\n이름을 검색하라.\n④ 관리자인 직원의 부양가족의 이름을 검색하라.",
  "2024_62": "62. 검색 엔진의 평가 척도에 대한 설명으로 적절하지\n않은 것은?\n① 리콜(recall)은 데이터베이스에 있는 전체 관련 문\n서 중에서 실제 검색된 관련 문서의 비율이다.\n② 주어진 질의에 대한 관련 문서가 10개라고 할\n때, 5개의 문서를 검색했는데 관련된 문서가 3\n개라면 정확도(precision)는 60%이고 리콜(recall)\n은 30%이다.\n③ 랭킹(ranking)이 주어된 검색 결과에서 평균 정확\n도(average precision)는 검색 결과 중 관련이 있\n는 문서들의 정확도 값의 평균을 구한 것이다.\n④ F-스코어(F-score)는 정확도(precision)와 리콜\n(recall)의 조화 평균으로 두 값 중 더 큰 쪽으\n로 가까워지는 경향이 있다.\n- 12",
  "2024_63": "63. 다음의 데이터베이스에서 (가)는 VIEW를 생성한\n것이고 (나)는 생성된 VIEW에 대한 검색 명령어\n이다. 이 검색 명령어가 실제 실행되기 위해서\n질의 변경(query modification)되는 SQL 명령어로\n옳은 것은? (단, Students, Enrolled 릴레이션 각\n각의 기본 키는 밑줄 친 속성이다.)\nStudents\nsid name age\n53666 Jones 18\n53688 Smith 18\n53650 Smith 19\nEnrolled\ncid sid name grade\n101 53666 DB B\n101 53688 DB C\n102 53666 OS A\n(가) CREATE VIEW BStudents (name, sid, cid)\nAS SELECT S.name, S.sid, E.cid\nFROM Students S, Enrolled E\nWHERE S.sid=E.sid AND E.grade=‘B’;\n(나) SELECT name\nFROM BStudents\nWHERE cid=‘101’;\n① SELECT S.name\nFROM Students S, Enrolled E\nWHERE E.grade=‘B’ AND E.cid=‘101’;\n② SELECT E.name\nFROM Students S, Enrolled E\nWHERE E.grade=‘B’ AND E.cid=‘101’;\n③ SELECT S.name\nFROM Students S, Enrolled E\nWHERE S.sid=E.sid AND E.grade=‘B’\nAND E.cid=‘101’;\n④ SELECT E.name\nFROM Students S, Enrolled E\nWHERE S.sid=E.sid AND E.grade=‘B’\nAND E.cid=‘101’;\n2 -\n\n=== NEW PAGE ===",
  "2024_64": "64. 다음은 자동차 소유주(OWNER)와 차량(VEHICLE)의\n관계를 EER 모델로 표현한 것이다. 이 EER 모델에\n서 사람(PERSON), 은행(BANK), 회사(COMPANY) 개\n체가 자동차 소유주가 될 수 있음을 표현하기 위해\n사용된 모델링 개념으로 옳은 것은?\n① 세분화(specialization) ② 일반화(generalization)\n③ 범주(category) ④ 집단화(aggregation)",
  "2024_65": "65. <보기>는 트리거(trigger)와 저장 프로시저(stored\nprocedure)의 특성을 설명한 것이다. 저장 프로시\n저에 해당하는 특성만을 모아놓은 것으로 가장\n적절한 것은?\n<보기>\nㄱ. 입력 인자를 받을 수 있고 결과를 돌려줄 수 있다.\nㄴ. 테이블이나 뷰에 할당된다.\nㄷ. INSERT, DELETE, UPDATE 명령 실행시 DBMS에\n의하여 수행된다.\nㄹ. 데이터베이스에 저장되어 필요시 컴파일되며 데이\n터베이스에 부속된다.\n① ㄱ, ㄴ ② ㄴ, ㄷ\n③ ㄱ, ㄹ ④ ㄷ, ㄹ",
  "2024_66": "66. 정보검색(information retrieval)을 위한 텍스트 전\n처리 과정 중 스테밍(stemming) 단계의 결과로 옳\n은 것은?\n① 중요한 개념들의 리스트와 각 개념을 기술하는\n주요 단어들로 구성된다.\n② 매우 자주 사용되는 단어들이나 문장 의미에는\n거의 기여하지 못한다.\n③ 원래 단어의 접두사나 접미사를 잘라낸 후에 얻\n는 단어이다.\n④ 문서 컬렉션에서 80% 이상 등장하는 단어들이다.\n- 13",
  "2024_67": "67. 질의 최적화에서는 주어진 식을 다른 식으로 변\n경하기 위해 동등 규칙(equivalence rule, ≡)을\n사용한다. 관계 대수(relational algebra)에 대한\n다음 규칙 중에서 올바른 동등 규칙을 모두 나열\n한 것은?\n가.\n나.\n다.\n라.\n① 가, 다\n② 가, 나, 다\n③ 나, 다, 라\n④ 가, 나, 다, 라",
  "2024_68": "68. 다음에서 ⓐ는 EMPLOYEE의 스키마와 속성을 설\n명하고, 질의 ⓑ는 “5번 부서에 근무하는 모든\n사원보다 급여가 많은 사원을 검색하라”를, 질의\nⓒ는 “5번 부서에 근무하는 어느 한 사원보다\n급여가 많은 사원을 검색하라”를 각각 나타낸다.\n다음 질의에서 ㉮와 ㉯에 들어갈 내용으로 가장\n올바른 것은?\nEMPLOYEE\nⓐ EID NAME SALARY DNO\n사원 번호 이름 급여 부서 번호\nSELECT NAME\nFROM EMPLOYEE\nⓑ WHERE SALARY ㉮ ( SELECT SALARY\nFROM EMPLYEE\nWHERE DNO=5);\nSELECT NAME\nFROM EMPLOYEE\nⓒ WHERE SALARY ㉯ ( SELECT SALARY\nFROM EMPLYEE\nWHERE DNO=5);\n㉮ ㉯\n① > EVERY > ONE\n② > ALL > ONE\n③ > EVERY > ANY\n④ > ALL > ANY\n3 -\n\n=== NEW PAGE ===",
  "2024_69": "69. 부서(DEPARTMENT) 개체와 직원(EMPLOYEE) 개체\n사이에 1:N 소속 관계가 존재하고, 부서는 이 관계\n에 부분 참여하고, 직원은 이 관계에 전체 참여한\n다고 하자. 즉, 부서에는 최소 0명, 최대 N명의 직\n원이 소속되고, 직원은 최소 1개, 최대 1개의 부서\n에 소속이 된다. 이러한 상황을 반영하여 부서(부서\n명, 예산코드), 직원(직원번호, 이름, 이메일, 입사\n일, 부서명) 테이블을 생성하려 한다고 하자. 최소\n카디널리티(cardinality)를 준수하도록 하기 위한 조\n치로 가장 적절한 것은? (여기서, 밑줄은 기본 키,\n이탤릭체는 외래 키를 의미한다.)\n① 전형적인 1:N 관계로 특별히 문제될 것이 없는\n상황이다.\n② 직원 테이블의 부서명 속성을 ‘NOT NULL’인 외\n래 키로 정의한다.\n③ 부서 테이블에 대한 투플 입력시 직원 테이블에\n투플을 삽입하는 트리거(trigger)를 작성한다.\n④ 복잡한 트리거의 조합을 필요로 하고 트리거는\n서로에게 로크를 걸 수 있다.",
  "2024_70": "70. 다음은 릴레이션 R1(id, age), R2(id, age)와 <SQL\n질의문>이다. <SQL 질의문>의 실행결과로 가장 적\n절한 것은?\nR1 R2\nid age id age\n1 10 3 30\n2 20 4 40\n3 30 5 NULL\n4 NULL\n<SQL 질의문>\nSELECT * FROM R1\nWHERE R1.age NOT IN (SELECT age FROM R2);\n① id age ② id age\n1 10 1 10\n2 20 2 20\n4 NULL\n③ id age ④ id age\n1 10\n2 20\n3 30\n4 NULL\n- 14",
  "2024_71": "71. 다음 확장성 해시(extendible hash) 파일에서 전역\n깊이(global depth)를 (가)로 나타내고 지역 깊이\n(local depth)를 (나)로 나타낸다고 할 때, 모조키\n가 000010인 레코드가 삽입된 후, 변경된 확장성\n해시 파일에 대해 전역 깊이(가)와 모든 버킷의\n지역 깊이(나)의 합을 각각 옳게 나열한 것은?\n(단, 한 버킷에는 최대 4개의 레코드가 포함된다.)\n① 전역 깊이 3, 지역 깊이의 합 11\n② 전역 깊이 4, 지역 깊이의 합 11\n③ 전역 깊이 3, 지역 깊이의 합 14\n④ 전역 깊이 4, 지역 깊이의 합 14",
  "2024_72": "72. 다음은 Apache Spark에서 사용하는 데이터 구조에\n대한 설명이다. 다음 설명에서 ㉮에 들어갈 용어로\n가장 올바른 것은?\n관계형 데이터베이스가 데이터 표현을 위한 추상화\n로 릴레이션을 사용하는 것처럼 Apache Spark은\n㉮라 불리는 데이터 표현 방식을 사용한다. Spark\n에서 연산자는 하나 이상의 ㉮를 입력으로 받아 출\n력으로 ㉮를 반환하는 방식으로 계산을 수행한다.\n① HDFS(Hadoop Distributed File System)\n② HDFS(Hadoop Duplicated File System)\n③ RDD(Resilient Distributed Dataset)\n④ RDD(Reproducible Duplicated Dataset)\n4 -\n\n=== NEW PAGE ===",
  "2024_73": "73. 다음 데이터가 순서대로 삽입되어 만들어진 차수\n가 3인 B-트리에 대한 설명으로 옳지 않은 것은?\n17, 20, 5, 15, 7, 18, 16, 19\n① 루트 노드의 키 값은 16이다.\n② 리프 노드의 개수는 4개이다.\n③ 전체 노드의 개수는 7개이다.\n④ 루트 노드의 레벨이 1이라고 할 때, 트리의 높\n이는 3이다.",
  "2024_74": "74. WAL(Write-Ahead Logging) 기법은 두 가지 로그\n엔트리를 사용한다. 먼저 항목의 AFIM(After\nImage)을 기록하는데 이는 트랜잭션의 (가)에 대\n비하기 위함이며, 항목의 BFIM(Before Image)을\n기록하는데 이는 트랜잭션의 (나)에 대비하기 위\n함이다. 이때, (가)와 (나)에 들어갈 용어로 가장\n올바른 것은?\n① (가) VOLATILE (나) PERSISTENT\n② (가) PERSISTENT (나) VOLATILE\n③ (가) REDO (나) UNDO\n④ (가) UNDO (나) REDO",
  "2024_75": "75. 다음 조건에서 k-Means 군집화를 수행한다고 할\n때, 유사도(점과 점 사이의 거리) 계산 횟수로 가\n장 가까운 것은?\n· 군집 대상인 점의 개수 = 100개\n· 군집의 개수 k = 5\n· k-Means 알고리즘의 반복(loop) 횟수 = 5\n· 주의: 각 군집의 중심(centroid)은 항시 군집 대\n상인 100개의 점 중에서 선택한다.\n① 125 ② 1025 ③ 1495 ④ 2375\n- 15\n5 -\n\n=== NEW PAGE ===\n\n시스템 구조",
  "2025_51": "51. 릴레이션R과함수적종속성(functional dependency)을\n기준으로 결정한 후보키(candidatekey)로가장적절한\n것은?\n(릴레이션)\nR(A,B, C,D, E,F)\n(함수적종속성)\nA→B,C→A,C→D,(A, F)→E\n① AF ② CF\n③ AC ④ AFC",
  "2025_52": "52.다음은릴레이션R(A, B, C, D)와해당릴레이션에서\n성립하는 함수적 종속성이다. 릴레이션R을두개의\n릴레이션 R1, R2로 분해한 후, 공통속성을이용하여\n다시 조인했을 때 원래 릴레이션을 복구할 수 없는\n분해는 어느 것인가?\n①(함수적종속성) (A, B)→D, B→C, C→D\n(분해된릴레이션) R1(A, B, C, D), R2(C, D)\n②(함수적종속성) A→B, B→C, C→D\n(분해된릴레이션) R1(A, B, C), R2(C,D)\n③(함수적종속성) (A, B) →C, A→C\n(분해된릴레이션) R1(A, C), R2(A, B)\n④(함수적종속성) (A, B) →C, C →D, C →A\n(분해된릴레이션) R1(A, B), R2(A, C, D)",
  "2025_53": "53. 다음과 같이 릴레이션 R과 S가 있다. R과 S를\n완전 외부 조인(full outer join)한 결과로 나올 수\n없는 투플(tuple)은?\n(단,널(NULL)값은‘-’으로표시한다.)\n릴레이션 R 릴레이션 S\nA B C B C D\na1 b1 c1 b1 c1 d1\na2 b1 c2 b1 c2 d2\na3 b1 c2 b1 c2 d3\na4 b2 c3 b3 c3 d3\nA B C D\n① a1 b1 c1 d1\n② - b1 c2 d2\n③ a4 b2 c3 -\n④ - b3 c3 d3\n- 1",
  "2025_54": "54. 릴레이션 R과 R에 포함된 함수적 종속성(functional\ndependency)이 다음과 같이 주어졌다고 하자.\nR(EmpID, DeptID, ProjID, EmpName,\n릴레이션\nDeptName)\nEmpID → EmpName\n함수적\nDeptID → DeptName\n종속성\n(EmpID, ProjID) → DeptID\n이때R을제2정규형(2NF)이만족하도록정규화한다면\n총 몇 개의 릴레이션이 생성되는가?\n① 1 ② 2 ③ 3 ④ 4",
  "2025_55": "55. 다음과 같은 ER 스키마를 관계 모델의 릴레이션\n으로 사상할 때 가장 적절하지 않은 것은?\nE1 E2\nPK1 A1 PK2 A2 FK1\n① K1 K2 K1\nE1 E2\nPK1 A1 FK2 PK2 A2\n② K1 K2 K2\nE1 E2\nPK1 A1 PK2 A2\n③ K1 K2\nE1_E2\nPK1 A1 PK2 A2\n④ K1 K2",
  "2025_56": "56. 릴레이션R(StudentID, CourseID, Grade, Semester)이\n다음조건을만족한다고가정할 때, R의최대가능한\n투플 개수로 옳은 것은?\n(단, 릴레이션R에서(StudentID, CourseID, Semester)\n가 기본키(primary key)이다.)\nStudentID 도메인 크기: 1000 (총 1000명 학생)\nCourseID 도메인 크기: 50 (총 50개 강좌)\nSemester 도메인 크기: 8 (총 8학기)\nGrade 도메인 크기: 5 (A, B, C, D, F)\n① 2,000,000 ② 400,000\n③ 50,000 ④ 8,000\n12 -\n\n=== NEW PAGE ===",
  "2025_57": "57. 다음은 고객(customer)과 주문(orders) 릴레이션이다.\n밑줄친속성은기본키를 나타낸다. 다음중결과가\n다른하나는무엇인가?\ncustomer(custid, name)\norders(orderid, custid, bookid, saleprice)\n① SELECTcs.custid,cs.name,\nSUM(od.saleprice)total_sales\nFROMcustomercs\nLEFTJOINordersodONcs.custid=od.custid\nGROUPBYcs.custid,cs.name;\n②SELECTcs.custid,cs.name,\n(SELECTSUM(saleprice)FROMordersod\nWHEREcs.custid=od.custid)total_sales\nFROMcustomercs;\n③SELECTcs.custid,cs.name,SUM(od.saleprice)total_sales\nFROMcustomer cs\nLEFTJOINordersodONcs.custid=od.custid\nGROUPBY cs.custid,cs.name\nHAVINGtotal_sales>=0;\n④SELECTcs.custid,cs.name,s\nFROMcustomercs\nLEFTJOIN(SELECTcustid,SUM(saleprice)ASs\nFROMordersGROUPBYcustid)od\nONcs.custid=od.custid;",
  "2025_58": "58. 세릴레이션직원E(ENO,Name),프로젝트P(PNO,DNO),\n참가W(ENO, PNO, Hour)에대해표현한다음SQL문에\n대한설명으로옳지않은것은?\nSELECTENO\nFROME\nWHERENOTEXISTS((SELECTPNO\nFROMP\nWHEREDNO=1)\nEXCEPT(SELECTPNO\nFROMW\nWHEREE.ENO=ENO));\n① 1번부서(DNO=1)가수행하는프로젝트에참가하지\n않은직원의번호(ENO)를검색하는질의이다.\n②1번 부서(DNO=1)가 수행하는 모든 프로젝트에 참\n가한직원의번호(ENO)를검색하는질의이다.\n③두번째부속질의는상관(correlated)질의로현재고려\n중인특정직원(E)이참가한모든프로젝트를선택한다.\n④관계 대수 (∏ENO, PNO(W)) ÷ (∏PNO(σ DNO=1(P)))를\n이용하면 동일한 결과를 얻을 수 있다.\n- 1",
  "2025_59": "59. 프로야구선수(일련번호,이름,소속팀,연봉)릴레이션에\nL소속팀선수가10명,H소속팀선수가40명,K소속팀\n선수가30명, 소속팀이정해지지않은선수가20명으로\n구성되어있을 때, 가, 나, 다의 실행 결과 카디날\n리티(cardinality)로 옳은 것은?\n가. SELECT 소속팀 FROM 선수;\n나. SELECT DISTINCT 소속팀 FROM 선수;\n다. SELECT 소속팀, COUNT(*) FROM 선수\nGROUP BY 소속팀 HAVING COUNT(*) >= 20 ;\n① 가: 80 나: 3 다: 2\n② 가: 80 나: 3 다: 3\n③ 가: 100 나: 4 다: 3\n④ 가: 100 나: 4 다: 4",
  "2025_60": "60. 세 개의릴레이션이다음과같다.\n배(배번호,배이름, 색깔),\n항해사(항해사 번호, 이름, 등급),\n예약(항해사 번호, 배 번호, 예약일)\n각각의 기본 키는 밑줄 친 속성이라고 하자.\n“모든 배를 예약 받은 항해사의 항해사 번호를\n검색하라.”는 질의를관계대수로나타낼때포함되어야\n할연산자를 모두 고른 것으로 가장 적절한 것은?\n(단, 배가 몇 척인지 알 수 없다.)\n가. 합집합 나. 곱집합\n다. 차집합 라. 프로젝트\n① 가, 나, 다 ② 가, 나, 라\n③ 가, 다, 라 ④ 나, 다, 라",
  "2025_61": "61. 관계대수연산의완전집합{σ, ∏, ∪, ρ, -, ×}중에서\n디비전(division) 연산의 표현을 위해 필요한 연산만을\n모아 놓은 것으로 옳은 것은?\n① σ, ∏, - ② σ, ∪, ρ, -, ×\n③ ∏, -, × ④ ∏, ∪, -, ×\n13 -",
  "2025_62": "62. 다음 SQL 정의문은 직원 EMPLOYEE(ENO, Name,\nSuper_ENO, DNO) 릴레이션을 정의한 것이다. 이와\n관련된설명으로옳지않은것은?\n(단, DEPARTMENT는 부서 릴레이션, ENO는 직원\n번호,Name은이름,Super_ENO는상사직원번호, DNO\n는부서번호를의미한다.)\nCREATETABLEEMPLOYEE\n(ENOINTNOTNULL,\nNameVARCHAR(15)NOTNULL,\nSuper_ENOINT,\nDNOINTNOTNULLDEFAULT1,\nPRIMARYKEY(ENO),\nCONSTRAINTEMPSUPERFKFOREIGNKEY\n(Super_ENO)REFERENCESEMPLOYEE(ENO)\nONDELETESETNULLONUPDATECASCADE,\nCONSTRAINTEMPDEPTFKFOREIGNKEY(DNO)\nREFERENCESDEPARTMENT(DNO)\nONDELETESETDEFAULT\nONUPDATECASCADE);\n① 100번 직원의 상사인 200번 직원이 삭제되면\n100번 직원의 상사 값은 NULL이 된다.\n② 100번 직원이 속한 부서가 부서 릴레이션에서\n삭제되면 100번 직원도 연쇄적으로 삭제된다.\n③ 100번 직원이 속한 부서번호가 부서 릴레이션에\n서 5에서 6으로 변경되면 직원 릴레이션에서\n100번 직원의 부서번호도 5에서 6으로 변경된다.\n④ 100번 직원의 상사의 직원번호가 직원 릴레이션에\n서 200번에서300번으로 변경되면 100번직원투플\n의상사번호도 300번으로 변경된다.",
  "2025_63": "63. 다음 데이터가 순서대로 삽입되어 만들어진 차수가\n3인 B+-트리에 대해 적절하게 설명된 것을 모두\n나열한 것으로 옳은 것은?\n(단, B+-트리가생성될때첫노드는최대3개키값을\n저장한다. 이후리프노드는최소2개, 최대3개키값을\n저장하고, 루트노드와내부노드는최소1개, 최대2개키\n값을저장한다.키값a의왼쪽서브트리에있는노드들의\n모든키값들은a보다작거나같다. 노드에키의개수가\n짝수 m일때, 중간 키값은 m/2 번째 값으로 한다.)\n69, 15, 110, 90, 20, 120, 40, 125\n가. 전체 노드의 개수는 7개이다.\n나. 루트 노드의 키 값은 69이다.\n다. 가장왼쪽에있는리프노드에들어갈키값은15,40이다.\n라. 루트노드의레벨이1이라고할때,트리의높이는3이다.\n① 가, 다 ② 가, 나, 라\n③ 나, 다, 라 ④ 가, 나, 다, 라\n- 1",
  "2025_64": "64. 다음 확장성 해싱(extendible hashing) 파일에서 d는\n전역 깊이(global depth)를 나타내고 p는 지역 깊이\n(local depth)를 나타낸다고 하자. 모조키 (a), (b), (c)를\n차례로 삭제한 후, 변경된 확장성 해싱 파일에 대한\n설명으로옳지않은것은?\n(단,각버킷에는최대4개의모조키값이들어갈수있다.)\n① 지역 깊이의 합은 8이다.\n② 전역 깊이는 2로 변경된다.\n③ 3개의 모조키를 포함한 버킷이 존재한다.\n④ 디렉터리가오름차순으로정렬될때,가장아래버킷에는\n모조키 110100 한 개만 포함한다.",
  "2025_65": "65. 다음과 같은 student 릴레이션이 있다고 하자.\ns_id(학번) year(학년) dept(학과)\n1001 1 전기공학과\n1002 3 전자공학과\n1003 2 전기공학과\n1004 1 컴퓨터공학과\n1005 2 전기공학과\n1006 4 전자공학과\n1007 1 컴퓨터공학과\n이 릴레이션에 대해 전기공학과 3명, 전자공학과 2명,\n컴퓨터공학과2명으로인원을계산하는뷰를정의하려고\n할때, 다음중가장적절하게정의된뷰는?\n① CREATEVIEWsize(year,t_size)\nASSELECTyear,count(*)FROMstudent;\n② CREATEVIEWsize(year,t_size)\nASSELECTyear,count(*)FROMstudentGROUPBYyear;\n③ CREATEVIEWsize(dept,t_size)\nASSELECTdept,count(*)FROMstudent;\n④ CREATEVIEWsize(dept,t_size)\nASSELECTdept,count(*)FROMstudentGROUPBYdept;\n14 -\n\n=== NEW PAGE ===",
  "2025_66": "66. 다중단위로킹(multiple granularity locking)기법에서\nIX(Intension eXclusive)와 SIX(Shared and\nIntension eXclusive) 로크에 대한 양립성 행렬 중\n(가)~(라)에들어갈표현으로옳은 것은?\n현재 어떤 레벨에\n걸려 있는 로크\nIX SIX\n요청 중인 IX (가) (나)\n로크 SIX (다) (라)\n(가) (나) (다) (라)\n① 허용 허용 허용 허용\n② 허용 허용 허용 대기\n③ 허용 허용 대기 대기\n④ 허용 대기 대기 대기",
  "2025_67": "67. HDFS(Hadoop Distributed File System)에서\n데이터 읽기(read)와 쓰기(write)의 성능 차이와\n이에 대한 설명으로 옳은 것은?\n① 읽기는 가까운 DataNode에서 데이터를 가져\n오기 때문에 빠르고, 쓰기는 모든 복제본 저\n장을 기다리기 때문에 느리다.\n② 읽기는 모든 DataNode에서 데이터를 수집해야\n하므로 느리고, 쓰기는 특정 DataNode에만 기\n록하면 되므로 빠르다.\n③ HDFS는 데이터를 항상 NameNode에서 읽고\n쓰므로 읽기와 쓰기에서의 성능 차이가 없다.\n④ HDFS는 쓰기가 완료된 후에만 읽기가 가능하기\n때문에 쓰기에 비해 읽기가 느리다.",
  "2025_68": "68. Apriori 알고리즘의핵심원리인비-단조(anti-monotone)\n성질에대한설명으로옳은것은?\n① 어떤 항목집합이 빈발하지 않다면, 그 상위\n집합(superset) 또한 빈발하지 않다.\n② 항목집합의 크기가 증가할수록 지지도(support)\n도 증가한다.\n③ 빈발한 항목집합의 모든 상위 집합(superset) 또한\n빈발하다.\n④ 지지도가 낮은 항목집합은 높은 항목집합에\n비해 연관 규칙이 될 가능성이 높다.",
  "2025_69": "69. 어떤 데이터셋에서 클래스 C1과 C2의 사전 확률이\n각각 0.5, 0.5이고, 특정 특성 X가 클래스 C1에서\n발생할 확률이 0.6, 클래스 C2에서 발생할 확률이\n0.4라고 하자. 이때 베이즈 정리(Bayes theorem)로\n계산한P(C1|X)값으로옳은것은?\n① 0.24 ② 0.3 ③ 0.4 ④ 0.6\n- 1",
  "2025_70": "70. 다음은 트랜잭션들이 병행 수행되던 도중 시스템\n장애(system crash)가 발생한 후의 로그 기록이다.\n로그는 즉시 변경(immediate update) 방법을 사\n용하며, <T, D, v1, v2>는 <트랜잭션 이름, 데\n이터, 변경 전 값, 변경 후 값>을 의미한다. 복구\n후 데이터 값 중 틀린 것은?\n<start, T1>\n<T1, A, 10, 15>\n<start, T2>\n<T2, B, 5, 7>\n<commit, T1>\n<checkpoint>\n<start, T3>\n<T3, C, 8, 9>\n<T2, A, 15, 20>\n<T3, D, 12, 14>\n<commit, T3>\n*system crash*\n① A : 15 ② B : 5\n③ C : 8 ④ D : 14",
  "2025_71": "71. 다음과같이XMLDTD를정의하였다고할때, 파싱\n오류가발생하는XML문장으로가장적절한것은?\n<!ELEMENT x (a, (b | c), d)*>\n<!ELEMENT a (#PCDATA)>\n<!ELEMENT b (#PCDATA)>\n<!ELEMENT c (#PCDATA)>\n<!ELEMENT d (#PCDATA)>\n① <x> ② <x>\n</x> <a />\n<d />\n</x>\n③ <x> ④ <x>\n<a /> <a />\n<b /> <b />\n<d /> <d />\n</x> <a />\n<c />\n<d />\n</x>\n15 -",
  "2025_72": "72. 다음에서 JDBC를 이용한 데이터베이스 프로그램의\n작성순서를올바르게나열한것으로가장적절한것은?\n가. SQLExecute를 이용하여 SQL 문장을 실행\n나. 질의 스트링에 있는 매개변수를 SQL/CLI 함수\nSQLBindParameter를 이용하여 프로그램 변수에\n연결\n다. 환경변수를 설정\n라. 질의결과가리턴되면SQLBindCol 함수를이용하여\n질의결과의각열을C프로그램변수에연결\n마. SQL/CLI 함수 SQLPrepare를 이용하여 SQL\n문장을 준비\n① 마 - 가 - 다 - 나 - 라\n② 마 - 라 - 가 - 다 - 나\n③ 다 - 마 - 라 - 가 - 나\n④ 다 - 마 - 나 - 가 – 라",
  "2025_73": "73. 다음 박스 안의 ‘가’ ~ ‘마’ 중, 데이터베이스가\n유지해야할 중요한 성질들 중에서 NoSQL과 관련이\n있는 성질만을 모아놓은것으로 가장 적절한 것은?\n가. 원자성(atomicity) 나. 일관성(consistency)\n다. 분할 감내성(partition tolerance)\n라. 격리성(isolation) 마. 가용성(availability)\n① 가, 나, 라 ② 가, 나, 다, 라\n③ 나, 다, 마 ④ 나, 다, 라, 마",
  "2025_74": "74. 이진 분류를 위한 의사결정 트리(decision tree)\n구축에서불순도(impurity)와분류오류에대한 설명\n으로 옳지 않은 것은?\n① 두 클래스를 구분하는 현재 노드에서 각 클래스의\n해당 개수가 0개, 6개라면 Gini Index는 0이다.\n② 두 클래스를 구분하는 현재 노드에서 각 클래스의\n해당 개수가 1개, 5개라면 Gini Index의 값은 0\n보다 크다.\n③ 두 클래스를 구분하는 현재 노드에서 각 클래스의\n해당 개수가 3개, 3개라면 분류 오류(classification\nerror) 비율은 0.5이다.\n④ 두 클래스를구분하는현재노드에서각클래스의\n해당개수가3개, 3개라면Gini Index는1이다.\n- 1",
  "2025_75": "75. 데이터 저장 및 교환을 위한 다양한 데이터 포맷이\n존재하며, 각각의 형식은 특정한 구조와 특징을\n가진다. 다음 중 대표적인 데이터 저장 형식과 이에\n대한 설명으로 가장 적합하지 않은 것은?\n① Key-Value Store: 키(Key)와 값(Value) 형태로\n데이터를 저장하며, 고속 검색이 가능한 구조이다.\n일반적으로 NoSQL 데이터베이스에서 많이 사용\n된다.\n② JSON(JavaScript Object Notation): 속성-이름\n쌍으로 데이터를 저장하며, 트리 구조를 가지며\nXML과 유사한 역할을 한다. 문자열 기반의\n데이터 표현 방식이며, 네트워크 통신에서 자주\n사용된다.\n③ XML(eXtensible Markup Language): 태그를 사\n용하여 계층적 구조의 데이터를 표현하며, 문서\n형식의 데이터 저장과 교환에 주로 사용된다.\n④ CSV(Comma-Separated Values): 쉼표(,) 또는\n탭(Tab)으로 데이터를 구분하여 저장하며, 행\n(row)과 열(column) 구조를 갖는다. 정형 데이터\n저장에 적합하며, 중첩 구조를 표현할 수 있다.\n16 -\n\n=== NEW PAGE ===\n\n시스템 구조",
  "2026_51": "51. 다음은 JDBC 환경에서 자바 응용 프로그램이\n데이터베이스에 연결되어 SQL을 수행하는 과정의\n일부를 나열한 것이다. 그 처리 순서가 올바른 것은?\n가. 요청된 SQL 문을 DBMS가 실행한다.\n나. 등록된 드라이버 중 적합한 드라이버를 선택하여\n연결을 위임한다.\n다. 자바 응용 프로그램이 getConnection()을 호출한다.\n라. 드라이버가 DBMS와 네트워크 소켓 연결을 설정\n한다.\n마. Statement 또는 PreparedStatement 객체를 생성\n한다.\n① 나 → 다 → 라 → 마 → 가\n② 다 → 라 → 가 → 나 → 마\n③ 다 → 나 → 라 → 마 → 가\n④ 다 → 라 → 마 → 나 → 가",
  "2026_52": "52. 참조하는 테이블을 EMP라고 하고, 참조되는 테이\n블을 DEPT라고 할 때 참조 무결성 제약조건을\n보장하기 위해 사용하는 ‘ON DELETE RESTRICT’에\n대한 설명으로 가장 적절한 것은?\n① DEPT 테이블에서 어떤 투플이 삭제되어 참조\n무결성 제약조건을 위배하는 경우가 발생하면,\n삭제된 기본키 값을 참조하는 EMP 테이블의\n외래키에 널 값을 채운다.\n② DEPT 테이블에서 어떤 투플이 삭제되어 참조\n무결성 제약조건을 위배하는 경우가 발생하면,\nEMP 테이블에서 이 값을 참조하는 모든 투플도\n연쇄적으로 삭제된다.\n③ DEPT 테이블에서 어떤 투플이 삭제되면 EMP\n테이블에서 이 값을 참조하는 모든 투플의 애트\n리뷰트가, 디폴트 값이 명시된 경우 디폴트 값을\n갖는다.\n④ DEPT 테이블에서 어떤 투플을 삭제하려는데,\n이 투플의 기본키 값을 참조하고 있는 투플이\nEMP 테이블에 존재하면 삭제 연산을 거절한다.\n- 12",
  "2026_53": "53. 다음 고객 릴레이션과 주문 릴레이션에 대하여 완전\n외부조인(full outer join)을 수행한 결과 릴레이션의\n차수(degree)와 카디날리티(cardinality)는? (조인 컬럼은\n고객번호이다.)\n고객 주문\n고객번호 이름 주문번호 고객번호 판매가격\n1 박지성 1 2 7000\n2 김연아 2 1 13000\n3 장미란 3 2 8000\n4 추신수 4 1 13000\n5 4 35000\n6 5 22000\n7 4 22000\n① 4, 7 ② 4, 8\n③ 5, 7 ④ 5, 8",
  "2026_54": "54. 다음 EER 다이어그램에 대한 설명으로 옳은 것은?\n(단, 이중선은 전체 참여 제약, 원의 문자 d는 분리\n제약을 표현한다.)\n① 직원은 서브클래스 개체이다.\n② 월급직원이나 시급직원에 속하지 않는 직원도\n존재한다.\n③ 월급직원도 노조에 소속할 수 있다.\n④ 월급직원이면서 동시에 시급직원일 수는 없다.",
  "2026_55": "55. 다음 두 릴레이션에 대해 SQL 연산 R(A) EXCEPT\nALL S(A)를 적용한 결과 릴레이션 T는?\nR S\nA A\na1 a1\na2 a2\na2 a4\na3 a5\n① T ② T ③ T ④ T\nA A A A\na1 a1 a2 a3\na2 a2 a3\na3\na4\na5\n2 -\n\n=== NEW PAGE ===",
  "2026_56": "56. 다음과 같은 릴레이션에 대해 오른쪽의 함수\n종속 다이어그램이 표현하는 함수 종속이 존재한\n다고 가정하자. 다음 중 이와 관련된 설명으로 옳지\n않은 것은?\n① 어떤 지도교수가 특정 학과에 속한다는 사실만을\n삽입하는 것이 가능하다.\n② 300번 학생의 투플을 삭제하면 지도교수 P3이\n컴퓨터공학과에 속한다는 사실도 상실한다.\n③ 지도교수 P1의 소속 학과를 일부 행에서만 변경\n하면 갱신 이상이 발생한다.\n④ 이 릴레이션에는 이행적 함수 종속이 존재한다.",
  "2026_57": "57. 다음 중 소속부서는 같으면서, 부서대표전화번호가\n다른 행을 출력하는 SQL문은? 단, 테이블 Emp\n(empid, empname, email, deptcode, deptphone)는\n사원(사원번호, 이름, 이메일, 소속부서, 부서대표\n전화번호)을 의미한다.\nSELECT E1.deptcode, E1.deptphone\nFROM Emp AS E1\nWHERE E1.deptcode IN\n① (SELECT E2.deptcode\nFROM Emp AS E2\nWHERE E1.deptcode = E2.deptcode\nAND E1.deptphone <> E2.deptphone);\nSELECT E1.deptcode, E1.deptphone\nFROM Emp AS E1, Emp AS E2\nWHERE E1.deptcode = E2.deptcode\n② AND E1.deptcode IN\n(SELECT E2.deptcode\nFROM Emp AS E2\nWHERE E2.deptphone <> E2.deptphone);\nSELECT Emp.deptcode, Emp.deptphone\nFROM Emp\nWHERE Emp.deptcode IN\n③\n(SELECT Emp.deptcode\nFROM Emp\nWHERE Emp.deptphone <> Emp.deptphone);\nSELECT E1.deptcode, E1.deptphone\nFROM Emp AS E1\nWHERE NOT EXISTS\n④ (SELECT E2.deptcode\nFROM Emp AS E2\nWHERE E1.deptcode = E2.deptcode\nAND E1.deptphone <> E2.deptphone);\n- 13",
  "2026_58": "58. 다음은 DBMS의 기능과 SQL 문의 관계에 대한 설명\n이다. <보기>에서 옳은 것을 모두 나열한 것은?\n<보기>\n가. 데이터 정의 기능은 데이터베이스의 스키마를 정\n의하며 SQL의 CREATE, ALTER, DROP 문을 이\n용하여 수행된다.\n나. 데이터 조작 기능은 데이터의 검색, 삽입, 수정, 삭제\n를 수행하며 SQL의 SELECT, INSERT, UPDATE,\nTRUNCATE 문이 포함된다.\n다. 데이터 제어 기능은 사용자 권한을 관리하고 접\n근 권한을 부여하거나 취소하며 SQL의 GRANT,\nREVOKE 문이 포함된다\n라. 데이터 조작 기능은 데이터베이스의 저장 구조를\n정의하는 기능이며 SQL의 CREATE TABLE 문으로\n수행된다.\n① 가, 나 ② 가, 다\n③ 가, 나, 다 ④ 나, 다, 라",
  "2026_59": "59. 다음은 인터넷서점의 관계 데이터베이스 테이블의\n상태를 나타낸다.\n도서 도서번호 도서명 출판사 가격\nB1 데이터베이스 남산 25000\nB2 운영체제 종로 30000\nB3 알고리즘 남산 28000\nB4 컴퓨터구조 을지 32000\nB5 인공지능 종로 35000\n주문 주문번호 회원번호 도서번호 주문액\nO1 M1 B1 25000\n내역\nO2 M2 B2 30000\nO3 M1 B3 28000\nO4 M3 B2 32000\nO5 M2 B3 28000\n다음 SQL 문의 실행 결과로 가장 적절한 것은?\nSELECT D.도서명\nFROM 도서 D\nWHERE D.가격 > (\nSELECT AVG(가격)\nFROM 도서\nWHERE 출판사 = D.출판사\n)\nAND D.가격 >= ALL (\nSELECT 주문액\nFROM 주문내역\nWHERE 회원번호 = ‘M1’\n);\n① 알고리즘, 인공지능\n② 운영체제, 알고리즘\n③ 알고리즘, 컴퓨터구조, 인공지능\n④ 컴퓨터구조, 인공지능\n3 -\n\n=== NEW PAGE ===",
  "2026_60": "60. Emp 테이블에 deptno=10인 직원이 5명, deptno=20인\n직원이 3명 존재할 경우에, 다음 SQL 표준 트리거\n(trigger) 정의문에서 실제로 트리거 액션이 실행\n되는 행(row)의 수는?\nCREATE TRIGGER trg_sal_audit\nAFTER UPDATE OF sal ON Emp\nREFERENCING OLD ROW AS O, NEW ROW AS N\nFOR EACH ROW\nWHEN (N.sal > O.sal AND N.deptno = 10)\nINSERT INTO sal_audit\nVALUES (N.empno, O.sal, N.sal, CURRENT_TIMESTAMP);\nUPDATE Emp\nSET sal = sal * 1.1\nWHERE deptno IN (10, 20);\n① 8건 ② 5건\n③ 3건 ④ 0건",
  "2026_61": "61. 다음 두 테이블에 대해 주어진 SQL 문을 적용한\n결과로 옳은 것은?\nR S\nA B A C\n1 a 1 c1\n2 b 2 c2\n3 c 3 c2\n5 x 1 c5\n5 c4\n2 c1\n1 c3\n3 c4\n5 c3\n3 c5\nSELECT B\nFROM R\nWHERE NOT EXISTS\n(SELECT *\nFROM S\nWHERE A = R.A\nAND C = ‘c3’);\n① B ② B\na a\nb x\n③ B ④ B\nb c\nc x\n- 14",
  "2026_62": "62. 다음은 데이터베이스 객체인 저장 프로시저와\n트리거에 대한 설명이다. 옳은 것을 모두 고른 것은?\n가. 트리거는 매개변수를 통해 외부로부터 값을 전\n달받을 수 있으며, 수행 결과를 리턴값으로 반환\n할 수 있다.\n나. 저장 프로시저는 매개변수를 통해 외부와 데이터를\n주고받을 수 있다.\n다. 저장 프로시저는 내부에 COMMIT이나 ROLLBACK\n같은 트랜잭션 제어어를 사용할 수 없으나, 트리\n거는 자유롭게 사용할 수 있다.\n라. 저장 프로시저는 사용자의 명시적 호출에 의해\n실행되고, 트리거는 데이터 변경 이벤트 발생 시\nDBMS에 의해 자동적으로 실행된다.\n① 가, 다 ② 나, 라\n③ 가, 다, 라 ④ 가, 나, 다, 라",
  "2026_63": "63. 다음은 반(역)정규화 적용 유형에 대한 설명이다.\n옳은 것을 모두 고른 것은?\n가. 특정 컬럼의 크기가 너무 커서 디스크 I/O가 과다\n하게 발생하는 경우, 해당 컬럼을 별도의 테이블\n로 분리하는 것을 수평 분할이라 한다.\n나. 테이블 병합은 조인 비용을 줄이기 위해 여러 테이\n블을 하나의 테이블로 통합하는 반정규화 방법이다.\n다. 부분 테이블 분할은 데이터 접근 빈도에 따라 테이블을\n여러 개로 나누어 성능을 개선하는 정규화 기법이다.\n라. 접근 경로의 단축을 위해 부모 테이블의 컬럼을\n자식 테이블에 중복시킬 수 있다.\n① 가, 나 ② 나, 라\n③ 가, 나, 다 ④ 나, 다, 라",
  "2026_64": "64. 두 개의 릴레이션 R(A, B, C, D)과 S(D, E, F)에\n대한 다음 관계 대수식 보기 중에서 동등하지 않은\n관계 대수식은?\n① σ (R ⋈ S)\nA=3 AND F=9 R.D=S.D\n② σ (R ⋈ S)\nA=3 OR F=9 R.D=S.D\n③ (σ R) ⋈ (σ S)\nA=3 R.D=S.D F=9\n④ σ (σ (R ⋈ S))\nA=3 F=9 R.D=S.D\n4 -\n\n=== NEW PAGE ===",
  "2026_65": "65. 인덱스에 대한 다음 설명 중 옳은 것으로만 짝지\n어진 것은?\n가. 한 데이터 파일은 희소 인덱스를 최대 한 개\n가질 수 있다.\n나. 한 데이터 파일은 한 개의 밀집 인덱스와 다수\n의 희소 인덱스를 가질 수 있다.\n다. 3단계로 이루어진 다단계 인덱스가 있다면, 마\n스터 인덱스는 1단계이고, 데이터 파일에 대한\n인덱스를 가지고 있는 인덱스는 3단계이다.\n라. 클러스터링 인덱스는 탐색 키 값에 따라 정렬\n된 데이터 파일에 대해 정의된 인덱스이고, 비\n클러스터링 인덱스는 탐색 키의 값과 무관하게\n레코드들이 저장된 데이터 파일에 대해 정의된\n인덱스이다.\n① 가, 나 ② 나, 라\n③ 가, 라 ④ 나, 다",
  "2026_66": "66. 다음은 관계 데이터베이스의 조인 수행 원리에 대한\n설명이다. <보기> 중 옳은 것을 모두 고른 것은?\n<보기>\n가. Sort-Merge Join은 선행 테이블(driving table)의\n조건을 만족하는 행별로 후행 테이블을 반복 탐색\n하며, 후행 테이블의 조인 컬럼에 인덱스가 구성\n되어 있지 않을 경우 Table Full Scan이 반복 발생\n하여 성능이 저하된다.\n나. Nested Loop Join은 조인 컬럼에 적절한 인덱스가\n없거나 조인 조건이 부등호(>, <)인 경우에도 사용\n할 수 있으며, 양쪽 테이블이 조인 컬럼 순으로\n이미 정렬되어 있다면 정렬 단계를 생략할 수\n있다.\n다. Hash Join은 동등 조인(equi-join)에만 사용 가능\n하며, 대량의 데이터를 처리할 때 일반적으로\nNested Loop Join이나 Sort-Merge Join보다 효율\n적이다.\n라. Hash Join은 조인을 위해 해쉬테이블을 메모리에\n생성하여야 하며, 생성된 해쉬테이블의 크기가\n메모리에 적재할 수 있는 크기보다 더 커지면\n임시영역(디스크)에 해쉬테이블의 일부를 저장한다.\n① (가), (나) ② (다), (라)\n③ (가), (다) ④ (나), (다), (라)\n- 15",
  "2026_67": "67. 다음 중 시스템 카탈로그에 관한 설명으로 옳지\n않은 것은?\n① SQL 질의가 실행될 때 DBMS의 질의처리기는\n반드시 시스템 카탈로그를 참조해야 한다.\n② SYSTEM_LOG는 SQL 표준으로 정의된 가상 스\n키마로, 테이블·컬럼·제약조건 등 메타데이터를\n표준화된 방법으로 조회할 수 있게 한다.\n③ CREATE, ALTER, DROP 등 DDL이 실행될 때마다\nDBMS는 자동적으로 시스템 카탈로그 테이블들\n의 행을 삽입, 삭제, 수정 등을 수행한다.\n④ 데이터베이스에 포함되는 모든 데이터 객체에\n대한 정의와 명세에 관한 정보인 메타데이터를\n유지 및 관리한다.",
  "2026_68": "68. 두 트랜잭션이 정확하게 동작하더라도, 동시성 제\n어를 하지 않고 두 트랜잭션을 동시에 수행할 때\n문제가 발생할 수 있다. 오손 데이터 읽기(dirty\nread)가 발생하는 충돌 연산의 존재유형에 해당하는\n것은?\n① 두 트랜잭션에 read-read 충돌 연산이 존재할\n때 발생\n② 두 트랜잭션에 read-write 충돌 연산이 존재할\n때 발생\n③ 두 트랜잭션에 write-write 충돌 연산이 존재할\n때 발생\n④ 두 트랜잭션에 write-read 충돌 연산이 존재할\n때 발생",
  "2026_69": "69. 다음 그림은 2단계 로킹 프로토콜의 확장과 수축\n단계를 표시한 그림이다. 로크포인트(lock point)는\nⓐ ~ ⓓ 중 어느 시점인가?\n① ⓐ ② ⓑ\n③ ⓒ ④ ⓓ\n5 -\n\n=== NEW PAGE ===",
  "2026_70": "70. 다음은 데이터베이스 보안을 위한 접근제어\n(access control) 모델 및 정책에 대한 설명이다.\n<보기> 중 옳은 것을 모두 고른 것은?\n<보기>\n가. 강제적 접근제어(MAC) 기반의 레이블 보안\n(label-based security)은 객체의 보안 등급과\n사용자의 허가 등급을 비교하여 통제하며, 관\n리자나 소유자가 임의로 접근 권한을 변경할\n수 없는 중앙 집중적 정책을 따른다.\n나. 역할기반 접근제어(RBAC)는 권한을 개별 사용\n자에게 직접 할당하지 않고 객체 소유자가 자\n신의 판단에 따라 다른 사용자에게 자유롭게\n권한을 위임(grant)하는 것을 원칙으로 한다.\n다. 행 수준 보안(row level security, RLS)은\nWHERE 절 등 특정 조건에 따라 사용자별로\n조회 가능한 레코드를 제한하는 미세 단위 접\n근제어(FGAC) 기법으로, 더 미세한 크기의 데\n이터 보안을 제공한다.\n라. 임의적 접근제어(DAC)는 데이터 객체의 소유자가\n접근 통제권한을 가지며, SQL의 GRANT와\nREVOKE 문을 통해 구현된다. 이는 사용자 신\n분(identity)에 기반하여 유연한 권한 관리가 가\n능하다는 장점이 있다.\n① (가), (나) ② (다), (라)\n③ (가), (다), (라) ④ (나), (다), (라)",
  "2026_71": "71. 랭킹을 부여하는 어떤 검색의 결과가 다음과 같고,\n랭킹 위치 i의 정확도(precision) 값을 P(i)라고 할 때,\nP(3), P(4), P(5)를 올바르게 나열한 것은? (단,\n질의와 관련이 있는 전체 문서의 개수는 10개이고,\nP(i)의 단위는 %이다.)\n문서번호 랭킹 위치 i 관련성\n10 1 예\n2 2 예\n3 3 예\n5 4 아니오\n17 5 아니오\n34 6 아니오\n16 7 예\n① 100, 100, 100 ② 100, 75, 60\n③ 100, 75, 50 ④ 30, 30, 40\n- 16",
  "2026_72": "72. 데이터 마이닝을 통해 획득 가능한 정보의 유형으로\n연관성, 순차, 분류, 군집, 예보 등을 들 수 있다.\n다음 보기의 예시 중 군집(cluster)에 해당하는\n것은?\n① 집을 구매한 사람들을 살펴보니 65%가 2주 이내에\n새로운 냉장고를 구매하였다.\n② 슈퍼마켓 구매 패턴을 연구한 결과, 콘칩을 구매한\n고객의 65%가 콜라도 같이 구매한 것으로 나타\n났다.\n③ 신용카드 회사에서는 고객 이탈을 우려하여, 관\n리자에게 이탈 가능성이 높은 고객을 찾을 수\n있는 모델을 제시해 준다.\n④ 은행 카드 사용자로부터 유사 그룹들을 찾는다거\n나, 하나의 데이터베이스를 고객의 인구통계학적\n정보와 개인 투자 유형을 기반으로 나누었다.",
  "2026_73": "73. CAP 정리는 모든 분산 데이터 저장소가 네트워크\n분할 또는 장애발생시 일관성(Consistency), 가용성\n(Availability), 분할 감내(Partition Tolerance) 등 세 개의\n특성 중 두 개만 동시에 보장할 수 있다는 것이다.\n네트워크가 두 개의 파티션으로 분할된 후 각 파티션에\n한 개씩의 노드가 있다고 가정할 때, 다음 설명에\n들어가는 ㉠, ㉡의 내용으로 옳은 것은?\n- ㉠을 보장하려면 네트워크가 분할된 후에도 시스\n템이 예상대로 계속 작동해야 하므로 각 파티션에\n속한 두 노드는 서로 다른 값을 읽을 수 있게 된\n다.\n- ㉡을 보장하려면 두 개의 파티션 중에서 한 파티\n션은 사용할 수 없는 것처럼 작동해야 한다.\n㉠ ㉡\n① 가용성 + 분할감내 일관성 + 분할감내\n② 가용성 + 분할감내 일관성 + 가용성\n③ 일관성 + 가용성 일관성 + 분할감내\n④ 일관성 + 가용성 가용성 + 분할감내\n6 -\n\n=== NEW PAGE ===",
  "2026_74": "74. 다음은 MapReduce 방식으로 어떤 기능을 구현하는\n방법을 설명한 것이다. 이 설명에 해당하는 기능은?\n- Map 함수는 각 문서를 파싱하여 (단어, 문서번\n호) 쌍의 시퀀스를 출력한다.\n- Reduce 함수는 주어진 단어에 대한 모든 쌍을\n받아들여 문서번호에 의해 정렬하고 (단어, 리스\n트(문서번호)) 쌍을 출력한다.\n① 분산 grep (distributed grep)\n② 웹-링크 그래프 (Web-Link graph)\n③ 단어 빈도수 (word count)\n④ 역 인덱스 (inverted index)",

            badge.style.background = 'rgba(239, 68, 68, 0.12)';
            badge.style.borderColor = 'rgba(239, 68, 68, 0.25)';
            badge.style.color = '#f87171';
            badge.innerHTML = '● 브라우저 저장 모드 (Offline)';
            badge.title = 'Flask 서버가 꺼진 상태입니다. 복구를 위해 임시로 브라우저 LocalStorage에 저장됩니다.';
        }
        
        topicMapping.forEach((item, idx) => {
            loadMemo(idx, item.concept);
        });
    }

    function checkMigration() {
        const localKeys = [];
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && key.startsWith('db_memo_')) {
                localKeys.push(key);
            }
        }
        
        if (localKeys.length > 0) {
            const banner = document.getElementById('migration-banner');
            const countEl = document.getElementById('migration-count');
            if (banner && countEl) {
                countEl.textContent = localKeys.length;
                banner.style.display = 'block';
            }
        }
    }

    async function migrateMemos() {
        const localKeys = [];
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && key.startsWith('db_memo_')) {
                localKeys.push(key);
            }
        }
        
        if (localKeys.length === 0) return;
        
        if (!confirm(`브라우저에 임시 저장된 공부 노트 ${localKeys.length}개를 서버 파일로 통합하시겠습니까? (이전 완료 시 브라우저 내의 데이터는 정리됩니다.)`)) {
            return;
        }
        
        let successCount = 0;
        const banner = document.getElementById('migration-banner');
        
        for (const key of localKeys) {
            const conceptName = key.replace('db_memo_', '');
            try {
                const dataStr = localStorage.getItem(key);
                if (dataStr) {
                    const data = JSON.parse(dataStr);
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            concept: conceptName,
                            text: data.text,
                            updatedAt: data.updatedAt,
                            action: 'save'
                        })
                    });
                    
                    if (response.ok) {
                        localStorage.removeItem(key);
                        serverMemos[conceptName] = {
                            text: data.text,
                            updatedAt: data.updatedAt
                        };
                        successCount++;
                    }
                }
            } catch (err) {
                console.error(`마이그레이션 오류 (${conceptName}):`, err);
            }
        }
        
        alert(`공부 코멘트 ${successCount}개가 성공적으로 서버 파일(db_memos.json)에 병합되었습니다.`);
        banner.style.display = 'none';
        
        renderTopics();
    }

    function loadMemo(idx, conceptName) {
        const displayEl = document.getElementById(`memo-display-${idx}`);
        const dateEl = document.getElementById(`memo-date-${idx}`);
        const deleteBtn = document.getElementById(`memo-delete-btn-${idx}`);
        const inputEl = document.getElementById(`memo-input-${idx}`);
        
        let memoData = null;
        
        if (isServerConnected) {
            if (serverMemos && serverMemos[conceptName]) {
                memoData = serverMemos[conceptName];
            }
        } else {
            const key = `db_memo_${conceptName}`;
            const dataStr = localStorage.getItem(key);
            if (dataStr) {
                try {
                    memoData = JSON.parse(dataStr);
                } catch (e) {
                    localStorage.removeItem(key);
                }
            }
        }
        
        if (displayEl && dateEl && deleteBtn && inputEl) {
            if (memoData) {
                displayEl.innerHTML = '';
                displayEl.textContent = memoData.text;
                dateEl.textContent = `최근 수정: ${memoData.updatedAt}`;
                deleteBtn.style.display = 'inline-block';
                inputEl.value = memoData.text;
            } else {
                displayEl.innerHTML = `<span class="memo-placeholder">등록된 공부 메모가 없습니다. 나만의 학습 팁을 적어 수험 공부 효율을 높여보세요!</span>`;
                dateEl.textContent = '최근 수정일시 없음';
                deleteBtn.style.display = 'none';
                inputEl.value = '';
            }
        }
    }

    function enableMemoEdit(idx) {
        document.getElementById(`memo-view-mode-${idx}`).style.display = 'none';
        document.getElementById(`memo-edit-mode-${idx}`).style.display = 'block';
        
        const content = document.getElementById(`accordion-${idx}`).querySelector('.accordion-content');
        content.style.maxHeight = 'none';
        setTimeout(() => {
            content.style.maxHeight = content.scrollHeight + 'px';
        }, 50);
    }

    function cancelMemoEdit(idx) {
        document.getElementById(`memo-view-mode-${idx}`).style.display = 'block';
        document.getElementById(`memo-edit-mode-${idx}`).style.display = 'none';
        
        const content = document.getElementById(`accordion-${idx}`).querySelector('.accordion-content');
        content.style.maxHeight = 'none';
        setTimeout(() => {
            content.style.maxHeight = content.scrollHeight + 'px';
        }, 50);
    }

    async function saveMemo(idx, conceptName) {
        const text = document.getElementById(`memo-input-${idx}`).value.trim();
        if (!text) {
            alert("공부 메모 내용을 입력해주세요.");
            return;
        }
        
        const now = new Date();
        const formattedDate = now.getFullYear() + '-' + 
            String(now.getMonth() + 1).padStart(2, '0') + '-' + 
            String(now.getDate()).padStart(2, '0') + ' ' + 
            String(now.getHours()).padStart(2, '0') + ':' + 
            String(now.getMinutes()).padStart(2, '0') + ':' + 
            String(now.getSeconds()).padStart(2, '0');
            
        if (isServerConnected) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        concept: conceptName,
                        text: text,
                        updatedAt: formattedDate,
                        action: 'save'
                    })
                });
                
                if (response.ok) {
                    serverMemos[conceptName] = {
                        text: text,
                        updatedAt: formattedDate
                    };
                } else {
                    const errData = await response.json();
                    throw new Error(errData.message || "서버 파일 저장에 실패했습니다.");
                }
            } catch (err) {
                alert(`[오류] 서버 파일 저장 실패: ${err.message}. 임시로 브라우저에 저장합니다.`);
                localStorage.setItem(`db_memo_${conceptName}`, JSON.stringify({ text, updatedAt: formattedDate }));
            }
        } else {
            localStorage.setItem(`db_memo_${conceptName}`, JSON.stringify({ text, updatedAt: formattedDate }));
        }
        
        document.getElementById(`memo-view-mode-${idx}`).style.display = 'block';
        document.getElementById(`memo-edit-mode-${idx}`).style.display = 'none';
        loadMemo(idx, conceptName);
        
        const content = document.getElementById(`accordion-${idx}`).querySelector('.accordion-content');
        content.style.maxHeight = 'none';
        setTimeout(() => {
            const newHeight = content.scrollHeight;
            content.style.maxHeight = newHeight + 'px';
        }, 50);
    }

    async function deleteMemo(idx, conceptName) {
        if (!confirm("작성하신 공부 노트를 완전히 삭제하시겠습니까?")) {
            return;
        }
        
        if (isServerConnected) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        concept: conceptName,
                        action: 'delete'
                    })
                });
                
                if (response.ok) {
                    if (serverMemos[conceptName]) {
                        delete serverMemos[conceptName];
                    }
                } else {
                    const errData = await response.json();
                    throw new Error(errData.message || "서버 파일 삭제에 실패했습니다.");
                }
            } catch (err) {
                alert(`[오류] 서버 파일 삭제 실패: ${err.message}.`);
                return;
            }
        } else {
            const key = `db_memo_${conceptName}`;
            localStorage.removeItem(key);
        }
        
        loadMemo(idx, conceptName);
        
        const content = document.getElementById(`accordion-${idx}`).querySelector('.accordion-content');
        content.style.maxHeight = 'none';
        setTimeout(() => {
            const newHeight = content.scrollHeight;
            content.style.maxHeight = newHeight + 'px';
        }, 50);
    }

    function filterCategory(category) {
        currentCategory = category;
        document.querySelectorAll('.filter-btn').forEach(btn => {
            if (btn.textContent === category) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        renderTopics();
    }

    function toggleAccordion(index) {
        const item = document.getElementById(`accordion-${index}`);
        const content = item.querySelector('.accordion-content');
        const isActive = item.classList.contains('active');

        document.querySelectorAll('.accordion-item').forEach((el, i) => {
            if (i !== index) {
                el.classList.remove('active');
                el.querySelector('.accordion-content').style.maxHeight = '0px';
            }
        });

        if (!isActive) {
            item.classList.add('active');
            
            let filtered = topicMapping;
            if (currentCategory !== '전체') {
                filtered = topicMapping.filter(item => item.category === currentCategory);
            }
            const dataObj = filtered[index];
            
            if (dataObj && dataObj.rep_question) {
                const viewer = document.getElementById(`viewer-${index}`);
                const titleEl = document.getElementById(`viewer-title-${index}`);
                const bodyEl = document.getElementById(`viewer-body-${index}`);
                const imgEl = document.getElementById(`viewer-img-${index}`);
                const imgContainer = document.getElementById(`viewer-img-container-${index}`);
                
                titleEl.textContent = `[대표 문제 예시] ${dataObj.rep_year}년 기출 ${dataObj.rep_num}번`;
                bodyEl.textContent = dataObj.rep_question;
                
                if (imgEl && imgContainer) {
                    imgContainer.style.display = 'block';
                    imgEl.src = `images/${dataObj.rep_year}_${dataObj.rep_num}.png`;
                }
                
                viewer.style.display = 'flex';
                
                item.querySelectorAll('.year-btn').forEach(btn => btn.classList.remove('active-btn'));
                setTimeout(() => {
                    const activeBtn = item.querySelector(`.q-btn-${dataObj.rep_year}-${dataObj.rep_num}`);
                    if (activeBtn) {
                        activeBtn.classList.add('active-btn');
                    }
                }, 50);
            }
            
            setTimeout(() => {
                content.style.maxHeight = content.scrollHeight + 'px';
            }, 150);
        } else {
            item.classList.remove('active');
            content.style.maxHeight = '0px';
        }
    }

    function openQuestion(year, num, idx, btnElement) {
        const key = `${year}_${num}`;
        const questionText = examDatabase[key] || "해당 기출문제를 데이터베이스에서 찾을 수 없습니다.";
        
        const item = document.getElementById(`accordion-${idx}`);
        const content = item.querySelector('.accordion-content');
        
        item.querySelectorAll('.year-btn').forEach(btn => btn.classList.remove('active-btn'));
        
        if (btnElement) {
            btnElement.classList.add('active-btn');
        }
        
        const viewer = document.getElementById(`viewer-${idx}`);
        const titleEl = document.getElementById(`viewer-title-${idx}`);
        const bodyEl = document.getElementById(`viewer-body-${idx}`);
        const imgEl = document.getElementById(`viewer-img-${idx}`);
        const imgContainer = document.getElementById(`viewer-img-container-${idx}`);
        
        titleEl.textContent = `${year}년도 감리사 기출 ${num}번`;
        bodyEl.textContent = questionText;
        
        if (imgEl && imgContainer) {
            imgContainer.style.display = 'block';
            imgEl.src = `images/${year}_${num}.png`;
        }
        
        viewer.style.display = 'flex';
        
        content.style.maxHeight = 'none';
        setTimeout(() => {
            const newHeight = content.scrollHeight;
            content.style.maxHeight = newHeight + 'px';
        }, 50);
    }

    function closeInlineViewer(idx, event) {
        if (event) event.stopPropagation();
        
        const item = document.getElementById(`accordion-${idx}`);
        const content = item.querySelector('.accordion-content');
        
        item.querySelectorAll('.year-btn').forEach(btn => btn.classList.remove('active-btn'));
        
        const viewer = document.getElementById(`viewer-${idx}`);
        viewer.style.display = 'none';
        
        content.style.maxHeight = 'none';
        setTimeout(() => {
            const newHeight = content.scrollHeight;
            content.style.maxHeight = newHeight + 'px';
        }, 50);
    }

    renderTopics();
    initMemos();
</script>
</body>
</html>
