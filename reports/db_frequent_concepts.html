<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>데이터베이스 12개년 빈출 개념 정밀 뷰어</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080b13;
            --card-bg: rgba(17, 24, 39, 0.75);
            --border-color: rgba(255, 255, 255, 0.06);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent-violet: #8b5cf6;
            --accent-blue: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%);
            --accent-glow: rgba(139, 92, 246, 0.12);
            --success: #10b981;
            --card-hover-border: rgba(139, 92, 246, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 2.5rem 1.5rem;
            min-height: 100vh;
            background-image: 
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.06) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.06) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.6rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.6rem;
            letter-spacing: -0.03em;
        }

        header p.subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
        }

        .meta-badges {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .badge {
            background: var(--border-color);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 0.35rem 0.9rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 500;
            backdrop-filter: blur(8px);
        }

        .badge.accent {
            background: rgba(139, 92, 246, 0.12);
            border-color: rgba(139, 92, 246, 0.25);
            color: #c084fc;
        }

        .filter-section {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.45rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .filter-btn:hover, .filter-btn.active {
            border-color: var(--accent-violet);
            color: #ffffff;
            background: rgba(139, 92, 246, 0.08);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .accordion-list {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-bottom: 4rem;
        }

        .accordion-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .accordion-item:hover {
            border-color: var(--card-hover-border);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .accordion-trigger {
            width: 100%;
            background: none;
            border: none;
            color: inherit;
            padding: 1.6rem 1.8rem;
            text-align: left;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .card-title-group {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .rank-badge {
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .concept-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        .category-tag {
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            padding: 0.15rem 0.45rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .freq-count-badge {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.15);
            color: var(--success);
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .card-meta-grid {
            display: grid;
            grid-template-columns: 90px 1fr;
            row-gap: 0.5rem;
            column-gap: 0.8rem;
            width: 100%;
            font-size: 0.88rem;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 0.8rem;
            margin-top: 0.2rem;
        }

        .meta-label {
            color: var(--text-muted);
            font-weight: 600;
        }

        .meta-value {
            color: var(--text-secondary);
            word-break: keep-all;
        }

        .meta-value.accent {
            color: #c8a2c8;
        }

        .accordion-trigger .arrow {
            transition: transform 0.3s ease;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .accordion-item.active .accordion-trigger .arrow {
            transform: rotate(180deg);
            color: var(--accent-violet);
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            background: rgba(0, 0, 0, 0.18);
        }

        .accordion-inner {
            padding: 1.6rem 1.8rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .section-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 0.3rem;
            margin-top: 0.2rem;
        }

        .year-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .year-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.35rem 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .year-btn:hover {
            background: var(--accent-gradient);
            border-color: transparent;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.25);
            transform: translateY(-1px);
        }

        .year-btn.active-btn {
            background: var(--accent-gradient);
            border-color: transparent;
            box-shadow: 0 4px 10px rgba(139, 92, 246, 0.3);
            color: #ffffff;
        }

        .year-btn .num-label {
            opacity: 0.7;
            font-size: 0.7rem;
        }

        .inline-question-viewer {
            background: #090d16;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            transition: all 0.3s ease;
        }

        .viewer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 0.5rem;
        }

        .viewer-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #60a5fa;
            font-family: 'Outfit', sans-serif;
        }

        .viewer-close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: color 0.2s;
        }

        .viewer-close-btn:hover {
            color: #ef4444;
        }

        .viewer-body {
            font-size: 0.92rem;
            line-height: 1.7;
            color: #d1d5db;
            white-space: pre-wrap;
            overflow-y: auto;
            max-height: 400px;
            padding-right: 0.5rem;
        }

        .viewer-body::-webkit-scrollbar {
            width: 6px;
        }
        .viewer-body::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.01);
        }
        .viewer-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .memo-section {
            background: rgba(139, 92, 246, 0.02);
            border: 1px dashed rgba(139, 92, 246, 0.15);
            border-radius: 8px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-bottom: 0.5rem;
        }

        .memo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.04);
            padding-bottom: 0.4rem;
        }

        .memo-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #c084fc;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .memo-date {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .memo-content-box {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #d1d5db;
            white-space: pre-wrap;
            min-height: 24px;
        }

        .memo-placeholder {
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.85rem;
        }

        .memo-textarea {
            width: 100%;
            min-height: 150px;
            background: #090d16;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: var(--text-primary);
            padding: 0.8rem 1rem;
            font-family: inherit;
            font-size: 0.92rem;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .memo-textarea:focus {
            border-color: var(--accent-violet);
            box-shadow: 0 0 8px rgba(139, 92, 246, 0.2);
        }

        .memo-btn-group {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
        }

        .memo-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.3rem 0.7rem;
            border-radius: 4px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .memo-btn:hover {
            color: #ffffff;
            border-color: var(--text-muted);
        }

        .memo-btn.save {
            background: var(--accent-gradient);
            border: none;
            color: #ffffff;
        }

        .memo-btn.save:hover {
            box-shadow: 0 2px 8px rgba(139, 92, 246, 0.3);
        }

        .memo-btn.delete {
            color: #f87171;
            border-color: rgba(248, 113, 113, 0.2);
        }

        .memo-btn.delete:hover {
            background: rgba(248, 113, 113, 0.05);
            border-color: #f87171;
        }

        /* 글로벌 네비게이션 바 */
        .global-nav {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            margin-bottom: 2.5rem;
            padding: 0.75rem 1rem;
            background: rgba(17, 24, 39, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        }

        .global-nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0.6rem 1.2rem;
            border-radius: 10px;
            transition: all 0.25s ease;
            border: 1px solid transparent;
        }

        .global-nav a:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.05);
        }

        .global-nav a.active {
            color: var(--text-primary);
            background: var(--accent-gradient);
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.2);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="global-nav">
        <a href="se_frequent_concepts.html">소프트웨어공학</a>
        <a href="sa_frequent_concepts.html">시스템 아키텍처</a>
        <a href="db_frequent_concepts.html" class="active">데이터베이스</a>
        <a href="pm_frequent_concepts.html">프로젝트 관리</a>
        <a href="sc_frequent_concepts.html">보안</a>
    </div>
    <header>
        <h1>데이터베이스 기출 정밀 분석 대시보드</h1>
        <p class="subtitle">12개년 기출 전수 조사 기반 3회 이상 빈출 세부 토픽 분석 엔진</p>
        <div class="meta-badges">
            <span class="badge">기출 범위: 2015년 ~ 2026년</span>
            <span class="badge accent">총 분석 데이터: 300 문항</span>
            <span class="badge">검출된 빈출 세부 토픽: <span id="topic-count-badge">0</span>개</span>
            <span id="storage-badge" class="badge" style="cursor: help;">저장소 로딩 중...</span>
        </div>
    </header>

    <div id="migration-banner" style="display: none; background: rgba(139, 92, 246, 0.12); border: 1px solid rgba(139, 92, 246, 0.3); padding: 1.2rem; border-radius: 10px; margin-bottom: 2rem; text-align: center; backdrop-filter: blur(10px); box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
        <div style="font-size: 0.95rem; font-weight: 600; color: #ffffff; margin-bottom: 0.5rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
            <span>💡 이전 브라우저(LocalStorage)에 작성된 공부 코멘트 <span id="migration-count" style="color: #c084fc; font-weight: 700;">0</span>개가 발견되었습니다.</span>
        </div>
        <div style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.8rem;">
            이 코멘트들을 서버 파일 저장소(`data/db_memos.json`)로 안전하게 가져와서 영구 보존할 수 있습니다.
        </div>
        <button onclick="migrateMemos()" style="background: var(--accent-gradient); border: none; color: #ffffff; padding: 0.4rem 1.2rem; border-radius: 6px; font-size: 0.82rem; font-weight: 700; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 8px rgba(139, 92, 246, 0.3);">
            파일 서버로 코멘트 동기화하기
        </button>
    </div>

    <div class="filter-section">
        <button class="filter-btn active" onclick="filterCategory('전체')">전체</button>
        <button class="filter-btn" onclick="filterCategory('DB개념 및 설계')">DB개념 및 설계</button>
        <button class="filter-btn" onclick="filterCategory('DB언어')">DB언어</button>
        <button class="filter-btn" onclick="filterCategory('DBMS 기술')">DBMS 기술</button>
        <button class="filter-btn" onclick="filterCategory('DB응용')">DB응용</button>
        <button class="filter-btn" onclick="filterCategory('빅데이터 및 AI데이터')">빅데이터 및 AI데이터</button>
    </div>

    <div class="accordion-list" id="accordion-container">
        <!-- Javascript will inject accordion elements here -->
    </div>
</div>

<script>
    const examDatabase = {
  "2015_51": "51. 다음의 릴레이션 R과 함수 종속을 고려해 보자.\n이 릴레이션을 BCNF로 올바르게 분해한 것은?\n(다음 답항에서 밑줄은 후보키를 의미함.)\nR(A, B, C)\n후보키: (A, B)\n함수종속: (A, B)→C\nC→B\n① R1(A, C), R2(A, B)\n② R1(B, C), R2(B, A)\n③ R1(C, B), R2(C, A)\n④ R1(A, B, C), R2(C, B)",
  "2015_52": "52. 수퍼타입 개체 A가 서브타입 개체 B와 C로 세분화\n(specialization)된다고 하자. 다음의 벤다이어\n그램과 의미가 동일한 Extended E-R 다이어그램은?\n(단, 수퍼타입과 서브타입을 연결하는 중간 원 안의\n표시 ‘d’는 disjoint를, ‘o’는 overlap을 표현\n하고, 또한 수퍼타입 쪽의 단일선은 partial speci-\nalization을, 이중선은 total specialization을 표현\n한다.)\n① ②\n③ ④\n- 13",
  "2015_53": "53. 다음 스케줄에 대한 설명으로 옳은 것은? (트랜잭션\n연산 앞의 표기는 시간을 시:분:초로 표시한 것임)\n01:00:01 T1 read(x)\n01:00:02 T2 write(x)\n01:00:03 T1 write(x)\n01:00:04 T3 write(x)\n① 충돌 직렬가능과 뷰 직렬가능을 모두 만족하는\n스케줄이다.\n② 충돌 직렬가능은 만족하고 뷰 직렬가능은 만족\n하지 않는 스케줄이다.\n③ 충돌 직렬가능은 만족하지 않고 뷰 직렬가능은\n만족하는 스케줄이다.\n④ 충돌 직렬가능과 뷰 직렬가능을 모두 만족하지\n않는 스케줄이다.",
  "2015_54": "54. 인덱스 튜닝과 관련된 설명으로 가장 거리가 먼\n것은?\n① R.A가 S.B를 참조하는 외래키일 때, S.B에 대한\n인덱스는 R에 대한 삽입 속도를 높여줄 수 있다.\n② 동등(equality) 및 비동등(nonequality) 질의에는\n해시 구조의 인덱스가 유용하다.\n③ 단일 디스크 판독으로 테이블 전체를 읽을 수\n있을 정도의 소형 테이블에 대한 인덱스는 성능\n저하를 일으킬 수도 있다.\n④ 인덱스 사용으로 인해 질의에서 절약되는 시간\n보다 삽입이나 갱신에서 손해보는 시간이 더\n크다면 인덱스를 사용하지 않는 것이 좋다.",
  "2015_55": "55. 연관규칙 탐사와 Apriori 원리에 관련된 설명 중\n잘못된 것은?\n① 지지도란 해당 항목집합을 포함하는 트랜잭션의\n비율을 말한다.\n② 항목집합 {A,B}가 빈발하지 않다면 항목집합\n{A,B,C}도 빈발하지 않다.\n③ 항목집합 {A,B}의 지지도는 항목집합 {A,B,C}의\n지지도 보다 크거나 같다.\n④ 규칙 {A,B}→{C,D}의 신뢰도가 {A,B,C}→D의\n신뢰도보다 크거나 같다.\n3 -\n\n=== NEW PAGE ===",
  "2015_56": "56. 다음은 데이터베이스 시스템의 3-층 구조(3-tier\narchitecture)에 대한 설명이다. ㉮와 ㉯에 들어갈\n용어로 가장 적합한 것은?\n3-층 구조는 2-층 구조(2-tier architecture)를\n구성하는 클라이언트와 데이터베이스 서버 사\n이에 중간 단계를 하나 더 추가한 것이다. 중간\n단계는 일반적으로 ( ㉮ )라 부르며 ( ㉯ )\n을 처리한다.\n㉮ ㉯\n① 응용 (프로그램) 서버 함수형 프로그램\n② 응용 (프로그램) 서버 비즈니스 로직\n③ 클라우드 (프로그램) 서버 함수형 프로그램\n④ 클라우드 (프로그램) 서버 비즈니스 로직",
  "2015_57": "57. 다음은 관계 데이터 모델에서의 주요 제약조건\n네 가지를 나타낸다. 릴레이션에 대해 투플 삽입\n연산이 발생한다면, 다음 중 어떤 제약조건들이\n위배될 수 있는지 바르게 나열한 것은?\n가. 도메인 제약조건(domain constraint)\n나. 키 제약조건(key constraint)\n다. 엔티티 무결성 제약조건(entity integrity\nconstraint)\n라. 참조 무결성 제약조건(referential integrity\nconstraint)\n① 가, 나, 라\n② 가, 다, 라\n③ 나, 다, 라\n④ 가, 나, 다, 라\n- 14",
  "2015_58": "58. 다음 중 SQL 뷰(view)에 대한 설명으로 적합하지\n않은 것은? (2개 선택)\n① 뷰에 대한 투플의 삽입은 시스템에 의해 거부될\n수 있다.\n② 원본과의 불일치 문제로 인해 뷰 생성 시 GROUP\nBY 절을 사용할 수 없다.\n③ 집계(aggregation)에 의해 생성된 뷰의 경우\n일반적으로 갱신을 허용하지 않는다.\n④ 실체화된 뷰(materialized view)를 생성할 경우\n에는 CREATE VIEW 구문을 사용하고, 그렇지 않은\n뷰를 생성할 경우에는 CREATE TABLE을 사용한다.",
  "2015_59": "59. 낙관적 동시성 제어(optimistic concurrency control)\n에서 각 트랜잭션은 세 가지 단계로 실행되는데,\n그 단계를 순서대로 바르게 나열한 것은?\n① 읽기 단계(read phase) - 검증 단계(validation\nphase) - 쓰기 단계(write phase)\n② 갱신 단계(update phase) - 검증 단계(validation\nphase) - 종료 단계(commit phase)\n③ 갱신 단계(update phase) - 종료 단계(commit\nphase) - 검증 단계(validation phase)\n④ 읽기 단계(read phase) - 쓰기 단계(write phase)\n- 검증 단계(validation phase)",
  "2015_60": "60. 문서 d에서 단어 “감리사”의 TF(term frequency)\n값이 3이라 하고, 문서집합 D에서 단어 “감리사”의\nIDF(inverse document frequency) 값이 0.3010이라\n하자. 그렇다면, 문서집합 D와 문서 d에서 단어\n“감리사”의 TF-IDF 값을 바르게 계산한 것은?\n① 0.1003 (= 0.3010 / 3)\n② 9.9668 (= 3 / 0.3010)\n③ 0.9030 (= 3 × 0.3010)\n④ 1.6459 (= 3 ×  )\n4 -\n\n=== NEW PAGE ===",
  "2015_61": "61. 다음은 데이터 마이닝 기법 중에서 무엇에 대한\n설명인가?\n연속성을 갖는 변수의 미래 값을 (다른 변수\n값들을 활용하여) 예측하는 방법으로, 일반적\n으로 변수에 대해 선형 혹은 비선형 모델을\n가정한다.\n① 회귀분석(regression analysis)\n② 연속변수분석(continuous variable analysis)\n③ 상관관계분석(correlation analysis)\n④ 다변량분석(multivariate analysis)",
  "2015_62": "62. 규칙 기반 분류기(rule-based classifier)를\n사용하여 다음의 훈련 집합으로부터 \"(Marital Status\n= Single) → No\"라는 규칙 r을 찾았다. 이 때,\n이 규칙 r의 적용범위 Coverage(r)과 정확성\nAccuracy(r)로 옳은 것은?\nTID Marital Status Taxable Income Class\n1 Single 125K No\n2 Married 100K No\n3 Single 70K No\n4 Married 120K No\n5 Divorced 95K Yes\n6 Married 60K No\n7 Divorced 220K No\n8 Single 85K Yes\n9 Married 75K No\n10 Single 90K Yes\n① Coverage(r) = , Accuracy(r) = \n \n② Coverage(r) = , Accuracy(r) = \n \n③ Coverage(r) =  , Accuracy(r) = \n \n④ Coverage(r) = , Accuracy(r) = \n \n- 15",
  "2015_63": "63. 다음 표는 다차원 데이터 모델에서의 OLAP 연산\n들을 설명한 것이다. 표의 ㉮, ㉯에 들어갈 연산\n들이 바르게 짝지어진 것은?\n연산 이름 연산 설명\n하나 혹은 그 이상의 축을 중심으로\n㉮\n셀들을 선택\n속성 값의 범위를 명시하여 셀들의\n㉯\n부분집합(부분큐브)을 선택\n롤-업 작은 단위(예: day)에서 큰 단위\n(roll-up) (예: month, year)로 집계 수행\n드릴-다운 큰 단위(예: year)에서 작은 단위\n(drill- down) (예: month, day)로 집계 수행\n㉮ ㉯\n① 다이싱(dicing) 슬라이싱(slicing)\n② 슬라이싱 다이싱\n③ 피벗팅(pivoting) 다이싱\n④ 다이싱 피벗팅",
  "2015_64": "64. 버클리 대학의 Eric Brewer 교수가 발표한 CAP\n이론은 분산 컴퓨팅 환경의 세 가지 특징을 정의\n하고 있는데, NoSQL은 이중 한 두 가지 특징을\n포기하는 대신 고성능, 확장성 등의 지원에 초점을\n맞추고 있다. 여기서 CAP 이론의 세 가지 특징을\n바르게 기술한 것은?\n① C-Consistency, A-Atomicity, P-Persistency\n② C-Concurrency, A-Atomicity, P-Partition Tolerance\n③ C-Consistency, A-Availability, P-Partition\nTolerance\n④ C-Concurrency, A-Availability, P-Persistency\n5 -\n\n=== NEW PAGE ===",
  "2015_65": "65. 다음은 고객(Customer)과 주문(Orders)에 관한\n릴레이션이다. 밑줄 친 속성은 기본키이고, 점선\n밑줄은 외래키이다. 2개의 릴레이션을 이용하여\n고객의 아이디(custid), 이름(name)과 고객이\n구매한 책 값(saleprice)의 총액을 구하고자 한다.\n작성된 SQL문 중 틀린 것은?\n(릴레이션)\nCustomer(custid, name)\nOrders(orderid, custid, bookname, saleprice)\n① SELECT custid, (SELECT name FROM Customer cs\nWHERE cs.custid = od.custid)\nAS name, SUM(saleprice)\nFROM Orders od\nGROUP BY od.custid;\n② SELECT cs.custid, cs.name, s\nFROM (SELECT custid, SUM(saleprice) s\nFROM Orders GROUP BY custid) od,\nCustomer cs\nWHERE cs.custid = od.custid;\n③ SELECT cs.custid, cs.name, s\nFROM Customer cs, Orders od\nWHERE cs.custid = od.custid AND\n(SELECT SUM(saleprice) s FROM Orders od);\n④ SELECT cs.custid, cs.name, SUM(saleprice)\nFROM Customer cs, Orders od\nWHERE cs.custid = od.custid\nGROUP BY cs.custid, cs.name;",
  "2015_66": "66. 다음 그림은 트랜잭션들을 병행 수행시킨 후 로\n그의 기록이다. 데이터베이스 시스템 수행 중\n시스템에 이상이 생겼다. 이상이 생긴 후 로그의\n기록을 살펴보니 다음과 같았다. 로그는 데이터\n베이스의 변경에 대한 기록으로 즉시 변경(immediate\nupdate) 방법을 사용한다. 이 상태에서 복구를\n하고자 한다. 로그의 <T,DI,v1,v2>는 순서대로\n<트랜잭션 이름, 데이터 항목, 변경전 값, 변경후\n값>을 나타낸다. 트랜잭션들의 복구 후 데이터\n값에 대한 내용 중 틀린 것은?\n- 16\n<start, T1>\n<T1, D, 20, 30>\n<commit, T1>\n<checkpoint>\n<start, T2>\n<T2, C, 12, 13>\n<start, T4>\n<T4, B, 15, 16>\n<start, T3>\n<T3, D, 30, 31>\n<T4, A, 20, 21>\n<commit, T4>\n*system crash*\n① A: 21 ② B: 16\n③ C: 12 ④ D: 31",
  "2015_67": "67. 정보검색에 있어서 재현률(recall)을 다음의 정보\n검색 결과표를 이용하여 기술하였을 때 올바른\n것은?\n(정보검색 결과표)\nTP(True Positive): 검색된 결과 중 실제 정답인\n정보의 수\nFP(False Positive): 검색된 결과 중 실제 정답이\n아닌 정보의 수\nFN(False Negative): 검색되지 않은 정보 중 실제\n정답인 정보의 수\nTN(True Negative): 검색되지 않은 정보 중 실제\n정답이 아닌 정보의 수\n① TP/(TN+FP) ② TP/(TP+TN)\n③ TP/(TP+FN) ④ TP/(FP+FN)\n6 -\n\n=== NEW PAGE ===",
  "2015_68": "68. 릴레이션 'employee'와 'department'에서 다음\nSQL 질의문의 수행결과는?\n<질의문>\nSELECT e.dno, d.dname, e.ename, e.score\nFROM employee e, department d\nWHERE e.dno = d.dno and (e.dno, score) IN\n(SELECT dno, max(score)\nFROM employee GROUP BY dno);\nemployee department\neno ename address score dno dno dname\n10 Hong 서울 80 100 100 영업\n20 Kim 대전 90 200 200 개발\n30 Lee 강릉 90 100 300 서비스\n40 Kim 대전 95 200\n50 Hong 서울 65 300\n① { (100, 영업, Lee, 90), (200, 개발, Kim, 95),\n(300, 서비스, Hong, 65) }\n② { (100, 영업, Lee, 90), (200, 개발, Kim, 95) }\n③ { (100, 영업, Lee, 90) }\n④ { (100, 영업, Hong, 80), (100, 영업, Lee, 90),\n(200, 개발, Kim, 90), (200, 개발, Kim, 95),\n(600, null, Hong, 65) }\n- 17",
  "2015_69": "69. 다음의 데이터베이스에서 ‘부양가족을 2명 이상\n가진 사원의 사번(eno), 성명(ename), 부양가족\n수를 검색’하는 질의를 SQL로 적절하게 표현한\n것은? (단, 밑줄은 스키마에서 기본키를 의미한다.)\n(2개 선택)\nemployee(eno, ename, adddress, score, dno)\ndependent(eno, dename, birthdate, relation)\n① SELECT eno, ename, count(*)\nFROM employee e, dependent d\nWHERE e.eno = d.eno and count(*) >= 2\nGROUP BY d.eno;\n② SELECT e.eno, e.ename, count(*)\nFROM employee e, dependent d\nWHERE EXISTS (SELECT * FROM dependent\nGROUP BY eno HAVING count(*) >= 2)\nGROUP BY e.eno, e.ename;\n③ SELECT e.eno, e.ename, t.cnt\nFROM employee e, (SELECT eno, count(*) as cnt\nFROM dependent GROUP BY\neno HAVING count(*) >= 2) t\nWHERE e.eno = t.eno;\n④ SELECT e.eno, e.ename, count(*)\nFROM employee e, dependent d\nWHERE e.eno = d.eno\nGROUP BY e.eno, e.ename\nHAVING count(*) >= 2;",
  "2015_70": "70. 관계 대수는 일반적으로 다섯 가지 기본 연산을\n가지며, 이를 관계 대수 연산의 완전 집합(complete\nset)이라 부른다. 완전 집합의 다섯 가지 기본\n연산들을 바르게 나타낸 것은? (단, π는 ∏로\n표현하기도 한다.)\n① { σ, π, × , ∪, ∩ }\n② { σ, π, ⋈, ∪, ÷ }\n③ { σ, π, × , ∪, − }\n④ { σ, π, ⋈, ∪, ∩ }\n7 -\n\n=== NEW PAGE ===",
  "2015_71": "71. 다음은 회사 데이터베이스의 일부를 표현한 E-R\n다이어그램이다. 밑줄 친 속성은 키 속성을 의미\n한다. 이 E-R 다이어그램을 BCNF에 속하는\n릴레이션으로 변환하는 과정을 기술한 설명으로\n가장 적절한 것은?\n① EMPLOYEE(ENO, Name) 릴레이션에 Supervisee의\nENO 속성을 외래키로 추가한다.\n② EMPLOYEE(ENO, Name) 릴레이션에 Supervisor의\nENO 속성을 외래키로 추가한다.\n③ EMPLOYEE(ENO, Name) 릴레이션에 Hours 속성을\n추가한다.\n④ PROJECT(PNO, Budget) 릴레이션에 Hours 속성을\n추가한다.",
  "2015_72": "72. 트랜잭션 관리의 회복 기법에서 체크포인트(check\npoint)를 사용한다고 가정하자. 다음과 같이 체크\n포인트가 사용될 때, 시스템이 다운된 후 회복\n관리자가 수행하는 연산으로 틀린 것은? (2개 선택)\n체크포인트 c가 정상적으로 수행되고 체크\n포인트 f가 수행될 때 시스템이 다운되었다.\n트랜잭션 T1은 c 이전에 시작해서 c 이전에\n완료되었고, T2는 c 이전에 시작해서 f 이전에\n완료되었다. T3는 c 이전에 시작해서 f일 때\n수행 중이었고 T4는 c 이후에 시작해서 f\n이전에 완료되었다. T5는 c 이후에 시작해서\nf일 때 수행 중이었다.\n① Undo-list에 있는 모든 트랜잭션들에 대해 로그에\n기록된 순서대로 Undo 연산을 수행한다.\n② T1은 회복 작업에 관련될 필요가 없다.\n③ T2는 c 이후에 일어난 변경 부분에 대해서만\nRedo 연산을 수행한다.\n④ T3는 c 이후에 일어난 변경 부분에 대해서만\nUndo 연산을 수행한다.\n- 18",
  "2015_73": "73. SQL의 질의처리 성능을 개선하기 위해 튜닝할\n때, 불필요한 소트(sort)가 발생하지 않도록 하는\n것으로 거리가 먼 것은? (2개 선택)\n① Union ALL을 Union으로 대체\n② Distinct를 Exists 서브쿼리로 대체\n③ Sort Aggregate를 Sort Unique로 대체\n④ 데이터 존재 여부만을 확인할 경우 불필요한\nCount 연산 제거",
  "2015_74": "74. 다음의 릴레이션 A와 B에 대해 어떤 연산을 했을 때,\n그 결과로 릴레이션 C가 얻어진다. 이 때 C가\n얻어지도록 하는 어떤 연산은 무엇인가?\nA B C\nW X Y X Y Z X Y Z\nw1 x1 y1 x1 y1 z1 x1 y1 z1\nw2 x1 y1 x1 y1 z2 x1 y1 z2\nw3 x1 y2 x2 y3 z3 x2 y3 z3\nw4 x2 y3 x3 y3 z3\n① A와 B의 왼쪽 외부조인(left outer join)\n② A와 B의 오른쪽 외부조인(right outer join)\n③ A에 대해 B의 세미조인(semijoin)\n④ B에 대해 A의 세미조인(semijoin)",
  "2015_75": "75. 어떤 릴레이션 R(A, B, C, D, E, F, G)에서 다음과\n같은 함수 종속성이 존재한다고 가정하자. 이 때\n릴레이션 R에서 후보키가 아닌 것은?\nCE → A, A → ABCDEFG, BD → E\n① CE ② A ③ BD ④ BCD\n8 -\n\n=== NEW PAGE ===\n\n시스템 구조",
  "2016_51": "51. 현재 가장 널리 사용되는 빅데이터의 속성을 3V라고\n정의할 때, 3V의 세 가지 속성이 바르게 짝지어진\n것은?\n① 규모(Volume), 다양성(Variety), 속도(Velocity)\n② 규모(Volume), 다변성(Verbosity), 가시성(Visibility)\n③ 가시성(Visibility), 다변성(Verbosity), 변동성(Var-\niability)\n④ 변동성(Variability), 다양성(Variety), 속도\n(Velocity)",
  "2016_52": "52. 다음과 같은 상품 구매 트랜잭션에 대해 연관규칙\n탐사를 수행했다고 하자. 이 때 계산된 지지도(support)\n와 신뢰도(confidence)로 옳지 않은 것은?\nT1 = {milk, coke, beer}\nT2 = {milk, pepsi, juice}\nT3 = {milk, beer}\nT4 = {coke, juice}\nT5 = {milk, pepsi, beer}\n① 항목집합 {beer, milk}의 지지도는 3/5이다.\n② {milk} → beer의 지지도는 4/5이다.\n③ {milk} → beer의 신뢰도는 3/4이다.\n④ {juice} → milk의 신뢰도는 1/2이다.",
  "2016_53": "53. 데이터 객체에 대한 제어 기법 중 필수 접근 제어\n(mandatory access control)에 대한 설명으로\n옳지 않은 것은?\n① 데이터 객체에 대해서는 일정한 비밀 등급이, 사\n용자에 대해서는 일정한 허가 등급이 지정된다.\n② 사용자의 허가 등급이 데이터의 비밀 등급보다\n크거나 같은 경우에 판독이 가능하다.\n③ 사용자의 허가 등급이 데이터의 비밀 등급보다\n커야 갱신이 가능하다.\n④ 보안 등급은 극비(top secret) > 비밀(secret) >\n대외비(confidential) > 일반(unclassified)의\n순서이다.\n- 12",
  "2016_54": "54. 2단계 로킹 규약(2 phase locking protocol)의\n로크 전환(혹은 로크 변환)에 대한 다음 설명\n중 옳은 것은?\n① 항목 X에 read_lock(X)를 수행하여 공유 로크를\n획득한 후 나중에 write_lock(X)를 수행하여 배\n타적 로크로 로크를 상승(upgrade)시킬 수 있다.\n② 항목 X에 write_lock(X)를 수행하여 배타적\n로크를 획득한 후 나중에 read_lock(X)를 수행\n하여 공유 로크로 로크를 상승시킬 수 있다.\n③ 항목 X에 read_lock(X)를 수행하여 공유 로크를\n획득한 후 나중에 write_lock(X)를 수행하여 배타적\n로크로 로크를 하강(downgrade)시킬 수 있다.\n④ 항목 X에 read_lock(X)를 수행하여 배타적 로크를\n획득한 후 나중에 write_lock(X)를 수행하여 공유\n로크로 로크를 하강시킬 수 있다.",
  "2016_55": "55. 다음 스케줄에 대해 타임스탬프 순서 기법을 적용\n하였을때 설명이 올바른 것은? (TS(Ti)는 트랜잭션\nTi의 타임스탬프이고, read_TS(x)는 read(x) 연산을\n성공적으로 수행한 트랜잭션들의 타임스탬프 중 가장\n큰 것이고, write_TS(x)는 write(x) 연산을 성공적\n으로 수행한 트랜잭션들의 타임스탬프 중 가장 큰\n것이다. read_TS(x)와 write_TS(x)의 초기값은 모두\n1이라고 가정한다.)\n2시: T1 read(x)\n3시: T2 write(x)\n4시: T1 write(x)\n① T1은 read(x)를 실행하고 read_TS(x)를 그대로\n둔다.\n② T2의 write(x)는 TS(T2) ≥ write_TS(x)이므로\n거부된다.\n③ 타임스탬프 순서 기법을 적용하면, 위에 주어진\n스케줄은 직렬 가능하다.\n④ 토마스(Thomas)의 기록 규칙을 적용하면, T1의\nwrite(x)는 무시된다.\n2 -\n\n=== NEW PAGE ===",
  "2016_56": "56. 다음은 두 릴레이션 R, S에 대해 어떤 관계 대수\n연산을 적용한 결과 릴레이션을 보이고 있다. R\n과 S에 대해 적용된 관계 대수 연산은?\nR S\nA B B C\na 1 1 x\nb 2 2 y\nc 1 3 z\n결과 테이블\nA B B C\na 1 2 y\na 1 3 z\nb 2 3 z\nc 1 2 y\nc 1 3 z\n① R⋈S\nN\n② R⋈ S\nB=B\n③ R⋈ S\nB<B\n④ R×S",
  "2016_57": "57. 릴레이션 E, W가 아래와 같을 때, 완전외부조인\n(full outer join) E W의 실행결과 중 옳은\n것은?\nE\nMember City Country\nKim Seoul Korea\nSusan London England\nSmith Austin USA\nNakamura Tokyo Japan\nW\nMember Gender Age\nKim Female 39\nSusan Female 32\nGates Male 53\nNakamura Male 39\n①\nMember City Country Gender Age\nKim Seoul Korea Female 39\nSusan London England Female 32\nNakamura Tokyo Japan Male 39\n- 13\n②\nMember City Country Gender Age\nKim Seoul Korea Female 39\nSusan London England Female 32\nNakamura Tokyo Japan Male 39\nSmith Austin USA null null\n③\nMember City Country Gender Age\nKim Seoul Korea Female 39\nSusan London England Female 32\nNakamura Tokyo Japan Male 39\nGates null null Male 53\n④\nMember City Country Gender Age\nKim Seoul Korea Female 39\nSusan London England Female 32\nNakamura Tokyo Japan Male 39\nSmith Austin USA null null\nGates null null Male 53",
  "2016_58": "58. 내장 SQL(Embedded SQL)은 C, Java, JSP 등 프로\n그래밍 언어(호스트 언어)에 SQL을 직접 끼워넣어\n사용하며 SQL 전처리 컴파일러(precompiler)가\n번역을 한다. 내장 SQL에 대한 다음 설명 중\n옳지 않은 것은?\n① SQL 문 결과를 행단위로 처리하기 위하여 호스트\n언어에 추가적인 명령문이 사용된다.\n② SQL 문에서는 호스트 언어에 의하여 선언된 변수를\n참조할 수 없다.\n③ 호스트 언어에 의하여 선언된 변수를 이용하여\nSQL 문의 실행 결과를 저장할 수 있다.\n④ 데이터베이스에 NULL 값을 삽입할 수 있으며,\nNULL 값을 읽어낼 수 있다.\n3 -\n\n=== NEW PAGE ===",
  "2016_59": "59. 릴레이션 STUDENT가 다음과 같을 때, 관계 대수\n 와 동일한 결과를 얻는 SQL\n\n문장을 바르게 나타낸 것은?\nSTUDENT\nFname Lname StudID Sex GPA DeptNo\nChulsoo Kim 20160395 M A 5\nGilok Hong 20152932 F B 4\nYoosin Kim 20160244 M C 5\nSoonhee Lee 20140294 F A 5\nChansoo Shim 20151285 M A 5\nSoonsin Lee 20140893 M B 4\nDasol Park 20150203 F B 4\nKyunghee Jung 20162011 F A 5\n① SELECT ALL Sex, GPA FROM STUDENT;\n② ALL SELECT Sex, GPA FROM STUDENT;\n③ DISTINCT SELECT Sex, GPA FROM STUDENT;\n④ SELECT DISTINCT Sex, GPA FROM STUDENT;\n※ 다음 릴레이션을 읽고 60번~61번에 대하여 답하시오.\n직원 정보를 저장하는 릴레이션 EMPLOYEE\nCREATE TABLE EMPLOYEE\n(NAMEVARCHAR(30) NOT NULL,\nSSN CHAR(9) NOT NULL,\nADDRVARCHAR(30),\nPHONE CHAR(10),\nPRIMARY KEY (SSN));\n부양가족 정보를 저장하는 릴레이션 DEPENDENT\nCREATE TABLE DEPENDENT\n(ESSN CHAR(9) NOT NULL,\nDEPNAMEVARCHAR(30)NOT NULL,\nAGE INT,\nPRIMARY KEY (ESSN, DEPNAME),\nFOREIGN KEY (ESSN) REFERENCES EMPLOYEE (SSN));",
  "2016_60": "60. “부양가족이 없는 직원의 이름을 검색하라”라는 SQL\n질의를 다음과 같이 작성했다고 할 때, ㉮, ㉯, ㉰에\n들어갈 내용으로 바르게 구성된 것은?\nSELECT NAME\nFROM EMPLOYEE\nWHERE ㉮ (SELECT ㉯ FROM DEPENDENT WHERE ㉰) ;\n- 14\n번호 ㉮ ㉯ ㉰\n① NOT IN * NAME=DEPNAME\n② NOT EXISTS * SSN=ESSN\n③ NOT IN ESSN SSN=ESSN\n④ NOT EXISTS ESSN NAME=DEPNAME",
  "2016_61": "61. 두 릴레이션 EMPLOYEE, DEPENDENT로부터 다음과\n같이 EMPDEPEND라는 뷰(view)를 생성하고자 할\n때, ㉱와 ㉲에 들어갈 내용이 바르게 짝지어진\n것은? (단, EMPDEPEND에서 EMPSSN과 EMPNAME은\n직원의 SSN과 이름을 각각 나타내고, NO_DEPS와\nM_AGE는 해당 직원의 부양가족 수와 부양가족의\n나이 평균을 각각 나타낸다.)\nEMPDEPEND\nEMPSSN EMPNAME NO_DEPS M_AGE\nCREATE VIEW EMPDEPEND(EMPSSN, EMPNAME, NO_DEPS,\nM_AGE) AS\nSELECT SSN, NAME, ㉱, ㉲\nFROM EMPLOYEE, DEPENDENT\nWHERE SSN=ESSN\nGROUP BY SSN;\n㉱ ㉲\n① UNIQUE(*) MEDIAN(AGE)\n② COUNT(*) MEDIAN(AGE)\n③ COUNT(*) AVG(AGE)\n④ UNIQUE(*) AVG(AGE)\n4 -\n\n=== NEW PAGE ===",
  "2016_62": "62. SQL 문으로 테이블 DEPT와 EMP를 생성하고 뷰\nEMPDEPT를 생성하였다. 뷰 생성과 투플 삽입 후\n아래 문장을 실행했을 때 오류가 발생하지 않는 것은?\n(SQL 문)\nCREATE TABLE DEPT(\nDEPTNO INTEGER PRIMARY KEY,\nDNAME VARCHAR(14) NOT NULL,\nLOC VARCHAR(13)\n);\nINSERT INTO DEPT VALUES(10, 'sales', 'seoul');\nCREATE TABLE EMP (\nEMPNO INTEGER PRIMARY KEY,\nENAME VARCHAR(10),\nJOB VARCHAR(9),\nDEPTNO INTEGER REFERENCES DEPT(DEPTNO)\n);\nINSERT INTO EMP VALUES(1, 'park', 'managing', 10);\nCREATE VIEW EMPDEPT AS\nSELECT ENAME, DNAME, JOB, DEPT.DEPTNO\nFROM EMP, DEPT\nWHERE EMP.DEPTNO=DEPT.DEPTNO;\n① INSERT INTO EMPDEPT VALUES ('kim', 'sales',\n'managing', 10);\n② CREATE VIEW EMPDNAME AS SELECT ENAME, DNAME\nFROM EMPDEPT;\n③ CREATE INDEX E_01 ON EMPDEPT(ENAME);\n④ UPDATE EMPDEPT SET DEPTNO=20 WHERE JOB LIKE\n'managing';",
  "2016_63": "63. 권한(authorization)을 부여하는 ㉮와 회수하는\n㉯를 SQL로 바르게 표현한 것은?\n㉮ 테이블 EMPLOYEE에 대한 SELECT 권한을 계정\nMary와 John에게 부여한다.\n㉯ 테이블 EMPLOYEE에 대한 SELECT 권한을 계정\nJohn으로부터 회수한다.\n- 15\n① ㉮ = GRANT SELECT ON EMPLOYEE TO Mary, John;\n㉯ = REVOKE SELECT ON EMPLOYEE FROM John;\n② ㉮ = AUTHORIZE SELECT ON EMPLOYEE TO Mary, John;\n㉯ = CANCEL SELECT ON EMPLOYEE FROM John;\n③ ㉮ = GRANT EMPLOYEE TO Mary, John ON SELECT;\n㉯ = REVOKE EMPLOYEE FROM John ON SELECT;\n④ ㉮ = AUTHORIZE EMPLOYEE TO Mary, John ON SELECT;\n㉯ = CANCEL EMPLOYEE FROM John ON SELECT;",
  "2016_64": "64. 데이터베이스 시스템의 데이터 독립성에 대한 설명\n중 옳지 않은 것은?\n① ANSI 3단계 스키마 아키텍쳐는 내부단계(내부스\n키마), 개념단계(개념스키마), 외부단계(외부스\n키마)로 나눈다. 3단계 스키마의 목적은 물리적\n데이터베이스로부터 사용자의 응용을 분리시키는\n것이다.\n② 외부스키마는 데이터베이스의 물리적 저장구조를,\n개념스키마는 특정 사용자 그룹이 관심을 갖는\n데이터베이스 부분을, 내부스키마는 모든 사용\n자를 위한 전체 데이터베이스 구조를 기술한다.\n③ 물리적 데이터 독립성은 개념스키마를 변경하지\n않으면서 내부스키마를 변경할 수 있음을 말한다.\n내부스키마의 접근 구조 변경이나, 파일 재구성이\n개념스키마에 가능한 한 영향을 주지 않도록 한다.\n④ 논리적 데이터 독립성은 외부스키마를 변경하지\n않으면서 개념스키마를 변경하는 것을 말한다.\n개념스키마의 데이터베이스 확장, 제약조건 갱신\n등 변경이 외부스키마에 가능한 한 영향을 주지\n않도록 한다.\n5 -\n\n=== NEW PAGE ===",
  "2016_65": "65. 데이터 품질에 관한 다음 설명 중 옳지 않은 것은?\n① 데이터 품질은 조직의 목적 달성을 위하여 관리\n되는 데이터가 이용자의 만족을 충족시킬 수 있\n는 수준을 말한다.\n② 데이터 품질 관리는 조직이 운영하는 정보시스\n템을 활용하는 이용자의 기대를 만족시키기 위\n하여 수행하는 데이터 관리 활동이다.\n③ 데이터 품질 진단의 종류 중 데이터 구조 진단은\n데이터 관리 프로세스를 분석하여 문제점을 도\n출하고, 이를 개선할 수 있는 핵심 업무 프로\n세스를 최적화한다.\n④ 데이터 품질 진단을 위한 데이터 프로파일링은\n데이터의 중요 정보와 통계 값을 수집하는 정보\n분석 기법이다.",
  "2016_66": "66. 상품(상품번호, 상품명, 담당부서, 구매자) 릴레이션\n에서 상품번호와 상품명은 각각 후보키이고 구매자는\n하나의 부서(담당부서)에 속한다고 하자. 이 릴레\n이션의 정규형과 관련된 설명 중 옳은 것을 모두\n고르시오. (2개 선택)\n① 이 릴레이션이 속한 최고차 정규형은 1NF이다.\n② 이 릴레이션은 현재 담당부서→구매자의 함수\n종속이 성립한다.\n③ 이 릴레이션은 현재 상품명→(상품번호, 담당부서,\n구매자)의 함수 종속이 성립한다.\n④ R1(구매자, 담당부서), R2(상품번호, 상품명,\n구매자)로 분해하면 두 릴레이션은 BCNF에 속하게\n된다.",
  "2016_67": "67. 다음의 릴레이션과 함수 종속을 고려해 보자. 이\n릴레이션의 현재 속한 정규형과 BCNF로 분해 후\n릴레이션의 수를 올바르게 나타낸 것은?\nR(A,B,C,D,E)\n후보키: (A,C)\n함수종속: A→B, C→D, (A,C)→E\n① 1NF, 3\n② 2NF, 2\n③ 2NF, 3\n④ 3NF, 2\n- 16",
  "2016_68": "68. 뷰에 대한 갱신은 기본 릴레이션에 대한 갱신으로\n변환되는데, 이 때 대부분의 관계 DBMS에서 갱신이\n가능한 뷰로 가장 적절한 것은?\n① 기본키가 포함된 한 릴레이션 위에 정의된 뷰\n② 두 개 이상의 릴레이션 위에 조인으로 정의된 뷰\n③ 집단 함수가 포함된 뷰\n④ 기본 릴레이션의 애트리뷰트들 중에서 뷰에\n포함되지 않은 애트리뷰트에 대해 NOT NULL이\n지정되어 있을 때의 뷰",
  "2016_69": "69. 다음의 스케줄대로 트랜잭션을 실행했을 때 발생하는\n문제는? (트랜잭션 연산 앞의 표기는 시간을 시:\n분:초로 표시한 것임)\n00:00:00 T1 read(x)\n00:00:01 T1 x = x - N\n00:00:02 T1 write(x)\n00:00:03 T2 read(x)\n00:00:04 T2 x = x + M\n00:00:05 T2 write(x)\n00:00:06 T1 read(y)\n00:00:07 T1 fail\n① 갱신 손실(lost update) 문제\n② 부정확한 요약(incorrect summary) 문제\n③ 반복할 수 없는 읽기(unrepeatable read) 문제\n④ 오손 읽기(dirty read) 문제",
  "2016_70": "70. 공공데이터에 대한 다음 설명 중 가장 거리가 먼\n것은?\n① Open API를 활용하려면 정보제공자에게 활용신청\n을 해야하며, 승인을 받은 후 인증키를 받아 사\n용한다.\n② 공공데이터 또는 Open API로 제공되는 데이터는\n특별한 사유가 존재하지 않는 한 상업적으로\n이용이 가능하다.\n③ 공공데이터는 공공기관 등에서 데이터의 공개\n여부를 판단하여 제공하며, 미제공 데이터에\n대해 일반 사용자가 공개를 신청하는 것은 허용\n되지 않는다.\n④ 공공데이터 서비스 유형은 SOAP, REST, RSS, LINK\n등이 있다.\n6 -\n\n=== NEW PAGE ===",
  "2016_71": "71. 테이블 BOOK(bookid, bookname, price)에 대해 2\n개의 트랜잭션 T1과 T2가 동시에 실행된다고 하자.\n사용자가 입력한 명령을 시간별로 다음과 같이 실\n행했을 경우, ㉮와 ㉯에 출력되는 결과 값으로\n옳은 것은? (단, BOOK 테이블을 읽거나 쓰는 트랜\n잭션은 T1과 T2만 있으며, BOOK 테이블에 bookid\n가 1인 투플이 존재한다고 가정한다.)\n트랜잭션 T1 트랜잭션 T2\nBEGIN TRANSACTION\nSET TRANSACTION ISOLATION\nLEVEL READ COMMITTED;\nselect sum(price) as 총액\nfrom book;\n(결과 값) 10000\nBEGIN TRANSACTION\nSET TRANSACTION ISOLATION\nLEVEL REPEATABLE READ;\nselect sum(price) as 총액\nfrom book;\n(결과 값) 10000\nupdate book set\nprice=price+100\nwhere bookid=1;\n/* 여기서 대기상태 */\nselect sum(price) as 총액\nfrom book;\n(결과 값) ㉮\nCOMMIT;\nselect sum(price) as 총액\nfrom book;\n(결과 값) ㉯\nCOMMIT;\n㉮ ㉯\n① 10000 10000\n② 10000 10100\n③ 10100 10000\n④ 10100 10100",
  "2016_72": "72. 다음 표는 문서들에 대한 검색을 수행한 결과,\n검색된(retrieved) 문서와 적합한(relevant)\n문서의 수를 각각 나타낸다. 재현율(recall)과\n정확률(precision)을 각각 바르게 계산한 것은?\n- 17\n적합한(관련된) 문서 수\n(Number of relevant documents)\n구 분\nYes No\n검색된 문서 수 Yes 75 50\n(Number of\nretrieved\ndocuments) No 45 30\n재현율 정확률\n① 0.375 0.150\n② 0.375 0.400\n③ 0.525 0.475\n④ 0.625 0.600",
  "2016_73": "73. 다음 문장에서 빈칸 ㉮와 ㉯에 들어갈 용어로\n적절한 것은?\n예측 모델링(Predictive Modeling)은 목표 변수를\n설명 변수의 함수 모델로 생성하는 작업을 말한다.\n예측 모델링은 이산형 목표 변수에 사용되는 ( ㉮ )\n과(와) 연속형 목표 변수에 사용하는 ( ㉯ )의 두\n가지 유형이 있다.\n㉮ ㉯\n① 군집(clustering) 서술(descriptive)\n② 군집(clustering) 분류(classification)\n③ 분류(classification) 회귀(regression)\n④ 회귀(regression) 서술(descriptive)\n7 -\n\n=== NEW PAGE ===",
  "2016_74": "74. 다음은 회사 데이터베이스를 표현한 E-R 다이어\n그램의 일부를 보이고 있다. 속성 이름에 밑줄 친\n것은 키 속성을 의미한다. 이 E-R 다이어그램과\n관련된 설명으로 적절한 것을 모두 고르시오.\n(2개 선택) (단, 이 E-R 다이어그램은 DEPARTMENT와\nEMPLOYEE 릴레이션으로만 변환된다고 가정한다.)\n① 특정 부서에 배치되지 않은 직원이 존재\n할 수 있다.\n② 직원이 없는 부서가 존재할 수 있다.\n③ DEPARTMENT 개체를 릴레이션으로 변환하면\nDEPARTMENT(DNO, DName)이 된다.\n④ EMPLOYEE 개체를 릴레이션으로 변환하면 EMPLOYEE\n(ENO, Name)이 된다.",
  "2016_75": "75. 다음은 대학 데이터베이스의 일부를 E-R 다이어\n그램으로 표현한 것이다. 이 다이어그램에 대한\n설명으로 옳지 않은 것은? (단, 수퍼타입과 서브\n타입을 연결하는 중간 원안의 표시 ‘d’는 dis-\njoint를, PERSON 개체 쪽의 단일선은 partial을\n표현한다고 하자.)\n① 이 E-R 다이어그램은 세분화(specialization) 관계를\n표현한 것이다.\n② PERSON이 수퍼클래스에 해당하는 개체이다.\n③ FACULTY나 STUDENT가 아닌 PERSON 개체는 없다.\n④ FACULTY 개체이면서 동시에 STUDENT 개체일 수는\n없다.\n- 18\n8 -\n\n=== NEW PAGE ===\n\n시스템 구조",
  "2017_51": "51. 뷰의 장점을 설명하는 것 중 가장 거리가 먼 것은?\n① 테이블 구조가 변경되어도 뷰를 사용하는 응용 프로그램은\n변경하지 않아도 된다.\n② 뷰를 생성함으로써 복잡한 질의를 단순하게 작성할 수 있다.\n③ 직원의 급여 정보 같은 숨기고 싶은 정보가 존재한다면\n해당 칼럼을 빼고 뷰를 생성하여 사용한다.\n④ 서버에 저장되는 컴포넌트로 독립적으로 실행되거나\n다른 프로그램으로부터 실행된다.",
  "2017_52": "52. 다음은 어느 회사의 데이터베이스 구축을 위한 ER 다이어\n그램 설계 내용이다. ER 다이어그램을 데이터베이스 테이\n블로 변환할 때 생성되는 테이블의 가장 적절한 개수는?\n① 3-4개 ② 5-6개 ③ 7-8개 ④ 9-10개",
  "2017_53": "53. 다음과 같은 함수적 종속성 집합에 대한 설명 중 틀린 것은?\n① 함수적 종속성 집합 { A → { B, C, D, E }, E → { F,\nG } }로부터 A → { F, G }를 추론할 수 있다.\n② 함수적 종속성 집합 { A → B, C → { D, E }, { A, C }\n→ F } 로부터 폐포집합 { A }+ = { A, B }를 구할 수 있다.\n③ 다음 두 함수적 종속성 집합 F = { A → C, AC → D, E\n→ AD, E → H }와 G = { A → CD, E → AH }는 동등하다.\n④ 함수적 종속성 집합 { B → A, D → A, AB → D }에 대한\n최소 커버는 { B → A, D → A }이다.\n- 12",
  "2017_54": "54. 다음과 같이 선언된 테이블 MYTABLE에서 슈퍼키의 개수는?\n(SQL 문)\nCREATE TABLE MYTABLE (\nX INTEGER,\nY INTEGER,\nZ INTEGER NOT NULL,\nPRIMARY KEY (X, Y),\nUNIQUE (Z)\n);\n① 2 ② 3 ③ 4 ④ 5",
  "2017_55": "55. 다음은 릴레이션 R1, R2와 SQL 질의문이다. SQL 문에 대한\n관계대수 연산으로 가장 적합한 것은? (⋈은 자연조인,\n⟕은 왼쪽 외부조인 기호)\n(릴레이션)\nR1(r1name, a, b, c)\nR2(r2name, a, b, c)\n(SQL 문)\nSELECT r1name FROM R1\nWHERE EXISTS (SELECT * FROM R2\nWHERE (r1name = r2name))\n① π (R1 ⟕ (R2))\nr1name r1name = r2name\n② π (R2 - R1)\nr1name\n③ π (R1 ⋈ (R2))\nr1name r1name = r2name\n④ π (R1 - R2)\nr1name",
  "2017_56": "56. SQL Injection을 줄이기 위한 방법 중 가장 거리가 먼 것은?\n① 저장 프로시저 사용을 가능한 줄이도록 한다.\n② 입력 데이터가 허용되는 타입에 한하여 허용한다.\n③ 인용부호에 대한 체크를 통하여 인젝션 가능성을 제거한다.\n④ 웹접근 코드가 접근하는 데이터베이스의 경우 꼭 필요한\n접근권한 만을 부여한다.\n2 -\n\n=== NEW PAGE ===",
  "2017_57": "57. 수강신청 데이터를 저장한 릴레이션 ENROLL에서 강좌번호\n(COURSEID) 100과 101번 강좌를 모두 수강 신청한 학생의\n학번을 찾는 SQL 질의로 틀린 것은?\nENROLL(COURSEID, STUDENTID, TIME)\n① SELECT STUDENTID\nFROM ENROLL E1, ENROLL E2\nWHERE E1.STUDENTID=E2.STUDENTID AND\nE1.COURSEID=100 AND E2.COURSEID=101\n② SELECT STUDENTID\nFROM ENROLL E\nWHERE E.COURSEID=100\nINTERSECT\nSELECT STUDENTID\nFROM ENROLL E\nWHERE E.COURSEID=101\n③ SELECT STUDENTID\nFROM ENROLL E\nWHERE E.COURSEID =100 AND\nSTUDENTID IN (SELECT STUDENTID\nFROM ENROLL WHERE COURSEID=101)\n④ SELECT STUDENTID\nFROM ENROLL E\nWHERE E.COURSEID=100 AND E.COURSEID=101",
  "2017_58": "58. 다음 SQL 문과 질의에 대한 결과 값으로 맞는 것은?\n(SQL CREATE, INSERT 문)\nCREATE TABLE TEST(A INTEGER, B VARCHAR(10));\nINSERT INTO TEST VALUES (1, 'kim');\nINSERT INTO TEST VALUES (2, ' ');\nINSERT INTO TEST VALUES (3, NULL);\nINSERT INTO TEST VALUES (4, 'park');\nINSERT INTO TEST VALUES (5, NULL);\nINSERT INTO TEST VALUES (6, 'lee');\n(Oracle DBMS의 SQL 문)\nSELECT X, X-Y, Z\nFROM (SELECT COUNT(*) AS X, COUNT(B) AS Y,\nCOUNT(CASE WHEN B IS NOT NULL AND LTRIM(B) IS NULL\nTHEN '1' END) AS Z\nFROM TEST) T;\n(SQL Server DBMS의 SQL 문)\nSELECT X, X-Y, Z\nFROM (SELECT COUNT(*) AS X, COUNT(B) AS Y,\nCOUNT(CASE WHEN B IS NOT NULL AND LEN(LTRIM(B)) = 0\nTHEN '1' END) AS Z\nFROM TEST) T;\n- 13\n① 6, 2, 1 ② 6, 3, 0\n③ 6, 2, 0 ④ 6, 3, 1",
  "2017_59": "59. 다음의 데이터베이스에서“3명 이상의 사원이 근무하는\n각 부서에서 부서 번호, 부서 이름, 그리고 그 부서에서\n연봉이 4만불 이상인 사원의 수를 검색하라”는 질의를\nSQL로 올바르게 표시한 것은?\nEMPLOYEE(Name, Ssn, Salary, Sex, Dno)\nDEPARMENT(Dname, Dnumber, Mgr_ssn)\n① SELECT Dnumber, Dname, COUNT(*)\nFROM DEPARTMENT, EMPLOYEE\nWHERE Dnumber = Dno AND\nSalary >= 40000 AND\nDno IN (SELECT Dno\nFROM EMPLOYEE\nGROUP BY Dno\nHAVING COUNT(*) > 2)\nGROUP BY Dnumber;\n② SELECT Dnumber, Dname, COUNT(*)\nFROM DEPARTMENT, EMPLOYEE\nWHERE Dnumber = Dno AND\nSalary >= 40000 AND\nCOUNT(*) > 2\nGROUP BY Dnumber, Dname;\n③ SELECT Dnumber, Dname, COUNT(*)\nFROM DEPARTMENT, EMPLOYEE\nWHERE Dnumber = Dno AND\nSalary >= 40000 AND\nDno IN (SELECT Dno\nFROM EMPLOYEE\nGROUP BY Dno\nHAVING COUNT(*) > 2)\nGROUP BY Dnumber, Dname;\n④ SELECT Dnumber, Dname, COUNT(*)\nFROM DEPARTMENT, EMPLOYEE\nWHERE Dnumber = Dno AND\nDno IN (SELECT Dno\nFROM EMPLOYEE\nWHERE Salary >= 40000\nGROUP BY Dno\nHAVING COUNT(*) > 2)\nGROUP BY Dnumber, Dname;\n3 -\n\n=== NEW PAGE ===",
  "2017_60": "60. EMPLOYEE(Eno, Name, DeptName, Salary) 테이블에 대해\n“평균 봉급이 가장 높은 부서명(DeptName)을 검색” 하는\n질의를 다음과 같이 작성한다고 할 때, 밑줄 친 부분에\n들어갈 내용으로 맞는 것은?\nSELECT DeptName\nFROM EMPLOYEE\nGROUP BY DeptName\n㉠ >= ㉡ (SELECT AVG(Salary)\nFROM EMPLOYEE\n㉢ DeptName);\n㉠ ㉡ ㉢\n① WHERE Salary all ORDER BY\n② WHERE AVG(Salary) some GROUP BY\n③ HAVING Salary some ORDER BY\n④ HAVING AVG(Salary) all GROUP BY",
  "2017_61": "61. 인덱스의 생성 여부를 결정하기 위해 고려할 사항에 대한\n설명이 잘못된 것은? (2개 선택)\n① 유일한 키 속성에 대해서는 인덱스를 생성한다.\n② 실렉션 조건이나 조인 조건에서 사용되는 속성에 대해서는\n인덱스를 생성한다.\n③ 인덱스 탐색만을 통해 답변이 가능한 질의에 대해서는\n클러스터 인덱스를 고려한다.\n④ 동등 조건과 범위 질의에 사용되는 속성에 대해서는 해\n시 인덱스가 유리하다.",
  "2017_62": "62. EMPLOYEE(Eno, Name, Salary, CommissionPercent) 테이블에\n대한 다음과 같은 질의가 있다.\nSELECT Name\nFROM EMPLOYEE\nWHERE ((Salary * CommissionPercent) + Salary) > 15000;\n이러한 유형의 질의의 경우 실행 빈도가 높을 가능성이 많지만\nSalary 열에 대한 인덱스가 존재한다고 하더라도 제대로 이용\n하지 못할 것이다. 이러한 경우에 활용할 수 있는 가장 적절한\n인덱싱 기법은?\n① Bitmap indexing\n② Function-based indexing\n③ Hash indexing\n④ R-tree indexing\n- 14",
  "2017_63": "63. 트랜잭션 T1, T2가 수행되는 다음 그림에서, T1의 연산\n결과(x + 100)가 T2의 연산 결과(x * 2)로 인해 바르게\n저장되지 않는 현상이 발생할 수 있다. 이 같은 현상을\n무엇이라고 하는가?\n① 갱신 손실(lost update)\n② 오손 읽기(dirty read)\n③ 지연 갱신(deferred update)\n④ 갱신 충돌(update conflict)",
  "2017_64": "64. 트랜잭션 T1은 x와 y에 100을 더하고, 트랜잭션 T2는 y와 x에\n2를 곱하는 트랜잭션이다. 두 트랜잭션이 다음과 같은\n순서로 실행이 되었을 때 발생한 상황은?\n시간1: T1 lock(x); read(x);\n시간2: T2 lock(y); read(y);\n시간3: T1 x = x + 100\n시간4: T2 y = y * 2\n시간5: T1 write(x)\n시간6: T2 write(y)\n시간7: T1 lock(y)\n시간8: T2 lock(x)\n① 갱신 손실(lost update)\n② 교착 상태(deadlock)\n③ 오손 읽기(dirty read)\n④ 철회(rollback)",
  "2017_65": "65. 데이터 마이닝 분석기법과 관련된 이론을 가장 적절하게\n연결한 것은?\n① 지지도(support) - 인공신경망\n② 시그모이드(sigmoid) 함수 - 의사결정트리\n③ 맨하튼 거리(manhattan distance) - 군집분석\n④ 엔트로피(entropy) - 연관분석\n4 -\n\n=== NEW PAGE ===",
  "2017_66": "66. 다음 두 릴레이션 R과 S에 대해 조인 연산을 수행했다\n고 할 때, 이 연산의 조인 선택률(join selectivity)은?\nR ⋈ S\nD1 < D4\n① 1 ② 4/9 ③ 5/9 ④ 5",
  "2017_67": "67. 물리적 데이터베이스 설계 단계에서 색인 구조를 결정하\n는데 도움이 되는 지침으로 틀린 것은?\n① 한 애트리뷰트에 들어 있는 상이한 값들의 개수가 전체\n레코드의 수와 비슷하고 검색에서 해당 애트리뷰트에\n대한 동등 조건이 사용된다면 비 클러스터링(non-clustering)\n색인을 생성하는 것이 좋다.\n② 갱신이 빈번하게 이루어지는 릴레이션에 대해서 색인을\n많이 생성하여 갱신의 효율성을 증진할 수 있다.\n③ 가능하면 정수형 애트리뷰트에 색인을 만드는 것이 좋고\n반대로 VARCHAR 데이터 타입을 갖는 애트리뷰트에는 색\n인을 만드는 것을 피해야 한다.\n④ 대량의 데이터를 삽입할 때는 모든 색인들을 제거하고\n데이터 삽입이 끝난 후에 색인들을 다시 생성하는 것이\n효율적이다.",
  "2017_68": "68. 질의 최적화 기법에 대한 설명으로 틀린 것은?\n① 주기억장치보다 더 큰 용량의 데이터에 대하여 SQL의 order\nby 절을 수행하기 위해서는 정렬-합병 전략의 외부 정렬을\n수행해야 한다.\n② 관계대수의 실렉트 연산을 수행하기 위해서는 데이터베\n이스 전체를 읽어들이는 파일 스캔 탐색이나 인덱스를\n활용한 인덱스 스캔 탐색을 수행한다.\n③ 두 릴레이션 R과 S에 대하여 조인 연산을 수행할 때, R과\nS의 레코드들이 조인 애트리뷰트 A와 B값에 물리적으로\n정렬되어 있으면 분할-해시 조인이 가장 효율적으로\n구현될 수 있다.\n④ 외부 조인은 중첩 루프 조인이나 단일 루프 조인 알고리즘\n중 하나를 수정하여 구현할 수 있다.\n- 15",
  "2017_69": "69. 사용자 U1이 생성한 EMPLOYEE(Eno, Name, Salary) 테이블에\n대해 다음의 SQL 명령을 순서대로 실행할 때, 권한 부여\n에러가 발생하는 위치를 모두 모아놓은 것은?\n1 U1: GRANT INSERT, DELETE ON EMPLOYEE TO U2;\nU1: GRANT SELECT ON EMPLOYEE TO U3 WITH\n2\nGRANT OPTION;\n3 U2: GRANT INSERT ON EMPLOYEE TO U4;\n4 U3: GRANT SELECT ON EMPLOYEE TO U5;\n5 U5: GRANT SELECT ON EMPLOYEE TO U6;\n6 U1: GRANT SELECT ON EMPLOYEE TO U6;\n7 U1: REVOKE SELECT ON EMPLOYEE FROM U3;\n8 U6: SELECT * FROM EMPLOYEE;\n9 U5: SELECT * FROM EMPLOYEE;\n10 U6: UPDATE EMPLOYEE SET Salary = Salary * 1.1;\n① 2, 3, 5 ② 3, 5, 10\n③ 3, 5, 9, 10 ④ 3, 5, 8, 9, 10",
  "2017_70": "70. 트랜잭션 T1, T2, T3에 대하여 스케줄 s1, s2 중에서 충돌\n직렬 가능한(conflict serializable) 것은?\nT1: r1(x); r1(z); w1(x);\nT2: r2(z); r2(y); w2(z);\nT3: r3(x); r3(y); w3(y);\ns1: r1(x); r2(z); r1(z); r3(x); r3(y); w1(x); w3(y); r2(y); w2(z);\ns2: r1(x); r2(z); r3(x); r1(z); r2(y); r3(y); w1(x); w2(z); w3(y);\n① s1 ② s2 ③ s1, s2 ④ 없음",
  "2017_71": "71. 다음 그림은 의사결정 트리(decision tree)를 구축하는데\n있어서, 분리되기 전 노드(P)와 분리된 후 노드(C1, C2)\n의 상태를 나타낸다. 그림에서 N()은 노드에 속한 엔트리\n개수, E()는 해당 노드의 엔트로피(entropy)를 나타낸다\n고 할 때, 노드 분리에 따른 정보 이득(information gain)은?\n① 0.54 ② 0.40 ③ 0.30 ④ 0.16\n5 -\n\n=== NEW PAGE ===",
  "2017_72": "72. 대용량의 데이터 처리의 필요성이 커짐에 따라 NoSQL\n기술에 대한 수요도 증가하고 있다. 관계형 데이터베\n이스와 비교했을 때, NoSQL의 특징에 대한 설명으로\n가장 적절한 것은?\n① 각 데이터가 독립적으로 설계되어 있어 데이터를 여러\n서버에 분산하여 작업하며 다양한 조인 연산도 지원한다.\n② NoSQL 데이터베이스는 키-값형 스토어, 문서형 데이터베\n이스, 컬럼형 데이터베이스, 그래프 데이터베이스 등으로\n구분할 수 있다.\n③ MongoDB는 문서형 데이터베이스로서, 문서(document)는\n관계형 데이터베이스의 테이블을 구성하는 열들의 집합에\n해당한다.\n④ 대부분의 NoSQL에서는 비정형 대용량의 데이터를 다루므로,\n관계형 데이터베이스에서 활용되던 인덱스 구조를 사용\n하지 않는다.",
  "2017_73": "73. 분산 데이터베이스 설계에서 분할(fragmentation)에 관한\n설명 중 가장 거리가 먼 것은?\n① 응용에 필요한 데이터들을 모아서 필요한 곳에 가까이\n저장하기 위해 분할이 필요하다.\n② 분할의 방법에는 수직 분할, 수평 분할, 혼합 분할 방법이\n있다.\n③ 분할 이전의 전역 릴레이션에 포함된 튜플은 분할 후 반\n드시 한 개의 분할 단편에 포함되어야 한다.\n④ 모든 분할 방법에 대해 조인 연산을 이용하여 분할 이전과\n동등한 결과를 얻을 수 있어야 한다.",
  "2017_74": "74. 데이터마이닝 분류 분석을 위한 다음 오분류표의\n평가 지표에 대한 설명으로 가장 거리가 먼 것은?\n예측값(검색결과 포함) 예측값(검색결과에 미포함)\n실제값 참(P) TP(True Positive) FN(False Negative)\n실제값 거짓(N) FP(False Positive) TN(True Negative)\n① 민감도(sensitivity) – TP / P\n② 특이도(specificity) – TN / N\n③ 정확도(precision) – TP / (TP + FP)\n④ 재현률(recall) – TP / (TP + TN)\n- 16",
  "2017_75": "75. Google의 PageRank 알고리즘과 관련하여 3개의 웹사이트가\n다음 그림과 같이 연결되어 있다고 하자. 이 웹에 대한\n전이 행렬(transition matrix) M의 i번째 행, j번째 열의\n원소 m 는 다음과 같이 정의된다. 전이 행렬 M에서 그 값이\nij\n1/2인 원소의 개수와 1인 원소의 개수를 올바르게 나열한\n것은?\n- 페이지 j가 페이지 i에 대한 링크를 가지고 있고 j가\n링크한 전체 페이지 수가 r(≥1) 페이지일 때 m = 1/r\nij\n- 그렇지 않으면 m = 0\nij\n① 2, 1 ② 3, 2 ③ 4, 1 ④ 5, 0\n6 -\n\n=== NEW PAGE ===\n\n시스템 구조",
  "2018_51": "51. 다음과 같이 가 ~ 바에 데이터베이스 설계의 주요 과정들이\n나열되어 있다. 데이터베이스 설계과정의 순서로 가장 적\n절한 것은?\n가. 논리적 설계 나. 데이터베이스 튜닝\n다. 요구사항 수집 및 분석 라. 물리적 설계\n마. 정규화 바. 개념적 설계\n① 다, 바, 마, 가, 나, 라 ② 다, 바, 가, 마, 라, 나\n③ 다, 가, 바, 마, 라, 나 ④ 다, 바, 가, 라, 마, 나",
  "2018_52": "52. 데이터베이스 구축 방법론은 데이터베이스를 구축할\n때 필요한 공정에 대한 기준서이다. 그 중 품질활동과\n관련된 다음 설명 중 가장 적절하지 않은 것은?\n① 데이터 품질에 대한 가장 중요한 판단 요소는 해당\n데이터가 업무에 도움이 되는가이다.\n② 국제 데이터 품질 표준인 ISO8000에서는 데이터 품\n질 기준을 크게 유효성과 활용성으로 구분한다.\n③ 품질보증 활동에는 프로젝트를 수행하는 동안 오류가\n발생하지 않도록 사전에 대비하는 활동까지 포함한다.\n④ 데이터베이스 구축 공정이 모두 완료된 후 데이터 품\n질활동이 진행된다.",
  "2018_53": "53. 다음의 개체-관계도는 어떤 공급자(Supplier)가 어떤\n프로젝트(Project)에 어떤 부품(Part)을 몇 개(Quty)\n공급(Supply) 하는지를 나타내고 있다. 주어진 개체-\n관계도를 4개의 릴레이션으로 적절하게 변환 설계한\n결과에 따라 해당 릴레이션들을 생성하기 위한 DDL\n명령어에서 외래키 지정을 가장 많이 포함하는 릴레\n이션의 외래키 개수는?\n① 1 ② 2 ③ 3 ④ 4\n- 12",
  "2018_54": "54. 다음은 키에 관한 설명이다. 맞는 설명의 개수는?\n가. 수퍼 키는 후보 키도 된다.\n나. 후보 키는 수퍼 키도 된다.\n다. 기본 키는 후보 키도 된다.\n라. 기본 키는 수퍼 키도 된다.\n① 1개 ② 2개 ③ 3개 ④ 4개",
  "2018_55": "55. 데이터베이스에 대한 구조를 데이터베이스 스키마\n(schema)라 하고, 어떤 특정 시점의 데이터베이스에\n존재하는 데이터를 데이터베이스 상태(state)라고 할\n때, 사용자가 자주 변경하게 되는 것은?\n① 데이터베이스 스키마\n② 데이터베이스 상태\n③ 데이터베이스 스키마와 데이터베이스 상태 모두\n④ 데이터베이스 스키마와 데이터베이스 상태 모두 아님",
  "2018_56": "56. 릴레이션 R을 정규화하기 위하여 함수적 종속성을 이용하여\nR1, R2로 분해하였을 때 무손실 조인분해(lossless-Join\ndecomposition)에 해당되는 것은?\n(릴레이션) R(A, B, C, D)\n(함수적 종속성) (A, B) -> C, C -> D, D -> A\n① R1(A, B), R2(B, C, D) ② R1(A, B, C), R2(C, D)\n③ R1(A, B, D), R2(C, D) ④ R1(A, B), R2(A, C, D)",
  "2018_57": "57. 개체-관계도로부터 관계형 데이터베이스를 설계하는\n과정에 대한 설명 중 가장 적절하지 않은 것은?\n① 소유(owner) 엔터티 타입 E를 갖는 약한(weak) 엔터티\n타입 W의 경우, W의 모든 속성과 E에 해당하는 릴레이션\n의 기본키를 외래키로 가지는 릴레이션으로 설계한다.\n② 이진 1:1 관계에 참여하는 엔터티 타입 S와 T의 경우, S\n의 기본키에 대한 외래키를 T에 추가하여 릴레이션을 설\n계하며, 이때 완전 참여여부를 고려할 필요가 있다.\n③ 이진 M:N 관계 타입이면서 관계 인스턴스가 많지 않은\n경우에는 1:N 관계처럼 하나의 릴레에션에만 외래키를\n포함시킬 수 있다.\n④ 엔터티 타입 S의 속성 A가 다치 속성값을 갖는 경우, S\n에 해당하는 릴레이션의 기본키와 A를 속성으로 갖는\n별도의 릴레이션으로 설계한다.\n2 -\n\n=== NEW PAGE ===",
  "2018_58": "58. 트리거(trigger)와 주장(assertion)에 대한 일반적인 설명\n중 가장 적절하지 않은 것은?\n① 트리거는 명시된 이벤트가 발생할 때마다 DBMS\n가 자동적으로 수행하는 프로시저로 사용자가\n정의한다.\n② 트리거는 주장보다 더 비절차적이다.\n③ 주장은 트리거보다 더 일반적인 무결성 제약조건\n이다.\n④ 도메인 제약조건과 참조무결성 제약조건은 주\n장의 특별한 유형이다.",
  "2018_59": "59. 다음은 가상의 릴레이션 R(A, B, C)과 S(C, D, E)이다.\n관계 대수식 계산 결과에서 속성의 개수와 투플의 개수가\n맞는 것은?(단, σ : 실렉트, π : 프로젝트, ⋈ : 자연조인)\nR(A, B, C)\nA B C\na1 b1 c1\na2 b1 c1\na3 b1 c2\na4 b2 c3\nS(C, D, E)\nC D E\nc1 d2 e1\nc1 d1 e2\nc2 d3 e3\n① σ (R) ⇒ (속성 : 2, 투플 : 2)\nB=b1 ∧ C=c1\n② π ( σ (R) ) ⇒ (속성 : 2, 투플 : 3)\nB,C B=b1 ∨ C=c1\n③ π ( (π ( σ (R) )) ⋈\nB,C B,C B=b1 ∨ C=c1 R.C=S.C\nS(C, D, E) ) ⇒ (속성 : 2, 투플 : 3)\n④ π ( R(A, B, C ) ⋈ S(C, D, E) ) ⇒\nB,C R.C=S.C\n(속성 : 2, 투플 : 2)",
  "2018_60": "60. 함수적 종속성 집합 F : {A → B, C → B, BA → C}가\n주어졌을 때, 다음 중 F에 대한 최소 커버(minimal cover)\n는 무엇인가?\n가. A → C 나. B → C\n다. AC → B 라. C → B\n① 가, 나 ② 가, 라 ③ 나, 다 ④ 다, 라\n- 13",
  "2018_61": "61. 웹 사이트 개발 기술 중 Ajax(Asynchronous Java\nScript and XML)는 대화식 웹 애플리케이션의 제\n작을 위해 여러 기술을 조합하여 이용할 수 있는\n웹 개발 기법이다. Ajax 기술을 구성하는 요소에\n관한 설명 중 가장 적절하지 않은 것은?\n① 표현 정보를 위한 HTML(또는 XHTML)과 CSS\n② 동적인 화면 출력 및 표시 정보와의 상호작용을 위한\nDOM과 자바스크립트\n③ 웹 서버와 비동기적으로 데이터를 교환하고 조작하기 위한\nXML과 XSLT\n④ 컨텐츠 배급과 수집에 관한 RSS 포맷",
  "2018_62": "62. 저장 프로시저(stored procedure)의 설명 중 가장 적절하지\n않은 것은?\n① 응용프로그램의 필요한 기능을 클라이언트의 버퍼에\n저장하여 빠르게 실행할 목적으로 사용한다.\n② 저장 프로시저에 포함된 SQL 명령들은 최적화\n되어 있기 때문에 빠르게 동작한다.\n③ 저장 프로시저의 액세스 권한을 별도로 지정할\n수 있기 때문에 높은 보안성을 제공할 수 있다.\n④ 저장 프로시저의 정의 단계에서 필요에 따라\n입력 매개 변수, 출력 매개 변수 및 지역 변수\n를 정의할 수 있다.",
  "2018_63": "63. 다음과 같은 SQL문을 연속적으로 실행하여 STUDENT\n테이블을 생성한 다음, 2개의 투플을 삽입하고,\nCSTUDENT 뷰를 생성하였다. CSTUDENT 뷰에 데이터\n를 삽입하는 SQL문 중 삽입이 되지 않는 것은?\nCREATE TABLE STUDENT (SNO INT NOT NULL, NAME VARCHAR(10),\nYEAR INT, DEPT VARCHAR(10), PRIMARY KEY (SNO) );\nINSERT INTO STUDENT VALUES (1001, 'KIM', 4, 'COMPUTER');\nINSERT INTO STUDENT VALUES (1002, 'LEE', 4, 'COMPUTER');\nCREATE VIEW CSTUDENT (SNO, NAME, YEAR)\nAS SELECT SNO, NAME, YEAR\nFROM STUDENT WHERE DEPT = 'COMPUTER';\n① INSERT INTO CSTUDENT VALUES (1003, 'PARK', 3);\n② INSERT INTO CSTUDENT (SNO, NAME) VALUES (1003, 'PARK');\n③ INSERT INTO CSTUDENT (SNO, YEAR) VALUES (1003, 3);\n④ INSERT INTO CSTUDENT (NAME, YEAR) VALUES ('PARK', 3);\n3 -\n\n=== NEW PAGE ===",
  "2018_64": "64. 릴레이션 Emp가 다음과 같이 정의되어 있을 때 부\n서별(deptno)로 급여(sal)가 가장 많은 사원 이름\n(ename)을 검색하는 질의를 작성하였다. 올바른\n질의로 가장 적절하지 않은 것은?(단, 릴레이션\nEmp에는 충분한 투플들이 존재한다고 가정한다.)\n(릴레이션 Emp)\nEmp(empno, ename, job, mgr, hiredate, sal, tel, deptno)\n① SELECT ename FROM Emp e1\nWHERE e1.sal >= ANY (SELECT sal FROM Emp e2\nWHERE e1.deptno=e2.deptno);\n② SELECT ename FROM Emp e1\nWHERE sal =\n(SELECT MAX(sal) FROM Emp e2\nWHERE e1.deptno=e2.deptno);\n③ SELECT ename FROM Emp e1\nWHERE e1.sal >=\n(SELECT MAX(sal) FROM Emp e2\nWHERE e1.deptno=e2.deptno GROUP BY deptno);\n④ SELECT ename FROM Emp e1\nWHERE e1.sal >= ALL (SELECT sal FROM Emp e2\nWHERE e1.deptno=e2.deptno);",
  "2018_65": "65. 릴레이션 EMP가 다음과 같이 정의되어 있으며, 사원\n1,000명의 데이터가 저장되어 있다. 아래 SQL 질\n의를 수행하려고 할 때 옵티마이저가 예상하는\n결과 투플의 개수로 가장 가까운 것은?\n(릴레이션 EMP)\nEMP(empno, ename, job, mgr, hiredate, sal, tel, deptname)\n(SQL 질의)\nSELECT * FROM EMP\nWHERE job= 'manager' OR deptname= 'sales';\n(데이터에 대한 가정)\njob 속성의 값의 집합 = { president, manager, salesman,\nclerk, analyst }\ndeptname 속성의 값의 집합 = { general, accounting,\nmarketing, sales }\njob, deptname 속성 모두 히스토그램 정보가 수집되어 있지 않다.\n① 200 ② 250 ③ 300 ④ 400\n- 14",
  "2018_66": "66. SQL 질의에 대하여 경험적(heuristic) 규칙을 활용한\n질의 최적화에 대한 설명 중 가장 적절하지 않은 것은?\n① SQL 질의에 해당하는 관계 대수식에 대응되도록 질의\n트리를 구성하는 것이 필요하다.\n② 질의 표현을 질의 그래프로도 나타낼 수 있는데, 하나의\n질의를 여러 개의 질의 그래프로 표현할 수 있다.\n③ 실렉트(σ) 연산의 조건 c가 프로젝트(π) 연산 리스트\n에 있는 애트리뷰트 A1,...,An 만을 포함한다면, 실렉\n트와 프로젝트 연산은 서로 교환할 수 있다.\n④ 동등한 질의를 다수의 서로 다른 질의 트리들로 표현할\n수 있다.",
  "2018_67": "67. 아무런 제약 없이 트랜잭션들이 데이터베이스를 동시에 접\n근하도록 허용할 경우 발생하는 문제 중에서, 두 트랜잭션\nT과 T가 다음에 나타나는 트랜잭션 스케줄로 실행될 때\n1 2\n발생하는 문제로 가장 적절한 것은? (단, 데이터 항목 x와\ny의 초깃값은 각각 100과 200이고, read(x)와 write(x)는\n각각 트랜잭션이 데이터 항목 x를 읽고 쓰는 연산이다.)\nT T 시간\n1 2\nread(x)\nx ← x * 2\nwrite(x)\nread(x)\nx ← x + 100\nwrite(x)\nread(y)\ny ← y + 100\nwrite(y)\nread(y)\ny ← y * 2\nwrite(y)\n① 갱신 분실(lost update)\n② 모순성(inconsistency)\n③ 연쇄 복귀(cascading rollback)\n④ 반복할 수 없는 읽기(unrepeatable read)",
  "2018_68": "68. SQL의 표준에서 제시한 트랜잭션의 분리성 단계(isolation\nlevel)중 상대적으로 트랜잭션 처리율이 가장 낮은 것은?\n① repeatable read ② serializable\n③ read uncommitted ④ read committed\n4 -\n\n=== NEW PAGE ===",
  "2018_69": "69. 내장 SQL(embedded SQL)에 대한 설명 중 가장 적\n절하지 않은 것은?\n① 내장 SQL은 C, C++, Java 등의 호스트 언어에 포함되는\nSQL문이다.\n② 호스트 언어에서 제공하는 데이터 구조와 DBMS\n에서 제공하는 데이터 구조가 불일치할 수 있다.\n③ 내장 SQL문에 있는 SELECT 문을 사용하여 검색된\n레코드 집합 속에 있는 레코드를 하나씩 접근하기\n위해 커서(cursor)를 사용한다.\n④ DBMS마다 SQL을 내포하는 구문의 차이가 없으므\n로 이식성이 높다.",
  "2018_70": "70. 다음 그림은 2개의 사이트에 분산 저장된 교수와 학과\n릴레이션을 보여주고 있다. 사이트 2에서 “각 학과의\n학과이름과 학과장교수이름을 검색” 하는 질의를 수행\n하려고 한다. 사이트 간 데이터 전송량을 최소화하기\n위해 세미조인을 사용한 분산 질의 처리를 하는 경우\n사이트 간에 처음으로 전송되는 데이터의 크기로 가장\n알맞은 것은?(단, 각 스키마의 애트리뷰트 아래의 숫자는\n그 애트리뷰트의 고정 크기(byte)를 의미하며, 교수는 총\n1,000명, 학과는 50개가 있고, 밑줄은 기본키이다.)\n① 250 바이트 ② 500 바이트\n③ 750 바이트 ④ 1,500 바이트",
  "2018_71": "71. 데이터 웨어하우징의 특성을 설명한 것 중 가장\n적절하지 않은 것은?\n① 일상적인 트랜잭션을 처리하는 프로세스 중심이\n아니라 일정한 주제 중심의 데이터이다.\n② 데이터가 고도로 통합되어 있다.\n③ 대규모의 데이터를 로딩해서 저장하고 데이터는\n읽기 및 갱신이 빈번하다.\n④ 데이터마이닝과 예측에 사용하기 위해 일정한\n기간의 데이터를 포함한다.\n- 15",
  "2018_72": "72. 동적 해싱 방법으로 확장성 해싱(extendible hashing) 기\n법에 관한 설명 중 가장 적절하지 않은 것은?\n① 데이터 파일의 크기에 따라 해싱 구조가 변할 수 있다.\n② 파일의 재구성은 한 번에 여러 버켓(bucket)에서 수\n행되기 때문에 성능부담이 비교적 높다.\n③ 오버플로우(overflow)가 발생한 버켓은 2개의 버켓\n으로 분리되며 오버플로우 버켓에 저장된 데이터 레\n코드들은 재배치가 된다.\n④ 각 버켓을 위한 버켓 depth 값은 디렉토리를 위한 디\n렉토리 depth 값보다 작거나 같은 값을 가질 수 있다.",
  "2018_73": "73. 사용자가 질의한 SQL문에 대한 최적화 작업을 수행하는\n옵티마이저에 대한 설명으로 가장 적절하지 않은 것은?\n① 규칙기반 옵티마이저는 일반적으로 인덱스를 이용한\n액세스를 우선시 한다.\n② 비용기반 옵티마이저는 정확한 통계 정보가 없더라도 비\n용예측이 가능하여 효율적인 실행계획을 세울 수 있다.\n③ 실행계획을 구성하는 요소에는 조인 순서, 조인 기\n법, 액세스 기법, 최적화 정보 등이 있다.\n④ 테이블 내의 많은 수의 행을 읽어야 하는 경우라면\n전체 테이블 스캔 방식이 인덱스 스캔 방식보다 더\n나은 결과가 나올 수 있다.",
  "2018_74": "74. 데이터마이닝 기법을 연결한 것 중 관련성이 가장 적은 것은?\n① 고객의 구매 성향에 따라 분류하여 관심있는 물품에\n대한 카탈로그를 발송한다 - 군집화(clustering)\n② 마켓에서 고객들이 자주 같이 구매하는 상품들\n의 집합을 찾아내어 상품의 진열에 참고한다 -\n연관분석(association analysis)\n③ 사건이 일어난 순서대로 데이터를 분석해 빈도수가\n높은 순차 패턴을 찾아낸다 - 회귀분석(regression)\n④ 꽃의 잎, 색깔, 크기 등 특성에 따라 종을 구분한다\n- 분류(classification)",
  "2018_75": "75. 동시성 제어(concurrency control)의 로킹(locking) 방법\n에서 로크(lock) 단위가 작아지는 경우에 대한 설명으로\n옳은 것은?\n① 로킹 오버헤드 증가, 동시성 정도 증가\n② 로킹 오버헤드 증가, 동시성 정도 감소\n③ 로킹 오버헤드 감소, 동시성 정도 증가\n④ 로킹 오버헤드 감소, 동시성 정도 증가\n5 -\n\n=== NEW PAGE ===\n\n시스템 구조",
  "2019_51": "51. 다음은 두 릴레이션 R(A,B,C)과 S(C,D)를 SQL로\n정의한 것이다. 두 테이블에 대한 데이터 조작\n연산과 관련된 설명 중 옳은 것을 모두 고르시오.\n(2개 선택)\nCREATE TABLE R\n(A INT NOT NULL, B CHAR(5), C INT, PRIMARY\nKEY(A), FOREIGN KEY(C) REFERENCES S(C)\nON DELETE SET NULL\nON UPDATE CASCADE);\nCREATE TABLE S\n(C INT NOT NULL, D CHAR(5), PRIMARY KEY(C));\n① 테이블 R의 투플은 테이블 S의 상태와 무관하\n게 삽입이 가능하다.\n② 테이블 S의 투플은 테이블 R의 상태와 무관하\n게 삽입이 가능하다.\n③ 테이블 S의 C의 값이 갱신되면 테이블 R의 C의\n값도 파급해서 갱신된다.\n④ 테이블 S의 투플이 삭제되면 이 투플을 참조하\n는 R의 투플도 파급해서 삭제된다.",
  "2019_52": "52. 릴레이션을 정규화(normalization)하는 목적에\n관한 설명 중 가장 거리가 먼 것은?\n① 정보의 갱신 이상이 생기지 않도록 한다.\n② 정보의 보안을 목적으로 한다.\n③ 정보의 손실을 막는다.\n④ 정보의 중복을 막는다.",
  "2019_53": "53. 뷰(view)가 어떻게 데이터베이스 보안에 사용될\n수 있는지에 대한 다음 설명 중 옳지 않은 것은?\n① 기본 릴레이션에 직접 접근할 수 있는 권한을\n부여하지 않고 뷰를 통해 접근하도록 한다.\n② 자세한 정보를 제공하는 대신 집단함수의 결과\n만 제공할 수 있다.\n③ 하나의 릴레이션으로 보이는 것을 막기 위해\n여러 릴레이션의 열(column)을 조인하는 것이 금\n지된다.\n④ 기본 릴레이션의 일부 속성들에 대해 추가적으\n로 정의될 수 있으므로 이를 이용해서 기본 릴\n레이션의 일부분만 검색가능하다.\n- 12",
  "2019_54": "54. 고정 길이 레코드 방식을 사용할 때, 레코드의\n길이가 230 byte이고, 블록의 크기가 4,096\nbyte, 블록 헤더의 길이가 24 byte 라고 가정하자.\n하나의 블록에 가능한 많은 수의 레코드를 채우는\n방식으로 35 개의 레코드를 저장할 때, 다음 중\n가장 적절한 것은?\n① 첫 번째 블록에는 188 byte가 남는다.\n② 두 번째 블록에는 3,934 byte가 남는다.\n③ 세 번째 블록에는 3,842 byte가 남는다.\n④ 네 번째 블록에는 3,910 byte가 남는다.",
  "2019_55": "55. SQL의 표준에서 제시한 트랜잭션의 고립 단계\n(isolation level)를 낮게 설정했을 때 발생할\n수 있는 문제로 가장 적절하지 않은 것은?\n① serial schedule\n② dirty read\n③ nonrepeatable read\n④ phantom",
  "2019_56": "56. 확률기반의 기계학습 기법인 나이브 베이즈\n(Naive Bayes) 기법에 대한 다음 설명 중 가장\n적절하지 않은 것은?\n① 입력 속성들이 서로 연관하여 클래스 결정에\n영향을 줄 수 있기 때문에 입력 데이터에 존재\n하는 조건부 확률을 구하여 사용한다.\n② 입력에 존재하지 않는 경우에도 확률값이 0이\n되는 것을 방지하기 위해 라플라스 추정치\n(Laplace estimator)를 사용할 수 있다.\n③ 문서 분류를 위해 문서를 단어의 집합(bag of\nwords)으로 모델링하여 확률기반의 기계학습을\n적용하는 다항분포 나이브 베이즈(multinominal\nNaive Bayes) 모델이 있다.\n④ 입력 속성이 수치값이면 확률 밀도 함수를 사용\n하여 해당 입력값의 확률값을 구해서 사용한다.\n2 -\n\n=== NEW PAGE ===",
  "2019_57": "57. 릴레이션 Emp, Dept가 다음과 같이 정의되어 있\n다. 부서에 사원이 한명도 없는 부서(deptno)를\n검색하는 질의를 작성했을 때, 가장 거리가 먼\n것은? (단, Emp의 deptno는 Dept의 deptno를 참\n조하는 외래키이다.)\nEmp(empno, ename, job, mgr, hiredate, sal,\ncomm, deptno)\nDept(deptno, dname, loc)\n① SELECT deptno FROM Dept WHERE deptno NOT IN\n(SELECT deptno FROM Emp);\n② SELECT deptno FROM Dept a WHERE NOT EXISTS\n(SELECT * FROM Emp b WHERE a.deptno =\nb.deptno);\n③ SELECT b.deptno FROM Emp a RIGHT OUTER JOIN\nDept b ON a.deptno = b.deptno WHERE empno\nIS NULL;\n④ SELECT deptno FROM Dept WHERE deptno <> ANY\n(SELECT deptno FROM Emp);",
  "2019_58": "58. 다음은 두 릴레이션 R, S에 대해 어떤 관계 대수\n연산을 적용한 결과 릴레이션을 보인 것이다. 두\n릴레이션에 대해 적용된 연산 중 옳은 것을 모두\n고르시오. (2개 선택)\nR S 결과\nA B B C A\nJohn 5 1 alpha Tom\nTom 8 5 beta\nMary 8 8 zetta\nTom 1\nMary 5\nTom 5\n① ∏ (R)\nA\n② R÷(∏ (S))\nB\n③ ∏ (R⋈ (σ (S)))\nA B<B C＝'beta'\n④ ∏ (R⋈ (σ (S)))\nA B=B C＝'zetta'\n- 13",
  "2019_59": "59. 다음과 같은 EMPLOYEE 테이블의 Sex와 Salary에\n대한 비트맵 인덱스가 만들어졌다고 할 때, 이\n에 대한 설명 중 옳지 않은 것은?\nEMPLOYEE\nRow_id Emp_id Name Sex Salary\n0 234 Clarke F 60000\n1 621 England M 50000\n2 811 Gucci F 50000\n3 126 Marcus M 60000\n4 413 Zara F 90000\n① Salary 속성의 경우, 값 50000에 대해서는\n01100, 값 60000에 대해서는 10010, 값 90000에\n대해서는 00001의 비트맵 인덱스가 만들어진다.\n② Sex = 'F' AND Salary = 50000과 같은 조건은\n해당 비트맵 인덱스에 대한 논리 AND(logical\nAND)를 통해 검색할 수 있다.\n③ Salary 값이 50000 ~ 60000 사이인 직원은 해당\n비트맵 인덱스에 대한 비트단위의 AND(bitwise\nAND) 연산을 통해 검색할 수 있다.\n④ Sex ¬= 'F'와 같은 부정 질의는 해당 비트맵에\n대해 불리언 보수(complement) 연산으로 처리\n가 가능하다.",
  "2019_60": "60. 다음은 직원 테이블과 부서 테이블의 구조와 두\n테이블에 대한 제약조건을 기술한 것이다. 다음\n중 널(null) 값이 허용되는 속성은?\n직원(직원번호, 이름, 월급, 상사_직원번호, 부서번호)\n부서(부서번호, 부서명, 관리자_직원번호)\n- 기본키: 직원 테이블의 기본키는 직원번호, 부서\n테이블의 기본키는 부서번호.\n- 참조 무결성: 직원.상사_직원번호는 직원.직원번호를\n참조, 직원.부서번호는 부서.부서번호를 참조, 부서.\n관리자_직원번호는 직원.직원번호를 참조.\n- 부서와 직원의 1:N 소속 관계: 한 직원은 반드시 1개의\n부서에 소속됨. 한 부서에는 1명 이상의 직원이 소속됨.\n- 직원과 직원의 1:N 감독 관계: 한 직원은 0명 이상의\n부하 직원을 거느릴 수 있음. 한 직원은 0명 또는 1\n명의 상사 직원을 둘 수 있음.\n- 직원과 부서의 1:1 관리자 관계: 한 직원은 0개\n또는 1개의 부서를 관리할 수 있음. 각 부서에는\n1명의 관리자 직원이 배정되어야 함.\n① 직원.직원번호 ② 직원.상사_직원번호\n③ 직원.부서번호 ④ 부서.관리자_직원번호\n3 -\n\n=== NEW PAGE ===",
  "2019_61": "61. 다음은 EER(Enhanced ER) 다이어그램에서 세분화\n(specialization)를 표현한 것이다. 이 다이어그\n램에 대한 설명으로 옳은 것을 모두 고르시오.\n(단, 수퍼타입과 서브타입을 연결하는 중간 원안\n의 표시 ‘o’는 overlap을, A 개체 쪽의 이중선\n은 total을 표현한다고 하자.) (2개 선택)\n① A의 모든 개체는 최소한 하나의 서브타입의 멤\n버가 되어야 한다.\n② 동일한 실세계 개체가 하나 이상의 서브타입의\n멤버가 될 수 있다.\n③ 서브타입 B와 C 어디에도 속하지 않은 개체가\n존재할 수 있다.\n④ 하나의 개체는 많아야 하나의 서브타입의 멤버\n가 될 수 있다.",
  "2019_62": "62. 트랜잭션에 관한 다음 설명 중 가장 적절하지\n않은 것은?\n① 트랜잭션의 성질을 나타내는 용어로 ACID를 사\n용한다.\n② 트랜잭션이 로크(lock)를 사용하면 교착상태\n(deadlock)는 발생하지 않는다.\n③ 트랜잭션이 읽기만 할 경우 공유 로크(shared\nlock)를 사용한다\n④ 트랜잭션의 고립수준을 높이면 트랜잭션의 동\n시성이 낮아진다.",
  "2019_63": "63. 다음의 ER 다이어그램은 직원(EMPLOYEE)과 프로\n젝트(PROJECT) 사이의 참가(WORKS_ON) 관계를\n표현하고 있다. 이 ER 다이어그램을 데이터베이\n스 테이블로 변환할 때 일반적으로 생성되는 테\n이블의 개수로 가장 적절한 것은?\n① 2 ② 3 ③ 4 ④ 5\n- 14",
  "2019_64": "64. 대한민국 공공데이터포털(https://www.data.go.kr)은\n국가에서 운영하는 데이터 포털로써 정보 관련\n개발자들에게 유용하게 활용된다. 이에 대한 설\n명으로 가장 적절하지 않은 것은?\n①「공공데이터의 제공 및 이용 활성화에 관한 법률」\n제21조(공공데이터포털의 운영)에 의거한다.\n② 공공데이터와 관련된 개발자 간의 지식과 기술\n공유를 위해 개발자 네트워크를 제공한다.\n③ 국민이 쉽고 편리하게 데이터를 이용할 수 있\n도록 파일데이터, 오픈API, 시각화 등 다양한\n방식으로 정보를 제공한다.\n④ 공공데이터 포털에서 제공하는 공공데이터는\n공공데이터법에 따라 누구나 이용가능하지만,\n영리 목적의 이용은 허용되지 않는다.",
  "2019_65": "65. 릴레이션 R1(A, B), R2(C, D)가 있다. 참조무결성\n제약조건을 준수할 경우 다음 중 항상 성립하는\n것은? (단, R1의 속성 B가 R2의 속성 C를 참조\n하는 외래키라고 가정한다.)\n※ π : 프로젝션 연산자, ∅ : 공집합\n① π (R1) - π (R2) = ∅\nB C\n② π (R2) - π (R1) = ∅\nC B\n③ π (R1) = π (R2)\nB C\n④ π (R1) - π (R2) ≠ ∅\nB C",
  "2019_66": "66. 릴레이션 R이 다음과 같은 함수 종속을 가지고\n있다. 이 릴레이션을 BCNF로 분해하였을 때, 외\n래키 역할을 수행하는 속성으로 옳은 것을 모두\n고르시오. (2개 선택)\n릴레이션: R(A, B, C, D, E)\n함수종속: A→BCDE, B→ACDE, E→CD, C→D\n① B ② C ③ D ④ E",
  "2019_67": "67. 해시 테이블 구조를 사용할 경우, 해시 값의 충\n돌을 해결하기 위한 충돌 해결(collision\nresolution) 기법이 필요하다. 다음 중 충돌 해\n결 기법에 해당하지 않는 것은?\n① 개방 주소 지정(open addressing)\n② 체인(chain)\n③ 그림자(shadowing)\n④ 다중 해싱(multiple hashing)\n4 -\n\n=== NEW PAGE ===",
  "2019_68": "68. 테이블 R과 S가 다음과 같을 때, 아래 SQL문\n(SELECT 구문)의 실행 결과로 옳은 것은?\nR\nEID EName Phone Sex DID\n823 Kim 8491 M 100\n434 Park 8488 F 101\n180 Lee 8592 M 101\n510 Choi 8598 F 100\nS\nDID DName Room\n100 Head A403\n101 Sales A401\n102 Proj1 A301\n103 Proj2 B101\n104 AS B102\nSELECT COUNT(*) FROM R, S;\n① 4 ② 5 ③ 9 ④ 20",
  "2019_69": "69. 다음은 데이터베이스 특징 중에서 데이터 공유\n에 대한 설명이다. (가)와 (나)에 들어갈 용어\n를 바르게 짝 지은 것은?\n여러 사용자가 동시에 사용하더라도 데이터의 일관\n성(consistency)을 보장하기 위해 ( 가 ) 기능을\n제공한다.\n데이터베이스 작업을 수행하는 단위 프로세스를 ( 나 )\n(이)라고 하며, ( 나 )의 주요 성질로는 고립성과\n원자성이 있다.\n① (가) 데이터 무결성 (나) 스레드\n② (가) 데이터 무결성 (나) 트랜잭션\n③ (가) 동시성 제어 (나) 트랜잭션\n④ (가) 동시성 제어 (나) 스레드",
  "2019_70": "70. 다음은 OLAP 연산에 대한 설명이다. (가)와 (나)\n에 들어갈 OLAP 연산으로 바르게 짝지어진 것은?\n작은 단위(예: day)에서 큰 단위(예: month, year)로\n집계를 수행하는 OLAP 연산을 (가)이라 한다.\n큰 단위(예: year)에서 작은 단위(예: month, day)로\n집계를 수행하는 OLAP 연산을 (나)이라 한다.\n① (가) 드릴-다운(drill-down) (나) 롤-업(roll-up)\n② (가) 롤-업(roll-up) (나) 드릴-다운(drill-down)\n③ (가) 슬라이싱(slicing) (나) 다이싱(dicing)\n④ (가) 다이싱(dicing) (나) 슬라이싱(slicing)\n- 15",
  "2019_71": "71. 다음은 다중 단위 로킹(multiple granularity\nlocking)을 위한 로킹 호환성 행렬을 나타낸다.\n행렬에서 (가), (나), (다)에 들어갈 내용이 바\n르게 연결된 것은?(여기서 S는 공유(shared), X\n는 독점적(exclusive), I는 의도(intention)를 의미\n한다.)\n로크 IS IX S SIX X\nIS True True True True (다)\nIX True True (가) False False\nS True (가) (나) False False\nSIX True False False False False\nX (다) False False False False\n① (가) False (나) True (다) False\n② (가) False (나) True (다) True\n③ (가) True (나) False (다) False\n④ (가) True (나) False (다) True",
  "2019_72": "72. 다음과 같은 트리 구조에 대한 설명으로 가장\n적절한 것은?\n① B-트리로서, 루트(root) 노드를 포함한 모든\n노드는 절반 이상의 사용률(utilization)을 보\n장한다.\n② B+-트리로서, 루트 노드를 포함한 모든 노드는\n절반 이상의 사용률을 보장한다.\n③ B-트리로서, 내부(internal) 노드의 키 값이\n단말(leaf) 노드에 중복하여 나타난다.\n④ B+-트리로서, 내부 노드의 키 값이 단말 노드에\n중복하여 나타난다.\n5 -\n\n=== NEW PAGE ===",
  "2019_73": "73. 아래 표와 같이 5개 시퀀스(순차)에 대한 시퀀스\n데이터베이스가 주어졌을 때, 서브시퀀스(부분\n순차) x의 지지도 s(x)가 바르게 계산된 것은?\nObject Timestamp Events\nA 1 1, 2\nA 2 2, 3, 4\nA 3 2, 4, 5\nB 1 1, 3\nB 2 2, 4, 5\nC 1 1, 2, 4\nC 2 2, 3\nC 3 5\nD 1 1, 2\nD 2 2, 3, 4\nE 1 2\nE 2 3, 4\nE 3 4, 5\n① s(<{1}{2}>) = 60%\n② s(<{1}{2,3}>) = 80%\n③ s(<{2}{2,3}>) = 60%\n④ s(<{3}{5}>) = 60%",
  "2019_74": "74. 다음은 즉시 갱신(immediate update) 회복 기법을 사용\n하는 트랜잭션의 로그이다. 데이터 B의 초기값은 12000\n이고, M의 초기값은 0이다. 2개의 트랜잭션 T1, T2가 다\n음과 같이 수행되어 B와 M의 데이터에 대한 로그 기록을\n남겼다. 로그번호 7에서 시스템에 장애가 생겼다고 할\n때, 회복 과정에서 해야 할 일 중 가장 적절한 것은?\n로그\n0. checkpoint\n1. T1 start\n2. T1 B old=12000 new=10000\n3. T1 M old=0 new=2000\n4. T1 commit\n5. T2 start\n6. T2 B old=10000 new=10500\n7. <system crash>\n① 로그번호 6을 REDO하여 B를 10500으로 바꾼다.\n② 로그번호 6을 UNDO하여 B를 10000으로 바꾸고, 로\n그번호 2와 3을 REDO 한다.\n③ 트랜잭션 T1이 commit을 했기 때문에 로그번호 2\n와 3을 REDO 할 필요는 없다.\n④ REDO와 UNDO는 임의의 순서로 진행해도 상관이 없다.\n- 16",
  "2019_75": "75. 다음 릴레이션에 대하여 아래와 같이 인덱스를\n생성하였다. 다음 중 생성된 인덱스에 의하여\n검색속도를 향상시킬 수 있는 질의로 가장 적절\n하지 않은 것은?\n릴레이션\nArticles(ID, title, journal, issue, year, startpage,\nendpage, TR_ID)\n<설명> 논문(Articles) 릴레이션은 과학 논문에\n관한 정보를 포함하고 있고 밑줄친 속성은 키값\n이다. 각 논문은 고유의 ID를 가지고 있으며, 논\n문제목(title)과 저널명(journal), 권(issue), 발행연도\n(year), 시작페이지(startpage), 끝페이지(endpage)\n정보를 포함하고 있다. 논문이 기술 리포트(technical\nreport)에 게재된 적이 있으면 TR_ID 번호가 기록\n된다. 각 저널에는 고유의 일련번호인 권(issue)\n번호가 있으며, 논문에는 시작페이지와 끝페이지\n가 기록된다.\n인덱스\nCREATE INDEX Idx1 ON Articles(year, startpage);\nCREATE INDEX Idx2 ON Articles(startpage,\nendpage);\nCREATE INDEX Idx3 ON Articles(journal, issue,\nyear);\n① SELECT title FROM Articles WHERE journal =\n'JACM' AND issue = 55;\n② SELECT title FROM Articles WHERE endpage -\nstartpage > 50;\n③ SELECT title FROM Articles WHERE year > 1995\nAND year < 2000;\n④ SELECT title FROM Articles WHERE journal =\n'JACM';\n6 -\n\n=== NEW PAGE ===\n\n시스템 구조",
  "2020_51": "51. 릴레이션 R의 차수(degree)가 rd이고 릴레이션 S의\n차수는 sd라고 가정했을 때, 다음의 관계 대수 연\n산에 대한 설명 중 가장 적절하지 않은 것은?\n① rd = sd인 경우, R과 S는 합병 가능(union\n-compatible)하다.\n② R에 실렉션(selection) 연산을 적용한 결과 릴\n레이션의 차수는 rd이다.\n③ R과 S를 세타 조인(theta-join)한 결과 릴레이션\n의 차수는 rd + sd이다.\n④ R을 구성하고 있는 속성 집합 X가 S를 구성하고\n있는 속성 집합 Y를 포함하고 X - Y = D라면 R\n÷ S 연산을 적용한 결과 릴레이션의 차수는 D에\n포함된 속성의 개수이다.",
  "2020_52": "52. 다음 공간 질의(spatial query) 사례 중에서 공간\n조인(spatial join)에 해당하는 질의의 예로 가장\n적절한 것은?\n① 서울시 경계 안에 존재하는 모든 병원을 검색\n② 주어진 사건 현장에서 가장 가까운 거리에 있는\n경찰차를 검색\n③ 2Km 이내의 거리에 호수가 존재하는 모든 주택을 검색\n④ 특정 사건 현장에서 5Km 반경 이내의 거리에\n있는 모든 응급차를 검색",
  "2020_53": "53. 데이터베이스의 트랜잭션 관리에 대한 설명 중\n가장 적절하지 않은 것은?\n① 트랜잭션은 데이터베이스를 접근하는 일의 단위\n로서 원자성(atomicity)을 유지하기 위해서\ncommit 하거나 rollback 할 수 있다.\n② 여러 트랜잭션이 동시에 실행되는 경우 충돌\n트랜잭션들의 일관성을 보장하기 위해서는 반드시\n직렬 스케쥴(serial schedule)을 생성해야 한다.\n③ 회복기법으로 그림자 페이지(shadow paging)기법을 사\n용하면 단일 사용자 환경에서 로그 레코드 출력이\n필요없어 트랜잭션의 UNDO가 간단하고 REDO가 필요\n없기 때문에 고장으로부터의 회복이 신속하다.\n④ 로깅(logging) 회복기법에서는 데이터 레코드보다 로\n그 레코드를 먼저 안전 저장장치에 기록하도록 한다.\n- 12",
  "2020_54": "54. 연관규칙 마이닝에서 6-항목집합 {Apple, Banana,\nCherry, Grape, Melon, Tomato}가 빈발(frequent)로\n판명되었을 때, 이 6-항목집합에 대해 고려할 수\n있는 연관규칙은 모두 몇 개인가?\n① 6개 ② 15개 ③ 32개 ④ 62개",
  "2020_55": "55. 다음의 데이터베이스에서 Students 릴레이션의\nsid가 53666인 튜플이 삭제되면 Enrolled 릴레이션의\nsid가 53666인 튜플도 같이 삭제되도록 하는 방법\n으로 가장 적절한 것은? (단, Students, Enrolled\n릴레이션 각각의 기본 키는 밑줄 친 속성이다.)\nStudents Enrolled\nsid cid grade\nsid name age 53666 Carnatic101 C\n53666 Jones 18 53666 Reggae203 B\n53688 Smith 18 53650 Topology112 A\n53650 Smith 19 53666 History105 B\n① Students 릴레이션을 생성할 때 FOREIGN\nKEY(sid) REFERENCES Enrolled(sid) ON\nDELETE SET DEFAULT 명령어를 추가한다.\n② Enrolled 릴레이션을 생성할 때 FOREIGN\nKEY(sid) REFERENCES Students(sid) ON\nDELETE SET DEFAULT 명령어를 추가한다.\n③ Students 릴레이션을 생성할 때 FOREIGN\nKEY(sid) REFERENCES Enrolled(sid) ON\nDELETE CASCADE 명령어를 추가한다.\n④ Enrolled 릴레이션을 생성할 때 FOREIGN\nKEY(sid) REFERENCES Students(sid) ON\nDELETE CASCADE 명령어를 추가한다.",
  "2020_56": "56. 두 릴레이션 R(Z), S(X)에 대해 X⊆Z이고 Y=Z-X\n라고 할 때 다음의 연산들을 순서대로 적용한 결\n과가 의미하는 연산으로 적절한 것은?\nT1 ← π (R)\nY\nT2 ← π ((S × T1) - R)\nY\nT ← T1 - T2\n① 조인 ② 디비전\n③ 교집합 ④ 카티션 프로덕트\n2 -\n\n=== NEW PAGE ===",
  "2020_57": "57. 다음 SQL 문장에 대한 설명으로 가장 적절한 것은?\nDROP SCHEMA STUDENT RESTRICT\n① 데이터베이스 스키마 STUDENT와 해당 스키마의 모\n든 테이블 및 관련 요소도 함께 제거한다.\n② 데이터베이스 스키마 STUDENT 내에 어떤 요소도\n없을 때만 해당 스키마를 제거한다.\n③ 테이블 스키마 STUDENT와 해당 스키마의 모든\n투플(tuple) 및 관련 요소도 함께 제거한다.\n④ 테이블 스키마 STUDENT 내에 어떤 요소도 없을 때\n만 해당 스키마를 제거한다.",
  "2020_58": "58. 릴레이션 스키마 R=(A, B, C, D, E)에서 다음과\n같은 함수 종속성(functional dependency)이 존재\n할 때, 릴레이션 R의 후보 키로서 적절하지 않은\n것은?\nA → BC, CD → E, B → D, E → A\n① E ② BC ③ BD ④ CD",
  "2020_59": "59. ANSI/ISO SQL 표준(SQL92)에서 정의한 트랜잭션의\n고립성 단계(isolation level)에 따라 발생 가능한\n비일관성(inconsistency)의 현상을 아래 표와 같이\n정리하였다. 빈칸 Ⓐ, Ⓑ, Ⓒ에 차례로 들어갈\n내용으로 맞게 구성된 것은?\nDirty Non-repeatable Phantom\n레벨\nread read read\nRead\n발생 가능 발생 가능 발생 가능\nuncommitted\nRead\nⒶ 발생 가능 발생 가능\ncommitted\nRepeatable\n발생 불가능 Ⓑ 발생 가능\nread\nSerializable\n발생 불가능 발생 불가능 Ⓒ\nread\n① 발생 가능, 발생 가능, 발생 가능\n② 발생 가능, 발생 가능, 발생 불가능\n③ 발생 가능, 발생 불가능, 발생 불가능\n④ 발생 불가능, 발생 불가능, 발생 불가능\n- 13",
  "2020_60": "60. 릴레이션 R의 투플 수를 |R|로 표기하고, 조인\n조건을 c라고 할 때, 조인 선택도(join\nselectivity) js=|(R⋈ S)|/|(R×S)|이다. c가\nC\n없으면 js=1이 되고, c를 만족하는 투플이 없으\n면 js=0이 된다. 조인 조건 c가 R.A=S.B 형태이\n고, |R|=8, |S|=3이라고 하자. 다음 설명을 만\n족하는 값들 중 가장 작은 값은?\n① B가 S의 기본키일 때 js의 최대값\n② A가 R의 기본키일 때 js의 최대값\n③ R.A의 유일한 값의 수가 2, S.B의 유일한 값의\n수가 3일 경우 js의 값\n④ B가 S의 기본키일 때 조인 결과 테이블의 카디\n널리티",
  "2020_61": "61. 다음의 두 릴레이션 ‘사원’과 ‘부서’에 대한\n관계 대수식의 결과에 관한 설명으로 가장 적절하지\n않은 것은?(단, 밑줄 친 속성은 기본 키이다.)\n<사원>\n사번 사원이름 부서번호\n2020-001 홍길동 2\n2019-001 장영실 5\n2020-002 강감찬 4\n2020-003 류관순 NULL\n2019-002 김좌진 2\n2019-003 이몽령 4\n2019-004 이산 1\n2020-004 이순신 NULL\n<부서>\n부서번호 부서이름 위치\n5 연구부 연구동-1\n4 영업부 사무동-1\n1 기획부 사무동-2\n2 생산부 생산동-1\n① 카디션 프로덕트 (사원 × 부서) 대수식의 차수\n는 6, 카디널리티는 32이다.\n② 자연조인 (사원 * 부서) 대수식의 차수는 5, 카\n디널리티는 6이다.\n③ 좌측 외부조인 (사원 ⟕ 부\n사원.부서번호=부서.부서번호\n서) 대수식의 차수는 6, 카디널리티는 6이다.\n④ 동등조인 (사원 ⋈ 부서) 대\n사원.부서번호=부서.부서번호\n수식의 차수는 6, 카디널리티는 6이다.\n3 -\n\n=== NEW PAGE ===",
  "2020_62": "62. 아래의 ‘사원’ 릴레이션에 대한 SQL 질의와 실\n행 결과로 적절하지 않은 것은?\n사원\n사번 사원이름 성별 급여 부서번호\n2020-001 홍길동 남 3000 2\n2019-001 장영실 남 5000 5\n2020-002 강감찬 남 2000 4\n2020-003 류관순 여 3000 NULL\n2019-002 김좌진 남 4000 2\n2019-003 이몽령 남 4000 4\n2019-004 이산 남 5000 1\n2020-004 이순신 남 3000 NULL\nSELECT 부서번호, AVG(급여)\nFROM 사원\nGROUP BY 부서번호;\n부서번호 AVG(급여)\n① NULL 3000\n1 5000\n2 3500\n4 3000\n5 5000\nSELECT 사원이름, 급여\nFROM 사원\nWHERE 부서번호 IN (SELECT 부서번호\nFROM 사원\nGROUP BY 부서번호\nHAVING COUNT(*)>=2);\n②\n사원이름 급여\n홍길동 3000\n강감찬 2000\n김좌진 4000\n이몽령 4000\nSELECT 사원이름\nFROM 사원 E\nWHERE 급여 > (SELECT AVG(급여)\nFROM 사원\n③ WHERE 부서번호 = E.부서번호);\n사원이름\n김좌진\n이순신\nSELECT 사원이름, 급여\nFROM 사원\nWHERE 급여 = (SELECT MAX(급여)\nFROM 사원);\n④\n사원이름 급여\n장영실 5000\n이산 5000\n- 14",
  "2020_63": "63. 다음의 릴레이션 Sailors에 대해 어떤 질의를 한\n결과 릴레이션 Results가 나오도록 하는 SQL 질의\n로 가장 적절한 것은?\n<Sailors>\nsid sname rating age\n22 Dustin 7 45.0\n29 Brutus 1 33.0\n31 Lubber 8 55.5\n32 Andy 8 25.5\n58 Rusty 10 35.0\n64 Horatio 7 35.0\n71 Zorba 10 16.0\n74 Horatio 9 35.0\n85 Art 3 25.5\n95 Bob 3 63.5\n<Results>\nrating average\n3 44.5\n7 40.0\n8 40.5\n10 35.0\n① SELECT S.rating, AVG(S.age) AS average\nFROM Sailors S\nGROUP BY S.rating\nHAVING COUNT(*) > 1;\n② SELECT S.rating, AVG(S.age) AS average\nFROM Sailors S\nWHERE S.age >= 18\nGROUP BY S.rating\nHAVING 1 < (SELECT COUNT(*)\nFROM Sailors S2\nWHERE S.rating=S2.rating);\n③ SELECT S.rating, AVG(S.age) AS average\nFROM Sailors S\nWHERE S.age >= 18\nGROUP BY S.rating\nHAVING 1 < (SELECT COUNT(*)\nFROM Sailors S2\nWHERE S.rating=S2.rating AND\nS2.age >= 18);\n④ SELECT S.rating, AVG(S.age) AS average\nFROM Sailors S\nGROUP BY S.rating\nHAVING 1 < (SELECT COUNT(*)\nFROM Sailors S2\nWHERE S.rating=S2.rating);\n4 -\n\n=== NEW PAGE ===",
  "2020_64": "64. CAP 정리는 세 가지 조건을 모두 만족하는 분산\n컴퓨터 시스템이 존재하지 않음을 증명한 정리이\n다. 이 세 가지 조건으로 옳은 것은?\n① 일관성(consistency), 원자성(atomicity),\n지속성(persistency)\n② 연속성(continuity), 가용성(availability),\n지속성(persistency)\n③ 일관성(consistency), 가용성(availability),\n분할 내성(partition tolerance)\n④ 연속성(continuity), 원자성(atomicity),\n분할 내성(partition tolerance)",
  "2020_65": "65. 릴레이션 R에는 6개의 속성 A, B, C, D, E, F를\n가지며, 현재 R은 제1정규형을 만족한다. 이때 R\n에 대한 다음 함수적 종속성 FD 중에서\nBCNF(Boyce-Codd Normal Form)를 만족하는 것은?\n① FD ＝ {A → BCD, B → EF}\n② FD ＝ {A → BCD, B → AEF}\n③ FD ＝ {AB → C, A → DEF}\n④ FD ＝ {AB → CDEF, C → A}",
  "2020_66": "66. 다음은 마트에서 고객들의 구매 상품 리스트를\n나타낸다. 데이터 마이닝에서 연관 규칙 A → B\n는 A를 구매하면 B도 구매한다는 것을 나타낸다\n고 할 때, 맥주 → 과자에 대한 지지도(support)\n와 신뢰도(confidence)로 옳은 것은?\nID 판매 상품\n1 주스, 맥주, 빵\n2 주스, 빵, 라면, 사과\n3 맥주, 콜라, 과자\n4 맥주, 과자, 빵\n5 생수, 맥주, 과자\n6 과자, 빵, 라면, 맥주\n7 콜라, 맥주, 빵, 아이스크림\n8 라면, 맥주, 과자, 콜라\n9 아이스크림, 라면, 빵, 사과\n10 콜라, 빵, 과자, 맥주\n① 지지도 60%, 신뢰도 75%\n② 지지도 67%, 신뢰도 50%\n③ 지지도 67%, 신뢰도 75%\n④ 지지도 75%, 신뢰도 50%\n- 15",
  "2020_67": "67. 보기의 내용은 어떤 NoSQL 시스템을 설명한 것\n이다. 보기의 내용에 해당하는 NoSQL의 범주로\n가장 적절한 것은?\n<보기>\n- 개별 데이터는 복합 객체(complex object)와 흡사하다.\n- 스키마를 명세할 필요가 없다.\n- 데이터를 JSON과 같이 잘 알려진 포맷으로 저장한다.\n① 문서-기반의 시스템\n② 키-밸류 스토어\n③ 컬럼-기반 또는 와이드 칼럼 시스템\n④ 그래프 기반 시스템",
  "2020_68": "68. 다음은 규칙  → 의 분할표(contingency\ntable)를 표현한 것이다. 이 표를 이용해 구한\n다음의 값들 중 가장 큰 값은?\n\n \n 15 5 20\n  75 5 80\n90 10 100\n①  → 의 지지도(support)\n②  → 의 신뢰도(confidence)\n③  → 의 상승(lift)\n④  →  의 신뢰도",
  "2020_69": "69. 검색 엔진에서 주어진 검색 키워드에 관련된 전\n체 문서의 수가 10개라고 하자. 다음 각 경우에\n대한 설명이 옳지 않은 것은?\n① 검색 결과 문서 수가 5개, 이 중 관련된 문서가\n3개라면 정확도(precision)는 60%이다.\n② 검색 결과 문서 수가 8개, 이 중 관련된 문서가\n5개라면 재현도(recall)는 50%이다.\n③ 검색 결과 문서 수가 5개, 이 중 관련된 문서가\n3개라면 F-스코어(F-score)는 30%이다.\n④ 검색 문서의 순위(rank) 순서대로 정확도와\n재현도를 구하면 정확도는 변동(증감)하고\n재현도는 단조적으로 증가한다.\n5 -\n\n=== NEW PAGE ===",
  "2020_70": "70. 다음은 실제로 2개의 클래스 a, b(즉, ~a)를 갖\n는 테스트 데이터에 대해서 분류기(classifier)\n로 클래스 a로 분류한 경우(a)와 a가 아니라고\n분류한 경우(~a)로 분류한 결과표이다. 분류기의\n성능을 분석한 것 중 가장 적절하지 않은 것은?\n예측 클래스\na ~a 합계\na 40 10 50\n실제 클래스 ~a 15 35 50\n합계 55 45 100\n① 오류율(error rate) = 25%\n② 특이도(specificity) = 70%\n③ 재현율(recall) = 80%\n④ F 측정값(F-measure) = 30%",
  "2020_71": "71. 사용자 JOHN에게 부여된 STUDENT 릴레이션에 대한\nSELECT 권한을 회수하고자 할 때, 이를 SQL 언어\n로 가장 올바르게 표현한 것은?\n① REMOVE SELECT ON STUDENT FROM JOHN\n② REVOKE SELECT ON STUDENT FROM JOHN\n③ REMOVE SELECT ON JOHN FROM STUDENT\n④ REVOKE SELECT ON JOHN FROM STUDENT",
  "2020_72": "72. 확장성 직접 화일에서 동적 해싱(dynamic\nhashing) 기법에 관한 설명 중 가장 적절하지\n않은 것은?\n① 버킷 분할이 일어날 때, 기존 버킷에 저장할지\n새로 할당된 버킷에 저장할지 결정하는 방법은\n버킷에 있는 다른 레코드들에 의존해야 한다.\n② 각 버킷은 메인 메모리에 거주하는 인덱스로 지\n시되기 때문에 물리적 버킷 주소는 실제로 그리\n중요하지 않다.\n③ 버킷 분할이 계속해서 일어나면 인덱스는 N개의\n이진 트리 집합으로 된 포리스트(forest)로 된다.\n④ 트리 경로를 따라가는 과정에 가상 메모리 기법\n에서 일어나는 페이지 부재(page fault) 현상이\n발생할 수 있다.\n- 16",
  "2020_73": "73. 다음 E-R 모델을 관계 모델로 매핑하여 데이터\n베이스를 구축할 경우 DEPARTMENT, EMPLOYEE 테\n이블의 생성문에 반영할 내용에 대한 설명 중\n가장 적절하지 않은 것은? (단, 개체와 관계 사\n이의 이중선은 전체 참여, 단일선은 부분 참여,\n밑줄 친 속성은 해당 개체에서 고유함을 의미한\n다.)\n① 1:N 관계를 반영하기 위하여 EMPLOYEE 테이블\n에 외래키 DNO를 추가한다.\n② 1:N 관계를 반영한 EMPLOYEE 테이블의 외래키\nDNO에 대해서는 NULL값을 허용할 수 있다.\n③ 1:1 MANAGES 관계 반영의 경우 DEPARTMENT 테이\n블에 외래키 ENO를 추가하는 것이 EMPLOYEE 테\n이블에 외래키 DNO를 추가하는 것보다 더 좋다.\n④ EMPLOYEE 테이블에서 ENO를 기본키로 설정할 경\n우, Email은 대체키로 UNIQUE 제약을 설정한다.",
  "2020_74": "74. GIS 시스템 구성 요소 중에서 래스터(raster)에\n대한 설명으로 가장 적절한 것은?\n① 지리 데이터를 일컫는 용어로, 2차원 셀 혹은 3\n차원 복셀(voxel)들의 연속된 격자이다.\n② GIS 관련 인력을 일컫는 용어로, 지도 제작자,\n지리 조사관, GIS 사용자를 통칭한다.\n③ 플로터, 스캐너, 3차원 프린터 등 GIS 시스템을\n구성하는 하드웨어 장치를 일컫는다.\n④ GIS 객체를 표현하기 위한 점, 선, 폴리곤 등의\n이산 객체와 이들을 포함하는 MBR(minimum\nbounding rectangle)을 일컫는다.",
  "2020_75": "75. 분산 데이터베이스에서 릴레이션 R의 단편(fragment)은\nπ(σ(R))로 명세될 수 있다. 다음 중 수직 단편을\nL C\n표현한 경우로 옳은 것은? (단, ATTRS(R)은 R의 애트\n리뷰트의 집합, L은 애트리뷰트 리스트, C는 R의 모든\n투플이 선택되는 조건식을 의미한다.)\n① C = TRUE and L = ATTRS(R)\n② C = TRUE and L ≠ ATTRS(R)\n③ C ≠ TRUE and L = ATTRS(R)\n④ C ≠ TRUE and L ≠ ATTRS(R)\n6 -\n\n=== NEW PAGE ===\n\n시스템 구조",
  "2021_51": "51. 국제 데이터 품질 표준인 ISO 8000에서 데이터의\n품질 기준을 크게 유효성과 활용성으로 구분하고\n있다. 다음 중 활용성에 해당하는 것은?\n① 사실성 ② 필수성\n③ 정합성 ④ 충분성",
  "2021_52": "52. 다음 ER 모델에서 1:1 관계 타입 MANAGES의 속성\nStartDate에 대한 설명으로 가장 거리가 먼 것은?\n① StartDate를 EMPLOYEE 엔티티 타입의 속성으로\n이동시킬 수 있다.\n② StartDate를 DEPARTMENT 엔티티 타입의 속성으\n로 이동시킬 수 있다.\n③ StartDate를 MANAGES 관계 타입의 속성으로 그대\n로 유지하여도 된다.\n④ StartDate를 EMPLYOEE와 DEPARTMENT 양쪽 모두에\n유지해야 한다.",
  "2021_53": "53. 릴레이션 스키마 S=(A, B, C, D, E, F, G)에서\n다음과 같은 함수적 종속성(functional dependency)\n이 존재한다고 가정하자. 릴레이션 S에서 후보\n키로서 옳지 않은 것은?\nA → ABCDEFG, BD → E, CE → A\n① A ② BD\n③ CE ④ BCD\n- 14",
  "2021_54": "54. SQL에서 사용되는 COUNT 함수에 대한 다음 설명\n중 옳은 것으로 묶인 것은?\n가. 중복되는 값이 있는 속성의 경우, COUNT(속\n성명)의 결과와 COUNT(DISTINCT 속성명)의\n결과는 동일하다.\n나. 중복되는 값이 없는 속성의 경우, COUNT(*)의\n결과와 COUNT(속성명)의 결과는 상이하다.\n다. COUNT(*)의 처리 대상은 투플의 집합이고,\n그 결과는 투플의 수이다.\n라. COUNT(*)의 결과에 중복되는 투플은 포함된다.\n① 가, 나 ② 가, 다\n③ 나, 다 ④ 다, 라",
  "2021_55": "55. SQL 뷰(view)에 대한 설명 중 옳은 것으로만 짝\n지어진 것은?\n가. 뷰에 대한 투플의 삽입은 시스템에 의해 거부\n될 수 있다.\n나. 원본과의 불일치 문제로 인해 뷰 생성 시\nGROUP BY절을 사용할 수 없다.\n다. 집계(aggregation)함수에 의해 생성된 뷰의\n경우 일반적으로 갱신을 허용하지 않는다.\n라. 실체화된 뷰(materialized view)를 생성할 경\n우에는 CREATE VIEW 구문을 사용하고, 그렇지\n않은 뷰를 생성할 경우에는 CREATE TABLE 구\n문을 사용한다.\n① 가, 나 ② 가, 다\n③ 나, 라 ④ 다, 라",
  "2021_56": "56. 조인 연산은 질의 처리에서 가장 많은 비용이 소\n요되는 연산 중 하나이다. 다음 중 조인 연산을\n구현하는 방법과 가장 거리가 먼 것은?\n① k-최근접 이웃 조인(k-nearest neighbor join)\n② 중첩 루프 조인(nested loop join)\n③ 정렬-합병 조인(sort-merge join)\n④ 분할-해시 조인(partition-hash join)\n4 -\n\n=== NEW PAGE ===",
  "2021_57": "57. 객체 데이터 모델(object data model)에서 사용\n하는 OID(Object IDentifier)에 대한 설명으로\n가장 적절하지 않은 것은?\n① OID는 객체마다 유일한 값을 가지고 있으므로\n하나의 시스템 내에서 OID가 동일한 객체는 있을\n수 없다.\n② OID는 객체가 생성될 때 시스템에 의해 생성되고\n일단 생성된 뒤에는 어떠한 경우에도 변경되지\n않는다.\n③ OID는 관계 데이터 모델에서 사용하는 기본 키와\n본질적으로 동일한 성질을 가지고 있다.\n④ OID는 객체가 제거될 때만 삭제되며 이렇게 삭\n제된 OID는 다시 재사용할 수 없다.",
  "2021_58": "58. 다음과 같은 5-원(way) B-트리가 있다고 할 때,\n새로운 키 값 30을 삽입했을 때의 설명으로 가장\n적절하지 않은 것은?\n① 삽입의 결과로 트리의 높이가 증가한다.\n② 삽입의 결과로 루트의 공간 사용율이 1/2 미만이\n된다.\n③ 삽입 과정에서 노드의 분할이 발생한다.\n④ 삽입 과정에서 노드의 병합이 발생한다.",
  "2021_59": "59. 세 개의 릴레이션 학생(학번, 이름, 학년, 학\n과), 과목(과목번호, 과목이름, 학점, 학과),\n등록(학번, 과목번호, 성적)에서 “모든 과목에\n수강하고 있는 학생의 학번과 이름을 검색하\n라”는 질의를 효율적인 관계 대수 명령어로 작\n성할 때 사용되는 연산으로 가장 적절하지 않은\n것은? (단, 밑줄 속성은 릴레이션의 기본키를\n표시한다.)\n① 조인 ② 차집합\n③ 디비전 ④ 프로젝션\n- 15",
  "2021_60": "60. 학생(학번, 이름, 학과) 릴레이션에 수학과 학생\n이 60명, 화학과 학생이 40명, 물리과 학생이\n30명, 학과가 정해지지 않은(NULL) 학생이 10명\n으로 구성되어 있을 때, 각각의 실행 결과 투플\n수로 옳은 것은? (단, 밑줄 속성은 기본키를 표\n시한다.)\n가. SELECT 학과 FROM 학생;\n나. SELECT DISTINCT 학과 FROM 학생;\n다. SELECT COUNT(*) FROM 학생 GROUP BY 학과;\n① 가 130, 나 3, 다 3\n② 가 130, 나 4, 다 4\n③ 가 140, 나 3, 다 3\n④ 가 140, 나 4, 다 4",
  "2021_61": "61. 다음 릴레이션 R과 S에 대해 결과 릴레이션 RS가\n얻어지도록 하는 관계 대수 연산으로 옳은 것은?\nR S RS\nA B C B C D A B C\na1 b1 c1 b1 c1 d1 a1 b1 c1\na2 b1 c1 b1 c1 d2 a2 b1 c1\na3 b1 c2 b2 c3 d3 a4 b2 c3\na4 b2 c3\n① R⋈ S (natural join)\nN\n② R⟖c=cS (right outer join)\n③ R⋉S (semi join)\n④ R⋃+S (outer union)",
  "2021_62": "62. 다음과 같은 특징을 가지는 NoSQL 데이터베이스\n유형으로 가장 적절한 것은?\nŸ 관계 데이터 모델과 비슷하게 데이터는 물론\n데이터 간의 관계를 표현하는데 적합하다.\nŸ 다른 NoSQL 모델과 달리 트랜잭션을 통해 ACID를\n지원하며 클러스터 환경에는 적합하지 않다.\nŸ 연관 데이터를 추천해주거나 소셜 네트워크에\n서 친구 찾기 질의를 효율적으로 수행하는데\n적합하다.\n① 그래프 기반(graph-based) 데이터베이스\n② 컬럼 기반(column-based) 데이터베이스\n③ 문서 기반(document-based) 데이터베이스\n④ 키-값(key-value) 데이터베이스\n5 -\n\n=== NEW PAGE ===",
  "2021_63": "63. 다음과 같은 EMPLOYEE 릴레이션이 있다고 하자.\nEMPLOYEE\nENO ENAME MANAGER\n1001 KIM 1003\n1002 PARK 1006\n1003 LEE 1006\n1004 CHO 1002\n1005 CHOI 1006\n1006 YOO ∧\nEMPLOYEE 릴레이션에 대해 다음과 같은 질의문을 사\n용하여 자체 조인(self join)을 실행했을 때, 실행\n결과로 나타나지 않는 것은?\nSELECT E.ENAME, M.ENAME\nFROM EMPLOYEE E, EMPLOYEE M\nWHERE E.MANAGER = M.ENO;\nE.ENAME M.ENAME\n① KIM LEE\n② PARK KIM\n③ CHO PARK\n④ CHOI YOO",
  "2021_64": "64. 동시성 제어를 하지 않고 다수의 트랜잭션을 동\n시에 수행하면 문제가 발생할 수 있다. 다음과\n같이 트랜잭션 T1이 홍길동의 잔액을 100,000원\n증가시킨 후에 트랜잭션 T2는 모든 계좌의 잔액\n에 대한 평균값을 검색하였다. 그 이후 어떤 이\n유로 T1이 철회되는 경우 발생하게 되는 문제점\n으로 가장 적절한 것은?\nT1 T2\nUPDATE account\nSET balance = balance + 100000\nWHERE name = ‘홍길동’;\nSELECT AVG(balance)\nFROM account;\nROLLBACK;\nCOMMIT;\n① 오손 데이터 읽기(dirty read)\n② 갱신 손실(lost update)\n③ 반복할 수 없는 읽기(unrepeatable read)\n④ 모순성(inconsistency)\n- 16",
