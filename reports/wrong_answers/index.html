<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오답 복습 스케줄러</title>
    <!-- 구글 폰트 적용 -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;800&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap"
        rel="stylesheet">
    <!-- Lucide Icons 로드 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- 전역 스타일 및 공통 테마 대응을 위해 CSS 링크 -->
    <link rel="stylesheet" href="../css/dashboard_common.css">
    <link rel="stylesheet" href="review.css">
</head>

<body>

    <!-- 상단 내비게이션 바 -->
    <header class="header">
        <div class="nav-container">
            <div class="nav-left" style="cursor: pointer;" onclick="goToHome()">
                <div class="logo-glow-dot"></div>
            </div>

            <nav class="nav-links">
                <a href="/reports/db_official_scopes.html" class="subject-link">데이터베이스</a>
                <a href="/reports/se_official_scopes.html" class="subject-link">소프트웨어공학</a>
                <a href="/reports/pm_official_scopes.html" class="subject-link">사업관리</a>
                <a href="/reports/sa_official_scopes.html" class="subject-link">시스템구조</a>
                <a href="/reports/sc_official_scopes.html" class="subject-link">보안</a>
                <a href="/" class="home-btn-link"><i data-lucide="home"></i> 홈으로</a>
            </nav>
        </div>
    </header>

    <main class="container">

        <!-- 뷰 1: 오답 복습 스케줄러 홈 대시보드 (dashboard-view) -->
        <section id="dashboard-view" class="view-panel active">
            <div class="view-header">
                <h2 class="title"><i data-lucide="clipboard-x" class="title-icon"></i> 오답 복습 스케줄러</h2>
                <p class="subtitle">망각곡선에 따라 오늘 복습할 때가 된 문항만 골라 플래시카드로 제시합니다. 맞힐수록 복습 간격이 늘어나요.</p>
            </div>

            <!-- 요약 스탯 카드 -->
            <div class="summary-stats-banner">
                <div class="stat-item highlight">
                    <span class="stat-label">오늘 복습할 문항</span>
                    <span class="stat-value" id="stats-total-wrong">0개</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">대기중인 복습</span>
                    <span class="stat-value" id="stats-total-upcoming">0개</span>
                </div>
            </div>

            <!-- 과목별 복습 카드 목록 그리드 -->
            <div class="subject-grid" id="subject-grid-container">
                <!-- JS에서 동적 로드 -->
                <div class="loading-spinner-wrapper">
                    <div class="spinner"></div>
                    <p style="margin-top: 1rem; color: var(--text-secondary);">복습 스케줄을 계산하고 있습니다...</p>
                </div>
            </div>
        </section>

        <!-- 뷰 2: 플래시카드 러너 화면 (card-view) -->
        <section id="card-view" class="view-panel">
            <div class="card-runner-header">
                <div class="header-left">
                    <button class="back-btn" onclick="backToDashboard()"><i data-lucide="arrow-left"></i> 목록으로</button>
                    <span class="runner-subject-badge" id="runner-subject-title">데이터베이스</span>
                </div>
                <div class="header-right">
                    <span class="progress-text" id="runner-progress-text">카드 1 / 10</span>
                </div>
            </div>

            <!-- 세션 진척도 바 -->
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="runner-progress-fill" style="width: 10%;"></div>
            </div>

            <!-- 플래시카드 영역 -->
            <div class="flashcard-container">
                <!-- 카드 본체 -->
                <div class="flashcard" id="active-flashcard">
                    <!-- 문제 본문 -->
                    <div class="card-question-section">
                        <div class="card-question-meta">
                            <span class="meta-q-id" id="card-q-id">2025년 45번 기출</span>
                            <span class="meta-tag" id="card-concept-tag">1-a. 요구사항명세</span>
                        </div>
                        <div class="card-question-text" id="card-question-text">
                            문제를 로딩하는 중입니다...
                        </div>
                    </div>

                    <!-- 4지선다 보기 영역 -->
                    <div class="card-options-section" id="card-options-container">
                        <!-- JS에서 버튼 동적 렌더링 -->
                    </div>

                    <!-- 답안 제출 버튼: 보기 선택 후 눌러야 채점이 진행됨 -->
                    <div class="answer-submit-row">
                        <button class="submit-answer-btn" id="btn-submit-answer" onclick="submitCurrentAnswer()" disabled>
                            <i data-lucide="send"></i> 답안 제출
                        </button>
                    </div>

                    <!-- 피드백 & 해설 박스 -->
                    <div class="card-feedback-section hidden" id="card-feedback-box">
                        <div class="feedback-banner" id="card-feedback-banner">
                            <!-- 정오답 여부 -->
                        </div>
                        <div class="explanation-box" id="card-explanation-box">
                            <!-- 해설 텍스트 + 다음 복습 일정 안내 -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- 하단 네비게이션 컨트롤 -->
            <div class="card-controls">
                <button class="control-btn" id="btn-prev" onclick="prevCard()"><i data-lucide="chevron-left"></i>
                    이전</button>
                <button class="control-btn end-btn" id="btn-end" onclick="backToDashboard()">종료</button>
                <button class="control-btn next-btn" id="btn-next" onclick="nextCard()">다음 <i
                        data-lucide="chevron-right"></i></button>
            </div>
        </section>

    </main>

    <footer class="footer-note"
        style="text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.8rem; border-top: 1px solid rgba(255,255,255,0.04); margin-top: 4rem;">
        © 2026 Jolly-Carson 학습 시스템. All Rights Reserved.
    </footer>

    <!-- JS 제어 파일 연동 (대시보드 공통 기능 포함) -->
    <script src="../js/config.js"></script>
    <script src="../js/dashboard_common.js"></script>
    <script src="../js/review.js"></script>
    <script>
        // Lucide 아이콘 초기 구동
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) {
                lucide.createIcons();
            }
        });

        // 홈으로 이동 분기
        function goToHome() {
            window.location.href = "/";
        }
    </script>
</body>

</html>
