<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전체 과목 공식 범위별 기출 뷰어</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard_common.css">
    <link rel="stylesheet" href="css/game.css">
    <script src="js/config.js"></script>
    <script src="js/search_utils.js"></script>
    <!--
        [설계 의도] iframe으로 5개 과목 페이지를 쌓아 넣는 이전 방식은 크로미움 계열 브라우저가
        "JS로 iframe 높이를 변경"할 때 내부 콘텐츠 일부를 리페인트하지 못하고 빈 공백으로 남기는
        실제 버그가 있어 포기했습니다(고정 높이+스크롤로 바꿔도 여전히 아쉬움). 대신 dashboard_common.js
        자체를 "현재 활성 과목"을 가리키는 포인터(DashboardCtx)로 멀티 인스턴스화해서, 5개 과목을
        진짜 하나의 DOM에서 동시에 렌더링합니다. exam_db/*.js, js/data/*_official.js는 과목마다
        동일한 전역 변수(examDatabase/window.dashboardData)를 bare 선언/대입하므로 5개를 한 페이지에
        그대로 로드할 수 없어(심한 경우 SyntaxError) 아예 로드하지 않고, /api/dashboard·/api/question
        API만으로 데이터를 가져옵니다(서버가 꺼져 있을 때 폴백 텍스트가 없다는 점만 단독 페이지와 다름).
    -->
    <script src="js/dashboard_common.js?v=20260613"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>전체 과목 공식 범위별 기출분석</h1>
            <p class="subtitle" id="db-mode-subtitle">5개 과목을 과목별로 구분해 한 화면에서 이어 볼 수 있는 통합 뷰입니다</p>

            <div class="navigation-container">
                <div class="meta-badges" id="dynamic-nav-badges">
                    <a href="Learning_History/lhistory.html" class="badge history-badge" style="text-decoration: none; background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #ffffff; border: none; font-weight: 700;">📈 학습 분석</a>
                    <a href="se_official_scopes.html" class="badge subject-badge" style="text-decoration: none;">소프트웨어공학</a>
                    <a href="pm_official_scopes.html" class="badge subject-badge" style="text-decoration: none;">프로젝트 관리</a>
                    <a href="db_official_scopes.html" class="badge subject-badge" style="text-decoration: none;">데이터베이스</a>
                    <a href="sa_official_scopes.html" class="badge subject-badge" style="text-decoration: none;">시스템 아키텍처</a>
                    <a href="sc_official_scopes.html" class="badge subject-badge" style="text-decoration: none;">보안</a>
                </div>
            </div>
        </header>

        <div id="all-subjects-stack"></div>
    </div>

    <!-- 세부 토픽 목록 팝업 모달 (5개 과목이 공유하는 단일 오버레이 - 호출한 과목만 내용이 채워짐) -->
    <div id="topic-modal" class="modal-overlay" onclick="closeTopicModal(event)">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div class="modal-card-header">
                <h2 class="modal-card-title">🔍 검출된 공식 중단원 목록</h2>
                <button class="modal-close-x" onclick="closeTopicModal()">✕</button>
            </div>
            <div class="modal-card-body">
                <ul id="modal-topic-list" class="modal-topic-list"></ul>
            </div>
        </div>
    </div>

    <script>
        // [설계 의도] 각 과목의 공식 범위 페이지(se/pm/db/sa/sc_official_scopes.html)가 <head>에서
        // 로드하는 exam_db/{code}_db.js, js/data/{code}_official.js는 이 통합 뷰에서는 로드하지
        // 않으므로, 과목별 대단원 카테고리 라벨은 각 HTML의 .filter-section에 하드코딩된 것과
        // 동일한 목록을 여기 직접 선언해 둡니다(출처: 각 과목 페이지의 정적 필터 버튼).
        const SUBJECTS = [
            {
                code: 'SE', name: '소프트웨어공학',
                categories: ['1. 요구사항분석 및 설계', '2. 구현 및 테스트', '3. 유지관리 및 운영', '4. 개발방법론, sw 구조 및 공개sw', '5. SW 품질 및 비용산정']
            },
            {
                code: 'PM', name: '프로젝트 관리',
                categories: ['1. 정보화 및 소프트웨어 관련 법/제도 및 국내외 지침, 가이드', '2. 감리 관련 법제도 및 관련 기술', '3. 조직 관리론', '4. 프로젝트 관리']
            },
            {
                code: 'DB', name: '데이터베이스',
                categories: ['1. DB개념 및 설계', '2. DB언어', '3. DBMS 기술', '4. DB응용', '5. 빅데이터 및 AI데티어']
            },
            {
                code: 'SA', name: '시스템 아키텍처',
                categories: ['1. 공통기술', '2. 아키텍처 설계 및 구축', '3. 데이터 통신 및 네트워크 설계', '4. 기타 신기술']
            },
            {
                code: 'SC', name: '보안',
                categories: ['1. 공통 보안 기술', '2. 네트워크 및 시스템 보안', '3. 응용 및 신기술 보안', '4. 개발 및 운영 보안', '5. 정보보호 법규 및 개인정보보호']
            }
        ];

        function escapeAttr(str) {
            return String(str).replace(/&/g, '&amp;').replace(/'/g, '&#39;').replace(/"/g, '&quot;');
        }

        /**
         * [설계 의도] 기존 단독 과목 페이지(se_official_scopes.html 등)의 <body> 마크업과 동일한
         * 구조(헤더 + 통계 배지 + 필터 버튼 + 아코디언 컨테이너)를 과목 코드 접미사를 붙여 생성합니다.
         * dashboard_common.js의 $id() 헬퍼가 "기본id-과목코드" 형태를 우선 조회하므로, 여기서 만드는
         * id들도 그 규칙(예: accordionContainer-SE)을 그대로 따라야 합니다.
         */
        function buildSubjectSection(subject) {
            const code = subject.code;
            const filterButtonsHtml = subject.categories.map(cat =>
                `<button class="filter-btn" onclick="filterCategory('${code}', '${escapeAttr(cat)}')">${cat}</button>`
            ).join('');

            const section = document.createElement('section');
            section.className = 'subject-section';
            section.id = `subject-section-${code}`;
            section.innerHTML = `
                <header>
                    <h2 class="subject-section-title">${subject.name} 공식 범위별 기출분석</h2>
                    <div class="meta-badges">
                        <span class="badge">기출 범위: 2015년 ~ 2026년</span>
                        <span class="badge accent">총 분석 데이터: <span id="total-question-badge-${code}">0</span> 문항</span>
                        <span class="badge" onclick="openTopicListModal('${code}')" style="cursor: pointer; transition: all 0.2s;" title="클릭 시 중단원 목록 팝업 열기">
                            매핑된 공식 중단원: <span id="topic-count-badge-${code}">0</span>개
                        </span>
                    </div>
                </header>
                <div class="filter-section">
                    <button class="filter-btn active" onclick="filterCategory('${code}', 'all')">전체 대단원</button>
                    ${filterButtonsHtml}
                </div>
                <div class="accordion-list" id="accordionContainer-${code}">
                    <!-- Dynamic Accordion Items Rendered by JS -->
                </div>
            `;
            return section;
        }

        /**
         * [설계 의도] exam_db/{code}_db.js는 과목마다 동일한 전역 "const examDatabase"를
         * 선언하므로 <script> 태그로 5개를 그대로 로드할 수 없습니다(둘째 과목부터 SyntaxError).
         * 대신 텍스트로 fetch한 뒤 "const examDatabase = " 접두사만 떼어내 순수 객체 리터럴
         * 표현식으로 평가(new Function)해, 과목별로 독립된 ctx.examDatabase에 저장합니다.
         * 이 데이터는 지문 검색(§2)과 API 실패 시 폴백 텍스트 표시에만 쓰이므로, 로딩이 늦어도
         * 아코디언 렌더링 자체를 막지 않도록 비차단(백그라운드)으로 처리합니다.
         */
        function loadExamDatabaseForSubject(code) {
            const url = `exam_db/${code.toLowerCase()}_db.js`;
            fetch(url)
                .then(res => res.ok ? res.text() : null)
                .then(text => {
                    if (!text) return;
                    const prefixMatch = text.match(/^\s*const\s+examDatabase\s*=\s*/);
                    if (!prefixMatch) return;
                    let body = text.slice(prefixMatch[0].length).trimEnd();
                    if (body.endsWith(';')) body = body.slice(0, -1);
                    const data = new Function('return (' + body + ')')();
                    const ctx = DashboardCtx.instances[code];
                    if (ctx) ctx.examDatabase = data;
                })
                .catch(err => console.warn(`[경고] ${code} 지문 검색용 원문 데이터 로드 실패`, err));
        }

        document.addEventListener('DOMContentLoaded', () => {
            const stack = document.getElementById('all-subjects-stack');

            SUBJECTS.forEach(subject => {
                const section = buildSubjectSection(subject);
                stack.appendChild(section);

                // [설계 의도] loadDashboardDataAndInit 등 진입점 함수는 호출 시점에 code를 명시적으로
                // 받지만, 내부적으로 window.SUBJECT_CODE/DASHBOARD_TYPE/SUBJECT_NAME을 읽는 하위
                // 호환 경로가 일부 남아 있어(모두 동기 호출 구간) 등록 직후 이 값들도 맞춰 둡니다.
                registerDashboardInstance(subject.code, section, subject.name);
                window.SUBJECT_CODE = subject.code;
                window.DASHBOARD_TYPE = 'official';
                window.SUBJECT_NAME = subject.name;

                loadDashboardDataAndInit(subject.code);
                loadExamDatabaseForSubject(subject.code);
            });

            // [설계 의도] 아코디언 컨테이너가 없는 페이지에서 자동으로 건너뛰어지는 dashboard_common.js의
            // 기본 DOMContentLoaded 부트스트랩은 이 페이지에서도 똑같이 걸리지만(과목 전용 id가 전부
            // 접미사 포함이라 기본 경로는 그냥 no-op), 오답복습/년도별120제 배지 주입은 그 경로를 타지
            // 않으므로 직접 호출해 줍니다.
            if (typeof initDashboardNav === 'function') initDashboardNav();
        });
    </script>
</body>
</html>
