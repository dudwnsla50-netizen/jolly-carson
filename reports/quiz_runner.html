<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jolly-Carson 모바일 기출 퀴즈 러너</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-primary: #8b5cf6;
            --accent-gradient: linear-gradient(135deg, #8b5cf6 0%, #d946ef 100%);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --success: #10b981;
            --error: #ef4444;
            --glow: 0 0 15px rgba(139, 92, 246, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* 모바일 뷰 최적화 컨테이너 */
        .container {
            width: 100%;
            max-width: 500px;
            min-height: 100vh;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            position: relative;
            background: radial-gradient(circle at 50% 0%, rgba(139, 92, 246, 0.15) 0%, transparent 70%);
        }

        /* 상단 네비게이션 고정 바 */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.2rem;
            padding-top: env(safe-area-inset-top);
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            padding: 0.5rem 0.9rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            transition: all 0.2s;
        }

        .back-btn:active {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        .concept-badge {
            background: var(--accent-gradient);
            padding: 0.3rem 0.7rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            max-width: 60%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            box-shadow: var(--glow);
        }

        /* 상단 진행률 프로그레스 바 */
        .progress-container {
            margin-bottom: 1.5rem;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-gradient);
            width: 0%;
            border-radius: 999px;
            transition: width 0.3s ease;
        }

        /* 메인 콘텐츠 카드 */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .quiz-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            margin-bottom: 1.2rem;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .question-meta {
            font-size: 0.75rem;
            color: var(--accent-primary);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.6rem;
        }

        .question-text {
            font-size: 1.05rem;
            font-weight: 500;
            color: #ffffff;
            margin-bottom: 1.5rem;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        /* 4지선다 보기 리스트 */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .option-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 0.9rem 1.1rem;
            display: flex;
            align-items: flex-start;
            gap: 0.8rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: left;
            width: 100%;
            outline: none;
        }

        .option-item:active {
            background: rgba(139, 92, 246, 0.08);
            border-color: rgba(139, 92, 246, 0.3);
        }

        .option-item.selected {
            background: rgba(139, 92, 246, 0.15);
            border-color: var(--accent-primary);
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.2);
        }

        .option-num {
            width: 22px;
            height: 22px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-secondary);
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .option-item.selected .option-num {
            background: var(--accent-primary);
            color: #ffffff;
        }

        .option-text {
            font-size: 0.9rem;
            color: var(--text-primary);
            line-height: 1.4;
            white-space: pre-wrap;
            padding-top: 1px;
        }

        /* 하단 이미지 아코디언 토글 */
        .image-toggle-container {
            margin-top: 1rem;
        }

        .image-toggle-btn {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            color: var(--text-secondary);
            padding: 0.6rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            transition: all 0.2s;
        }

        .image-toggle-btn:active {
            background: rgba(255, 255, 255, 0.08);
        }

        .crop-image-wrapper {
            margin-top: 0.8rem;
            border-radius: 8px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: none;
            justify-content: center;
            padding: 0.5rem;
        }

        .crop-image-wrapper.show {
            display: flex;
            animation: fadeIn 0.25s ease-out;
        }

        .crop-img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            filter: brightness(0.9) contrast(1.1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 내비게이션 컨트롤 영역 */
        .nav-controls {
            display: flex;
            gap: 0.8rem;
            margin-top: 0.6rem;
            margin-bottom: env(safe-area-inset-bottom);
        }

        .nav-btn {
            flex-grow: 1;
            padding: 0.9rem;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .nav-btn-prev {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            flex-grow: 0.4;
        }

        .nav-btn-prev:active {
            background: rgba(255, 255, 255, 0.12);
        }

        .nav-btn-next {
            background: var(--accent-gradient);
            color: #ffffff;
            box-shadow: var(--glow);
        }

        .nav-btn-next:active {
            filter: brightness(0.85);
            transform: scale(0.98);
        }

        /* 로딩 스피너 */
        .loader-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            gap: 1rem;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(139, 92, 246, 0.1);
            border-left-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 결과 분석 뷰 */
        .result-view {
            display: none;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .result-view.active {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .score-circle-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 0;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.12) 0%, transparent 65%);
        }

        .score-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.6);
            border: 5px solid var(--accent-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.25);
            margin-bottom: 1rem;
        }

        .score-num {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .score-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.6rem;
            margin-bottom: 0.5rem;
        }

        .summary-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 0.8rem;
            border-radius: 10px;
            text-align: center;
        }

        .summary-card-val {
            font-family: 'Outfit', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            margin-top: 0.2rem;
        }

        .summary-card-val.correct { color: var(--success); }
        .summary-card-val.wrong { color: var(--error); }

        .summary-card-title {
            font-size: 0.7rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        /* 오답 및 정답 리뷰 리스트 */
        .review-title {
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
            margin-top: 0.5rem;
            margin-bottom: 0.4rem;
        }

        .review-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .review-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.2s;
        }

        .review-header {
            padding: 0.9rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.01);
        }

        .review-header:active {
            background: rgba(255, 255, 255, 0.05);
        }

        .review-status-badge {
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 0.2rem;
        }

        .review-status-badge.correct {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }

        .review-status-badge.wrong {
            background: rgba(239, 68, 68, 0.15);
            color: var(--error);
        }

        .review-q-num {
            font-size: 0.85rem;
            color: #ffffff;
            font-weight: 600;
        }

        .review-content {
            padding: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(0, 0, 0, 0.15);
            display: none;
        }

        .review-content.show {
            display: block;
        }

        .review-q-text {
            font-size: 0.9rem;
            line-height: 1.5;
            color: #ffffff;
            margin-bottom: 0.8rem;
            white-space: pre-wrap;
        }

        .review-ans-row {
            font-size: 0.8rem;
            margin-bottom: 0.5rem;
            display: flex;
            gap: 0.8rem;
        }

        .review-ans-label {
            color: var(--text-secondary);
        }

        .review-ans-val {
            font-weight: 600;
        }

        .review-ans-val.correct { color: var(--success); }
        .review-ans-val.wrong { color: var(--error); }

        .review-explanation {
            background: rgba(139, 92, 246, 0.05);
            border-left: 3px solid var(--accent-primary);
            padding: 0.7rem;
            border-radius: 0 6px 6px 0;
            font-size: 0.8rem;
            line-height: 1.5;
            color: var(--text-secondary);
            margin-top: 0.8rem;
        }

        .review-image-btn {
            background: none;
            border: none;
            color: var(--accent-primary);
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 0.6rem;
            display: flex;
            align-items: center;
            gap: 0.2rem;
            outline: none;
        }

        /* 아코디언 화살표 트랜지션 */
        .review-arrow {
            font-size: 0.7rem;
            color: var(--text-secondary);
            transition: transform 0.2s;
        }

        .review-item.open .review-arrow {
            transform: rotate(180deg);
        }

        .home-action-btn {
            width: 100%;
            background: var(--accent-gradient);
            color: #ffffff;
            padding: 0.95rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            border: none;
            margin-top: 1rem;
            margin-bottom: env(safe-area-inset-bottom);
            box-shadow: var(--glow);
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .home-action-btn:active {
            filter: brightness(0.85);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 퀴즈 플레이어 뷰 -->
        <div id="quiz-player-view" style="flex-grow: 1; display: flex; flex-direction: column;">
            <header>
                <button class="back-btn" onclick="exitQuiz()">✕ 그만하기</button>
                <div class="concept-badge" id="header-concept-name">로딩 중...</div>
            </header>

            <div class="progress-container">
                <div class="progress-header">
                    <span id="current-question-indicator">문제 0 / 0</span>
                    <span id="progress-percent">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>

            <!-- 로더 영역 -->
            <div class="loader-wrapper" id="loader">
                <div class="spinner"></div>
                <div style="font-size: 0.85rem; color: var(--text-secondary);">개념 기출문제 로딩 중...</div>
            </div>

            <!-- 퀴즈 콘텐츠 카드 -->
            <div class="main-content" id="quiz-content" style="display: none;">
                <div class="quiz-card">
                    <div class="question-meta" id="question-meta-info">2026년도 SE 26번 문항</div>
                    <div class="question-text" id="question-body">질문 지문 정보가 올바르게 렌더링되지 않았습니다.</div>
                    
                    <div class="options-container" id="options-container">
                        <!-- Options Dynamically Populated -->
                    </div>

                    <div class="image-toggle-container" id="img-toggle-container" style="display: none;">
                        <button class="image-toggle-btn" onclick="toggleCropImage()">
                            🖼️ 시험지 원본 이미지 확인 (다이어그램용) <span id="img-arrow">▼</span>
                        </button>
                        <div class="crop-image-wrapper" id="crop-image-wrapper">
                            <img src="" id="crop-img" class="crop-img" alt="기출문제 이미지 원본" onerror="onImageLoadError()">
                        </div>
                    </div>
                </div>

                <!-- 조작 버튼 -->
                <div class="nav-controls">
                    <button class="nav-btn nav-btn-prev" id="prev-btn" onclick="goToPrevQuestion()" style="display: none;">이전</button>
                    <button class="nav-btn nav-btn-next" id="next-btn" onclick="goToNextQuestion()">제출 후 다음</button>
                </div>
            </div>
        </div>

        <!-- 퀴즈 결과 분석 뷰 -->
        <div class="result-view" id="result-view">
            <header style="margin-bottom: 0.5rem;">
                <div style="font-family: 'Outfit', sans-serif; font-size: 1.2rem; font-weight: 800; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">JOLLY-CARSON</div>
                <div class="concept-badge" id="result-concept-name">개념명</div>
            </header>

            <div class="score-circle-wrapper">
                <div class="score-circle">
                    <span class="score-num" id="result-score">0점</span>
                    <span class="score-label">종합 정답률</span>
                </div>
                <div style="font-size: 0.85rem; color: var(--text-secondary); font-weight: 600;" id="result-time-text">테스트 완료 일시: 2026.06.19 15:20</div>
            </div>

            <div class="summary-grid">
                <div class="summary-card">
                    <div class="summary-card-title">총 문항수</div>
                    <div class="summary-card-val" id="result-total-cnt">0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-card-title">맞춘 문제</div>
                    <div class="summary-card-val correct" id="result-correct-cnt">0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-card-title">틀린 문제</div>
                    <div class="summary-card-val wrong" id="result-wrong-cnt">0</div>
                </div>
            </div>

            <div>
                <h3 class="review-title">📝 실시간 오답 분석 리포트</h3>
                <div class="review-list" id="review-list">
                    <!-- Review Items Populated Dynamically -->
                </div>
            </div>

            <button class="home-action-btn" onclick="saveAndReturn()">💾 기록 저장 후 대시보드로 돌아가기</button>
        </div>
    </div>

    <script>
        // 전역 상태 변수
        let subject = "SE";
        let concept = "";
        let questions = [];
        let currentIndex = 0;
        let userAnswers = []; // 각 문제별 사용자 정답 (복수 정답을 위해 배열 형식으로 저장)
        let loadedQuestionsData = {}; // key: index, value: question detail object
        let imageCollapsed = true;

        document.addEventListener('DOMContentLoaded', () => {
            initQuizRunner();
        });

        // 1. URL 파라미터 읽기 및 문제 리스트 로딩
        function initQuizRunner() {
            const params = new URLSearchParams(window.location.search);
            subject = params.get('subject') || 'SE';
            concept = params.get('concept');

            if (!concept) {
                alert("개념명이 지정되지 않았습니다. 대시보드로 돌아갑니다.");
                exitQuiz();
                return;
            }

            document.getElementById('header-concept-name').textContent = concept;
            document.getElementById('result-concept-name').textContent = concept;

            // 1차 조회: official-scopes 데이터 로딩
            fetch(`/api/dashboard?subject=${subject}&type=official`)
                .then(res => {
                    if (!res.ok) throw new Error("HTTP error " + res.status);
                    return res.json();
                })
                .then(data => {
                    let matched = data.find(item => item.concept === concept);
                    
                    // 만약 official 범위에서 매치되지 않으면 frequent 범위 재조회
                    if (!matched) {
                        return fetch(`/api/dashboard?subject=${subject}&type=frequent`)
                            .then(res => res.json())
                            .then(frequentData => {
                                matched = frequentData.find(item => item.concept === concept);
                                if (!matched) {
                                    throw new Error("지정된 개념의 기출문제를 매핑할 수 없습니다.");
                                }
                                return matched.questions;
                            });
                    }
                    return matched.questions;
                })
                .then(qList => {
                    if (!qList || qList.length === 0) {
                        throw new Error("해당 개념에 매핑된 기출문제가 존재하지 않습니다.");
                    }
                    questions = qList;
                    userAnswers = new Array(questions.length).fill(null).map(() => []);
                    
                    // 순차적으로 문제 데이터 상세 요청
                    loadQuestionsDetails();
                })
                .catch(err => {
                    console.error(err);
                    alert("문제를 불러오는 도중 에러가 발생했습니다: " + err.message);
                    exitQuiz();
                });
        }

        // 2. 전체 문제 상세 데이터 비동기 병렬 요청
        function loadQuestionsDetails() {
            const promises = questions.map((q, idx) => {
                const key = `${q.year}_${q.num}`;
                return fetch(`/api/question?id=${key}`)
                    .then(res => {
                        if (!res.ok) throw new Error();
                        return res.json();
                    })
                    .then(data => {
                        loadedQuestionsData[idx] = data;
                    })
                    .catch(() => {
                        // 오프라인 폴백 처리
                        loadedQuestionsData[idx] = {
                            id: key,
                            year: q.year,
                            question_num: q.num,
                            question: `[경고] 서버에서 기출 정보를 불러오지 못했습니다. (ID: ${key})`,
                            options: ["보기 1", "보기 2", "보기 3", "보기 4"],
                            answer: [],
                            explanation: "서버가 중단되었거나 오프라인 상태입니다."
                        };
                    });
            });

            Promise.all(promises).then(() => {
                // 로딩 완료 후 카드 렌더링
                document.getElementById('loader').style.display = 'none';
                document.getElementById('quiz-content').style.display = 'block';
                
                renderQuestion();
            });
        }

        // 3. 개별 기출문제 렌더링
        function renderQuestion() {
            const data = loadedQuestionsData[currentIndex];
            if (!data) return;

            // 상단 진행바 및 문항 카운트 갱신
            const total = questions.length;
            const curNum = currentIndex + 1;
            document.getElementById('current-question-indicator').textContent = `문제 ${curNum} / ${total}`;
            
            const percent = Math.round((currentIndex / total) * 100);
            document.getElementById('progress-percent').textContent = `${percent}%`;
            document.getElementById('progress-fill').style.width = `${percent}%`;

            // 메타 정보
            const subjectLabel = subject === 'SE' ? '소프트웨어공학' : '기출';
            document.getElementById('question-meta-info').textContent = `${data.year}년도 ${subjectLabel} ${data.question_num}번 문항`;

            // 지문 본문
            document.getElementById('question-body').textContent = data.question;

            // 보기 리스트 렌더링
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            const numSymbols = ["①", "②", "③", "④", "⑤"];
            const currentSelected = userAnswers[currentIndex] || [];

            data.options.forEach((opt, oIdx) => {
                const sym = numSymbols[oIdx] || `${oIdx + 1}`;
                const isSelected = currentSelected.includes(oIdx + 1);

                const optButton = document.createElement('button');
                optButton.className = `option-item ${isSelected ? 'selected' : ''}`;
                optButton.onclick = () => selectOption(oIdx + 1);
                optButton.innerHTML = `
                    <span class="option-num">${sym}</span>
                    <span class="option-text">${opt}</span>
                `;
                optionsContainer.appendChild(optButton);
            });

            // 원본 이미지 연동
            const imgPath = `images/${data.year}_${data.question_num}.png`;
            document.getElementById('crop-img').src = imgPath;
            
            // 이미지 토글 초기화
            imageCollapsed = true;
            document.getElementById('crop-image-wrapper').classList.remove('show');
            document.getElementById('img-arrow').textContent = '▼';
            document.getElementById('img-toggle-container').style.display = 'block';

            // 조작 버튼 라벨 설정
            const isLast = currentIndex === total - 1;
            document.getElementById('next-btn').textContent = isLast ? '퀴즈 제출 및 채점하기' : '제출 후 다음';
            document.getElementById('prev-btn').style.display = currentIndex > 0 ? 'block' : 'none';
        }

        // 보기 선택 토글 (복수 정답을 위해 토글 형태로 지원)
        function selectOption(optNum) {
            const currentSelected = userAnswers[currentIndex];
            const valIndex = currentSelected.indexOf(optNum);
            
            if (valIndex > -1) {
                currentSelected.splice(valIndex, 1);
            } else {
                // 단일 선택을 위해 클릭 시 다른 모든 선택 제거하고 하나만 선택하게 하려면 다음 주석 해제
                // currentSelected.length = 0;
                currentSelected.push(optNum);
            }
            
            userAnswers[currentIndex] = currentSelected;
            renderQuestion();
        }

        // 4. 이미지 뷰어 아코디언 토글
        function toggleCropImage() {
            imageCollapsed = !imageCollapsed;
            const wrap = document.getElementById('crop-image-wrapper');
            const arrow = document.getElementById('img-arrow');

            if (imageCollapsed) {
                wrap.classList.remove('show');
                arrow.textContent = '▼';
            } else {
                wrap.classList.add('show');
                arrow.textContent = '▲';
            }
        }

        function onImageLoadError() {
            // 이미지가 없는 연도/문제가 있을 경우 버튼 자체를 히든 처리
            document.getElementById('img-toggle-container').style.display = 'none';
        }

        // 5. 내비게이션 제어
        function goToPrevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        function goToNextQuestion() {
            const total = questions.length;
            
            // 현재 문항을 풀지 않은 경우 체크 리스크 얼럿
            if (userAnswers[currentIndex].length === 0) {
                if (!confirm("답을 선택하지 않았습니다. 다음 문제로 넘어가시겠습니까?")) {
                    return;
                }
            }

            if (currentIndex < total - 1) {
                currentIndex++;
                renderQuestion();
            } else {
                // 마지막 문제에서 클릭하면 퀴즈 종료 및 채점 화면으로 이동
                showResultDashboard();
            }
        }

        // 6. 결과 화면 도출 및 채점
        function showResultDashboard() {
            document.getElementById('quiz-player-view').style.display = 'none';
            document.getElementById('result-view').classList.add('active');

            let correctCount = 0;
            let wrongCount = 0;
            const reviewList = document.getElementById('review-list');
            reviewList.innerHTML = '';

            const numSymbols = ["①", "②", "③", "④", "⑤"];

            questions.forEach((q, idx) => {
                const data = loadedQuestionsData[idx];
                const uAns = userAnswers[idx].sort();
                
                // DB에서 받아오는 answer 형식 파싱 (SQLite DB에는 정수(단일) 또는 JSON 배열 문자열 형태로 저장되어 있음)
                let cAns = [];
                if (data.answer) {
                    if (Array.isArray(data.answer)) {
                        cAns = data.answer.sort();
                    } else {
                        // 정수형으로 들어온 단일 정답 대응
                        cAns = [parseInt(data.answer)].sort();
                    }
                }

                // 채점 수행
                const isCorrect = JSON.stringify(uAns) === JSON.stringify(cAns) && uAns.length > 0;
                if (isCorrect) {
                    correctCount++;
                } else {
                    wrongCount++;
                }

                // 오답 분석 아이템 UI 구성
                const item = document.createElement('div');
                item.className = 'review-item';
                item.id = `review-item-${idx}`;

                const uAnsStr = uAns.map(num => numSymbols[num - 1] || num).join(', ') || '미입력';
                const cAnsStr = cAns.map(num => numSymbols[num - 1] || num).join(', ') || '답안지 확인 필요';

                item.innerHTML = `
                    <div class="review-header" onclick="toggleReviewContent(${idx})">
                        <div style="display: flex; align-items: center; gap: 0.6rem;">
                            <span class="review-status-badge ${isCorrect ? 'correct' : 'wrong'}">
                                ${isCorrect ? '✓ 정답' : '✕ 오답'}
                            </span>
                            <span class="review-q-num">${data.year}년 ${data.question_num}번</span>
                        </div>
                        <span class="review-arrow" id="review-arrow-${idx}">▼</span>
                    </div>
                    <div class="review-content" id="review-content-${idx}">
                        <div class="review-q-text">${data.question}</div>
                        <div class="review-ans-row">
                            <span class="review-ans-label">나의 입력:</span>
                            <span class="review-ans-val ${isCorrect ? 'correct' : 'wrong'}">${uAnsStr}</span>
                        </div>
                        <div class="review-ans-row">
                            <span class="review-ans-label">실제 정답:</span>
                            <span class="review-ans-val correct">${cAnsStr}</span>
                        </div>
                        
                        ${data.explanation ? `<div class="review-explanation"><strong>💡 정답 해설:</strong><br>${data.explanation}</div>` : ''}
                        
                        <button class="review-image-btn" onclick="toggleReviewImage(${idx}, ${data.year}, ${data.question_num})">
                            🖼️ 시험지 원본 이미지 확인 <span id="review-img-arrow-${idx}">▼</span>
                        </button>
                        <div class="crop-image-wrapper" id="review-img-wrap-${idx}" style="margin-top: 0.6rem;">
                            <img src="" id="review-img-${idx}" class="crop-img" alt="기출문제 이미지 원본">
                        </div>
                    </div>
                `;
                reviewList.appendChild(item);
            });

            // 점수 및 통계 표기
            const finalScore = Math.round((correctCount / questions.length) * 100);
            document.getElementById('result-score').textContent = `${finalScore}점`;
            
            // 완료 일시 표기
            const now = new Date();
            const yearStr = now.getFullYear();
            const monthStr = String(now.getMonth() + 1).padStart(2, '0');
            const dateStr = String(now.getDate()).padStart(2, '0');
            const hourStr = String(now.getHours()).padStart(2, '0');
            const minStr = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('result-time-text').textContent = `테스트 완료: ${yearStr}.${monthStr}.${dateStr} ${hourStr}:${minStr}`;

            document.getElementById('result-total-cnt').textContent = questions.length;
            document.getElementById('result-correct-cnt').textContent = correctCount;
            document.getElementById('result-wrong-cnt').textContent = wrongCount;
        }

        // 결과 상세 아코디언 토글
        function toggleReviewContent(idx) {
            const item = document.getElementById(`review-item-${idx}`);
            const content = document.getElementById(`review-content-${idx}`);
            const arrow = document.getElementById(`review-arrow-${idx}`);

            const isOpen = item.classList.contains('open');
            if (isOpen) {
                item.classList.remove('open');
                content.classList.remove('show');
                arrow.textContent = '▼';
            } else {
                item.classList.add('open');
                content.classList.add('show');
                arrow.textContent = '▲';
            }
        }

        // 오답 리뷰 내 원본 이미지 토글
        function toggleReviewImage(idx, year, num) {
            const wrap = document.getElementById(`review-img-wrap-${idx}`);
            const img = document.getElementById(`review-img-${idx}`);
            const arrow = document.getElementById(`review-img-arrow-${idx}`);

            if (!img.src || img.src.includes('quiz_runner.html')) {
                img.src = `images/${year}_${num}.png`;
            }

            const isShown = wrap.classList.contains('show');
            if (isShown) {
                wrap.classList.remove('show');
                arrow.textContent = '▼';
            } else {
                wrap.classList.add('show');
                arrow.textContent = '▲';
            }
        }

        // 7. 결과 저장 및 대시보드 리다이렉트 (LocalStorage + API 하이브리드)
        function saveAndReturn() {
            const total = questions.length;
            const correctCount = parseInt(document.getElementById('result-correct-cnt').textContent);
            const wrongCount = parseInt(document.getElementById('result-wrong-cnt').textContent);
            const nowIso = new Date().toISOString();

            // 맞은 문제 ID와 틀린 문제 ID 수집
            const correctDetails = [];
            const wrongDetails = [];

            questions.forEach((q, idx) => {
                const key = `${q.year}_${q.num}`;
                const data = loadedQuestionsData[idx];
                const uAns = userAnswers[idx].sort();
                
                let cAns = [];
                if (data.answer) {
                    if (Array.isArray(data.answer)) {
                        cAns = data.answer.sort();
                    } else {
                        cAns = [parseInt(data.answer)].sort();
                    }
                }
                const isCorrect = JSON.stringify(uAns) === JSON.stringify(cAns) && uAns.length > 0;
                
                if (isCorrect) {
                    correctDetails.push(key);
                } else {
                    wrongDetails.push(key);
                }
            });

            const submissionPayload = {
                subject: subject,
                concept: concept,
                total_questions: total,
                correct_count: correctCount,
                wrong_count: wrongCount,
                details: {
                    correct: correctDetails,
                    wrong: wrongDetails
                }
            };

            // LocalStorage 백업 저장 (서버 데이터 유실 대비 하이브리드 캐싱)
            try {
                const backupList = JSON.parse(localStorage.getItem('jolly_carson_quiz_history') || '[]');
                backupList.push({
                    created_at: nowIso,
                    subject: subject,
                    concept: concept,
                    total_questions: total,
                    correct_count: correctCount,
                    wrong_count: wrongCount,
                    details: submissionPayload.details
                });
                localStorage.setItem('jolly_carson_quiz_history', JSON.stringify(backupList));
            } catch (e) {
                console.warn("[경고] LocalStorage 저장 공간 부족 또는 비활성화", e);
            }

            // 서버 API에 제출
            fetch('/api/quiz/submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(submissionPayload)
            })
            .then(() => {
                // 성공 여부에 관계없이 대시보드로 돌아감
                exitQuiz();
            })
            .catch(err => {
                console.error("API 저장 실패. LocalStorage에 안전 백업되었으므로 대시보드로 복귀합니다.", err);
                exitQuiz();
            });
        }

        // 그만두기 및 탈출
        function exitQuiz() {
            const redirectFile = subject.toLowerCase() === 'se' ? 'se_official_scopes.html' : 'se_official_scopes.html';
            window.location.href = `${redirectFile}?v=20260613`;
        }
    </script>
