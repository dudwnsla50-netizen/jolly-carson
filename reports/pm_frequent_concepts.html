  "2020_11": "11. 정보시스템 운영단계에서 요구사항정의서는 고객의\n변경 요구사항 관리에 사용되는 주요 산출물이다.\n다음 중 '정보시스템 운영 및 유지보수 감리 점\n검가이드' 에 제시된 요구사항정의서의 필수항\n목인 상세 요구사항 내용에 속하지 않는 것은 ?\n① 현재 기능 ② 변경 사항\n③ 해결 방안 ④ 담당 인력",
  "2020_12": "12. '정보시스템 감리기준' 에 관련된 설명으로 다음\n중 맞는 것을 모두 고르면?\n가. 사업비가 25억원이지만 사업 기간이 5개월인 사업\n은 2단계감리를 하게 할 수 있다.\n나. 대기업인 소프트웨어사업자의 참여가 제한되는\n경우에는 상주감리를 추가할 수 있다.\n다. 기본감리비를 산정할 때 감리대상사업비는 감리\n대상사업의 계약금액을 말한다.\n① 가, 나 ② 가, 다\n③ 나, 다 ④ 가, 나, 다",
  "2020_13": "13. 다음은 특정 시점에서 세 개의 프로젝트의 획득\n가치 분석을 적용한 결과이다. 지금까지 성과에\n대해 일정은 계획보다 빨리 진행되고 있지만,\n비용은 계획보다 더 많이 지출되고 있는 프로젝트를\n모두 고른 것은?\n· 프로젝트 A: 획득가치(EV) = 200, 계획가치(PV)\n= 150, 실제원가(AC) = 210\n· 프로젝트 B: 일정차이(SV) = 20, 비용차이(CV) = 30\n· 프로젝트 C: 일정성과지수(SPI) = 0.9, 비용성과\n지수(CPI) = 1.1\n① 프로젝트 A\n② 프로젝트 B\n③ 프로젝트 C\n④ 프로젝트 A, 프로젝트 B, 프로젝트 C\n3 -\n\n=== NEW PAGE ===",
  "2020_14": "14. 다음 중 조직화 및 직무 설계에 관한 설명 중 맞는\n것을 모두 고른 것은?\n가. 통제 범위의 원칙 – 한 사람이 적정 숫자의 부하\n(subordinate)를 관리하도록 한다.\n나. 직무 충실화(job enrichment) - 직무의 폭과\n깊이를 동시에 넓고 깊게 해준다.\n다. 강한 매트릭스 조직 – 프로젝트 관리자는 관리자\n라기보다는 조정자 또는 촉진자의 역할을 한다.\n라. 가상 조직 – 각 개인의 전문성에 따라 전문가\n풀(pool)을 구성하고 인터넷 및 IT를 적극적으로\n활용하는 각 기능 간에 인적, 기술적 학습 조직이다.\n① 가, 나 ② 가, 라\n③ 나, 다 ④ 나, 라",
  "2020_15": "15. 다음 리스크에 대한 전략 중 리스크의 확률이나\n영향을 증가시키기 위해 리스크의 핵심 요인을\n확인하고 최대화하는 전략은?\n① 완화(mitigate) ② 향상(enhance)\n③ 공유(share) ④ 전이(transfer)",
  "2020_16": "16. 프로젝트 관리자가 프로젝트에서 발생하는 품질\n비용을 분석하고 있다. 다음 중 비적합성 비용으로\n분류할 수 없는 비용은?\n① 파괴테스트 손실 비용\n② 보증(warranty)작업 비용\n③ 비즈니스 손실 비용\n④ 재작업 비용",
  "2020_17": "17. PMI PMBOKⓇ에서 프로젝트 범위관리를 설명한 다\n음 내용 중 가장 적절하지 않은 것은?\n① 작업분류체계(WBS)는 작업패키지의 통제단위를\n설정하고 통제단위의 고유한 식별코드를 지정하\n여 완성한다.\n② 프로젝트에서 사용되는 제품범위는 제품,\n서비스 또는 결과의 특성과 기능을 의미한다.\n③ 범위확인은 완료된 프로젝트 인도물의 인수를\n공식화하는 프로세스이다.\n④ 승인된 버전인 범위기준선은 범위요구사항,\n프로젝트 범위기술서, 작업분류체계를 가리\n킨다.\n- 4",
  "2020_18": "18. 다음 품질관리 도구와 기법 중 작업분류체계(WBS),\n리스크분류체계(RBS), 조직분류체계(OBS) 등의\n분류체계를 표시하는데 사용할 수 있는 기법으로\n가장 적합한 것은?\n① 프로세스결정 프로그램 차트(PDPC)\n② 연관관계도\n③ 계통도\n④ 활동네트워크도",
  "2020_19": "19. 완료시점 산정치(EAC: Estimate at Complete)를\n나타낸 식으로 가장 적절하지 않은 것은?\nBAC : Budgeted at Complete\nCPI : Cost Performance Index\nSPI : Schedule Performance Index\nEV : Earned Value\nAC : Actual Cost\nETC : Estimate to Complete\n① EAC = BAC / CPI\n② EAC = AC + BAC - EV\n③ EAC = AC + Bottom-up ETC\n④ EAC = AC + [(BAC - EV) / (CPI + SPI)]",
  "2020_20": "20. 사원 A의 프로젝트 팀은 조달관리 계획서 작성에\n관한 작업을 완료하려고 한다. 마지막으로 팀장이\nA에게 조달관리 계획서 안에 있는 모든 내용들이\n적절하게 입력되었는지 확인하라고 했다면, 다음\n중 프로젝트에 대한 조달관리를 계획하기 위한\n투입물로 가장 거리가 먼 것은?\n① 요구사항 문서\n② 요구사항 추적 매트릭스\n③ 이해관계자 관리대장\n④ 공급자 선정기준",
  "2020_21": "21. 다음 직무 만족과 불만족 결정요인을 설명하는\nHerzberg의 동기-위생 모델에서 직무 불만족에\n영향을 미치는 위생요인으로 적절하지 않은 것은?\n① 조직의 규칙과 정책 ② 승진\n③ 임금 ④ 안정성\n4 -\n\n=== NEW PAGE ===",
  "2020_22": "22. PMI PMBOKⓇ에서 애자일과 적응형 방식에 대한 고려\n사항을 설명한 것으로 가장 적절하지 않은 것은?\n① 적응형 방식은 작업을 수행하고 결과를 검토하고\n필요에 따라 적응하는데 짧은 주기를 사용한다.\n② 일반적으로 반복적, 주문형 및 끌기식 일정계획\n으로 나타난다.\n③ 프로젝트 관리를 위해 예측개발 생애주기 적용,\n혹은 적응형 환경 여부에 따라 프로젝트 관리자의\n역할은 변경되어져야 한다.\n④ 적응형 방식으로 성공하려면 프로젝트 관리\n자가 사용하는 도구와 방법에 효과적으로 적\n용할 수 있어야 한다.",
  "2020_23": "23. 다음의 프로젝트에 대한 재무적 타당성 분석 방법\n중에서 현가법(present value)을 사용하지 않는\n것은?\n① 자본회수기간법(payback period)\n② 현금흐름할인법(discounted cash flow)\n③ 수익성지수법(profitability index)\n④ 내부수익률법(internal rate of return)",
  "2020_24": "24. 다음 PERT/CPM 기법의 AOA(Activity on Arrow)방식의\n네트워크 다이어그램에서 더미활동(dummy activity)의\n특징이 아닌 것은?\n① 자원(resource)이 소요되지 않는다.\n② 기간(duration)을 갖지 않는다.\n③ 활동의 선후관계를 나타낸다.\n④ 주공정 경로(critical path)에 포함되지 않는다.",
  "2020_25": "25. 다음의 프로젝트 계획단계에서 사용되는 도구 중\n에서 트리 다이어그램(tree diagram)의 형태를\n주로 사용하는 것은?\n① 고진토 차트(Gozinto chart)\n② 간트 차트(Gantt chart)\n③ PERT(program evaluation and review technique)\n④ 주 프로젝트 일정(master project schedule)\n- 5\n5 -\n\n=== NEW PAGE ===\n\n소프트웨어 공학",
  "2021_1": "1. PERT(Program Evaluation and Review Technique)\n분석에서 주공정 경로(critical path)의 분산이\n4.0이고 기대 소요시간이 20일이다. 프로젝트가\n계획된 기간 내에 완료될 확률이 95%가 되려면 프로\n젝트 기간을 얼마로 계획해야 하는가? (단, 표준\n정규분포에서 누적확률이 95%가 되는 z 값은 1.65로\n가정한다.)\n① 21.9 ② 23.3 ③ 23.8 ④",
  "2021_4": "4.0이고 기대 소요시간이 20일이다. 프로젝트가\n계획된 기간 내에 완료될 확률이 95%가 되려면 프로\n젝트 기간을 얼마로 계획해야 하는가? (단, 표준\n정규분포에서 누적확률이 95%가 되는 z 값은 1.65로\n가정한다.)\n① 21.9 ② 23.3 ③ 23.8 ④",
  "2021_21": "21.9 ② 23.3 ③ 23.8 ④",
  "2021_23": "23.3 ③ 23.8 ④",
  "2022_1": "1. 프로젝트관리에 관한 국제표준 ISO 21500에서 제\n시하는 10개의 주제 그룹에 속하지 않은 것은?\n① 통합 ② 조달\n③ 통제 ④ 의사소통",
  "2022_2": "2. 다음 중 프로젝트 범위관리를 구성하는 하위 프로\n세스의 산출물들을 생성 시기가 빠른 순으로 나열\n한 것으로 옳은 것은?\n① 요구사항문서 - 작업분류체계 사전 - 활동 목록\n- 변경 요청서\n② 요구사항문서 - 활동 목록 - 작업분류체계 사전\n- 변경 요청서\n③ 활동목록 - 작업분류체계 사전 - 요구사항문서\n– 변경 요청서\n④ 작업분류체계 사전 - 활동목록 - 요구사항문서\n– 변경 요청서",
  "2022_3": "3. 다음 중 데이터 이전 및 교육훈련과 관련된 요구\n사항을 포함하는 요구사항의 분류로 가장 적절한\n것은?\n① 전환 요구사항\n② 비즈니스 요구사항\n③ 비기능적 요구사항\n④ 이해관계자 요구사항",
  "2022_4": "4. 어떤 프로젝트가 특정 시점에서 획득가치 분석을\n적용한 결과 획득가치(EV) = 800, 계획가치(PV) =\n900, 실적원가(AV) = 700로 계산되었다. 이 프로\n젝트 성과에 대한 설명으로 가장 적절한 것은?\n① 일정 성과차이(SV)는 +100이다.\n② 원가 성과차이(CV)는 -100이다.\n③ 일정 성과지수(SPI)는 0보다 크다.\n④ 원가 성과지수(CPI)는 1보다 작다.\n- 2",
  "2022_5": "5. 품질 비용(cost of quality)에 관한 설명으로 가\n장 적절하지 않은 것은?\n① 적합(conformance) 비용에는 예방 비용과 평가\n비용이 있다.\n② 품질 교육 및 훈련, 생산공정계획 및 개선과 관\n련된 비용은 예방 비용이다.\n③ 품질 수준이 100% 양호가 될 때 적합 비용은 최\n대가 된다.\n④ 고객이 발견한 결함과 부적격을 처리하기 위한\n비용은 내적 실패(internal failure) 비용이다.",
  "2022_6": "6. 프로젝트 조직에 관한 다음 설명 중 옳은 것을 모\n두 고른 것은?\n가. 중간(균형) 매트릭스 조직(balanced matrix\norganization) 구조에서 프로젝트 관리자는 기능\n관리자 아래에 있어 예산 사용에 제약을 받는다.\n나. 강한 매트릭스 조직(strong matrix organization)\n은 전임 프로젝트 관리자와 프로젝트 행정업\n무를 전담하는 직원을 가질 수 있다.\n다. 약한 매트릭스 조직(weak matrix organization)\n구조에서는 직원들이 프로젝트업무를 조정하\n는 역할을 수행한다.\n라. 기능 조직(functional organization)은 기존\n프로젝트의 소규모 변경이나 중요하지 않은 소\n규모 프로젝트 수행에 적합한 구조이다.\n① 가, 나, 다 ② 가, 다, 라\n③ 나, 다, 라 ④ 가, 나, 다, 라",
  "2022_7": "7. 다음 중 다양한 규모의 투표와 같은 방법으로 신\n속히 결정을 내리면서도 모든 사람의 의견을 감안\n하고 싶을 때 사용할 수 있는 집단 창의성 기법으\n로 가장 적절한 것은?\n① 브레인스토밍(brainstorming)\n② 명목 집단 기법(nominal group technique)\n③ 친화도(affinity diagram)\n④ 요구사항 워크숍(requirement workshop)",
  "2022_8": "8. 100만원을 투자하여 2년 후에 121만원을 회수했다\n면 내부수익률(internal rate of return)은?\n① 0.1 ② 0.2\n③ 0.3 ④ 0.4\n2 -\n\n=== NEW PAGE ===",
  "2022_9": "9. 다음 프로젝트 계획 방법론 중에서 계층적 접근\n(hierarchical approach) 방식으로 옳은 것은?\n① CPM(critical path method)\n② 작업분류체계(work breakdown structure)\n③ 선형임무차트(linear responsibility chart)\n④ 마스트프로젝트일정(master project schedule)",
  "2022_10": "10. 다음의 갈등관리 기법 중에서 자기주장이 낮고\n상대방의 동조가 높을 때 사용하는 기법으로 가\n장 적절한 것은?\n① 강경(forcing)\n② 타협(compromising/reconcile)\n③ 회피(withdrawing/avoid)\n④ 유연(smoothing/accommodate)",
  "2022_11": "11. 다음 중 ‘정보시스템 감리기준(행정안전부 고시,\n2021)’에 따라 감리법인이 설계단계 감리에서\n점검해야 할 항목을 모두 고른 것은?\n가. 계약문서에서 정한 과업내용이 요구사항정의서\n에 적정하게 반영되어 있는지를 점검\n나. 설계 산출물이 과업내용을 적정하게 반영하고\n있는지의 여부\n다. 대비표가 세부 검사항목별로 적합·부적합 판\n정을 할 수 있도록 구체화 되었는지의 여부\n라. 세부 검사항목별 과업내용 이행여부를 점검\n① 가, 나 ② 나, 다\n③ 가, 나, 다 ④ 나, 다, 라",
  "2022_12": "12. 다음 중 ‘정보시스템 감리기준(행정안전부 고시,\n2021)’에 따라 상주감리원이 수행하여야 할 업\n무와 가장 거리가 먼 것은?\n① 산출물에 대한 품질 검토\n② 과업 범위(요구사항) 구체화 및 과업변경 영향·\n타당성 검토\n③ 의사결정 사항 지시·관리 및 이행상황 점검\n④ 사업수행계획서, 상세공정표(WBS, work breakdown\nstructure), 개발방법론의 공정·산출물 조정\n내역 검토\n- 3",
  "2022_13": "13. 다음 중 ‘전자정부법 시행령(대통령령, 2021)’\n에서 규정된 감리법인의 업무범위와 가장 거리가\n먼 것은?\n① 과업 이행 여부 점검\n② 전자정부사업관리와 관련된 보고 및 의사결정 지원\n③ 과업범위 및 요구사항의 설계 반영 및 구체화\n여부 검토ㆍ확인\n④ 사업수행계획의 계약내용 반영 여부, 일정 및\n산출물 작성계획의 적정성 여부 검토ㆍ확인",
  "2022_14": "14. ‘SW사업 대가산정 가이드(한국소프트웨어산업협\n회, 2021)’의 소프트웨어 사업 대가 산식 중\n옳지 않은 것은?\n① 투입공수 방식에 의한 정보전략계획(ISP) 및 업\n무재설계(BPR) 수립비 : 컨설팅 대가 = 직접인\n건비 + 제경비 + 기술료 + 직접경비\n② 상용소프트웨어 유지관리비 : 상용SW유지관리비\n= 최초 Licence 구매계약 금액 X 등급별 유지관\n리요율\n③ 기능점수 방식에 의한 소프트웨어 개발비 : SW개\n발비 = 개발원가 + 제경비 + 기술료 + 직접경비\n④ 소프트웨어 재개발비 : 재개발비 = 보정 후 재\n개발원가 + 직접경비 + 이윤",
  "2022_15": "15. 다음은 ‘정보시스템 감리수행 가이드(한국지능\n정보사회진흥원, 2021)’에서 제시한 종료단계\n감리 시점에 관한 설명이다. 빈칸에 가장 적절한\n것은?\n종료단계 감리 시점은 ( 가 ) 이후에 시작하고,\n시정조치 확인 기간이 ( 나 )에 종료될 수 있는\n시점이 적합하다.\n① (가) 통합시험 (나) 검사 이전\n② (가) 통합시험 (나) 검사 완료 이전\n③ (가) 시스템시험 (나) 검사 이전\n④ (가) 시스템시험 (나) 검사 완료 이전\n3 -\n\n=== NEW PAGE ===",
  "2022_16": "16. 다음 중 ‘정보시스템 감리기준(행정안전부고시\n, 2021)’에 따른 감리 대가 산정시 규정을 잘못\n적용한 것은?\n① 감리원 단가는 SW기술자 평균임금 중 IT감리와\nIT감사의 평균 금액을 적용한다.\n② 현장감리에 참여하는 특수분야 전문가 자문비는\n직접 경비에 반영할 수 있다.\n③ 점검활동이 수행되는 감리현장이 2개 이상일 경\n우 난이도가 높아져 감리비가 증가한다.\n④ FP 단가가 변동되면 감리대상 사업비 보정금액\n의 증감이 발생할 수 있다.",
  "2022_17": "17. 다음 중 정보시스템 개발 사업 중 감리법인이 직접\n수행해야 하는 업무에 해당하는 것은 몇 개 인가?\n가. 개인정보영향평가보고서 작성\n나. 기술적용결과표 작성\n다. 보안약점진단보고서 작성\n라. 종료단계 기능점수 산출내역서 작성\n마. 종료단계 감리 시정조치확인보고서 작성\n① 1개 ② 2개\n③ 3개 ④ 4개",
  "2022_18": "18. 다음 중 전자정부표준프레임워크을 적용하여 기존\n시스템을 고도화하는 사업의 SW개발비를 기능점수\n방식으로 산정하는 경우 ‘SW사업대가 산정가이드\n(한국소프트웨어산업협회, 2021)’ 및 관련 지침\n을 가장 잘못 적용한 것은?\n① 수정 후 재사용에는 기능변경과 기능삭제가 포\n함되나 비용산정에서는 기능변경 부분만을 대상\n으로 한다\n② 재사용 소프트웨어 평가 노력 수준, 재사용 소\n프트웨어 난이도 수준(3개 항목), 재사용 소프\n트웨어 친숙도 수준을 평가하여 조정한다.\n③ 데이터요소유형(DET) 및 참조파일유형(FTR)의\n변경률이 100%보다 크게 측정되는 확장 재사용\n사업에서는 재개발비가 아니라 신규 개발로 산\n정할 수 있다.\n④ 개발하고자 하는 기능 중 전자정부표준프레임워\n크에서 제공하는 공통컴포넌트로 대체 가능한\n경우 재개발 방식을 적용한다.\n- 4",
  "2022_19": "19. ‘소프트웨어프로세스 품질인증 운영에 관한 지침\n(과학기술정보통신부고시, 2021)’에서 정한 소\n프트웨어프로세스 품질인증 기준의 ‘영역’과\n‘평가항목’을 잘못 연결한 것은?\n① 소프트웨어 개발 계획수립, 통제 등 관리프로세\n스에 관한 사항 – 협력업체 관리\n② 소프트웨어 개발공정에서 필요한 분석, 설계 등\n개발 프로세스에 관한 사항 – 고객 요구사항 관리\n③ 소프트웨어 품질관리에 필요한 품질보증 등 지\n원프로세스에 관한 사항 - 형상관리\n④ 소프트웨어 프로세스의 유지 및 개선 등에 관한\n사항 – 구성원 교육",
  "2022_20": "20. ‘소프트웨어진흥법’과 ‘소프트웨어사업 계약\n및 관리감독에 관한 지침(과학기술정보통신부고\n시, 2021)’에서 적정 사업기간 산정을 설명한\n것 중 가장 적절한 것은?\n① 적정 사업기간 산정시 1년을 초과하여 산정할\n수 없다.\n② 5억원 이상의 사업의 경우 국가기관등의 장이\n적정 사업기간을 산정할 수 있다.\n③ 정보화전략계획수립(ISP) 사업의 경우에도 적정\n사업기간을 산정하여야 한다.\n④ 기능점수(FP)기반으로 적정 개발기간 산정시, 1\n인 생산성(FP/MM)은 사업규모(FP)에 따라 다르\n게 적용한다.",
  "2022_21": "21. ‘공공기관의 데이터베이스 표준화 지침(행정안\n전부고시, 2021)’에서 업무담당자가 감리법인\n에게 요구하여야 할 점검 사항에 해당되는 것은\n몇 개 인가?\n가. 범정부 및 기관의 데이터 표준 지침 적용 여부\n나. 공공데이터베이스 표준화 체계 정비ㆍ개선 및\n관리방안\n다. 공공데이터베이스 구조설계 및 검증, 관리방안\n라. 데이터 값 검증 방안\n마. 데이터 표준ㆍ구조ㆍ값ㆍ개방 관리체계\n바. 메타데이터 등록 및 현행화 방안\n① 3개 ② 4개\n③ 5개 ④ 6개\n4 -\n\n=== NEW PAGE ===",
  "2022_22": "22. ‘정보시스템 감리기준(행정안전부고시, 2021)’\n에 규정된 종료단계 감리에 대해 정의한 사항중\n일부이다. (가), (나), (다)에 가장 적절한 것\n으로 짝지어진 것은?\n제10조(종료단계 감리) ① 감리법인은 감리대상사\n업 검사 전까지 제9조제1항제2호에 따른 (가)\n별 과업내용 이행여부를 점검하고 그 결과를\n감리수행결과보고서에 적합·부적합으로 명시\n하여 발주자등에게 제출하여야 한다.\n② 제1항에 따른 점검을 위해 사업자는 최종 산\n출물이 (나)별로 과업내용을 반영하였는지 여\n부를 확인할 수 있도록 대비표를 작성하고 발\n주자 확인을 거쳐 감리법인에 종료단계 감리\n실시 전까지 제출하여야 한다.\n③ 사업자는 제1항의 점검결과에 따라 시정 조치\n를 수행하고 그 결과를 (다)에 제출하여야 한\n다.\n(가) (나) (다)\n① 요구사항 요구사항 발주자\n② 세부 검사항목 세부항목 감리법인\n③ 세부 검사항목 요구사항 발주자\n④ 요구사항 세부항목 감리법인",
  "2022_23": "23. 전자정부법 시행령(대통령령, 2021)에 규정하고 있\n는 감리 절차의 순서를 가장 바르게 나열한 것은?\n가. 감리 착수회의 실시\n나. 예비조사 실시 및 감리계획 수립\n다. 감리보고서 통보\n라. 감리 종료회의 실시\n① 가 - 나 - 다 - 라\n② 나 - 가 - 다 - 라\n③ 나 - 가 - 라 - 다\n④ 가 - 나 - 라 - 다\n- 5",
  "2022_24": "24. ‘SW사업 대가산정 가이드(한국소프트웨어산업협회,\n2021)’의 소프트웨어 유지관리 유형과 세부 업\n무를 연결한 것으로 가장 적절한 것은?\n① 완전유지관리 - 성능향상을 위한 소프트웨어 개선\n② 적응유지관리 - 대외기관 연계를 위한 소프트웨어\n개선\n③ 수리유지관리 - 시스템 이관에 따른 데이터 전환\n및 수정\n④ 예방유지관리 - 기능사양과 설계내용이 일치되지\n않을 경우 소프트웨어 작성 오류 수정",
  "2022_25": "25. ‘정보시스템 감리기준(행정안전부 고시, 2021)’\n에 관한 설명으로 옳은 것은?\n가. 상주감리를 추가로 하는 경우 총괄감리원이 요\n구사항정의서의 과업내용 반영여부 등을 직접\n점검하여야 한다.\n나. 감리대상사업비는 지식정보자원, 행정정보 등\n데이터베이스 구축비 등을 모두 합산하여 계\n산한다.\n다. 감리대상사업의 사업비가 20억원 미만이거나\n사업기간이 6개월 미만인 경우 2단계감리를\n하게 할 수 있다.\n라. 전체 감리인력의 30퍼센트 범위 내에서 인공지\n능, 빅데이터, 모바일, 정보보호, 법률 및 회계\n등 다른 분야의 전문가를 배치할 수 있다.\n① 가, 나 ② 나, 다\n③ 다, 라 ④ 가, 다\n5 -\n\n=== NEW PAGE ===\n\n소프트웨어 공학",
  "2023_1": "1. 프로젝트 성과 측정에 사용되는 획득가치관리(earned\nvalue management)를 위해서는 적절한 진척\n(progress) 정보가 필요하다. 어느 프로젝트에서는\n하나의 작업활동이 시작되면 진척률을 20퍼센트로 인\n정한다. 그 이후 작업활동의 진척이 계속 증가하더라\n도 진척률을 계속 20퍼센트로 인정하다가, 그 작업활\n동이 완료될 때 나머지 80퍼센트를 인정하여 최종적\n으로 100퍼센트 진척으로 인정해 준다. 다음 중 이러\n한 방법으로 가장 적절한 것은 어느 것인가?\n① 고정비율법(fixed formula)\n② 가중 마일스톤 기법(weighted milestone)\n③ 시작-종료 측정(start-finish measurement)\n④ 달성률(percentage completion)",
  "2023_2": "2. 프로젝트 생애주기를 애자일 생애주기(agile life\ncycle), 예측형 생애주기(predictive life cycle), 점\n증적 생애주기(incremental life cycle), 반복적 생애\n주기(iterative life cycle)로 구분하였을 때 다음\n중 반복적 생애주기의 개념으로 가장 적합한 것은?\n① 사전에 방대한 양의 계획을 수립한 다음, 한 번\n의 순차적 프로세스를 통해 프로젝트를 실행하\n는 전통적인 접근방식\n② 미완성 작업에 대한 피드백을 수용하여 작업 결\n과를 개선하고 수정하는 접근방식\n③ 고객이 즉시 사용할 수 있는 완성된 인도물을\n제공하는 접근방식\n④ 작업 항목을 파악한 후에 점진적 방법을 취하는\n접근방식",
  "2023_3": "3. 프로젝트 일정관리 기법 중에 하나인 GERT(Graphical\nEvaluation and Review Technique)에 관한 설명으로\n가장 거리가 먼 것은?\n① 작업시간의 분포는 항상 베타분포를 가정한다.\n② 마디(node)에서 갈라져 나오는 화살표는 확률적\n으로 발생한다.\n③ 마디(node)의 이벤트는 항상 확정적으로 발생하\n는 것은 아니다.\n④ 네트워크에서 루프가 허용되어 마디(node)의 이벤트\n나 작업이 루프에 의해 반복적으로 발생할 수 있다.\n- 2",
  "2023_4": "4. 작업분류체계(WBS)의 작업패키지(work package)에\n관한 설명으로 가장 거리가 먼 것은?\n① 최하위 업무이며 실제로 수행된다.\n② 작업패키지의 크기가 클수록 진척관리가 쉬워진다.\n③ 작업패키지의 크기는 보고주기보다 짧게 정하는\n것이 권장된다.\n④ 작업패키지의 크기는 8시간~80시간의 공수가 소\n요되도록 정하는 것이 바람직하다.",
  "2023_5": "5. 프로젝트 기획에서는 인도(delivery)를 위한 프로젝\n트 범위를 상위 수준에서 하위 수준으로 점차 분할\n하여 정의할 수 있다. 다음 중 분할과정에서 사용되\n는 개념과 가장 거리가 먼 것은?\n① 가치흐름 맵(value flow map)\n② 테마(theme) 혹은 에픽(epic)\n③ 사용자 스토리(user story)\n④ 작업분류체계(WBS)",
  "2023_6": "6. 획득가치분석에서 EV(Earned Value) = 110,\nPV(Planned Value) = 90, AC(Actual Cost) = 100\n일 때 다음 설명 중 적절하지 않은 것은?\n① CV(Cost Variance) = 10\n② SV(Schedule Variance) = 20\n③ SPI(Schedule Performance Index) = 0.9\n④ CPI(Cost Performance Index) = 1.1",
  "2023_7": "7. 다음 중 중요한 작업의 속도를 높이기 위해 작업\n을 병렬로 수행하는 일정 단축 기술은 무엇인가?\n① 공정압축(crashing)\n② 공정중첩단축(fast tracking)\n③ 자원평준화(resource leveling)\n④ 몬테카를로(Monte Carlo)",
  "2023_8": "8. 다음 중 PMI의 PMBOK 7판에서 정의하고 있는 8개\n프로젝트 성과영역으로 가장 적절하지 않은 것은?\n① 팀(team) ② 가치(value)\n③ 불확실성(uncertainty) ④ 인도(delivery)\n2 -\n\n=== NEW PAGE ===",
  "2023_9": "9. 터크만(Tuckman)의 팀 발달 5단계 중 규범기\n(norming)에 관한 설명으로 가장 거리가 먼 것은?\n① 업무효율성이 개선되고 생산성도 증가한다.\n② 갈등이 줄어 팀으로서의 일체감이 형성되기 시\n작한다.\n③ 팀 구성원들이 예산이나 일정의 제약조건 등 현\n실을 인식하고 받아들인다.\n④ 프로젝트 매니저는 팀원들의 책임과 역할을 분\n명히 해주는 역할을 수행해야 한다.",
  "2023_10": "10. 다음 중 조직의 팀 유형 중에서 교차기능팀\n(cross-functional team)에 대한 설명으로 가장\n적절하지 않은 것은?\n① 프로젝트 팀이나 문제해결을 위한 태스크포스팀(task\nforce team)이 교차기능팀의 대표적인 예이다.\n② 조직의 업무 절차의 효율성이나 비용 절감보다는 목\n표 달성이나 질적 향상과 같은 가치를 중요시 한다.\n③ 조직의 공동 문제나 과업 해결을 위해 조직 전체\n에 걸쳐 여러 전문 분야의 사람들로 구성된 한시\n적 팀이다.\n④ 새로운 사업이나 제품 개발 혹은 도입에 필요한\n아이디어와 대안 찾기와 같은 비일상성 혹은 비\n정형성이 높다.",
  "2023_11": "11. 대인관계 기술(interpersonal skill) 중에서 감성\n지능(emotional intelligence)은 자신의 감정과\n다른 사람의 감정을 인식하는 능력이다. 감성지\n능을 정의하고 설명하기 위해서는 4가지 주요 영\n역에 초점을 맞추는데, 다음 중 그 영역으로 가\n장 적절하지 않은 것은?\n① 자기 판단(self-judgement)\n② 자기 관리(self-management)\n③ 사회적 기술(social skill)\n④ 사회적 인식(social awareness)",
  "2023_12": "12. 다니엘 핀크(Daniel Pink)는 사람들에게 동기를\n부여하는 내재적 요인을 주장하였다. 다음 중 그\n가 주장한 세 가지 내재적 동기부여 요인에 가장\n적절하지 않은 것은?\n① 목적(purpose) ② 숙련도(mastery)\n③ 자율성(autonomy) ④ 성취(achievement)\n- 3",
  "2023_13": "13. 다음 중 「정보시스템 감리수행 가이드(2022.2)」\n에서 제시한 기술적용결과표 준수여부를 점검하는\n감리단계로 가장 적절한 것은?\n① 요구정의단계 감리\n② 설계단계 감리\n③ 종료단계 감리\n④ 상주감리",
  "2023_14": "14. 「정보시스템 감리기준(2021.1)」에 따른 감리업무\n절차에 관한 설명으로 가장 적절하지 않은 것은?\n① 발주자는 감리계약을 체결하고자 하는 경우 \"협\n상에 의한 계약체결 방법\"을 우선적으로 적용할\n수 있다.\n② 감리법인은 단계별 감리수행 전에 감리계획서를\n발주자와 사업자 등에게 제출하여야 한다.\n③ 설계단계 감리 시 사업자는 설계 산출물이 세부\n항목별로 과업내용을 반영하였는지 여부를 확인\n할 수 있도록 대비표를 작성하고 감리법인 확인\n을 거쳐 발주자에 설계단계 감리 실시 전까지\n제출하여야 한다.\n④ 종료단계 감리 시 감리법인은 감리대상사업 검\n사 전까지 세부 검사항목별 과업내용 이행여부\n를 점검하고 그 결과를 감리수행결과보고서에\n적합·부적합으로 명시하여 발주자 등에게 제출\n하여야 한다.",
  "2023_15": "15. 「소프트웨어 진흥법(2021.12)」 및 관련 법령에\n따른 ‘적정 사업기간 산정’에 대한 설명 중 가\n장 적절한 것은?\n① 적정 사업기간 산정 대상 사업에는 소프트웨어\n유지관리 사업도 포함된다.\n② 사업금액이 3억원 이하인 사업의 경우에는 국가기\n관 등의 장이 적정 사업기간을 산정할 수 있다.\n③ 사업규모가 1,200 FP인 경우 1인 생산성(FP/MM)\n은 19를 적용한다.\n④ 산정한 적정 사업기간이 1년을 초과하는 경우에는\n「국가를 당사자로 하는 계약에 관한 법률」 제21\n조제2항에 따른 장기계속계약을 체결하여야 한다.\n3 -\n\n=== NEW PAGE ===",
  "2023_16": "16. 「SW사업 대가산정 가이드(2022)」의 대가산정 유\n형별 대가산정 방법으로 가장 적절하지 않은 것\n은?\n대가산정 유형 대가산정 방법\n정보화전략계획(ISP) 컨설팅업무량에 의한\n①\n수립 방식\n기능점수 방식에 의한\n② 소프트웨어 개발\n방법\n요율제 방식에 의한\n③ SW 유지관리 사업\n유지관리비\n소프트웨어 재개발\n④ 투입공수에 의한 방식\n사업",
  "2023_17": "17. 다음 중「소프트웨어 진흥법 시행령(2023.1)」과\n「소프트웨어사업 계약 및 관리감독에 관한 지침\n(2020.12)」에 따라 소프트웨어 영향평가 제외\n사업을 모두 고르면?\n가. 민간투자형 소프트웨어사업\n나. 단일기관 내부사용 목적의 소프트웨어 사업\n다. 데이터베이스 구축 사업\n① 가, 나 ② 가, 다\n③ 나, 다 ④ 가, 나, 다",
  "2023_18": "18. 「전자정부법(2022.7)」 및 「동법 시행령(2022.8)」\n을 기준으로 다음 사례에 대한 설명 중 가장 적절\n하지 않은 것은?\nA지방자치단체는 지방공기업법에 따라 설립한\nB지방공사, C지방공단과 공동으로 사용하기 위\n해 사업비 5억원을 들여 민원업무 처리를 위해\nD정보시스템을 구축하고자 한다.\n① D정보시스템은 ‘여러 중앙행정기관등이 공동으로\n구축하거나 사용하는 경우’에 해당되지 않는다.\n② 사업비에 하드웨어, 소프트웨어의 단순 구입비\n용이 포함되지 않은 경우, ‘정보시스템 구축사\n업으로서 사업비가 5억원 이상인 경우’에 해당\n된다.\n③ 사업비에 하드웨어 도입비 4.5억원이 포함된 경\n우, 감리의 비용 대비 효과가 낮다고 A지방자치\n단체의 장이 인정하는 경우 정보시스템 감리를\n받지 않을 수 있다.\n④ D정보시스템 구축 사업기간이 6개월 이상이라면\n전자정부사업관리를 위탁한 경우에도 사업비가\n5억원 이상이므로 감리대상에 해당한다.\n- 4",
  "2023_19": "19. 다음 중 감리법인의 위반 행위에 대하여 「전자\n정부법 시행령(2022.8)」에 근거한 1차 행정처분\n으로 가장 가벼운 행정처분은?\n① 법 제59조제2항을 위반하여 거짓으로 감리보고\n서를 작성한 경우\n② 법 제58조제2항에 따른 변경 사항을 거짓으로\n변경신고를 한 경우\n③ 법 제59조제3항을 위반하여 다른 사람에게 자기\n의 명칭을 사용하게 하여 정보시스템 감리를 하\n게 한 경우\n④ 법 제59조제1항을 위반하여 감리원이 아닌 사람\n에게 감리업무를 수행하게 한 경우",
  "2023_20": "20. 「정보시스템 감리기준(2021.1)」에 관한 설명으\n로 가장 거리가 먼 것은?\n① 상주감리원은 단계별 감리의 감리원으로 참여할\n수 있다.\n② 감리대상사업의 사업비가 10억원이면 2단계 감\n리를 하게 할 수 있다.\n③ 대기업인 소프트웨어사업자의 참여가 제한되는\n경우에는 상주감리를 추가로 할 수 있다.\n④ 전체 감리인력의 30퍼센트 범위 내에서 인공지\n능, 빅데이터, 모바일, 정보보호, 법률 및 회계\n등 다른 분야의 전문가를 배치할 수 있다.",
  "2023_21": "21. 「ISP․ISMP 수립 공통가이드, 제6판(2022)」의 내\n용으로 가장 적합하지 않은 것은?\n① 기관 중장기 정보화 계획에 근거하여 개별 시스\n템에 대한 구축 예산을 요구하는 것은 불가하다.\n② 법률 개정에 따라 차년도에 시스템을 구축해야\n하는 사업으로, ISP의 기본구성 내용을 모두 포\n함한 산출물을 작성한 경우 ISP 사업 종료 이전\n에 중간산출물 검토가 가능하다.\n③ ISP․ISMP 검토 분야는 사업 타당성, 실현 가능\n성, 규모 적정성, 경제적 효율성 등 4개 분야\n로 구성되어 있다\n④ 자체인력으로 수립한 ISP는 검토 신청이 불가능하다.\n4 -\n\n=== NEW PAGE ===",
  "2023_22": "22. 「공공데이터 관리지침(2021.10)」에서 정한 기본\n원칙과 가장 거리가 먼 것은?\n① 공공기관은 보편적 이용권 확대를 위해 필요한\n조치를 취해야 한다.\n② 공공기관은 공공데이터의 영리적 이용을 제한하\n여야 한다.\n③ 공공기관은 공공데이터를 원천데이터로 제공하\n도록 노력하여야 한다.\n④ 공공기관은 공공데이터를 오픈포맷으로 제공해\n야 한다.",
  "2023_23": "23. 「소프트웨어사업 계약 및 관리감독에 관한 지침\n(2020.12)」에 관한 설명으로 가장 거리가 먼 것은?\n① 사업금액이 1억원 이하인 사업의 경우에는 국가기\n관등의 장이 적정 사업기간을 산정할 수 있다.\n② 동일한 상용소프트웨어의 다량 구매로 총금액이\n5천만원을 초과하더라도 소프트웨어 1개의 가격\n이 5천만원 미만인 경우에는 5천만원 미만인 소\n프트웨어로 간주한다.\n③ 민간투자형 소프트웨어사업에서 구매하는 상용\n소프트웨어는 직접 구매 대상 상용소프트웨어\n에서 제외할 수 있다.\n④ 하도급계약 승인 신청에 대하여 국가기관의 장\n이 10일 이내에 승인 여부를 통지하지 않거나\n통지기간의 연장을 통지하지 않은 경우에는 하\n도급을 승인한 것으로 본다.",
  "2023_24": "24. 「소프트웨어 진흥법(2021.12)」 및 관련 법령에\n따른 ‘소프트웨어사업 영향평가’에 대한 설명\n으로 가장 적절하지 않은 것은?\n① 국가기관 등의 장은 소프트웨어사업을 발주하려\n는 경우, 입찰공고를 하기 전에 소프트웨어사업\n영향평가를 하여야 한다.\n② 국가기관 등의 장은 상용소프트웨어의 구매 사업\n은 소프트웨어사업 영향평가 대상에서 제외한다.\n③ 국가기관 등의 장은 소프트웨어사업 영향평가를\n실시하는 경우 민간소프트웨어 시장 침해 가능\n성을 검토해야 한다.\n④ 국가기관 등의 장은 소프트웨어사업 영향평가를\n실시한 경우 그 결과서를 행정안전부 장관에게\n제출해야 한다.\n- 5",
  "2023_25": "25. 「행정기관 및 공공기관 정보시스템 구축·운영\n지침(2022.4)」에 관한 설명으로 가장 거리가 먼\n것은?\n① 행정기관 등의 장은 전자적 대민서비스를 구축\n할 때, 사용자가 별도의 소프트웨어 설치 없이\n웹 브라우저만으로 서비스를 이용할 수 있도록\n웹 표준기술을 사용하여 구축하여야 한다.\n② 행정기관 등의 장은 전자적으로 처리할 수 있는\n개인정보파일 및 개인정보처리시스템을 신규 구\n축·운용 또는 변경하려고 하는 경우, 개인정보\n영향평가를 정보시스템 분석완료 전에 수행하여\n야 한다.\n③ 하드웨어 및 소프트웨어 구입비를 산출할 때, 조\n달품목이 아니고 최근 도입가격 또는 유사한 거\n래 실례가격도 없는 경우 3개 이상의 공급업체로\n부터 직접 받은 견적가격을 기준으로 적정가격을\n산출한다.\n④ 총사업비관리대상 사업 중 정보화사업의 총사업\n비는 예비타당성조사, ISMP, 구축단계(분석, 설\n계, 개발) 중 분석, 설계 단계가 완료될 때마다\n기획재정부와 변경여부를 협의하여야 한다.\n5 -\n\n=== NEW PAGE ===\n\n소프트웨어 공학",
  "2024_1": "1. 소프트웨어 개발사업의 적정 사업기간 산정 기준에\n따라 다음 조건의 사업에 대하여 산정한 적정 사업\n기간은?\n·기능점수 : 1,320 FP\n·1인 생산성 : 22 FP/MM\n·적정 개발인력 수 : 6명\n① 6개월 ② 8개월\n③ 10개월 ④ 12개월",
  "2024_2": "2. 「SW사업 대가산정 가이드」(한국소프트웨어산업협회,\n2023년 개정판)에 따른 계약금액 조정 방식으로 가장\n적절한 것은?\n① 대가산정 방식(기능점수, 투입공수 등), 보정계수,\n제경비/기술료, 이윤, 할인율 등의 제비율은 변경\n요청 시점의 기준을 적용\n② 대가산정 방식(기능점수, 투입공수 등), 보정계수,\n제경비/기술료, 이윤, 할인율 등의 제비율은 당초\n계약 시의 기준을 동일하게 적용\n③ 대가산정 방식(기능점수, 투입공수 등)은 변경요청\n시점의 기준을 적용하고, 보정계수, 제경비/기술료,\n이윤, 할인율 등의 제비율은 당초 계약 시의\n기준을 동일하게 적용\n④ 대가산정 방식(기능점수, 투입공수 등)은 당초 계약\n시의 기준을 동일하게 적용하고, 보정계수, 제경\n비/기술료, 이윤, 할인율 등의 제비율은 변경요청\n시점의 기준을 적용",
  "2024_3": "3. 「공공기관의 데이터베이스 표준화 지침」에 따라\n데이터베이스 표준 수립 및 적용을 점검하는 경우\n가장 적절하지 않은 것은?\n① 운영 중인 DB의 비표준 데이터는 재구축 이전에\n공통 표준을 적용해야 한다.\n② 기관표준용어 정의 시 공통표준용어를 우선적으로\n적용하여야 한다.\n③ 정보화사업 감리시 감리법인에게 공공데이터\n베이스 표준화 업무를 점검하게 요구하여야 한다.\n④ 공공데이터베이스의 표준화 수준을 매년 1회\n이상 정기적으로 점검한다.\n- 2",
  "2024_4": "4. 「인공지능 학습용 데이터 품질관리 가이드라인 및\n구축안내서 v3.0」에 제시된 품질관리 활동 중 가장\n나중에 수행되는 것은?\n① 품질 목표 및 점검 기준 수립\n② 수집 도구 및 저장 환경 검토\n③ 라벨링 방법 및 기준 현행화\n④ 개인정보/민감정보 비식별화 등 법적 준거 확보",
  "2024_5": "5. 「용역계약일반조건」(기획재정부 계약예규 제582호)에\n관한 설명으로 가장 적절하지 않은 것은?\n① 공유자 일방이 계약목적물에 대한 지식재산권\n지분을 제3자에게 양도하는 경우에는 반드시\n타공유자의 동의를 받아야 한다.\n② 계약서에 반영되어 있지 않더라도 공공복리를\n위해 필요한 경우 발주기관은 개발된 소프트\n웨어를 타기관과 공동으로 활용할 수 있다.\n③ 핵심 개발인력이 아닌 지원인력의 근무장소는\n보안 등 특별한 사유가 있는 경우를 제외하고는\n계약상대자가 달리 정할 수 있다.\n④ 과업내용 변경에 따른 계약금액의 조정액이 당초\n계약금액의 100분의 10 이상으로 추정될 경우에는\n과업변경심의위원회를 설치하여 과업변경 심의를\n하여야 한다.",
  "2024_6": "6. 「CBD SW개발 표준 산출물 관리 가이드」(한국지능\n정보사회진흥원, (구)한국정보화진흥원)에서 제시한\n단계별 산출물로 가장 적절하지 않은 것은?\n① 분석단계: 유스케이스 명세서\n② 설계단계: 단위시험 케이스\n③ 구현단계: 데이터베이스 테이블\n④ 시험단계: 통합시험 시나리오",
  "2024_7": "7. 감리법인의 위법 행위에 대하여 「전자정부법」에 따른\n행정처분 수위가 가장 높은 것은?\n가. 감리법인 등록 조건인 감리원 5명 중 1명이\n퇴사하였으나 기간 내 미신고\n나. 감리계획서에 제출한 감리원 1명을 다른 전문\n가로 대신 참여시켜 감리 수행\n다. 감리기준에서 요구한 종료단계 시정조치 확인\n미수행\n① 가 ② 나\n③ 다 ④ 모두 동일\n2 -\n\n=== NEW PAGE ===",
  "2024_8": "8. 「정보시스템 감리기준」(행정안전부 고시) [별표 1]의\n감리대가 산정 기준에서 보정 전 기본감리비에\n영향을 주는 항목이 아닌 것은?\n① FP 단가\n② 난이도계수 합\n③ IT감리 평균임금\n④ 감리대상사업비 보정금액",
  "2024_9": "9. 「정보시스템 감리 수행가이드」(한국지능정보사회\n진흥원)에서 제시한 과업이행여부 점검결과, 부적합\n판정 평가 기준으로 가장 적절하지 않은 것은?\n① 원인이 규명되지 않은 결함\n② 다른 기능 수행에 영향을 미치는 결함\n③ 중요 과업 요건이 구현되지 않은 경우\n④ 선행 기능의 결함으로 점검하지 못한 경우",
  "2024_10": "10. 「정보시스템 감리 수행가이드」(한국지능정보사회\n진흥원)에서 제시한 객체지향/컴포넌트기반 개발\n모델의 응용시스템 감리영역(요구분석 감리시점)에\n대한 점검항목으로 가장 적절하지 않은 것은?\n① 사용자 요구사항 도출 및 분석의 충분성, 적정성\n② 개념수준의 분석 클래스를 충분히 도출하였는지 여부\n③ 프로세스, 이벤트 모델링 및 기능 도출의 충분성,\n적정성\n④ 시스템 기능에 대한 유스케이스 모형 상세화 수준\n및 적정성",
  "2024_11": "11. 「지능정보기술 감리 실무 가이드」(한국지능정보\n사회진흥원)의 정보시스템 운영단계 점검항목으로\n가장 적절한 것은?\n① 사용자지원 활동을 위한 절차 및 계획을 수립하여\n수행하고 있는가?\n② 개발 소프트웨어 장애관리 활동 절차 및 계획을\n수립하여 이행하고 있는가?\n③ 응용 서비스 모니터링 활동을 위한 절차 및\n계획을 수립하여 수행하고 있는가?\n④ 개발 소프트웨어 성능관리 활동을 위한 절차 및\n계획을 수립하여 수행하고 있는가?\n- 3",
  "2024_12": "12. 설계단계 감리수행결과보고서에 지적한 개선권고\n사항에 대하여 개선유형 및 개선시점을 가장 적정\n하게 판정한 것은?\nDB 테이블정의서에 일부 데이터 컬럼 누락이 발견되어\n프로그램 개발 단계 착수 이전에 반드시 수정하여야 함\n① 필수, 단기\n② 협의, 단기\n③ 권고, 장기\n④ 필수, 장기",
  "2024_13": "13. 「정보시스템 감리기준」(행정안전부 고시) [별표 2]\n감리제안서 기술평가 기준의 평가항목으로 가장\n적절하지 않은 것은?\n① 점검내용 ② 감리인력 구성\n③ 감리일정 및 절차 ④ 감리법인의 실적",
  "2024_14": "14. 「정보시스템 감리원 윤리 가이드」(한국지능정보\n사회진흥원, (구)한국정보화진흥원)에서 제시한\n감리원 윤리 준수 요소로 가장 적절하지 않은 것은?\n① 객관성과 공정성 유지 ② 공익의 달성\n③ 성실성과 책임감 유지 ④ 전문성 유지",
  "2024_15": "15. 「SW 사업자를 위한 정보시스템 감리준비 가이드」(한국\n지능정보사회진흥원)에 따라 SW 사업자가 감리 대응을\n위하여 작성하는 문서를 모두 고르면 몇 개인가?\n가. 과업대비표\n나. 검사기준서\n다. 감리시정조치결과서\n라. 감리시정조치확인보고서\n① 1개 ② 2개\n③ 3개 ④ 4개",
  "2024_16": "16. 정보시스템 감리 사업에 대하여 적용되는 제도로\n올바른 것을 모두 고르시오.\n가. 감리 사업에 대한 과업 심의는 간소화 방식을 적용\n나. 감리 사업은 금액에 관계없이 사전협의 대상에서\n제외\n다. 감리 사업은 투입인력 관리 금지 대상에서 예외\n① 가, 나 ② 나, 다\n③ 가, 다 ④ 가, 나, 다\n3 -\n\n=== NEW PAGE ===",
  "2024_17": "17. 「총사업비 관리지침」(기획재정부훈령 제668호,\n2023. 9. 20)에 관한 설명으로 가장 적절하지 않은\n것은?\n① 중앙관서의 장은 예비타당성조사 후 시스템 구축\n이전에 ISMP를 수립해야 하며, ISMP 수립이 완\n료되면 기획재정부장관과 사업규모, 총사업비,\n사업기간 등을 협의해야 한다.\n② 중앙관서의 장은 구축 단계에서 분석 및 설계가\n완료되면 각 단계별로 계약 체결 이전에 기획재\n정부장관과 사업규모, 총사업비, 사업기간 등을\n협의해야 한다.\n③ 정보화사업에 대한 총사업비의 조정은 ISMP에서\n수립된 구축비, 보상비, 부대경비, 시스템 구축\n후 10년 간 운영‧유지관리비, 추가 구축비를 대상\n으로 한다.\n④ 추가구축비는 시스템 구축 완료 후 기능의 변경\n‧추가‧보완, 소프트웨어 및 하드웨어 증설 등\n시스템의 개선 및 고도화에 소요되는 비용을\n포함한다.",
  "2024_18": "18. 일정 활동에 대한 기간 추정치를 산정하는 경우\n다음 도구 또는 기법 중 가장 적절하지 않은 것은?\n① 전문가 판단 ② 상향식 산정법\n③ 3점 산정 ④ 비용편익 분석",
  "2024_19": "",
  "2024_20": "20)에 관한 설명으로 가장 적절하지 않은\n것은?\n① 중앙관서의 장은 예비타당성조사 후 시스템 구축\n이전에 ISMP를 수립해야 하며, ISMP 수립이 완\n료되면 기획재정부장관과 사업규모, 총사업비,\n사업기간 등을 협의해야 한다.\n② 중앙관서의 장은 구축 단계에서 분석 및 설계가\n완료되면 각 단계별로 계약 체결 이전에 기획재\n정부장관과 사업규모, 총사업비, 사업기간 등을\n협의해야 한다.\n③ 정보화사업에 대한 총사업비의 조정은 ISMP에서\n수립된 구축비, 보상비, 부대경비, 시스템 구축\n후 10년 간 운영‧유지관리비, 추가 구축비를 대상\n으로 한다.\n④ 추가구축비는 시스템 구축 완료 후 기능의 변경\n‧추가‧보완, 소프트웨어 및 하드웨어 증설 등\n시스템의 개선 및 고도화에 소요되는 비용을\n포함한다.\n18. 일정 활동에 대한 기간 추정치를 산정하는 경우\n다음 도구 또는 기법 중 가장 적절하지 않은 것은?\n① 전문가 판단 ② 상향식 산정법\n③ 3점 산정 ④ 비용편익 분석\n19. 프로젝트관리자는 프로젝트 의사소통의 복잡성에\n대한 지침으로서, 가능한 의사소통 채널 또는\n경로의 수를 고려해야 한다. 어떤 프로젝트에서\n이해관계자의 수가 10명일 경우에 가능한 의사소통\n채널의 총 수는 몇 개인가?\n① 10개 ② 45개\n③ 50개 ④ 90개\n20. 상황론적 리더십 이론에서 구성원의 성숙도가 낮음\n에서 높음으로 변화함에 따라 적절한 리더십 유형을\n순서대로 가장 적절하게 나열한 것은?\n① 지시형 → 설득형 → 참여형 → 위임형\n② 지시형 → 설득형 → 위임형 → 참여형\n③ 지시형 → 참여형 → 설득형 → 위임형\n④ 지시형 → 참여형 → 위임형 → 설득형\n- 4",
  "2024_21": "21. 인도 측정(delivery measurements)은 작업 진척과\n관련이 있으며, 이러한 측정은 적응형 접근 방식을\n사용하는 프로젝트에서 자주 사용된다. 다음 중 인도\n측정 항목으로 가장 적절하지 않은 것은?\n① 주기 시간(cycle time)\n② 대기열 크기(queue size)\n③ 배치 크기(batch size)\n④ 프로세스 크기(process size)",
  "2024_22": "22. 다음 중 정량적 리스크 분석을 위한 데이터 분석\n기법으로 가장 적절하지 않은 것은?\n① 데이터 품질 평가 ② 시뮬레이션\n③ 민감도 분석 ④ 영향관계도",
  "2024_23": "23. 위협에 대한 대응 전략과 기회에 대한 대응 전략을\n순서대로 나열한 것은?\n① 공유(share) － 증대(enhance)\n② 수용(accept) － 전가(transfer)\n③ 공유(share) － 수용(accept)\n④ 수용(accept) － 수용(accept)",
  "2024_24": "24. 프로젝트 계획을 세울 때 단기적으로 범위의 매우\n구체적인 측면을 알고 있지만 장기적인 세부 사항은\n아직 명확하지 않은 경우가 많다. 이때 고려해야 할\n방법으로 가장 적절한 것은?\n① 연동 기획 ② 요구사항 수집\n③ 대안 분석 ④ 대체 분석",
  "2024_25": "25. 목표에 의한 관리(MBO)의 주요 특성이 아닌 것은?\n① 다면평가\n② 의사결정의 참가\n③ 실적에 대한 피드백\n④ 목표달성 기간 명시\n4 -\n\n=== NEW PAGE ===\n\n소프트웨어 공학",
  "2026_1": "1. 다음 중 「SW사업자를 위한 정보시스템감리 준비\n및 대응 가이드(한국지능정보사회진흥원, 2023.",
  "2026_2": "2.)」에\n서 정한 요구정의단계 감리의 점검대상 산출물로\n가장 적절하지 않은 것은?\n① 검사기준서 ② 기술협상서\n③ 과업대비표 ④ 사업수행계획서\n2. 다음 중 「정보시스템 감리 수행가이드(한국지능정보\n사회진흥원)」에서 정한 기술적용결과표 준수 여부를\n점검하는 감리단계로 가장 적절한 것은?\n① 요구정의단계 ② 설계단계\n③ 시험단계 ④ 종료단계",
  "2026_3": "3. 「정보시스템 감리 수행가이드(한국지능정보사회진\n흥원)」에서 정한 ‘부적합’판정에 해당하는 평가\n기준은 모두 몇 개인가?\n1. 시스템 동작 중단 결함\n2. 원인이 규명되지 않은 결함\n3. 중요 과업 요건이 구현되지 않은 경우",
  "2026_4": "4. 다른 기능 수행에 영향을 미치는 결함",
  "2026_5": "5. 검사기준서의 요건을 충족하지 못한 결함",
  "2026_6": "6. 감리 기간 내 보완되지 않은 기타 결함\n① 3개 ② 4개\n③ 5개 ④ 6개\n4. 다음 중 「공공기관의 데이터베이스 표준화 지침\n(행정안전부 고시)」에 따라 정보시스템 감리 시\n점검하여야 할 공공데이터베이스 표준화 업무로\n가장 적절하지 않은 것은?\n① 데이터 값 검증 방안\n② 공통표준용어의 제ㆍ개정 관리 방안\n③ 메타데이터 등록 및 현행화 방안\n④ 공공데이터베이스 표준화 체계 정비ㆍ개선 및\n관리방안\n- 2\n5. 다음 중「정보시스템 감리기준(행정안전부 고시)」\n[별표 2] 감리제안서 기술평가 기준의 평가항목으로\n가장 적절하지 않은 것은?\n① 점검내용 ② 점검방법\n③ 총괄감리원 ④ 감리법인의 감리실적\n6. 다음 중 「정보시스템 감리기준(행정안전부 고시)」에\n제시된 감리 실시 시기 및 인력 배치에 대한 내용\n으로 가장 적절하지 않은 것은?\n① 2단계 감리를 하는 경우, 발주자가 요구사항\n정의서의 과업내용 반영여부 등을 직접 점검\n하여야 한다.\n② 상주감리를 추가로 하는 경우, 요구정의단계\n감리는 생략하고, 상주감리원은 요구사항정의서의\n과업내용 반영여부 등을 직접 점검하여야 한다.\n③ 전체 감리인력의 50퍼센트 범위 내에서 인공지능,\n클라우드, 빅데이터, 모바일, 정보보호, 법률 및\n회계 등 다른 분야의 전문가를 배치할 수 있다.\n④ 상주감리원은 감리대상 사업비 20억원 이상의\n감리에 참여한 경력이 3회 이상인 수석감리원을\n배치할 수 있다.",
  "2026_7": "7. 다음 중 「정보시스템 감리 수행가이드(한국지능정보\n사회진흥원)」에서 정한 종료단계 감리의 감리원 활\n동으로 가장 적절하지 않은 것은?\n① 사업자의 과업 대비표 실증 점검\n② 전수조사 및 표본추출 대상 선정\n③ 검사항목별 완료여부 확인 및 적부판정\n④ 점검항목별 설계산출물의 충실도 점검",
  "2026_8": "8. 다음 중 프로젝트 일정 개발에서 사용되는 분석\n기법인 주경로법(critical path method)에 대한 설명\n으로 가장 적절하지 않은 것은?\n① 개발된 하나의 일정에서 주경로(critical path)는\n여러 개가 될 수 있다.\n② 주경로(critical path)란 하나의 일정 내에서 가장\n긴 경로를 의미한다.\n③ 주경로(critical path)의 길이는 프로젝트 전체\n기간과 같다.\n④ 주경로법으로 계산 시 전방계산과 후방계산을\n하는 이유는 일정을 검산하기 위함이다.\n2 -\n\n=== NEW PAGE ===",
  "2026_9": "9. 다음 중 「SW사업 대가산정 가이드(한국소프트웨어\n산업협회, 2025년 개정판)」에 따른 인공지능(AI)\n도입 사업비(사업 유형이 커스터마이징형일 경우)\n비용항목으로 가장 적절한 것은?\n① 서비스 이용료\n② 서비스 이용료, 커스터마이징 작업비용\n③ 서비스 이용료, 구축·개발 비용\n④ 서비스 이용료, 커스터마이징 작업비용,\n구축·개발 비용",
  "2026_10": "10. 다음 표와 같은 프로젝트 일정에서 프로젝트 전체\n완료 기간을 2일 단축하려고 한다. 공정압축법\n(crashing)을 이용할 경우 소요되는 최소 비용은\n얼마인가?\n활동 소요기간(일) 직전선행활동 단위기간당 단축비용\nA 2 - 200만원\nB 4 A 100만원\nC 3 A 200만원\nD 2 B, C 300만원\n(단위기간당 단축비용 : 1일 단축에 소요되는 비용)\n① 200만원 ② 300만원\n③ 400만원 ④ 500만원",
  "2026_11": "11. 다음 중 품질과 관련된 개념에 대한 설명으로 가\n장 적절하지 않은 것은?\n① 정확도(accuracy)란, 측정값이 얼마나 참값(true\nvalue)에 근접해 있느냐를 의미한다.\n② 정밀도(precision)란, 반복하여 수집한 측정값이\n평균에서 얼마나 떨어져 있는가를 의미한다.\n③ 품질(quality)이란, 명시적 혹은 암묵적 요구사항을\n만족시키는 능력에 대한 실체의 총체적인 특성\n이다.\n④ 등급(grade)이란, 기능상 용도는 같지만 서로 다른\n기술적 특성 또는 기능을 갖고 있는 제품의 분류\n기준이다.\n- 3",
  "2026_12": "12. 다음 중 현재의 ‘원가성과지수(CPI)가 앞으로도\n계속 적용될 것으로 예상될 때’ 완료시점산정치\n(EAC)를 계산하는 방법으로 가장 적절한 것은?\n[BAC : 완료시점예산, EV : 획득가치, AC : 실제\n원가, CPI : 원가성과지수, SPI :일정성과지수,\nETC : 잔여분산정치]\n① EAC = AC + [(BAC - EV)/(CPI x SPI)]\n② EAC = AC + (BAC - EV)\n③ EAC = BAC/CPI\n④ EAC = AC + Bottom-up ETC",
  "2026_13": "13. 다음 중 품질 비용 모델 가운데 외부 결함에 대한\n예시로 가장 적절하지 않은 것은?\n① 결함이 있는 자재나 오류 수정과 같은 재작업\n또는 수리\n② 교체된 고장 제품 또는 보증에 따라 재수행된\n서비스와 같은 보증 요청\n③ 결함의 유형 및 심각도에 따라 명성과 대중의\n인식이 손상될 수 있는 평판\n④ 고객 불만 처리 및 서비스 제공과 관련된 모든\n작업과 비용에 대한 불만",
  "2026_14": "14. 다음 중 원가 기준선(Cost Baseline)에 대한 설명\n으로 옳은 것은?\n① 프로젝트 완료 후 실제 비용을 집계하여 만드는\n보고서\n② 프로젝트 팀이 임의로 설정하는 예산 상한선\n③ 승인된 시간단계별 예산으로, 실제 결과와 비교\n하는 기준\n④ 우발사태 예비비와 관리예비를 포함한 활동\n비용의 합",
  "2026_15": "15. 다음 중 프로젝트 리스크관리에서 ‘리스크 대응\n전략’에 대한 설명으로 가장 적절하지 않은 것은?\n① ‘회피’는 리스크로부터 프로젝트를 보호하기\n위해 원래 계획을 변경하는 대응이다.\n② ‘완화’는 계획은 변경하지 않고 리스크가\n발생할 확률이나 영향을 최소화하는 대응이다.\n③ ‘전가’는 다른 당사자에게 리스크관리의 책임을\n주어 리스크 자체를 제거하는 대응이다.\n④ ‘수용’은 리스크에 대해 대응하지 않고 계획도\n변경하지 않는 대응이다.\n3 -\n\n=== NEW PAGE ===",
  "2026_16": "16.‘프로젝트에 의해 제공될 제품 서비스 또는 결과를\n자세히 기술한 문서’로 가장 적합한 것은?\n① RPS (Request proposal statement)\n② RFQ (Request for Quotation)\n③ RFI (Request for Information)\n④ SOW (statement of work)",
  "2026_17": "17. 다음 중 프로젝트 인적자원관리에서 ‘프로젝트 팀\n개발(develop project team)’과 관련된 활동에 대한\n설명으로 가장 적절하지 않은 것은?\n① 프로젝트 팀 개발은 프로젝트 성과를 향상하기\n위해 팀원의 역량 향상, 팀원 간 협력체계 등을\n구축하는 활동이다.\n② 프로젝트 팀이 높은 성과를 창출하는 강력한 조직\n으로 변신하기 위해서 도전적 목표와 기회를 부\n여한다.\n③ 프로젝트에서 경험이나 스킬(skill)이 많은 사람\n과 적은 사람을 의도적으로 짝을 지워주는 것을\n스토밍(storming)이라고 한다.\n④ 프로젝트 관리자는 프로젝트 팀을 구성한 이후\n중간 이탈방지를 위한 팀원 유지활동을 수행\n한다.",
  "2026_18": "18. 다음 사례를「고영향 인공지능 판단 가이드라인」에\n따라 고영향 인공지능에 해당하는지 판단한 결과로\n가장 적절한 것은?\n가. A 선사에는 선박 운항의 효율성을 높이기 위해\n선박 자율 제어 기술을 통한 자율운항 인공지능\n시스템을 활용하고 있다.\n나. B 지방자치단체에서는 인공지능 기반 스마트\n수질 모니터링 시스템을 이용하여 상수원에서\n나오는 수질을 실시간으로 감시하고 있다.\n다. C 항공사는 D 인공지능시스템을 통해 운항 중인\n객실 내에서 승객의 행동을 분석하여 비상\n상황에 대비하여 신속한 대처방안을 승객에게\n제시하고 있다.\n① (가) 비해당 - (나) 비해당 - (다) 비해당\n② (가) 해당 - (나) 비해당 - (다) 비해당\n③ (가) 비해당 - (나) 해당 - (다) 비해당\n④ (가) 해당 - (나) 해당 - (다) 해당\n- 4",
  "2026_19": "19. 의사소통 당사자의 수가 5명에서 7명으로 2명이\n더 늘었다면 의사소통 채널 수는 현재보다 얼마나\n증가하는가?\n① 2개 ② 4개\n③ 11개 ④ 15개",
  "2026_20": "20. 다음 중 프로젝트 측정과 관련하여 ‘어떤 것을\n측정하는 행위가 행동에 영향을 미치는 것’을\n의미하는 용어로 옳은 것은?\n① 허영 지표 (Vanity metric)\n② 호손 효과 (Hawthorne effect)\n③ 사기 저하 (Demoralization)\n④ 확증 편향 (Confirmation bias)",
  "2026_21": "21. 다음 중 「전자정부 성과관리 지침(행정안전부\n고시)」에 따라 사전협의 신청시 제출하여야 하는\n서류에 포함되지 않는 것은?\n① 사업계획서\n② 자체검토결과서\n③ SW사업 영향평가 결과서\n④ SW개발사업의 적정 사업기간 종합 산정서",
  "2026_22": "22. 다음 중 「전자정부 성과관리 지침(행정안전부\n고시)」에 따른 성과관리에 대한 설명으로 가장\n적절하지 않은 것은?\n① 행정안전부 장관은 매년 전자정부 성과관리를\n수립하여야 한다.\n② 행정안전부 장관은 성과측정 및 분석결과에 따라\n성과관리가 특별히 필요하다고 판단되는 사업에\n대해 사업규모를 조정할 것을 요청할 수 있다.\n③ 중앙행정기관의 장은 성과측정을 비용측면,\n효과측면으로 구분하여 시행한다.\n④ 행정안전부 장관은 성과 평가 결과 40점 미만은\n폐기하도록 권고할 수 있다.\n4 -\n\n=== NEW PAGE ===",

    let isServerConnected = false;

    async function initMemos() {
        const badge = document.getElementById('storage-badge');
        try {
            const response = await fetch(API_URL, {

            if (response.ok) {

                isServerConnected = true;

                badge.style.background = 'rgba(16, 185, 129, 0.12)';
                badge.style.borderColor = 'rgba(16, 185, 129, 0.25)';

                badge.title = '공부 코멘트가 e:\jolly-carson\data\pm_memos.json 파일에 영구 보존됩니다.';
                
                checkMigration();
            } else {
                throw new Error("API response error");
            }
        } catch (e) {
            isServerConnected = false;
            badge.className = 'badge';
            badge.style.background = 'rgba(239, 68, 68, 0.12)';
            badge.style.borderColor = 'rgba(239, 68, 68, 0.25)';

        }
        
        topicMapping.forEach((item, idx) => {
            loadMemo(idx, item.concept);
        });
    }

    function checkMigration() {
        const localKeys = [];
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && key.startsWith('pm_memo_')) {
                localKeys.push(key);
            }
        }
        
        if (localKeys.length > 0) {
            const banner = document.getElementById('migration-banner');
            const countEl = document.getElementById('migration-count');
            if (banner && countEl) {
                countEl.textContent = localKeys.length;
                banner.style.display = 'block';
            }
        }
    }

    async function migrateMemos() {
        const localKeys = [];
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && key.startsWith('pm_memo_')) {
                localKeys.push(key);
            }
        }
        
        if (localKeys.length === 0) return;
        
        if (!confirm(`브라우저에 임시 저장된 공부 노트 ${localKeys.length}개를 서버 파일로 통합하시겠습니까? (이전 완료 시 브라우저 내의 데이터는 정리됩니다.)`)) {
            return;
        }
        
        let successCount = 0;
        const banner = document.getElementById('migration-banner');
        
        for (const key of localKeys) {
            const conceptName = key.replace('pm_memo_', '');
            try {
                const dataStr = localStorage.getItem(key);
                if (dataStr) {
                    const data = JSON.parse(dataStr);
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            concept: conceptName,
                            text: data.text,
                            updatedAt: data.updatedAt,
                            action: 'save'
                        })
                    });
                    
                    if (response.ok) {
                        localStorage.removeItem(key);
                        serverMemos[conceptName] = {
                            text: data.text,
                            updatedAt: data.updatedAt
                        };
                        successCount++;
                    }
                }
            } catch (err) {
                console.error(`마이그레이션 오류 (${conceptName}):`, err);
            }
        }
        
        alert(`공부 코멘트 ${successCount}개가 성공적으로 서버 파일(pm_memos.json)에 병합되었습니다.`);
        banner.style.display = 'none';
        
        renderTopics();
    }

    function loadMemo(idx, conceptName) {
        const displayEl = document.getElementById(`memo-display-${idx}`);
        const dateEl = document.getElementById(`memo-date-${idx}`);
        const deleteBtn = document.getElementById(`memo-delete-btn-${idx}`);
        const inputEl = document.getElementById(`memo-input-${idx}`);
        
        let memoData = null;
        
        if (isServerConnected) {
            if (serverMemos && serverMemos[conceptName]) {
                memoData = serverMemos[conceptName];
            }
        } else {
            const key = `pm_memo_${conceptName}`;
            const dataStr = localStorage.getItem(key);
            if (dataStr) {
                try {
                    memoData = JSON.parse(dataStr);
                } catch (e) {
                    localStorage.removeItem(key);
                }
            }
        }
        
        if (displayEl && dateEl && deleteBtn && inputEl) {
            if (memoData) {
                displayEl.innerHTML = '';
                displayEl.textContent = memoData.text;
                dateEl.textContent = `최근 수정: ${memoData.updatedAt}`;
                deleteBtn.style.display = 'inline-block';
                inputEl.value = memoData.text;
            } else {
                displayEl.innerHTML = `<span class="memo-placeholder">등록된 공부 메모가 없습니다. 나만의 학습 팁을 적어 수험 공부 효율을 높여보세요!</span>`;
                dateEl.textContent = '최근 수정일시 없음';
                deleteBtn.style.display = 'none';
                inputEl.value = '';
            }
        }
    }

    function enableMemoEdit(idx) {
        document.getElementById(`memo-view-mode-${idx}`).style.display = 'none';
        document.getElementById(`memo-edit-mode-${idx}`).style.display = 'block';
        
        const content = document.getElementById(`accordion-${idx}`).querySelector('.accordion-content');
        content.style.maxHeight = 'none';
        setTimeout(() => {
            content.style.maxHeight = content.scrollHeight + 'px';
        }, 50);
    }

    function cancelMemoEdit(idx) {
        document.getElementById(`memo-view-mode-${idx}`).style.display = 'block';
        document.getElementById(`memo-edit-mode-${idx}`).style.display = 'none';
        
        const content = document.getElementById(`accordion-${idx}`).querySelector('.accordion-content');
        content.style.maxHeight = 'none';
        setTimeout(() => {
            content.style.maxHeight = content.scrollHeight + 'px';
        }, 50);
    }

    async function saveMemo(idx, conceptName) {
        const text = document.getElementById(`memo-input-${idx}`).value.trim();
        if (!text) {
            alert("공부 메모 내용을 입력해주세요.");
            return;
        }
        
        const now = new Date();
        const formattedDate = now.getFullYear() + '-' + 
            String(now.getMonth() + 1).padStart(2, '0') + '-' + 
            String(now.getDate()).padStart(2, '0') + ' ' + 
            String(now.getHours()).padStart(2, '0') + ':' + 
            String(now.getMinutes()).padStart(2, '0') + ':' + 
            String(now.getSeconds()).padStart(2, '0');
            
        if (isServerConnected) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        concept: conceptName,
                        text: text,
                        updatedAt: formattedDate,
                        action: 'save'
                    })
                });
                
                if (response.ok) {
                    serverMemos[conceptName] = {
                        text: text,
                        updatedAt: formattedDate
                    };
                } else {
                    const errData = await response.json();
                    throw new Error(errData.message || "서버 파일 저장에 실패했습니다.");
                }
            } catch (err) {
                alert(`[오류] 서버 파일 저장 실패: ${err.message}. 임시로 브라우저에 저장합니다.`);
                localStorage.setItem(`pm_memo_${conceptName}`, JSON.stringify({ text, updatedAt: formattedDate }));
            }
        } else {
            localStorage.setItem(`pm_memo_${conceptName}`, JSON.stringify({ text, updatedAt: formattedDate }));
        }
        
        document.getElementById(`memo-view-mode-${idx}`).style.display = 'block';
        document.getElementById(`memo-edit-mode-${idx}`).style.display = 'none';
        loadMemo(idx, conceptName);
        
        const content = document.getElementById(`accordion-${idx}`).querySelector('.accordion-content');
        content.style.maxHeight = 'none';
        setTimeout(() => {
            const newHeight = content.scrollHeight;
            content.style.maxHeight = newHeight + 'px';
        }, 50);
    }

    async function deleteMemo(idx, conceptName) {
        if (!confirm("작성하신 공부 노트를 완전히 삭제하시겠습니까?")) {
            return;
        }
        
        if (isServerConnected) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        concept: conceptName,
                        action: 'delete'
                    })
                });
                
                if (response.ok) {
                    if (serverMemos[conceptName]) {
                        delete serverMemos[conceptName];
                    }
                } else {
                    const errData = await response.json();
                    throw new Error(errData.message || "서버 파일 삭제에 실패했습니다.");
                }
            } catch (err) {
                alert(`[오류] 서버 파일 삭제 실패: ${err.message}.`);
                return;
            }
        } else {
            const key = `pm_memo_${conceptName}`;
            localStorage.removeItem(key);
        }
        
        loadMemo(idx, conceptName);
        
        const content = document.getElementById(`accordion-${idx}`).querySelector('.accordion-content');
        content.style.maxHeight = 'none';
        setTimeout(() => {
            const newHeight = content.scrollHeight;
            content.style.maxHeight = newHeight + 'px';
        }, 50);
    }

        document.querySelectorAll('.filter-btn').forEach(btn => {

                btn.classList.remove('active');

        renderTopics();

    function toggleAccordion(index) {
        const item = document.getElementById(`accordion-${index}`);
        const content = item.querySelector('.accordion-content');
        const isActive = item.classList.contains('active');

        document.querySelectorAll('.accordion-item').forEach((el, i) => {
            if (i !== index) {
                el.classList.remove('active');
                el.querySelector('.accordion-content').style.maxHeight = '0px';
            }
        });

        if (!isActive) {
            item.classList.add('active');
            
            let filtered = topicMapping;
            if (currentCategory !== '전체') {
                filtered = topicMapping.filter(item => item.category === currentCategory);
            }
            const dataObj = filtered[index];
            
            if (dataObj && dataObj.rep_question) {
                const viewer = document.getElementById(`viewer-${index}`);
                const titleEl = document.getElementById(`viewer-title-${index}`);
                const bodyEl = document.getElementById(`viewer-body-${index}`);
                const imgEl = document.getElementById(`viewer-img-${index}`);
                const imgContainer = document.getElementById(`viewer-img-container-${index}`);
                
                titleEl.textContent = `[대표 문제 예시] ${dataObj.rep_year}년 기출 ${dataObj.rep_num}번`;
                bodyEl.textContent = dataObj.rep_question;
                
                if (imgEl && imgContainer) {
                    imgContainer.style.display = 'block';
                    imgEl.src = `images/${dataObj.rep_year}_${dataObj.rep_num}.png`;
                }
                
                viewer.style.display = 'flex';
                
                item.querySelectorAll('.year-btn').forEach(btn => btn.classList.remove('active-btn'));
                setTimeout(() => {
                    const activeBtn = item.querySelector(`.q-btn-${dataObj.rep_year}-${dataObj.rep_num}`);
                    if (activeBtn) {
                        activeBtn.classList.add('active-btn');
                    }
                }, 50);
            }
            
            setTimeout(() => {
                content.style.maxHeight = content.scrollHeight + 'px';
            }, 150);
        } else {
            item.classList.remove('active');
            content.style.maxHeight = '0px';
        }
    }

        const viewer = document.getElementById(`viewer-${idx}`);
        const titleEl = document.getElementById(`viewer-title-${idx}`);
        const bodyEl = document.getElementById(`viewer-body-${idx}`);
        const imgEl = document.getElementById(`viewer-img-${idx}`);
        const imgContainer = document.getElementById(`viewer-img-container-${idx}`);
        
        titleEl.textContent = `${year}년도 감리사 기출 ${num}번`;
        bodyEl.textContent = questionText;
        
        if (imgEl && imgContainer) {
            imgContainer.style.display = 'block';
            imgEl.src = `images/${year}_${num}.png`;
        }
        
        viewer.style.display = 'flex';
        
        content.style.maxHeight = 'none';
        setTimeout(() => {
            const newHeight = content.scrollHeight;
            content.style.maxHeight = newHeight + 'px';
        }, 50);
    }

    function closeInlineViewer(idx, event) {
        if (event) event.stopPropagation();
        
        const item = document.getElementById(`accordion-${idx}`);
        const content = item.querySelector('.accordion-content');
        
        item.querySelectorAll('.year-btn').forEach(btn => btn.classList.remove('active-btn'));
        
        const viewer = document.getElementById(`viewer-${idx}`);
        viewer.style.display = 'none';
        
        content.style.maxHeight = 'none';
        setTimeout(() => {
            const newHeight = content.scrollHeight;
            content.style.maxHeight = newHeight + 'px';
        }, 50);
    }

    renderTopics();
    initMemos();
</script>
</body>
</html>
