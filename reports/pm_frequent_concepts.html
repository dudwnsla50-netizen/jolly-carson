<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로젝트관리 및 감리 12개년 빈출 개념 정밀 뷰어</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080b13;
            --card-bg: rgba(17, 24, 39, 0.75);
            --border-color: rgba(255, 255, 255, 0.06);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent-violet: #8b5cf6;
            --accent-blue: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%);
            --accent-glow: rgba(139, 92, 246, 0.12);
            --success: #10b981;
            --card-hover-border: rgba(139, 92, 246, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 2.5rem 1.5rem;
            min-height: 100vh;
            background-image: 
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.06) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.06) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.6rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.6rem;
            letter-spacing: -0.03em;
        }

        header p.subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
        }

        .meta-badges {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .badge {
            background: var(--border-color);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 0.35rem 0.9rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 500;
            backdrop-filter: blur(8px);
        }

        .badge.accent {
            background: rgba(139, 92, 246, 0.12);
            border-color: rgba(139, 92, 246, 0.25);
            color: #c084fc;
        }

        .filter-section {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.45rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .filter-btn:hover, .filter-btn.active {
            border-color: var(--accent-violet);
            color: #ffffff;
            background: rgba(139, 92, 246, 0.08);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .accordion-list {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-bottom: 4rem;
        }

        .accordion-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .accordion-item:hover {
            border-color: var(--card-hover-border);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .accordion-trigger {
            width: 100%;
            background: none;
            border: none;
            color: inherit;
            padding: 1.6rem 1.8rem;
            text-align: left;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .card-title-group {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .rank-badge {
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .concept-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        .category-tag {
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            padding: 0.15rem 0.45rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .freq-count-badge {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.15);
            color: var(--success);
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .card-meta-grid {
            display: grid;
            grid-template-columns: 90px 1fr;
            row-gap: 0.5rem;
            column-gap: 0.8rem;
            width: 100%;
            font-size: 0.88rem;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 0.8rem;
            margin-top: 0.2rem;
        }

        .meta-label {
            color: var(--text-muted);
            font-weight: 600;
        }

        .meta-value {
            color: var(--text-secondary);
            word-break: keep-all;
        }

        .meta-value.accent {
            color: #c8a2c8;
        }

        .accordion-trigger .arrow {
            transition: transform 0.3s ease;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .accordion-item.active .accordion-trigger .arrow {
            transform: rotate(180deg);
            color: var(--accent-violet);
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            background: rgba(0, 0, 0, 0.18);
        }

        .accordion-inner {
            padding: 1.6rem 1.8rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .section-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 0.3rem;
            margin-top: 0.2rem;
        }

        .year-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .year-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.35rem 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .year-btn:hover {
            background: var(--accent-gradient);
            border-color: transparent;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.25);
            transform: translateY(-1px);
        }

        .year-btn.active-btn {
            background: var(--accent-gradient);
            border-color: transparent;
            box-shadow: 0 4px 10px rgba(139, 92, 246, 0.3);
            color: #ffffff;
        }

        .year-btn .num-label {
            opacity: 0.7;
            font-size: 0.7rem;
        }

        .inline-question-viewer {
            background: #090d16;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            transition: all 0.3s ease;
        }

        .viewer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 0.5rem;
        }

        .viewer-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #60a5fa;
            font-family: 'Outfit', sans-serif;
        }

        .viewer-close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: color 0.2s;
        }

        .viewer-close-btn:hover {
            color: #ef4444;
        }

        .viewer-body {
            font-size: 0.92rem;
            line-height: 1.7;
            color: #d1d5db;
            white-space: pre-wrap;
            overflow-y: auto;
            max-height: 400px;
            padding-right: 0.5rem;
        }

        .viewer-body::-webkit-scrollbar {
            width: 6px;
        }
        .viewer-body::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.01);
        }
        .viewer-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .memo-section {
            background: rgba(139, 92, 246, 0.02);
            border: 1px dashed rgba(139, 92, 246, 0.15);
            border-radius: 8px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-bottom: 0.5rem;
        }

        .memo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.04);
            padding-bottom: 0.4rem;
        }

        .memo-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #c084fc;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .memo-date {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .memo-content-box {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #d1d5db;
            white-space: pre-wrap;
            min-height: 24px;
        }

        .memo-placeholder {
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.85rem;
        }

        .memo-textarea {
            width: 100%;
            min-height: 150px;
            background: #090d16;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: var(--text-primary);
            padding: 0.8rem 1rem;
            font-family: inherit;
            font-size: 0.92rem;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .memo-textarea:focus {
            border-color: var(--accent-violet);
            box-shadow: 0 0 8px rgba(139, 92, 246, 0.2);
        }

        .memo-btn-group {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
        }

        .memo-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.3rem 0.7rem;
            border-radius: 4px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .memo-btn:hover {
            color: #ffffff;
            border-color: var(--text-muted);
        }

        .memo-btn.save {
            background: var(--accent-gradient);
            border: none;
            color: #ffffff;
        }

        .memo-btn.save:hover {
            box-shadow: 0 2px 8px rgba(139, 92, 246, 0.3);
        }

        .memo-btn.delete {
            color: #f87171;
            border-color: rgba(248, 113, 113, 0.2);
        }

        .memo-btn.delete:hover {
            background: rgba(248, 113, 113, 0.05);
            border-color: #f87171;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>프로젝트관리 및 감리 기출 정밀 분석 대시보드</h1>
        <p class="subtitle">12개년 기출 전수 조사 기반 3회 이상 빈출 세부 토픽 분석 엔진</p>
        <div class="meta-badges">
            <span class="badge">기출 범위: 2015년 ~ 2026년</span>
            <span class="badge accent">총 분석 데이터: 300 문항</span>
            <span class="badge">검출된 빈출 세부 토픽: <span id="topic-count-badge">0</span>개</span>
            <span id="storage-badge" class="badge" style="cursor: help;">저장소 로딩 중...</span>
        </div>
    </header>

    <!-- 로컬 데이터 마이그레이션 배너 -->
    <div id="migration-banner" style="display: none; background: rgba(139, 92, 246, 0.12); border: 1px solid rgba(139, 92, 246, 0.3); padding: 1.2rem; border-radius: 10px; margin-bottom: 2rem; text-align: center; backdrop-filter: blur(10px); box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
        <div style="font-size: 0.95rem; font-weight: 600; color: #ffffff; margin-bottom: 0.5rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
            <span>💡 이전 브라우저(LocalStorage)에 작성된 공부 코멘트 <span id="migration-count" style="color: #c084fc; font-weight: 700;">0</span>개가 발견되었습니다.</span>
        </div>
        <div style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.8rem;">
            이 코멘트들을 서버 파일 저장소(`data/pm_memos.json`)로 안전하게 가져와서 영구 보존할 수 있습니다.
        </div>
        <button onclick="migrateMemos()" style="background: var(--accent-gradient); border: none; color: #ffffff; padding: 0.4rem 1.2rem; border-radius: 6px; font-size: 0.82rem; font-weight: 700; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 8px rgba(139, 92, 246, 0.3);">
            파일 서버로 코멘트 동기화하기
        </button>
    </div>

    <!-- Category Filtering badges -->
    <div class="filter-section">
        <button class="filter-btn active" onclick="filterCategory('전체')">전체</button>
        <button class="filter-btn" onclick="filterCategory('법/제도/지침')">법/제도/지침</button>
        <button class="filter-btn" onclick="filterCategory('감리 법제도/기술')">감리 법제도/기술</button>
        <button class="filter-btn" onclick="filterCategory('조직 관리론')">조직 관리론</button>
        <button class="filter-btn" onclick="filterCategory('프로젝트 관리')">프로젝트 관리</button>
    </div>

    <!-- Accordion List -->
    <div class="accordion-list" id="accordion-container">
        <!-- Javascript will inject accordion elements here -->
    </div>
</div>

<script>
    // 파이썬 빌더에서 동적으로 인젝션하는 기출문제 데이터베이스
    const examDatabase = {
  "2015_1": "1. ‘학습을 위한 수평적 조직설계’와 ‘효율성을\n위한 수직적 조직설계’ 중 ‘학습을 위한 수평적\n조직설계’의 특징으로 가장 적절한 것은?\n① 전문화된 과업\n② 집권화된 의사결정\n③ 많은 수의 팀과 태스크포스\n④ 엄격한 계층",
  "2015_2": "2. A기업의 CEO는 현재 진행하고 있는 프로젝트 예산에\n대해 많은 관심을 가지고 있다. 프로젝트 종료시\n얼마만큼의 예산이 초과 혹은 절감될 지를 알아\n보려고 한다면 어느 지표를 이용하는 것이 가장\n빠르게 확인할 수 있는가?\n① VAC(Variance At Completion)\n② SPI(Schedule Performance Index)\n③ ETC(Estimate To Completion)\n④ EAC(Estimate At Completion)",
  "2015_3": "3. “PMBOK 가이드(제5판)”의 프로젝트 범위관리에\n대한 설명 중 가장 적절하지 않은 것은?\n① ‘범위검수(validate)’ 프로세스에 활용되는\n도구는 ‘검사’이다.\n② ‘범위통제’는 범위 기준선에 대한 변경을\n관리하는 것이다.\n③ ‘범위통제’ 프로세스에 활용되는 도구는 ‘차이\n분석’이다.\n④ ‘범위관리’는 범위정의, 요구사항 수집, WBS작성,\n범위통제, 범위검수의 순으로 진행된다.\n- 2",
  "2015_4": "4. 팀 개발을 위한 모델 중 하나인 ‘터크만(Tuckman)\n사다리’의 5단계 중 ‘표준화 단계’를 설명하는\n내용으로 가장 적절한 것은?\n① 팀이 프로젝트 작업, 기술사항 결정, 프로젝트\n관리 방식을 다루기 시작하는 단계\n② 팀이 모여 프로젝트 자체, 팀원별 공식적 역할과\n담당업무를 파악하는 단계\n③ 팀원들이 협력하고, 팀을 지원하는 행동과 업무\n습관을 조율하기 시작하는 단계\n④ 팀원들이 상호의존적이며 원활하고 효과적으로\n이슈를 해결하는 단계",
  "2015_5": "5. 품질감사활동은 프로젝트가 조직의 정책과 프로젝트\n정책, 프로세스 및 절차를 따르는지를 판별하기\n위해 수행하는 체계적이고 독립적인 프로세스이다.\n다음 중 품질감사 목표에 포함될 수 있는 것을\n모두 고른 것은?\n가. 구현 중인 모든 우수 및 모범사례 식별\n나. 모든 부적합성, 격차, 결점 식별\n다. 조직 및 산업 내 유사 프로젝트에 도입\n또는 구현된 모범사례 공유\n라. 생산성 향상에 도움이 되도록 프로세스\n구현을 개선하는 방식으로 지원\n마. 조직의 교훈 저장소에 각 감사의 기여도\n명시\n① 가, 나, 다, 라 ② 나, 다, 라, 마\n③ 가, 다, 라, 마 ④ 가, 나, 다, 라, 마",
  "2015_6": "6. 프로젝트 관리 수행 중 리스크를 관리하기 위해\n리스크 관리계획을 수립할 때, 이 계획서에 포함\n될 사항 중 가장 거리가 먼 것은?\n① 리스크 범주\n② 리스크가 발생할 확률 및 영향의 정의\n③ 리스크 체크리스트\n④ 리스크관리의 역할과 책임\n2 -\n\n=== NEW PAGE ===",
  "2015_7": "7. 식별된 리스크 계량화를 위한 분석은 정량적인\n분석과 정성적인 분석으로 수행한다. 정량적인\n분석방법 중 ‘모든 불확실한 요소를 기준 값으로\n놓고 각 프로젝트 요소의 불확실성이 검토대상\n목표에 미칠 영향을 평가’하는 방법은?\n① 민감도 분석\n② 의사결정트리 분석\n③ 확률분포 분석\n④ 모델링 및 시뮬레이션 분석",
  "2015_8": "8. 프로젝트 수행과정에서 리스크 통제 프로세스와\n관련된 활동으로 가장 거리가 먼 것은?\n① 리스크 대응계획 구현 여부 감시\n② 새로운 리스크 식별\n③ 예비비 사용규약 결정\n④ 프로젝트 가정이 계속 유효한지 여부 확인",
  "2015_9": "9. 수행될 프로젝트를 분석해 보니 불확실성이 낮고,\n복잡성이 낮고, 기술은 표준을 채택하고, 기간은\n단기이고, 규모는 작고, 차별성은 낮음으로 분석\n되었다. 이러한 프로젝트를 수행하는데 가장 적절한\n조직구조 형태는?\n① 기능(functional) 조직구조\n② 약한 매트릭스(weak matrix) 조직구조\n③ 강한 매트릭스(strong matrix) 조직구조\n④ 프로젝트 전담(projectized) 조직구조\n- 3",
  "2015_10": "10. 과거 자료가 없거나 활동 소요시간을 산출하기\n어려운 신제품 개발과 같은 프로젝트의 활동\n소요시간 산정 시 3점 산정법(three-point\nestimation)방식을 활용한다. 3점 산정법을 활용\n하여 프로젝트 활동 소요시간 예측 시 고려되지\n않는 것은?\n① 낙관시간: 관련 활동을 좋은 조건에서 수행할\n경우 소요되는 예상 시간치\n② 최소시간: 관련활동에 모든 자원을 최대로 투입\n할 경우 소요되는 예상 시간치\n③ 비관시간: 관련활동을 나쁜 환경에서 수행할\n경우 소요되는 예상 시간치\n④ 최빈시간: 관련활동의 소요시간에 가장 근접\n하다고 판단되는 예상 시간치",
  "2015_11": "11. 프로젝트 수행 특징상 방대한 정보 또는 수많은\n수신자간에 정보 공유가 필요하다. 이때 의사소\n통방법 중 가장 적절한 것은?\n① 유인식 의사소통\n② 전달식 의사소통\n③ 대화식 의사소통\n④ 통보식 의사소통",
  "2015_12": "12. 프로젝트를 통합 관리하는 활동 중 프로젝트 성과\n모니터링은 프로젝트 활동을 지속적으로 모니터링\n하여 프로젝트 관리 계획서 및 프로젝트 기준을\n준수하는지를 확인하는 활동이다. 다음 중 프로젝트\n성과 모니터링 대상 중 가장 거리가 먼 것은?\n① 범위기준선\n② 위험기준선\n③ 원가기준선\n④ 일정기준선\n3 -\n\n=== NEW PAGE ===",
  "2015_13": "13. “정보시스템 감리기준”에 관한 설명 중 가장\n거리가 먼 것은?\n① 감리대상사업의 사업비가 20억원 미만이고 사업기\n간이 6개월 이상이면 3단계감리를 하여야 한다.\n② 단계별 감리 외에 상주감리를 추가로 하는 경우\n요구정의단계 감리는 생략하고, 상주감리원이\n요구사항정의서의 과업내용 반영여부 등을 직접\n점검하여야 한다.\n③ 감리인력은 전체 투입공수의 50% 이상을 해당\n감리법인 소속의 상근 감리원으로 배치하여야 한다.\n④ ‘감리보고서’에는 ‘감리수행결과보고서’와\n‘시정조치확인보고서’가 있다.",
  "2015_14": "14. “정보시스템 감리 수행 가이드”에서 종료단계의\n과업이행 여부 판정 기준에 관한 설명 중 가장\n거리가 먼 것은?\n① ‘적/부 판정’은 감리원이 직접 점검한 결과를\n검사기준서의 판정기준과 비교하여 적합, 부\n적합을 판정한다.\n② 현장감리 기간 내에 보완되지 않더라도 중대\n결함이 아닌 단순결함은 ‘적합’으로 판정한다.\n③ ‘완료여부’는 사업자가 제출한 과업이행 결과를\n기초로 실제 완료여부를 확인하여 기록한다.\n④ ‘완료여부’가 ‘진행중’의 경우에는, 종료\n단계이므로 발주기관의 요청이나 합의에 의하여\n진행 중인 경우는 ‘점검제외’로 판정한다.",
  "2015_15": "15. “전자정부사업관리 위탁에 관한 규정”에 따라\n전자정부사업관리 업무를 위탁받아 수행하는 전자\n정부사업관리자의 업무 중 가장 거리가 먼 것은?\n① 현업부서 등의 의견수렴 및 이해관계 조정\n② 사업계획 수립 등 사업기획 지원\n③ 쟁점 및 위험 등의 식별ㆍ분석ㆍ보고 및 대안제시\n④ 하자보수 등 정보시스템 안정화 지원\n- 4",
  "2015_16": "16. “행정기관 및 공공기관 정보시스템 구축·운영\n지침”의 내용 중 맞는 것을 모두 고른 것은?\n가. 정보화사업 이행에 수년을 요하는 정보\n시스템 유지보수계약에 있어서는 국가\n계약법 및 같은 법 시행령, 지방계약법에\n의하여 장기계속계약을 체결할 수 있다.\n나. 사업대가를 기능점수로 산정한 경우에는\n제안요청서에 투입인력의 수와 기간에\n의한 방식에 관한 요구사항을 명시할\n수 없다.\n다. 계약기간내에 용역을 완성한 후 검사가\n완료된 때에는 인력의 투입도 종료된다.\n라. 행정기관등의 장과 사업자는 단계별 감리\n수행결과보고서에 따라 시정조치를\n수행하여야 한다.\n① 가. 나 ② 가, 나, 라\n③ 나, 다, 라 ④ 가, 나, 다, 라",
  "2015_17": "17. “정보시스템 감리 수행 가이드”에 따른 ‘착수\n/계획’ 감리시점의 ‘사업관리’ 감리영역 점\n검항목으로 가장 거리가 먼 것은?\n① 품질관리체계를 적정하게 수립하여 관리하고\n있는지 여부\n② 일정관리체계를 적정하게 수립하여 관리하고\n있는지 여부\n③ 비용관리체계를 적정하게 수립하여 관리하고\n있는지 여부\n④ 범위관리체계를 적정하게 수립하여 관리하고\n있는지 여부",
  "2015_18": "18. “전자정부서비스 호환성 준수지침”에서 모바일\n전자정부서비스 웹호환성 진단에 있어서 ‘동작\n호환성 확보 여부’를 진단하는 방법으로 가장\n적절한 것은?\n① W3C Markup Validator\n② W3C CSS Validator\n③ 크로스 브라우징 테스트\n④ 플러그인 동작 테스트\n4 -\n\n=== NEW PAGE ===",
  "2015_19": "19. “소프트웨어사업 관리감독에 관한 일반기준”\n에서 제시된 사업규모(FP)에 따른 1인 생산성\n(FP/MM)과 가장 거리가 먼 것은?\n① 1,000 FP 이하, 19 FP/MM\n② 1,000 ~ 1,999 FP, 22 FP/MM\n③ 2,000 ~ 2,999 FP, 24 FP/MM\n④ 3,000 FP 이상, 26 FP/MM",
  "2015_20": "20. “행정정보 데이터베이스 표준화지침”에서 제시\n하고 있는 장애요인 중 복구목표시간이 가장\n긴 것은?\n① 운영 실수\n② 해커 침입\n③ 컴퓨터 바이러스의 피해\n④ 저장장치 손상",
  "2015_21": "21. “공공데이터 관리지침”에서 제시하고 있는 텍스트\n유형 공공데이터에 대한 ‘기계 판독이 가능한\n데이터 형태(format)’의 권고사항과 가장 거리가\n먼 것은?\n① HWP 파일\n② XML 파일\n③ PDF 파일\n④ RDF 파일",
  "2015_22": "22. 자원 평준화(resource leveling)와 일정 단축에\n관한 설명으로 가장 거리가 먼 것은?\n① 주공정 경로에 포함된 활동에 제한된 자원을\n우선적으로 배정한다.\n② 자원 제약을 특별히 고려하여 일정계획을 수립\n하는 다른 방법으로 주공정연쇄법(critical\nchain method)가 있다.\n③ 활동의 연관관계를 조정하여 둘 이상의 활동을\n병행함으로써 일정을 단축하는 방법을 공정중첩\n단축법(fast tracking)이라 한다.\n④ 프로젝트 예산에 여유가 있는 경우 공정압축법\n(crashing)보다는 공정중첩 단축법을 먼저 시도\n하는 것이 바람직하다\n- 5",
  "2015_23": "23. “정보시스템 감리원 윤리 가이드”에서 윤리\n강령의 준수에 지장을 초래할 수 있는 잠재적인\n위협 중 정보시스템 감리원 본인이 재무적 이해\n관계가 있는 경우에 발생하는 위협으로 가장\n적절한 것은?\n① 이기적 위협\n② 자기검토 위협\n③ 유착 위협\n④ 압력 위협",
  "2015_24": "24. “SW사업 대가산정 가이드”에서 소프트웨어 재\n개발비의 변경률 산정에 관한 설명으로 가장 거리가\n먼 것은?\n① 설계 변경률이 높다면 소프트웨어의 재개발\n노력이 증가함을 의미한다.\n② 트랜잭션 설계 변경률은 사용자인터페이스, 업무\n처리로직, 데이터처리로직의 변경 정도에 따라\n산정된다.\n③ 코드 변경률은 설계 변경률보다 작은 값을 갖는다.\n④ 설계 변경률과 코드 변경률이 0%인 경우에도 통합\n및 시험 변경률이 50%인 경우가 있을 수 있다",
  "2015_25": "25. “정보시스템 감리 수행 가이드”의 시정조치 확인\n세부절차를 실행 순서대로 나열할 때 가장 적절한\n것은?\n① 시정조치 결과 확인계획 공유 → 시정조치 결과\n확인 → 미조치/오조치 사항에 대한 개선의견\n제시 → 발주자/사업자 면담 → 상호 검토\n② 시정조치 결과 확인 → 시정조치 결과 확인계획\n공유 → 발주자/사업자 면담 → 상호 검토 →\n미조치/오조치 사항에 대한 개선의견 제시\n③ 시정조치 결과 확인계획 공유 → 발주자/사업자\n면담 → 시정조치 결과 확인 → 상호 검토 →\n미조치/오조치 사항에 대한 개선의견 제시\n④ 시정조치 결과 확인계획 공유 → 시정조치 결과\n확인 → 상호 검토 → 발주자/사업자 면담 →\n미조치/오조치 사항에 대한 개선의견 제시\n5 -\n\n=== NEW PAGE ===\n\n소프트웨어 공학",
  "2016_1": "1. 이해당사자의 요구가 있어 프로젝트 진행 중 3곳의\n작업이 추가되었다고 가정할 때, CPI(Cost Perfor-\nmance Index)에는 어떤 영향을 줄 수 있는가?\n① CPI가 상승한다.\n② CPI가 하락한다.\n③ CPI는 변하지 않는다.\n④ 현재 조건으로 판단할 수 없다.",
  "2016_2": "2. 제품 및 서비스를 제공하는 판매자인 “을” 계약자\n에게 원가와 이익 및 손실에 대한 모든 책임과\n위험을 전가하는 계약 방식은?\n① 실비정산 계약\n② 고정가격 계약\n③ 기간 및 재료 계약\n④ 비확정 납기 계약",
  "2016_3": "3. 품질 비용의 종류와 그 예에 관한 설명으로 가장\n적절하지 않은 것은?\n① 평가비용 – 시험기기의 보전 비용\n② 내부실패비용 – 작업중단 비용\n③ 외부실패비용 – 재검사 비용\n④ 예방비용 – 공정설계 비용",
  "2016_4": "4. 갈등해결에 대한 방법 중 상대방의 목표와 자신의\n목표 모두를 중요하게 여기는 갈등해결 방식으로\n가장 적절한 것은?\n① 철수(Withdrawing)\n② 양보(Smoothing)\n③ 타협(Compromising)\n④ 문제해결(Problem Solving)",
  "2016_5": "5. 획득가치분석을 적용할 때 프로젝트 일정이 계획\n보다 지연되고 있지만 실제 비용은 당초 예산보다\n절감되고 있다고 판단하는 경우는?\n① EV = 200, PV = 180, AC = 210\n② EV = 200, PV = 180, AC = 190\n③ EV = 200, PV = 210, AC = 180\n④ EV = 200, PV = 210, AC = 220\n- 2",
  "2016_6": "6. 다음의 활동-마디 프로젝트 네트워크에 관련된\n설명으로 가장 거리가 먼 것은?\n① 주경로의 길이는 19이다.\n② 활동 C가 지연되면 프로젝트 기간이 늘어난다.\n③ 여유시간이 0보다 큰 활동은 없다.\n④ 주경로가 두 개 존재한다.",
  "2016_7": "7. 프로젝트 범위가 결정되어 WBS를 작성하려 한다.\nWBS를 작성하기 위해서 필요한 자료로 가장 거리가\n먼 것은?\n① 조직 프로세스 자산\n② 프로젝트 범위기술서\n③ 기업환경요인\n④ 요구사항 추적 매트릭스",
  "2016_8": "8. 지난 해 A사에서 퇴사한 김과장은 B사에 입사하여\n정보시스템 구축 프로젝트의 팀 리더로 일하고 있다.\n김과장은 B사에서 현재 받고 있는 급여가 A사에서\n자신이 받던 급여에 비해 더 나쁘다고 생각하고\n있다. 공정성 이론의 관점에서 김과장이 사용하고\n있는 비교 기준으로 가장 적절한 것은?\n① 자신 - 내부 ② 자신 - 외부\n③ 타인 - 내부 ④ 타인 - 외부",
  "2016_9": "9. 직무 설계에 관한 설명으로 가장 거리가 먼 것은?\n① 직무 설계는 조직 구성원들이 맡아서 처리해야\n할 일을 구체화하여 할당하는 과정이다.\n② 직무 단순화는 직무를 단순하고 반복적인 일로 구성\n하며, 일을 처리하는 절차를 명확하게 규정한다.\n③ 직무 확대는 직무에 관한 권한을 더 많이 허용\n함으로써 자율성과 책임성을 고취한다.\n④ 직무 순환은 직무 담당자가 일정한 기간을 주기로\n다른 직무를 맡도록 하는 방법이다.\n2 -\n\n=== NEW PAGE ===",
  "2016_10": "10. 프로젝트 조직의 특성을 설명한 것 중 가장 적절\n하지 않은 것은?\n① 조직활동의 초점이 직능상 종적인 상호관계를\n갖는다.\n② 인력 구성상 유연성을 꾀할 수 있다.\n③ 조직의 기동성과 환경 적응력을 높일 수 있다.\n④ PM이 과업 수행에 적합한 능력과 지식을 갖추어\n야만 프로젝트의 원활한 진행이 가능하다.",
  "2016_11": "11. 정보화사업 중 의무 감리 대상이 아닌 것은?\n(단, 사업비는 하드웨어, 소프트웨어의 단순\n구입비를 제외한 금액임)\n① 대국민 서비스를 위한 행정업무 처리용으로\n사용하기 위한 2억원 규모의 시스템 개발 사업\n② 여러 중앙행정기관 등이 공동으로 구축하는 3억원\n규모의 시스템 개발 사업\n③ 사업비가 5억원인 정보시스템 구축 사업\n④ 10억원 규모의 정보화전략계획 수립 사업",
  "2016_12": "12. 모바일 웹 페이지 구축 사업의 총괄감리원으로서\n종료단계 감리의 예비조사를 실시할 경우 시스템\n구조 영역의 감리점검 항목으로 가장 적절하지 않은\n것은? (단, 2단계 감리를 수행하며 설계단계\n감리는 완료한 것으로 가정)\n① 모바일 시스템 도입/설치 및 보안환경의 구축을\n충분하게 수행하였는지 여부\n② 모바일 시스템 구성요소에 대한 검증을 적정하게\n수행하였는지 여부\n③ 모바일 시스템 시험 계획을 적정하게 수립\n하였는지 여부\n④ 모바일 시스템 하드웨어 구성 및 용량산정을\n적정하게 수행하였는지 여부\n- 3",
  "2016_13": "13. 전체 60 MD(Man/Day)를 투입한 감리사업에서\n감리인력 배치가 가장 적절하지 않은 것은? (단,\n시스템 개발 사업으로 2단계감리를 실시하며 상주\n/상시감리를 실시하지 않음)\n① 예비조사를 위하여 설계 및 종료단계 감리 실시\n전에 총 2 MD의 상근감리원을 투입하였다.\n② 설계 및 종료 단계 현장 감리에 총 35MD의 감리원을\n투입하였다. 이중 5MD는 비상근감리원이다.\n③ 설계 및 종료 단계 현장 감리에 비 감리원인 정보\n보호 전문가를 감리원으로 20MD를 투입하였다.\n④ 시정조치확인을 위하여 설계 및 종료단계 감리\n후 총 3MD의 상근감리원을 투입하였다.",
  "2016_14": "14. 전자정부법에서 규정한 감리법인 등록을 반드시\n취소해야 하는 위반행위는?\n가. 최근 3년간 3회 이상의 업무정지처분을 받은 경우\n나. 거짓으로 시정조치확인보고서를 작성한 경우\n다. 거짓이나 부정한 방법으로 등록한 경우\n라. 다른 회사에게 자신의 법인 명칭을 사용하여\n정보시스템 감리를 하게 한 경우\n마. 업무정지 기간에 정보시스템 감리를 한 경우\n① 가, 나, 다 ② 가, 다, 마\n③ 다, 라, 마 ④ 나, 라, 마",
  "2016_15": "15. “정보시스템 감리 수행 가이드”의 검사기준서에\n관한 설명 중 적절하지 않은 것은?\n① 검사기준서는 설계단계 감리에서 필수적으로 점\n검되어야 한다.\n② 검사기준서는 요구사항, 검사항목, 검사기준을\n포함하도록 작성되어야 한다.\n③ 검사기준서는 사업자가 작성하고 감리법인이\n확인한 후 발주기관에 제출한다.\n④ 검사기준서는 세부 과업항목별로 이행여부를 점검\n하기 위한 문서로 요구사항추적표를 활용하거나\n별도의 문서로 작성할 수 있다.\n3 -\n\n=== NEW PAGE ===",
  "2016_16": "16. 정보시스템 감리기준이 요구정의 단계 감리에서\n수행해야 하는 활동을 규정하고 있는 내용으로\n빈칸에 가장 적절한 것은?\n- 감리법인은 사업자로부터 요구사항정의서를 제출\n받은 후 ( 가 )에서 정한 과업내용이 요구사항\n정의서에 적정하게 반영되어 있는지를 점검하고\n그 결과를 감리수행결과보고서에 명시하여 발주\n자등에게 제출하여야 한다.\n- 사업자는 요구사항정의서가 세부항목별로 과업\n내용을 반영하고 있는지 여부를 확인할 수 있도록\n( 나 )를 작성하고 발주자 확인을 거쳐 감리\n법인에게 요구정의단계 감리 실시 전까지 제\n출하여야 한다.\n- ( 다 )는 점검결과에 따라 시정조치를 수행하고\n그 결과를 감리법인에게 제출하여야 한다.\n- 감리법인은 시정조치 결과를 제출받은 경우 이를\n확인하고 그 결과를 시정조치확인보고서에 명시\n하여 발주자등에게 제출하여야 한다.\n① 가. 제안요청서 나. 요구사항추적표 다. 발주자\n② 가. 계약문서 나. 대비표 다. 사업자\n③ 가. 과업내용서 나. 대비표 다. 발주자\n④ 가. 제안서 나. 요구사항추적표 다. 사업자",
  "2016_17": "17. “전자정부지원사업 관리지침”에 규정된 주관\n기관의 역할 중 가장 거리가 먼 것은?\n① 사업계획 수립\n② 제안요청서 작성\n③ 사업관리 및 검사\n④ 인수 및 운영평가",
  "2016_18": "18. 현행 전자정부법에 규정된 정보시스템감리법인의\n업무범위에 해당하지 않는 것은?\n① 과업이행 여부 점검\n② 과업범위 및 요구사항의 설계 반영 및 구체화\n여부 검토·확인\n③ 사업수행계획의 계약내용 반영 여부 검토ㆍ확인\n④ 분야별 정보시스템 구축 활동 및 산출물의 품질\n검토ㆍ확인\n- 4",
  "2016_19": "19. 상주감리원에 대한 설명으로 가장 적절하지 않은\n것은?\n① 프로젝트관리(PM) 또는 품질관리(QA) 분야의\n경력이 3년 이상인 수석감리원 등급을 상주\n감리원으로 배치하였다.\n② 상주감리원의 업무 수행에 적합하다고 발주자가\n인정한 등급의 감리원을 상주감리원으로 배치하였다.\n③ 상주감리원으로서 상세공정표에 따른 계획 대비\n실적 점검 및 이행 상태를 확인하였다.\n④ 상주감리원으로서 발주자의 의사결정지원 및\n자문을 수행하였다.",
  "2016_20": "20. “정보시스템 감리점검가이드”의 운영준비 감리\n영역의 점검항목으로 가장 올바르지 않은 것은?\n① 운영환경의 설치 및 배포를 완전하게 수행\n하였는지 여부\n② 초기데이터 구축 및 데이터 전환/검증을 적정하게\n수행하였는지 여부\n③ 시스템 시험 실시 및 검증을 적정하게 수행\n하였는지 여부\n④ 시스템 및 업무 전환을 적정하게 수행하였는지\n여부",
  "2016_21": "21. “행정기관 및 공공기관 정보시스템 구축·운영\n지침”에 따라 보안약점이 없는 소프트웨어를 개발\n하기 위한 내용으로 적합하지 않은 것을 모두 고른\n것은?\n가. SW 유지보수 사업의 개발보안 범위는 반드시\n소스코드 전체이어야 한다.\n나. 감리법인이 SW 보안약점을 진단할 경우 종료\n단계 감리의 세부 검사항목에 SW 보안약점\n제거 여부를 포함하여야 한다.\n다. 감리 대상 정보화 사업이 아닌 경우에는\n사업자로 하여금 보안약점을 진단·제거하게\n할 수 없다.\n① 가 ② 가, 나\n③ 가, 다 ④ 가, 나, 다\n4 -\n\n=== NEW PAGE ===",
  "2016_22": "22. “공공데이터의 제공 및 이용활성화에 관한 법률”에\n근거하여 고시된 “공공기관의 데이터베이스\n표준화 지침”에 따른 데이터베이스 표준화 활동과\n거리가 먼 것은?\n① 정보시스템의 구축·운영 시 공공DB 표준화를\n위하여 코드정의서, 표준용어정의서, 도메인\n정의서를 작성하여야 한다.\n② 다른 공공기관으로부터 제공받아 사용하는 연계\n데이터는 표준 적용여부와 범위를 자체적으로\n선별 적용할 수 있다.\n③ 패키지나 솔루션 형태의 정보시스템 도입 및\n운영 등으로 데이터베이스 산출물 작업이 불가능\n하더라도 엔티티정의서, 논리데이터모델다이어\n그램은 작성되어야 한다.\n④ 데이터 표준 수립, 데이터 표준 적용 및 현행화\n등의 점검표를 활용하여 소관 공공DB의 표준화\n수준을 년 1회이상 정기적으로 점검하여야 한다.",
  "2016_23": "23. “소프트웨어사업 대가산정 가이드”의 소프트웨어\n재개발비 산정 대상 중 가장 거리가 먼 것은?\n① 신규기능 추가\n② 기존기능 수정 후 재사용\n③ 기존기능 삭제\n④ 기존기능 수정 없이 재사용",
  "2016_24": "24. 소프트웨어산업진흥법에서는 SW 품질성능 평가시험\n(BMT) 결과를 제품구매에 반영하도록 하고 있는데\n이와 관련하여 맞게 설명하고 있는 것은?\n① 소프트웨어 제품 구매 금액이 5천만원 이상인\n분리발주 대상 SW는 모두 BMT 대상이 된다.\n② 분리발주 SW를 구매하려는 경우 SW 사업자가 직접\n실시하거나 또는 지정시험기관에 의뢰하여 BMT\n를 실시할 수 있다.\n③ 구매 대상 분리발주 SW에 대해 지정시험기관에서\n이미 BMT를 실시한 결과가 있는 경우에도 각\n사업마다 실시하여야 한다.\n④ 국가기관이 지정시험기관에 의뢰하여 BMT를 실시\n하는 경우 여기에 소요되는 비용은 SW 공급업체에\n일부 부담시킬 수 있다.\n- 5",
  "2016_25": "25. 행정자치부 고시 “전자정부사업관리 위탁에 관한\n규정”에 따라 전자정부사업관리 업무를 위탁받아\n수행하는 전자정부사업관리자의 집행단계 업무로\n맞는 것을 모두 고른 것은?\n가. 현업부서 등의 의견수렴 및 이해관계 조정\n나. 쟁점 및 위험 등의 식별‧분석‧보고 및 대안제시\n다. 의사결정 사항 지시‧관리 및 이행상황 점검\n라. 위탁대상사업의 관리‧감독\n마. 성과목표 설정 등 성과관리 지원\n① 가, 나, 다 ② 나, 다, 라\n③ 다, 라, 마 ④ 나, 라, 마\n5 -\n\n=== NEW PAGE ===\n\n소프트웨어 공학",
  "2017_1": "1. 소프트웨어 형상 관리에 관한 설명으로 가장 거리가\n먼 것은?\n① 형상식별 활동의 대상에 소스코드와 데이터베\n이스는 포함되지만 문서 산출물 등은 제외된다.\n② 소프트웨어 형상관리는 산출물의 품질 향상에\n기여한다.\n③ 테스트에서 결함이 발견되면 프로그램은 수정되고\n버전 통제를 받게 된다.\n④ 대형 소프트웨어 시스템에서는 컴포넌트별로 각각\n상이한 버전들이 존재할 수 있다.",
  "2017_2": "2. 다음 일정 및 원가에 대한 현황 분석표를 보고\n질문에 답하시오.\n활동이름 소요기간 소요원가 직전 선행활동\nA 2 200 -\nB 2 200 A\nC 4 400 A\nD 2 200 A\n프로젝트 시작 시점에서 3일차까지 경과한 프로젝트의\n성과 현황을 파악해보니, 활동A와 활동B는 각각\n100% 완료되었으며, 활동C는 75%, 활동D는 50%가\n진척되었다. 이 프로젝트의 3일차까지의 PV(Planned\nValue)와 EV(Earned Value)를 50-50법칙(rule)을\n적용하여 산정하면 각각 얼마인가?\n① PV=500, EV=800 ② PV=800, EV=700\n③ PV=600, EV=700 ④ PV=700, EV=600",
  "2017_3": "3. ‘프로젝트관리 지식체계 지침서(PMBOK) 5판‘에서 요구사항\n문서를 구성하는 요소 중 가장 적절하지 않은 것은?\n① 수행 조직이 따라야 할 비즈니스 규칙을 포함한\n비즈니스 요구사항\n② 다른 조직 영역에 미치는 영향력을 포함한 이해\n관계자 요구사항\n③ 전환 요구사항\n④ 인수기준을 포함한 해결책 요구사항\n- 2",
  "2017_4": "4. 직무설계 원칙 중 생산성을 높이기 위해 가장\n기본적으로 사용되는 방법은?\n① 직무 충실화 ② 직무 단순화\n③ 직무 확대 ④ 직무 순환",
  "2017_5": "5. 다음과 같이 수행된 A사업의 지체상금 산정을 위한\n지체일수로 가장 적절한 것은?\n- C공공기관의 정보시스템을 구축하는 A사업의 계약\n기간은 1월 1일 ~ 10월 31일까지이다.\n- A사업을 맡은 B사는 계약기간 만료 전에 사업을\n완료하여 10월 15일에 검사를 요청하였다.\n- 검사결과는 불합격이었으며, 10월 25일에 불합격\n통보를 받았다.\n- B사는 불합격통보에 따른 보완을 수행하여 11월\n10일에 재검사를 요청하였다.\n- 재검사결과는 합격이었으며, 11월 15일에 합격통보를\n받았다.\n① 5일 ② 15일 ③ 21일 ④ 31일",
  "2017_6": "6. 프로젝트 일정에서 활동A와 활동B가 있다. 활동A의 소요\n기간(duration)은 2일이며 활동B의 소요기간은 3일로\n계획하고 있다. 두 활동 사이의 의존관계는 시작-시작\n(Start-to-Start)이고, 2일의 선도(Lead) 관계를 갖고\n있다. 연중무휴 근무 조건에서 활동A의 시작일이 7월\n10일이라면 활동B의 예상 종료일로 가능한 것은?\n① 7월 9일 ② 7월 10일\n③ 7월 11일 ④ 7월 12일",
  "2017_7": "7. 프로젝트 관리 과정 다섯 단계(계획, 조직화, 충원,\n지휘, 통제)에 관한 설명으로 가장 거리가 먼 것은?\n① 계획은 목적과 목표를 정하고 이를 달성하기 위한\n행동 방안을 결정하는 것이다.\n② 조직화는 조직 구성원들이 담당할 역할 구조를\n설정하는 것이다.\n③ 충원은 설정된 업무에 인원을 배치하고 인적 자원을\n관리하는 것이다.\n④ 통제는 목표를 달성하도록 동기부여하고 의사소통\n하는 것이다.\n2 -\n\n=== NEW PAGE ===",
  "2017_8": "8. 고객과 개발자가 공동 작업 형태로 요구사항을\n도출하는 방법으로 가장 적절하지 않은 것은?\n① 동료검토(peer review)\n② 요구사항 워크숍\n③ JAD(Joint Application Development)\n④ 일-대-일 인터뷰",
  "2017_9": "9. 과거 축적된 데이터를 이용하여 어떤 프로젝트의\n활동A에 대한 소요기간을 추정하려 한다. 이 데이터에\n의하면, 최소기간이 5일, 최대기간이 17일, 최빈\n기간이 14일이었다. 3점산정법을 이용하여 계산하였\n을 때, 활동A가 9일~17일 사이에 완료될 확률은?\n① 68.3% ② 85.2% ③ 95.5% ④ 99.7%",
  "2017_10": "10. 창의성을 증진하기 위한 다양한 회의진행 기법들\n중 다음에서 설명하고 있는 기법은?\n- 그룹 상호 작용을 방지하여 객관적인 결론을 도출\n할 수 있다.\n- 익명성을 보장하여 자유로운 의견 개진이 가능하다.\n- 개진된 의견들을 피드백 해 줌으로써 의견을 수정\n할 수 있게 해준다.\n① 브레인스토밍\n② 델파이 방법\n③ 명목 집단 기법\n④ 아이디어 맵",
  "2017_11": "11. 리스크 대응 전략 중 위협과 기회에 모두 사용할\n수 있는 전략으로 가장 바람직한 것은?\n① 활용 전략 ② 전가 전략\n③ 공유 전략 ④ 수용 전략",
  "2017_12": "12. 품질 비용에 관한 설명으로 가장 거리가 먼 것은?\n① 신제품 설계의 검토에 소요되는 비용은 예방 비용으로\n간주된다.\n② 통제 비용은 예방 비용과 평가 비용으로 구분할\n수 있다.\n③ 고객 상실로 인한 비용은 내부 실패 비용에 포함된다.\n④ 통제 활동을 강화할수록 실패 비용이 감소한다.\n- 3",
  "2017_13": "13. 변경관리에 관한 설명으로 가장 거리가 먼 것은?\n① 변경 요청의 승인 또는 기각 여부는 보통 변경\n통제 위원회에 의해 결정된다.\n② 변경 통제 위원회는 전략적/조직적 관점보다는\n기술적인 관점에서 변경의 영향을 평가하여야\n한다.\n③ 변경 관리는 필요한 변경을 기술한 변경 요청\n양식을 작성함으로써 시작된다.\n④ 변경 요청이 기각되었을 경우 변경 요청을 제안한\n사람에게 그 이유를 통보해야 한다.",
  "2017_14": "14. ‘정보시스템 감리기준’의 감리 실시시기에 관련한\n내용으로 가장 적절한 것은?\n① 발주자는 감리대상사업의 사업비가 20억원 이상\n이고 사업기간이 6개월 이상인 경우 3단계감리를\n하여야 한다.\n② 2단계감리를 할 경우, 감리법인은 설계단계\n감리에서 요구사항정의서의 과업내용 반영여부\n등을 직접 점검하여야 한다.\n③ 감리대상사업의 위험도·난이도가 높다고 판단\n되는 경우 상주감리를 추가할 수 없다.\n④ 상주감리를 추가로 하는 경우 발주기관이 요구\n사항정의서의 과업내용 반영여부 등을 직접 점검\n하여야 한다.",
  "2017_15": "15. ‘소프트웨어사업 관리감독에 관한 일반기준‘의 ‘소프트\n웨어사업 상세 요구사항 분석·적용기준‘에 있는 요구\n사항 유형에 대한 설명 중 잘못된 것은?\n가. 데이터 요구사항 – 목표 시스템의 서비스에\n필요한 초기자료 구축 및 데이터 변환을 위한\n대상, 방법, 보안이 필요한 데이터 등 데이터를\n구축하기 위해 필요한 요구사항\n나. 시스템 장비 구성 요구사항 - 목표 시스템의\n처리속도 및 시간, 처리량, 동적․정적용량,\n가용성 등 성능에 대한 요구사항\n다. 품질 요구사항 – 목표 사업의 원활한 수행\n및 운영을 위해 관리가 필요한 품질 항목,\n품질 평가 대상 및 목표에 대한 요구사항\n① 가 ② 나 ③ 다 ④ 없음\n3 -\n\n=== NEW PAGE ===",
  "2017_16": "16. 다음 중 ‘정보시스템감리기준‘의 3단계 감리에서\n종료단계의 시정조치확인보고서에 포함되는 항목을\n모두 고른 것은?\n가. 시정조치확인계획\n나. 시정조치확인결과\n다. 과업이행여부 시정조치확인결과\n라. 감리영역별 시정조치확인결과\n① 나, 다, 라 ② 가, 나, 다\n③ 가, 나, 라 ④ 가, 나, 다, 라",
  "2017_17": "17. ‘행정기관 및 공공기관 정보시스템 구축․운영 지침‘에서\n규정한 사항 중 가장 거리가 먼 것은?\n① 행정기관등의 장은 사업자에게 기술적용계획표가\n포함된 제안서 및 사업수행계획서를 제출하게\n하여야 한다.\n② 행정기관등의 장은 운영, 유지보수 등에 필요한\n표준산출물을 지정하여 사업자에게 제출을 요구\n할 수 있다.\n③ 사업자는 운영 및 유지보수를 수행하면서 반복적으로\n수행하는 사항을 매뉴얼로 작성·관리하고, 행정기관\n등의 장이 요구하는 경우 제공하여야 한다.\n④ 사업자는 설계단계 감리 수행시 기술적용결과표를\n작성하여 제출하여야 한다.",
  "2017_18": "18. 다음 중 ‘전자정부법 시행령‘에서 정의하고 있는 감리\n법인의 업무범위에 해당되는 항의 개수는?\n- 사업수행계획의 계약내용 반영 여부 검토·확인\n- 일정 및 산출물 작성계획의 적정성 여부 검토·확인\n- 과업범위 및 요구사항의 설계 반영 및 구체화 여부\n검토·확인\n- 과업 이행 여부 점검\n- 관련 법령등, 규정 및 지침 등의 준수 여부에 대한\n검토·확인\n① 2개 ② 3개 ③ 4개 ④ 5개\n- 4",
  "2017_19": "19. ‘CBD SW개발 표준 산출물 관리 가이드‘에서 제시하고\n있는 표준 산출물과 가장 거리가 먼 것은?\n① 요구사항 추적표\n② 아키텍처 정의서\n③ DB 생성 스크립트\n④ 시스템 설치 결과서",
  "2017_20": "20. ‘정보시스템감리 수행 가이드‘에 제시된 ‘정보화사업\n유형별 표준 점검항목‘ 중 유지보수 사업의 점검\n항목과 가장 거리가 먼 것은?\n① 요구사항 관리의 효율성, 적정성\n② 구성관리, 변경관리 체계를 적정하게 수립하여\n관리하고 있는지 여부\n③ 릴리즈 관리 체계를 적정하게 수립하여 관리하고\n있는지 여부\n④ 장애 및 문제관리 지침/절차를 적정하게 수립하여\n관리하고 있는지 여부",
  "2017_21": "21. 기획재정부 계약 예규인 ‘용역계약 일반조건‘ 중\n‘소프트웨어용역 계약조건‘에서 정의하고 있는 사항과\n가장 거리가 먼 것은?\n① 핵심 개발인력이 아닌 지원인력의 근무장소는\n보안 등 특별한 사유가 있는 경우를 제외하고는\n계약상대자가 달리 정할 수 있다.\n② 과업내용 변경에 따른 계약금액의 조정액이 당초\n계약금액의 100분의 5 이상으로 추정될 경우에는\n위원회를 설치하여 과업변경 심의를 하여야 한다.\n③ 계약기간 내에 용역을 완성한 후 검사가 완료된\n때에는 인력의 투입도 종료된다.\n④ 계약상대자는 계약담당공무원이 검사에 의하여\n사업의 완성을 확인한 후 1년간(별도의 관련\n법률에서 따로 정하고 있는 경우는 제외) 계약\n목적물의 하자에 대한 보수책임이 있다.\n4 -\n\n=== NEW PAGE ===",
  "2017_22": "22. 다음 중 ‘전자정부법 시행령‘ 및 ‘정보시스템 감리\n기준‘에서 규정한 정보시스템 감리원 계속교육에\n관한 내용으로 맞는 것을 모두 고른 것은?\n가. 감리업무와 관련된 최신 지식의 지속적인 습득\n및 기술능력 유지를 위한 교육이다.\n나. 모든 등급의 감리원이 받아야 하는 교육이다.\n다. 감리원증을 교부 받은 후 1년이 경과한 경우는\n계속교육을 받아야 하는 사유가 된다.\n라. 교육시간은 3년마다 40시간 이상이다.\n① 가, 나, 다 ② 가, 다, 라\n③ 나, 다, 라 ④ 가, 나, 다, 라",
  "2017_23": "23. ‘SW사업 대가 산정 가이드‘에서 대가산정 방법의\n대가 산정식으로 틀린 것은?\n① 투입공수 방식에 의한 소프트웨어 개발비 = 직접\n인건비 + 제경비 + 기술료 + 직접경비 + 이윤\n② 기능점수 방식에 의한 소프트웨어 개발비 = 개발\n원가 + 직접경비 + 이윤\n③ 요율제 방식에 의한 소프트웨어 유지관리비 =\nSW개발비(현재가치) × 유지관리요율 + 직접경비\n④ 소프트웨어 재개발비 = 보정후 재개발원가 + 직접\n경비 + 이윤",
  "2017_24": "24. WBS(작업분할구조)에 관한 설명으로 가장 거리가\n먼 것은?\n① 작업 패키지들의 상세도 수준은 프로젝트의 규모와\n복잡도에 따라 달라진다.\n② WBS는 조직도(organizational chart), 생선뼈\n그림(fishbone diagram) 등과 같은 다양한 형태로\n표현될 수 있다.\n③ WBS에서 적용할 수 있는 100% 규칙(rule)은\n동일한 수준의 작업들 간에 중복을 허용한다.\n④ 과도한 분할은 자원의 비효율적 활용, 작업 수행\n능률의 저하 등을 초래할 수 있다.\n- 5",
  "2017_25": "25. 다음 프로젝트 네트워크에서 주경로기법을 적용\n할 때 여유시간이 0이 아닌 단위작업(node)은?\n① B ② G ③ H ④ I\n5 -\n\n=== NEW PAGE ===\n\n소프트웨어 공학",
  "2018_1": "1. PMBOK ◯R Guide(6판)에서 주공정 경로(critical path)를\n변경하지 않으면서, 프로젝트에 대한 자원요구사항이 미리\n정해진 자원한도를 초과하지 않도록 일정모델의 활동을\n조정하는 기법으로 가장 적합한 것은?\n① 자원평준화 ② 자원균형화\n③ 자원평활화 ④ 자원제한화",
  "2018_2": "2. 획득일정(earned schedule)을 설명한 것 중 적절하지 않은\n것은?\n① 획득일정 이론은 획득일정(ES), 실제시간(AT) 및 예상\n기간을 사용하여 프로젝트 완료일을 예측하는 공식도\n제시한다.\n② 기존의 획득가치관리(EVM)에 사용된 일정차이(SV) 측정\n치를 획득일정(ES) 및 실제시간(AT)으로 대체한다.\n③ 획득일정지표를 사용한 일정성과지수(SPI)는 실제시간\n(AT)/획득일정(ES)으로 표시한다.\n④ 획득일정(ES)이 0보다 큰 경우 프로젝트는 일정보다\n앞선 것으로 간주된다.",
  "2018_3": "3. PMBOK ◯R Guide(6판)에서 프로젝트 통합 변경통제를 설명\n한 것 중 가장 적절하지 않은 것은?\n① 프로젝트 시작에서부터 완료시점까지 수행되는 통합\n변경통제 수행 프로세스의 최종책임자는 프로젝트\n관리자이다.\n② 기준선이 설정되기 전에 통합 변경통제 수행 프로세스를\n통해 공식적으로 변경요청을 통제할 필요가 없다.\n③ 구두요청으로 변경을 접수해서는 안 되며, 변경사항은\n반드시 서면형식으로 기록하여야 한다.\n④ 변경사항은 변경관리 및 형상관리 시스템에 입력하여야\n한다.\n- 2",
  "2018_4": "4. 프로젝트 구성원의 동기부여를 위해 매슬로우의 욕구단계가\n활용된다. 매슬로우 5가지 욕구단계를 순서대로 올바르게\n나열한 것은?\n가. 존경욕구 나. 사회적욕구\n다. 생리적욕구 라. 자아실현욕구 마. 안전욕구\n① 다, 마, 나, 가, 라 ② 다, 나, 가, 라, 마\n③ 다, 마, 가, 나, 라 ④ 다, 나, 마, 가, 라",
  "2018_5": "5. 사업부제 조직의 장점으로 가장 거리가 먼 것은?\n① 각 사업부는 사업목표와 제품을 강조하고 이익 및 책임\n중심으로 운영되므로 경영성과가 향상된다.\n② 환경변화에 대하여 신속하고 탄력적으로 대응할 수 있다.\n③ 관리자를 양성하고 종업원을 동기부여 시키는데 도움을 준다.\n④ 사업부간 협조가 용이하고 과당경쟁이 발생하지 않으며\n공통관리비가 줄어든다.",
  "2018_6": "6. 프로젝트 팀 관리를 위해 사용하는 책임배정 매트릭스\n(RAM : Responsibility Assignment Matrix)를 설명한 내\n용으로 가장 거리가 먼 것은?\n① 프로젝트 범위(project scope)의 각 구성요소가 담당자\n또는 담당조직에게 배정될 수 있도록 표시한 것이다.\n② OBS(Organizational Breakdown Structure)를 WBS(Work\nBreakdown Structure)와 연계시킨 것이다.\n③ 한 그룹에 연관된 모든 활동 혹은 활동에 연관된 모든\n사람이나 조직을 확인할 수 있다.\n④ 직무의 내용을 텍스트 형태로 상세히 기술한 직위설명서\n(position description)이다.",
  "2018_7": "7. 명목집단법(nominal group technique)에 대한 설명으로\n가장 거리가 먼 것은?\n① 사실의 발견, 아이디어 생성, 그리고 최종 의사결정에\n사용될 수 있다.\n② 소그룹으로 편성된 참석자들의 원활한 논의와 토론\n을 통해 사실을 도출한다.\n③ 도출된 아이디어 목록에 대해서 각자 보조 설명이나\n지지하는 이유를 설명한다.\n④ 마무리 단계에서 구성원들이 순위를 매긴 결과를 종합\n하여 최고 득표한 안을 채택한다.\n2 -\n\n=== NEW PAGE ===",
  "2018_8": "8. “4,000시간의 코딩이 필요하고 1년 안에 코딩을 완료해야\n하는 경우 2명의 코딩 담당자가 필요하다”는 등의 계량화된\n자료를 기반으로 더 높은 정확도의 자원산정을 한다면, 이\n방식은 다음 중 어느 방법에 가장 가까운가?\n① 전문가 판단법 ② 상향식 산정법\n③ 유사 산정법 ④ 모수 산정법",
  "2018_9": "9. 획득가치관리(EVM)를 사용하여 수행 중인 프로젝트의\nEV(Earned Value)가 7,300만원, PV(Planned Value)가\n8,200만원, AC(Actual Cost)가 7,750만원 일 때,\nSV(Schedule Variance)는 얼마인가?\n① -900만원 ② 900만원 ③ 450만원 ④ -450만원",
  "2018_10": "10. 네트워크 다이어그램(network diagram)중 ADM(Arrow\nDiagramming Method)에 대한 다음 설명 중 가장\n적절하지 않은 것은?\n① 활동(activity)을 화살표로 표현하는 방식이다.\n② 더미 활동(dummy activity)을 사용할 수 있다.\n③ 선후관계로서 FS, FF, SF, SS 등 다양한 관계를 나타\n내기 용이하다.\n④ 순환루프 관계 또는 조건부 분할을 표현하기는 어렵다.",
  "2018_11": "11. 프로젝트 품질 관리에 관한 설명 중에 맞는 것을 모두\n고른 것은?\n가. 실수를 예방하는 비용은 그 실수가 검사에서 발견되었\n을 때 수정하는 비용보다 저렴하다.\n나. 품질 개선 운동은 프로젝트 제품의 품질 만이 아니라\n프로젝트 자체의 품질도 개선시켜야 한다.\n다. 통제한계(control limit) 밖으로 벗어나면 불량이\n발생했음을 의미한다.\n라. 속성 샘플링(attribute sampling) 결과는 부합하는 정\n도를 나타내는 연속적인 척도이다.\n① 가, 나 ② 다, 라\n③ 가, 다 ④ 나, 라\n- 3",
  "2018_12": "12. 프로젝트 인적자원관리에 사용되는 도표·도구 중에서\n팀원의 투입 시점, 팀원 파견의 해제 시점을 한눈에 알\n수 있게 해주는 것으로 가장 적합한 것은?\n① 자원 간트 차트 ② 자원충원 매트릭스\n③ 자원분류체계도 ④ 자원 히스토그램",
  "2018_13": "13. 주공정법(CPM)을 사용하여 다음과 같은 프로젝트 네트\n워크 일정에서 프로젝트 전체 일정에 영향을 주지 않으\n면서 3일을 지연시킬 수 있는 단위작업(node)은?\n( ) 안의 숫자는 작업소요 일(day) 수를 나타냄\n① B ② C ③ E ④ F",
  "2018_14": "14. ‘공공데이터 관리지침’에서는 기계 판독이 가능한 형태의\n공공데이터 포맷 단계를 5단계로 정의하고 있다. 다음 중\n단계와 지침에서 예시된 해당 단계의 파일포맷을 짝지은\n것 중 가장 거리가 먼 것은?\n① 2단계 - XLS ② 3단계 - CSV\n③ 4단계 - XML ④ 5단계 - LOD",
  "2018_15": "15. ‘전자정부사업관리 위탁에 관한 규정’중 전자정부사업\n관리자의 업무와 가장 거리가 먼 것은?\n① 사업계획 수립 등 사업기획 지원\n② 쟁점 및 위험 등의 식별·분석 및 대안제시\n③ 위탁대상사업 및 위탁용역에 관한 의사결정 및 보고\n체계 정립\n④ 의사결정 사항 지시·관리\n3 -\n\n=== NEW PAGE ===",
  "2018_16": "16. ‘용역계약 일반조건’에 따라 지체기간 산정과정을 가장\n적절하게 표현한 것은? (보기의 용어는 용역계약 일\n반조건의 용어를 기준으로 한다.)\n①\n용역목적물\n용역계수행기한 검사 합격일\n제출일\n(N일) (N + 5일)\n(N - 5일)\n→ 시간의\n↓ ⇓ ↓\n흐름\n지체기간\n②\n용역목적물\n용역계수행기한 검사 합격일\n제출일\n(N일) (N+10일)\n(N+3일)\n⇓ ↓ ↓ → 시간의 흐름\n지체기간\n③\n용역목적물 시정조치를 최종 검사\n용역계수행기한\n제출일 한 날 합격일\n(N일)\n(N - 5일) (N + 5일) (N + 10일)\n→ 시간의\n⇓ ↓ ↓ ↓\n흐름\n지체기간\n④\n용역목적물 시정조치를 최종 검사\n용역계수행기한\n제출일 한 날 합격일\n(N일)\n(N+3일) (N + 5일) (N + 10일)\n→ 시간의\n⇓ ↓ ↓ ↓\n흐름\n지체기간",
  "2018_17": "17. 아래의 사업에 ‘전자정부법’, ‘전자정부법 시행령’,\n‘정보시스템 감리기준’을 적용할 경우에 대한 설명\n중 가장 적절하지 않은 것은?\n< 온라인 신고시스템 구축 사업계획서 >\nㅇ 사업명 : 온라인 신고시스템 구축 사업\nㅇ 발주기관 : MM광역시 NN지방공사(「지방공기업법」에\n따른 지방공사)\nㅇ 사업기간 : 2018.05.01. ~ 2018.11.15.\nㅇ 사업내용 : 발주기관에서 건설한 임대아파트에 대한\n유지보수 온라인 신고 홈페이지 구축\nㅇ 예산 : 6억원(부가세 포함)\n- 시스템 개발비 : 4.5억원\n- DB서버 등 HW 단순 구입비 : 1.5억원\n- 4\n① 해당 사업은 정보시스템 감리 의무 대상이다.\n② 해당 사업에 대해 전자정부사업관리를 위탁한\n경우에는 정보시스템감리를 생략할 수 있다.\n③ 해당 사업에 대해 정보시스템감리를 수행할 경우\n2단계 감리를 하게 할 수 있다.\n④ 해당 사업에 대한 정보시스템감리대가 산정시 감리\n대상사업비 보정금액은 1.5억원에 0.456을 곱한\n금액과 4.5억원을 더한 금액이다.",
  "2018_18": "18. ‘정보시스템 감리기준’에서 규정하고 있는 감리업무와\n관련되어 설명한 것 중 가장 적절하지 않은 것은?\n① 요구정의단계 감리 시, 사업자는 요구사항정의서가\n세부항목별로 과업내용을 반영하고 있는지 여부를\n확인할 수 있도록 대비표를 작성하고 발주자 확\n인을 거쳐 감리법인에게 요구정의단계 감리 실시\n전까지 제출하여야 한다.\n② 요구정의단계 감리 시, 감리법인은 사업자로부터\n요구사항정의서를 제출받은 후 계약문서에서 정한\n과업내용이 요구사항정의서에 적정하게 반영되어\n있는지를 점검하고 그 결과를 감리수행결과보고\n서에 명시하여 발주자 등에게 제출하여야 한다.\n③ 요구정의단계 감리 시, 사업자는 감리법인의 점\n검결과에 따라 시정조치계획을 수립하여 감리법\n인에게 제출하여야 한다.\n④ 종료단계 감리 시, 감리법인은 감리대상사업 검사\n전까지 세부 검사항목별 과업내용 이행여부를 점\n검하고 그 결과를 감리수행결과보고서에 적합·\n부적합으로 명시하여 발주자 등에게 제출하여야 한다.",
  "2018_19": "19. 다음 중 ‘정보시스템감리 수행가이드’에서 제시하고\n있는 ‘정보화전략계획수립 사업’에 대한 표준 점검\n항목 중 ‘현황분석 및 전략수립’ 감리시점에 적용\n할 점검항목과 가장 거리가 먼 것은?\n① 업무관련 사용자 요구사항 도출 및 분석의 충분성\n② 정보화 관점에서의 개선과제 도출이 적정한지 여부\n③ 보안정책 수립 및 위험분석을 적정하게 수행하였\n는지 여부\n④ 정보화 성과관리 체계를 적정하게 수립하였는지 여부\n4 -\n\n=== NEW PAGE ===",
  "2018_20": "20. 다음 중 ‘정보시스템감리 수행가이드’에서 제시하고\n있는 ‘시스템 개발 사업’에 대한 표준 점검항목 중\n‘시험’ 감리시점에 적용할 점검항목과 가장 거리가\n먼 것은?\n① 시험환경을 충분하게 구축하였는지 여부\n② 통합 시험 계획을 적정하게 수립하였는지 여부\n③ 시스템 시험 실시 및 검증을 적정하게 수행하였\n는지 여부\n④ 시스템 최적화 활동을 적정하게 수행하였는지 여부",
  "2018_21": "21. ‘전자정부사업관리 위탁에 관한 규정’에서 상호간에\n사회통념상 독립성을 침해할 수 있는 특수관계가\n없도록 하여야 할 대상으로 맞는 것을 모두 고른\n것은?\n가. 전자정부사업관리자\n나. 위탁대상사업 수행자\n다. 감리법인\n라. 발주기관\n① 가, 나 ② 가, 다\n③ 가, 나, 다 ④ 가, 나, 다, 라",
  "2018_22": "22. ‘행정기관 및 공공기관 정보시스템 구축·운영지침’\n에서 규정한 보안약점 진단절차 내용과 가장 거리\n가 먼 것은?\n① 행정기관 등의 장은 정보화사업 감리를 수행하는\n경우, 감리법인으로 하여금 사업자가 소프트웨어\n보안약점을 제거하였는지 진단하도록 하여야 한다.\n② 감리법인은 종료단계 감리 시 세부 검사항목에\n소프트웨어 보안약점 제거 여부를 포함하여야 한다.\n③ 감리법인은 소프트웨어 보안약점을 진단할 경우\n소프트웨어 보안약점 진단원을 반드시 배치하여야\n한다.\n④ 감리법인이 소프트웨어 보안약점 진단과정에서\n소프트웨어 보안약점 진단도구를 사용할 경우에는\n국가정보원장이 인증한 보안약점 진단도구를\n사용하여야 한다.\n- 5",
  "2018_23": "23. ‘정보시스템감리 수행 가이드’에 따라 감리원이 과업\n내용 이행여부를 점검한 결과이다.“적/부 판정”으로 가장\n적절하지 않은 것은?\n① 점검 과정에서 테스트 환경이 준비되지 않아 “점\n검제외”로 판정하였다.\n② 발주기관의 요청에 의해 진행 중인 경우라서 “점\n검제외”로 판정하였다.\n③ 선행 기능의 결함으로 점검하지 못한 경우라서\n“부적합”으로 판정하였다.\n④ 검사기준의 검사방법에 따라 점검한 결과가 예상\n결과와 판정기준에 부합하지 않아 “부적합”으로\n판정하였다.",
  "2018_24": "24. ‘정보시스템 감리원 윤리 가이드’에 따르면 정보시스템\n감리원이 감리현장에서 다음과 같은 행위를 한 경우,\n위반한 윤리성 준수 요소로 가장 적합한 것은?\n- 감리기준을 지키지 아니하고 감리업무를 수행\n한 경우\n- 거짓으로 감리보고서를 작성한 경우\n① 공익의 달성\n② 객관성과 공정성 유지\n③ 준법성 및 비밀에 대한 보안유지\n④ 전문성 유지",
  "2018_25": "25. ‘정보시스템 감리기준’의 감리대가 산정기준과 ‘정보\n시스템감리 발주·관리 가이드’에서 정의하고 있는\n사항과 가장 거리가 먼 것은?\n① 감리대상사업비는 감리 대상사업의 부가가치세를\n포함한 실제 계약금액을 적용한다.\n② 감리대가는 기본감리비, 직접경비, 부가가치세의\n합계액으로 산정한다.\n③ 행정기관 등의 지방이전으로 인해 감리가 지방에서\n수행되는 경우가 발생함에 따라 참여감리원에\n대한 여비를 직접경비로 산출할 수 있다.\n④ 추가감리 및 상주감리에서의 투입공수는 일\n단위로 계산하되 월 단위인 경우 한국소프트웨어\n산업협회의 ‘SW기술자 평균임금 공표’에 제시된\n“월평균 근무일수”를 적용한다.\n5 -\n\n=== NEW PAGE ===\n\n소프트웨어 공학",
  "2019_1": "1. 다음 네 가지 리스크 중에서 리스크 대응 효율\n성 평가를 위한 리스크 감소 레버리지(RRL :\nRisk Reduction Leverage)가 가장 큰 것은?\n리스크 노출도\n리스크 목록 리스크 감소 비용\n조치 전 조치 후\nA 200 100 200\nB 200 50 200\nC 200 100 100\nD 200 50 100\n① A ② B ③ C ④ D",
  "2019_2": "2. 팀 구축에 관한 터크맨(Tuckman)의 사다리 모형에서\n일반적인 팀 개발의 발생 순서에 따른 일부 단계\n들의 차례를 올바르게 나열한 것은?\n① 규범화(norming)→폭풍(storming)→수행(performing)\n② 수행(performing)→폭풍(storming)→규범화(norming)\n③ 폭풍(storming)→수행(performing)→규범화(norming)\n④ 폭풍(storming)→규범화(norming)→수행(performing)",
  "2019_3": "3. 프로젝트에 배정된 총 예산은 120이다. T 시점에서\n계획 가치(PV)는 100이고, SPI(Schedule Performance\nIndex)는 1.10이다. 계획 가치와 실제 비용의 차이가\n뚜렷한 추세 없이 0을 중심으로 불규칙하고 무작위로\n변동하고 있다. 향후 모든 작업이 예산 책정 비율로\n완수될 것이라고 가정 할 때, 완료까지 추정치(ETC :\nEstimation to Completion)는 얼마인가?\n① 10 ② 20 ③ 1.10 ④ 1.20",
  "2019_4": "4. 프로젝트 활동의 순서를 정할 때 사용하는 도구와\n기법에 관한 설명 중에서 맞는 설명을 모두 고른 것은?\n가. 경주가 끝날 때까지 시상식은 열릴 수 없는 경우를\n나타내는 의존관계는 finish-to-finish이다.\n나. 패스트 트래킹(fast tracking) 기법을 적용할 때,\n의무적 의존관계는 수정이나 제거가 검토될 수 있다.\n다. 리드(leads)는 후행 활동이 선행 활동에 대하여\n당겨질 수 있는 시간의 양을 말한다.\n① 가 ② 나 ③ 다 ④ 가, 나, 다\n- 2",
  "2019_5": "5. 다음 프로젝트 진도관리에 사용하는 간트차트(gantt\nchart)에 대한 설명 중 가장 거리가 먼 것은?\n① 간트차트는 단위작업 사이의 잠재적으로 연계성이\n약한 지점을 파악하기 어렵다.\n② 간트차트는 예상치 못한 지연으로 인한 프로젝트\n팀의 문제를 파악하기 어렵다.\n③ 간트차트는 일정상 중요한 단위작업에 필요한\n각종 자원 및 지원사항을 조율하는데 약점이 있다.\n④ 간트차트는 단위작업의 계획된 상태와 실제 상태의\n차이를 표현하기 어렵다.",
  "2019_6": "6. A 프로젝트에서 현재까지 특정 단위작업이 약 3분의 2\n정도까지 완료된 상태라고 한다. 이때 이 단위작\n업의 진도율 평가에서 가장 높은 진척도를 나타낼\n수 있는 계산 원칙은?\n① 완료율법 ② 0/100의 원칙\n③ 20/80의 원칙 ④ 50/50의 원칙",
  "2019_7": "7. 다음 중 애자일(agile) 소프트웨어 개발 프로젝트\n방식을 설명하는 내용으로 가장 적절한 것은?\n① 프로세스와 도구의 효과적 적용을 강조한다.\n② 동작하는 소프트웨어에 가치를 두기 보다는 포괄적\n문서화를 강조한다.\n③ 고객과의 협력을 강조한다.\n④ 계획에 의한 실행방법을 강조한다.",
  "2019_8": "8. 어느 프로젝트팀에서 개략적인 소요기간이 27주로\n산정된 프로젝트에서, 가장 낙관적으로는 2주를\n줄일 수 있고, 가장 비관적으로는 5주 지연 가능\n성을 보고했다. 베타분포를 이용한 PERT 3점 기법을\n적용하여 산출한 프로젝트 기간 산정 결과(반올림\n처리)는 얼마인가?\n① 25주 ② 26주 ③ 27주 ④ 28주",
  "2019_9": "9. 프로젝트 품질관리에서 사용하는 다음 도구 및 기\n법 중에서 어떤 결함 유형이 가장 흔한지 범주화\n하여 표현하기 위해 사용되는 것은?\n① 관리도 ② 파레토 차트\n③ 런 차트 ④ 흐름도\n2 -\n\n=== NEW PAGE ===",
  "2019_10": "10. 다음 중 KS A ISO 21500에서 리스크를 통제하는\n방법으로 가장 적절하지 않은 것은?\n① 회의 ② 기술적 성과 측정\n③ 예비분석 ④ 델파이 방법",
  "2019_11": "11. 리스크 관리의 촉발(prompt)목록은 대개 이전의\n유사한 프로젝트에서 나타난 축적된 정보와 지식을\n바탕으로 개발된다. 다음 중 리스크 촉발목록에\n대한 설명 중 가장 적절하지 않은 것은?\n① 리스크 분류체계 최하위 단계의 리스크 범주를 개\n별 프로젝트 리스크의 촉발목록으로 사용가능하다.\n② 포괄적 프로젝트 리스크보다 개별 프로젝트 리스\n크를 평가하는 데는 촉발목록에 비해 PESTLE*,\nTECOP**, 또는 VUCA***와 같은 프레임워크가 보\n다 적합하다.\n③ 촉발목록은 리스크 식별을 위한 아이디어 생성에\n사용할 수 있다.\n④ 촉발목록은 포괄적 프로젝트 리스크 유발원 역할도\n할 수 있는 리스크 범주의 미리 결정된 목록이다.\n* PESTLE(Political, Economic, Social, Technological,\nLegal, Environmental)\n** TECOP(Technical, Environmental, Commercial, Operational,\nPolitical)\n*** VUCA(Volatility, Uncertainty, Complexity, Ambiguity)",
  "2019_12": "12. 조직구조를 설계할 때 고려해야 할 6가지 핵심\n요소가 있다. 다음 중 6가지 핵심요소에 포함되지\n않는 것은?\n① 업무전문화 ② 공식화\n③ 지속화 ④ 부서화",
  "2019_13": "13. 프로젝트 원가는 모든 프로젝트 활동에 대해 추정되며\n원가기준선을 설정하기 위해 집계된다. 다음 중 원가\n기준선에 대한 설명 중 가장 적절하지 않은 것은?\n① 작업패키지에 대해 산정된 모든 우발사태 예비와\n함께 작업패키지 원가 산정치가 통제단위로 집계된다.\n② 승인된 시간 단계별 프로젝트 예산이다.\n③ 원가기준에는 관리예비를 포함한 모든 승인된 예산이\n포함된다.\n④ 원가기준선은 'S' 곡선의 형태로 표시될 수 있다.\n- 3",
  "2019_14": "14. 다음 중 ‘전자정부법 및 동법 시행령’에 따라\n정보시스템 감리를 생략할 수 있는 사업을 모두\n고른 것은? (단, 사업비는 총사업비 중에서 하드\n웨어·소프트웨어의 단순한 구입비용을 제외한\n금액을 말함)\n가. 사업비가 4억원이고 사업기간이 5개월인\n대국민 서비스를 위한 행정업무 또는 민원\n처리용 전자정부 사업으로, 전자정부사업관\n리를 위탁한 경우\n나. 사업비가 5억원이고 사업기간이 4개월인 여러\n중앙행정기관 등이 공동으로 구축하거나 사용\n하는 전자정부 사업으로, 전자정부사업관리를\n위탁한 경우\n다. 사업비가 5억원이고 사업기간이 4개월인 정보\n시스템 구축사업으로, 전자정부사업관리를 위\n탁한 경우\n① 가, 나 ② 가, 다\n③ 나, 다 ④ 가, 나, 다",
  "2019_15": "15.‘전자정부법 시행령’에 규정된 위반행위별 1차\n행정처분 기준으로 가장 적절한 것은?\n처분기준\n위반행위\n(1차)\n감리기준을 지키지 아니하고 감리업무를\n(가)\n수행한 경우\n감리원이 아닌 사람에게 감리업무를 수행\n(나)\n하게 한 경우\n거짓으로 감리보고서를 작성한 경우 (다)\n다른 사람에게 자기의 명칭을 사용하게\n(라)\n하여 정보시스템 감리를 하게 한 경우\n① (가) 경고 (나) 경고\n(다) 업무정지 6개월 (라) 업무정지 6개월\n② (가) 경고 (나) 업무정지 6개월\n(다) 경고 (라) 업무정지 6개월\n③ (가) 업무정지 6개월 (나) 경고\n(다) 업무정지 6개월 (라) 경고\n④ (가) 업무정지 6개월 (나) 경고\n(다) 경고 (라) 업무정지 6개월\n3 -\n\n=== NEW PAGE ===",
  "2019_16": "16.‘정보시스템 감리기준’에 규정된 종료단계 감리\n절차 내용이다. 빈칸에 가장 적절한 것은?\n- 사업자는 최종 산출물이 세부항목별로 과업내용을\n반영하였는지 여부를 확인할 수 있도록 (가)를\n작성하고 (나) 확인을 거쳐 (다)에게 종료단계\n감리 실시 전까지 제출하여야 한다.\n- 감리법인은 감리대상사업 (라)까지 세부 검사\n항목별 과업내용 이행여부를 점검하고 그 결과를\n감리수행결과보고서에 적합·부적합으로 명시하여\n발주자등에게 제출하여야 한다.\n① (가) 대비표 (나) 발주자\n(다) 감리법인 (라) 검사 전\n② (가) 대비표 (나) 감리법인\n(다) 발주자 (라) 검사 기한\n③ (가) 과업대비표 (나) 발주자\n(다) 감리법인 (라) 검사 전\n④ (가) 과업대비표 (나) 감리법인\n(다) 발주자 (라) 검사 기한",
  "2019_17": "17. 다음 중‘정보시스템 감리 점검가이드(구 감리지침)’의\n점검프레임워크에 제시된 사업유형에 해당되는 것은\n모두 몇 개인가?\n가. 정보기술아키텍처 구축 나. 정보화전략계획 수립\n다. 업무재설계 라. 정보시스템 마스터플랜\n마. 시스템 개발 바. 데이터베이스구축\n사. 시스템 운영 아. 유지보수\n① 5개 ② 6개 ③ 7개 ④ 8개",
  "2019_18": "18.‘정보시스템 감리 수행 가이드’의 종료단계 감리 시\n과업내용 이행여부에 관한 점검방법으로 가장\n적절하지 않은 것은?\n① 과업이행여부 점검은 검사항목 단위로 실시한다.\n②“적/부 판정”이 “부적합”인 경우 반드시 관련\n증빙을 첨부하여야 한다.\n③“완료여부”는 사업자가 제출한 결과를 기초로\n실제 완료여부를 확인하여 기록한다.\n④“완료여부”가 “진행 중”인 경우에는 종료단계\n이므로 발주기관의 요청이나 합의에 의하여 진행\n중인 경우는 “적합”으로 판정하고, 이외에 미\n완료된 과업은 “부적합”으로 판정한다.\n- 4",
  "2019_19": "19.‘정보시스템 감리기준’에 규정된 내용이다. 빈 칸\n에 가장 적절한 것은?\n- 발주자는 감리법인으로 하여금 3단계 감리를\n하게 하여야 한다. 다만, 감리대상사업의\n사업비가 (가)억원 미만이거나 사업기간이 (나)\n개월 미만인 경우 2단계 감리를 하게 할 수 있\n다.\n- 감리법인은 해당 감리업무 수행에 필요한 자격·\n경력·교육 등 능력과 경험을 갖춘 사람을 감리\n인력으로 배치하여야 한다. 감리인력은 전체\n투입공수의 (다)퍼센트 이상을 해당 감리법인\n소속의 상근 감리원으로 배치하여야 하며 전체\n감리인력의 (라)퍼센트 범위 내에서 유비쿼터스\n기술, 모바일, 정보보호, 법률·회계, 국방 등\n다른 분야의 전문가를 배치할 수 있다.\n① (가) 20 (나) 6 (다) 50 (라) 30\n② (가) 10 (나) 9 (다) 50 (라) 30\n③ (가) 20 (나) 6 (다) 75 (라) 50\n④ (가) 10 (나) 9 (다) 75 (라) 50",
  "2019_20": "20.‘행정기관 및 공공기관 정보시스템 구축·운영 지침’에\n따른 정보화사업의 원가 산정 방법으로 가장 거리가\n먼 것은?\n①‘DB 구축비 대가기준 가이드’를 적용하여 원가를\n산정한다.\n② 조달품목인 경우 조달단가를 적용하여 하드웨어\n구입비를 산정한다.\n③ 조달품목이 아닌 경우 최근 도입가격 또는 유사한\n거래 실례가격을 적용하여 하드웨어 구입비를 산정한다.\n④ 조달품목이 아니고 유사 거래를 찾을 수 없는 경우\n3개 이상의 공급업체로부터 직접 받는 견적가격의\n평균값을 적용하여 하드웨어 구입비를 산정한다.",
  "2019_21": "21.‘SW사업 대가산정 가이드’의 기능점수 방식에 따라\n소프트웨어 개발비를 산정할 때 적용하는 보정요소만\n으로 묶인 것은?\n가. 성능 나. 개발 언어\n다. 보안성 라. 애플리케이션 유형\n마. 연계복잡성\n① 가, 나, 라 ② 가, 다, 마\n③ 나, 라, 마 ④ 나, 다, 라\n4 -\n\n=== NEW PAGE ===",
  "2019_22": "22.‘전자정부 성과관리 지침’에 따라 사전협의 신청이\n있을 경우 협의기관의 장이 종합적으로 검토하는 사\n항에 해당되는 것은 모두 몇 개인가?\n가. 사업계획의 중복성 등 다른 전자정부사업과의\n중복투자에 관한 사항\n나. 다른 전자정부사업 또는 정보시스템과의 연계\n추진 및 공동이용 등에 관한 사항\n다. 추진하고자 하는 전자정부사업 또는 정보시스템의\n성과측정 결과의 반영에 관한 사항\n라. 사업에 적용되는 신기술 관련 과업의 적정성에 관한 사항\n마. 사업내용의 명확성 및 구체성에 관한 사항\n바. 사업에 소요되는 기간의 적정성에 관한 사항\n사. 클라우드 이용여부의 적정성에 관한 사항\n① 4개 ② 5개 ③ 6개 ④ 7개",
  "2019_23": "23.‘공공 데이터 개방 사업수행 방법론 v2.0’을 적용하고\n있는 사업에 대하여 수행과제 간의 연관관계 (가),\n(나)로 가장 적절한 것은?\n수요자 중심\n데이터 개방\n개방 DB 구축 오픈 API 개발\n(가) (나)\n품질진단 및 개선\n① (가) 데이터 셋 표준화 (나) 코딩 가이드\n② (가) 개방 데이터 정제 (나) 코딩 가이드\n③ (가) 개방 데이터 정제 (나) 데이터 셋 표준화\n④ (가) 코딩 가이드 (나) 데이터 셋 표준화",
  "2019_24": "24.‘SW사업 대가산정 가이드’에는 단위기능 산정시\n공통적으로 발생하는 오류가 정리되어 있다. 이\n가이드에서 권고한 단위기능 산정에 관한 해설 내용과\n가장 거리가 먼 것은?\n① 데이터 적재는 외부입력(EI)으로 산정하는 것이 타당함\n② 사용자 인증은 외부조회(EQ)로 산정하는 것이 타당함\n③ 통계 기능은 외부출력(EO)으로 산정하는 것이 타당함\n④ 로그 데이터는 내부논리파일(ILF)로 산정하는 것이\n타당함\n- 5",
  "2019_25": "25.‘공공데이터 품질관리 매뉴얼 v2.0’에서 개별 DB의\n품질 오류율 산정 시 고려되지 않는 것은?\n① 값 오류율 ② 구조 오류율\n③ 표준 오류율 ④ 접근 오류율\n5 -\n\n=== NEW PAGE ===\n\n소프트웨어 공학",
  "2020_1": "1. '전자정부법(제58조,제59조,제61조)' 에 따라\n행정안전부장관은 감리법인이 위법한 행위를 한\n경우 업무정지를 하거나 등록을 취소할 수 있다.\n다음 중 반드시 등록을 취소하여야 하는 경우는?\n① 전자정부법에 따른 등록기준에 미달하게 된 경우\n② 전자정부법에 따른 변경사항을 신고하지 아니\n하거나 거짓으로 신고한 경우\n③ 전자정부법을 위반하여 다른 자에게 자기의\n명칭을 사용하여 정보시스템 감리를 하게 한\n경우\n④ 임원이 전자정부법에 따른 결격사유에 해당\n되고, 결격사유에 해당되는 날부터 6개월\n이내에 해당 임원을 바꾸어 임명하지 않은\n경우",
  "2020_2": "2. '정보시스템 감리원 윤리가이드(한국정보화진흥원,\n2014)' 에서 제시하고 있는 감리원 윤리성 관리\n점검항목의 감리원 자가점검 항목에 대한 설명으\n로 가장 적절한 것은?\n① 직무윤리 – 결정권과 권한을 적정하게 사용하는지 점검\n② 이해상충 금지 – 감리수행중 다른 개인적인 업무\n수행 등을 점검\n③ 조직문화 – 잘못된 일처리에 대한 시정 등을 점검\n④ 성희롱 – 감리원 상호간 무시나 폭언을 하는 행위\n등을 점검",
  "2020_3": "3. '정보시스템 하드웨어 규모산정 지침(정보통신단체\n표준, TTAK.KO-10.0292/R1, 2017)' 에서는 규모산정\n분야를 CPU, 메모리, 디스크, 스토리지 등 4가지\n분야로 정의하고 있다. 이중 OLTP와 WEB/WAS로\n구분된 시스템 유형에 따라 별도로 산정하여야\n하는 규모산정 분야로 적합하게 묶여진 것은?\n① CPU, 메모리, 디스크 ② CPU, 메모리\n③ 디스크, 스토리지 ④ CPU, 스토리지\n- 2",
  "2020_4": "4. 다음과 같이 계약기간을 경과하여 검사요청서를\n제출한 경우 '용역계약 일반조건(기획재정부계약\n예규, 2019)' 에 따라 용역수행기한 지체일수를\n가장 적정하게 산정한 것은?\n① (a) + (c)\n② (a) + (b) + (c)\n③ (a) + (c) + (d)\n④ (a) + (b) + (c) + (d)",
  "2020_5": "5. 다음 중 국가와 지방자치단체가 담당해야할 국가\n정보화 추진의 기본원칙과 가장 거리가 먼 것은?\n① 국가정보화 추진 과정에서 민간과의 협력 체계를\n마련하는 등 사회 각 계층의 다양한 의견을 수렴\n하도록 노력하여야 한다.\n② 국가정보화 추진 과정에서 정보화의 역기능을\n방지하기 위한 정보보호, 개인정보 보호 등의\n대책을 마련하여야 한다.\n③ 국가정보화를 추진하는 경우에는 민간을 포함하는\n총괄적 역할에 충실하여야 하며 민간의 자유와\n창의를 존중하고 지원하여야 한다.\n④ 시책 추진에 필요한 재원을 마련하기 위하여\n노력하여야 한다.",
  "2020_6": "6. '행정기관 및 공공기관 정보시스템 구축‧운영 지침\n(2019)' 에서 요구하는 것으로서 정보화 사업 발\n주, 관리, 운영 등에 참여하는 사업자가 준수하여\n야 하는 주요 보안대책과 가장 거리가 먼 것은?\n① 개발시스템과 운영시스템의 가상화 수준 분리\n② 외부 용역업체의 노트북 등에 대해 반입•반출을\n제한\n③ 외부 용역업체의 인터넷 사용 및 인가되지 않은\nUSB 등 휴대용 저장매체 사용을 제한\n④ 운영시스템 접근에 필요한 작업용 PC를 별도로 마\n련하여 외부 용역업체의 운영시스템 접근을 제한\n2 -\n\n=== NEW PAGE ===",
  "2020_7": "7. 공공기관 데이터베이스의 메타데이터를 관리하기\n위해 업무담당자가 수행하는 업무와 가장 거리가\n먼 것은?\n① 소관 공공데이터베이스 메타데이터의 표준 준수\n여부 점검 및 개선 조치\n② 기관메타시스템 보급 확대 추진을 위한 공통\n기관메타시스템의 개발 보급\n③ 소관 공공데이터베이스의 메타데이터 변경사항\n발생 시 최신 정보로 현행화\n④ 기관메타시스템 내 소관 공공데이터베이스의\n메타데이터 표준 관리 항목 정보 등록",
  "2020_8": "8. 다음 상주감리에 대한 설명 중 옳지 않은 것은?\n① 감리 업무 수행 결과를 정기적으로 발주자에게\n보고하여야 한다.\n② 상주감리원은 필요한 경우 단계별 감리의 감리원\n으로 참여할 수 있다.\n③ 정기 감리 이외의 추가 감리로서 발주자를 지원\n하는 형태로 수행된다.\n④ 현장에 상주하거나 주기적으로 투입되어 감리\n업무를 수행한다.",
  "2020_9": "",
