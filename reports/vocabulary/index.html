<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📖 IT 용어 사전</title>
    <meta name="description" content="IT 용어 사전 겸 단어장. 스페이스드 리피티션 학습 지원.">
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/vocabulary.css">
</head>

<body>

    <!-- ======== 헤더 ======== -->
    <div class="header">
        <h1>📖 IT 용어 사전</h1>
        <p class="subtitle">지문 속 핵심 용어를 정리하고 암기하세요</p>

        <div class="nav-badges">
            <a href="../../index.html" class="nav-badge home-badge">🏠 홈으로</a>
            <a href="../pm_official_scopes.html" class="nav-badge">📋 PM 대시보드</a>
            <a href="../Learning_History/lhistory.html" class="nav-badge">📈 학습 분석</a>
            <span class="nav-badge" style="margin-left: auto; cursor: default; color: var(--text-muted);"
                id="terms-count">0개 용어</span>
            <span class="nav-badge theme-badge">
                🎨 <select id="theme-select" onchange="onThemeChange(this.value)" aria-label="테마 선택">
                    <option value="dark">다크</option>
                    <option value="light">라이트</option>
                </select>
            </span>
        </div>

        <!-- 과목 탭 -->
        <div class="nav-badges" style="margin-top: 8px;">
            <span class="nav-badge subject-tab active" data-subject="PM" onclick="onSubjectChange('PM')">📁
                사업관리(PM)</span>
            <span class="nav-badge subject-tab" data-subject="SE" onclick="onSubjectChange('SE')">📁 소프트웨어공학</span>
            <span class="nav-badge subject-tab" data-subject="DB" onclick="onSubjectChange('DB')">📁 데이터베이스</span>
            <span class="nav-badge subject-tab" data-subject="SA" onclick="onSubjectChange('SA')">📁 시스템구조</span>
            <span class="nav-badge subject-tab" data-subject="SC" onclick="onSubjectChange('SC')">📁 보안</span>
        </div>
    </div>

    <!-- ======== 통계 배지 바 ======== -->
    <div class="stats-bar">
        <div class="stat-card">
            <div class="stat-value" id="stat-total">0</div>
            <div class="stat-label">총 용어</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-abbr">0</div>
            <div class="stat-label">약자 포함</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-learned">0</div>
            <div class="stat-label">학습 진행</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-due">0</div>
            <div class="stat-label">오늘 복습</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-starred">0</div>
            <div class="stat-label">즐겨찾기</div>
        </div>
    </div>

    <!-- ======== 메인 레이아웃 ======== -->
    <div class="main-container">
        <!-- 사이드바: 토픽 그룹 필터 -->
        <div class="sidebar" id="sidebar">
            <button class="sidebar-toggle-btn" id="sidebar-toggle-btn" onclick="toggleSidebar()" title="토픽 그룹 접기/펼치기">◀</button>
            <div class="sidebar-title-row">
                <div class="sidebar-title">📂 토픽 그룹</div>
                <div class="tree-controls">
                    <button class="tree-control-btn" onclick="expandAllTopics()">전체 펼치기</button>
                    <button class="tree-control-btn" onclick="collapseAllTopics()">전체 접기</button>
                </div>
            </div>
            <div id="topic-list">
                <!-- JS 동적 생성 -->
            </div>
        </div>

        <!-- 컨텐츠 영역 -->
        <div class="content">
            <!-- 검색 + 컨트롤 바 -->
            <div class="search-bar">
                <input type="text" id="search-input" class="search-input" placeholder="🔍 약자, 영문, 한글로 용어 검색..."
                    oninput="onSearchInput()" onkeydown="if(event.key==='Enter') onSearch()">

                <select class="sort-select" onchange="onSortChange(this.value)">
                    <option value="topic">토픽순</option>
                    <option value="frequency">빈도순</option>
                    <option value="term_ko">가나다순</option>
                    <option value="term_en">영문순</option>
                    <option value="recent">최신순</option>
                </select>

                <label
                    style="display: flex; align-items: center; gap: 4px; font-size: 0.78rem; color: var(--text-secondary); cursor: pointer; white-space: nowrap;">
                    <input type="checkbox" id="starred-filter" onchange="loadTerms()"> ⭐ Only
                </label>

                <button class="btn btn-primary" onclick="openAddModal()">+ 용어 추가</button>
                <button class="btn btn-study" onclick="startStudySession()">🧠 학습 시작</button>
            </div>

            <!-- 용어 카드 그리드 -->
            <div class="terms-grid" id="terms-grid">
                <div class="empty-state" style="grid-column: 1/-1">
                    <div class="emoji">📚</div>
                    <p>용어를 불러오는 중...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- ======== 학습 모달 (SRS + 약자 분해 3단계) ======== -->
    <div class="modal-overlay" id="study-modal-overlay">
        <div class="study-modal">
            <div class="study-header">
                <h2>🧠 오늘의 복습</h2>
                <span class="study-progress" id="study-progress">0 / 0</span>
                <button class="study-close" onclick="closeStudyModal()">✕</button>
            </div>

            <!-- 3단계 진행 인디케이터 -->
            <div class="step-dots" style="padding: 16px 0 0;">
                <div class="step-dot active"></div>
                <div class="step-dot"></div>
                <div class="step-dot"></div>
            </div>

            <div class="study-body" id="study-body">
                <!-- JS 동적 렌더링 -->
            </div>

            <div class="study-footer" id="study-footer">
                <div class="quality-buttons">
                    <button class="quality-btn q-again" onclick="submitReview(0)">
                        <span class="emoji">😰</span>
                        모름
                    </button>
                    <button class="quality-btn q-hard" onclick="submitReview(1)">
                        <span class="emoji">😐</span>
                        어려움
                    </button>
                    <button class="quality-btn q-good" onclick="submitReview(2)">
                        <span class="emoji">🙂</span>
                        보통
                    </button>
                    <button class="quality-btn q-easy" onclick="submitReview(3)">
                        <span class="emoji">😎</span>
                        쉬움
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ======== 용어 추가/편집 모달 ======== -->
    <div class="modal-overlay" id="form-modal-overlay">
        <div class="form-modal">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h2 id="form-modal-title" style="font-family: 'Outfit'; font-size: 1.1rem; font-weight: 700;">새 용어 추가
                </h2>
                <button class="study-close" onclick="closeFormModal()">✕</button>
            </div>

            <form id="term-form" onsubmit="submitTermForm(event)" data-term-id="">
                <div class="form-group">
                    <label>한글 용어명 *</label>
                    <input type="text" name="term_ko" placeholder="예: 획득가치관리" required>
                </div>
                <div class="form-group">
                    <label>영문 원어</label>
                    <input type="text" name="term_en" placeholder="예: Earned Value Management">
                </div>
                <div class="form-group">
                    <label>약자</label>
                    <input type="text" name="abbreviation" placeholder="예: EVM">
                </div>
                <div class="form-group">
                    <label>정의/뜻 *</label>
                    <textarea name="definition" placeholder="용어의 의미를 간결하게 설명하세요" required></textarea>
                </div>
                <div class="form-group">
                    <label>대분류 *</label>
                    <select name="topic_major" required onchange="updateTopicMinorSuggestions()"></select>
                </div>
                <div class="form-group">
                    <label>소분류</label>
                    <input type="text" name="topic_minor" list="topic-minor-suggestions"
                        placeholder="예: EVM분석 (비워두면 대분류에만 등록)" oninput="updateTopicMinorSuggestions()">
                    <datalist id="topic-minor-suggestions"></datalist>
                </div>
                <div class="form-group">
                    <label>관련 키워드 (콤마 구분)</label>
                    <input type="text" name="related_keywords" placeholder="예: PV, AC, SPI, CPI">
                </div>
                <div class="form-group">
                    <label>출처/비고 (콤마 구분)</label>
                    <input type="text" name="source" placeholder="예: 2024년 15번, 2022년 8번">
                </div>

                <div class="form-actions">
                    <button type="button" class="btn"
                        style="color: var(--accent-rose); border-color: rgba(244,63,94,0.3);"
                        onclick="deleteCurrentTerm()">🗑 삭제</button>
                    <button type="button" class="btn" onclick="closeFormModal()">취소</button>
                    <button type="submit" class="btn btn-primary">💾 저장</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/vocabulary.js"></script>
<script src="../js/quick_add.js"></script>
</body>

</html>
