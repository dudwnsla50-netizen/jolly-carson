  "2020_40": "40));\nscore[numdigits]->draw();\nnumdigits++;\n}\nwhile (n) {\nint rem = n % 10;\ndelete score[numdigits];\nscore[numdigits] = new Displayable(digits[rem]);\nscore[numdigits]->move(Point((700-numdigits*18),40));\nscore[numdigits]->draw();\nn /= 10;\nnumdigits++;\n}\n}\n① 2 ② 3 ③ 4 ④ 5\n- 7",
  "2020_41": "41. 다음 그림은 왼쪽 리스트 박스에서 고객 타입을 지\n정하면 오른쪽의 입력 폼의 형태가 바뀐다. 그림\n에서 보듯이 왼쪽 리스트 박스와 오른쪽 입력 폼은\n서로 의존적이다. 이와 같이 직접적인 의존 관계가\n있는 요소들의 의존 관계를 완화하여 객체들이\n다른 객체의 존재를 모르는 상태에서도 협력할 수\n있도록 소프트웨어 설계를 개선하고자 할 경우에\n어떤 설계 패턴을 도입하는 것이 가장 적절한가?\n① 상태 패턴 (state pattern)\n② 위임 패턴 (delegation pattern)\n③ 중재자 패턴 (mediator pattern)\n④ 커맨드 패턴 (command pattern)",
  "2020_42": "42. 전자정부 표준프레임워크는 공공사업에 적용되는\n개발 프레임워크의 정립된 표준으로 응용 소프트\n웨어 표준화, 품질 및 재사용성 향상을 목표로\n한다. 다음 중 전자정부 표준프레임워크의\n‘공통기술 서비스’ 그룹에 포함되지 않는 구성\n요소로만 묶은 것으로 가장 적절한 것은? (2020\n년도 버전(표준프레임워크 v3.9) 기준)\n가. 협업 라. 서비스 요청관리\n나. 표준 관리 마. 디지털 자산관리\n다. 변경 관리 바. 사용자 디렉토리/통합인증\n① 가, 다, 마 ② 나, 다, 라\n③ 라, 마, 바 ④ 가, 마, 바",
  "2020_43": "43. 다음은 AOP(Aspect Oriented Programming)관련\n용어에 대한 설명이다. (가), (나)에 적합한 용\n어를 순서대로 가장 적절하게 나열한 것은?\n(가)는 관심(concern)을 구현한 코드이며, (나)는 포인\n트컷(pointcut)과 (가)로 구성되어 있다.\n① (가) 어드바이스(advice) (나) 애스팩트(aspect)\n② (가) 애스팩트(aspect) (나) 어드바이스(advice)\n③ (가) 애스팩트(aspect) (나) 조인 포인트(join point)\n④ (가) 조인 포인트(join point) (나) 애스팩트(aspect)\n9 -",
  "2020_44": "44. 다음 표는 어느 회사에서 개발한 소프트웨어 제품\n군을 유지보수하는 과정에서 소요되는 노력을 유\n지보수 유형에 따라 정리한 것이다. 이런 상황을\n고려할 때 이 회사가 같은 종류의 소프트웨어 제\n품을 개발할 경우 비중을 두어야 할 ISO 25010 소\n프트웨어 품질 속성으로 가장 적절하지 않은 것은?\n유지보수 유형 소요 노력\n적응(adaptive) 유지보수 65%\n완전(perfective) 유지보수 20%\n수정(corrective) 유지보수 10%\n예방(preventive) 유지보수 5%\n① Integrity ② Portability\n③ Reusability ④ Interoperability",
  "2020_45": "45. 다음 그림은 MDA(Model Driven Architecture)에서의\n계산 독립 모델인 CIM(Computation Independent\nModel)으로부터 실행 코드까지의 변환 과정을\n나타낸 것이다. (가)는 구현을 참조하지 않고\n시스템의 동작을 나타낸 모델이며, (나)는 플랫폼에\n특화된 세부 사항을 추가한 모델이라면 (가),\n(나)에 해당하는 모델로 가장 적절한 것은?\n① (가) DSM(Dynamic System Model)\n(나) PDM(Platform Description Model)\n② (가) PIM(Platform Independent Model)\n(나) PSM(Platform Specific Model)\n③ (가) SAM(System Activity Model)\n(나) PDM(Platform Description Model)\n④ (가) SAM(System Activity Model)\n(나) PSM(Platform Specific Model)",
  "2020_46": "46. 다음은 http 또는 https를 사용하는 RESTful\n서비스에서의 기본적인 네 가지 메소드에 대한\n설명이다. (가)~(라)에 가장 적절한 메소드는?\n(가) 자원 값을 갱신하는 데 쓰인다.\n(나) 자원을 삭제하는 데 쓰인다.\n(다) 자원을 생성하는 데 사용된다.\n(라) 자원 값을 읽어오는 데 사용된다.\n① (가) PUT (나) DELETE (다) POST (라) GET\n② (가) SET (나) REMOVE (다) CREATE (라) PULL\n③ (가) POST (나) REMOVE (다) NEW (라) READ\n④ (가) POST (나) DELETE (다) NEW (라) PULL\n- 10",
  "2020_47": "47. 다음 왼쪽에 주어진 코드를 테스트하기 위하여 경로\n(path) 커버리지 기반의 테스트 데이터를 오른쪽과 같\n이 개발하였다. 주어진 4개의 테스트 데이터를 이용하\n여 왼쪽 코드를 테스트한다고 할 때, 테스트 되지 않는\n경로는? (단, 코드 실행상의 문제가 없다고 가정함)\nL01 f (int x, int y) {\nL02 if (x * x * x > 0) {\nL03 if (x > 0 && y == 10) {\nL04 fail();\nT1: x=70, y=50\nL05 }\nL06 } else { T2: x=-70, y=50\nL07 if ( x > 0 && y == 20) { T3: x=70, y=10\nL08 fail();\nT4: x=-70, y=20\nL09 }\nL10 }\nL11 complete();\nL12 }\n① L01 -> L02 -> L03 -> L04\n② L01 -> L02 -> L07 -> L08\n③ L01 -> L02 -> L03 -> L11\n④ L01 -> L02 -> L07 -> L11",
  "2020_48": "48. 다음과 같은 학생정보 관리 시스템에 대한 요구\n사항이 있다. 이 정보를 바탕으로 내부논리파일\n(internal logical file : ILF)의 기능점수를 산\n출하기 위한 데이터요소유형(data element type\n: DET)과 레코드요소유형(record element type :\nRET)의 개수로 가장 적절한 것은?\n1. 다음을 포함하는 학생정보를 입력한다.\n- 학번\n- 학생 이름\n- 학생 학과\n- 학생 등록일자\n2. 정의한 학생정보를 언제든지 재사용하여 필요한\n경우 학생정보를 변경한다.\n3. 학생정보를 조회하고 출력한다.\n4. 학생 이름 또는 학생 등록일자별로 학생 목록을\n조회한다.\n① DET : 4, RET : 0 ② DET : 4, RET : 1\n③ DET : 0, RET : 4 ④ DET : 1, RET : 4\n0 -",
  "2020_49": "49. 소프트웨어 유지보수 및 진화에 대한 Lehman의\n법칙에 대한 설명으로 가장 적절하지 않은 것은?\n① 엔트로피 또는 복잡도 증가의 법칙 : 진화하는\n시스템의 유지보수 프로세스는 시스템이 소멸될\n때까지 일정한 평균 작업량을 보인다.\n② 친근성 유지의 법칙 : 시스템의 평균 성장률은\n소멸될 때까지 일정하다. 즉 개발 전 단계에 걸쳐\n각 버전의 변화는 거의 일정하다.\n③ 품질 저하의 법칙 : 진화하는 시스템의 품질은\n운영 환경의 변화에 완전히 적응하지 못하는 한\n지속적으로 저하한다.\n④ 지속적 변경의 법칙 : 시스템이 릴리즈 된 후에도\n변경은 그 시스템이 다른 시스템으로 대체될 때\n까지 지속된다.",
  "2020_50": "50. 다음은 형상감사 활동에 대한 설명이다. 설명이\n의미하는 것으로 가장 적절한 것은?\n소프트웨어 제품이 릴리즈되기 전에, 변경사항이 모\n든 산출물에 반영되었는지, 변경이 반영된 형상 품\n목들이 통합되었는지, 변경에 대한 형상 정보가 잘\n관리되었는지 등을 객관성이 보장된 형상관리 책임\n자에 의해 수행되는 감사 활동\n① 물리 형상 감사(physical configuration audit)\n② 기능 형상 감사(functional configuration audit)\n③ 베이스라인 형상 감사(baseline configuration audit)\n④ 부정합성 기록 및 보고(nonconformity recording and\nreporting)\n- 11\n1 -",
  "2021_26": "26.4\n2. 프로젝트 관리에서 견고하고 역동적인 프로젝트 팀\n구축이 매우 중요하다. 팀 구축을 위한 터크맨\n(Tuckman)의 사다리 모형에서 팀원들이 서로의\n신뢰를 형성해 나가는 단계는?\n① 규범화(norming) ② 폭풍(storming)\n③ 수행(performing) ④ 형성(forming)\n3. 프로젝트에서 이해관계자(stakeholder)들을 식별하고\n이들의 참여 수준을 검토하는 것이 좋다. 다음\n중 이해관계자 참여 수준의 분류에 해당되지 않는\n것은?\n① 중립(neutral) ② 선도(leading)\n③ 인지(aware) ④ 저항(resistant)\n4. 다음 네트워크 다이어그램을 보고 가장 적절한 자원\n평준화(resource leveling) 방법은?(단, 활동들은\n가능한 가장 빠른 시점에 시작된다고 가정한다.)\n① a 활동을 4일 늦게 시작한다.\n② b 활동을 2일 늦게 시작한다.\n③ c 활동을 1일 늦게 시작한다.\n④ a 활동과 b 활동을 각각 1일씩 늦게 시작한다.\n- 2",
  "2021_27": "27. 다음 상황에 적용하기에 가장 적절한 디자인 패턴은?\nŸ 장기 게임을 하는 프로그램에서 사용자의 선택에\n맞추어서 특정 루틴의 레벨을 간단하게 교체할\n수도 있다.\nŸ 메모리가 적은 환경에서는 속도는 느리지만 메모리를\n절약하는 알고리즘을 사용하고, 메모리가 많은\n환경에서는 속도는 빠르지만 메모리를 많이 사용\n하는 알고리즘을 사용한다.\nŸ 스프레드시트 소프트웨어의 디버그 판에서 복잡한\n계산을 실행할 때, ‘버그가 있을지도 모르는\n고속의 알고리즘’과 ‘저속이지만 확실한 계산을\n실행하는 알고리즘’을 준비해서 전자의 검산을\n후자로 실행시킨다.\n① strategy 패턴 ② observer 패턴\n③ command 패턴 ④ decorator 패턴",
  "2021_28": "28. 애자일 개발의 품질 관리에 관한 설명 중 가장\n적절한 것은?\n① 문서 기반의 정형적인 방식을 따른다.\n② ISO 9001에 포함된 표준 기반 접근법을 적극적으\n로 준수한다.\n③ 공식적인 인스펙션 또는 리뷰 프로세스들을 정기적\n으로 사용한다.\n④ 코드에서 문제를 발견하면 원래의 개발자가\n아니라도 문제를 직접 수정할 수 있다.\n- 7",
  "2021_29": "29. 다음 테스트 커버리지(test coverage)에 대한 설명\n중에서 올바른 것만으로 묶인 것은?\n가. 결정 커버리지(decision coverage)를 100% 만\n족하면 문장 커버리지(statement coverage)를\n100% 만족한다.\n나. 결정/조건 커버리지(decision/condition coverage)\n를 100% 만족하면 결정 커버리지(decision\ncoverage)를 100% 만족한다.\n다. 조건 커버리지(condition coverage)를 100% 만족\n하면 결정 커버리지(decision coverage)를 100%\n만족한다.\n라. 결정/조건 커버리지(decision/condition coverage)\n를 100% 만족하면 조건 커버리지(condition\ncoverage)를 100% 만족한다.\n① 가, 다 ② 가, 나, 다\n③ 가, 나, 라 ④ 가, 나, 다, 라",
  "2021_30": "30. 휴대폰에 설치되어 있는 전화번호 관리 애플리\n케이션에 대해 ISO 9126의 품질 특성 분류 기준에\n따라 리스크들을 식별한 결과가 가장 적절한 것은?\n① 효율성(efficiency) - 전화번호 등록 중에 전원이\n꺼졌을 때 데이터가 손실된다.\n② 신뢰성(reliability) - 적합한 그룹에 전화번호가\n등록되지 않는다.\n③ 사용성(usability) - 사용자가 전화번호 애플리\n케이션의 초기 화면으로 돌아오는 단축 메뉴가\n없다.\n④ 기능성(functionality) - 등록된 전화번호가 임계값에\n가까울 때 전화번호 탐색 시간이 현저하게 떨어진다.",
  "2021_31": "31. 다음 클래스 다이어그램이 나타내는 디자인 패턴\n으로 가장 적절한 것은?\n① bridge 패턴 ② decorator 패턴\n③ flyweight 패턴 ④ proxy 패턴\n7 -",
  "2021_32": "32. 다음은 Java 프로그램의 코드 일부분을 보여준다.\n이 프로그램을 컴파일할 때 (가) ~ (라) 라인 중\n에서 컴파일 오류가 발생하지 않는 부분(라인)들만\n으로 가장 적절하게 묶인 것은?\npublic class Test\n{\nprivate int a = 0;\nprivate static count = 0;\npublic int getA() { return a; }\npublic static int getCount() { return count;\n}\npublic static void test() {\nint sum = 0;\nsum = a; // (가)\nsum += count; // (나)\nSystem.out.println(getA()); // (다)\nSystem.out.println(getCount()); // (라)\n}\n}\n① 가, 다 ② 나, 라\n③ 가, 나, 다 ④ 가, 나, 다, 라",
  "2021_33": "33. SOAP 기반 웹 서비스와 RESTful 웹 서비스를\n비교한 설명으로 가장 적절한 것은?\n① SOAP 기반 웹 서비스는 RESTful 웹 서비스에 비해\n구현하기 쉽고 확장성이 우수하다.\n② SOAP 기반 웹 서비스에서 요청 및 응답은 모두\nXML 형식으로 수행하는 반면, RESTful 웹\n서비스에서는 JSON, XML, 일반 텍스트 등을\n사용한다.\n③ SOAP 기반 웹 서비스는 서비스 품질이나 신뢰성\n관리를 위해 자신의 기반구조를 구현해야 하지만,\nRESTful 웹 서비스는 WS-Reliability나\nWS-Transaction과 같은 기반구조의 지원 표준이\n있다.\n④ SOAP 기반 웹 서비스는 리소스 지향적인데 반해,\nRESTful 웹 서비스는 RPC 메커니즘의 서비스\n지향적이다.\n- 8",
  "2021_34": "34. 다음은 스프링 프레임워크가 제공하는 어드바이스의\n유형을 그림으로 나타내고 있다. (가) ~ (다)에\n가장 적절한 어드바이스는?\n① (가) AfterReturning 어드바이스\n(나) Around 어드바이스\n(다) AfterThrowing 어드바이스\n② (가) AfterReturning 어드바이스\n(나) After Throwing 어드바이스\n(다) Around 어드바이스\n③ (가) AfterThrowing 어드바이스\n(나) Around 어드바이스\n(다) AfterReturning 어드바이스\n④ (가) Around 어드바이스\n(나) AfterReturning 어드바이스\n(다) AfterThrowing 어드바이스\n8 -",
  "2021_35": "35. 다음의 소스 코드 변경을 잘 설명하고 있는 리팩\n토링(refactoring) 방법으로 가장 적절한 것은?\n(변경전)\nint getRating() {\nreturn (moreThanFiveLateDeliveries()) ? 2 :\n1;\n}\nboolean moreThanFiveLateDeliveries() {\nreturn _numberOfLateDeliveries > 5;\n}\n(변경후)\nint getRating() {\nreturn (_numberOfLateDeliveries > 5) ? 2 :\n1;\n}\n① inline method\n② extract method\n③ move method\n④ substitute algorithm",
  "2021_36": "36. 다음은 특정 함수의 응집도(cohesion)들을 설명\n하고 있다. 좋은 응집도에서 나쁜 응집도 순으로\n순차적으로 배치한 것 중에서 가장 적절한 것은?\n가. 서로 연관성이 없는 기능들을 묶어 놓았다.\n나. 두 개의 기능을 구현한 함수로 동일한 속성\n(attribute)을 사용하는 기능을 묶어 놓았다\n다. 초기화 함수와 같이 시간적으로 연관이 있는\n기능들을 묶어 놓았다.\n라. 두 개의 기능을 구현한 함수로 하나의 기능의\n결과가 다른 기능의 입력으로 사용된다.\n마. 하나의 문제를 수행하는 기능을 구현한 함수이다.\n① 마 – 라 – 나 – 다 - 가\n② 마 - 나 - 라 - 다 - 가\n③ 마 - 라 - 다 - 나 - 가\n④ 마 - 나 - 다 - 라 - 가\n- 9",
  "2021_37": "37. 다음에서 설명하는 요구사항 도출 기법으로 가장\n적절한 것은?\n사용자들의 동작 프로세스를 이해하고 이를 지원하는\n소프트웨어의 요구사항을 얻기 위해 사용하는 관찰\n기법이다. 분석가는 사용자의 일상 업무를 관찰하고\n사용자들의 실제 작업을 기록한다. 사람들이 실제\n일하는 방식을 반영하는 기법으로 잘 드러나지 않는\n요구사항을 발견하는데 도움을 준다.\n① 인터뷰(interview)\n② 사용자 스토리(user story)\n③ 문화기술적 연구(ethnography)\n④ 스프린트 백로그(sprint backlog)",
  "2021_38": "38. 다음 익스트림 프로그래밍(eXtreme programming)의 실무에\n대한 설명 중 가장 적절하지 않은 것은?\n① 단순한 설계(simple design)는 설계를 간결하게\n유지하여 미래의 잠재적 변경에 대비하는 것이다.\n② 공동 소유권(collective ownership)은 개발자들이\n코드에 대한 공동 책임을 지며, 모든 개발자가\n어떤 코드라도 변경할 수 있다는 것이다.\n③ 연속적 통합(continuous integration)은 특정\n작업이 끝나면 바로 전체 시스템에 통합되며, 통합\n후에는 모든 테스트를 통과해야 한다는 것이다.\n④ 리팩토링(refactoring)은 코드 개선 사항이 발견\n되면 코드를 지속적으로 개선하는 것이며, 이를\n통하여 코드가 단순하고 유지보수하기 쉽게 된다.",
  "2021_39": "39. 다음에서 설명하는 UML 상태머신 다이어그램의\n(가) 위치에 나타낼 표기법으로 가장 적절한 것은?\ntrigger 이벤트가 발생\n하였을 때 guard 조건이\n만족하면 전이가 일어나\n는데 전이하면서 effect를\n수행한다.\n① trigger [guard] effect\n② trigger [guard] / effect\n③ trigger / [guard] effect\n④ trigger / [guard] / effect\n9 -",
  "2021_40": "40. 소프트웨어 버전 관리에 대한 다음 설명 중 가장\n적절하지 않은 것은?\n① Git과 Subversion 모두 commit 명령으로 새로운\n버전을 생성할 수 있다.\n② 분산 버전 관리 시스템인 Git은 버전 저장소에서\n컴포넌트 버전 간 차이인 델타를 이용하여 공간을\n절약한다.\n③ Subversion은 하나의 마스터 저장소에 모든 컴포\n넌트의 버전을 유지하는 중앙집중 버전 관리 시스템\n이다.\n④ 베이스라인은 시스템을 구성하는 컴포넌트 버전들의\n집합을 의미한다. 소프트웨어 개발 과정 중 특정\n시점이나 목적을 위하여 만들어진 산출물의 집합\n이다.",
  "2021_41": "41. 문제를 일으킬 가능성 때문에 리팩토링(refactoring)이\n필요한 코드는 ‘악취(bad smell)’가 있다고 표현\n한다. 다음 설명에 가장 적절한 코드 악취(bad\nsmell)는?\nŸ 변경을 할 때마다 많은 클래스를 조금씩 수정해야\n한다.\nŸ 변경해야 할 것이 여러 군데 널려 있기 때문에\n찾기도 어렵고 변경해야 할 중요한 사항을 놓치\n기도 쉽다.\n① 기능에 대한 욕심(feature envy)\n② 데이터 덩어리(data clump)\n③ 산탄총 수술(shotgun surgery)\n④ 확산적 변경(divergent change)\n- 10",
  "2021_42": "42. 다음은 UML로 작성한 클래스 다이어그램과 이에\n해당하는 Java 코드의 일부를 나타낸 것이다. 가장\n적절하지 않은 것은?\npublic class Car {\nprivate Tire\n가\nmyTires[4];\n}\ninterface Drive {\n...\n}\npublic class\n나\nN e x t G e n D r i v e\nextends Drive {\n...\n}\npublic abstract\nclass Door {\nprivate int\nstatus;\n다 public abstract\nvoid lock();\npublic abstract\nvoid unlock();\n}\npublic class Car {\npublic class\nEngine {\n라\n...\n}\n}\n① 가 ② 나 ③ 다 ④ 라\n0 -",
  "2021_43": "43. 다음의 소스 코드와 관련성이 가장 깊은 feature\ndiagram은?\nvoid f(int x) {\nprintf(“%d\\n”, x);\n#if defined(Feature1)\ng1(x);\n#if defined(Feature2)\ng2(x);\n#else\ng3(x);\n#endif\n#endif\n}\n① ② ③ ④",
  "2021_44": "44. ISO/IEC/IEEE 29119에서는 combinatorial test\ntechniques으로서 all combination testing,\npair-wise testing, each choice testing, base\nchoice testing이 제시되고 있다. 다음의 문제에\n대하여 가장 많은 수의 테스트케이스를 생성하는\n기법과 가장 작은 수의 테스트케이스를 생성하는\n기법으로 가장 적절하게 묶인 것은?\nŸ 여행 목적지: 서울, 부산, 강릉\nŸ 여행 방법: 자가용, 기차, 택시\nŸ 숙박 유형: 고급호텔, 보통호텔\n① all combination testing, each choice testing\n② all combination testing, base choice testing\n③ pair-wise testing, each choice testing\n④ pair-wise testing, base choice testing\n- 11",
  "2021_45": "45. 다음의 Java 소스 코드에 대하여 가장 적절한 클래스\n다이어그램은?\npublic class Rectangle {\nprivate int width, height;\nprivate int area;\nprivate static int count;\npublic Rectangle(int w, int h) {\nsetWidth(w); setHeight(h); count++;\n}\npublic void setWidth(int w) {\nthis.width = w;\narea = width * height;\n}\npublic void setHeight(int h) {\nthis.height = h;\narea = width * height;\n}\n}\n①\n②\n③\n④\n1 -",
  "2021_46": "46. SP(software process) 인증 제도는 SW 개발 조직의\nSP 품질 역량 수준을 심사하여 등급을 판정한다.\n2등급에 대한 평가 항목으로서 가장 적절하지 않은\n것은?\n① 협력업체를 선정하고, 계약을 체결하고, 계약\n사항의 이행 여부를 확인한다.\n② 측정 및 분석 계획을 수립하고, 수집된 측정 결과를\n분석한다.\n③ 구성원에 대한 교육 계획을 수립하고, 실시한 교육\n에 대한 효과를 평가한다.\n④ 프로젝트 진척사항을 검토하고, 식별된 문제를\n분석하고, 시정조치 활동을 수행한다.",
  "2021_47": "47. 다음은 ‘온라인쇼핑시스템’에 대한 요구사항들을\n나열한 것이다. 이들 요구사항에 제시된 품질 속성\n또는 세부 품질 속성으로 가장 적절한 것은?\n가. 동시에 최대 10만명의 사용자 접속을 수용해야\n한다.\n나. 온라인 쇼핑에 필요한 모든 기능을 제공해야\n한다.\n다. 계획된 정비 시간을 제외하면 1주일에 10분 이상\ndown되지 않아야 한다.\n라. 비정상적으로 접속이 종료된 후에, 로그인을\n하면 기존 상품 조회 화면을 보여 준다.\n마. 온라인쇼핑시스템에 대한 테스트 기준 수립이\n용이하고 테스트 수행이 용이해야 한다.\n① capacity, functional suitability,\navailability, maintainability\n② performance efficiency, functional\nsuitability, availability, testability\n③ capacity, functional suitability,\nreliability, maintainability\n④ performance efficiency, functional\nsuitability, availability, testability,\nadaptability\n- 12",
  "2021_48": "48. (가)의 클래스 다이어그램은 (나)의 클래스 다이어\n그램으로 개선이 되었다. 이 개선 과정에서 적용된\n설계 원칙으로서 가장 적절한 것은?\n(가)\n(나)\n① SRP(Single Responsibility Principle),\nDIP(Dependency Inversion Principle)\n② SRP(Single Responsibility Principle),\nOCP(Open Closed Principle)\n③ LSP(Liskov Substitution Principle),\nISP(Interface Segregation Principle)\n④ DIP(Dependency Inversion Principle),\nISP(Interface Segregation Principle)\n2 -",
  "2021_49": "49. 다음 시퀀스 다이어그램은 아키텍처 패턴의 개략적인\n동작을 보여 준다. 이 패턴에 대한 설명으로서\n가장 적절한 것은?\n① 분산 애플리케이션을 개발할 때의 복잡도를 증가\n시킨다.\n② 동일한 환경에서의 서비스 실행을 지원한다.\n③ 여러 서비스를 하나의 동일한 언어로 개발하는\n것이 일반적이다.\n④ modifiability, availability, performance 측면\n에서 바람직하다.",
  "2021_50": "50. (가)의 클래스 다이어그램이 (나)의 클래스 다이어\n그램으로 개선이 되었다. 이때 적용된 리팩토링\n(refactoring)으로서 가장 적절한 것은?\n(가)\n(나)\n① hide delegate\n② remove middle man\n③ rename method\n④ encapsulate downcast\n- 13\n3 -",
  "2022_26": "26. 소프트웨어 요구사항 정보의 형태는 비즈니스 요구사항,\n비즈니스 룰, 제약사항, 외부 인터페이스 요구사항,\n특성(Feature), 기능적 요구사항, 비기능적 요구사항,\n품질 속성, 시스템 요구사항, 사용자 요구사항 등으로\n구성될 수 있다. 이들 간의 연관관계를 그림으로 표현\n한 것 중 가장 적절하지 않은 것은? (단, 점선은 다\n른 형태의 요구사항에 영향을 주거나 다른 형태의 요\n구사항의 원천이 되는 경우를 의미한다.)\n① 가 ② 나\n③ 다 ④ 라",
  "2022_27": "27. 소프트웨어 요구사항의 표준화를 위하여 소프트웨어\n요구사항 패턴을 정의하였다. 다음 요구사항에\n가장 적절한 소프트웨어 요구사항 패턴은?\n선택한 고객에 대해 금액 조정(인출 또는 대출)을 할\n수 있다. 금액 조정은 다음과 같은 정보를 가진다.\n- 고객 ID\n- 조정 금액\n- 조정 이유\n각 계좌 금액 조정에 유일한 ID가 자동으로 부여된다.\n극소수의 직원만이 계좌 금액 조정을 할 수 있다.\n① Chronicle Requirement Pattern\n② Living Entity Requirement Pattern\n③ Transaction Requirement Pattern\n④ Configuration Requirement Pattern\n- 6",
  "2022_28": "28. 다음은 리팩토링 목록(Catalog of Refactoring)\n에서 정의된 리팩토링 방법 중 하나를 설명하는\n코드이다. 다음 코드 변경을 잘 설명하고 있는\n리팩토링 방법의 이름으로 가장 적절한 것은?\n(변경전)\nlet defaultOwner = {firstName: \"Martin\",\nlastName: \"Fowler\"};\n(변경후)\nlet defaultOwnerData = {firstName: \"Martin\",\nlastName: \"Fowler\"};\nexport function defaultOwner() {return\ndefaultOwnerData;}\nexport function setDefaultOwner(arg)\n{defaultOwnerData = arg;}\n① Inline Variable\n② Encapsulate Variable\n③ Split Variable\n④ Rename Variable",
  "2022_29": "29. 다음 의사 코드(Pseudo Code)에 대하여 McCabe의\nComplexity Number를 계산한 것 중 가장 적절한\n것은? (단, 코드 실행에 대한 오류는 없는 것으로\n가정함)\ni = 0;\nn=4; //N-Number of nodes present in the graph\nwhile (i<n-1) do\nj = i + 1;\nwhile (j<n) do\nif A[i]<A[j] then\nswap(A[i], A[j]);\nend do;\ni=i+1;\nend do;\n① 4 ② 5\n③ 6 ④ 7\n6 -",
  "2022_30": "30. 다음은 검색 알고리즘에 관한 JAVA Code 문제이다.\n숫자 배열 {1, 2, 3, 4}와 정수 k는 3으로 입력\n되었을 때, 출력 결과로 가장 적절한 것은?\npublic class Search\n{\npublic static int search(List<Integer> list,\nint k)\n{\nint left = 0, right = list.size() -1, result\n= -1;\nwhile(left <= right) {\nint mid = left + ((right - left) / 2);\nif (list.get(mid) > k) {\nright = mid -1;\n} else if (list.get(mid) == k) {\nresult = mid;\nright = mid -1;\n} else {\nleft = mid+1;\n}\n}\nreturn result;\n}\npublic static void main(String[] args) {\nInteger[] intArr = {1, 2, 3, 4};\nList<Integer> list = Arrays.asList(intArr);\nSystem.out.println(search(list, 3));\n}\n}\n① 1 ② 2\n③ 3 ④ 4",
  "2022_31": "31. 다음 중 컴포넌트 기반 개발 방법론에서 버틀러\n(Burtler) 그룹이 제안한 컴포넌트 성숙 단계를\n1단계부터 6단계까지 순서대로 정리한 것으로 가장\n적절한 것은?\n가. GUI 콘트롤 이용 단계\n나. CBD 성숙 단계\n다. 구현 개념 이용 단계\n라. 비즈니스 개념 이용 단계\n마. 컴포넌트 재사용 단계\n바. 기업 표준 단계\n① 가 – 다 – 라 – 마 – 바 - 나\n② 가 – 라 – 다 – 마 – 바 - 나\n③ 가 – 다 – 라 – 바 – 마 - 나\n④ 가 – 라 – 다 – 바 – 마 - 나\n- 7",
  "2022_32": "32. 다음은 아키텍처 스타일에 대한 설명이다. 각\n설명에 대응하는 아키텍처 스타일이 가장 적절\n하지 않은 것은?\n가. 입력되는 이벤트(event)에 대한 응답으로 프\n레임워크에서 제공하는 서비스를 투명하게 업\n데이트하는 메커니즘을 제공하고, 애플리케이\n션을 통해 프레임워크의 이벤트 처리 동작을\n검사한다.\n나. 복잡한 시스템 기능은 순차적인 하위작업들로\n분리되며, 각 하위작업은 이 작업만을 담당하\n는 독립된 구성요소에 의해 스트림(stream)\n데이터를 처리한다.\n다. 시스템 구성요소가 버전별로 다른 방식으로\n구성될 수 있으며, 파생된 시스템별 서비스를\n위해 플러그 앤 플레이(plug-and-play) 인프\n라를 제공한다.\n라. 시스템의 구조적 및 행동적 측면은 메타 객체\n에 저장되고 애플리케이션 논리 구성요소와\n분리하며, 예기치 않은 상황에 자동으로 대처\n할 수 있다.\n① 블랙보드(Blackboard) - 가\n② 파이프-필터(Pipe & Filter) – 나\n③ 마이크로 커널(Microkernel) - 다\n④ 리플렉션 (Reflection) - 라",
  "2022_33": "33. 다음에 주어진 코드에 대하여 변형 조건/결정\n커버리지(MC/DC)에 의한 테스트를 수행할 때,\n하단에 주어진 테스트 케이스 생성표에 100%\n커버리지를 달성하는 최소한의 테스트 케이스 쌍의\n진리 값 표현으로 가장 적절하지 않은 것은?\n(단, 코드 실행에 대한 오류는 고려하지 않음)\npublic void coverage(int x, int y) {\nif ((x > 0) && (y <= 0))\ny = x;\nsystem.out.printf(x, y);\n}\n테스트케이스 생성표\nTC# 조건1 (x>0)의 진리 값 조건2 (y<=0)의 진리 값\n① TC1 : True – True\n② TC2 : True – Flase\n③ TC3 : False - True\n④ TC4 : False – False\n7 -",
  "2022_34": "34. 다음은 은행에서 일정 금액(amount)을 지급\n(withdraw)하는 코드의 일부분을 리팩토링 한\n것이다. 적용 후 코드를 생성하기 위해 사용된\n리팩토링 기법으로 가장 적절한 것은?\n(단, 코드 실행상의 문제는 고려하지 않음)\n적용전 코드\nint withdraw(int amount) {\nif (amount > _balence)\nreturn –1;\nelse {\n_balence -= amount;\nreturn 0;\n}\n적용후 코드\nvoid withdraw(int amount) throws B_exception {\nif (amount > _balence) throw new\nB_exception();\n_balence -= amount;\n}\n① replace error code with exception\n② replace exception with test\n③ replace parameter with exception\n④ inline method",
  "2022_35": "35. 다음은 Git에 대한 설명이다. Git에 대한 옳은\n설명만으로 가장 적절하게 묶은 것은?\n가. 브랜치(branch) : 커밋(commit)을 가리키는 포인터\n나. 마스터(master) : 최초로 커밋을 수행할 때\n생성되며, 커밋을 수행할 때 마다 가장 최근\n의 브랜치를 가리킨다.\n다. 토픽(topic) 브랜치에서 수행한 작업은 커밋\n을 통해 자동으로 마스터 브랜치에 병합된다.\n라. 현재 작업중인 브랜치에서 마스터 브랜치로\n이동하기 위해서는 git checkout master 명령\n을 사용한다.\n마. 브랜치에 있는 개개의 커밋을 수행하면, 단계\n적으로 브랜치 병합이 이루어진다.\n바. 작업중에 새로운 브랜치로 이동을 할 때, 작\n업 내용을 임시 저장하기 위하여 git stash\n명령을 사용한다.\n① 가, 나, 다 ② 가, 나, 라\n③ 나, 다, 마 ④ 다, 마, 바\n- 8",
  "2022_36": "36. 다음의 아키텍처 분석/평가 방법에 대한 설명으로\n가장 적절한 것은?\n입력: 1) 아키텍처\n2) 아키텍처 전략들\n3) N개의 품질속성 시나리오\n출력: 각 아키텍처 전략의 순위\n단계 1. 시나리오 정리(N개의 시나리오를 N/3개의\n시나리오로 축소)\n단계 2. 시나리오 정제\n단계 3. 시나리오 우선순위(N/6개의 시나리오로 축소)\n단계 4. 각 시나리오의 응답수준별로 해당하는 효\n용값 부여\n단계 5. 아키텍처 전략을 도출하고 각 아키텍처\n전략에 대하여 관련 시나리오별 품질속성\n응답수준을 결정\n단계 6. 보정으로 기대되는 품질속성 응답수준의\n효용값 결정\n단계 7. 아키텍처 전략이 주는 총 이득 계산\n단계 8. 투자수익률을 기초로 아키텍처 전략 선정\n단계 9. 직관을 이용하여 결과 확인\n① SAAM(Software Architecture Analysis Method)\n② ATAM(Architecture Tradeoff Analysis Method)\n③ ARID(Active Review for Intermediate Designs)\n④ CBAM(Cost Benefit Analysis Method)",

  "2022_40": "40. 다음 (가), (나)에 해당하는 Chidamber와 Kemerer\n의 객체 지향 척도로 가장 적절한 것은?\n(가) 클래스에 있는 메서드들의 쌍을 고려하여 계산된다.\n이 값은 공유된 속성이 없는 메서드 쌍의 수와\n공유된 속성이 있는 메서드 쌍의 수의 차이이다.\n(나) 클래스의 객체가 받은 메시지에 응답하여 실행될\n가능성이 있는 메서드들의 수를 나타낸다. 이 값\n이 클수록 클래스가 복잡해지므로 클래스가 오류\n를 포함할 가능성은 더 높을 수 있다.\n① (가) LCOM(Lack of cohesion in methods)\n(나) WMC(Weighted methods per class)\n② (가) WMC(Weighted methods per class)\n(나) RFC(Response for a class)\n③ (가) LCOM(Lack of cohesion in methods)\n(나) RFC(Response for a class)\n④ (가) RFC(Response for a class)\n(나) LCOM(Lack of cohesion in methods)",

  "2022_42": "42. 다음 문장들은 문서편집 프로그램에 대한 요구사항을 기술하\n고 있다. 이 중에서 ISO/IEC 25010의 신뢰성(reliability)\n에 대한 설명으로 가장 적절하게 묶은 것은?\n가. 500페이지 정도의 문서를 2초 이내에 읽어야 한다.\n나. 자신 고유의 파일 포맷뿐만 아니라 다른 문서\n편집 프로그램의 파일 포맷도 읽어야 한다.\n다. 메모리가 부족해지면 가용 메모리 양에 맞추어\n문서의 일부분이라도 편집할 수 있도록 한다.\n라. 예상치 못한 이유로 프로그램이 종료되면 재시작을\n하고 기존 문서를 바로 보여주도록 한다.\n① 가 ② 나, 다\n③ 다, 라 ④ 라\n9 -",

  "2022_45": "45. 다음은 시퀀스 다이어그램과 이와 일관성이 있는\n클래스 다이어그램을 보여 준다. 시퀀스 다이어그램\n을 기준으로 할 때, 클래스 다이어그램에 존재하\n는 문제를 설명한 것으로 가장 적절한 것은?\n① 클래스 C3에 op1() 연산이 반드시 정의되어야 한다.\n② 클래스 C2에서 클래스 C3로의 관계는 의존관계가\n아니라 연관관계가 되어야 한다.\n③ 클래스 C1에서 클래스 C2로의 연관관계는 C2 클래스 쪽에\n'*' 등의 다중성이 명시되어야 한다.\n④ 클래스 C1의 op12() 연산은 ‘-’가 아니라 '+'로\n표시되어야 한다.",

  "2022_47": "47. 시스템 확실성(dependability) 속성에 대한 다음\n설명에서 (가), (나)에 들어갈 내용으로 가장 적절한\n순서대로 나열한 것은?\n(가)는 주어진 시점에 시스템이 작동 중이고 유용\n한 서비스를 제공할 확률이다.\n(나)는 장비 고장이나 사이버 공격 등 손상 사건이\n일어났을 때 중요한 서비스를 잘 유지할 수 있는지에\n대한 추정이다.\n① 가용성(availability), 보안성(security)\n② 가용성(availability), 복원성(resilience)\n③ 신뢰성(reliability), 보안성(security)\n④ 신뢰성(reliability), 복원성(resilience)",

  "2023_30": "30. 다음 설명으로 가장 적절한 용어는?\n악의적인 행위자가 시스템에 무단으로 진입하거나\n악의적인 행동을 유발하는 데 사용될 수 있는 소\n프트웨어 아키텍처 및 소스 코드의 문제점을 말하\n며, 최근 소프트웨어 시스템에 영향을 미치는 다\n른 심각한 약점을 수용하기 위해 보안을 넘어 그\n범위가 확장되고 있다.\n① Common Weakness Enumeration\n② Technical Debt\n③ Bad Smells\n④ Anti-patterns",
  "2023_31": "31. OMG에서는 하드웨어 등을 포함한 복잡한 시스템\n을 모델링하기 위한 목적으로 SysML을 정의하였\n다. SysML을 구성하는 일부 다이어그램은 UML을\n차용하였다. 다음 중 SysML과 UML에 공통적으로\n존재하는 다이어그램으로 가장 적절한 것은?\n① Use case diagram ② Class diagram\n③ Component diagram ④ Requirement diagram\n6 -",
  "2023_32": "32. CMMI-DEV(CMMI for Development)는 소프트웨어\n개발 시 프로세스 품질을 향상시킬 수 있는 가\n이드라인이다. 다음은 CMMI-DEV의 22개 프로세스\n영역 중 일부이다. 이 중 분류체계 성격이 가장\n다른 것은 어느 것인가?\n① Configuration Management(CM)\n② Technical Solution(TS)\n③ Decision Analysis and Resolution(DAR)\n④ Causal Analysis and Resolution(CAR)",
  "2023_33": "33. Software Engineering Institute(SEI) 아키텍처\n뷰 모델 중 다음 설명에 해당하는 뷰(View)로 가\n장 적절한 것은?\nŸ 데이터의 생성과 소비에 관련된 내용으로 컴포\n넌트들에 감지된 이벤트를 통해 상호작용한다.\nŸ 데이터의 생성자와 사용자를 구분하고 이벤트\n를 통하여 정보의 사용을 관리한다.\nŸ 모든 컴포넌트는 이벤트 분배자(Distributor)\n에 연결된다.\n① Peer to Peer View\n② Client-Server View\n③ Pipe and Filter View\n④ Publish-Subscribe View",
  "2023_34": "34. ISO/IEC/IEEE 29119는 소프트웨어 테스트에 대한 표준을\n정의하고 있다. 다음 중 ISO/IEC/IEEE 29119 파트 2에\n정의된 전체적 적합성(full conformance)과 맞춤형 적합\n성(tailored conformance)에 대한 설명 중 가장 적절한\n것은?\n① 전체적 적합성은 모든 프로세스의 요구사항을 전\n부 만족하는 것이고, 맞춤형 적합성은 프로세스\n의 일부의 요구사항을 모두 만족하는 것이다.\n② 전체적 적합성은 모든 프로세스의 요구사항을\n전부 만족하는 것이고, 맞춤형 적합성은 일부\n프로세스의 일부 요구사항을 만족하는 것이다.\n③ 전체적 적합성은 합의된 프로세스의 요구사항을\n모두 만족하는 것이고, 맞춤형 적합성은 합의된\n프로세스의 일부를 만족하는 것이다.\n④ 전체적 적합성은 모든 프로세스의 요구사항과 권\n고사항을 전부 만족하는 것이고, 맞춤형 적합성은\n모든 프로세스의 요구사항만을 만족하는 것이다.\n- 7",
  "2023_35": "35. 다음 설명에 해당하는 아키텍처 스타일로 가장\n적절한 것은?\n사용자 인터페이스를 시스템의 다른 부분과 분리\n하여 결합도를 낮추기 위한 아키텍처 스타일로,\n사용자 인터페이스를 담당하는 계층의 응집력을\n높일 수 있고, 여러 개의 다른 UI를 만들어 그 사\n이에 결합도를 낮출 수 있다.\n① Event-Driven style\n② Client-Server style\n③ Model-View-Controller style\n④ Layered style",
  "2023_36": "36. 다음은 웹 SOA(service oriented architecture)\n에 대한 주요 표준과 이들에 대한 설명이다. 상\n호간의 연결이 가장 적절한 것은?\n웹 SOA\n설명\n주요 표준\nA. 여러 개의 다른 서비스를 포함하는\n프로세스 프로그램을 정의하는데 사\n가. SOAP\n용되는 워크플로우 언어\n나. WSDL\nB. 서비스 인터페이스 정의에 대한 표준\n다. WS-BPEL\nC. 서비스들 간의 통신을 지원하는 메\n시지 교환 표준\n① 가-A, 나-B, 다-C ② 가-B, 나-C, 다-A\n③ 가-C, 나-A, 다-B ④ 가-C, 나-B, 다-A",
  "2023_37": "37. 애자일 프로젝트 관리 방법인 스크럼(scrum)에\n대한 설명 중 가장 적절하지 않은 것은?\n① 스크럼(scrum)은 소프트웨어 개발 팀이며 7명을\n넘지 않을 것을 권장한다.\n② 스프린트(sprint)는 개발에서 이루어지는 반복\n을 의미하며 주로 2~4주 길이로 구성한다.\n③ 제품 백로그(product backlog)는 해야 할 일에 대\n한 목록이며 소프트웨어 요구사항 등이 포함된다.\n④ 스크럼 마스터(scrum master)는 프로젝트 관리\n자와 유사한 역할이며 팀이 스크럼 프로세스를\n효과적으로 따를 수 있도록 한다.\n7 -",
  "2023_38": "38. 다음 중 CMMI 수준 3인 정의(defined) 단계의 프로\n세스 영역에 해당하는 것으로 가장 적절한 것은?\n가. 위험 관리(Risk Management)\n나. 통합 프로젝트 관리(Integrated Project\nManagement)\n다. 정량적 프로젝트 관리(Quantitative Project\nManagement)\n라. 조직 프로세스 정의(Organizational Process\nDefinition)\n마. 조직 프로세스 성과 관리(Organizational\nProcess Performance)\n① 가, 나, 라 ② 가, 나, 마\n③ 나, 다, 라 ④ 다, 라, 마",
  "2023_39": "39. 마이크로서비스(microservice) 아키텍처의 특징\n에 대한 설명 중 가장 적절하지 않은 것은?\n① 각 컴포넌트는 응집력이 있고 독립적이며 자체 배\n포가 가능하여 지속적 통합과 배포에 적합하다.\n② 특정 컴포넌트에서 장애가 일어나더라도 이를\n격리하여 애플리케이션 전체가 중단되지 않도록\n할 수 있다.\n③ 컴포넌트들은 서로 느슨하게 결합되어 있고 각\n각 독립된 기능을 제공하며 단일 데이터베이스\n를 중심으로 통합된다.\n④ 마이크로서비스 간 통신은 오케스트레이션\n(orchestration) 또는 코레오그래피(choreography)\n방식을 사용할 수 있다.",
  "2023_40": "40. 다음 UML State Machine 다이어그램의 Y 상태에\n서 signal 이벤트를 받았을 때 Z 상태로 전이하\n면서 실행되는 액션의 순서로 가장 적절한 것은?\n① A, B, C, E, D ② B, C, A, D, E\n③ C, B, A, E, D ④ D, C, A, B, E\n- 8",
  "2023_41": "41. 각 개발 단계에서 생성된 결함의 수와 발견된 결\n함의 수는 다음 표와 같다. 단계별 PCE(Phase\nContainment Effectiveness)가 큰 단계에서 작은\n단계의 순서대로 바르게 나열한 것은?\n결함발견 단계\n분석 설계 구현 테스트\n결함생성 단계\n분석 114 27 4 15\n설계 93 6 24\n구현 213 105\n① 분석 - 설계 – 구현 ② 분석 – 구현 - 설계\n③ 설계 – 구현 – 분석 ④ 설계 – 분석 – 구현",
  "2023_42": "42. Git 명령어에 대한 설명으로 가장 적절한 것은?\n① git push – 원격 저장소의 모든 내용을 로컬 저\n장소로 복사한다.\n② git fetch – 로컬 저장소의 변경 사항을 원격 저\n장소로 보낸다.\n③ git pull – git remote 명령을 통해 서로 연결\n된 원격 저장소의 최신 내용을 로컬 저장소로\n가져오면서 병합한다.\n④ git clone – 로컬 저장소와 원격 저장소의 변경\n사항이 다를 때 이를 비교 대조하고 git merge\n명령어와 함께 최신 데이터를 반영하거나 충돌\n문제 등을 해결한다.",
  "2023_43": "43. 다음 그림은 메인라인, 베이스라인, 코드라인의\n관계를 나타낸다. A, B, C를 각각의 코드라고 할\n때, (가)~(다)에 해당하는 것을 바르게 연결한\n것은?\n(가) (나) (다)\n① 코드라인 메인라인 베이스라인\n② 베이스라인 코드라인 메인라인\n③ 코드라인 베이스라인 메인라인\n④ 메인라인 베이스라인 코드라인\n8 -",
  "2023_44": "44. 다음 컴포넌트 Cc의 안정성(stability) 지표로\n가장 적절한 것은?\n① Fan-in: 3, Fan-out: 1, I(Instability): 1/4\n② Fan-in: 1, Fan-out: 3, I(Instability): 1/4\n③ Fan-in: 3, Fan-out: 1, I(Instability): 3/4\n④ Fan-in: 1, Fan-out: 3, I(Instability): 3/4",
  "2023_45": "45. 다음 소스 코드 커버리지의 포함 관계에서\n(가)~(라)에 해당하는 항목으로 바르게 연결한\n것은?\n① (가) 구문커버리지 (나) 조건/결정커버리지\n(다) 변경 조건/결정 커버리지 (라) 다중 조건 커버리지\n② (가) 다중 조건 커버리지 (나) 조건/결정커버리지\n(다) 변경 조건/결정 커버리지 (라) 구문커버리지\n③ (가) 구문커버리지 (나) 변경 조건/결정 커버리지\n(다) 조건/결정커버리지 (라) 다중 조건 커버리지\n④ (가) 다중 조건 커버리지 (나) 변경 조건/결정 커버리지\n(다) 조건/결정커버리지 (라) 구문커버리지\n- 9",
  "2023_46": "46. 다음은 JUnit4의 코드 골격이다. 테스트 수행시\n에 메소드들의 수행순서로 가장 적절한 것은?\npublic class TestSample {\n@BeforeClass\npublic static void a() { }\n@AfterClass\npublic static void b() { }\n@Before\npublic void c() { }\n@After\npublic void d() { }\n@Test\npublic void t1() { }\n@Test\npublic void t2() { }\n}\n① a(), b(), c(), d(), t1(), t2()\n② a(), c(), t1(), t2(), d(), b()\n③ a(), c(), t1(), d(), c(), t2(), d(), b()\n④ a(), c(), t1(), d(), b(), a(), c(), t2(),\nd(), b()",
  "2023_47": "47. 다음 중 Release testing에 대한 설명으로 가장\n적절한 것은?\n① 심각한 결함을 유발하는 버그들을 검출하기 위\n해 결함 테스팅을 수행한다.\n② 시스템을 개발한 팀원들로 구성된 검증팀을 따\n로 만들어 테스팅을 수행한다.\n③ 외부 배포 이전에 시스템의 요구명세 기반 블랙\n박스 테스팅을 수행한다.\n④ 시스템 테스팅에서 확인된 요구사항은 제외하고\n변경 항목들을 테스트한다.",
  "2023_48": "48. 다음 상황에 부합하는 유지보수 유형으로 가장 적\n절한 것은?",
  "2023_49": "49. 다음에 설명하는 4가지 유형의 소프트웨어 형상\n관리 활동에 해당하지 않은 것은?\nA. 베이스라인을 설정하고 식별된 모든 형상 항목에\n식별자를 부여한다.\nB. 변경요청이 발생했을 때 해당 변경에 대한 평가,\n조정, 변경 승인 등의 활동을 수행한다.\nC. 형상 항목에 대한 변경 히스토리를 기록하고 보고\n한다.\nD. 개발된 소프트웨어 제품이 승인된 제품의 명세와\n정확히 일치하는지를 평가한다.\n① Configuration Status Accounting\n② Configuration Identification\n③ Configuration Verification\n④ Configuration Control",
  "2023_50": "50. 다음 중 (가)~(다)에 들어갈 용어를 순서대로 가장\n적절하게 나열한 것은?\nSPICE는 소프트웨어 개발 프로세스 개선을 목적으\n로 제정된 ISO 15504 표준의 별칭으로, L0:\nIncomplete Process, L1: (가) Process, L2: (나)\nProcess, L3: (다) Process, L4: Predictable\nProcess, L5: Optimizing Process로 총 6레벨의 성\n숙도로 정의되어 있다.\n① Managed, Established, Performed\n② Managed, Performed, Established\n③ Established, Performed, Managed\n④ Performed, Managed, Established\n- 10\n0 -",
  "2024_26": "26. 다음 중 애자일 소프트웨어 개발 방법론에 대한\n설명으로 가장 적절하지 않은 것은?\n① Extreme programming에서 시스템 고객은 개발\n팀의 일부이고 다른 팀원들과 시나리오에 대해\n토론한다.\n② 사용사례 또는 사용자 스토리 단위로 조금씩 반\n복적으로 release를 한다.\n③ Scrum approach에서는 제품 백로그 작성, 스프\n린트 계획 회의, 스프린트 수행, 스프린트 검토\n및 회고 등의 프로세스를 가진다.\n④ Sprint cycle은 inception, elaboration, construct\n-ion, transition이 반복적으로 수행되어 진다.",
  "2024_27": "27. 다음 중 소프트웨어 비용산정 모델인 COCOMO II\n에 대한 설명으로 가장 적절하지 않은 것은?\n① COCOMO II 2000 계수조정모델에서 소프트웨어\n개발에 소요되는 노력의 양은 소프트웨어 규모\n에 대해 규모의 경제(Scale of Economy) 효과를\n가지지 못한다.\n② 외부입력(EI)의 복잡도 가중치와 외부질의(EQ)의\n복잡도 가중치는 같다.\n③ 재사용 모델에서 변경률(AAF)의 산정시 코드 변\n경률(CM)에 대한 가중치가 설계 변경률(DM)에\n대한 가중치와 재사용 소프트웨어에 대한 통합\n노력률(IM)에 대한 가중치 보다 높다.\n④ 재사용 모델에서 설계 변경률(DM) 또는 코드 변\n경률(CM)이 0이면, 소프트웨어에 대한 이해도\n(SU)는 0이 된다.",
  "2024_28": "28. 다음 상황에서 사용할 수 있는 UML 다이어그램\n으로 가장 적절한 것은?\n가. 전체 시스템 수준에서 시스템과 상호작용하는\n각 액터의 관점에서 모델링하고자 함\n나. 시스템 객체사이의 어떤 제어흐름 및 알고리즘\n설계, 동기화의 필요성 또는 병렬수행 가능성을\n파악하고자 함\n① Activity Diagram ② State Diagram\n③ Class Diagram ④ Use Case Diagram\n- 5",
  "2024_29": "29. 마스터 브랜치에서 bugFix01의 새로운 브랜치를\n생성한 다음, HEAD 포인터가 이 새로운 브랜치\n를 가리키게 하기 위한 Git 명령어로 가장 적절\n한 것은?\n① git add bugFix01\n② git branch bugFix01\n③ git checkout bugFix01\n④ git merge bugFix01",

  "2024_36": "36. IEEE 29119에서는 combinatorial test design 방법\n으로서 base choice 방법을 제시하고 있다. 다음\n과 같이 4개의 글꼴 이름, 5개의 글꼴 크기, 3개\n의 스타일에 대한 테스트를 base choice 방법을\n사용할 때 테스트케이스 수로서 가장 적절한 것\n은?\n·글꼴 이름: 궁서, 굴림, 바탕, 고딕\n·글꼴 크기: 10, 12, 14, 16, 18\n·스타일: 밑줄, 기울임, 보통\n① 5개 ② 10개\n③ 20개 ④ 60개",
  "2024_37": "37. 다음은 테스트케이스 설계 기법을 적용한 예이다.\n이 설명에서 적용된 테스트케이스 설계 기법으로\n서 가장 적절한 것은?\n함수 getDistance()는 양방향 그래프의 시작위치와\n목적지위치를 인자로 한다. 시작위치를 A로 하고\n목적지위치를 B로 하였을 때의 거리 D를 첫 번째\n테스트케이스로 결정하였다. 그리고 이를 바탕으로\n시작위치를 B로 하고 목적지위치를 A로 하였을 때\n동일한 거리 D를 두 번째 테스트케이스로 결정하였\n다.\n① Equivalence partitioning\n② Decision table testing\n③ Metamorphic testing\n④ Requirement-based testing",
  "2024_38": "38. 다음 중 소프트웨어 유지관리 용이성을 향상시키\n는 개발 활동으로 가장 적절하지 않은 것은?\n① 표준과 지침을 개발하여 실시하는 분석 활동\n② 복수 엔트리, 복수 엑시트 구조를 사용한 구현\n활동\n③ 정보은닉, 자료 추상화, 하향식 계층 분배 원리\n를 관할한 기본 설계 활동\n④ 각 루틴에 대한 부작용과 예외조치 방안을 정립\n한 상세 설계 활동\n- 7",
  "2024_39": "39. ISO/IEC 5055에서는 품질 특성을 평가하기 위한\n소스코드의 weakness를 제시하고 있다. 다음 중\n에서 ISO/IEC 5055에서 제시하고 있는 품질 특성\n으로 가장 적절하지 않은 것은?\n① Maintainability ② Security\n③ Reliability ④ Usability",
  "2024_40": "40. 다음 중 코드 스멜과 이를 해결하기 위한 리팩토링\n방법을 가장 적절하게 연결한 것만으로 짝지은 것은?\n코드 스멜 리팩토링\n(가) 다른 클래스를 지나 (a) 여러 클래스에 흩어\n치게 애용 (Feature 진 유사한 기능을\nEnvey) 한 곳으로 모은다.\n(나) 여러 클래스를 동시 (b) 메소드를 그들이 애\n에 수정 (Shotgun 용하는 데이터가 있\nSurgery) 는 클래스로 옮긴다.\n(c) 다형성으로 바꾼다.\n(다) 유사 데이터의 중복 (같은 메소드를 가진\n(Data Clumps) 여러 개의 클래스를\n구현한다.)\n(d) 해당 데이터들을 독\n(라) 너무 많은 Switch, if\n립된 클래스로 정의\n문장\n한다.\n① (가) - (a), (다) - (c)\n② (가) - (b), (다) - (d)\n③ (나) - (a), (라) - (d)\n④ (나) - (b), (라) - (c)",

  "2024_43": "43. TMMi(Test Maturity Model Integration)는 소프트\n웨어 테스트 프로세스 등급 척도 모델로 소프트\n웨어 테스트 조직이 갖추고 있는 성숙도를 평가\n하고 프로세스를 개선하기 위한 모델이다. 다음\n중 TMMi 레벨 2에서 테스트 계획(test planning)\n프로세스 영역의 세부 목표로 가장 적절하지 않\n은 것은?\n① 제품 위험 평가 수행(perform a product risk assessment)\n② 테스트 접근 방식 설정 (establish a test approach)\n③ 테스트 추정치 설정(establish test estimates)\n④ 테스트 성능 지표 설정(establish test performance indicators)",
  "2024_44": "44. 다음의 상황에서 사용할 수 있는 요구사항 추출\n방법으로 가장 적절한 것은?\n가. 고객이 자신의 요구사항에 대하여 구체적으로\n파악하고 있지 못한 상태임\n나. 최종 시스템의 예상 기능 중 일부를 빠르게 구\n현하여 고객의 피드백을 조기에 받고자함\n다. 발굴된 아이디어를 시험하고 검증하여 새로운\n아이디어를 얻고자함\n① 관찰(Observation)\n② 인터뷰(Interview)\n③ 브레인스토밍(Brainstorming)\n④ 프로토타이핑(Prototyping)\n- 8",
  "2024_45": "45. 다음은 스프링 MVC의 구조를 나타낸다. (가)~(라)\n에 해당하는 가장 적절한 것은?\n① (가) DispatcherServlet (나) HandlerMapping\n(다) ModelAndView (라) ViewResolver\n② (가) DispatcherServlet (나) ModelAndView\n(다) HandlerMapping (라) ViewResolver\n③ (가) ViewResolver (나) HandlerMapping\n(다) ModelAndView (라) DispatcherServlet\n④ (가) ViewResolver (나) ModelAndView\n(다) HandlerMapping (라) DispatcherServlet",
  "2024_46": "46. 다음 설명에 해당하는 객체지향 설계 원칙으로 가장\n적절한 것은?\n추상 클래스와 인터페이스는 구체적인 클래스보다\n덜 변하기 때문에 외부에서 해당 클래스를 참조하\n기 위해서는 가능한 추상 클래스에 의존한다.\n① ISP(Interface Segration Principle)\n② DIP(Dependency Inversion Principle)\n③ OCP(Open/Close Principle)\n④ LSP(Liskov Substitution Principle)",
  "2024_47": "47. 다음 중 SP(SW 프로세스 품질) 인증에 관한 설명\n으로 가장 적절한 것은?\n① 프로세스 평가는 프로세스와 수행 능력 수준 단\n계를 기준으로 하여 2차원으로 이루어진다.\n② 한국지능정보사회진흥원(NIA)이 인증을 담당하는\n기관이다.\n③ 3등급을 신청하였으나, 2등급 영역만을 인정받은\n경우에는 2등급을 부여한다.\n④ 총 5개 영역, 14개 영역별 평가항목, 60개 세부\n평가항목으로 품질인증 기준을 구성한다.\n8 -",
  "2024_48": "48. IFPUG의 기능점수는 개발 기능점수(DFP), 개선\n기능점수(EFP), 어플리케이션 기능점수(AFP)로 구\n분된다. 다음과 같은 조건이 주어졌을 때, 개선\n기능점수(EFP)를 구하는 식으로 가장 적절한 것\n은?\n·ADD = 개선 프로젝트에 의해 추가된 기능의 미\n조정 기능점수값\n·CHGA = 개선 프로젝트에 의해 수정된 기능의\n미조정 기능점수값\n·CFP = 데이터 변환에 의해 포함된 기능점수값\n·VAFA = 개선 프로젝트 종료 후의 어플리케이션\n값 조정인자\n·DEL = 개선 프로젝트에 의해 삭제된 기능의 미\n조정 기능점수값\n·VAFB = 개선 프로젝트 이전의 어플리케이션 값\n조정인자\n① EFP = [(ADD+CHGA+CFP+DEL)×VAFA]\n② EFP = [(ADD+CHGA+CFP-DEL)×VAFA]\n③ EFP = [(ADD+CHGA+CFP)×VAFA]-(DEL×VAFB)\n④ EFP = [(ADD+CHGA+CFP)×VAFA]+(DEL×VAFB)",

  "2025_26": "26.)」에 따른 공공\n데이터 목록, 데이터 등록기준에 관한 설명으로 가\n장 적절하지 않은 것은?\n① 오픈API로 제공하는 경우 기술문서를 포함하고\n데이터수집및DB저장등민간의자유로운활용을\n반드시 보장해야 한다\n② 데이터는 엑셀, XML, JSON과 같은 구조화\n된 형태의 오픈포맷으로 등록·개방하는 것이\n원칙이다.\n③ 공공데이터목록을등록할때업무단위는정부기능\n분류(BRM)의 단위과제 수준에서 선정한다.\n④ 비정형데이터는 데이터 분석이나 학습 등에 활용\n가능한 형태로 등록해야 한다.",
  "2025_27": "27. 다음 중 ISO/IEC 25010:2011의 유지보수성\n(maintainability)으로 가장 적절하지 않은 것은?\n① 시스템이 다른 하드웨어, 운영환경 등에 효과적\n으로 적응할 수 있어야 한다.\n② 시스템에대한테스트 기준(criteria)을설정하고 이\n기준의 충족 여부를 효과적으로 테스트할 수 있\n어야 한다.\n③ 새로운 결함을 유발하거나 기존의 품질을 악화\n시키지 않으면서 시스템을 효과적으로 변경할\n수 있어야 한다.\n④ 특정 컴포넌트에 가해진 변경이 다른 컴포넌트에\n미치는 영향을 최소화할 수 있어야 한다.",
  "2025_28": "28. 다음 설명에 해당하는 테스트 설계 기법으로 가장\n적절한 것은?\nŸ 테스트대상과사용자사이에발생할수있는입/출력\n의 시퀀스에 대한 모델을 바탕으로 테스트 케이스를\n설계한다.\nŸ 시스템 테스트, 인수 테스트를 수행할 때\nEnd-to-End기능테스트를위하여주로활용된다.\n① State transition testing\n② Decision table testing\n③ Scenario testing\n④ Requirement-based testing\n- 6",

  "2025_30": "30. 다음 클래스 다이어그램에서 Class2에 대한 Java\n소스코드로 가장 적절한 것은?\n① ②\nclass Class2 extends class Class2 implements\nClass1 { Class1 {\nprivate int attr1; private int attr1;\nprivate int attr2; private static int attr2;\n} }\n③ ④\nclass Class2 implements class Class2 extends\nClass1 { Class1 {\nprivate final int attr1; private final int attr1;\nprivate int attr2; private static int attr2;\n} }\n6 -",
  "2025_31": "31. ISO/IEC25023:2016에서는ISO/IEC25010:2011의 품질\n특성을 대상으로 품질을 측정하기 위한 척도\n(measure)를 제시하고 있다. 다음 ISO/IEC 25010의\n신뢰성에 대한 척도로 가장 적절한 것은?\n가. 전체기능중에서합리적이고수용가능한수준의\n결과를 산출하는 기능의 비율\n나. 관찰 기간 동안에 탐지된 장애(failure)의 수\n다. 장애로부터 복구될 때까지의 평균 시간\n라. 비인가된 접근에 의한 데이터 변조 방지 비율\n① 가, 나 ② 나, 다\n③ 다, 라 ④ 가, 다",
  "2025_32": "32. 다음 중 SysML의 Requirement Diagram이 표현\n하는정보에해당되는것으로가장적절한것은?\n가. 요구사항의 계층 구조를 가시적으로 표현한다.\n나. 다른 모델 요소들과의 관계를 표현한다.\n다. 개별 요구사항에 대하여 표현한다.\n라. 입력, 출력, 처리의 흐름 관점에서 표현한다.\n마. 시스템특성의제약사항에대한수식을표현한다.\n① 가, 나, 다 ② 가, 다, 라\n③ 나, 다, 마 ④ 다, 라, 마",
  "2025_33": "33. 다음인공지능테스트관련 설명으로가장적절하지\n않은 것은?\n가. 입력 데이터의 변화에 대하여 추론 결과가\n어떻게 변하는지에 대한 관련성을 이용한다.\n나. 타당한 추론 결과를 얻을 수 있는 정확한\n범위를 파악하지 못해도 타당한 값을 얻을 수\n있는 예상되는 범위가 있다.\n다. 테스트 데이터 셋을 이용하여 뉴런이 얼마나\n활성화되었는지 측정하고, 활성화되지 않은\n뉴런에 대하여 테스트 데이터를 추가한다.\n라. 인위적인 노이즈가 포함된 데이터를 입력하여\n잘못된 작업을 수행하도록 유도한다.\n① 가-메타모픽테스트기법(metamorphictesting)\n② 나-커버리지테스트기법(coverage testing)\n③ 다-뉴런커버리지테스트기법(neuroncoveragetesting)\n④ 라-적대적공격기법(adversarial attack)\n- 7",
  "2025_34": "34. 임의의 거리만큼 떨어진 두 데이터에 대하여동일한\n결과를 출력하는 AI SW는 이 두 데이터에 대하여\n강건성(Robustness)를 갖는다고 할 수 있다. 다음\n그림에 주어진 두 점사이의 거리의 의미로 가장\n적절한 것은?\n① 가 –유클리드 거리(Euclidean distance)\n② 나 –세이프 거리(Safe distance)\n③ 나 –체비쇼프 거리(Chebyshev distance)\n④ 다 –맨해튼 거리(Manhattan distance)",
  "2025_35": "35. 다음 의무사항을 가지는 오픈소스 라이선스로 가장\n적절한 것은?\n가. 각 복제본에 적절한 저작권 안내와 보증책임이\n없음을 명시할 것\n나. 본 라이선스를 언급하는 안내 사항과 보증책임\n관련 고지사항을 원본 그대로 유지할 것\n다. 소프트웨어를 양도받는 모든 이들에게 소프트\n웨어와 함께 라이선스 사본을 제공할 것\n라. 라이브러리 형태로의 수정을 허용하며, 만약 수\n정한경우수정사실과날짜를파일에명기할 것\n마. 원본저작물 및 파생저작물에 대한 소스코드를\n제공하거나 요청 시 제공하겠다는 약정서를\n제공할 것\n바. 응용 프로그램을 배포할 경우, 본 라이브러리를\n사용하고 있다는 사실을 명시할 것\n사. 사용자가라이브러리를수정해도응용프로그램을\n사용할 수 있도록 허용할 것\n① MPL(Mozilla Public License)\n② GPL(General Public License)\n③ LGPL(Lesser General Public License)\n④ BSD(Berkeley Software Distribution)\n7 -",
  "2025_36": "36. 다음 클라우드 컨테이너에 대한 설명 중 적절하지\n않은 것을 모두 묶은 것은?\n가. 독립된 환경에서 동작하는 가상화의 일종이다.\n나. 컨테이너 간의 운영체제를 공유한다.\n다. 쿠버네티스는 컨테이너화된 워크로드와 서비스를\n관리하는 오케스트레이션 도구이다.\n라. 컨테이너는서로다른운영체제를사용할수있다.\n마. 컨테이너에서는 애플리케이션을 제어하는 하이퍼\n바이저가 필요하다.\n바. 애플리케이션이모놀리식아키텍처인경우컨테이너\n기반 개발이 유리하다.\n① 가, 다, 마 ② 가, 라, 마\n③ 가, 나, 마, 바 ④ 가, 라, 마, 바",
  "2025_37": "37. 다음은MSA(Microservice Architecture)기반소프트\n웨어 개발에서 마이크로서비스 설계 절차에 대한\n설명이다. 설계 절차에 따른 순서가 가장 적절한\n것은?\n가. 시스템의 핵심적인 부분을 개념화하고 개발조직,\n서비스 구성 등을 포함하는 시스템의 핵심 부\n분을 스케치한다.\n나. 의사결정을 위하여 적용되어야 하는 정책, 제약\n사항, 원칙 등을 정의한다.\n다. 신뢰성 또는 보안성과 같이 시스템이 달성해야\n하는 동작의 최적화된 작은 목표를 식별한다.\n라. 가시성을 향상시키기 위하여 현재의 상태를 진단\n하고, 작은 변경을 수용할 수 있는 영향 분석을\n수행한다.\n① 가 - 나- 다–라 ② 나-다-가-라\n③ 다-나- 가–라 ④ 라-나-다-가",
  "2025_38": "38. 다음 설명에 해당하는 소프트웨어 아키텍처 뷰\n모델로 가장 적절한 것은?\nŸ 데이터처리가일련의흐름을가지고있고, 데이터는\n이 흐름 상에서 중간에 처리된다.\nŸ 흐름에따른데이터의변환이이루어지고데이터는\n변환이완료되어 최종 목적지에 다다르게된다.\n① 피어 투 피어 뷰(Peer to Peer View)\n② 클라이언트-서버 뷰(Client-Server View)\n③ 파이프와 필터 뷰(Pipe and Filter View)\n④ 발행-구독 뷰(Publish-Subscribe View)\n- 8",
  "2025_39": "39. 다음 의사 코드(Pseudo Code)에 대하여 McCabe의\nComplexity Number를 계산한 것으로 가장 적절한\n것은? (단, 코드 실행에 대한 오류는 없는 것으로\n가정함)\nfunction exampleFunction(x, y):\nif x > 0:\nprint(\"x is positive\")\nelse:\nprint(\"x is non-positive\")\nif y > 0:\nprint(\"y is positive\")\nelse:\nprint(\"y is non-positive\")\nfor i from 1 to 5:\nprint(i)\nreturn x + y\n① 3 ② 4 ③ 5 ④ 6",
  "2025_40": "40. ITIL 4는 IT 서비스 관리의 프레임워크이다. ITIL\nService Value System(SVS)에서는 14개의 General\nManagement Practices, 17개의Service Management\nPractices, 그리고 3개의 Technical Management\nPractices를 포함한다. 다음 중 Service Management\nPractices로가장적절하지않은것은?\n① Business Analysis\n② Change Control\n③ IT Asset Management\n④ Software Deployment and Management",
  "2025_41": "41. ISO 22989:2022 표준에서 AI 시스템의 신뢰성\n(Trustworthiness)은AI 시스템이관련이해당사자의\n기대에 부합하는지를 나타내는 특성을 의미한다.\n다음 설명으로 가장 적절한 것은?\n사고 후 시스템이 운영 상태를 빠르게 복구하는\n능력으로, 이해관계자가 허용할 수 있는 일부 유형의\n장애에서 저하된 수준의 운영을 제공할 수 있는\n능력\n① AI Robustness ② AI Resilience\n③ AI Controllability ④ AI Explainability\n8 -",
  "2025_42": "42. 다음과같이예제코드와테스트케이스가주어졌을때,\n제시된테스트케이스에대한커버리지(Coverage)기준의\n충족여부에대한설명으로가장옳은것은? (단, 예제\n코드에는오류가없는것으로가정한다.)\ndef check_number(num):\nif num > 0:\nif num % 2 == 0:\nreturn \"양수 짝수\"\n예제 코드\nelse:\nreturn \"양수 홀수\"\nelse:\nreturn \"음수 또는 0\"\ntest_case_1 = check_number(4)\n테스트\ntest_case_2 = check_number(7)\n케이스\ntest_case_3 = check_number(-1)\n① Every Branch Coverage만 만족\n② Every Statement Coverage만 만족\n③ Every Branch Coverage와 Every Statement\nCoverage 모두 만족\n④ Every Branch Coverage와 Every Statement\nCoverage 모두 만족하지 않음",
  "2025_43": "43. 요구사항 검증 과정에서 수행하는 점검 항목과\n그에 대한 설명으로 가장 적절하게 연결한 것은?\n가. 요구사항이 사용자의 실제 요구를 반영하는지\n점검한다.\n나. 요구사항이 서로 상충하지 않고 서로 모순인\n제약조건이 없는지 점검한다.\n다. 사용자가 의도한 모든 기능과 제약조건이 요구\n사항에 포함되었는지 점검한다.\n라. 현재의 기술과 지식을 사용해서 주어진 예산으로\n실제로 구현이 가능한지 점검한다.\n① 가 - 유효성 점검, 나 - 일관성 점검\n② 가 - 실현성 점검, 나 - 완전성 점검\n③ 다 - 완전성 점검, 라 - 유효성 점검\n④ 다 - 일관성 점검, 라 - 실현성 점검\n- 9",
  "2025_44": "44. 다음Java 코드의생략부분은고려하지않고클래스\n다이어그램으로 가장 적절하게 표현한 것은?\ninterface Service { public void doWork(); }\nclass Person { ... }\nclass Task { ... }\nclass Staff extends Person implements Service {\npublic void doWork() { Task t = new Task(); ... }\n}\n①\n②\n③\n④",
  "2025_45": "45. 보통의 경우 Normal 유스케이스 시나리오가 사용\n되지만 특정 조건 하에서 Conditional 유스케이스\n시나리오가사용된다는UML 표기법으로가장 적절한\n것은?\n①\n②\n③\n④\n9 -",
  "2025_46": "46. 다음코드에서left=22이고right=21일때,문장커버리지\n로 가장 적절한 것은? (단, 각 라인에 번호가 부여\n된 것을문장으로간주한다.)\npublic int play(int left, int right) {\n1 int ln = left;\n2 int rn = right;\n3 if (ln > 21)\n4 ln = 0;\n5 if (rn > 21)\n6 rn = 0;\n7 if (ln > rn)\n8 return ln;\n9 else\n10 return rn;\n}\n① 60% ② 70%\n③ 80% ④ 100%",
  "2025_47": "47. RESTful 서비스의 사용 예로 가장 적절하게 묶은\n것은?\n가. 회원 정보를 알고 싶은 경우,\nREAD http://localhost:8080/rest/api/v1/user/1\n나. 회원 가입을 하는 경우,\nPOST http://localhost:8080/rest/api/v1/user\n{\n\"username\": \"박혜자\",\n\"password\": \"5798\",\n\"email\": \"hyeja@google.com\",\n...\n}\n다. 회원 정보를 수정하고 싶은 경우,\nUPDATEhttp://localhost:8080/rest/api/v1/user/1\n{\n\"\"password\": \"9057\"\n}\n라. 회원을 탈퇴 처리하고 싶은 경우,\nDELETEhttp://localhost:8080/rest/api/v1/user/1\n① 가, 라 ② 가, 다\n③ 나, 라 ④ 나, 다, 라\n- 1",
  "2025_48": "48. 다음과 같이 금고경비시스템을 구현하는 의사코드\n(가)를 의사코드 (나)로 변경하는데 적용된 설계패턴\n으로 가장 적절한 것은?\n(가)\nclass 경비시스템{\n금고 사용 시 호출되는 메소드(){\nif(주간) {\n경비 센터에 사용 기록\n} else if (야간) {\n경비 센터에 비상 상황 통보\n}\n}\n비상벨 사용 시 호출되는 메소드(){\n경비 센터에 비상벨 통보\n}\n일반 통화 시 호출되는 메소드(){\nif(주간) {\n경비 센터 호출\n} else if (야간) {\n경비 센터 자동 응답기 호출\n}\n}\n}\n(나)\n주간을 표현한클래스{ 야간을표현한클래스{\n금고사용시호출되는메소드(){ 금고사용시호출되는메소드(){\n경비센터에사용기록 경비센터에비상상황통보\n} }\n비상벨사용시호출되는메소드(){ 비상벨사용시호출되는메소드(){\n경비센터에비상벨통보 경비센터에비상벨통보\n} }\n일반통화시호출되는메소드(){ 일반통화시호출되는메소드(){\n경비센터호출 경비센터자동응답기호출\n} }\n} }\n① State Patterm\n② Adapter Patterm\n③ Builder Patterm\n④ Template Method Patterm\n10 -",
  "2025_49": "49. 다음 코드와 같이 스위치 문에서 분류 코드 종류에\n따라객체가다른동작을하는코드에적용한리팩토링\n기법으로가장적절한것은?\npubicclassShape{\nprivatefinalint_typecode;\n...\npublicvoiddraw(){\nswitch(_typecode){\ncaseTYPECODE_LINE:\n...\nbreak;\ncaseTYPECODE_RECTANGLE:\n...\nbreak;\ncaseTYPECODE_OVAL:\n...\nbreak;\ndefault:\n;\n}\n}\n...\n}\npubicabstractclassShape{\nprivatefinalint_typecode;\n...\npublicabstract voiddraw();\n}\npublicclassShapeLineextendsShape{\n...\n@Overridepublicvoiddraw(){\n...\n}\n}\npublicclassShapeRectangleextendsShape{\n...\n@Overridepublicvoiddraw(){\n...\n}\n}\npublicclassShapeOvalextendsShape{\n...\n@Overridepublicvoiddraw(){\n...\n}\n}\n① Pull Up Method\n② Replace Type Code with Class\n③ Replace Parameter with Method\n④ Replace Type Code with Subclasses\n- 1",

  "2026_28": "28. 다음은 Proxy 패턴을 Java로 구현한 것이다. 보기의\n클래스 다이어그램 중 다음 코드에 나타난 부분을\nUML 표기법으로 가장 적절하게 표현한 것은?\n(생략된 부분은 무관하게 선택)\npublic interface Subject {\nvoid Request();\n}\npublic class RealSubject implements Subject {\n@Override\npublic void Request() { ... }\n...\n}\npublic class Proxy implements Subject {\nprivate RealSubject realSubject;\n@Override\npublic void Request() { ... }\n...\n}\npublic class Client { ... }\n①\n②\n③\n④\n6 -",

  "2026_37": "37. Git 버전관리 시스템에 대한 (가)~(라)에 해당하는\n명령을 순서대로 가장 적절하게 나열한 것은?\n가. 원격 저장소를 로컬 저장소로 복제\n나. 로컬 저장소 변경을 원격 저장소에 반영\n다. 원격 저장소 브랜치의 변경을 로컬 저장소로\n가져오되 merge는 안 함\n라. 원격 저장소 브랜치의 변경을 로컬 저장소로\n가져와서 merge를 실시함\n① clone, push, fetch, pull\n② clone, commit, fetch, pull\n③ fetch, push, pull, commit\n④ fetch, commit, pull, push\n- 8",

  "2026_39": "39. 아래 설명에 해당하는 테스트 기법으로 가장 적합한 것은?\n이 테스트 기법은 프로그램을 실제 입력값으로 실\n행하면서 동시에 기호실행(symbolic execution)을 수\n행하여 프로그램의 조건식을 분석하고 새로운 입력\n값을 자동으로 생성하여 테스트를 실행할 수 있다.\n① Regression Testing\n② Stress Testing\n③ Concolic Testing\n④ Random Testing\n8 -",
  "2026_40": "40. 다음 중 Test-Driven Development(TDD)의 개발\n절차로 가장 적합한 것은?\n① 설계 – 코드 작성 – 테스트 수행\n② 코드 작성 – 테스트 수행 - 리팩토링\n③ 테스트 작성 – 리팩토링 – 코드 작성\n④ 테스트 작성 – 코드 작성 - 리팩토링",
  "2026_41": "41. 다음 Java 코드에 대해, 에러 없이 컴파일되는 것을\n모두 고른 것은?\npublic abstract class AType { }\npublic class BType extends AType { }\npublic class CType extends BType { }\n가. AType a1 = new AType();\n나. BType a2 = new BType();\n다. AType a3 = new BType();\n라. BType a4 = new AType();\n마. BType a5 = new CType();\n바. CType a6 = new BType();\n① 가, 다 ② 나, 다, 마\n③ 다, 라, 마 ④ 라, 마, 바",
  "2026_42": "42. 프로그래머 A는 성적처리 함수를 작성하려고 한다.\n프로그래머 A가 else-if 구조의 printGrade1(int) 함수와\nswitch 구조의 printGrade2(int) 함수로 두 가지 버전의\n코드를 작성하여 실행해 보았다. 이 두 코드의 수행\n결과값이 달라지는 입력값으로 가장 적합한 것은?\nvoid printGrade1 ( int score) { void printGrade2 ( int score) {\nchar res; char res;\nif ( score >= 90 ) switch ( score/10 ) {\nres = ‘A’ ; case 10: case 9:\nelse if ( score >= 80 ) res = ‘A’; break;\nres = ‘B’ ; case 8:\nelse if ( score >= 60 ) res = ‘B’; break;\nres = ‘D’ ; case 6:\nelse if ( score >= 70 ) res = ‘D’; break;\nres = ‘C’ ; case 7:\nelse res = ‘C’; break;\nres = ‘F’; default:\nres = ‘F’;\nputchar ( res ); }\n} putchar ( res );\n}\n① 95 ② 84\n③ 79 ④ 60\n- 9",
  "2026_43": "43. 소프트웨어 애자일 개발 방법에 대한 다음 설명\n중 적절하지 못한 것을 모두 찾으면?\n가. 고객이 개발팀과 같은 장소에서 함께 개발에\n참여한다.\n나. 고객은 기능 목록의 우선순위를 변경할 수 있다.\n다. 각각의 사용자 스토리는 하나의 기능만을 표\n현하도록 작성한다.\n라. 플래닝 포커는 스프린트 팀원에게 작업을 할\n당하기 위해 사용하는 방법이다.\n마. 스프린트 길이는 팀원의 능력에 따라 다르게\n정의하는 것이 좋다.\n① 가, 라 ② 가, 나, 라\n③ 나, 라 ④ 라, 마",
  "2026_44": "44. 다음 상황에 가장 적합한 아키텍처 스타일은?\n대규모 전자상거래 시스템을 개발하고자 한다. 상\n품 검색, 주문 및 결제, 재고 관리, 배송 추적 기\n능이 서로 독립적으로 배포되고 확장될 수 있어\n야 하며, 특정 기능에 문제가 발생해도 전체 시스\n템이 중단되지 않아야 한다. 또한 각 서비스는 서\n로 다른 기술 스택으로 개발될 수 있다.\n① Microservices Architecture\n② Repository Architecture\n③ Layered Architecture\n④ Monolithic Architecture",

  "2026_48": "48. 다음 중 소프트웨어 개발의 지속적 통합\n(Continuous Integration)에 대한 설명으로 올바르지\n않은 것으로만 묶인 것은?\n가. 지속적 통합은 특정 기능의 개발이 완료되었을\n때 진행한다.\n나. 지속적 통합은 개발자가 저장소에 코드를 커밋\n할 때마다 진행된다.\n다. Git이나 SVN과 같은 버전 관리 도구를 사용\n한다.\n라. 코드를 컴파일하고 통합하는 빌드 과정이 자\n동화 된다.\n마. 개발자는 코드 테스트를 완료한 후, 커밋을\n진행한다.\n① 가, 나 ② 가, 마\n③ 나, 다, 라 ④ 나, 다, 마",
  "2026_49": "49. 마이크로서비스 설계를 위한 다음 그림의 특정 패\n턴을 적용하기 위한 Best Practice로 가장 적절한\n것은?\n① 데이터베이스는 비즈니스 규칙이 아닌 데이터를\n저장하기 위한 용도로만 사용되어야 한다.\n② 데이터를 읽고, 쓰는 책임을 분리하는 CQRS\n코딩 패턴을 적용해야 한다.\n③ 서비스간 통신오류 방지를 위해 연관 ID를 정의\n하여 사용해야 한다.\n④ 비동기 메시지의 구조를 잘 이해하고 정의해야\n한다.\n0 -",

    // ----------------------------------------------------
    // [하이브리드 메모 보존 아키텍처 로직]
    // ----------------------------------------------------
    let isServerConnected = false;
    let serverMemos = {};
    const API_URL = 'http://127.0.0.1:5000/api/se/memos';

    // 1. 메모 로딩 엔트리포인트 (페이지 로드 시 호출)
    async function initMemos() {
        const badge = document.getElementById('storage-badge');
        try {
            // CORS 및 OPTIONS 대응용 사전 검사 겸 GET 호출
            const response = await fetch(API_URL, {
                method: 'GET',
                mode: 'cors'
            });
            if (response.ok) {
                serverMemos = await response.json();
                isServerConnected = true;
                
                // 배지 상태 업데이트: 파일 저장 활성화
                badge.className = 'badge accent';
                badge.style.background = 'rgba(16, 185, 129, 0.12)';
                badge.style.borderColor = 'rgba(16, 185, 129, 0.25)';
                badge.style.color = '#10b981';
                badge.innerHTML = '● 파일 저장 모드 (Active)';
                badge.title = '공부 코멘트가 e:\jolly-carson\data\se_memos.json 파일에 영구 보존됩니다.';
                
                // 로컬스토리지에 있는 데이터가 있으면 마이그레이션 안내
                checkMigration();
            } else {
                throw new Error("API response error");
            }
        } catch (e) {
            isServerConnected = false;
            // 배지 상태 업데이트: 로컬스토리지 백업 모드
            badge.className = 'badge';
            badge.style.background = 'rgba(239, 68, 68, 0.12)';
            badge.style.borderColor = 'rgba(239, 68, 68, 0.25)';
            badge.style.color = '#f87171';
            badge.innerHTML = '● 브라우저 저장 모드 (Offline)';
            badge.title = 'Flask 서버가 꺼진 상태입니다. 복구를 위해 임시로 브라우저 LocalStorage에 저장됩니다.';
        }
        
        // 각 개념별 메모 로드 수행
        topicMapping.forEach((item, idx) => {
            loadMemo(idx, item.concept);
        });
    }

    // 2. 브라우저 임시 저장 데이터를 서버 파일로 동기화할 수 있는지 검사
    function checkMigration() {
        const localKeys = [];
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && key.startsWith('se_memo_')) {
                localKeys.push(key);
            }
        }
        
        if (localKeys.length > 0) {
            const banner = document.getElementById('migration-banner');
            const countEl = document.getElementById('migration-count');
            if (banner && countEl) {
                countEl.textContent = localKeys.length;
                banner.style.display = 'block';
            }
        }
    }

    // 3. 브라우저 임시 데이터를 파일로 마이그레이션 실행
    async function migrateMemos() {
        const localKeys = [];
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && key.startsWith('se_memo_')) {
                localKeys.push(key);
            }
        }
        
        if (localKeys.length === 0) return;
        
        if (!confirm(`브라우저에 임시 저장된 공부 노트 ${localKeys.length}개를 서버 파일로 통합하시겠습니까? (이전 완료 시 브라우저 내의 데이터는 정리됩니다.)`)) {
            return;
        }
        
        let successCount = 0;
        const banner = document.getElementById('migration-banner');
        
        for (const key of localKeys) {
            const conceptName = key.replace('se_memo_', '');
            try {
                const dataStr = localStorage.getItem(key);
                if (dataStr) {
                    const data = JSON.parse(dataStr);
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            concept: conceptName,
                            text: data.text,
                            updatedAt: data.updatedAt,
                            action: 'save'
                        })
                    });
                    
                    if (response.ok) {
                        // 성공적으로 이관 완료 시 로컬스토리지 정리 및 메모 객체 반영
                        localStorage.removeItem(key);
                        serverMemos[conceptName] = {
                            text: data.text,
                            updatedAt: data.updatedAt
                        };
                        successCount++;
                    }
                }
            } catch (err) {
                console.error(`마이그레이션 오류 (${conceptName}):`, err);
            }
        }
        
        alert(`공부 코멘트 ${successCount}개가 성공적으로 서버 파일(se_memos.json)에 병합되었습니다.`);
        banner.style.display = 'none';
        
        // 메모 리스트 다시 로드
        renderTopics();
    }

    // 4. 개별 메모 로더
    function loadMemo(idx, conceptName) {
        const displayEl = document.getElementById(`memo-display-${idx}`);
        const dateEl = document.getElementById(`memo-date-${idx}`);
        const deleteBtn = document.getElementById(`memo-delete-btn-${idx}`);
        const inputEl = document.getElementById(`memo-input-${idx}`);
        
        let memoData = null;
        
        if (isServerConnected) {
            // 서버 모드: 서버에서 로드한 메모 데이터 확인
            if (serverMemos && serverMemos[conceptName]) {
                memoData = serverMemos[conceptName];
            }
        } else {
            // 로컬스토리지 백업 모드
            const key = `se_memo_${conceptName}`;
            const dataStr = localStorage.getItem(key);
            if (dataStr) {
                try {
                    memoData = JSON.parse(dataStr);
                } catch (e) {
                    localStorage.removeItem(key);
                }
            }
        }
        
        if (displayEl && dateEl && deleteBtn && inputEl) {
            if (memoData) {
                displayEl.innerHTML = '';
                displayEl.textContent = memoData.text;
                dateEl.textContent = `최근 수정: ${memoData.updatedAt}`;
                deleteBtn.style.display = 'inline-block';
                inputEl.value = memoData.text;
            } else {
                displayEl.innerHTML = `<span class="memo-placeholder">등록된 공부 메모가 없습니다. 나만의 학습 팁을 적어 수험 공부 효율을 높여보세요!</span>`;
                dateEl.textContent = '최근 수정일시 없음';
                deleteBtn.style.display = 'none';
                inputEl.value = '';
            }
        }
    }

    // 5. 메모 편집 폼 열기
    function enableMemoEdit(idx) {
        document.getElementById(`memo-view-mode-${idx}`).style.display = 'none';
        document.getElementById(`memo-edit-mode-${idx}`).style.display = 'block';
        
        // 아코디언 높이 동적 리사이징
        const content = document.getElementById(`accordion-${idx}`).querySelector('.accordion-content');
        content.style.maxHeight = 'none';
        setTimeout(() => {
            content.style.maxHeight = content.scrollHeight + 'px';
        }, 50);
    }

    // 6. 메모 편집 취소
    function cancelMemoEdit(idx) {
        document.getElementById(`memo-view-mode-${idx}`).style.display = 'block';
        document.getElementById(`memo-edit-mode-${idx}`).style.display = 'none';
        
        // 아코디언 높이 동적 리사이징
        const content = document.getElementById(`accordion-${idx}`).querySelector('.accordion-content');
        content.style.maxHeight = 'none';
        setTimeout(() => {
            content.style.maxHeight = content.scrollHeight + 'px';
        }, 50);
    }

    // 7. 메모 저장 (서버 파일 또는 로컬스토리지)
    async function saveMemo(idx, conceptName) {
        const text = document.getElementById(`memo-input-${idx}`).value.trim();
        if (!text) {
            alert("공부 메모 내용을 입력해주세요.");
            return;
        }
        
        const now = new Date();
        const formattedDate = now.getFullYear() + '-' + 
            String(now.getMonth() + 1).padStart(2, '0') + '-' + 
            String(now.getDate()).padStart(2, '0') + ' ' + 
            String(now.getHours()).padStart(2, '0') + ':' + 
            String(now.getMinutes()).padStart(2, '0') + ':' + 
            String(now.getSeconds()).padStart(2, '0');
            
        if (isServerConnected) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        concept: conceptName,
                        text: text,
                        updatedAt: formattedDate,
                        action: 'save'
                    })
                });
                
                if (response.ok) {
                    serverMemos[conceptName] = {
                        text: text,
                        updatedAt: formattedDate
                    };
                } else {
                    const errData = await response.json();
                    throw new Error(errData.message || "서버 파일 저장에 실패했습니다.");
                }
            } catch (err) {
                alert(`[오류] 서버 파일 저장 실패: ${err.message}. 임시로 브라우저에 저장합니다.`);
                // 폴백 저장
                localStorage.setItem(`se_memo_${conceptName}`, JSON.stringify({ text, updatedAt: formattedDate }));
            }
        } else {
            // 오프라인: 로컬스토리지 저장
            localStorage.setItem(`se_memo_${conceptName}`, JSON.stringify({ text, updatedAt: formattedDate }));
        }
        
        document.getElementById(`memo-view-mode-${idx}`).style.display = 'block';
        document.getElementById(`memo-edit-mode-${idx}`).style.display = 'none';
        loadMemo(idx, conceptName);
        
        // 아코디언 높이 동적 리사이징
        const content = document.getElementById(`accordion-${idx}`).querySelector('.accordion-content');
        content.style.maxHeight = 'none';
        setTimeout(() => {
            const newHeight = content.scrollHeight;
            content.style.maxHeight = newHeight + 'px';
        }, 50);
    }

    // 8. 메모 삭제
    async function deleteMemo(idx, conceptName) {
        if (!confirm("작성하신 공부 노트를 완전히 삭제하시겠습니까?")) {
            return;
        }
        
        if (isServerConnected) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        concept: conceptName,
                        action: 'delete'
                    })
                });
                
                if (response.ok) {
                    if (serverMemos[conceptName]) {
                        delete serverMemos[conceptName];
                    }
                } else {
                    const errData = await response.json();
                    throw new Error(errData.message || "서버 파일 삭제에 실패했습니다.");
                }
            } catch (err) {
                alert(`[오류] 서버 파일 삭제 실패: ${err.message}.`);
                return;
            }
        } else {
            // 오프라인: 로컬스토리지 삭제
            const key = `se_memo_${conceptName}`;
            localStorage.removeItem(key);
        }
        
        loadMemo(idx, conceptName);
        
        // 아코디언 높이 동적 리사이징
        const content = document.getElementById(`accordion-${idx}`).querySelector('.accordion-content');
        content.style.maxHeight = 'none';
        setTimeout(() => {
            const newHeight = content.scrollHeight;
            content.style.maxHeight = newHeight + 'px';
        }, 50);
    }

    // 카테고리 필터 스위칭
    function filterCategory(category) {
        currentCategory = category;
        document.querySelectorAll('.filter-btn').forEach(btn => {
            if (btn.textContent === category) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        renderTopics();
    }

    // 아코디언 열고 닫기
    function toggleAccordion(index) {
        const item = document.getElementById(`accordion-${index}`);
        const content = item.querySelector('.accordion-content');
        const isActive = item.classList.contains('active');

        // 다른 것 전부 닫기
        document.querySelectorAll('.accordion-item').forEach((el, i) => {
            if (i !== index) {
                el.classList.remove('active');
                el.querySelector('.accordion-content').style.maxHeight = '0px';
            }
        });

        if (!isActive) {
            item.classList.add('active');
            
            let filtered = topicMapping;
            if (currentCategory !== '전체') {
                filtered = topicMapping.filter(item => item.category === currentCategory);
            }
            const dataObj = filtered[index];
            
            if (dataObj && dataObj.rep_question) {
                const viewer = document.getElementById(`viewer-${index}`);
                const titleEl = document.getElementById(`viewer-title-${index}`);
                const bodyEl = document.getElementById(`viewer-body-${index}`);
                const imgEl = document.getElementById(`viewer-img-${index}`);
                const imgContainer = document.getElementById(`viewer-img-container-${index}`);
                
                titleEl.textContent = `[대표 문제 예시] ${dataObj.rep_year}년 기출 ${dataObj.rep_num}번`;
                bodyEl.textContent = dataObj.rep_question;
                
                if (imgEl && imgContainer) {
                    imgContainer.style.display = 'block';
                    imgEl.src = `images/${dataObj.rep_year}_${dataObj.rep_num}.png`;
                }
                
                viewer.style.display = 'flex';
                
                // 기존의 active-btn 해제 후 대표문제 버튼 활성화
                item.querySelectorAll('.year-btn').forEach(btn => btn.classList.remove('active-btn'));
                setTimeout(() => {
                    const activeBtn = item.querySelector(`.q-btn-${dataObj.rep_year}-${dataObj.rep_num}`);
                    if (activeBtn) {
                        activeBtn.classList.add('active-btn');
                    }
                }, 50);
            }
            
            setTimeout(() => {
                content.style.maxHeight = content.scrollHeight + 'px';
            }, 150);
        } else {
            item.classList.remove('active');
            content.style.maxHeight = '0px';
        }
    }

    // 인라인 문제 오픈
    function openQuestion(year, num, idx, btnElement) {
        const key = `${year}_${num}`;
        const questionText = examDatabase[key] || "해당 기출문제를 데이터베이스에서 찾을 수 없습니다.";
        
        const item = document.getElementById(`accordion-${idx}`);
        const content = item.querySelector('.accordion-content');
        
        // 형제 버튼들의 active 클래스 해제
        item.querySelectorAll('.year-btn').forEach(btn => btn.classList.remove('active-btn'));
        
        // 현재 클릭한 버튼 활성화
        if (btnElement) {
            btnElement.classList.add('active-btn');
        }
        
        const viewer = document.getElementById(`viewer-${idx}`);
        const titleEl = document.getElementById(`viewer-title-${idx}`);
        const bodyEl = document.getElementById(`viewer-body-${idx}`);
        const imgEl = document.getElementById(`viewer-img-${idx}`);
        const imgContainer = document.getElementById(`viewer-img-container-${idx}`);
        
        titleEl.textContent = `${year}년도 감리사 기출 ${num}번`;
        bodyEl.textContent = questionText;
        
        if (imgEl && imgContainer) {
            imgContainer.style.display = 'block';
            imgEl.src = `images/${year}_${num}.png`;
        }
        
        viewer.style.display = 'flex';
        
        // 높이 재조정
        content.style.maxHeight = 'none';
        setTimeout(() => {
            const newHeight = content.scrollHeight;
            content.style.maxHeight = newHeight + 'px';
        }, 50);
    }

    // 인라인 문제 닫기
    function closeInlineViewer(idx, event) {
        if (event) event.stopPropagation();
        
        const item = document.getElementById(`accordion-${idx}`);
        const content = item.querySelector('.accordion-content');
        
        // 버튼 active 클래스 모두 해제
        item.querySelectorAll('.year-btn').forEach(btn => btn.classList.remove('active-btn'));
        
        const viewer = document.getElementById(`viewer-${idx}`);
        viewer.style.display = 'none';
        
        // 높이 재조정
        content.style.maxHeight = 'none';
        setTimeout(() => {
            const newHeight = content.scrollHeight;
            content.style.maxHeight = newHeight + 'px';
        }, 50);
    }

    // [세부 토픽 목록 모달 열기]
    window.openTopicListModal = function() {
        const modal = document.getElementById('topic-modal');
        const listEl = document.getElementById('modal-topic-list');
        listEl.innerHTML = '';
        
        let filtered = topicMapping;
        if (currentCategory !== '전체') {
            filtered = topicMapping.filter(item => item.category === currentCategory);
        }
        
        filtered.forEach((item, idx) => {
            const li = document.createElement('li');
            li.className = 'modal-topic-item';
            li.style.cursor = 'pointer';
            li.onclick = () => {
                closeTopicModal();
                setTimeout(() => {
                    const itemEl = document.getElementById(`accordion-${idx}`);
                    if (itemEl && !itemEl.classList.contains('active')) {
                        toggleAccordion(idx);
                    }
                    if (itemEl) {
                        itemEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 200);
            };
            
            li.innerHTML = `
                <span class="modal-topic-name">${idx + 1}. ${item.concept}</span>
                <span class="modal-topic-count">${item.count}회 출제</span>
            `;
            listEl.appendChild(li);
        });
        
        modal.style.display = 'flex';
        setTimeout(() => {
            modal.classList.add('show');
        }, 10);
    };

    // [세부 토픽 목록 모달 닫기]
    window.closeTopicModal = function(event) {
        const modal = document.getElementById('topic-modal');
        modal.classList.remove('show');
        setTimeout(() => {
            modal.style.display = 'none';
        }, 250);
    };

    // 초기화
    renderTopics();
    initMemos();
</script>

<!-- 세부 토픽 목록 팝업 모달 -->
<div id="topic-modal" class="modal-overlay" onclick="closeTopicModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-card-header">
            <h2 class="modal-card-title">🔍 검출된 빈출 세부 토픽 목록</h2>
            <button class="modal-close-x" onclick="closeTopicModal()">✕</button>
        </div>
        <div class="modal-card-body">
            <ul id="modal-topic-list" class="modal-topic-list">
                <!-- 자바스크립트로 동적 로딩 -->
            </ul>
        </div>
    </div>
</div>
</body>
</html>
