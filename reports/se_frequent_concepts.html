<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소프트웨어공학 12개년 빈출 개념 정밀 뷰어</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080b13;
            --card-bg: rgba(17, 24, 39, 0.75);
            --border-color: rgba(255, 255, 255, 0.06);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent-violet: #8b5cf6;
            --accent-blue: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%);
            --accent-glow: rgba(139, 92, 246, 0.12);
            --success: #10b981;
            --card-hover-border: rgba(139, 92, 246, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 2.5rem 1.5rem;
            min-height: 100vh;
            background-image: 
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.06) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.06) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.6rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.6rem;
            letter-spacing: -0.03em;
        }

        header p.subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
        }

        .meta-badges {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .badge {
            background: var(--border-color);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 0.35rem 0.9rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 500;
            backdrop-filter: blur(8px);
        }

        .badge.accent {
            background: rgba(139, 92, 246, 0.12);
            border-color: rgba(139, 92, 246, 0.25);
            color: #c084fc;
        }

        /* Category Filter Badges */
        .filter-section {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.45rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .filter-btn:hover, .filter-btn.active {
            border-color: var(--accent-violet);
            color: #ffffff;
            background: rgba(139, 92, 246, 0.08);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* Main Accordion List */
        .accordion-list {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-bottom: 4rem;
        }

        .accordion-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .accordion-item:hover {
            border-color: var(--card-hover-border);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .accordion-trigger {
            width: 100%;
            background: none;
            border: none;
            color: inherit;
            padding: 1.6rem 1.8rem;
            text-align: left;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        /* Card Layout 내부 요소 */
        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .card-title-group {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .rank-badge {
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .concept-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        .category-tag {
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            padding: 0.15rem 0.45rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .freq-count-badge {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.15);
            color: var(--success);
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .card-meta-grid {
            display: grid;
            grid-template-columns: 90px 1fr;
            row-gap: 0.5rem;
            column-gap: 0.8rem;
            width: 100%;
            font-size: 0.88rem;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 0.8rem;
            margin-top: 0.2rem;
        }

        .meta-label {
            color: var(--text-muted);
            font-weight: 600;
        }

        .meta-value {
            color: var(--text-secondary);
            word-break: keep-all;
        }

        .meta-value.accent {
            color: #c8a2c8;
        }

        .accordion-trigger .arrow {
            transition: transform 0.3s ease;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .accordion-item.active .accordion-trigger .arrow {
            transform: rotate(180deg);
            color: var(--accent-violet);
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            background: rgba(0, 0, 0, 0.18);
        }

        .accordion-inner {
            padding: 1.6rem 1.8rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .section-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 0.3rem;
            margin-top: 0.2rem;
        }

        /* Year Badges Grid */
        .year-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .year-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.35rem 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .year-btn:hover {
            background: var(--accent-gradient);
            border-color: transparent;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.25);
            transform: translateY(-1px);
        }

        .year-btn.active-btn {
            background: var(--accent-gradient);
            border-color: transparent;
            box-shadow: 0 4px 10px rgba(139, 92, 246, 0.3);
            color: #ffffff;
        }

        .year-btn .num-label {
            opacity: 0.7;
            font-size: 0.7rem;
        }

        /* Inline Question Viewer */
        .inline-question-viewer {
            background: #090d16;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            transition: all 0.3s ease;
        }

        .viewer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 0.5rem;
        }

        .viewer-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #60a5fa;
            font-family: 'Outfit', sans-serif;
        }

        .viewer-close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: color 0.2s;
        }

        .viewer-close-btn:hover {
            color: #ef4444;
        }

        .viewer-body {
            font-size: 0.92rem;
            line-height: 1.7;
            color: #d1d5db;
            white-space: pre-wrap;
            overflow-y: auto;
            max-height: 400px;
            padding-right: 0.5rem;
        }

        /* 스크롤바 디자인 */
        .viewer-body::-webkit-scrollbar {
            width: 6px;
        }
        .viewer-body::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.01);
        }
        .viewer-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
        .viewer-body::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        /* Memo Section Styles */
        .memo-section {
            background: rgba(139, 92, 246, 0.02);
            border: 1px dashed rgba(139, 92, 246, 0.15);
            border-radius: 8px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-bottom: 0.5rem;
        }

        .memo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.04);
            padding-bottom: 0.4rem;
        }

        .memo-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #c084fc;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .memo-date {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .memo-content-box {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #d1d5db;
            white-space: pre-wrap;
            min-height: 24px;
        }

        .memo-placeholder {
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.85rem;
        }

        .memo-textarea {
            width: 100%;
            min-height: 150px;
            background: #090d16;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: var(--text-primary);
            padding: 0.8rem 1rem;
            font-family: inherit;
            font-size: 0.92rem;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .memo-textarea:focus {
            border-color: var(--accent-violet);
            box-shadow: 0 0 8px rgba(139, 92, 246, 0.2);
        }

        .memo-btn-group {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
        }

        .memo-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.3rem 0.7rem;
            border-radius: 4px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .memo-btn:hover {
            color: #ffffff;
            border-color: var(--text-muted);
        }

        .memo-btn.save {
            background: var(--accent-gradient);
            border: none;
            color: #ffffff;
        }

        .memo-btn.save:hover {
            box-shadow: 0 2px 8px rgba(139, 92, 246, 0.3);
        }

        .memo-btn.delete {
            color: #f87171;
            border-color: rgba(248, 113, 113, 0.2);
        }

        .memo-btn.delete:hover {
            background: rgba(248, 113, 113, 0.05);
            border-color: #f87171;
        }

        /* 뱃지 호버 효과 */
        a.badge {
            transition: all 0.2s ease;
        }
        a.badge:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            color: var(--text-primary) !important;
        }

        /* [검출 토픽 팝업 모달 스타일] */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 11, 19, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-card {
            background: rgba(17, 24, 39, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            max-height: 80%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(139, 92, 246, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform: scale(0.9);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-overlay.show .modal-card {
            transform: scale(1);
        }
        .modal-card-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-card-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
        }
        .modal-close-x {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.4rem;
            cursor: pointer;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close-x:hover {
            color: #ffffff;
        }
        .modal-card-body {
            padding: 1rem 1.5rem 1.5rem 1.5rem;
            overflow-y: auto;
        }
        .modal-topic-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .modal-topic-item {
            padding: 0.8rem 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            transition: all 0.2s ease;
            border-radius: 8px;
        }
        .modal-topic-item:hover {
            background: rgba(139, 92, 246, 0.08);
            transform: translateX(4px);
        }
        .modal-topic-name {
            font-size: 0.92rem;
            font-weight: 500;
            color: var(--text-primary);
        }
        .modal-topic-count {
            background: rgba(139, 92, 246, 0.15);
            color: #c084fc;
            border: 1px solid rgba(139, 92, 246, 0.2);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 50px;
            white-space: nowrap;
        }
        span.badge[onclick]:hover {
            background: rgba(255, 255, 255, 0.08) !important;
            border-color: rgba(255, 255, 255, 0.15) !important;
            color: var(--text-primary) !important;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>소프트웨어공학 기출 정밀 분석 대시보드</h1>
        <p class="subtitle">12개년 기출 전수 조사 기반 3회 이상 빈출 세부 토픽 분석 엔진</p>
        
        <div class="meta-badges" style="margin-bottom: 1.5rem;">
            <a href="se_frequent_concepts.html" class="badge accent" style="text-decoration: none;">소프트웨어공학</a>
            <a href="sa_frequent_concepts.html" class="badge" style="text-decoration: none; color: var(--text-secondary);">시스템 아키텍처</a>
            <a href="db_frequent_concepts.html" class="badge" style="text-decoration: none; color: var(--text-secondary);">데이터베이스</a>
            <a href="pm_frequent_concepts.html" class="badge" style="text-decoration: none; color: var(--text-secondary);">프로젝트 관리</a>
            <a href="sc_frequent_concepts.html" class="badge" style="text-decoration: none; color: var(--text-secondary);">보안</a>
        </div>
        
        <div class="meta-badges">
            <span class="badge">기출 범위: 2015년 ~ 2026년</span>
            <span class="badge accent">총 분석 데이터: 300 문항</span>
            <span class="badge" onclick="openTopicListModal()" style="cursor: pointer; transition: all 0.2s;" title="클릭 시 검출된 세부 토픽 목록 팝업 열기">
                검출된 빈출 세부 토픽: <span id="topic-count-badge">0</span>개
            </span>
            <span id="storage-badge" class="badge" style="cursor: help;">저장소 로딩 중...</span>
        </div>
    </header>

    <!-- 로컬 데이터 마이그레이션 배너 -->
    <div id="migration-banner" style="display: none; background: rgba(139, 92, 246, 0.12); border: 1px solid rgba(139, 92, 246, 0.3); padding: 1.2rem; border-radius: 10px; margin-bottom: 2rem; text-align: center; backdrop-filter: blur(10px); box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
        <div style="font-size: 0.95rem; font-weight: 600; color: #ffffff; margin-bottom: 0.5rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
            <span>💡 이전 브라우저(LocalStorage)에 작성된 공부 코멘트 <span id="migration-count" style="color: #c084fc; font-weight: 700;">0</span>개가 발견되었습니다.</span>
        </div>
        <div style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.8rem;">
            이 코멘트들을 서버 파일 저장소(`data/se_memos.json`)로 안전하게 가져와서 영구 보존할 수 있습니다.
        </div>
        <button onclick="migrateMemos()" style="background: var(--accent-gradient); border: none; color: #ffffff; padding: 0.4rem 1.2rem; border-radius: 6px; font-size: 0.82rem; font-weight: 700; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 8px rgba(139, 92, 246, 0.3);">
            파일 서버로 코멘트 동기화하기
        </button>
    </div>

    <!-- Category Filtering badges -->
    <div class="filter-section">
        <button class="filter-btn active" onclick="filterCategory('전체')">전체</button>
        <button class="filter-btn" onclick="filterCategory('요구분석/설계')">요구분석/설계</button>
        <button class="filter-btn" onclick="filterCategory('품질/비용산정')">품질/비용산정</button>
        <button class="filter-btn" onclick="filterCategory('구현/테스트')">구현/테스트</button>
        <button class="filter-btn" onclick="filterCategory('유지관리/운영')">유지관리/운영</button>
        <button class="filter-btn" onclick="filterCategory('방법론/플랫폼')">방법론/플랫폼</button>
    </div>

    <!-- Accordion List -->
    <div class="accordion-list" id="accordion-container">
        <!-- Javascript will inject accordion elements here -->
    </div>
</div>

<script>
    // 파이썬 빌더에서 동적으로 인젝션하는 기출문제 데이터베이스
    const examDatabase = {
  "2015_26": "26. 다음 설명은 개발방법론 중에서 나선형 모델\n(spiral model)을 나타내고 있다. 다음 중 나선형\n모델의 각 단계별 작업내용을 순서대로 나열한\n것으로 가장 적절한 것은?\n나선형 모델은 비선형적이며 반복적으로 개발이\n진행되므로 소프트웨어 품질 중 강인성을 높일\n수 있는 방법이다. 특히 이 방법은 개발자나\n사용자가 각 확장 단계에서 발생될 위험에 대한\n이해와 대책이 가능하다. 따라서 프로젝트가\n실패할 위험을 사전에 최소화할 수 있다.\n① 계획수립 – 위험분석 – 개발 - 평가\n② 위험분석 – 계획수립 – 개발 - 평가\n③ 계획수립 – 개발 – 위험분석 - 평가\n④ 계획수립 – 위험분석 – 평가 - 개발",
  "2015_27": "27. 다음의 클래스 다이어그램은 Java 언어에서\nInvoice 클래스와 Employee 클래스가 Payable\n인터페이스를 상속받는 것을 나타내고 있다.\nJava 인터페이스에 대한 설명으로 가장 적절하지\n않은 것은?\n① Java 인터페이스는 구현 부분이 없는 추상 메소\n드로 구성되어 있다.\n② 인터페이스를 상속받는 일반 클래스는 인터페이\n스의 추상 메소드를 재정의해야 한다.\n③ Java 언어에서 인터페이스는 다중 상속을 허용\n하지 않고 단일 상속만 가능하다.\n④ Java 인터페이스에는 메소드가 없고 비어있는\n태깅(tagging) 인터페이스가 존재한다.\n- 6",
  "2015_28": "28. JUnit 4.0으로 자바 프로그램을 단위 시험하기\n위해 테스트 케이스를 다음과 같이 작성하였을 때,\n테스트 케이스 메소드들의 수행순서로 가장\n적절한 것은?\npublic class SimpleTest {\n@Before\npublic void setUp() { }\n@After\npublic void tearDown() { }\n@Test\npublic void test1() { }\n@Test\npublic void test2() { }\n}\n① setUp() --> tearDown() --> test1() -->\ntest2()\n② setUp() --> test1() --> test2() -->\ntearDown()\n③ setUp() --> test1() --> tearDown() -->\nsetUp() --> test2() --> tearDown()\n④ tearDown() --> test1() --> setUp() -->\ntest2() --> tearDown()",
  "2015_29": "29. 다음은 Spring 3.0의 주요 기술에 대해 설명하고\n있다. 다음 중 설명에 가장 적합한 것은?\n이 기술은 어떤 클래스가 자신의 임무를\n수행하기 위해 필요한 값이나 사용할 다른\n클래스와의 관계를 외부에서 설정하는 것\n으로서 Spring에서는 인스턴스 설정이나\n사용은 스프링 설정파일인 beans.xml\n파일에 기술한다.\n① 의존성 주입(dependency injection)\n② WSDL(Web Service Description Language)\n③ 관점지향 프로그래밍(aspect-oriented programming)\n④ UDDI(Universal Description Discovery and Integration)\n6 -",
  "2015_30": "30. 다음 클래스 다이어그램은 GOF(Gang of Four)의\n행위 디자인 패턴 중 하나를 나타낸다. 다음\n클래스 다이어그램에 부합하는 디자인 패턴으로\n가장 적절한 것은?\n① Decorator 패턴 ② Composite 패턴\n③ Prototype 패턴 ④ State 패턴",
  "2015_31": "31. 다음은 소프트웨어 개발 시 요구사항 명세서에\n대한 설명이다. 요구사항 명세서에 대한 설명으로\n가장 부적절한 것은?\n① 요구사항 명세서는 그것을 사용하는 사람과\n만드는 사람 양쪽 모두에게 명백해야 한다.\n② 요구사항 명세서는 완전하여야 한다. 따라서\n기능성, 성능, 제약사항과 같이 모든 중요한\n것은 문서화되어야 한다.\n③ 요구사항 명세서는 명세의 다른 부분들이 서로\n충돌되어서는 안 되며, 일관되어야 한다.\n④ 요구사항 명세서는 요구사항이 충돌하는지 아닌\n지를 결정하기 위한 제한된 프로세스가 반드시\n있어야 하지만 그것을 증명할 필요는 없다.\n- 7",
  "2015_32": "32. 모듈 사이의 결합은 강한 정도(가장 바람직하지\n못한 경우)에서부터 약한 정도(가장 바람직한\n경우)에 이르기까지 나열할 수 있다. 다음 보기 중\n강한 정도에서 약한 정도 순으로 가장 적절하게\n나열된 것은?\n① 내용결합도 - 공통결합도 - 제어결합도 - 스템프\n결합도 - 자료결합도\n② 내용결합도 - 제어결합도 - 공통결합도 - 스템프\n결합도 - 자료결합도\n③ 내용결합도 - 공통결합도 - 스템프결합도 - 제어\n결합도 - 자료결합도\n④ 내용결합도 - 제어결합도 - 스템프결합도 - 공통\n결합도 - 자료결합도",
  "2015_33": "33. 다음은 특정 형상 관리 활동에 대한 설명이다.\n설명에 대한 활동으로 가장 적절한 것은?\n⦁ 형상 항목에 대한 변경이 정확하게 이루어\n졌는지를 평가한다.\n⦁ 형상 항목에 대한 기능 및 성능 요구사항이\n만족되었음을 확인한다.\n⦁ 다른 형상 항목들과 일관성 있게 변경이\n이루어졌는지 확인한다.\n⦁ 소프트웨어 이해도가 높은 감리사에 의해\n수행된다.\n① 형상 통제\n② 형상 감사\n③ 형상 항목 식별\n④ 형상 상태 기록 및 보고\n7 -",
  "2015_34": "34. 개발 예정인 소프트웨어의 소스코드 라인 수는\n500,000 SLOC(Source Line of Code)로 추정되었다.\n이 소프트웨어를 다음 표의 조건에서 8명의\n개발자가 개발하려 할 때, 소프트웨어 개발이\n완료되기까지 최소 몇 개월이 소요될 것으로\n추정되는가?\n개발 언어 C++\nC++언어 라인수/FP 50 SLOC/FP\n개발자 1인당 월평균 생산성 50 FP/month\n① 18개월\n② 20개월\n③ 23개월\n④ 25개월",
  "2015_35": "35. 다음은 유지보수 단계에서 진행되는 유지보수\n활동의 분포에 대한 일반적인 통계 그래프이다.\n(가) 영역에서 수행하는 작업에 해당하는 것은?\n① 운영 중인 소프트웨어에서 발견된 기능 오류를 수정\n② 비디오 대여 관리 시스템에 장르별 대여 통계\n기능 추가\n③ 아키텍처 문서와 소스 코드 간의 일치하지 않는\n내용을 수정\n④ MS-Windows 환경에서 개발된 소프트웨어를\nLinux 환경으로 이식\n- 8",
  "2015_36": "36. 어느 회사의 업무 시스템의 아키텍처가 다음\n그림과 같은 형태로 구성되어 있다. 여기서 EIS\nTier의 영역에 위치할 수 없는 컴포넌트(또는\n서브시스템)는 무엇인가?\n① DBMS\n② session bean\n③ legacy system\n④ CRM (Customer Relationship Management)",
  "2015_37": "37. 어떤 시스템은 다음과 같은 구성과 동작 방식으로\n운영된다. 이 시스템을 통해 만족할 수 있는 품질\n속성(quality attribute)은 무엇인가?\n시스템은 사용자에게 서비스를 제공하기 위해\n동일한 기능을 수행하는 컴포넌트 A와 B, 이\n외에 여러 컴포넌트로 구성된다. 컴포넌트 A가\n동작 중에 실패가 발생하여 대기 중이던\n컴포넌트 B가 A를 대신하여 계속 서비스를\n제공한다.\n① 가용성 (availability)\n② 상호운용성 (interoperability)\n③ 성능 (performance)\n④ 적응성 (adaptability)\n8 -",
  "2015_38": "38. 다음과 같은 Java 코드를 클래스 다이어그램으로\n표현하고자 한다. 생성된 클래스 다이어그램에\n표현되는 객체 사이의 관계와 가장 거리가 먼 것은?\npublic TempServiceImpl extends TempService {\nprivate TempDao tempDao;\npublic void addTemp(Temp tmp) {\ntempDao.add(tmp);\n}\n}\n① 연관 (association) 관계\n② 의존 (dependency) 관계\n③ 집합 (composition) 관계\n④ 상속 (inheritance) 관계",
  "2015_39": "39. UML 유스케이스 다이어그램은 시스템의 기능을\n액터와 유스케이스로 표현한다. 다음은 도서관의\n도서 등록, 도서 대출 그리고 도서 반납 기능을\n중심으로 작성된 유스케이스 다이어그램을 보여\n준다. 유스케이스 다이어그램이 표현하고자 하는\n내용 측면이 아니라 표기법 측면에서 올바르게\n표현된 부분은?\n① 사서와 사용자 간의 관계\n② 도서등록과 도서검색 간의 관계\n③ 도서대출과 도서반납 간의 관계\n④ 도서반납과 연체료부과 간의 관계\n- 9",
  "2015_40": "40. 다음의 상단 코드는 하단의 코드로 리팩토링하는\n것이 권장된다. 상단의 코드를 응집도와 결합도\n측면에서 올바르게 설명한 것은?\nvoid setValue(String name, int value)\n{\nif ( name.equals(“height”) ) {\n_height = value ;\n}\nif ( name.equals(“width”) ) {\n_width = value ;\n}\n}\nvoid setHeight(int arg) {\n_height = arg ;\n}\nvoid setWidth(int arg) {\n_width = arg ;\n}\n① 응집도: 기능적 응집도, 결합도: 데이터 결합도\n② 응집도: 논리적 응집도, 결합도: 데이터 결합도\n③ 응집도: 논리적 응집도, 결합도: 제어 결합도\n④ 응집도: 기능적 응집도, 결합도: 제어 결합도",
  "2015_41": "41. 다음의 요구사항을 바탕으로 가장 거리가 먼 테스트는?\nA 사는 효율적인 프로젝트 관리를 위한\n프로젝트 관리 시스템을 개발하고자 한다.\n프로젝트 관리 시스템은 클라이언트/서버\n구조로서 다양한 기술(웹, 모바일)과\n다양한 장치(PC, 안드로이드폰, 아이폰,\n다양한 태블릿 기종)를 지원해야 한다.\n시스템은 동시에 100 명 이상의 사용자가\n접속하여도 원활한 동작을 제공해야 한다.\n신규 시스템이므로 사용법에 대한 온라인\n도움말이 제공되어야 한다.\n① 성능 테스트 (performance test)\n② 호환성 테스트 (compatability test)\n③ 사용성 테스트 (usability test)\n④ 가용성 테스트 (availability test)\n9 -",
  "2015_42": "42. CMMI에서 프로젝트 관리는 여러 개의 프로세스\n영역(process areas)으로 구성된다. 각 프로세스\n영역의 성숙도 레벨(level)을 올바르게 정의하고\n있는 것은?\n① 프로젝트 계획: 레벨 2, 위험 관리: 레벨 2\n② 프로젝트 모니터링 및 통제: 레벨 2, 공급자\n(supplier) 계약(agreement) 관리: 레벨 3\n③ 통합(integrated) 프로젝트 관리: 레벨 3, 정량적\n(quantitative) 프로젝트 관리: 레벨 4\n④ 정량적 프로젝트 관리: 레벨 5, 위험 관리: 레벨 2",
  "2015_43": "43. 모듈의 결합도를 정량적으로 측정할 수 있는 척\n도로서 팬 출력(fan out)은 자신이 호출하는\n모듈의 수가 된다. 팬 출력의 값이 크면, 즉\n자신이 호출하는 모듈의 수가 너무 크면 이들에\n대한 제어 로직이 복잡해질 수가 있으므로 적절한\n팬 출력이 유지될 수 있도록 설계하는 것이 바람직\n하다. 다음의 디자인 패턴 중에서 이러한 설계\n원리와 가장 관련이 높은 것은?\n① 커맨드(command) 패턴\n② 템플릿 메소드(template method) 패턴\n③ 어댑터(adapter) 패턴\n④ 퍼사드(facade) 패턴",
  "2015_44": "44. 다음은 UML 시퀀스 다이어그램을 보여 준다. 이\n시퀀스 다이어그램과 가장 일치하는 클래스 다이어\n그램은?\n:C1 :C2\nf1()\nf2()\n- 10\nC1 C2\n①\n+ f1() :void + f2() :void\nC1 C2\n②\n+ f2() :void + f1() :void\nC1 C2\n③\n+ f1() :void + f2() :void\nC1 C2\n④\n+ f2() :void + f1() :void",
  "2015_45": "45. 데이터 흐름도(DFD)의 실시간 확장 모델은\n제어를 처리하는 제어 명세서의 구체적인\n활동을 기술하는데 용이하다. 제어 명세서를\n기술하는 기법에 대한 설명으로 가장 적절하지\n않은 것은?\n① 프로세스 활성표(process activation table)는\nDFD에 나타난 프로세스를 활성화 또는 비활성화\n시키기 위해 어떠한 입력 제어흐름 값이 주\n어져야 하는지를 테이블 형태로 표시한다.\n② 결정표(decision table)는 입력 제어 조건들의\n순서가 반드시 고려되어야 하는 조합 논리를\n나타내는데 적합하며, 출력 값을 갖기 위해\n요구되는 입력 값을 테이블 형태로 나타낸다.\n③ 상태 변화도(state transition diagram)는\n시스템의 상태와 상태를 변하게 하는 사건\n들을 묘사하고, 사건에 의해 나타나는 동작\n등 시스템의 행위를 표현한다.\n④ 상태 사건표(state event matrix)는 상태\n변화도에 표현되어 있는 정보를 테이블\n형태로 표현한 것이며, 열(column)은 사건\n들을 표시하고 행(row)은 상태를 나타낸다.\n0 -",
  "2015_46": "46. 10만 라인에 해당하는 인터넷 쇼핑몰 개발\n프로젝트(A), 새로운 언어의 컴파일러 개발\n프로젝트(B), 미사일 유도시스템 개발 프로젝트(C),",
  "2015_47": "47. 다음 그림은 MVC(Model-View-Controller) 아키\n텍처 스타일을 나타낸 것이며, 세 가지 요소가\n별도의 컴포넌트 또는 스레드로 구성된다. (A),\n(B), (C)에 해당되는 요소를 바르게 나열한 것은?\n① 모델 – 제어 - 뷰\n② 뷰 – 모델 - 제어\n③ 뷰 – 제어 - 모델\n④ 모델 – 뷰 - 제어\n- 11",
  "2015_48": "48. 소프트웨어 아키텍처를 설계할 때 따라야 할\n프로세스를 가장 적절하게 나열한 것은?\n가. 서브시스템 사이의 인터페이스를 정의\n하고 서브시스템 사이의 상호작용을\n위한 동작을 작성한다.\n나. 전체 시스템에 대한 설계 목표를 파악\n하고 결정한다. 즉, 전체 시스템의\n목표를 요구에서 발견하고 추출한다.\n다. 설계 목표와 시스템의 타입을 고려하여\n아키텍처 스타일을 선택한다.\n라. 설계한 아키텍처가 요구, 설계 목표,\n설계 원리를 만족시켰는지를 검토한다.\n마. 적용할 수 있는 아키텍처 스타일이\n있다면 이를 적용하여 시스템의 표준\n아키텍처를 설계하고, 없다면 맞춤형\n아키텍처를 설계한다.\n① 가 → 나 → 다 → 라 → 마\n② 나 → 다 → 마 → 가 → 라\n③ 나 → 다 → 가 → 라 → 마\n④ 가 → 나 → 마 → 다 → 라",
  "2015_49": "49. 객체지향 소프트웨어의 품질 메트릭 중 다음의\nChidamber와 Kemerer의 메트릭에 대한 설명 중\n가장 옳은 것은?\n가. WMC(Weighted Method per Class)가 클수록\n테스트 경로가 많아져 유지보수가 어렵다.\n나. DIT(Depth of Inheritance Tree)가 클수록\n클래스의 동작에 대한 예측이 용이하다.\n다. NOC(Number of Children)가 클수록 변경의\n영향을 많이 받는다.\n라. CBO(Coupling Between Object Classes)가\n클수록 모듈화가 잘 된 것이다.\n마. RFC(Response for a Class)가 클수록 테스트\n하고 디버깅하기가 어렵다.\n① 가, 나, 다\n② 나, 라, 마\n③ 가, 다, 마\n④ 다, 라, 마\n1 -",
  "2015_50": "50. 소프트웨어 아키텍처 스타일과 응용분야가 가장\n적절하지 않게 연결된 것은?\n① 클라이언트/서버 아키텍처 - 웹 기반의 수강\n신청 시스템\n② N-tier 아키텍처 - 운영체제\n③ 계층형 아키텍처 – 마이크로웨이브 오븐 제어\n소프트웨어\n④ MVC 아키텍처 – 모바일 애플리케이션\n- 12\n“편집의도에 따라 비워둔 페이지임”\n2 -",
  "2016_26": "26. 다음 중 소프트웨어 요구 명세서(software requi-\nrements specification)에 포함되어야 할 항목으로\n가장 적절한 것은?\n가. 사용자 인터페이스 나. 시스템 구조\n다. 성능 요구 라. 알고리즘\n마. 인수 조건 바. 자원에 대한 제약 조건\n① 가, 나, 다, 바 ② 나, 다, 라, 마\n③ 나, 라, 마, 바 ④ 가, 다, 마, 바",
  "2016_27": "27. 다음 그림은 클래스 다이어그램과 시퀀스 다이어\n그램에 바탕을 둔 설계의 일부이다. 본 설계가\n위반한 설계 원칙으로 가장 적절한 것은?\n① SRP(Single Responsibility Principle)\n② LSP(Liskov Substitution Principle)\n③ ISP(Interface Segregation Principle)\n④ DRY(Don't Repeat Yourself)\n- 6",
  "2016_28": "28. 기계어에서 어셈블리 언어로, 어셈블리 언어에서\n고급 언어로 표현하는 과정에서 적용된 추상화\n방법으로 가장 적절한 것은?\n기계어 표현 어셈블리 언어 표현 고급 언어 표현\n00100101 LOAD A, X\n10000110 ADD A, Y Z = X + Y\n01000111 STORE Z, A\n① 프로시저 추상화(procedure abstraction)\n② 데이터 추상화(data abstraction)\n③ 제어 추상화(control abstraction)\n④ 기능 추상화(function abstraction)",
  "2016_29": "29. 다음은 아키텍처 설계과정에서 결함허용(fault\ntolerance)을 높이기 위해 취할 수 있는 방법\n중 하나에 대한 설명이다. 다음 설명으로 가장\n적절한 것은?\n- 그룹에서 활성화 요소가 입력을 처리하도록 구\n성된 형상\n- 중복 요소를 위해 주기적으로 상태 업데이트\n- 활성화 요소와 중복 요소 간에 상태 일치를 위해\n체크 포인트 메커니즘 사용\n① active redundancy(hot spare)\n② passive redundancy(warm spare)\n③ spare(cold spare)\n④ condition monitoring",
  "2016_30": "30. 다음은 UML 모델링을 위해 사용되는 특정 다이어\n그램의 활용에 대한 설명이다. 해당 다이어그램\n으로 가장 적절한 것은?\n- 유스케이스에서 흐름을 모델링하기 위해 사용된다.\n- 객체의 연산에 대한 플로우차트로 활용될 수 있다.\n- 비즈니스 프로세스나 작업 흐름을 모델링할 수 있다.\n① 시퀀스 다이어그램(sequence diagram)\n② 액티비티 다이어그램(activity diagram)\n③ 상태 다이어그램(state diagram)\n④ 협력 다이어그램(collaboration diagram)\n6 -",
  "2016_31": "31. 다음 코드를 수행할 때, 수행 결과로 가장\n적절한 것은?\nclass Temp {\nprivate static Temp t;\nprivate int m = 0;\npublic Temp() { }\npublic static Temp getTemp() {\nif (t == null) t = new Temp();\nreturn t;\n}\npublic int add(int i) {\nm += i;\nreturn m;\n}\n}\npublic class TempTest {\npublic static void main(String[] args) {\nTemp obj1 = new Temp();\nTemp obj2 = new Temp();\nSystem.out.print(obj1.add(5) + “ ”);\nSystem.out.print(obj2.add(5) + “ ”);\nTemp obj3 = Temp.getTemp();\nTemp obj4 = Temp.getTemp();\nSystem.out.print(obj3.add(5) + “ ”);\nSystem.out.println(obj4.add(5));\n}\n}\n① 5 5 5 5\n② 5 5 5 10\n③ 5 5 10 15\n④ 5 10 15 20",
  "2016_32": "32. 어느 소프트웨어는 평균적으로 에러(error)가 2\n일에 1개씩 발생한다고 한다. 이 소프트웨어가\n3일 동안 에러(error) 없이 가동될 신뢰성은\n얼마인가?\n① 0.5 ② 0.125 ③ 0.675 ④ 0.25\n- 7",
  "2016_33": "33. 다음 코드를 수행할 때, 수행 결과로 가장 적절한\n것은?\nclass Parent {\npublic Parent(){\nSystem.out.println(\"Parent default\");\n}\npublic Parent(int i){\nthis(\"hello\");\nSystem.out.println(\"int constructor \" +\ni);\n}\npublic Parent(char c){\nthis();\nSystem.out.println(\"char constructor \" +\nc);\n}\npublic Parent(String s){\nthis('A');\nSystem.out.println(\"String constructor \"\n+ s);\n}\n}\nclass Child extends Parent{\npublic Child() {\nsuper(10);\nSystem.out.println(\"Child default\");\n}\npublic Child(int i) {\nSystem.out.println(\"int constructor\");\n}\n}\npublic class Exam {\npublic static void main(String[] args) {\nChild c1 = new Child();\nSystem.out.println(\"-----\");\nChild c2 = new Child(10);\n}\n}\n① Parent default\nchar constructor A\nString constructor hello\nint constructor 10\nChild default\n-----\nParent default\nint constructor\n7 -",
  "2016_34": "34. 코딩 규칙 MISRA-C:2004에 제시된 규칙들이\n참조하는 관련 표준으로 가장 거리가 먼 것은?\n① ISO/IEC 9899 Programming languages - C\n② ISO/IEC 9126 Software Engineering – Product\nQuality\n③ ISO/IEC 10646 Information technology — Unive-\nrsal Multiple-Octet Coded Character Set\n④ ANSI/IEEE 754 IEEE Standard for Binary Float-\ning-Point Arithmetic",
  "2016_35": "35. 다음은 Excel 프로그램에서 셀의 글꼴을 설정하는\n대화상자를 보여준다. 테스터에게 소스 코드가\n제공되지 않는다고 가정할 때 이 대화 상자를 테스트\n하기 위해서 적용되는 테스트 방법으로 가장\n거리가 먼 것은?\n- 8\n① 동등 분할(equivalence partitioning)\n② 조합(pairwise) 테스팅\n③ 분류트리(classification tree) 방법\n④ 결정(decision) 테스팅",
  "2016_36": "36. 통합 테스트는 모듈간의 인터페이스에 존재할 수\n있는 결함 검출을 목표로 한다. 다음 중에서 인터\n페이스 결함과 가장 거리가 먼 것은?\n① 전달되는 매개변수들의 형이 잘못된 경우\n② 정렬되지 않은 배열임에도 이진 탐색 루틴을 호출\n하는 경우\n③ 데이터 생성자와 소비자의 수행 속도 차이에 따른\n결함\n④ 주어진 기능에 대한 알고리즘을 부정확하게\n구현한 경우",
  "2016_37": "37. 소스 코드에 나타나는 bad smell과 이를 해결하기\n위한 마틴 파울러(M. Fowler)의 리팩토링 기법으로\n적절하지 않은 것은?\n① duplicated code – extract method\n② long method – introduce parameter object\n③ large class – extract class\n④ divergent change – inline method\n8 -",
  "2016_38": "38. 아래의 소스 코드에 대해 테스트를 수행하기 위\n하여 다음과 같이 테스트 데이터를 준비하였다.\n조건 커버리지(condition coverage), 결정 커버리지\n(decision coverage), 문장 커버리지(statement\ncoverage) 기준으로 평가할 때, 다음 중 가장 적절한\n것은? (단, short-circuit evaluation은 수행하지 않음)\n소스 코드 테스트 데이터\nif (x >= -2 && y < 4)\nT = {(-3, -2), (0, 6)}\nx = y * 5;\n단, 테스트 데이터는\nelse\n(x, y) 값에 해당함\nx = y - 5;\n① 조건 커버리지: 50%, 결정 커버리지: 50%, 문장\n커버리지: 50%\n② 조건 커버리지: 50%, 결정 커버리지: 100%, 문장\n커버리지: 66%\n③ 조건 커버리지: 100%, 결정 커버리지: 50%, 문장\n커버리지: 66%\n④ 조건 커버리지: 100%, 결정 커버리지: 100%, 문장\n커버리지: 100%",
  "2016_39": "39. 다음은 테스트 방법에 관한 설명이다. 각 테스트\n방법에 대한 설명과 해당되는 테스트 방법의\n이름이 가장 잘 짝지어진 것은?\n가. 개발된 소프트웨어를 사용자가 실제 운영 환경\n에서 수행하는 테스트\n나. 시스템의 변경된 부분이 기존 시스템에 부작용을\n일으키는지 여부를 파악하기 위한 테스트\n다. 개발자의 통제 하에 사용자가 개발 환경에서\n수행하는 테스트\n라. 시스템에 고장이 발생하더라도 시스템이 정상적\n으로 작동하는지 여부를 파악하기 위한 테스트\n① 가: 알파 테스트 나: 뮤테이션 테스트 다: 베타\n테스트 라: 복구 테스트\n② 가: 베타 테스트 나: 뮤테이션 테스트 다: 알파\n테스트 라: 스트레스 테스트\n③ 가: 알파 테스트 나: 회귀 테스트 다: 베타\n테스트 라: 스트레스 테스트\n④ 가: 베타 테스트 나: 회귀 테스트 다: 알파\n테스트 라: 복구 테스트\n- 9",
  "2016_40": "40. 다음의 그림 (가)와 (나)는 변경요청과 이에 따른\n수정이 필요한 모듈간의 관계를 보여 준다. 즉\n(가)의 경우 변경요청1에 의해서 시스템을 구성\n하는 많은 수의 모듈이 변경되고 있으며 (나)의\n경우에는 여러 개의 변경요청이 하나의 모듈에\n집중되고 있다. 이러한 형태의 bad smell을 부르는\n용어로 가장 적절한 것은?\n(가) (나)\n① (가) switch statements, (나) divergent change\n② (가) shotgun surgery, (나) divergent change\n③ (가) switch statements, (나) middle man\n④ (가) shotgun surgery, (나) middle man",
  "2016_41": "41. 어떤 시스템의 운영상황이 다음과 같다고 할 때,\n이 시스템의 가용성(availability)에 가장 가까운\n값은? (단, 시스템 운영 시간은 (0 ~ 101)h로\n가정하고 고장 발생 시각의 단위는 시[hour]임)\n고장 발생 시각 수리 시간\na 23h a′- a 0.7h\nb 45h b′- b 1.5h\nc 75h c′- c 0.8h\nd 100h d′- d 1.0h\n① 약 90% ② 약 93% ③ 약 96% ④ 약 99%\n9 -",
  "2016_42": "42. ISO/IEC 25010에서는 ISO/IEC 9126-2의 표준 문서\n에서 제시한 소프트웨어 품질 평가의 6가지 품질\n특성에 2가지의 품질 특성을 추가하여 8개의\n소프트웨어 품질 특성에 대해 평가방안을 제시하고\n있다. ISO/IEC 25010에 추가된 2가지의 소프트웨어\n품질 특성으로 가장 적절한 것은?\n① 상호운용성과 이식성 ② 상호운용성과 보안성\n③ 유지보수성과 이식성 ④ 유지보수성과 보안성",
  "2016_43": "43. 다음은 사용자 인터뷰 일부를 발췌한 것이다. 이와\n관련된 ISO 9126 품질 특성으로 가장 적절한 것은?\n요즘 컴퓨터가 재부팅하면 20초 내에 켜지는 것처럼\n만약 시스템이 멈추게 되어도 20초 내에 정상작동이\n되도록 해주세요. 그리고 절대 저 이외에는 다른\n사람들이 이 시스템을 껐다 켜지 못하게 해야 합니다.\n아무나 껐다 켤 수 있다면 정말 큰일 나니까요.\n① 효율성, 신뢰성 ② 기능성, 신뢰성\n③ 기능성, 유지보수성 ④ 사용성, 이식성",
  "2016_44": "44. COCOMO II(COnstructive COst MOdel II) 비용 예측\n모델에 대한 설명으로 가장 적절하지 않은 것은?\n① COCOMO II는 재사용성 강화 및 컴포넌트를 이용한\n조립 개발 환경을 반영하여 COCOMO 비용 예측\n모델을 보완하였다.\n② COCOMO II는 3가지의 대표 모델, 즉 애플리케이션\n구성 모델, 초기 추정 모델, 후반 구조 모델을\n포함하고 있다.\n③ COCOMO II는 원시 코드의 라인 수를 정확히 예측\n하기 어렵다는 점을 고려하여 원시코드를 사용\n하지 않고, 단계별로 정의된 방법으로 값을\n계산하고 인건비를 예측하는 방식이다.\n④ COCOMO II에 적용되는 기본 공식은 E = b × Sc\n× m(X)이다. 단, 여기서 b × Sc는 기초 소요\n노력 예측값, m(X)는 비용 승수의 벡터를 의미한다.\n- 10",
  "2016_45": "45. 다음 표는 두 조직이 수행하고 있는 소프트웨어\n개발 프로젝트에 대한 요약이다. B 조직의 개발자\n1인당 평균 생산성은 A 조직의 개발자 1인당 평균\n생산성의 1.5배로 알려져 있다고 가정할 때,\n(가)와 (나)의 값으로 가장 적절한 것은?\n개발 조직 A\n개발 언어 C++\n언어별 평균 소스 라인수/FP 50 SLOC/FP (C++ 언어)\n추정된 소프트웨어의 라인수 150,000 SLOC\n투입되는 개발자 수 6명\n소프트웨어 개발 완료 소요시간 10개월\n개발자 1인당 월평균 생산성 (가)\n개발 조직 B\n개발 언어 C\n언어별 평균 소스 라인수/FP 130 SLOC/FP (C 언어)\n추정된 소프트웨어의 라인수 390,000 SLOC\n투입되는 개발자 수 5명\n소프트웨어 개발 완료 소요시간 (나)\n개발자 1인당 월평균 생산성 1.5 * (가)\n① (가) 40 FP/month, (나) 15개월\n② (가) 50 FP/month, (나) 12개월\n③ (가) 40 FP/month, (나) 10개월\n④ (가) 50 FP/month, (나) 8개월",
  "2016_46": "46. 다음 중 COCOMO II 모델에서 기능 점수 1 FP에 대한\nSLOC가 큰 것에서 작은 언어 순으로 나타낸 것은?\n① Assembly > Unix Shell Scripts > C > Java > Powerbuilder\n② Assembly > C > Unix Shell Scripts > Java > Powerbuilder\n③ Assembly > C > Unix Shell Scripts > Powerbuilder > Java\n④ Assembly > C > Powerbuilder > Unix Shell Scripts > Java\n0 -",
  "2016_47": "47. 다음 중에서 서비스 지향 아키텍처(SOA)와 관련된\n표준에 대한 설명으로 가장 거리가 먼 것은?\n① 속성-값의 쌍으로 이루어진 데이터 객체를 전달하기\n위한 경량의 데이터 교환 표준\n② 다양한 서비스를 포함하는 프로세스 프로그램을 정의\n하는 데 이용되는 워크플로 언어를 위한 표준\n③ 서비스의 존재를 찾기 위해 이용될 수 있는 서비스\n명세의 컴포넌트에 대한 정의\n④ 서비스의 인터페이스와 바인딩에 대한 표준",
  "2016_48": "48. 다음과 같은 특징을 갖는 미들웨어 아키텍처로 가장\n적절한 것은?\n- 대규모 엔터프라이즈 시스템을 구축할 때 중요한\n기술이며, 서로 다른 독립적인 애플리케이션을 하\n나의 통합된 시스템으로 묶기 위한 접착제 같은 역\n할을 한다.\n- 여러 가지 애플리케이션을 다양한 기술과 다양한\n플랫폼을 이용하여 구축할 수 있으나 이 미들웨어를\n사용하면 사용자는 현재의 애플리케이션을 엔터프\n라이즈급의 애플리케이션에 추가하기 위하여 다시\n구축하거나 근본적인 변경을 가할 필요가 없다.\n- 기본적으로 느슨한 결합의 비동기 기술이며, 동기화\n미들웨어 기술과는 다르게 CORBA에서 볼 수 있는\n것처럼 수신측과 송신측이 강하게 결합되어 있지\n않다.\n① RPC(Remote Procedure Call) Middleware\n② MOM(Message Oriented Middleware)\n③ ORB(Object Request Broker) Middleware\n④ WAS(Web Application Server) Middleware",
  "2016_49": "49. 다음은 서비스 지향 아키텍처(SOA)에서 비즈니스 서비스의\n통합을 위해 사용되는 개념에 대한 설명이다. 설명에\n해당하는 개념으로 가장 적절한 것은?\n- 비즈니스 협업 관점에서 비즈니스 서비스 통합\n- 여러 참여자가 거래 파트너끼리 메시지 교환\n- 비즈니스 프로세스 안에서 다수의 참여자가 peer-to-peer\n방식으로 협업\n- 기업 사이의 프로세스 통합에 많이 사용됨\n- 11\n① Service Orchestration\n② Service Choreography\n③ Enterprise Service Bus\n④ Enterprise Application Integration",
  "2016_50": "50. 다음 그림은 XP(eXtreme Programming) 개발 프로세스를\n나타낸 것이다. (가), (나), (다)에 해당하는 과정으로\n가장 적절한 것은? (단, 그림에서 OOOO로 표시된 부분은\n내용을 가리기 위해 의도적으로 사용하였음)\n① (가) 사용자 스토리, (나) 인수 테스트, (다) 작은\n릴리즈\n② (가) 프로젝트 계획, (나) 인수 테스트, (다) 새로운\n애플리케이션\n③ (가) 유스케이스, (나) 통합 테스트, (다) 컴포\n넌트 조립\n④ (가) 사용자 스토리, (나) 통합 테스트, (다) 새로운\n애플리케이션\n1 -",
  "2017_26": "26. 다음은 정보전략계획 및 업무재설계(ISP/BPR)의\n업무활동들이다. 업무절차와 업무활동의 연결이\n가장 적절한 것은?\n가. 정보기술 환경분석\n나. 업무분석\n다. 정보시스템분석\n라. 차이분석\n마. 벤치마킹\n바. 정보전략 수립\n사. 정보관리체계수립\n아. 정보시스템구조 설계\n자. 업무프로세스 개선계획 수립\n차. 기능점수 도출\n① 이행계획수립 - 바, 사, 아, 자\n② 미래모델설계 - 마, 아, 자, 차\n③ 현황분석 - 나, 다, 라, 마\n④ 환경분석 - 가, 나, 다, 라",
  "2017_27": "27. CMM(Capability Maturity Model)은 소프트웨어\n프로세스 성숙도를 높이기 위하여 필요한 작업\n들에 대한 단계적 모델을 제시하고 있다. 다음에\n제시한 주요 프로세스 영역들이 처음으로 포함\n되는 단계로 가장 적절한 것은?\n- 소프트웨어 프로젝트 계획\n- 소프트웨어 프로젝트 추적 및 감독\n- 소프트웨어 하청 관리\n- 소프트웨어 품질 보증\n- 소프트웨어 형상 관리\n- 요구 관리\n① 최적단계(Optimizing) ② 관리단계(Managed)\n③ 정의단계(Defined) ④ 반복단계(Repeatable)\n- 6",
  "2017_28": "28. 객체지향 소프트웨어 개발 시에 적용할 수 있는\n클래스 테스팅 방법으로 가장 적절하지 않은 것은?\n① 슬라이싱(slicing) 기반 테스팅\n② 베타(beta) 테스팅\n③ 상태기반(state based) 테스팅\n④ 데이터 흐름 기반 테스팅",
  "2017_29": "29. 요구사항 분석에서는 시스템의 범위를 파악하는\n것이 중요하다. 다음 중 시스템의 범위 표현\n기법과 가장 거리가 먼 것은?\n① state transition diagram\n② event list\n③ ecosystem map\n④ context diagram",
  "2017_30": "30. 다음은 그래픽 요소들(선, 텍스트)을 그리고 배치\n할 수 있는 편집도구의 클래스 다이어그램이다.\n다른 도구의 TextView 클래스를 사용하기 위하여\nTextShape 클래스를 Shape의 서브클래스로 생성\n하였다. 이 편집도구에 사용된 디자인 패턴으로\n가장 적절한 것은?\n① Factory 패턴 ② Adapter 패턴\n③ Strategy 패턴 ④ Template Method 패턴\n6 -",
  "2017_31": "31. 소프트웨어 테스팅 기법에 대한 설명으로 가장\n적절하지 않은 것은?\n① 상태기반 테스팅은 상태도 기반으로 상태와 트랜\n지션에 초점을 맞춰 테스트케이스를 생성한다.\n② 빅뱅 통합테스팅은 한 번에 모든 모듈을 모아 통합\n테스팅하는 방법으로 오류의 위치와 원인을 찾기\n힘들다.\n③ 설치 테스팅은 개발의뢰자가 개발환경에서 프로\n젝트 계약에 명시된 사용용이성, 기능성, 성능\n등을 테스트하는 것이다.\n④ 사용사례기반 테스팅은 객체지향 테스팅의 일종\n으로 사용사례 명세로부터 테스트케이스를 추출\n한다.",
  "2017_32": "32. 애자일(agile) 소프트웨어 개발 방법론에 대한\n설명으로 가장 적절하지 않은 것은?\n① XP(eXtreme Programming)에서 시스템 고객은 개발\n팀의 일부이고 다른 팀원들과 시나리오에 대해\n토론한다.\n② 사용사례 또는 사용자 스토리 단위로 조금씩\n반복적으로 릴리즈(release) 한다.\n③ Scrum 프로세스는 개략적인 계획과 구조설계,\n스프린트(Sprint) 사이클, 프로젝트 마감 단계\n를 가진다.\n④ 스프린트(Sprint) 사이클에서는 Inception, Elab-\noration, Construction, Transition 단계가 반복\n적으로 수행된다.",
  "2017_33": "33. 특정 언어에 대한 컴파일러를 개발하려 한다. 이 때\n적용할 수 있는 아키텍처 스타일로 가장 적절한\n것은?\n① 계층 구조, 클라이언트 서버 구조\n② 저장소 구조, MVC 구조\n③ 파이프 필터 구조, 저장소 구조\n④ MVC 구조, 계층 구조\n- 7",
  "2017_34": "34. 다음은 자바코드와 결과 화면이다. 결과 화면처럼\n출력되기 위해 빈칸에 들어갈 코드 중 틀린 것은?\ninterface Command {\npublic abstract void execute();\n}\nclass Lamp {\npublic void turnOn(){\nSystem.out.println(\"Lamp On\");\n}\n}\nclass LampOnCommand ① Command{\nprivate Lamp theLamp;\npublic LampOnCommand(Lamp theLamp){\n② = theLamp;\n}\npublic void execute(){\ntheLamp.turnOn();\n}\n}\nclass Button {\nprivate Command theCommand;\npublic Button(Command theCommand){\n③\n}\npublic void setCommand(Command newCommand){\nthis.theCommand=newCommand;\n}\npublic void pressed(){\ntheCommand.execute();\n}\n}\npublic class Client {\npublic static void main(String[] args) {\nLamp lamp = new Lamp();\nCommand lampOnCommand = new LampOnCommand(lamp);\nButton button1 = new Button( ④ );\nbutton1.pressed();\n}\n}\n결과 화면\n① implements\n② Lamp.theLamp\n③ setCommand(theCommand)\n④ lampOnCommand\n7 -",
  "2017_35": "35. 시스템 아키텍처를 구축하는 과정에서 보안을 강화\n하기 위하여 DMZ(DeMilitarized Zone)를 구축한\n상황을 고려하자. 다음 중 DMZ의 구축 목적으로\n가장 적절한 것은?\n① 외부 공격에 대항하기 위한 사용자 인증(user\nauthentication) 목적\n② 메모리, 네트워크 연결, 접근 포인트 등과 같은\n자원에 대한 접근 제한 목적\n③ 외부 공격으로 인해 시스템이 실패한 상황에서\n실패로부터 회복하기 위한 목적\n④ 공격자를 파악하고 그들의 행동을 추적하기 위해\n사용자 및 시스템 행동을 기록하기 위한 목적",
  "2017_36": "36. 컴포넌트 기반 개발방법론은 컴포넌트 개발 과정과\n컴포넌트 기반 소프트웨어 개발 과정으로 이루어\n진다. 다음은 컴포넌트 기반 개발방법론에서 컴포\n넌트 개발 과정의 절차를 나타낸 것이다. (가)~\n(라)에 들어갈 컴포넌트 개발 단계의 순서가 올\n바르게 나열된 것은? (단, 컴포넌트 저장소 저장\n단계는 컴포넌트 개발 과정 이후의 절차임)\n도메인 분석 - 도메인 설계 - (가) - (나) -\n(다) - (라) - (컴포넌트 저장소 저장)\n① 컴포넌트 설계, 컴포넌트 추출, 컴포넌트 구현,\n컴포넌트 인증\n② 컴포넌트 설계, 컴포넌트 추출, 컴포넌트 인증,\n컴포넌트 구현\n③ 컴포넌트 추출, 컴포넌트 설계, 컴포넌트 구현,\n컴포넌트 인증\n④ 컴포넌트 추출, 컴포넌트 인증, 컴포넌트 설계,\n컴포넌트 구현",
  "2017_37": "37. 스프링 프레임워크(Spring framework)에서는 anno-\ntation을 이용해서 관리 대상이 되는 컴포넌트를\n명시하는 방법을 제공한다. 다음 중 스프링 프레임\n워크에서 컴포넌트를 위해서 사용하는 annotation\n으로 가장 적절하지 않은 것은?\n① @SessionBean ② @Controller\n③ @Service ④ @Repository\n- 8",

  "2017_47": "47. 다음에서 윗부분 코드는 클래스 설계를 위한 5대\n원칙 중 하나를 위반한 사례이고, 아랫부분 코드는\n해당 원칙을 준수한 사례이다. 여기에 적용된 클\n래스 설계 원칙으로 가장 적절한 것은? (단, 여\n기에 보이는 코드는 완전한 코드의 일부분으로서\n동작하는데 전혀 문제가 없으며 동일한 기능을\n수행한다고 가정함)\nOOOO 원칙 위반 사례\n...\nfor(i = 0; i < list.length; i++) {\nShape s = list[i];\nif (s instanceof Rectangle) {\nDrawRectangle(s);\n} else if (s instanceof Circle) {\nDrawCircle(s);\n}\n}\n...\nOOOO 원칙 준수 사례\n...\nfor(i = 0; i < list.length; i++) {\nlist[i].draw();\n}\n...\n① 개방-폐쇄의 원칙(open-closed principle)\n② 단일 책임의 원칙(single-responsibility prin-\nciple)\n③ 리스코프 교체 원칙(liskov substitution prin-\nciple)\n④ 의존관계 역전의 원칙(dependency inversion\nprinciple)",

  "2017_50": "50. 다음의 코드에 적용된 설계 원리로 가장 거리가\n먼 것은?\nclass Data {\nint v1, v2 ;\npublic:\nData(int _v1, int _v2 ) { v1 = _v1 ; v2 = _v2 ; }\nint runWith(int x) { return v1 + v2 + x ; }\nbool check(int x) { return x > v1 + v2 ; }\n} ;\nint f1(int x, Data d) {\nbool success = d.check(x) ;\nint result = 0 ;\nif ( success )\nresult = d.runWith(x) ;\nreturn result ;\n}\n① 모듈화(modularization)\n② 자료 추상화(data abstraction)\n③ 정보 은닉(information hiding)\n④ 다형성(polymorphism)\n1 -",
  "2018_26": "26. 다음 중 기능 점수를 계산할 때 사용되는 소프트\n웨어 요소로 가장 적절하지 않은 것은 ?\n① 입력 ② 출력 ③ 알고리즘 ④ 파일",
  "2018_27": "27. 다음의 설명에 가장 적합한 개념은 무엇인가?\n- 항상 동일한 방식으로 시스템을 구성하는 대신에\n고객별 요구사항을 충족시켜야 한다.\n- 재사용 가능한 컴포넌트 포트폴리오를 바탕으로\n고객별 소프트웨어를 구축한다.\n- 다양한 고객들의 요구사항을 수용하기 위하여\n기능, 대상 플랫폼, 비기능적 요구사항 등의 가\n변성을 고려해야 한다.\n① 서비스 지향 아키텍처(service oriented architecture)\n② 소프트웨어 자산 관리(software asset management)\n③ 소프트웨어 재사용(software reuse)\n④ 소프트웨어 프로덕트 라인(software product lines)",
  "2018_28": "28. 다음 (가)의 의사코드(psuedo code)와 (나)의 제어 흐름\n그래프(control flow graph)에서 McCabe’s 순환복잡도\n(cyclomatic complexity)를 각각 구한 것은?\n(가) (나)\npublic static boolean Light(\nTurn state, int lux) {\nboolean on = false ;\nif ( state == Turn.ON )\nreturn true ;\nif ( state == Turn.Off )\nreturn false ;\nif ( state == Turn.AUTO &&\nlux > 50 || lux < 150 )\non = false ;\nelse\non = true ;\nreturn on;\n}\n① (가) 3, (나) 3 ② (가) 3, (나) 4\n③ (가) 4, (나) 4 ④ (가) 4, (나) 5\n- 6",
  "2018_29": "29. 다음 중에서 ISO/IEC 25010의 성능(performance\nefficiency)과 관련된 지표를 모두 고른 것은?\n가. 동시 접속 가능한 사용자 수\n나. 네트워크 Bandwidth 사용률\n다. 평균 소요시간(turnaround time)\n라. 단위 시간당 평균 처리량\n마. 지원 가능한 프로토콜 수\n① 가, 나 ② 가, 나, 다\n③ 가, 나, 다, 라 ④ 가, 나, 다, 라, 마",
  "2018_30": "30. 편의점에 근무하는 아르바이트 직원의 일급을 계\n산하기 위한 프로그램을 작성하려 한다. 이 프로\n그램에 대한 명세와 제한 조건이 다음과 같을\n때, 동등 클래스 분할 기법에서 all combinations\n기법을 사용하여 테스트 케이스를 도출하려고 할\n경우 필요한 동등 클래스 분할의 개수로 가장 적\n절한 것은?\n명세: 아르바이트 직원은 경력자와 초보자로 나뉜\n다. 경력자는 5시간 이하로 근무할 경우, 8천원/\n시간, 5시간 초과 10시간 이하의 경우 1만원/시\n간, 10시간 초과의 경우에는 1.2만원/시간으로 일\n급을 계산한다. 초보자의 경우에는 경력자의 75%의\n급여를 지급한다. 하루의 최대 허용 근무시간은 15\n시간이다.\n제한 조건: 이 프로그램은 근무 시간 입력을 위\n해 GUI를 제공하며, 경력자와 초보자의 선택은\n라디오 버튼(radio button)으로 구현되고\n(default 값: 초보자), 근무 시간 입력칸은 텍스트\n박스(text box)로 구현되어야 한다. 계산의 편의를\n위해 근무 시간은 시간 단위로 처리되며 사사오입이\n적용된다. 즉 3시간 20분 근무했을 경우 3시간으로,\n3시간 40분 근무했을 경우 4시간으로 처리한다.\n① 6개 ② 9개 ③ 10개 ④ 15개\n6 -",
  "2018_31": "31. 다음은 SOA(Service-Oriented Architecture)의\n구성요소와 이들 간의 관계를 그림으로 나타내고\n있다. (가) ~ (다)에 가장 적합한 구성요소는?\n① (가) service registry, (나) service provider,\n(다) service requester\n② (가) service requester, (나) service provider,\n(다) service registry\n③ (가) service provider, (나) service requester,\n(다) service registry\n④ (가) service registry, (나) service requester,\n(다) service provider",
  "2018_32": "32. 다음 (가)와 같은 모듈 호출 관계도에서 모듈 e를\n단위 테스트하기 위해, (나)와 같이 격리된 테스트\n환경을 구축하였다. (나)의 구성요소 A, B, C의\n역할을 나타낸 것 중 가장 적절한 것은?\n(가) (나)\n① A: 테스트 드라이버, B: 테스트 스터브,\nC: 테스트 오라클\n② A: 테스트 드라이버, B: 테스트 데이터 생성기,\nC: 테스트 모니터\n③ A: 테스트 데이터 생성기, B: 테스트 스터브,\nC: 테스트 오라클\n④ A: 테스트 데이터 생성기, B: 테스트 드라이버,\nC: 테스트 모니터\n- 7",
  "2018_33": "33. 애자일(agile) 프로세스 모델에는 XP, Scrum,\nCrystal 방법들이 있다. Scrum 방식에서 우선\n순위가 매겨진, 사용자의 요구사항 목록에 해당\n하는 것을 (가)라 하고, 계획대비 작업의 진행\n정도를 날짜별로 남은 작업량으로 나타낸 것을\n(나)라고 하며, 스프린트에서 수행한 활동을\n돌아보고 검토하는 과정을 (다)라고 한다.\n(가) ~ (다)에 해당하는 용어로 가장 적절한 것은?\n① (가) sprint backlog, (나) sprint,\n(다) daily scrum meeting\n② (가) release backlog, (나) task board,\n(다) sprint review\n③ (가) product backlog, (나) burndown chart,\n(다) sprint respective\n④ (가) user story, (나) story point,\n(다) sprint planning meeting",
  "2018_34": "34. 소프트웨어 개발 조직의 프로세스를 평가하기 위한\nSPICE 모델을 고려하자. SPICE의 성숙도 수준을\n낮은 단계에서 높은 단계 순으로 나열한다고 할\n때, 다음 보기 중에서 가장 올바른 것은?\n① established - performed - managed -\noptimizing - predictable\n② performed - managed - established -\npredictable - optimizing\n③ established - managed - performed -\npredictable - optimizing\n④ performed - established - managed -\noptimizing – predictable",
  "2018_35": "35. ISO/IEC 25010:2011의 제품 품질 모델에서는 8가지의\n품질 주특성을 정의하고 있다. 다음 중에서 품질\n주 특성과 가장 거리가 먼 것은?\n① 보안성(security)\n② 사용성(usability)\n③ 신뢰성(reliability)\n④ 테스트용이성(testability)\n7 -",
  "2018_36": "36. 소스 코드와 이를 테스트하기 위한 테스트 케이스가\n다음과 같이 주어졌다. 이 테스트 케이스는 문장\n(statement) 커버리지, 조건(condition) 커버리지,\n결정(decision) 커버리지를 100% 만족하지 못한다고\n판명되었다. 다음 보기 중 이 세 가지 커버리지를\n모두 100% 만족하기 위해 추가되어야 할 테스트\n케이스로 가장 적절한 것은? (단, short-circuit\nevaluation은 수행하지 않음)\n줄 번호 소스 코드 테스트 케이스\n1 if (x < 7 || y > 0)\n2 z = x + y - 3;\n3 else\n4 z = x * (y + 5); T = {t1:<x = -2, y = -3>,\n5 if (x > 0 && y < 0) t2:<x = -9, y = 10>}\n6 w = -1 * x + z;\n7 else\n8 w = y + x * z;\n① {t3:<x = -5, y = 12>}\n② {t3:<x = 10, y = 0>}\n③ {t3:<x = 5, y = -5>}\n④ {t3:<x = 8, y = -2>}",
  "2018_37": "37. ISO/IEC/IEEE 29119-2 표준에서 테스트 설계 및\n구현 프로세스는 다음의 6개의 활동(activity)으로\n구성된다. 이 프로세스를 구성하는 활동들을 올\n바른 순서로 나열한 것은?\n가. 테스트 커버리지 아이템 유도 (derive test\ncoverage items)\n나. 테스트 절차 유도 (derive test procedures)\n다. 테스트 집합 조합 (assemble test sets)\n라. 테스트 케이스 유도 (derive test cases)\n마. 테스트 조건 유도 (derive test conditions)\n바. 피처 집합 식별 (identify feature sets)\n① 바 - 다 - 라 - 마 - 가 - 나\n② 바 - 라 - 나 - 가 - 다 - 마\n③ 바 - 가 - 라 - 마 - 나 - 다\n④ 바 - 마 - 가 - 라 - 다 - 나\n- 8",
  "2018_38": "38. 다음의 Car 클래스의 speedUp 메소드는 NOT_MOVING,\nMOVING, FAILED 등에 따라서 상이한 동작을 switch문\n으로 구현하고 있다. 이와 같은 상황에서 적용하기에\n가장 적합한 리팩토링(refactoring) 기법은?\nclass Car {\nprivate int _type;\npublic static final int NOT_MOVING = 0;\npublic static final int MOVING = 1;\npublic static final int FAILED = 2;\npublic Car() { _type = NOT_MOVING; }\npublic void speedUp() {\nswitch ( _type ) {\ncase NOT_MOVING: ... break;\ncase MOVING: ... break;\ncase FAILED: ... break;\ndefault: ... break;\n}\n}\n}\n① replace parameter with method\n② replace type code with state/strategy\n③ introduce parameter object\n④ remove control flag",
  "2018_39": "39. 다음의 그림 (가)와 (나)는 동일한 시스템에 대한\n구조로서 사각형은 모듈을 의미하며 선은 모듈간의\n호출 관계를 의미한다. (가)의 구조는 (나)의 구조와\n같은 모습으로 재구성되는 것이 바람직하다. 이 때\n(나)와 가장 가까운 디자인 패턴은?\n(가) (나)\n① facade pattern ② proxy pattern\n③ composite pattern ④ mediator pattern\n8 -",
  "2018_40": "40. A 회사에서 개발하고자 하는 소프트웨어 제품은\n다음과 같은 품질 특성을 만족하여야 한다. 이러한\n품질 특성은 국제 표준 ISO 25010의 소프트웨어 제\n품 품질 평가 기준의 품질 주특성과 관련 지을 수\n있다. 관련된 품질 주특성을 가장 적절하게 나열한\n것은? (단, ISO/IEC 25010:2011 기준)\n- 공통 환경 및 자원을 다른 제품과 공유하면서\n다른 제품에 악영향을 미치지 않고 필요한 기능을\n효율적으로 수행 할 수 있어야 한다.\n- 동일한 환경에서 같은 목적의 다른 소프트웨어\n제품을 이 제품이 대체 할 수 있어야 한다.\n- 제품은 새로운 결함을 도입하거나 제품의 품질을\n저하시키지 않고 효과적으로 수정될 수 있어야 한다.\n① {functional suitability, compatibility,\nmaintainability}\n② {functional suitability, compatibility,\nportability}\n③ {functional suitability, portability,\nmaintainability}\n④ {compatibility, portability,\nmaintainability}",
  "2018_41": "41. 다음은 엘리베이터 관리자 기능과 스케쥴러 기능에\n대한 클래스 다이어그램을 보여 준다. 이 설계에\n적용된 가장 적절한 2개의 디자인 패턴을 고른 것은?\n① strategy pattern, template method pattern\n② strategy pattern, observer pattern\n③ command pattern, observer pattern\n④ template method pattern, state pattern\n- 9",
  "2018_42": "42. 다음 중에서 소프트웨어 프로세스(SP) 품질 인증의\n2등급에 해당되는 평가 항목을 모두 고른 것은?\n가. 프로젝트 계획\n나. 설계\n다. 측정 및 분석\n라. 고객 요구사항 관리\n마. 문제 해결\n① 가, 나 ② 가, 나, 라\n③ 가, 나, 라, 마 ④ 가, 나, 다, 라",
  "2018_43": "43. 다음 형상관리(configuration management) 설명에\n가장 부합하는 용어는?\n이는 시스템을 구성하는 컴포넌트 버전의 집합이\n다. 여기에 사용된 컴포넌트 버전은 변경되지 않\n도록 통제되어야 한다. 만약 이를 새롭게 재생성\n하고자 하면 구성된 컴포넌트 버전을 변경할 수\n있다.\n① mainline ② baseline\n③ branching ④ merging",
  "2018_44": "44. 다음 코드를 수행할 때, 수행결과로 가장 적절한\n것은 ?\n#include <stdio.h>\nvoid main()\n{\nint a = 20, b = 30;\nif ( a++ <= 20 || ++b > 30 )\nb++;\nprintf(“%d %d\\n”, a++, b );\n}\n① 21 31 ② 21 32 ③ 22 31 ④ 22 32\n9 -",
  "2018_45": "45. 아래 상태 다이어그램에서는 이벤트 발생에 따라\n상태 전이가 일어난다. 다음 중 이벤트에 따른\n상태 전이로 가장 적절하지 않은 것은 ?\ne1 e2 e3\n① S1 > A1 > A2 > A1\ne2 e6 e4\n② A1 > A2 > B1 > B2\ne6 e4 e7\n③ A2 > B1 > B2 > A2\ne7 e6 e4\n④ B1 > A1 > B1 > B2",
  "2018_46": "46. 모듈 내부의 응집도는 가장 약한 정도(가장 바람직\n하지 못한 경우)에서 가장 강한 정도(가장 바람직\n한 경우)에 이르기까지 나열할 수 있다. 다음 중\n모듈 내부의 응집도가 약한 정도에서 강한 정도\n순으로 가장 적절하게 나열한 것은?\n① coincidental cohesion – logical cohesion –\ntemporal cohesion – communicational cohesion\n– procedural cohesion – sequential cohesion\n– functional cohesion\n② coincidental cohesion – logical cohesion –\ntemporal cohesion – procedural cohesion –\ncommunicational cohesion – sequential cohesion\n– functional cohesion\n③ coincidental cohesion – logical cohesion –\nsequential cohesion – communicational cohesion\n– procedural cohesion – temporal cohesion –\nfunctional cohesion\n④ coincidental cohesion – logical cohesion –\ntemporal cohesion – sequential cohesion –\ncommunicational cohesion – procedural cohesion\n– functional cohesion\n- 10",
  "2018_47": "47. 다음 그림은 V 모델을 나타낸 것이다. 다음 보기\n중에서 그림의 (가) 단계에서 적용할 수 있는\n테스트 기법으로 가장 거리가 먼 것은?\n① 복구 테스트 ② 빅뱅 테스트\n③ 볼륨 테스트 ④ 스트레스 테스트",
  "2018_48": "48. 다음은 위임을 이용하여 adapter pattern을 구현한\n클래스 다이어그램을 나타내고 있다. (가) ~ (다)\n에 가장 적합한 클래스명은?\n① (가)-adaptee, (나)-adapter, (다)-target\n② (가)-adapter, (나)-adaptee, (다)-target\n③ (가)-target, (나)-adapter, (다)-adaptee\n④ (가)-target, (나)-adaptee, (다)-adapter\n0 -",
  "2018_49": "49. 다음 코드를 수행할 때, 수행결과로 가장 적절한\n것은?\nint func(int& res, int val) {\nres = res + val;\nreturn res;\n}\nvoid main() {\nint sum = 0;\nfor(int a = 1; a < 4; a++)\nsum += func(sum, a);\ncout << sum << endl;\n}\n① 6 ② 12 ③ 22 ④ 24",
  "2018_50": "50. 다음은 UML 2.0에 기반하여 UML class, package,\ncomponent와 interface간의 관계를 보여 준다.\n다음 중 가장 적절하지 않은 것은?\n(가)\n(나)\n(다)\n(라)\n① (가) ② (나) ③ (다) ④ (라)\n- 11\n1 -",
  "2019_26": "26. 품질 속성 시나리오(quality attribute scenario)는\n품질 속성에 대한 요구사항을 명확하게 기술하는\n대표적인 방식이다. 다음 중에서 품질 속성 시나\n리오를 구성하는 항목과 가장 거리가 먼 것은?\n① stimulus – response를 유발하기 위한 stimulus를\n명시한다.\n② response – stimulus에 대하여 요구되는 결과를\n명시한다.\n③ artifact – stimulus의 대상으로서 response를\n산출하는 대상을 명시한다.\n④ stakeholder – 해당 품질속성과 밀접한 관련이\n있는 이해관계자를 명시한다.",
  "2019_27": "27. 동일한 입력에 대해서 엘리베이터 제어 시스템은\n내부 상황에 따라서 다른 동작을 보인다. 예를\n들어 “open door” 버튼이 선택된 경우, 엘리베\n이터가 이동 중이면 무시하여야 하고, 정지 중이\n면서 문이 닫혀있거나 닫히는 중인 경우에만 문을\n열어야 한다. 이와 같은 동작 특성을 가지는 시\n스템을 테스트할 때의 테스트 설계 기법으로 가장\n적절한 기법은?\n① 분기(branch) 테스팅\n② 경계값 분석(boundary value analysis) 테스팅\n③ 상태 전이(state transition) 테스팅\n④ 결정표(decision table) 테스팅",
  "2019_28": "28. 다음의 설명에 가장 적절한 개념은 무엇인가?\n낮은 품질의 소프트웨어가 결국은 미래에 사용자의\n니즈를 충족시키는 것을 지연시킨다.\n비즈니스 이해관계자 및 경영진과 소프트웨어 품질에\n대한 의사 소통시 유용한 비유이다.\n① bad smell\n② technical debt\n③ quality cost\n④ software entropy\n- 6",
  "2019_29": "29. 다음 클래스 다이어그램은 주문처리 기능에 대한\n설계를 보여 준다. 이 클래스 다이어그램에 적용된\n설계 원칙으로서 가장 적절한 것은?\n① SRP(Single Responsibility Principle)\n② ISP(Interface Segregation Principle)\n③ DIP(Dependency Inversion Principle)\n④ LSP(Liskov Substitution Principle)",
  "2019_30": "30. 다음 유스케이스 다이어그램은 도서관 시스템에\n대한 간략한 기능을 보여준다. 이 유스케이스\n다이어그램에 표시된 관계 중에서 가장 적절하게\n사용되고 있는 것은?\n① (가) ② (나) ③ (다) ④ (라)\n6 -",
  "2019_31": "31. 다음 클래스 다이어그램은 TestAutomation 클래스가\nStateCoverageGenerator 또는 TransitionCoverage\nGenerator를 이용하여 테스트케이스를 자동 생성\n하는 모습을 보여 준다. 이 설계와 가장 밀접한\n관계가 있는 feature diagram은?\n(가)\n(나)\n(다)\n(라)\n① (가) ② (나) ③ (다) ④ (라)\n- 7",
  "2019_32": "32. 사용자 요구사항의 변경 요청 및 플랫폼의 변경을\n효율적으로 수용하기 위해서는 아키텍처를 설계\n하면서 변경용이성(modifiability)을 고려해야\n한다. 다음 중에서 변경용이성을 높이기 위하여\n적용하는 방법과 가장 거리가 먼 것은?\n① 모듈간의 바인딩을 실행시간보다 컴파일 또는 빌드\n시점에 함으로써 모듈의 동작을 명확히 하도록 한다.\n② 정보은닉 개념을 적용하여 모듈에 대한 명확한 인터\n페이스를 도입하거나 중재자를 도입하여 모듈간의\n의존관계를 감소시킨다.\n③ 하나의 모듈이 하나의 명확한 역할을 하며, 하나의\n모듈이 여러 역할을 하는 경우 모듈을 분할하도록\n한다.\n④ 모듈의 크기가 너무 큰 경우 적절하게 작은 크기의\n모듈로 분할함으로써 변경 비용을 감소시키도록 한다.",
  "2019_33": "33. Robert Martin은 clean architecture를 설명하면서\n컴포넌트 응집도에 대한 3가지 원칙을 제시하였다.\n다음 중에서 제시된 컴포넌트 응집도와 거리가\n가장 먼 것은?\n① REP(The Reuse/Release Equivalence Principle)\n② CCP(The Common Closure Principle)\n③ SCP(The Single Change Principle)\n④ CRP(The Common Reuse Principle)",
  "2019_34": "34. 다음은 A 회사를 대상으로 CMM/CMMI의 성숙도를\n평가하기 위해 평가자들이 파악한 내용들을 간략\n하게 정리한 것이다. 이 내용을 근거로 이 회사의\n성숙도 수준을 평가한 것으로 가장 적절한 것은?\n- 소프트웨어 프로세스가 잘 정의되어 있고, 조직이\n이를 잘 준수하고 있다.\n- 조직 내 별도의 그룹이 이 프로세스를 전담하며,\n개발자들에게 교육을 진행하고 있다.\n- 조직에서 정의한 프로세스 표준을 프로젝트 특성에\n맞게 테일러링하여 사용하기도 한다.\n- 이 프로세스를 기반으로 개발 공정, 비용, 일정,\n기능이 통제되고 있다.\n① 레벨 2: managed\n② 레벨 3: defined\n③ 레벨 4: quantitatively managed\n④ 레벨 5: optimizing\n7 -",
  "2019_35": "35. 다음은 클래스 A와 B 사이에 존재하는 연관관계\n(association)에 대한 스테레오타입(stereotype)과\n이를 코드로 표현한 것이다. 가장 적절하지 않은\n것은?\npublic class A {\npublic B makeB() {\n가 return new B();\n}\n}\npublic class A {\nB b = new B();\n나 public void f() {\n… // use b\n}\n}\npublic class A {\npublic void f(B b) {\n다 … // use b\n}\n}\npublic class A {\nprivate B itsB;\n라 public void f() {\nitsB.f();\n}\n}\n① 가 ② 나 ③ 다 ④ 라",
  "2019_36": "36. 전자정부 표준프레임워크 실행환경은 7개 서비스\n그룹으로 구성되며 38개 서비스를 제공한다. 다음 중\n‘업무처리’ 서비스 그룹에 포함되는 서비스로 가장\n적절한 것은?\n가. scheduling\n나. transaction\n다. exception handling\n라. job execution\n마. process control\n바. sync/async processing\n① 가, 라 ② 나, 바 ③ 다, 마 ④ 라, 바",

  "2019_38": "38. 다음은 ‘항공권 예약 시스템’의 요구사항의 일부를\n나열한 것이다. 여기서 비기능 요구사항만을 고른\n것으로 가장 적절한 것은?\n가. 항공편, 탑승객, 예약을 입력하는 방법이 결정\n되어야 한다.\n나. 여행사와 고객이 데이터베이스에 접근할 때 어떤\n정보를 얻을 수 있는지 결정해야 한다.\n다. 시스템은 일주일에 2분 정도의 다운만 허용하며\n그 이외에는 항상 사용할 수 있어야 한다.\n라. 티켓에 어떤 정보를 표시할지 결정해야 한다.\n마. 자주 탑승하는 고객을 서비스하기 위하여 시스\n템을 확장할 수 있어야 한다.\n① 다 ② 가, 라 ③ 나, 라 ④ 다, 마",
  "2019_39": "39. 다음은 외부 품질 속성과 관련이 있는 내부 속성과\n의 관계를 나타낸 그림이다. (가), (나), (다)에\n들어갈 외부 속성을 가장 바르게 나열한 것은?\n(가) (나) (다)\n① 유지보수성 신뢰성 사용성\n② 유지보수성 사용성 신뢰성\n③ 사용성 신뢰성 유지보수성\n④ 신뢰성 사용성 유지보수성",
  "2019_40": "40. 다음 표를 보고 추정한 개발 팀의 속도(velocity)로\n가장 적절한 것은?\n스토리 스토리 포인트 상태\n스토리 A 5 미완성\n스토리 B 7 완성\n스토리 C 5 완성\n스토리 D 3 부분완료\n스토리 E 3 완성\n스토리 F 8 시작안함\n스토리 G 5 부분완료\n① 8 ② 13 ③ 15 ④ 36\n8 -",
  "2019_41": "41. 다음은 발생한 트러블을 처리하기 위해 디자인\n패턴을 적용하여 구현한 프로그램의 각 클래스\n에 대한 해설과 클래스 다이어그램이다. 가장\n적절한 디자인 패턴은?\n이름 해설\n발생한 트러블을 나타내는 클래스,\nTrouble\n트러블 번호를 가진다\nSupport 트러블을 해결하는 추상 클래스\n트러블을 해결하는 구체 클래스\nNoSupport\n(항상 처리하지 않는다)\n트러블을 해결하는 구체 클래스\nLimitSupport\n(지정한 번호 미만의 트러블을 해결)\n트러블을 해결하는 구체 클래스\nOddSupport\n(홀수 번호의 트러블을 해결)\n트러블을 해결하는 구체 클래스\nSpecialSupport\n(특정 번호의 트러블을 해결)\nSupport들의 사슬을 만들고 트러블을\nMain\n발생시키는 동작 테스트용 클래스\n① observer\n② template method\n③ abstract factory\n④ chain of responsibility\n- 9",
  "2019_42": "42. ISO/IEC 33063:2015(E)에는 소프트웨어 테스팅을\n위한 process assessment model이 정의되어 있다.\n다음 중 ISO/IEC 33063:2015(E)의 test management\nprocess 그룹에 속하지 않는 프로세스는?\n① test planning process\n② test monitoring and control process\n③ test completion process\n④ test execution process",
  "2019_43": "43. ITIL V3에서 lifecycle phase 와 lifecycle process\n의 연결이 가장 적절한 것은?\nlifecycle phase lifecycle process\n가. service strategy A. capacity management\n나. service design B. demand management\n다. service transition C. event management\n라. service operation D. knowledge management\n① 가-A, 나-B, 다-C, 라-D\n② 가-B, 나-A, 다-D, 라-C\n③ 가-A, 나-C, 다-D, 라-B\n④ 가-B, 나-A, 다-C, 라-D",
  "2019_44": "44. Provider 클래스가 Service 인터페이스에 정의된\n기능을 제공하고 User 클래스가 인터페이스에\n정의된 기능을 사용한다는 의미를 표현한 클래스\n다이어그램으로 가장 적절한 것은?\n(가)\n(나)\n(다)\n(라)\n① (가) ② (나) ③ (다) ④ (라)\n9 -",
  "2019_45": "45. 스크럼(scrum)에서 작업을 진행하는 순서로 가장\n적절한 것은?\n(가) 스프린트 계획 (나) 스프린트 리뷰\n(다) 스프린트 회고 (라) 릴리스 계획\n① (다) → (나) → (다) → (라)\n② (라) → (가) → (나) → (다)\n③ (다) → (라) → (가) → (나)\n④ (나) → (다) → (라) → (가)",
  "2019_46": "46. 다음 JAVA 코드를 실행한 결과 중, 가장 적절한\n것은?\nimport java.util.ArrayList;\nimport java.util.Collection;\nimport java.util.HashMap;\nimport java.util.HashSet;\nimport java.util.LinkedList;\nimport java.util.List;\nimport java.util.Map;\nimport java.util.Set;\nimport java.util.Stack;\nimport java.util.TreeMap;\nimport java.util.TreeSet;\npublic class TestB\n{\npublic static int list = 0, map = 0, set = 0,\ncollection = 0;\npublic static void collectionCounter(Object abc)\n{\nif (abc instanceof List) list++;\nif (abc instanceof Map) map++;\nif (abc instanceof Set) set++;\nif (abc instanceof Collection)\ncollection++;\n}\npublic static void main(String[] args)\n{\ncollectionCounter(new HashSet<Object>());\ncollectionCounter(new HashMap<Object,\nObject>());\ncollectionCounter(new ArrayList<Object>());\ncollectionCounter(new LinkedList<Object>());\ncollectionCounter(new Stack<Object>());\ncollectionCounter(new TreeSet<Object>());\ncollectionCounter(new TreeMap<Object,\nObject>());\nSystem.out.println(\"list = \"+list+\" map =\n\"+map+\" set = \"+set+\" collection = \"+collection);\n}\n}\n① list = 2 map = 2 set = 2 collection = 1\n② list = 2 map = 3 set = 3 collection = 5\n③ list = 3 map = 2 set = 2 collection = 5\n④ list = 3 map = 3 set = 3 collection = 1\n- 10",
  "2019_47": "47. 다음은 리팩토링 전 후의 코드 변화이다. 적용된\n리팩토링 기법으로 가장 적절한 것은?\npublic void print(int times) {\n//테두리 출력\nSystem.out.print(“+”);\nfor (int i = 0; i < _content.length(); i++) {\nSystem.out.print(“-”);\n}\nSystem.out.print(“+”);\n//내용 출력\nfor (int i = 0; i < times; i++) {\nSystem.out.print(“|” + _content + “|”);\n}\n//테두리 출력\nSystem.out.print(“+”);\nfor (int i = 0; i < _content.length(); i++) {\nSystem.out.print(“-”);\n}\nSystem.out.print(“+”);\n}\npublic void print(int times) {\nprintBorder();\nprintContent(times);\nprintBorder();\n}\nprivate void printBorder() {\nSystem.out.print(“+”);\nfor (int i = 0; i < _content.length(); i++) {\nSystem.out.print(“-”);\n}\nSystem.out.print(“+”);\n}\nprivate void printContent(int times){\nfor (int i = 0; i < times; i++) {\nSystem.out.print(“|” + _content + “|”);\n}\n}\n① hide method ② push down method\n③ inline method ④ extract method\n0 -",
  "2019_48": "48. 서비스 지향 아키텍처인 XML 웹서비스에 대한\n다음 설명에서 (가)~(다)에 들어갈 내용을 순서\n대로 나열한 것은?\n( 가 ) 은(는) 서비스 인터페이스 정의를 위한 표\n준, 즉, 서비스 오퍼레이션과 서비스 바인딩이 정의\n되는 방식을 결정한다. ( 나 ) 은(는) 서비스 메소\n드 호출과 데이터 전달 등 메시징을 위해 사용되는\n표준이다. 웹서비스 메시지 전송은 ( 다 ) 등의 프\n로토콜이 사용된다.\n① (가) UDDI (나) SOAP (다) HTTP\n② (가) UDDI (나) HTTP (다) TCP/IP\n③ (가) WSDL (나) SOAP (다) HTTP\n④ (가) WSDL (나) HTTP (다) TCP/IP",
  "2019_49": "49. 다음 중 소프트웨어 형상관리에 대한 설명으로\n틀린 것은?\n① 특정 컴포넌트의 일련의 버전을 코드라인(code-\nline)이라고 하고, 시스템에 포함되는 컴포넌트\n들의 가장 최근 버전의 집합을 베이스라인(base\nline)이라고 한다.\n② 버전 저장소로부터 개인 작업공간으로 가지고\n오는 것을 체크아웃(check-out)이라고 하고\n변경된 컴포넌트들을 버전 저장소에 반영하는 것을\n체크인(check-in)이라고 한다.\n③ 동일한 컴포넌트를 다른 목적으로 독립적인\n개발을 하려면 분기(branch)를 사용하고, 각\n분기에서 변경된 내용을 합치는 것을 병합(merge)\n라고 하는데 병합 시 충돌(conflict)이 발생할\n수 있다.\n④ 컴포넌트의 버전 간 차이를 델타(delta)라고 하며,\n어떤 버전으로부터 이전 버전을 생성하기 위한\n규칙은 후향(backward) 델타, 어떤 버전으로부터\n이후 버전을 생성하기 위한 규칙은 전향(forward)\n델타라고 한다.\n- 11",
  "2019_50": "50. 다음 pseudo code를 보고 최소 문장 커버리지\n(statement coverage) 테스트 케이스(test case)의\n수와 최소 분기 커버리지(branch coverage) 테스트\n케이스(test case)의 수로 가장 적절한 것은?\nread a, b;\nif (a+b > 10) then\nprint “Big”;\nendif\nif (a > 10) then\nprint “aBig”;\nendif\nprint a, b;\n① 문장 커버리지 : 2, 분기 커버리지 : 2\n② 문장 커버리지 : 1, 분기 커버리지 : 1\n③ 문장 커버리지 : 1, 분기 커버리지 : 2\n④ 문장 커버리지 : 2, 분기 커버리지 : 1\n1 -",
  "2020_26": "26. 요구사항 검증 과정 동안, 요구사항 문서에 작성\n된 요구사항들에 대해서 다양한 유형의 점검을\n수행해야 한다. 다음 중 요구사항 점검 유형과\n그 설명이 가장 적절하게 짝지어진 것은?\n① 완전성 점검 : 문서상의 요구사항은 서로 상충\n되지 않아야 한다.\n② 일관성 점검 : 요구사항 문서는 시스템 사용자가\n의도한 모든 기능과 제약을 정의하는 요구사항을\n포함해야 한다.\n③ 유효성 점검 : 요구사항이 시스템 사용자의 실제\n요구를 반영하는지를 점검한다.\n④ 실현성 점검 : 고객과 계약자 사이의 분쟁 가능성을\n줄이기 위해, 시스템 요구사항은 문서로 작성해서\n구현이 가능한지를 점검해야 한다.",
  "2020_27": "27. 다음은 웹 기반 시스템에서 상호 작용 관리를 위\n해 MVC 패턴이 사용될 때 런타임 시스템 아키텍\n처를 그림으로 나타내고 있다. (가) ~ (다)에 가\n장 적절한 구성요소는?\n① (가) 뷰, (나) 제어기, (다) 모델\n② (가) 모델, (나) 제어기, (다) 뷰\n③ (가) 제어기, (나) 모델, (다) 뷰\n④ (가) 제어기, (나) 뷰, (다) 모델\n- 6",
  "2020_28": "28. 다음 설명에 가장 적절한 디자인 패턴은?\n이 패턴의 특징은 ‘기능의 클래스 계층’과 ‘구현\n의 클래스 계층’을 분리하는 것이다. 이 두 개의\n클래스 계층을 분리해 두면 각각의 클래스 계층을\n독립적으로 확장할 수 있다. 기능을 추가하고 싶으\n면 기능의 클래스 계층에 클래스를 추가한다. 이때\n구현의 클래스 계층은 전혀 수정할 필요가 없다.\n① memento 패턴 ② flyweight 패턴\n③ adapter 패턴 ④ bridge 패턴",
  "2020_29": "29. 다음 표는 3개의 입력 인자가 가질 수 있는 값을\n나타내고 있다.\n입력 인자 A B C\nA1 B1 C1\n값(또는 클래스)\nA2 B2 C2\n이 때 페어와이즈 테스트(pairwise test) 조합으\n로 생성된 테스트 케이스는 다음 표와 같다. (가)\n~ (라)에 가장 적절한 값은?\n입력 인자\nA B C\n테스트 케이스\n1 A2 B2 (가)\n2 A2 B1 (나)\n3 A1 B2 (다)\n4 A1 B1 (라)\n① (가) C1, (나) C1, (다) C2, (라) C2\n② (가) C1, (나) C2, (다) C2, (라) C1\n③ (가) C1, (나) C1, (다) C1, (라) C1\n④ (가) C2, (나) C2, (다) C2, (라) C2",
  "2020_30": "30. 애자일 프로젝트에서 다음과 같이 시간의 경과에\n따라 완료된 작업량을 그래프로 표시하기 위해\n가장 적절한 것은?\n스프린트 1차 2차 3차 4차 5차 6차\n완료 25 40 30 25\n스토리포인트 40 45 55 60 42\n누적\n25 65 95 120\n스토리포인트\n전체\n300 300 300 320\n스토리포인트\n① 번다운 차트 ② 번업 차트\n③ PERT/CPM 차트 ④ 백로그 진척률 차트\n6 -",
  "2020_31": "31. 다음 설명에 해당하는 것으로 가장 적절한 것은?\nŸ 통제된 프로젝트 환경에서 점증적 프로토타이핑을\n통해 빠듯한 시간 제약조건 내에 시스템을 개발\n하고 유지보수하기 위한 프레임워크를 제공하는\n애자일 소프트웨어 개발 방식이다.\nŸ 각각의 반복 단계가 파레토 법칙(80% 규칙)을 따\n르는 반복적인 소프트웨어 프로세스이다.\nŸ 생명주기는 기본적인 비즈니스 요구사항과 제약\n조건을 설정하는 타당성 조사로부터 시작해서,\n기능성 그리고 정보 요구사항을 도출하는 비즈니스\n연구를 수행한다. 이후 기능적 모델 반복, 설계와\n구축 반복, 시행이라는 세 가지 다른 반복주기가\n정의된다.\n① 스크럼(scrum)\n② 애자일 모델링(agile modeling)\n③ 동적 시스템 개발 방법(DSDM)\n④ 애자일 통합 프로세스(AUP)",
  "2020_32": "32. 다음 코드에 대한 순환복잡도(cyclomatic complexity)\n로 가장 적절한 것은?(단, 코드 실행상의 문제가\n없다고 가정함)\nvoid Scoreboard::drawscore(int n) {\nif (n > 0) {\nscore[numdigits]->erase();\n}\nnumdigits = 0;\nif (n == 0) {\ndelete score[numdigits];\nscore[numdigits] = new Displayable(digits[0]);\nscore[numdigits]->move(Point((700-numdigits*18),40));\nscore[numdigits]->draw();\nnumdigits++;\n}\nwhile (n) {\nint rem = n % 10;\ndelete score[numdigits];\nscore[numdigits] = new Displayable(digits[rem]);\nscore[numdigits]->move(Point((700-numdigits*18),40));\nscore[numdigits]->draw();\nn /= 10;\nnumdigits++;\n}\n}\n① 2 ② 3 ③ 4 ④ 5\n- 7",
  "2020_33": "33. 다음과 같은 소스 코드가 주어졌다. 이 코드를 경로\n(path) 커버리지를 100% 만족하도록 테스트하고자\n한다. 이때 경로 커버리지를 측정하고자 코드의\n실행 경로 상의 특정 지점에 탐침(probe)을 삽입\n하려 한다. 각 경로의 실행 여부를 판단하기 위해\n필요한 최소 탐침 개수로 가장 적절한 것은?\n줄번호 소스 코드\n1 int main(void) {\n2 int x, y, z;\n3 scanf(“%d %d”, &x, &y);\n4 if (x < 0) {\n5 if (y < 0) {\n6 z = x - y;\n7 } else {\n8 z = x + y;\n9 }\n10 z = 5 * z;\n11 } else {\n12 z = 2 * x * -y;\n13 }\n14 if (z >= 0) {\n15 printf(“%d is positive\\n”, z);\n16 } else {\n17 printf(“%d is negative\\n”, z);\n18 }\n19 return 1;\n20 }\n① 4 ② 5 ③ 6 ④ 8",
  "2020_34": "34. 소프트웨어 품질 속성 중 테스트 가능성(testability)은\n테스트를 통해 소프트웨어 결함을 쉽게 발견할\n수 있도록 소프트웨어를 개발하는 것을 말한다.\n다음은 여러 종류의 소프트웨어 설계 방법들을\n나열한 것이다. 이 중에서 소프트웨어의 테스트\n가능성을 높이기 위한 설계 방법만을 가장 적절\n하게 묶은 것은?\n가. executable assertions 라. restrict dependencies\n나. introduce concurrency 마. limit nondeterminism\n다. limit structural complexity 바. maintain task model\n① 가, 나, 다 ② 가, 다, 마\n③ 나, 라, 바 ④ 라, 마, 바\n7 -",
  "2020_35": "35. 다음 클린 아키텍처에 대한 설명 중 가장 적절하\n지 않은 것은?\n① 엔티티 계층은 전사적인 핵심업무규칙을 캡슐화\n한다. 엔티티는 메소드를 가지는 객체이거나 일\n련의 데이터 구조와 함수의 집합일 수 있다.\n② 외부인터페이스 계층은 프레임워크나 도구로 구\n성된다. 다른 계층과 통신하기 위한 집합 코드\n외에는 특별히 작성해야 할 코드가 그다지 많지\n않다.\n③ 인터페이스 어댑터 계층은 일련의 어댑터들로\n구성된다. GUI의 MVC(model, view, controller)\n는 모두 인터페이스 어댑터 계층에 속한다.\n④ 유스케이스는 업무계층에 특화된 업무 규칙을\n포함한다. 유스케이스 계층은 데이터베이스, UI 등\n과 원활하게 연계되어 있어 이들의 변경에 영향을\n받는 것이 일반적이다.",
  "2020_36": "36. 스크럼(scrum) 방법론을 따라 소프트웨어를 개발\n하고자 한다. 다음 표와 같은 사용자 스토리가\n있고, 그림과 같은 릴리스 계획을 갖고 있다고\n가정하자(릴리스 계획 내의 모든 스토리는 완료\n됨을 가정). 전체 스토리 포인트가 180일 경우,\n해당 릴리스를 완성하기 위한 프로젝트 일정으로\n가장 적절한 것은? (단, 한 스프린트는 2주이고,\n한 달은 4주라 가정한다)\n스토리 스토리 점수\n스토리 A 7\n스토리 B 5\n스토리 C 6\n스토리 D 4\n스토리 E 8\n스토리 F 6\n스토리 G 10\n스토리 H 5\n스토리 I 3\n... ...\n① 3개월 ② 4개월 ③ 5개월 ④ 6개월\n- 8",
  "2020_37": "37. 다음은 오픈 소스 라이선스에 관한 설명이다.\n(가), (나), (다)에 해당하는 오픈 소스 라이선\n스를 나열한 것으로 가장 적절한 것은?\n(가) 이 라이선스 아래에 있는 오픈 소스 소프트웨\n어를 이용한다면 그 소프트웨어를 오픈 소스로 해야\n한다는 상호(reciprocal) 라이선스이다.\n(나) 컴포넌트의 소스를 공개할 필요 없이 오픈 소\n스 코드와 연결된 컴포넌트를 작성할 수 있다. 그러\n나 라이선스된 컴포넌트를 변경할 경우 그것을 오픈\n소스로 공개하여야 한다.\n(다) 이것은 비상호(nonreciprocal) 라이선스로서\n오픈 소스에 가한 어떤 변경이나 수정을 재공개할\n의무가 없다는 것을 의미한다. 오픈 소스 코드를 판\n매되는 사유(proprietary) 시스템에 포함할 수 있\n다. 오픈 소스 컴포넌트를 사용한다면 그 코드의 원\n작자를 알려야 한다.\n① (가) GNU General Public License(GPL)\n(나) GNU Lesser General Public License(LGPL)\n(다) Berkely Standard Distribution(BSD) License\n② (가) GNU Lesser General Public License(LGPL)\n(나) GNU General Public License(GPL)\n(다) Berkely Standard Distribution(BSD) License\n③ (가) Berkely Standard Distribution(BSD) License\n(나) GNU Lesser General Public License(LGPL)\n(다) GNU General Public License(GPL)\n④ (가) Berkely Standard Distribution(BSD) License\n(나) GNU General Public License(GPL)\n(다) GNU Lesser General Public License(LGPL)",
