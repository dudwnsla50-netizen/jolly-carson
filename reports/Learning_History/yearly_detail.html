<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모의고사 풀이 상세 분석 리포트</title>

    <!-- CSS 및 아이콘 CDN 탑재 -->
    <link rel="stylesheet" href="yearly_detail.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../js/data/new_trend_mapping.js"></script>
</head>

<body>
    <!-- 장식 배경 글로우 -->
    <div class="bg-glow"></div>
    <div class="bg-glow-left"></div>

    <div class="container">
        <!-- 상단 헤더 영역 -->
        <div class="header-row">
            <h1 class="page-title">
                <i data-lucide="award"></i> 모의고사 풀이 상세 분석
            </h1>
            <button class="close-btn" onclick="window.close()">
                <i data-lucide="x"></i> 창 닫기
            </button>
        </div>

        <!-- 메인 분석 상세 뷰 포트 -->
        <div id="yearly-modal-body" class="body-content">
            <!-- JS를 통해 동적 생성 -->
            <div style="text-align: center; padding: 5rem; color: var(--text-muted);">
                <i data-lucide="loader" class="animate-spin" style="width: 32px; height: 32px; margin: 0 auto 1rem; display: block;"></i>
                상세 분석 데이터를 구성하는 중입니다...
            </div>
        </div>
    </div>

    <!-- 비즈니스 로직 연동 -->
    <script src="yearly_detail.js"></script>
</body>

</html>
