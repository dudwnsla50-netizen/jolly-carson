r:inherit\">컴퓨터는 사설 IP로 내부 컴퓨터에 접속한다.</span></p><p style=\"\"><span style=\"color:inherit\">나. SNAT(Static NAT) 방식에서는 사설 IP와 공인 </span></p><p style=\"\"><span style=\"color:inherit\">IP가 일대일로 매핑된다.</span></p><p style=\"\"><span style=\"color:inherit\">다. PAT(Port Address Translation) 방식에서는 </span></p><p style=\"\"><span style=\"color:inherit\">소수의 공인 IP를 내부 네트워크의 다수의 컴</span></p><p style=\"\"><span style=\"color:inherit\">퓨터가 공유해서 사용할 수 있다.</span></p><p style=\"\"><span style=\"color:inherit\">- 20 -</span></p><p style=\"\"><span style=\"color:inherit\">94. 다음 활성화 함수 중에 오류 역전파 학습 알고리</span></p><p style=\"\"><span style=\"color:inherit\">즘의 적용에 필수인 미분 가능한 특징을 갖고 있</span></p><p style=\"\"><span style=\"color:inherit\">지만 기울기 소실(vanishing gradient) 문제를 </span></p><p style=\"\"><span style=\"color:inherit\">발생시키는 활성화 함수로 가장 적절한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 계단 함수</span></p><p style=\"\"><span style=\"color:inherit\">② 렐루 함수</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 시그모이드 함수</span></p><p style=\"\"><span style=\"color:inherit\">④ 선형 함수</span></p><p style=\"\"><span style=\"color:inherit\">95. 다음 중 오픈소스 라이선스를 침해하는 행위에 </span></p><p style=\"\"><span style=\"color:inherit\">해당하는 것을 모두 고른 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 가</span></p><p style=\"\"><span style=\"color:inherit\">② 가, 나</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 가, 나, 다</span></p><p style=\"\"><span style=\"color:inherit\">④ 모두 해당 없음</span></p><p style=\"\"><span style=\"color:inherit\">96. 다음 중 시계열 데이터를 예측하는데 주로 사용</span></p><p style=\"\"><span style=\"color:inherit\">되는 딥러닝 모델로서 시간 t에서의 은닉층</span></p><p style=\"\"><span style=\"color:inherit\">(hidden layer) 출력값이 시간 t+1에서의 은닉층 </span></p><p style=\"\"><span style=\"color:inherit\">입력값으로 사용되는 특징을 가진 것으로 가장 </span></p><p style=\"\"><span style=\"color:inherit\">적절한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 로지스틱회귀(logistic regression) </span></p><p style=\"\"><span style=\"color:inherit\">  ② 순환신경망(recurrent neural network)</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 퍼셉트론(perceptron)</span></p><p style=\"\"><span style=\"color:inherit\">  ④ 합성곱신경망(convolutional neural network)</span></p><p style=\"\"><span style=\"color:inherit\">97. 정보시스템 하드웨어 규모산정 지침(정보통신단체</span></p><p style=\"\"><span style=\"color:inherit\">표준, TTAK.KO-10.0292, 2018.12.19.)에서 CPU의 </span></p><p style=\"\"><span style=\"color:inherit\">규모를 산정할 때 OLTP와 WEB/WAS 서버 모두에서 고</span></p><p style=\"\"><span style=\"color:inherit\">려하는 공통 항목으로 가장 적절하지 않은 것은? </span></p><p style=\"\"><span style=\"color:inherit\">  ① 사용자당 오퍼레이션 수</span></p><p style=\"\"><span style=\"color:inherit\">  ② 시스템 목표 활용률</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 클러스터 보정</span></p><p style=\"\"><span style=\"color:inherit\">  ④ 피크타임 부하 보정</span></p><p style=\"\"><span style=\"color:inherit\">98. 인-메모리 방식으로 연산을 수행하는 Spark에 관</span></p><p style=\"\"><span style=\"color:inherit\">한 설명으로 가장 적절하지 않은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 하둡2.0(YARN 환경)에서는 Spark를 지원하지 않는</span></p><p style=\"\"><span style=\"color:inherit\">다.</span></p><p style=\"\"><span style=\"color:inherit\">  ② 맵리듀스 연산에 비해 그 계산 속도가 매우 빠</span></p><p style=\"\"><span style=\"color:inherit\">르다, </span></p><p style=\"\"><span style=\"color:inherit\">  ③ 파이썬, 스칼라, 자바 언어를 사용하여 개발할 </span></p><p style=\"\"><span style=\"color:inherit\">수 있다. </span></p><p style=\"\"><span style=\"color:inherit\">  ④ 기계학습, 그래프 연산 등 반복적인 계산 문제</span></p><p style=\"\"><span style=\"color:inherit\">를 해결하는 데 적합하다.</span></p><p style=\"\"><span style=\"color:inherit\">99. </span></p><p style=\"\"><span style=\"color:inherit\">다음 </span></p><p style=\"\"><span style=\"color:inherit\">중 </span></p><p style=\"\"><span style=\"color:inherit\">DHCP(Dynamic </span></p><p style=\"\"><span style=\"color:inherit\">Host </span></p><p style=\"\"><span style=\"color:inherit\">Configuration </span></p><p style=\"\"><span style=\"color:inherit\">Protocol) 프로토콜에서 사용하는 메시지에 대한 </span></p><p style=\"\"><span style=\"color:inherit\">설명으로 가장 적절하지 않은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① DHCP ACK는 DHCP Request에 대한 응답으로 보낸다. </span></p><p style=\"\"><span style=\"color:inherit\">  ② DHCP Request는 클라이언트가 DHCP 서버에게 IP</span></p><p style=\"\"><span style=\"color:inherit\">주소를 요청한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ③ DHCP Discover는 DHCP 서버가 IP 주소 할당 서</span></p><p style=\"\"><span style=\"color:inherit\">버임을 알린다.</span></p><p style=\"\"><span style=\"color:inherit\">  ④ DHCP Offer는 DHCP 서버가 요청 클라이언트에게 </span></p><p style=\"\"><span style=\"color:inherit\">할당할 IP주소를 제공한다.</span></p><p style=\"\"><span style=\"color:inherit\">100. 읽기 및 쓰기 성능이 각각 100,000 IOPS(Input </span></p><p style=\"\"><span style=\"color:inherit\">/Output Operations Per Second)인 8개의 동일한 </span></p><p style=\"\"><span style=\"color:inherit\">하드디스크로 RAID 10을 구성할 때 RAID 10의 읽</span></p><p style=\"\"><span style=\"color:inherit\">기 성능과 쓰기 성능으로 가장 적절한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 읽기: 400,000 IOPS, 쓰기: 400,000 IOPS</span></p><p style=\"\"><span style=\"color:inherit\">  ② 읽기: 400,000 IOPS, 쓰기: 800,000 IOPS</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 읽기: 800,000 IOPS, 쓰기: 400,000 IOPS</span></p><p style=\"\"><span style=\"color:inherit\">  ④ 읽기: 800,000 IOPS, 쓰기: 800,000 IOPS</span></p><p style=\"\"><span style=\"color:inherit\">가. GPL3.0 라이브러리를 정적 링크 방식으로 연결</span></p><p style=\"\"><span style=\"color:inherit\">하여 상업용 소프트웨어를 개발, 배포하고 자체 </span></p><p style=\"\"><span style=\"color:inherit\">개발한 모듈의 소스코드를 공개하지 않았다.</span></p><p style=\"\"><span style=\"color:inherit\">나. LGPL3.0 라이브러리를 정적 링크 방식으로 연결</span></p><p style=\"\"><span style=\"color:inherit\">하여 상업용 소프트웨어를 개발, 배포하고 자체 </span></p><p style=\"\"><span style=\"color:inherit\">개발한 모듈의 소스코드를 공개하지 않았다.</span></p><p style=\"\"><span style=\"color:inherit\">다. Apache2.0 라이브러리를 정적 링크 방식으로 연</span></p><p style=\"\"><span style=\"color:inherit\">결하여 상업용 소프트웨어를 개발, 배포하고 자</span></p><p style=\"\"><span style=\"color:inherit\">체 개발한 모듈의 소스코드를 공개하지 않았다.</span></p><p style=\"\"><span style=\"color:inherit\">- 21 -</span></p><p style=\"\"><span style=\"color:inherit\">보  안</span></p><p style=\"\"><span style=\"color:inherit\"> </span></p><p style=\"\"><span style=\"color:inherit\">101. 다음 중 전자서명(Digital signature)의 역할로 </span></p><p style=\"\"><span style=\"color:inherit\">가장 적절하지 않은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 메시지 송신자 인증</span></p><p style=\"\"><span style=\"color:inherit\">  ② 메시지 무결성 검증</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 메시지 기밀성 검증</span></p><p style=\"\"><span style=\"color:inherit\">  ④ 부인 방지</span></p><p style=\"\"><span style=\"color:inherit\">102. AES(Advanced Encryption Standard)에 대한 설</span></p><p style=\"\"><span style=\"color:inherit\">명으로 가장 적절하지 않은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 입력 블록의 크기는 128 비트 고정이고, 키 길</span></p><p style=\"\"><span style=\"color:inherit\">이는 128, 192, 256 비트 3가지 중 하나를 선택</span></p><p style=\"\"><span style=\"color:inherit\">할 수 있다.</span></p><p style=\"\"><span style=\"color:inherit\">  ② DES에서 사용한 Feistel 구조가 아닌 SPN </span></p><p style=\"\"><span style=\"color:inherit\">(Substitution–Permutation Network) 구조를 </span></p><p style=\"\"><span style=\"color:inherit\">사용한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ③ SubBytes 연산에서는 4 바이트의 값을 비트 연</span></p><p style=\"\"><span style=\"color:inherit\">산을 이용하여 새로운 4 바이트 값으로 변환하</span></p><p style=\"\"><span style=\"color:inherit\">는 과정을 수행한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ④ 복수 라운드로 구성되어 있으며, 각 라운드는 </span></p><p style=\"\"><span style=\"color:inherit\">SubBytes, ShiftRows, MixColumns, AddRoundKey </span></p><p style=\"\"><span style=\"color:inherit\">라는 4개의 서브 함수로 구성된다.</span></p><p style=\"\"><span style=\"color:inherit\">103. 다음 중 접근통제에 대한 설명으로 가장 적절한 </span></p><p style=\"\"><span style=\"color:inherit\">것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 임의적 접근통제는 관리자가 부여한 사용자와 </span></p><p style=\"\"><span style=\"color:inherit\">정보객체의 보안등급으로 정보의 접근 허가여</span></p><p style=\"\"><span style=\"color:inherit\">부를 결정한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ② 역할 기반 접근통제는 권한관리를 사용자와 정</span></p><p style=\"\"><span style=\"color:inherit\">보 객체간의 관계가 아닌 기업 환경에서의 역할</span></p><p style=\"\"><span style=\"color:inherit\">과 정보 객체 간의 관계로 설정하여 관리한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ③ ACL(Access Control List) 기반의 접근통제는 </span></p><p style=\"\"><span style=\"color:inherit\">객체에 접근통제 정보를 저장하는 방식으로, </span></p><p style=\"\"><span style=\"color:inherit\">주체의 수가 많아져도 효율적인 관리가 가능하</span></p><p style=\"\"><span style=\"color:inherit\">다는 장점이 있다.</span></p><p style=\"\"><span style=\"color:inherit\">  ④ 강제적 접근통제는 정보 객체의 사용을 요청하</span></p><p style=\"\"><span style=\"color:inherit\">는 사용자의 신원에 근거하여 접근 허가를 결정</span></p><p style=\"\"><span style=\"color:inherit\">하는 방식이다.</span></p><p style=\"\"><span style=\"color:inherit\">104. 메시지 인증 코드(MAC)는 메시지의 인증에 사용</span></p><p style=\"\"><span style=\"color:inherit\">되는 작은 크기의 정보이다. 다음 중 메시지 인</span></p><p style=\"\"><span style=\"color:inherit\">증 코드에 대한 설명으로 가장 적절한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 메시지 인증 코드는 두 사용자만이 공유한 키를 </span></p><p style=\"\"><span style=\"color:inherit\">사용하기 때문에 부인 방지가 가능하다.</span></p><p style=\"\"><span style=\"color:inherit\">  ② 블록 암호와 CBC 블록암호 모드를 사용하여 메</span></p><p style=\"\"><span style=\"color:inherit\">시지 인증 코드를 구현할 수 있다.</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 메시지 인증 코드를 사용하면 메시지에 대한 기</span></p><p style=\"\"><span style=\"color:inherit\">밀성과 무결성을 모두 제공한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ④ 메시지 인증 코드는 키에 의존하는 양방향 해시 </span></p><p style=\"\"><span style=\"color:inherit\">함수이다.</span></p><p style=\"\"><span style=\"color:inherit\">105. 다음 설명에 해당하는 공격으로 가장 적절한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① Evil Twin AP 공격</span></p><p style=\"\"><span style=\"color:inherit\">② Hacktivism AP 공격</span></p><p style=\"\"><span style=\"color:inherit\">  ③ Proxy AP 공격</span></p><p style=\"\"><span style=\"color:inherit\">④ AP to AP 공격</span></p><p style=\"\"><span style=\"color:inherit\">106. TCP SYN FLOODING 공격이 성공하기 위해서는 서</span></p><p style=\"\"><span style=\"color:inherit\">버의 TCB 큐에 연결요청이 쌓여서 더 이상의 연</span></p><p style=\"\"><span style=\"color:inherit\">결요청을 받지 못하는 상황이 되어야 한다. 아</span></p><p style=\"\"><span style=\"color:inherit\">래 설명 중 TCB 큐에 연결정보를 제거(Dequeue) </span></p><p style=\"\"><span style=\"color:inherit\">시키는 상황으로 가장 적절하지 않은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 클라이언트가 3-way handshake 과정을 종료함</span></p><p style=\"\"><span style=\"color:inherit\">  ② TCB 큐의 레코드가 정해진 기준시간 보다 더 길</span></p><p style=\"\"><span style=\"color:inherit\">게 머무름</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 공격자가 SYN 패킷을 보낼 때 랜덤하게 생성한 </span></p><p style=\"\"><span style=\"color:inherit\">근원지 IP 주소를 사용함</span></p><p style=\"\"><span style=\"color:inherit\">  ④ TCB 큐의 레코드에 해당하는 연결에 대해 RST </span></p><p style=\"\"><span style=\"color:inherit\">패킷이 도착함</span></p><p style=\"\"><span style=\"color:inherit\">공격자 AP(Access Point)는 정상적인 AP보다 강력</span></p><p style=\"\"><span style=\"color:inherit\">한 전파를 발생시켜 무선랜 이용자가 공격자 AP에 </span></p><p style=\"\"><span style=\"color:inherit\">접속하도록 유도한 후, 무선랜 이용자의 정보를 중</span></p><p style=\"\"><span style=\"color:inherit\">간에서 획득하는 공격</span></p><p style=\"\"><span style=\"color:inherit\">- 22 -</span></p><p style=\"\"><span style=\"color:inherit\">107. 방화벽의 패킷 필터링 규칙이 다음과 같을 때 </span></p><p style=\"\"><span style=\"color:inherit\">적용되는 규칙에 대한 설명으로 가장 적절하지 </span></p><p style=\"\"><span style=\"color:inherit\">않은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 내부와 외부에서 웹 서버(192.168.1.10)에 접근</span></p><p style=\"\"><span style=\"color:inherit\">하는 것을 허용한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ② 외부의 모든 시스템에서 내부 시스템으로 SMTP </span></p><p style=\"\"><span style=\"color:inherit\">패킷을 보내지 못하도록 설정한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 내부 메일 서버(192.168.1.11)에서 외부 메일 </span></p><p style=\"\"><span style=\"color:inherit\">서버(10.10.10.21)로 가는 IMAP 접근을 금지한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ④ 내부 메일 서버(192.168.1.11)에서 외부 메일 </span></p><p style=\"\"><span style=\"color:inherit\">서버(10.10.10.21)로 가는 SMTP 패킷을 허용한다.</span></p><p style=\"\"><span style=\"color:inherit\">108. 다음 중 네트워크 기반 공격 기술에 대한 설명으로 </span></p><p style=\"\"><span style=\"color:inherit\">가장 적절한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① Smurf 공격: 공격자가 송신자 IP 주소를 존재하</span></p><p style=\"\"><span style=\"color:inherit\">지 않거나 다른 시스템의 IP 주소로 위장하여 </span></p><p style=\"\"><span style=\"color:inherit\">목적 시스템으로 패킷을 연속해서 보내는 공격</span></p><p style=\"\"><span style=\"color:inherit\">기법이다.</span></p><p style=\"\"><span style=\"color:inherit\">  ② SYN Flooding 공격: 공격자가 공격 대상의 IP </span></p><p style=\"\"><span style=\"color:inherit\">주소로 위장하여 패킷을 브로드캐스트 주소로 </span></p><p style=\"\"><span style=\"color:inherit\">전송하는 공격이다.</span></p><p style=\"\"><span style=\"color:inherit\">  ③ ARP Redirect 공격: TCP/IP의 구조적인 허점을 </span></p><p style=\"\"><span style=\"color:inherit\">이용한 공격으로, 신뢰관계에 있는 두 개의 호</span></p><p style=\"\"><span style=\"color:inherit\">스트 중 하나를 마비시킨 후 IP 주소를 속이는 </span></p><p style=\"\"><span style=\"color:inherit\">공격이다.</span></p><p style=\"\"><span style=\"color:inherit\">  ④ Switch Jamming 공격: 위조된 MAC 주소를 지속</span></p><p style=\"\"><span style=\"color:inherit\">적으로 보내 스위치의 주소 테이블을 가득 채운 </span></p><p style=\"\"><span style=\"color:inherit\">후 스니핑을 진행하는 공격이다.</span></p><p style=\"\"><span style=\"color:inherit\">109. 리눅스 시스템의 기본 방화벽인 iptables에서 </span></p><p style=\"\"><span style=\"color:inherit\">192.168.20.22 으로부터 들어오는 패킷들을 차</span></p><p style=\"\"><span style=\"color:inherit\">단하는 정책으로 가장 적절한 명령어는?</span></p><p style=\"\"><span style=\"color:inherit\">  ① # iptables –A INPUT 192.168.20.22 –j DROP</span></p><p style=\"\"><span style=\"color:inherit\">  ② # iptables –I INPUT 192.168.20.22 –j LOG</span></p><p style=\"\"><span style=\"color:inherit\">  ③ # iptables –A INPUT 192.168.20.22 –j ACCEPT</span></p><p style=\"\"><span style=\"color:inherit\">  ④ # iptables –A INPUT 192.168.20.22 –j RETURN</span></p><p style=\"\"><span style=\"color:inherit\">110. 다음 중 ARP Poisoning 공격을 방지하는 방법으로 </span></p><p style=\"\"><span style=\"color:inherit\">가장 적절하지 않은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① ARP request 및 ARP reply를 이용하여 MAC 주소</span></p><p style=\"\"><span style=\"color:inherit\">를 현행화하지 못하도록 한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ② 외부 PC가 로컬 네트워크에 접근하지 못하도록 </span></p><p style=\"\"><span style=\"color:inherit\">한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 정적 ARP table을 사용하도록 세팅한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ④ 컴퓨터의 MAC 주소를 주기적으로 변경해 준다.</span></p><p style=\"\"><span style=\"color:inherit\">111. 악성 프로그램은 컴퓨터, 서버, 클라이언트 및 </span></p><p style=\"\"><span style=\"color:inherit\">컴퓨터 네트워크에 악영향을 끼칠 수 있는 소프</span></p><p style=\"\"><span style=\"color:inherit\">트웨어이다. 다음 중 악성 프로그램과 그 특징</span></p><p style=\"\"><span style=\"color:inherit\">에 대한 설명으로 가장 적절하지 않은 것은? </span></p><p style=\"\"><span style=\"color:inherit\">  ① 트로이 목마(Trojan horse)는 정상적인 기능을 </span></p><p style=\"\"><span style=\"color:inherit\">하는 프로그램 속에 숨어 정보를 빼내거나 원</span></p><p style=\"\"><span style=\"color:inherit\">격으로 제어 받도록 하는 악성 프로그램이다. </span></p><p style=\"\"><span style=\"color:inherit\">  ② 스파이웨어(Spyware)는 사용자의 정보를 빼내서 </span></p><p style=\"\"><span style=\"color:inherit\">전송하는 악성 프로그램이다. </span></p><p style=\"\"><span style=\"color:inherit\">  ③ 드로퍼(Dropper)는 다른 프로그램을 감염시키지</span></p><p style=\"\"><span style=\"color:inherit\">는 않지만 네트워크를 통해 자기 복제를 하며 </span></p><p style=\"\"><span style=\"color:inherit\">전파된다.</span></p><p style=\"\"><span style=\"color:inherit\">  ④ 펍(PUP)은 사용자의 동의를 얻어 설치되었으나 </span></p><p style=\"\"><span style=\"color:inherit\">프로그램과는 상관없이 시스템의 성능 저하 또</span></p><p style=\"\"><span style=\"color:inherit\">는 사용자의 결제를 유도하기도 한다.</span></p><p style=\"\"><span style=\"color:inherit\">112. 다음 중 공격자가 리눅스 시스템을 원격에서 공</span></p><p style=\"\"><span style=\"color:inherit\">격하지 못하도록 root 계정으로 원격 접속을 금</span></p><p style=\"\"><span style=\"color:inherit\">지하고자 할 때 파일 내용을 수정해야 하는 것</span></p><p style=\"\"><span style=\"color:inherit\">으로 가장 적절한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① /etc/passwd, /etc/crontab</span></p><p style=\"\"><span style=\"color:inherit\">  ② /etc/pam.d/login, /etc/shadow</span></p><p style=\"\"><span style=\"color:inherit\">  ③ /etc/passwd, /etc/securetty</span></p><p style=\"\"><span style=\"color:inherit\">  ④ /etc/pam.d/login, /etc/securetty</span></p><p style=\"\"><span style=\"color:inherit\">No</span></p><p style=\"\"><span style=\"color:inherit\">From</span></p><p style=\"\"><span style=\"color:inherit\">Service</span></p><p style=\"\"><span style=\"color:inherit\">To</span></p><p style=\"\"><span style=\"color:inherit\">Action</span></p><p style=\"\"><span style=\"color:inherit\">1</span></p><p style=\"\"><span style=\"color:inherit\">Internal </span></p><p style=\"\"><span style=\"color:inherit\">80</span></p><p style=\"\"><span style=\"color:inherit\">External</span></p><p style=\"\"><span style=\"color:inherit\">Allow</span></p><p style=\"\"><span style=\"color:inherit\">2</span></p><p style=\"\"><span style=\"color:inherit\">Any</span></p><p style=\"\"><span style=\"color:inherit\">80</span></p><p style=\"\"><span style=\"color:inherit\">192.168.1.10</span></p><p style=\"\"><span style=\"color:inherit\">Allow</span></p><p style=\"\"><span style=\"color:inherit\">3</span></p><p style=\"\"><span style=\"color:inherit\">192.168.1.11</span></p><p style=\"\"><span style=\"color:inherit\">25</span></p><p style=\"\"><span style=\"color:inherit\">10.10.10.21</span></p><p style=\"\"><span style=\"color:inherit\">Allow</span></p><p style=\"\"><span style=\"color:inherit\">4</span></p><p style=\"\"><span style=\"color:inherit\">192.168.1.11</span></p><p style=\"\"><span style=\"color:inherit\">110</span></p><p style=\"\"><span style=\"color:inherit\">10.10.10.21</span></p><p style=\"\"><span style=\"color:inherit\">Deny</span></p><p style=\"\"><span style=\"color:inherit\">5</span></p><p style=\"\"><span style=\"color:inherit\">192.168.1.11</span></p><p style=\"\"><span style=\"color:inherit\">143</span></p><p style=\"\"><span style=\"color:inherit\">10.10.10.21</span></p><p style=\"\"><span style=\"color:inherit\">Allow</span></p><p style=\"\"><span style=\"color:inherit\">6</span></p><p style=\"\"><span style=\"color:inherit\">10.10.10.21</span></p><p style=\"\"><span style=\"color:inherit\">25</span></p><p style=\"\"><span style=\"color:inherit\">192.168.1.11</span></p><p style=\"\"><span style=\"color:inherit\">Allow</span></p><p style=\"\"><span style=\"color:inherit\">7</span></p><p style=\"\"><span style=\"color:inherit\">External</span></p><p style=\"\"><span style=\"color:inherit\">25</span></p><p style=\"\"><span style=\"color:inherit\">Internal</span></p><p style=\"\"><span style=\"color:inherit\">Deny</span></p><p style=\"\"><span style=\"color:inherit\">...</span></p><p style=\"\"><span style=\"color:inherit\">- 23 -</span></p><p style=\"\"><span style=\"color:inherit\">113. </span><span style=\"color:inherit\">위험관리(Risk management) 과정을 순서대로 나</span></p><p style=\"\"><span style=\"color:inherit\">열한 것으로 가장 적절한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">가. 위험 모니터링 및 통제</span></p><p style=\"\"><span style=\"color:inherit\">나. 위험 식별</span></p><p style=\"\"><span style=\"color:inherit\">다. 위험 분석</span></p><p style=\"\"><span style=\"color:inherit\">라. 위험 대응 계획</span></p><p style=\"\"><span style=\"color:inherit\">  ① (다) - (가) - (나) - (라)</span></p><p style=\"\"><span style=\"color:inherit\">  ② (나) - (다) - (라) - (가) </span></p><p style=\"\"><span style=\"color:inherit\">  ③ (나) - (다) - (가) - (라)</span></p><p style=\"\"><span style=\"color:inherit\">  ④ (다) - (나) - (라) - (가) </span></p><p style=\"\"><span style=\"color:inherit\">114. 가명정보의 안전한 관리를 위한 기술적 보호조</span></p><p style=\"\"><span style=\"color:inherit\">치로 가장 적절하지 않은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 개인정보처리자는 추가정보와 가명정보를 반드</span></p><p style=\"\"><span style=\"color:inherit\">시 물리적으로 분리하여 별도로 저장·관리해</span></p><p style=\"\"><span style=\"color:inherit\">야 한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ② 추가정보가 가명정보와 불법적으로 결합되어 재</span></p><p style=\"\"><span style=\"color:inherit\">식별에 악용되지 않도록 접근권한을 최소화하고 </span></p><p style=\"\"><span style=\"color:inherit\">접근통제를 강화해야 한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 개인정보처리자는 가명정보의 처리목적, 가명처</span></p><p style=\"\"><span style=\"color:inherit\">리한 개인정보 항목, 가명정보의 이용내역, 제3</span></p><p style=\"\"><span style=\"color:inherit\">자 제공 시 제공받는 자를 작성하여 보관하여야 </span></p><p style=\"\"><span style=\"color:inherit\">한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ④ 개인정보처리자는 가명정보 또는 추가정보에 접</span></p><p style=\"\"><span style=\"color:inherit\">근할 수 있는 담당자를 가명정보 처리 업무 목</span></p><p style=\"\"><span style=\"color:inherit\">적 달성에 필요한 최소한의 인원으로 엄격하게 </span></p><p style=\"\"><span style=\"color:inherit\">통제하여야 한다.</span></p><p style=\"\"><span style=\"color:inherit\">115. 다음 설명에 해당하는 레지스터로 가장 적절한 </span></p><p style=\"\"><span style=\"color:inherit\">것은?</span></p><p style=\"\"><span style=\"color:inherit\">스택 오버플로우 공격을 실행하는데 있어서 활용되</span></p><p style=\"\"><span style=\"color:inherit\">는 정보를 보유하고 있는 CPU의 레지스터로서, 해</span></p><p style=\"\"><span style=\"color:inherit\">당 레지스터는 현재 실행 중인 스택에서 argument </span></p><p style=\"\"><span style=\"color:inherit\">및 지역변수의 위치를 참조하기 위한 기준 주소값</span></p><p style=\"\"><span style=\"color:inherit\">을 가지고 있다.</span></p><p style=\"\"><span style=\"color:inherit\">  ① EAX</span></p><p style=\"\"><span style=\"color:inherit\">② ESP</span></p><p style=\"\"><span style=\"color:inherit\">  ③ EDX </span></p><p style=\"\"><span style=\"color:inherit\">④ EBP</span></p><p style=\"\"><span style=\"color:inherit\">116. 딥페이크(Deepfake)에 대한 설명으로 가장 적절</span></p><p style=\"\"><span style=\"color:inherit\">하지 않은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 딥페이크는 인공지능 기술을 이용하여 진위 여</span></p><p style=\"\"><span style=\"color:inherit\">부를 구별하기 어려운 가짜 이미지나 영상물을 </span></p><p style=\"\"><span style=\"color:inherit\">제작하는 기술이다.</span></p><p style=\"\"><span style=\"color:inherit\">  ② 딥페이크를 이용한 가짜뉴스, 불법 성인용 콘텐</span></p><p style=\"\"><span style=\"color:inherit\">츠 제작으로 인한 피해를 감소시키기 위해 법적 </span></p><p style=\"\"><span style=\"color:inherit\">단속이 강화되고 있다.  </span></p><p style=\"\"><span style=\"color:inherit\">  ③ 딥페이크는 영화제작 분야에서 활용되는 등 부</span></p><p style=\"\"><span style=\"color:inherit\">작용 없이 사회, 정치 분야에 도움이 되고 있</span></p><p style=\"\"><span style=\"color:inherit\">다.</span></p><p style=\"\"><span style=\"color:inherit\">  ④ 딥페이크 기술이 스캔들의 진위여부에도 영향을 </span></p><p style=\"\"><span style=\"color:inherit\">미치는 등 사회적 파급력이 커지고 있다.</span></p><p style=\"\"><span style=\"color:inherit\">117. 블록체인(Blockchain)은 P2P 방식을 기반으로 </span></p><p style=\"\"><span style=\"color:inherit\">생성된 체인 형태의 연결고리 기반 분산 데이터 </span></p><p style=\"\"><span style=\"color:inherit\">저장 환경이다. 다음 중 블록체인에 대한 설명</span></p><p style=\"\"><span style=\"color:inherit\">으로 가장 적절하지 않은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 블록체인의 블록 내 헤더에는 해시 값과 거래별 </span></p><p style=\"\"><span style=\"color:inherit\">트랜잭션의 원본 값이 저장된다.</span></p><p style=\"\"><span style=\"color:inherit\">  ② 블록체인 기반 시스템은 거래기록이 구성원들에</span></p><p style=\"\"><span style=\"color:inherit\">게 공개되기 때문에 거래의 투명성을 보장한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 블록체인은 참여한 구성원이 네트워크를 통해 </span></p><p style=\"\"><span style=\"color:inherit\">서로 데이터를 검증함으로써 임의적인 조작이 </span></p><p style=\"\"><span style=\"color:inherit\">어렵도록 설계되었다.</span></p><p style=\"\"><span style=\"color:inherit\">  ④ 퍼블릭 블록체인(Public Blockchain)은 모든 구</span></p><p style=\"\"><span style=\"color:inherit\">성원들이 참여 가능하나, 비교적 네트워크 확</span></p><p style=\"\"><span style=\"color:inherit\">장이 어렵고 거래 속도가 느리다.</span></p><p style=\"\"><span style=\"color:inherit\">118. 다음 중 클라우드 보안 위협에 대한 설명으로 </span></p><p style=\"\"><span style=\"color:inherit\">가장 적절하지 않은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 고객 정보에 대해 제3자 위탁 저장방식을 활용</span></p><p style=\"\"><span style=\"color:inherit\">할 경우 클라우드 사업자 내부의 관리 부주의로 </span></p><p style=\"\"><span style=\"color:inherit\">인한 정보 유출의 위협이 있다.</span></p><p style=\"\"><span style=\"color:inherit\">  ② 여러 고객사의 정보가 클라우드에 집중됨에 따라 </span></p><p style=\"\"><span style=\"color:inherit\">DDoS, APT 공격 등 다양한 공격의 목표가 될 수 </span></p><p style=\"\"><span style=\"color:inherit\">있다.</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 논리적 자원을 물리적으로 통합 및 재분배하여 </span></p><p style=\"\"><span style=\"color:inherit\">사용함에 따라 가상화 문제가 발생된다.</span></p><p style=\"\"><span style=\"color:inherit\">  ④ 인프라 서비스(IaaS) 이용시 효과적인 자원의 분리</span></p><p style=\"\"><span style=\"color:inherit\">가 이뤄지지 않을 경우 클라우드 서버 내부의 가상</span></p><p style=\"\"><span style=\"color:inherit\">머신 간 도청 및 해킹 피해가 발생할 수 있다.</span></p><p style=\"\"><span style=\"color:inherit\">- 24 -</span></p><p style=\"\"><span style=\"color:inherit\">119. 다음 설명에 해당하는 것으로 가장 적절한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">- 내부 정보보호를 목적으로 하는 보안 솔루션으로 </span></p><p style=\"\"><span style=\"color:inherit\">중요 자료가 외부로 유출되는 것을 탐지하여 통</span></p><p style=\"\"><span style=\"color:inherit\">제하는 기술이다.</span></p><p style=\"\"><span style=\"color:inherit\">- 솔루션 종류에 따라 내용 기반 통제를 통해 중요 </span></p><p style=\"\"><span style=\"color:inherit\">정보를 식별하고 정보 유출을 통제할 수 있으며, </span></p><p sty     let currentCategory = '전체';

    function renderTopics() {
        const container = document.getElementById('accordion-container');
        container.innerHTML = '';
        
        let filtered = topicMapping;
        if (currentCategory !== '전체') {
            filtered = topicMapping.filter(item => item.category === currentCategory);
        }

        document.getElementById('topic-count-badge').textContent = filtered.length;

        filtered.forEach((item, idx) => {
            const accItem = document.createElement('div');
            accItem.className = 'accordion-item';
            accItem.id = `accordion-${idx}`;

            let yearButtonsHtml = '';
            item.questions.forEach(q => {
                yearButtonsHtml += `<button class="year-btn q-btn-${q.year}-${q.num}" onclick="openQuestion('${q.year}', '${q.num}', ${idx}, this)">
                    ${q.year}년 <span class="num-label">${q.num}번</span>
                </button>`;
            });

            accItem.innerHTML = `
                <button class="accordion-trigger" onclick="toggleAccordion(${idx})">
                    <div class="card-header-row">
                        <div class="card-title-group">
                            <span class="rank-badge">${item.concept.split('.')[0]}</span>
                            <span class="concept-title">${item.concept}</span>
                            <span class="category-tag">${item.category.split(' ')[1] || item.category}</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 0.8rem;">
                            <span class="freq-count-badge">매핑 문항 ${item.count}개</span>
                            <span class="arrow">▼</span>
                        </div>
                    </div>
                    <div class="card-meta-grid">
                        <div class="meta-label">공식 영역</div>
                        <div class="meta-value accent">${item.scope}</div>
                        <div class="meta-label">핵심 개념</div>
                        <div class="meta-value" style="font-weight: 500; color: #ffffff;">${item.core_concept}</div>
                        <div class="meta-label">출제 특징</div>
                        <div class="meta-value">${item.features}</div>
                        <div class="meta-label">출제 연도</div>
                        <div class="meta-value">${item.years.length > 0 ? item.years.join(', ') + '년' : '출제 이력 없음'}</div>
                    </div>
                </button>
                <div class="accordion-content" style="max-height: 0px;">
                    <div class="accordion-inner">
                        <div class="section-title">해당 범위 기출문제 선택 (클릭 시 하단에 문제 전환)</div>
                        <div class="year-grid">
                            ${yearButtonsHtml || '<span class="memo-placeholder">이 중단원에 직접 매핑된 기출문제가 캐시 DB에 존재하지 않습니다.</span>'}
                        </div>
                        
                        <div class="inline-question-viewer" id="viewer-${idx}" style="display: none;">
                            <div class="viewer-header">
                                <span class="viewer-title" id="viewer-title-${idx}"></span>
                                <button class="viewer-close-btn" onclick="closeInlineViewer(${idx}, event)">문제 숨기기</button>
                            </div>
                            <div class="viewer-body" id="viewer-body-${idx}"></div>
                            
                            <div class="viewer-img-container" id="viewer-img-container-${idx}" style="margin-top: 1rem; border-top: 1px dashed rgba(255,255,255,0.06); padding-top: 1rem;">
                                <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.6rem; font-weight: 700;">
                                    ▼ 시험지 원본 이미지 (다이어그램 및 수식 확인용)
                                </div>
                                <img src="" id="viewer-img-${idx}" class="question-img" style="max-width: 100%; height: auto; border-radius: 6px; border: 1px solid rgba(255,255,255,0.05); display: block;" onerror="hideImageContainer(${idx})">
                            </div>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(accItem);
        });
    }

    function hideImageContainer(idx) {
        const container = document.getElementById(`viewer-img-container-${idx}`);
        if (container) {
            container.style.display = 'none';
        }
    }

    function filterCategory(category) {
        currentCategory = category;
        document.querySelectorAll('.filter-btn').forEach(btn => {
            if (btn.textContent === category || (category === '전체' && btn.textContent === '전체')) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        if (document.getElementById('total-question-badge')) {
            const uniqueQuestions = new Set();
            const mappingsObj = topicMapping;
            mappingsObj.forEach(item => {
                if (item.questions) {
                    item.questions.forEach(q => {
                        uniqueQuestions.add(q.year + "_" + q.num);
                    });
                }
            });
            document.getElementById('total-question-badge').textContent = uniqueQuestions.size;
        }
        renderTopics();
    }

    function toggleAccordion(index) {
        const item = document.getElementById(`accordion-${index}`);
        const content = item.querySelector('.accordion-content');
        const isActive = item.classList.contains('active');

        document.querySelectorAll('.accordion-item').forEach((el, i) => {
            if (i !== index) {
                el.classList.remove('active');
                el.querySelector('.accordion-content').style.maxHeight = '0px';
            }
        });

        if (!isActive) {
            item.classList.add('active');
            
            let filtered = topicMapping;
            if (currentCategory !== '전체') {
                filtered = topicMapping.filter(item => item.category === currentCategory);
            }
            const dataObj = filtered[index];
            
            if (dataObj && dataObj.rep_question) {
                const viewer = document.getElementById(`viewer-${index}`);
                const titleEl = document.getElementById(`viewer-title-${index}`);
                const bodyEl = document.getElementById(`viewer-body-${index}`);
                const imgEl = document.getElementById(`viewer-img-${index}`);
                const imgContainer = document.getElementById(`viewer-img-container-${index}`);
                
                titleEl.textContent = `[대표 문제 예시] ${dataObj.rep_year}년 기출 ${dataObj.rep_num}번`;
                bodyEl.innerHTML = dataObj.rep_question;
                
                if (imgEl && imgContainer) {
                    imgContainer.style.display = 'block';
                    imgEl.src = `images/${dataObj.rep_year}_${dataObj.rep_num}.png`;
                }
                
                viewer.style.display = 'flex';
                
                item.querySelectorAll('.year-btn').forEach(btn => btn.classList.remove('active-btn'));
                setTimeout(() => {
                    const activeBtn = item.querySelector(`.q-btn-${dataObj.rep_year}-${dataObj.rep_num}`);
                    if (activeBtn) {
                        activeBtn.classList.add('active-btn');
                    }
                }, 50);
            }
            
            setTimeout(() => {
                content.style.maxHeight = content.scrollHeight + 'px';
            }, 150);
        } else {
            item.classList.remove('active');
            content.style.maxHeight = '0px';
        }
    }

    function openQuestion(year, num, idx, btnElement) {
        const key = `${year}_${num}`;
        const questionText = examDatabase[key] || "해당 기출문제를 데이터베이스에서 찾을 수 없습니다.";
        
        const item = document.getElementById(`accordion-${idx}`);
        const content = item.querySelector('.accordion-content');
        
        item.querySelectorAll('.year-btn').forEach(btn => btn.classList.remove('active-btn'));
        
        if (btnElement) {
            btnElement.classList.add('active-btn');
        }
        
        const viewer = document.getElementById(`viewer-${idx}`);
        const titleEl = document.getElementById(`viewer-title-${idx}`);
        const bodyEl = document.getElementById(`viewer-body-${idx}`);
        const imgEl = document.getElementById(`viewer-img-${idx}`);
        const imgContainer = document.getElementById(`viewer-img-container-${idx}`);
        
        titleEl.textContent = `${year}년도 감리사 기출 ${num}번`;
        bodyEl.innerHTML = questionText;
        
        if (imgEl && imgContainer) {
            imgContainer.style.display = 'block';
            imgEl.src = `images/${year}_${num}.png`;
        }
        
        viewer.style.display = 'flex';
        
        content.style.maxHeight = 'none';
        setTimeout(() => {
            const newHeight = content.scrollHeight;
            content.style.maxHeight = newHeight + 'px';
        }, 50);
    }

    function closeInlineViewer(idx, event) {
        if (event) event.stopPropagation();
        
        const item = document.getElementById(`accordion-${idx}`);
        const content = item.querySelector('.accordion-content');
        
        item.querySelectorAll('.year-btn').forEach(btn => btn.classList.remove('active-btn'));
        
        const viewer = document.getElementById(`viewer-${idx}`);
        viewer.style.display = 'none';
        
        content.style.maxHeight = 'none';
        setTimeout(() => {
            const newHeight = content.scrollHeight;
            content.style.maxHeight = newHeight + 'px';
        }, 50);
    }

    window.openTopicListModal = function() {
        const modal = document.getElementById('topic-modal');
        const listEl = document.getElementById('modal-topic-list');
        listEl.innerHTML = '';
        
        let filtered = topicMapping;
        if (currentCategory !== '전체') {
            filtered = topicMapping.filter(item => item.category === currentCategory);
        }
        
        filtered.forEach((item, idx) => {
            const li = document.createElement('li');
            li.className = 'modal-topic-item';
            li.style.cursor = 'pointer';
            li.onclick = () => {
                closeTopicModal();
                setTimeout(() => {
                    const itemEl = document.getElementById(`accordion-${idx}`);
                    if (itemEl && !itemEl.classList.contains('active')) {
                        toggleAccordion(idx);
                    }
                    if (itemEl) {
                        itemEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 200);
            };
            
            li.innerHTML = `
                <span class="modal-topic-name">${item.concept}</span>
                <span class="modal-topic-count">${item.count}개 문항 매핑</span>
            `;
            listEl.appendChild(li);
        });
        
        modal.style.display = 'flex';
        setTimeout(() => {
            modal.classList.add('show');
        }, 10);
    };

    window.closeTopicModal = function(event) {
        const modal = document.getElementById('topic-modal');
        modal.classList.remove('show');
        setTimeout(() => {
            modal.style.display = 'none';
        }, 250);
    };

    if (document.getElementById('total-question-badge')) {
        const uniqueQuestions = new Set();
        const mappingsObj = topicMapping;
        mappingsObj.forEach(item => {
            if (item.questions) {
                item.questions.forEach(q => {
                    uniqueQuestions.add(q.year + "_" + q.num);
                });
            }
        });
        document.getElementById('total-question-badge').textContent = uniqueQuestions.size;
    }
    renderTopics();
</script>

<div id="topic-modal" class="modal-overlay" onclick="closeTopicModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-card-header">
            <h2 class="modal-card-title">🔍 검출된 공식 중단원 목록</h2>
            <button class="modal-close-x" onclick="closeTopicModal()">✕</button>
        </div>
        <div class="modal-card-body">
            <ul id="modal-topic-list" class="modal-topic-list">
            </ul>
        </div>
    </div>
</div>
