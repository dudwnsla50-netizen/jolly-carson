<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소프트웨어공학 공식 범위별 기출 뷰어</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080b13;
            --card-bg: rgba(17, 24, 39, 0.75);
            --border-color: rgba(255, 255, 255, 0.06);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent-violet: #8b5cf6;
            --accent-blue: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%);
            --accent-glow: rgba(139, 92, 246, 0.12);
            --success: #10b981;
            --card-hover-border: rgba(139, 92, 246, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 2.5rem 1.5rem;
            min-height: 100vh;
            background-image: 
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.06) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.06) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.6rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.6rem;
            letter-spacing: -0.03em;
        }

        header p.subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
        }

        .meta-badges {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .badge {
            background: var(--border-color);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            padding: 0.35rem 0.9rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 500;
            backdrop-filter: blur(8px);
        }

        .badge.accent {
            background: rgba(139, 92, 246, 0.12);
            border-color: rgba(139, 92, 246, 0.25);
            color: #c084fc;
        }

        /* Category Filter Badges */
        .filter-section {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.45rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .filter-btn:hover, .filter-btn.active {
            border-color: var(--accent-violet);
            color: #ffffff;
            background: rgba(139, 92, 246, 0.08);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* Main Accordion List */
        .accordion-list {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-bottom: 4rem;
        }

        .accordion-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .accordion-item:hover {
            border-color: var(--card-hover-border);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .accordion-trigger {
            width: 100%;
            background: none;
            border: none;
            color: inherit;
            padding: 1.6rem 1.8rem;
            text-align: left;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .card-title-group {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .rank-badge {
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .concept-title {
            user-select: text !important;
            -webkit-user-select: text !important;
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        .category-tag {
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            padding: 0.15rem 0.45rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .freq-count-badge {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.15);
            color: var(--success);
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .card-meta-grid {
            display: grid;
            grid-template-columns: 90px 1fr;
            row-gap: 0.5rem;
            column-gap: 0.8rem;
            width: 100%;
            font-size: 0.88rem;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 0.8rem;
            margin-top: 0.2rem;
        }

        .meta-label {
            color: var(--text-muted);
            font-weight: 600;
        }

        .meta-value {
            color: var(--text-secondary);
            word-break: keep-all;
        }

        .meta-value.accent {
            color: #c8a2c8;
        }

        .accordion-trigger .arrow {
            transition: transform 0.3s ease;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .accordion-item.active .accordion-trigger .arrow {
            transform: rotate(180deg);
            color: var(--accent-violet);
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            background: rgba(0, 0, 0, 0.18);
        }

        .accordion-inner {
            padding: 1.6rem 1.8rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .section-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 0.3rem;
            margin-top: 0.2rem;
        }

        .year-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .year-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.35rem 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .year-btn:hover {
            background: var(--accent-gradient);
            border-color: transparent;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.25);
            transform: translateY(-1px);
        }

        .year-btn.active-btn {
            background: var(--accent-gradient);
            border-color: transparent;
            box-shadow: 0 4px 10px rgba(139, 92, 246, 0.3);
            color: #ffffff;
        }

        .year-btn .num-label {
            opacity: 0.7;
            font-size: 0.7rem;
        }

        .inline-question-viewer {
            background: #090d16;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            transition: all 0.3s ease;
        }

        .viewer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 0.5rem;
        }

        .viewer-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #60a5fa;
            font-family: 'Outfit', sans-serif;
        }

        .viewer-close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: color 0.2s;
        }

        .viewer-close-btn:hover {
            color: #ef4444;
        }

        .viewer-body {
            font-size: 0.92rem;
            line-height: 1.7;
            color: #d1d5db;
            white-space: pre-wrap;
            overflow-y: visible;
            max-height: none;
            padding-right: 0.5rem;
        }
        .viewer-body p, .viewer-body span {
            font-family: inherit !important;
            font-size: inherit !important;
            line-height: inherit !important;
            color: inherit !important;
            position: static !important;
            top: auto !important;
            left: auto !important;
        }
        .viewer-body img {
            max-width: 50% !important;
            height: auto !important;
            margin: 0.8rem auto !important;
            display: block !important;
        }

        /* 스크롤바 디자인 */
        .viewer-body::-webkit-scrollbar {
            width: 6px;
        }
        .viewer-body::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.01);
        }
        .viewer-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
        .viewer-body::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        a.badge {
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s ease;
        }
        a.badge:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            color: var(--text-primary) !important;
        }

        /* [검출 토픽 팝업 모달 스타일] */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 11, 19, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-card {
            background: rgba(17, 24, 39, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            max-height: 80%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(139, 92, 246, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform: scale(0.9);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-overlay.show .modal-card {
            transform: scale(1);
        }
        .modal-card-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-card-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
        }
        .modal-close-x {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.4rem;
            cursor: pointer;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close-x:hover {
            color: #ffffff;
        }
        .modal-card-body {
            padding: 1rem 1.5rem 1.5rem 1.5rem;
            overflow-y: auto;
        }
        .modal-topic-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .modal-topic-item {
            padding: 0.8rem 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            transition: all 0.2s ease;
            border-radius: 8px;
        }
        .modal-topic-item:hover {
            background: rgba(139, 92, 246, 0.08);
            transform: translateX(4px);
        }
        .modal-topic-name {
            font-size: 0.92rem;
            font-weight: 500;
            color: var(--text-primary);
        }
        .modal-topic-count {
            background: rgba(139, 92, 246, 0.15);
            color: #c084fc;
            border: 1px solid rgba(139, 92, 246, 0.2);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 50px;
            white-space: nowrap;
        }
        span.badge[onclick]:hover {
            background: rgba(255, 255, 255, 0.08) !important;
            border-color: rgba(255, 255, 255, 0.15) !important;
            color: var(--text-primary) !important;
        }

        /* 반응형 모바일 최적화 */
        @media (max-width: 768px) {
            body { padding: 1.5rem 0.8rem; }
            header h1 { font-size: 1.8rem; line-height: 1.3; }
            header p.subtitle { font-size: 0.88rem; padding: 0 0.5rem; word-break: keep-all; }
            .meta-badges { gap: 0.5rem; }
            .badge { padding: 0.25rem 0.6rem; font-size: 0.72rem; }
            .filter-section { gap: 0.4rem; margin-bottom: 1.5rem; }
            .filter-btn { padding: 0.35rem 0.7rem; font-size: 0.78rem; }
            .accordion-trigger { padding: 1.2rem 1rem; gap: 0.6rem; }
            .concept-title {
            user-select: text !important;
            -webkit-user-select: text !important; font-size: 1.05rem; }
            .rank-badge { font-size: 1rem; }
            .category-tag, .freq-count-badge { font-size: 0.7rem; padding: 0.1rem 0.35rem; }
            .card-meta-grid { grid-template-columns: 80px 1fr; font-size: 0.82rem; row-gap: 0.4rem; }
            .accordion-inner { padding: 1.2rem 1rem; gap: 1rem; }
            .section-title { font-size: 0.75rem; }
            .year-btn { padding: 0.3rem 0.6rem; font-size: 0.75rem; }
            .inline-question-viewer { padding: 0.9rem; }
            .viewer-body { font-size: 0.85rem; max-height: 300px; }
            .modal-card { width: 95%; max-height: 90%; }
            .modal-card-header { padding: 1rem; }
            .modal-card-title { font-size: 1.05rem; }
            .modal-card-body { padding: 0.8rem 1rem 1.2rem 1rem; }
            .modal-topic-item { padding: 0.6rem 0.8rem; }
            .modal-topic-name { font-size: 0.85rem; }
        }
    
        /* [설계 의도] 시안A: 모드 토글 스위치 및 최적화된 내비게이션 스타일 */
        .navigation-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
            margin-bottom: 2rem;
            width: 100%;
        }
        .mode-switch-wrapper {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(255, 255, 255, 0.02);
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
        }
        .mode-label {
            font-size: 0.88rem;
            font-weight: 600;
            transition: color 0.25s ease;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.08);
            transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px; width: 18px;
            left: 3px; bottom: 3px;
            background-color: #ffffff;
            transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        input:checked + .slider {
            background: var(--accent-gradient);
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.2);
        }
        input:checked + .slider:before {
            transform: translateX(22px);
        }
        .slider.round { border-radius: 34px; }
        .slider.round:before { border-radius: 50%; }
        
        .badge.accent {
            background: rgba(139, 92, 246, 0.12) !important;
            border-color: rgba(139, 92, 246, 0.25) !important;
            color: #ffffff !important;
        }

    
        /* [일괄 레이아웃 패치: 스크롤바 제거 및 이미지 50% 축소] */
        .viewer-body {
            max-height: none !important;
            overflow-y: visible !important;
        }
        .viewer-img-container img, .question-img {
            max-width: 50% !important;
            height: auto !important;
            display: block !important;
        }
        @media (max-width: 768px) {
            .viewer-body {
                max-height: none !important;
                overflow-y: visible !important;
            }
            .viewer-img-container img, .question-img {
                max-width: 50% !important;
                height: auto !important;
            }
        }

    </style>
    <script src="exam_db/se_db.js?v=20260613"></script>
</head>
<body>

<div class="container">
    <header>
        <h1>소프트웨어공학 공식 범위별 기출 대시보드</h1>
        <p class="subtitle">공식 시험 가이드라인(SE.txt) 5대 단원 및 33개 중단원 매핑 기출 뷰어</p>
        
        <div class="navigation-container">
            <div class="mode-switch-wrapper">
                <span class="mode-label" id="label-freq">🔥 빈출 개념순</span>
                <label class="switch">
                    <input type="checkbox" id="dashboard-mode-toggle" onchange="toggleDashboardMode(this)">
                    <span class="slider round"></span>
                </label>
                <span class="mode-label" id="label-official">📋 공식 범위순</span>
            </div>
            
            <div class="meta-badges" id="dynamic-nav-badges">
                <a href="#" class="badge home-badge" onclick="goToHome(event)" style="text-decoration: none; background: var(--accent-gradient); color: #ffffff; border: none; font-weight: 700;">🏠 퀴즈 홈으로</a>
                <a href="se_frequent_concepts.html" class="badge subject-badge" data-freq="se_frequent_concepts.html" data-official="se_official_scopes.html" style="text-decoration: none;">소프트웨어공학</a>
                <a href="pm_frequent_concepts.html" class="badge subject-badge" data-freq="pm_frequent_concepts.html" data-official="pm_official_scopes.html" style="text-decoration: none;">프로젝트 관리</a>
                <a href="db_frequent_concepts.html" class="badge subject-badge" data-freq="db_frequent_concepts.html" data-official="db_official_scopes.html" style="text-decoration: none;">데이터베이스</a>
                <a href="sa_frequent_concepts.html" class="badge subject-badge" data-freq="sa_frequent_concepts.html" data-official="sa_official_scopes.html" style="text-decoration: none;">시스템 아키텍처</a>
                <a href="sc_frequent_concepts.html" class="badge subject-badge" data-freq="sc_frequent_concepts.html" data-official="sc_official_scopes.html" style="text-decoration: none;">보안</a>
            </div>
        </div>
        
        <div class="meta-badges">
            <span class="badge">기출 범위: 2015년 ~ 2026년</span>
            <span class="badge accent">총 분석 데이터: <span id="total-question-badge">0</span> 문항</span>
            <span class="badge" onclick="openTopicListModal()" style="cursor: pointer; transition: all 0.2s;" title="클릭 시 중단원 목록 팝업 열기">
                매핑된 공식 중단원: <span id="topic-count-badge">0</span>개
            </span>
        </div>
    </header>

    <div id="accordion-container" class="accordion-list"></div>

<script>
    // [설계 의도] 로컬 오프라인 실행(file:///)과 웹 서버 호스팅(http://) 환경 양쪽 모두에서 퀴즈 대시보드 홈으로 매끄럽게 이동하도록 분기 처리합니다.
    function goToHome(event) {
        event.preventDefault();
        if (window.location.protocol === 'file:') {
            window.location.href = '../index.html';
        } else {
            window.location.href = '/';
        }
    }

    // [설계 의도] 학습 모드 변경에 따라 과목 뱃지의 링크 목적지를 실시간 동적 갱신하고 즉시 이동 처리합니다.
    function toggleDashboardMode(toggleEl) {
        const isOfficial = toggleEl.checked;
        
        // 라벨 색상 하이라이트 전환
        document.getElementById('label-freq').style.color = isOfficial ? 'var(--text-secondary)' : '#ffffff';
        document.getElementById('label-official').style.color = isOfficial ? '#ffffff' : 'var(--text-secondary)';
        
        // 과목별 이동 경로 실시간 매핑

\"\"><span style=\"color:inherit\">SNAME</span></p><p style=\"\"><span style=\"color:inherit\">AGE</span></p><p style=\"\"><span style=\"color:inherit\">S001</span></p><p style=\"\"><span style=\"color:inherit\">Kim</span></p><p style=\"\"><span style=\"color:inherit\">20</span></p><p style=\"\"><span style=\"color:inherit\">S002</span></p><p style=\"\"><span style=\"color:inherit\">Park</span></p><p style=\"\"><span style=\"color:inherit\">22</span></p><p style=\"\"><span style=\"color:inherit\">S003</span></p><p style=\"\"><span style=\"color:inherit\">Lee</span></p><p style=\"\"><span style=\"color:inherit\">21</span></p><p style=\"\"><span style=\"color:inherit\">S004</span></p><p style=\"\"><span style=\"color:inherit\">Hong</span></p><p style=\"\"><span style=\"color:inherit\">23</span></p><p style=\"\"><span style=\"color:inherit\">   ENROL</span></p><p style=\"\"><span style=\"color:inherit\">ENO</span></p><p style=\"\"><span style=\"color:inherit\">SNO</span></p><p style=\"\"><span style=\"color:inherit\">COURSE</span></p><p style=\"\"><span style=\"color:inherit\">E001</span></p><p style=\"\"><span style=\"color:inherit\">S001</span></p><p style=\"\"><span style=\"color:inherit\">자료구조</span></p><p style=\"\"><span style=\"color:inherit\">E002</span></p><p style=\"\"><span style=\"color:inherit\">S001</span></p><p style=\"\"><span style=\"color:inherit\">알고리즘</span></p><p style=\"\"><span style=\"color:inherit\">E003</span></p><p style=\"\"><span style=\"color:inherit\">S002</span></p><p style=\"\"><span style=\"color:inherit\">자료구조</span></p><p style=\"\"><span style=\"color:inherit\">E004</span></p><p style=\"\"><span style=\"color:inherit\">S003</span></p><p style=\"\"><span style=\"color:inherit\">알고리즘</span></p><p style=\"\"><span style=\"color:inherit\">E005</span></p><p style=\"\"><span style=\"color:inherit\">S003</span></p><p style=\"\"><span style=\"color:inherit\">프로그래밍</span></p><p style=\"\"><span style=\"color:inherit\">E006</span></p><p style=\"\"><span style=\"color:inherit\">S003</span></p><p style=\"\"><span style=\"color:inherit\">데이터베이스</span></p><p style=\"\"><span style=\"color:inherit\">  다음과 같은 실행 결과가 나오는 SQL 질의문으로 옳</span></p><p style=\"\"><span style=\"color:inherit\">은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">SNAME</span></p><p style=\"\"><span style=\"color:inherit\">COURSE</span></p><p style=\"\"><span style=\"color:inherit\">Kim</span></p><p style=\"\"><span style=\"color:inherit\">자료구조</span></p><p style=\"\"><span style=\"color:inherit\">Kim</span></p><p style=\"\"><span style=\"color:inherit\">알고리즘</span></p><p style=\"\"><span style=\"color:inherit\">Park</span></p><p style=\"\"><span style=\"color:inherit\">자료구조</span></p><p style=\"\"><span style=\"color:inherit\">Lee</span></p><p style=\"\"><span style=\"color:inherit\">알고리즘</span></p><p style=\"\"><span style=\"color:inherit\">Lee</span></p><p style=\"\"><span style=\"color:inherit\">프로그래밍</span></p><p style=\"\"><span style=\"color:inherit\">Lee</span></p><p style=\"\"><span style=\"color:inherit\">데이터베이스</span></p><p style=\"\"><span style=\"color:inherit\">Hong</span></p><p style=\"\"><span style=\"color:inherit\">NULL</span></p><p style=\"\"><span style=\"color:inherit\">  ① SELECT STUDENT.SNAME, ENROL.COURSE</span></p><p style=\"\"><span style=\"color:inherit\">     FROM ENROL INNER JOIN STUDENT </span></p><p style=\"\"><span style=\"color:inherit\">ON ENROL.SNO = STUDENT.SNO;</span></p><p style=\"\"><span style=\"color:inherit\">  ② SELECT STUDENT.SNAME, ENROL.COURSE</span></p><p style=\"\"><span style=\"color:inherit\">     FROM STUDENT LEFT OUTER JOIN ENROL </span></p><p style=\"\"><span style=\"color:inherit\">ON STUDENT.SNO = ENROL.SNO;</span></p><p style=\"\"><span style=\"color:inherit\">  ③ SELECT STUDENT.SNAME, ENROL.COURSE</span></p><p style=\"\"><span style=\"color:inherit\">     FROM ENROL LEFT OUTER JOIN STUDENT </span></p><p style=\"\"><span style=\"color:inherit\">ON ENROL.SNO = STUDENT.SNO;</span></p><p style=\"\"><span style=\"color:inherit\">  ④ SELECT STUDENT.SNAME, ENROL.COURSE</span></p><p style=\"\"><span style=\"color:inherit\">     FROM STUDENT RIGHT OUTER JOIN ENROL </span></p><p style=\"\"><span style=\"color:inherit\">ON STUDENT.SNO = ENROL.SNO;</span></p><p style=\"\"><span style=\"color:inherit\">65. 데이터베이스 보안 기법 중 필수 접근 제어</span></p><p style=\"\"><span style=\"color:inherit\">(mandatory access control) 기법에 대한 설명으</span></p><p style=\"\"><span style=\"color:inherit\">로 옳지 않은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 각 데이터 객체에 적정 비밀 등급을 부여하고 </span></p><p style=\"\"><span style=\"color:inherit\">각 사용자도 허가 등급을 지정하여 데이터 객</span></p><p style=\"\"><span style=\"color:inherit\">체가 적절한 허가 등급을 가진 사용자에 의해</span></p><p style=\"\"><span style=\"color:inherit\">서만 접근되도록 한다. </span></p><p style=\"\"><span style=\"color:inherit\">  ② 통상적인 보안 등급은 TS(극비), S(비밀), C(대</span></p><p style=\"\"><span style=\"color:inherit\">외비), U(일반)으로 나누는데 이들 간의 순서는 </span></p><p style=\"\"><span style=\"color:inherit\">TS > S > C > U 가 된다.</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 데이터 객체 j를 갱신하기 위해서는 사용자 i의 </span></p><p style=\"\"><span style=\"color:inherit\">허가 등급이 데이터 객체 j의 비밀 등급보다 같</span></p><p style=\"\"><span style=\"color:inherit\">거나 높아야 한다. </span></p><p style=\"\"><span style=\"color:inherit\">  ④ 이 필수 접근 제어 기법을 다단계 보안 기법</span></p><p style=\"\"><span style=\"color:inherit\">(multilevel security scheme)이라고도 한다. </span></p><p style=\"\"><span style=\"color:inherit\">66. 다음은 데이터베이스 회복(recovery) 기법의 지</span></p><p style=\"\"><span style=\"color:inherit\">연 </span></p><p style=\"\"><span style=\"color:inherit\">갱신(deferred </span></p><p style=\"\"><span style=\"color:inherit\">update)과 </span></p><p style=\"\"><span style=\"color:inherit\">즉시 </span></p><p style=\"\"><span style=\"color:inherit\">갱신</span></p><p style=\"\"><span style=\"color:inherit\">(immediate update)에 대한 설명이다. 다음 설명 </span></p><p style=\"\"><span style=\"color:inherit\">중에서 옳은 것을 모두 고른 것은? </span></p><p style=\"\"><span style=\"color:inherit\">가. 지연 갱신에서는 완료(commit) 이전에 실패한 </span></p><p style=\"\"><span style=\"color:inherit\">트랜잭션의 경우 UNDO가 필요하지 않다.</span></p><p style=\"\"><span style=\"color:inherit\">나. 즉시 갱신은 완료 이후 UNDO와 REDO가 필요하</span></p><p style=\"\"><span style=\"color:inherit\">지 않기 때문에 NO-UNDO/NO-REDO 알고리즘으</span></p><p style=\"\"><span style=\"color:inherit\">로 알려져 있다.</span></p><p style=\"\"><span style=\"color:inherit\">다. 즉시 갱신에서는 완료 이전에 실패한 트랜잭</span></p><p style=\"\"><span style=\"color:inherit\">션의 경우 UNDO를 수행해야 한다.</span></p><p style=\"\"><span style=\"color:inherit\">라. 지연 갱신에서는 완료된 트랜잭션에 대해서도 </span></p><p style=\"\"><span style=\"color:inherit\">로그를 사용하여 REDO를 수행해야 할 수 있다.</span></p><p style=\"\"><span style=\"color:inherit\">  ① 다, 라</span></p><p style=\"\"><span style=\"color:inherit\">② 나, 라</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 나, 다, 라</span></p><p style=\"\"><span style=\"color:inherit\">④ 가, 다, 라</span></p><p style=\"\"><span style=\"color:inherit\">67. 다음의 구매 데이터로부터 연관규칙 Apriori 알고</span></p><p style=\"\"><span style=\"color:inherit\">리즘을 통해 도출할 수 있는 연관규칙 중에서 신</span></p><p style=\"\"><span style=\"color:inherit\">뢰도(confidence)값이 가장 큰 것은?</span></p><p style=\"\"><span style=\"color:inherit\">고객ID</span></p><p style=\"\"><span style=\"color:inherit\">구매항목</span></p><p style=\"\"><span style=\"color:inherit\">1</span></p><p style=\"\"><span style=\"color:inherit\">{A, B, C}</span></p><p style=\"\"><span style=\"color:inherit\">2</span></p><p style=\"\"><span style=\"color:inherit\">{D, A, E}</span></p><p style=\"\"><span style=\"color:inherit\">3</span></p><p style=\"\"><span style=\"color:inherit\">{A, B, F, G}</span></p><p style=\"\"><span style=\"color:inherit\">4</span></p><p style=\"\"><span style=\"color:inherit\">{F, B, E}</span></p><p style=\"\"><span style=\"color:inherit\">5</span></p><p style=\"\"><span style=\"color:inherit\">{A, C, E}</span></p><p style=\"\"><sp </p><p style=\"\"><span style=\"color:inherit\">를 중심으로 데이터를 구성한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ② 통합된(integrated) 내용 : 데이터 웨어하우스는 여</span></p><p style=\"\"><span style=\"color:inherit\">러 데이터베이스에서 필요한 데이터를 추출하여 의</span></p><p style=\"\"><span style=\"color:inherit\">사 결정에 필요한 분석 및 비교 작업을 지원한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 시간에 따라 변화하지 않는(time-invariant) 내용 : </span></p><p style=\"\"><span style=\"color:inherit\">일반 데이터베이스는 현재와 과거 데이터를 함께 </span></p><p style=\"\"><span style=\"color:inherit\">유지하지만 데이터 웨어하우스는 현재 시점의 데</span></p><p style=\"\"><span style=\"color:inherit\">이터만을 유지한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ④ 비소멸성(nonvolatile) 내용 : 일반 데이터베이스</span></p><p style=\"\"><span style=\"color:inherit\">에 저장된 데이터는 삽입, 삭제, 갱신 연산이 자</span></p><p style=\"\"><span style=\"color:inherit\">주 발생하지만 데이터 웨어하우스는 검색 작업만 </span></p><p style=\"\"><span style=\"color:inherit\">수행되는 읽기 전용의 데이터를 유지한다.</span></p><p style=\"\"><span style=\"color:inherit\">70. 의사결정트리(decision tree) 구축 과정에서 어떤 </span></p><p style=\"\"><span style=\"color:inherit\">노드 N에 클래스 0인 레코드가 1개, 클래스 1인 </span></p><p style=\"\"><span style=\"color:inherit\">레코드가 5개 해당한다고 하자. 이 노드에 대한 </span></p><p style=\"\"><span style=\"color:inherit\">불순도(impurity)를 표현하는 Gini 값으로 가장 </span></p><p style=\"\"><span style=\"color:inherit\">적절한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 0.0 </span></p><p style=\"\"><span style=\"color:inherit\">② 0.278</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 0.5</span></p><p style=\"\"><span style=\"color:inherit\">④ 0.650</span></p><p style=\"\"><span style=\"color:inherit\">71. 다음은 정보 검색, 텍스트 마이닝에서 문서 집합</span></p><p style=\"\"><span style=\"color:inherit\">과 용어에 대한 TFIDF의 개념을 설명한다. 만일, </span></p><p style=\"\"><span style=\"color:inherit\">문서 집합 D에 다음과 같이 d1, d2의 두 문서만 </span></p><p style=\"\"><span style=\"color:inherit\">존재한다고 할 때, 용어 “this”에 대한 TFIDF </span></p><p style=\"\"><span style=\"color:inherit\">값이 옳은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">- TF는 term frequency의 약어로, 해당 용어가 주어</span></p><p style=\"\"><span style=\"color:inherit\">진 문서에 얼마나 많이 나타나는지를 나타낸다. </span></p><p style=\"\"><span style=\"color:inherit\">- IDF는 inverse document frequency의 약어로, </span></p><p style=\"\"><span style=\"color:inherit\">해당 용어가 문서 집합에 얼마나 많이 나타나는</span></p><p style=\"\"><span style=\"color:inherit\">지에 대한 역수를 나타낸다. </span></p><p style=\"\"><span style=\"color:inherit\">- TFIDF는 문서 집합에서 특정 단어가 주어진 문</span></p><p style=\"\"><span style=\"color:inherit\">서 내에서 얼마나 중요한 것인지를 나타내는 통</span></p><p style=\"\"><span style=\"color:inherit\">계적 수치이다.</span></p><p style=\"\"><span style=\"color:inherit\">문서 d1</span></p><p style=\"\"><span style=\"color:inherit\">문서 d2</span></p><p style=\"\"><span style=\"color:inherit\">용어</span></p><p style=\"\"><span style=\"color:inherit\">출현 횟수</span></p><p style=\"\"><span style=\"color:inherit\">용어</span></p><p style=\"\"><span style=\"color:inherit\">출현 횟수</span></p><p style=\"\"><span style=\"color:inherit\">this</span></p><p style=\"\"><span style=\"color:inherit\">1</span></p><p style=\"\"><span style=\"color:inherit\">this</span></p><p style=\"\"><span style=\"color:inherit\">2</span></p><p style=\"\"><span style=\"color:inherit\">is</span></p><p style=\"\"><span style=\"color:inherit\">1</span></p><p style=\"\"><span style=\"color:inherit\">is</span></p><p style=\"\"><span style=\"color:inherit\">1</span></p><p style=\"\"><span style=\"color:inherit\">a</span></p><p style=\"\"><span style=\"color:inherit\">2</span></p><p style=\"\"><span style=\"color:inherit\">another</span></p><p style=\"\"><span style=\"color:inherit\">1</span></p><p style=\"\"><span style=\"color:inherit\">sample</span></p><p style=\"\"><span style=\"color:inherit\">1</span></p><p style=\"\"><span style=\"color:inherit\">example</span></p><p style=\"\"><span style=\"color:inherit\">1</span></p><p style=\"\"><span style=\"color:inherit\">  ① TFIDF(“this”, d1, D) = 0, </span></p><p style=\"\"><span style=\"color:inherit\">TFIDF(“this”, d2, D) = 0</span></p><p style=\"\"><span style=\"color:inherit\">  ② TFIDF(“this”, d1, D) = 0.1, </span></p><p style=\"\"><span style=\"color:inherit\">TFIDF(“this”, d2, D) = 0.2</span></p><p style=\"\"><span style=\"color:inherit\">  ③ TFIDF(“this”, d1, D) = 0.3, </span></p><p style=\"\"><span style=\"color:inherit\">TFIDF(“this”, d2, D) = 0.3</span></p><p style=\"\"><span style=\"color:inherit\">  ④ TFIDF(“this”, d1, D) = 0.2, </span></p><p style=\"\"><span style=\"color:inherit\">TFIDF(“this”, d2, D) = 0.4</span></p><p style=\"\"><span style=\"color:inherit\">72. 다음 설명 중에서 NoSQL의 특징이나 장점과 가장 거</span></p><p style=\"\"><span style=\"color:inherit\">리가 먼 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① NoSQL 시스템은 노드 추가를 통해 저장 공간과 처리 </span></p><p style=\"\"><span style=\"color:inherit\">능력을 증가시킬 수 있어 높은 확장성을 제공한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ② NoSQL 시스템은 데이터를 여러 노드에 복제하여 </span></p><p style=\"\"><span style=\"color:inherit\">저장함으로써 고장 허용(fault tolerance) 기능을 </span></p><p style=\"\"><span style=\"color:inherit\">제공한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ③NoSQL </span></p><p style=\"\"><span style=\"color:inherit\">시스템은 </span></p><p style=\"\"><span style=\"color:inherit\">파일 레코드에 </span></p><p style=\"\"><span style=\"color:inherit\">대한 </span></p><p style=\"\"><span style=\"color:inherit\">샤딩</span></p><p style=\"\"><span style=\"color:inherit\">(sharding)을 사용하여 부하분산을 이룬다.</span></p><p style=\"\"><span style=\"color:inherit\">  ④ NoSQL 시스템은 데이터를 여러 노드에 복제 저장</span></p><p style=\"\"><span style=\"color:inherit\">함으로써 읽기(조회)와 쓰기(갱신) 성능을 개선한</span></p><p style=\"\"><span style=\"color:inherit\">다.</span></p><p style=\"\"><span style=\"color:inherit\">- 17 -</span></p><p style=\"\"><span style=\"color:inherit\">73. 다음 표의 거래 정보에 대해서 최소지지도</span></p><p style=\"\"><span style=\"color:inherit\">(minsup)를 0.5로 하여 Apriori 알고리즘을 적</span></p><p style=\"\"><span style=\"color:inherit\">용하고자 할 때, 빈발 2-항목집합(frequent </span></p><p style=\"\"><span style=\"color:inherit\">2-itemset) 모두를 옳게 나열한 것은? </span></p><p style=\"\"><span style=\"color:inherit\">거래ID</span></p><p style=\"\"><span style=\"color:inherit\">거래항목</span></p><p style=\"\"><span style=\"color:inherit\">거래ID</span></p><p style=\"\"><span style=\"color:inherit\">거래항목</span></p><p style=\"\"><span style=\"color:inherit\">1</span></p><p style=\"\"><span style=\"color:inherit\">{A, B, E, F}</span></p><p style=\"\"><span style=\"color:inherit\">6</span></p><p style=\"\"><span style=\"color:inherit\">{A, B, E, F}</span></p><p style=\"\"><span style=\"color:inherit\">2</span></p><p style=\"\"><span style=\"color:inherit\">{A, D, F}</span></p><p style=\"\"><span style=\"color:inherit\">7</span></p><p style=\"\"><span style=\"color:inherit\">{B, C, D, F}</span></p><p style=\"\"><span style=\"color:inherit\">3</span></p><p style=\"\"><span style=\"color:inherit\">{A, C, G}</span></p><p style=\"\"><span style=\"color:inherit\">8</span></p><p style=\"\"><span style=\"color:inherit\">{A, B, C, E}</span></p><p style=\"\"><span style=\"color:inherit\">4</span></p><p style=\"\"><span style=\"color:inherit\">{C, D, E, G}</span></p><p style=\"\"><span style=\"color:inherit\">9</span></p><p style=\"\"><span style=\"color:inherit\">{A, B, E}</span></p><p style=\"\"><span style=\"color:inherit\">5</span></p><p style=\"\"><span style=\"color:inherit\">{A, B, D, E}</span></p><p style=\"\"><span style=\"color:inherit\">10</span></p><p style=\"\"><span style=\"color:inherit\">{E, F}</span></p><p style=\"\"><span style=\"color:inherit\">  ① {A,B}, {A,E}, {B,E} </span></p><p style=\"\"><span style=\"color:inherit\">  ② {A,F}, {B,F}, {E,F} </span></p><p style=\"\"><span style=\"color:inherit\">  ③ {A,F}, {A,B}, {A,E}, {B,F}, {E,F}, {B,E}</span></p><p style=\"\"><span style=\"color:inherit\">  ④ {A,B}, {A,C}, {A,D}, {E,F}, {E,G}, {F,G}</span></p><p style=\"\"><span style=\"color:inherit\">74. 다음은 스팸(Spam) 메일을 인식하기 위해 구축한 </span></p><p style=\"\"><span style=\"color:inherit\">예측모델로부터 </span></p><p style=\"\"><span style=\"color:inherit\">얻어진 </span></p><p style=\"\"><span style=\"color:inherit\">혼돈행렬(confusion </span></p><p style=\"\"><span style=\"color:inherit\">matrix)이다. 이 혼돈행렬로부터 구할 수 있는 </span></p><p style=\"\"><span style=\"color:inherit\">성능척도 값이 옳지 않은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">예측 클래스</span></p><p style=\"\"><span style=\"color:inherit\">Spam</span></p><p style=\"\"><span style=\"color:inherit\">Non-Spam</span></p><p style=\"\"><span style=\"color:inherit\">정답 클래스</span></p><p style=\"\"><span style=\"color:inherit\">Spam</span></p><p style=\"\"><span style=\"color:inherit\">TP = 45</span></p><p style=\"\"><span style=\"color:inherit\">FN = 20</span></p><p style=\"\"><span style=\"color:inherit\">Non-Spam</span></p><p style=\"\"><span style=\"color:inherit\">FP = 5</span></p><p style=\"\"><span style=\"color:inherit\">TN = 30</span></p><p style=\"\"><span style=\"color:inherit\">  ① 정밀도(precision) = </span><span style=\"color:inherit\"></span></p><p style=\"\"><span style=\"color:inherit\"></span></p><p style=\"\"><span style=\"color:inherit\"></span></p><p style=\"\"><span style=\"color:inherit\">  ② 재현율(recall) = </span><span style=\"color:inherit\"></span></p><p style=\"\"><span style=\"color:inherit\"></span></p><p style=\"\"><span style=\"color:inherit\"></span></p><p style=\"\"><span style=\"color:inherit\">  ③ 특이도(specificity) = </span><span style=\"color:inherit\"></span></p><p style=\"\"><span style=\"color:inherit\"></span></p><p style=\"\"><span style=\"color:inherit\"></span><span style=\"color:inherit\"> </span></p><p style=\"\"><span style=\"color:inherit\">  ④ 정확도(accuracy) = </span><span style=\"color:inherit\"></span></p><p style=\"\"><span style=\"color:inherit\"></span></p><p style=\"\"><span style=\"color:inherit\"></span></p><p style=\"\"><span style=\"color:inherit\">75. 다음은 분산 데이터베이스에서의 투명성(transparency)</span></p><p style=\"\"><span style=\"color:inherit\">에 대한 설명이다. 다음 투명성에 대한 설명 중</span></p><p style=\"\"><span style=\"color:inherit\">에서 가장 적절하지 않은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 이름부여 투명성(naming transparency)은 분산 </span></p><p style=\"\"><span style=\"color:inherit\">데이터베이스가 어떻게 설계되는지와 어느 사</span></p><p style=\"\"><span style=\"color:inherit\">이트에서 트랜잭션이 실행되는지를 사용자에게 </span></p><p style=\"\"><span style=\"color:inherit\">가려주는 것을 의미한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ② 분산 투명성(distribution transparency) 또는 </span></p><p style=\"\"><span style=\"color:inherit\">네트워크 투명성(network transparency)은 사</span></p><p style=\"\"><span style=\"color:inherit\">용자에게 네트워크의 세부 사항과 분산 시스템 </span></p><p style=\"\"><span style=\"color:inherit\">내에서 데이터 저장 장소의 위치를 가려주는 </span></p><p style=\"\"><span style=\"color:inherit\">것을 의미한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 위치 투명성(location transparency)은 어떤 작</span></p><p style=\"\"><span style=\"color:inherit\">업을 수행하기 위해 사용된 명령은 데이터의 위</span></p><p style=\"\"><span style=\"color:inherit\">치와 명령이 입력된 시스템의 위치와 무관해야 </span></p><p style=\"\"><span style=\"color:inherit\">함을 의미한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ④ 중복 투명성(replication transparency)은 높은 </span></p><p style=\"\"><span style=\"color:inherit\">가용성, 성능, 신뢰도를 위해 데이터 사본들이 </span></p><p style=\"\"><span style=\"color:inherit\">여러 사이트에 중복될 수 있음을 의미하며, 중</span></p><p style=\"\"><span style=\"color:inherit\">복된 사본의 존재를 사용자에게 가려준다.</span></p><p style=\"\"><span style=\"color:inherit\">- 18 -</span></p><p style=\"\"><span style=\"color:inherit\">시스템 구조</span></p><p style=\"\"><span style=\"color:inherit\"> </span></p><p style=\"\"><span style=\"color:inherit\">76. 네트워크 장비를 그 기능에 따라 OSI 7 계층과 올</span></p><p style=\"\"><span style=\"color:inherit\">바르게 매핑한 것을 모두 고른 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 가, 나</span></p><p style=\"\"><span style=\"color:inherit\">② 가, 다</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 나, 다</span></p><p style=\"\"><span style=\"color:inherit\">④ 가, 나, 다</span></p><p style=\"\"><span style=\"color:inherit\">77. 성형(star) 토폴로지에 대한 설명으로 적절한 것</span></p><p style=\"\"><span style=\"color:inherit\">을 모두 고른 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 가, 나</span></p><p style=\"\"><span style=\"color:inherit\">② 가, 다</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 나, 다</span></p><p style=\"\"><span style=\"color:inherit\">④ 가, 나, 다</span></p><p style=\"\"><span style=\"color:inherit\">78. 다음 프로토콜 중에서 링크 계층의 주소를 네트</span></p><p style=\"\"><span style=\"color:inherit\">워크 계층의 주소로 변환하는 기능을 제공하는 </span></p><p style=\"\"><span style=\"color:inherit\">프로토콜로 가장 적절한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① ARP(Address Resolution Protocol)</span></p><p style=\"\"><span style=\"color:inherit\">  ② RARP(Reverse Address Resolution Protocol)</span></p><p style=\"\"><span style=\"color:inherit\">  ③ ICMP(Internet Control Message Protocol)</span></p><p style=\"\"><span style=\"color:inherit\">  ④ NAT(Network Address Translation)</span></p><p style=\"\"><span style=\"color:inherit\">79. 짝수 패리티 기법을 적용하여, 패리티 비트 포함  </span></p><p style=\"\"><span style=\"color:inherit\">8비트로 이루어진 아스키코드 대문자 B를 인코딩</span></p><p style=\"\"><span style=\"color:inherit\">할 때 올바른 메모리 비트 값으로 가장 적절한 </span></p><p style=\"\"><span style=\"color:inherit\">것은? (단, 패리티 비트는 MSB에 위치하며, 대문</span></p><p style=\"\"><span style=\"color:inherit\">자 A의 아스키코드 값은 10진수 65임)</span></p><p style=\"\"><span style=\"color:inherit\">  ① 0100 0010</span></p><p style=\"\"><span style=\"color:inherit\">② 0100 1010 </span></p><p style=\"\"><span style=\"color:inherit\">  ③ 1100 0010</span></p><p style=\"\"><span style=\"color:inherit\">④ 1100 1010</span></p><p style=\"\"><span style=\"color:inherit\">80. 컴퓨터는 2의 보수 (2`s complement) 체계를 사</span></p><p style=\"\"><span style=\"color:inherit\">용해 정수를 표현한다. 10진수 –5에 대한 4비트</span></p><p style=\"\"><span style=\"color:inherit\">를 사용한 2의 보수로 가장 적절한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 1110</span></p><p style=\"\"><span style=\"color:inherit\">② 1101</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 1011</span></p><p style=\"\"><span style=\"color:inherit\">④ 1010</span></p><p style=\"\"><span style=\"color:inherit\">81. 다음 중 선점(preemptive) CPU 스케줄링 정책에 </span></p><p style=\"\"><span style=\"color:inherit\">대한 설명으로 적절한 것을 모두 고른 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 가</span></p><p style=\"\"><span style=\"color:inherit\">② 가, 나</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 가, 다</span></p><p style=\"\"><span style=\"color:inherit\">④ 나, 다</span></p><p style=\"\"><span style=\"color:inherit\">82. 다음 중 경로설정(routing)에 대한 설명으로 가</span></p><p style=\"\"><span style=\"color:inherit\">장 적절하지 않은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 경로설정 테이블(routing table)은 정적 혹은 </span></p><p style=\"\"><span style=\"color:inherit\">동적으로 구성될 수 있다.</span></p><p style=\"\"><span style=\"color:inherit\">  ② 유니캐스트 경로설정 프로토콜과 멀티캐스트 경로</span></p><p style=\"\"><span style=\"color:inherit\">설정 프로토콜이 존재한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 자율 시스템(Autonomous System)내에서 사용되는 </span></p><p style=\"\"><span style=\"color:inherit\">IGP와 자율 시스템 간에 사용하는 EGP로 구분된</span></p><p style=\"\"><span style=\"color:inherit\">다.</span></p><p style=\"\"><span style=\"color:inherit\">  ④ Bellman-Ford 알고리즘을 사용하는 링크 상태 </span></p><p style=\"\"><span style=\"color:inherit\">라우팅과 Dijkstra 알고리즘을 사용하는 거리 </span></p><p style=\"\"><span style=\"color:inherit\">벡터 라우팅으로 구분된다.</span></p><p style=\"\"><span style=\"color:inherit\">83. TCP(Transmission Control Protocol) 헤더에 있</span></p><p style=\"\"><span style=\"color:inherit\">는 체크섬 계산에는 IP 헤더로부터 일부 필드 </span></p><p style=\"\"><span style=\"color:inherit\">정보를 가져와서 사용하며 이를 가상 헤더라</span></p><p style=\"\"><span style=\"color:inherit\">(Pseudoheader) 한다. 다음 중 가상 헤더 필드</span></p><p style=\"\"><span style=\"color:inherit\">로 가장 적절하지 않은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 프로토콜</span></p><p style=\"\"><span style=\"color:inherit\">② 수신자 IP 주소</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 송신자 IP 주소</span></p><p style=\"\"><span style=\"color:inherit\">④ 생존시간(TTL)</span></p><p style=\"\"><span style=\"color:inherit\">가. 라우터 – 네트워크 계층</span></p><p style=\"\"><span style=\"color:inherit\">나. 브리지 – 데이터링크 계층</span></p><p style=\"\"><span style=\"color:inherit\">다. 허브 – 물리 계층</span></p><p style=\"\"><span style=\"color:inherit\">가. 5개의 노드를 연결할 때 필요한 링크의 개수</span></p><p style=\"\"><span style=\"color:inherit\">는 4개이다.</span></p><p style=\"\"><span style=\"color:inherit\">나. 연결하는 노드의 개수가 동일할 때, 버스형</span></p><p style=\"\"><span style=\"color:inherit\">(bus) 토폴로지에 비해 네트워크 구축 비용이 </span></p><p style=\"\"><span style=\"color:inherit\">상대적으로 높다.</span></p><p style=\"\"><span style=\"color:inherit\">다. 임의의 한 노드에 장애가 발생해도 전체 네트</span></p><p style=\"\"><span style=\"color:inherit\">워크는 다운되지 않는다.</span></p><p style=\"\"><span style=\"color:inherit\">가. 라운드로빈 스케줄링 정책은 선점 스케줄링 </span></p><p style=\"\"><span style=\"color:inherit\">정책에 속한다.</span></p><p style=\"\"><span style=\"color:inherit\">나. 선점 스케줄링 정책을 사용하면 비선점 스케</span></p><p style=\"\"><span style=\"color:inherit\">줄링 정책을 사용할 때보다 문맥 교환이 덜 </span></p><p style=\"\"><span style=\"color:inherit\">빈번하다.</span></p><p style=\"\"><span style=\"color:inherit\">다. 선점 스케줄링 정책에서는 현재 실행 중인 프</span></p><p style=\"\"><span style=\"color:inherit\">로세스가 종료될 때와 블록(대기) 상태로 전</span></p><p style=\"\"><span style=\"color:inherit\">환될 때만 CPU 스케줄링이 실행된다.</span></p><p style=\"\"><span style=\"color:inherit\">- 19 -</span></p><p style=\"\"><span style=\"color:inherit\">84. 명령어 파이프라인은 해저드(Hazard)라는 중대한 </span></p><p style=\"\"><span style=\"color:inherit\">문제를 발생시킨다. 다음 중 일반적인 파이프라인 </span></p><p style=\"\"><span style=\"color:inherit\">해저드의 종류로 가장 적절하지 않은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① Structural Hazard</span></p><p style=\"\"><span style=\"color:inherit\">② Register Hazard</span></p><p style=\"\"><span style=\"color:inherit\">  ③ Data Hazard</span></p><p style=\"\"><span style=\"color:inherit\">④ Control Hazard</span></p><p style=\"\"><span style=\"color:inherit\">85. 하둡 Ver 3.0에서 새로 추가된 기술로 가장 적절</span></p><p style=\"\"><span style=\"color:inherit\">한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ①  Erasure Coding </span></p><p style=\"\"><span style=\"color:inherit\">  ②  Resource Manager</span></p><p style=\"\"><span style=\"color:inherit\">  ③  Secondary Namenode </span></p><p style=\"\"><span style=\"color:inherit\">  ④  YARN(Yet Another Resource Negotiator)</span></p><p style=\"\"><span style=\"color:inherit\">86. 두 네트워크 간의 상호 경쟁을 통해 네트워크의 </span></p><p style=\"\"><span style=\"color:inherit\">성능을 향상시키는 개념을 포함하고 있는 딥러닝 </span></p><p style=\"\"><span style=\"color:inherit\">방식으로 가장 적절한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① CNN(Convolutional Neural Network)</span></p><p style=\"\"><span style=\"color:inherit\">  ② GAN(Generative Adversarial Network)</span></p><p style=\"\"><span style=\"color:inherit\">  ③ RNN(Recurrent Neural Network)</span></p><p style=\"\"><span style=\"color:inherit\">  ④ SVM(Support Vector Machine)</span></p><p style=\"\"><span style=\"color:inherit\">87. 분산 패리티 기법을 사용하는 RAID 5 구축에 요구</span></p><p style=\"\"><span style=\"color:inherit\">되는 최소 디스크의 수로 가장 적절한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 2개</span></p><p style=\"\"><span style=\"color:inherit\">② 3개</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 4개</span></p><p style=\"\"><span style=\"color:inherit\">④ 5개</span></p><p style=\"\"><span style=\"color:inherit\">88. SDN(Software Defined Network) 기술 중 자신이 </span></p><p style=\"\"><span style=\"color:inherit\">속한 도메인에 있는 모든 네트워크 기기들과 대</span></p><p style=\"\"><span style=\"color:inherit\">화하고 관련 네트워크를 프로그래밍할 수 있는 </span></p><p style=\"\"><span style=\"color:inherit\">기술로 가장 적절한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 스위칭 기술</span></p><p style=\"\"><span style=\"color:inherit\">② 오버레이 기술</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 라우팅 기술</span></p><p style=\"\"><span style=\"color:inherit\">④ 컨트롤러 기술</span></p><p style=\"\"><span style=\"color:inherit\">89. LAN 스위칭 기술을 구분할 때, Cut-Through 스위</span></p><p style=\"\"><span style=\"color:inherit\">치, Interim Cut-Through 스위치, Store-and </span></p><p style=\"\"><span style=\"color:inherit\">-Forward 스위치로 나눌 수 있다. 이를 구분하는 </span></p><p style=\"\"><span style=\"color:inherit\">기준으로 가장 적절한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 포트 인터페이스</span></p><p style=\"\"><span style=\"color:inherit\">② 학습 로직</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 입출력 포트</span></p><p style=\"\"><span style=\"color:inherit\">④ 전송 로직</span></p><p style=\"\"><span style=\"color:inherit\">90. IPv4에서 단편화(fragmentation)가 발생된 패킷</span></p><p style=\"\"><span style=\"color:inherit\">은 헤더의 내용이 수정되어야 한다. 다음 IPv4</span></p><p style=\"\"><span style=\"color:inherit\">의 헤더 정보 중에서 변경되지 않는 헤더의 정</span></p><p style=\"\"><span style=\"color:inherit\">보로 가장 적절한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 전체 길이 정보</span></p><p style=\"\"><span style=\"color:inherit\">  ② 체크섬(checksum) 정보</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 식별자(identification) 정보</span></p><p style=\"\"><span style=\"color:inherit\">  ④ 단편화 오프셋(fragmentation offset) 정보</span></p><p style=\"\"><span style=\"color:inherit\">91. 다음 멀티캐스트 라우팅 프로토콜 중에서 그룹 </span></p><p style=\"\"><span style=\"color:inherit\">공유 트리(group-shared tree) 방식을 사용하는 </span></p><p style=\"\"><span style=\"color:inherit\">프로토콜로 가장 적절한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① MOSPF </span></p><p style=\"\"><span style=\"color:inherit\">② DVMRP </span></p><p style=\"\"><span style=\"color:inherit\">  ③ CBT</span></p><p style=\"\"><span style=\"color:inherit\">④ PIM-DM</span></p><p style=\"\"><span style=\"color:inherit\">92. 다음 그림은 SCTP(Stream Control Transmission </span></p><p style=\"\"><span style=\"color:inherit\">Protocol)의 연결설정 과정을 보여주고 있다. 괄호</span></p><p style=\"\"><span style=\"color:inherit\">에 들어가야 하는 메시지로 가장 적절한 것은?</span></p><img style=\"max-width: 100%; height: auto; display: block; margin: 0.5rem 0; border-radius: 4px; border: 1px solid rgba(255,255,255,0.06);\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABALDA4MChAODQ4SERATGCgaGBYWGDEjJR0oOjM9PDkzODdASFxOQERXRTc4UG1RV19iZ2hnPk1xeXBkeFxlZ2P/2wBDARESEhgVGC8aGi9jQjhCY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2P/wAARCABdAHoDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwDrNd1CXT7aOSILlmxlhntnpUS6jcGeJCg+ZY8jbyS2M4OcdzWs6K4w6hh6EZpdowBgYHQUAZQv7grIWVV2ozZKkYwVyOTzjJ9jUUuq3MNurukJdpCvDZG0KDng+v5VrKd8sisAQoAHHqKekaRjCIqj0AxQAkLiSJXBBDAHI70+qs1/BBL5bkhsE9OOmaWC8SeVo0SThQ24rgEHP+BoAs0UUUAFFFFABRRRQAVRvryWAkRQlwFyW7Kc8fpn9PWr1IwBU5GR70AZsN9cSah5DwbIwWG898Z/oBWnUcR8yKN2wWKg9PapKACiiigCuIy1zKQ7rwv3T7U/y5R0mz/vKD/LFEf/AB8Tf8B/lUtAFKazEzMZI4pNwweWXI4/wFSRIYCSlvjIA+V88DPr9TVmigCLzsfejkH/AAHP8qPtEQ6uF/3uP51LRQA1ZEf7rKfoc06oZ/s6DdN5aj1bAqFnso3CmVEYttAD4JPpxQBcoqsxSItm5ZCo3EM4OB689qI5DIR5Vyj5GeVB4/A0AWaQ9DUYM46rG34kVHNcSxRM32WSQgf
