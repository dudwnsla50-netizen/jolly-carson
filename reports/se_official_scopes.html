<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소프트웨어공학 공식 범위별 기출 뷰어</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080b13;
            --card-bg: rgba(17, 24, 39, 0.75);
            --border-color: rgba(255, 255, 255, 0.06);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent-violet: #8b5cf6;
            --accent-blue: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%);
            --accent-glow: rgba(139, 92, 246, 0.12);
            --success: #10b981;
            --card-hover-border: rgba(139, 92, 246, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 2.5rem 1.5rem;
            min-height: 100vh;
            background-image: 
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.06) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.06) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.6rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.6rem;
            letter-spacing: -0.03em;
        }

        header p.subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
        }

        .meta-badges {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .badge {
            background: var(--border-color);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            padding: 0.35rem 0.9rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 500;
            backdrop-filter: blur(8px);
        }

        .badge.accent {
            background: rgba(139, 92, 246, 0.12);
            border-color: rgba(139, 92, 246, 0.25);
            color: #c084fc;
        }

        /* Category Filter Badges */
        .filter-section {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.45rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .filter-btn:hover, .filter-btn.active {
            border-color: var(--accent-violet);
            color: #ffffff;
            background: rgba(139, 92, 246, 0.08);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* Main Accordion List */
        .accordion-list {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-bottom: 4rem;
        }

        .accordion-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .accordion-item:hover {
            border-color: var(--card-hover-border);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .accordion-trigger {
            width: 100%;
            background: none;
            border: none;
            color: inherit;
            padding: 1.6rem 1.8rem;
            text-align: left;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .card-title-group {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .rank-badge {
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .concept-title {
            user-select: text !important;
            -webkit-user-select: text !important;
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        .category-tag {
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            padding: 0.15rem 0.45rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .freq-count-badge {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.15);
            color: var(--success);
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .card-meta-grid {
            display: grid;
            grid-template-columns: 90px 1fr;
            row-gap: 0.5rem;
            column-gap: 0.8rem;
            width: 100%;
            font-size: 0.88rem;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 0.8rem;
            margin-top: 0.2rem;
        }

        .meta-label {
            color: var(--text-muted);
            font-weight: 600;
        }

        .meta-value {
            color: var(--text-secondary);
            word-break: keep-all;
        }

        .meta-value.accent {
            color: #c8a2c8;
        }

        .accordion-trigger .arrow {
            transition: transform 0.3s ease;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .accordion-item.active .accordion-trigger .arrow {
            transform: rotate(180deg);
            color: var(--accent-violet);
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            background: rgba(0, 0, 0, 0.18);
        }

        .accordion-inner {
            padding: 1.6rem 1.8rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .section-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 0.3rem;
            margin-top: 0.2rem;
        }

        .year-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .year-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.35rem 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .year-btn:hover {
            background: var(--accent-gradient);
            border-color: transparent;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.25);
            transform: translateY(-1px);
        }

        .year-btn.active-btn {
            background: var(--accent-gradient);
            border-color: transparent;
            box-shadow: 0 4px 10px rgba(139, 92, 246, 0.3);
            color: #ffffff;
        }

        .year-btn .num-label {
            opacity: 0.7;
            font-size: 0.7rem;
        }

        .inline-question-viewer {
            background: #090d16;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            transition: all 0.3s ease;
        }

        .viewer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 0.5rem;
        }

        .viewer-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #60a5fa;
            font-family: 'Outfit', sans-serif;
        }

        .viewer-close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: color 0.2s;
        }

        .viewer-close-btn:hover {
            color: #ef4444;
        }

        .viewer-body {
            font-size: 0.92rem;
            line-height: 1.7;
            color: #d1d5db;
            white-space: pre-wrap;
            overflow-y: visible;
            max-height: none;
            padding-right: 0.5rem;
        }
        .viewer-body p, .viewer-body span {
            font-family: inherit !important;
            font-size: inherit !important;
            line-height: inherit !important;
            color: inherit !important;
            position: static !important;
            top: auto !important;
            left: auto !important;
        }
        .viewer-body img {
            max-width: 50% !important;
            height: auto !important;
            margin: 0.8rem auto !important;
            display: block !important;
        }

        /* 스크롤바 디자인 */
        .viewer-body::-webkit-scrollbar {
            width: 6px;
        }
        .viewer-body::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.01);
        }
        .viewer-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
        .viewer-body::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        a.badge {
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s ease;
        }
        a.badge:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            color: var(--text-primary) !important;
        }

        /* [검출 토픽 팝업 모달 스타일] */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 11, 19, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-card {
            background: rgba(17, 24, 39, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            max-height: 80%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(139, 92, 246, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform: scale(0.9);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-overlay.show .modal-card {
            transform: scale(1);
        }
        .modal-card-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-card-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
        }
        .modal-close-x {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.4rem;
            cursor: pointer;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close-x:hover {
            color: #ffffff;
        }
        .modal-card-body {
            padding: 1rem 1.5rem 1.5rem 1.5rem;
            overflow-y: auto;
        }
        .modal-topic-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .modal-topic-item {
            padding: 0.8rem 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            transition: all 0.2s ease;
            border-radius: 8px;
        }
        .modal-topic-item:hover {
            background: rgba(139, 92, 246, 0.08);
            transform: translateX(4px);
        }
        .modal-topic-name {
            font-size: 0.92rem;
            font-weight: 500;
            color: var(--text-primary);
        }
        .modal-topic-count {
            background: rgba(139, 92, 246, 0.15);
            color: #c084fc;
            border: 1px solid rgba(139, 92, 246, 0.2);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 50px;
            white-space: nowrap;
        }
        span.badge[onclick]:hover {
            background: rgba(255, 255, 255, 0.08) !important;
            border-color: rgba(255, 255, 255, 0.15) !important;
            color: var(--text-primary) !important;
        }

        /* 반응형 모바일 최적화 */
        @media (max-width: 768px) {
            body { padding: 1.5rem 0.8rem; }
            header h1 { font-size: 1.8rem; line-height: 1.3; }
            header p.subtitle { font-size: 0.88rem; padding: 0 0.5rem; word-break: keep-all; }
            .meta-badges { gap: 0.5rem; }
            .badge { padding: 0.25rem 0.6rem; font-size: 0.72rem; }
            .filter-section { gap: 0.4rem; margin-bottom: 1.5rem; }
            .filter-btn { padding: 0.35rem 0.7rem; font-size: 0.78rem; }
            .accordion-trigger { padding: 1.2rem 1rem; gap: 0.6rem; }
            .concept-title {
            user-select: text !important;
            -webkit-user-select: text !important; font-size: 1.05rem; }
            .rank-badge { font-size: 1rem; }
            .category-tag, .freq-count-badge { font-size: 0.7rem; padding: 0.1rem 0.35rem; }
            .card-meta-grid { grid-template-columns: 80px 1fr; font-size: 0.82rem; row-gap: 0.4rem; }
            .accordion-inner { padding: 1.2rem 1rem; gap: 1rem; }
            .section-title { font-size: 0.75rem; }
            .year-btn { padding: 0.3rem 0.6rem; font-size: 0.75rem; }
            .inline-question-viewer { padding: 0.9rem; }
            .viewer-body { font-size: 0.85rem; max-height: 300px; }
            .modal-card { width: 95%; max-height: 90%; }
            .modal-card-header { padding: 1rem; }
            .modal-card-title { font-size: 1.05rem; }
            .modal-card-body { padding: 0.8rem 1rem 1.2rem 1rem; }
            .modal-topic-item { padding: 0.6rem 0.8rem; }
            .modal-topic-name { font-size: 0.85rem; }
        }
    
        /* [설계 의도] 시안A: 모드 토글 스위치 및 최적화된 내비게이션 스타일 */
        .navigation-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
            margin-bottom: 2rem;
            width: 100%;
        }
        .mode-switch-wrapper {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(255, 255, 255, 0.02);
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
        }
        .mode-label {
            font-size: 0.88rem;
            font-weight: 600;
            transition: color 0.25s ease;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.08);
            transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px; width: 18px;
            left: 3px; bottom: 3px;
            background-color: #ffffff;
            transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        input:checked + .slider {
            background: var(--accent-gradient);
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.2);
        }
        input:checked + .slider:before {
            transform: translateX(22px);
        }
        .slider.round { border-radius: 34px; }
        .slider.round:before { border-radius: 50%; }
        
        .badge.accent {
            background: rgba(139, 92, 246, 0.12) !important;
            border-color: rgba(139, 92, 246, 0.25) !important;
            color: #ffffff !important;
        }

    
        /* [일괄 레이아웃 패치: 스크롤바 제거 및 이미지 50% 축소] */
        .viewer-body {
            max-height: none !important;
            overflow-y: visible !important;
        }
        .viewer-img-container img, .question-img {
            max-width: 50% !important;
            height: auto !important;
            display: block !important;
        }
        @media (max-width: 768px) {
            .viewer-body {
                max-height: none !important;
                overflow-y: visible !important;
            }
            .viewer-img-container img, .question-img {
                max-width: 50% !important;
                height: auto !important;
            }
        }

    </style>
    <script src="exam_db/se_db.js?v=20260613"></script>
</head>
<body>

<div class="container">
    <header>
        <h1>소프트웨어공학 공식 범위별 기출 대시보드</h1>
        <p class="subtitle">공식 시험 가이드라인(SE.txt) 5대 단원 및 33개 중단원 매핑 기출 뷰어</p>
        
        <div class="navigation-container">
            <div class="mode-switch-wrapper">
                <span class="mode-label" id="label-freq">🔥 빈출 개념순</span>
                <label class="switch">
                    <input type="checkbox" id="dashboard-mode-toggle" onchange="toggleDashboardMode(this)">
                    <span class="slider round"></span>
                </label>
                <span class="mode-label" id="label-official">📋 공식 범위순</span>
            </div>
            
            <div class="meta-badges" id="dynamic-nav-badges">
                <a href="#" class="badge home-badge" onclick="goToHome(event)" style="text-decoration: none; background: var(--accent-gradient); color: #ffffff; border: none; font-weight: 700;">🏠 퀴즈 홈으로</a>
                <a href="se_frequent_concepts.html" class="badge subject-badge" data-freq="se_frequent_concepts.html" data-official="se_official_scopes.html" style="text-decoration: none;">소프트웨어공학</a>
                <a href="pm_frequent_concepts.html" class="badge subject-badge" data-freq="pm_frequent_concepts.html" data-official="pm_official_scopes.html" style="text-decoration: none;">프로젝트 관리</a>
                <a href="db_frequent_concepts.html" class="badge subject-badge" data-freq="db_frequent_concepts.html" data-official="db_official_scopes.html" style="text-decoration: none;">데이터베이스</a>
                <a href="sa_frequent_concepts.html" class="badge subject-badge" data-freq="sa_frequent_concepts.html" data-official="sa_official_scopes.html" style="text-decoration: none;">시스템 아키텍처</a>
                <a href="sc_frequent_concepts.html" class="badge subject-badge" data-freq="sc_frequent_concepts.html" data-official="sc_official_scopes.html" style="text-decoration: none;">보안</a>
            </div>
        </div>
        
        <div class="meta-badges">
            <span class="badge">기출 범위: 2015년 ~ 2026년</span>
            <span class="badge accent">총 분석 데이터: <span id="total-question-badge">0</span> 문항</span>
            <span class="badge" onclick="openTopicListModal()" style="cursor: pointer; transition: all 0.2s;" title="클릭 시 중단원 목록 팝업 열기">
                매핑된 공식 중단원: <span id="topic-count-badge">0</span>개
            </span>
        </div>
    </header>

    <div id="accordion-container" class="accordion-list"></div>

<script>
    // [설계 의도] 로컬 오프라인 실행(file:///)과 웹 서버 호스팅(http://) 환경 양쪽 모두에서 퀴즈 대시보드 홈으로 매끄럽게 이동하도록 분기 처리합니다.
    function goToHome(event) {
        event.preventDefault();
        if (window.location.protocol === 'file:') {
            window.location.href = '../index.html';
        } else {
            window.location.href = '/';
        }
    }

    // [설계 의도] 학습 모드 변경에 따라 과목 뱃지의 링크 목적지를 실시간 동적 갱신하고 즉시 이동 처리합니다.
    function toggleDashboardMode(toggleEl) {
        const isOfficial = toggleEl.checked;
        
        // 라벨 색상 하이라이트 전환
        document.getElementById('label-freq').style.color = isOfficial ? 'var(--text-secondary)' : '#ffffff';
        document.getElementById('label-official').style.color = isOfficial ? '#ffffff' : 'var(--text-secondary)';
        
        // 과목별 이동 경로 실시간 매핑

=\"\"><span style=\"color:inherit\">S003</span></p><p style=\"\"><span style=\"color:inherit\">데이터베이스</span></p><p style=\"\"><span style=\"color:inherit\">  다음과 같은 실행 결과가 나오는 SQL 질의문으로 옳</span></p><p style=\"\"><span style=\"color:inherit\">은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">SNAME</span></p><p style=\"\"><span style=\"color:inherit\">COURSE</span></p><p style=\"\"><span style=\"color:inherit\">Kim</span></p><p style=\"\"><span style=\"color:inherit\">자료구조</span></p><p style=\"\"><span style=\"color:inherit\">Kim</span></p><p style=\"\"><span style=\"color:inherit\">알고리즘</span></p><p style=\"\"><span style=\"color:inherit\">Park</span></p><p style=\"\"><span style=\"color:inherit\">자료구조</span></p><p style=\"\"><span style=\"color:inherit\">Lee</span></p><p style=\"\"><span style=\"color:inherit\">알고리즘</span></p><p style=\"\"><span style=\"color:inherit\">Lee</span></p><p style=\"\"><span style=\"color:inherit\">프로그래밍</span></p><p style=\"\"><span style=\"color:inherit\">Lee</span></p><p style=\"\"><span style=\"color:inherit\">데이터베이스</span></p><p style=\"\"><span style=\"color:inherit\">Hong</span></p><p style=\"\"><span style=\"color:inherit\">NULL</span></p><p style=\"\"><span style=\"color:inherit\">  ① SELECT STUDENT.SNAME, ENROL.COURSE</span></p><p style=\"\"><span style=\"color:inherit\">     FROM ENROL INNER JOIN STUDENT </span></p><p style=\"\"><span style=\"color:inherit\">ON ENROL.SNO = STUDENT.SNO;</span></p><p style=\"\"><span style=\"color:inherit\">  ② SELECT STUDENT.SNAME, ENROL.COURSE</span></p><p style=\"\"><span style=\"color:inherit\">     FROM STUDENT LEFT OUTER JOIN ENROL </span></p><p style=\"\"><span style=\"color:inherit\">ON STUDENT.SNO = ENROL.SNO;</span></p><p style=\"\"><span style=\"color:inherit\">  ③ SELECT STUDENT.SNAME, ENROL.COURSE</span></p><p style=\"\"><span style=\"color:inherit\">     FROM ENROL LEFT OUTER JOIN STUDENT </span></p><p style=\"\"><span style=\"color:inherit\">ON ENROL.SNO = STUDENT.SNO;</span></p><p style=\"\"><span style=\"color:inherit\">  ④ SELECT STUDENT.SNAME, ENROL.COURSE</span></p><p style=\"\"><span style=\"color:inherit\">     FROM STUDENT RIGHT OUTER JOIN ENROL </span></p><p style=\"\"><span style=\"color:inherit\">ON STUDENT.SNO = ENROL.SNO;</span></p><p style=\"\"><span style=\"color:inherit\">65. 데이터베이스 보안 기법 중 필수 접근 제어</span></p><p style=\"\"><span style=\"color:inherit\">(mandatory access control) 기법에 대한 설명으</span></p><p style=\"\"><span style=\"color:inherit\">로 옳지 않은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 각 데이터 객체에 적정 비밀 등급을 부여하고 </span></p><p style=\"\"><span style=\"color:inherit\">각 사용자도 허가 등급을 지정하여 데이터 객</span></p><p style=\"\"><span style=\"color:inherit\">체가 적절한 허가 등급을 가진 사용자에 의해</span></p><p style=\"\"><span style=\"color:inherit\">서만 접근되도록 한다. </span></p><p style=\"\"><span style=\"color:inherit\">  ② 통상적인 보안 등급은 TS(극비), S(비밀), C(대</span></p><p style=\"\"><span style=\"color:inherit\">외비), U(일반)으로 나누는데 이들 간의 순서는 </span></p><p style=\"\"><span style=\"color:inherit\">TS > S > C > U 가 된다.</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 데이터 객체 j를 갱신하기 위해서는 사용자 i의 </span></p><p style=\"\"><span style=\"color:inherit\">허가 등급이 데이터 객체 j의 비밀 등급보다 같</span></p><p style=\"\"><span style=\"color:inherit\">거나 높아야 한다. </span></p><p style=\"\"><span style=\"color:inherit\">  ④ 이 필수 접근 제어 기법을 다단계 보안 기법</span></p><p style=\"\"><span style=\"color:inherit\">(multilevel security scheme)이라고도 한다. </span></p><p style=\"\"><span style=\"color:inherit\">66. 다음은 데이터베이스 회복(recovery) 기법의 지</span></p><p style=\"\"><span style=\"color:inherit\">연 </span></p><p style=\"\"><span style=\"color:inherit\">갱신(deferred </span></p><p style=\"\"><span style=\"color:inherit\">update)과 </span></p><p style=\"\"><span style=\"color:inherit\">즉시 </span></p><p style=\"\"><span style=\"color:inherit\">갱신</span></p><p style=\"\"><span style=\"color:inherit\">(immediate update)에 대한 설명이다. 다음 설명 </span></p><p style=\"\"><span style=\"color:inherit\">중에서 옳은 것을 모두 고른 것은? </span></p><p style=\"\"><span style=\"color:inherit\">가. 지연 갱신에서는 완료(commit) 이전에 실패한 </span></p><p style=\"\"><span style=\"color:inherit\">트랜잭션의 경우 UNDO가 필요하지 않다.</span></p><p style=\"\"><span style=\"color:inherit\">나. 즉시 갱신은 완료 이후 UNDO와 REDO가 필요하</span></p><p style=\"\"><span style=\"color:inherit\">지 않기 때문에 NO-UNDO/NO-REDO 알고리즘으</span></p><p style=\"\"><span style=\"color:inherit\">로 알려져 있다.</span></p><p style=\"\"><span style=\"color:inherit\">다. 즉시 갱신에서는 완료 이전에 실패한 트랜잭</span></p><p style=\"\"><span style=\"color:inherit\">션의 경우 UNDO를 수행해야 한다.</span></p><p style=\"\"><span style=\"color:inherit\">라. 지연 갱신에서는 완료된 트랜잭션에 대해서도 </span></p><p style=\"\"><span style=\"color:inherit\">로그를 사용하여 REDO를 수행해야 할 수 있다.</span></p><p style=\"\"><span style=\"color:inherit\">  ① 다, 라</span></p><p style=\"\"><span style=\"color:inherit\">② 나, 라</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 나, 다, 라</span></p><p style=\"\"><span style=\"color:inherit\">④ 가, 다, 라</span></p><p style=\"\"><span style=\"color:inherit\">67. 다음의 구매 데이터로부터 연관규칙 Apriori 알고</span></p><p style=\"\"><span style=\"color:inherit\">리즘을 통해 도출할 수 있는 연관규칙 중에서 신</span></p><p style=\"\"><span style=\"color:inherit\">뢰도(confidence)값이 가장 큰 것은?</span></p><p style=\"\"><span style=\"color:inherit\">고객ID</span></p><p style=\"\"><span style=\"color:inherit\">구매항목</span></p><p style=\"\"><span style=\"color:inherit\">1</span></p><p style=\"\"><span style=\"color:inherit\">{A, B, C}</span></p><p style=\"\"><span style=\"color:inherit\">2</span></p><p style=\"\"><span style=\"color:inherit\">{D, A, E}</span></p><p style=\"\"><span style=\"color:inherit\">3</span></p><p style=\"\"><span style=\"color:inherit\">{A, B, F, G}</span></p><p style=\"\"><span style=\"color:inherit\">4</span></p><p style=\"\"><span style=\"color:inherit\">{F, B, E}</span></p><p style=\"\"><span style=\"color:inherit\">5</span></p><p style=\"\"><span style=\"color:inherit\">{A, C, E}</span></p><p style=\"\"><sp p><p style=\"\"><span style=\"color:inherit\">터베이스가 업무 처리 중심의 데이터로 구성된 반</span></p><p style=\"\"><span style=\"color:inherit\">면 데이터 웨어하우스는 의사 결정이 필요한 주제</span></p><p style=\"\"><span style=\"color:inherit\">를 중심으로 데이터를 구성한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ② 통합된(integrated) 내용 : 데이터 웨어하우스는 여</span></p><p style=\"\"><span style=\"color:inherit\">러 데이터베이스에서 필요한 데이터를 추출하여 의</span></p><p style=\"\"><span style=\"color:inherit\">사 결정에 필요한 분석 및 비교 작업을 지원한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 시간에 따라 변화하지 않는(time-invariant) 내용 : </span></p><p style=\"\"><span style=\"color:inherit\">일반 데이터베이스는 현재와 과거 데이터를 함께 </span></p><p style=\"\"><span style=\"color:inherit\">유지하지만 데이터 웨어하우스는 현재 시점의 데</span></p><p style=\"\"><span style=\"color:inherit\">이터만을 유지한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ④ 비소멸성(nonvolatile) 내용 : 일반 데이터베이스</span></p><p style=\"\"><span style=\"color:inherit\">에 저장된 데이터는 삽입, 삭제, 갱신 연산이 자</span></p><p style=\"\"><span style=\"color:inherit\">주 발생하지만 데이터 웨어하우스는 검색 작업만 </span></p><p style=\"\"><span style=\"color:inherit\">수행되는 읽기 전용의 데이터를 유지한다.</span></p><p style=\"\"><span style=\"color:inherit\">70. 의사결정트리(decision tree) 구축 과정에서 어떤 </span></p><p style=\"\"><span style=\"color:inherit\">노드 N에 클래스 0인 레코드가 1개, 클래스 1인 </span></p><p style=\"\"><span style=\"color:inherit\">레코드가 5개 해당한다고 하자. 이 노드에 대한 </span></p><p style=\"\"><span style=\"color:inherit\">불순도(impurity)를 표현하는 Gini 값으로 가장 </span></p><p style=\"\"><span style=\"color:inherit\">적절한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 0.0 </span></p><p style=\"\"><span style=\"color:inherit\">② 0.278</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 0.5</span></p><p style=\"\"><span style=\"color:inherit\">④ 0.650</span></p><p style=\"\"><span style=\"color:inherit\">71. 다음은 정보 검색, 텍스트 마이닝에서 문서 집합</span></p><p style=\"\"><span style=\"color:inherit\">과 용어에 대한 TFIDF의 개념을 설명한다. 만일, </span></p><p style=\"\"><span style=\"color:inherit\">문서 집합 D에 다음과 같이 d1, d2의 두 문서만 </span></p><p style=\"\"><span style=\"color:inherit\">존재한다고 할 때, 용어 “this”에 대한 TFIDF </span></p><p style=\"\"><span style=\"color:inherit\">값이 옳은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">- TF는 term frequency의 약어로, 해당 용어가 주어</span></p><p style=\"\"><span style=\"color:inherit\">진 문서에 얼마나 많이 나타나는지를 나타낸다. </span></p><p style=\"\"><span style=\"color:inherit\">- IDF는 inverse document frequency의 약어로, </span></p><p style=\"\"><span style=\"color:inherit\">해당 용어가 문서 집합에 얼마나 많이 나타나는</span></p><p style=\"\"><span style=\"color:inherit\">지에 대한 역수를 나타낸다. </span></p><p style=\"\"><span style=\"color:inherit\">- TFIDF는 문서 집합에서 특정 단어가 주어진 문</span></p><p style=\"\"><span style=\"color:inherit\">서 내에서 얼마나 중요한 것인지를 나타내는 통</span></p><p style=\"\"><span style=\"color:inherit\">계적 수치이다.</span></p><p style=\"\"><span style=\"color:inherit\">문서 d1</span></p><p style=\"\"><span style=\"color:inherit\">문서 d2</span></p><p style=\"\"><span style=\"color:inherit\">용어</span></p><p style=\"\"><span style=\"color:inherit\">출현 횟수</span></p><p style=\"\"><span style=\"color:inherit\">용어</span></p><p style=\"\"><span style=\"color:inherit\">출현 횟수</span></p><p style=\"\"><span style=\"color:inherit\">this</span></p><p style=\"\"><span style=\"color:inherit\">1</span></p><p style=\"\"><span style=\"color:inherit\">this</span></p><p style=\"\"><span style=\"color:inherit\">2</span></p><p style=\"\"><span style=\"color:inherit\">is</span></p><p style=\"\"><span style=\"color:inherit\">1</span></p><p style=\"\"><span style=\"color:inherit\">is</span></p><p style=\"\"><span style=\"color:inherit\">1</span></p><p style=\"\"><span style=\"color:inherit\">a</span></p><p style=\"\"><span style=\"color:inherit\">2</span></p><p style=\"\"><span style=\"color:inherit\">another</span></p><p style=\"\"><span style=\"color:inherit\">1</span></p><p style=\"\"><span style=\"color:inherit\">sample</span></p><p style=\"\"><span style=\"color:inherit\">1</span></p><p style=\"\"><span style=\"color:inherit\">example</span></p><p style=\"\"><span style=\"color:inherit\">1</span></p><p style=\"\"><span style=\"color:inherit\">  ① TFIDF(“this”, d1, D) = 0, </span></p><p style=\"\"><span style=\"color:inherit\">TFIDF(“this”, d2, D) = 0</span></p><p style=\"\"><span style=\"color:inherit\">  ② TFIDF(“this”, d1, D) = 0.1, </span></p><p style=\"\"><span style=\"color:inherit\">TFIDF(“this”, d2, D) = 0.2</span></p><p style=\"\"><span style=\"color:inherit\">  ③ TFIDF(“this”, d1, D) = 0.3, </span></p><p style=\"\"><span style=\"color:inherit\">TFIDF(“this”, d2, D) = 0.3</span></p><p style=\"\"><span style=\"color:inherit\">  ④ TFIDF(“this”, d1, D) = 0.2, </span></p><p style=\"\"><span style=\"color:inherit\">TFIDF(“this”, d2, D) = 0.4</span></p><p style=\"\"><span style=\"color:inherit\">72. 다음 설명 중에서 NoSQL의 특징이나 장점과 가장 거</span></p><p style=\"\"><span style=\"color:inherit\">리가 먼 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① NoSQL 시스템은 노드 추가를 통해 저장 공간과 처리 </span></p><p style=\"\"><span style=\"color:inherit\">능력을 증가시킬 수 있어 높은 확장성을 제공한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ② NoSQL 시스템은 데이터를 여러 노드에 복제하여 </span></p><p style=\"\"><span style=\"color:inherit\">저장함으로써 고장 허용(fault tolerance) 기능을 </span></p><p style=\"\"><span style=\"color:inherit\">제공한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ③NoSQL </span></p><p style=\"\"><span style=\"color:inherit\">시스템은 </span></p><p style=\"\"><span style=\"color:inherit\">파일 레코드에 </span></p><p style=\"\"><span style=\"color:inherit\">대한 </span></p><p style=\"\"><span style=\"color:inherit\">샤딩</span></p><p style=\"\"><span style=\"color:inherit\">(sharding)을 사용하여 부하분산을 이룬다.</span></p><p style=\"\"><span style=\"color:inherit\">  ④ NoSQL 시스템은 데이터를 여러 노드에 복제 저장</span></p><p style=\"\"><span style=\"color:inherit\">함으로써 읽기(조회)와 쓰기(갱신) 성능을 개선한</span></p><p style=\"\"><span style=\"color:inherit\">다.</span></p><p style=\"\"><span style=\"color:inherit\">- 17 -</span></p><p style=\"\"><span style=\"color:inherit\">73. 다음 표의 거래 정보에 대해서 최소지지도</span></p><p style=\"\"><span style=\"color:inherit\">(minsup)를 0.5로 하여 Apriori 알고리즘을 적</span></p><p style=\"\"><span style=\"color:inherit\">용하고자 할 때, 빈발 2-항목집합(frequent </span></p><p style=\"\"><span style=\"color:inherit\">2-itemset) 모두를 옳게 나열한 것은? </span></p><p style=\"\"><span style=\"color:inherit\">거래ID</span></p><p style=\"\"><span style=\"color:inherit\">거래항목</span></p><p style=\"\"><span style=\"color:inherit\">거래ID</span></p><p style=\"\"><span style=\"color:inherit\">거래항목</span></p><p style=\"\"><span style=\"color:inherit\">1</span></p><p style=\"\"><span style=\"color:inherit\">{A, B, E, F}</span></p><p style=\"\"><span style=\"color:inherit\">6</span></p><p style=\"\"><span style=\"color:inherit\">{A, B, E, F}</span></p><p style=\"\"><span style=\"color:inherit\">2</span></p><p style=\"\"><span style=\"color:inherit\">{A, D, F}</span></p><p style=\"\"><span style=\"color:inherit\">7</span></p><p style=\"\"><span style=\"color:inherit\">{B, C, D, F}</span></p><p style=\"\"><span style=\"color:inherit\">3</span></p><p style=\"\"><span style=\"color:inherit\">{A, C, G}</span></p><p style=\"\"><span style=\"color:inherit\">8</span></p><p style=\"\"><span style=\"color:inherit\">{A, B, C, E}</span></p><p style=\"\"><span style=\"color:inherit\">4</span></p><p style=\"\"><span style=\"color:inherit\">{C, D, E, G}</span></p><p style=\"\"><span style=\"color:inherit\">9</span></p><p style=\"\"><span style=\"color:inherit\">{A, B, E}</span></p><p style=\"\"><span style=\"color:inherit\">5</span></p><p style=\"\"><span style=\"color:inherit\">{A, B, D, E}</span></p><p style=\"\"><span style=\"color:inherit\">10</span></p><p style=\"\"><span style=\"color:inherit\">{E, F}</span></p><p style=\"\"><span style=\"color:inherit\">  ① {A,B}, {A,E}, {B,E} </span></p><p style=\"\"><span style=\"color:inherit\">  ② {A,F}, {B,F}, {E,F} </span></p><p style=\"\"><span style=\"color:inherit\">  ③ {A,F}, {A,B}, {A,E}, {B,F}, {E,F}, {B,E}</span></p><p style=\"\"><span style=\"color:inherit\">  ④ {A,B}, {A,C}, {A,D}, {E,F}, {E,G}, {F,G}</span></p><p style=\"\"><span style=\"color:inherit\">74. 다음은 스팸(Spam) 메일을 인식하기 위해 구축한 </span></p><p style=\"\"><span style=\"color:inherit\">예측모델로부터 </span></p><p style=\"\"><span style=\"color:inherit\">얻어진 </span></p><p style=\"\"><span style=\"color:inherit\">혼돈행렬(confusion </span></p><p style=\"\"><span style=\"color:inherit\">matrix)이다. 이 혼돈행렬로부터 구할 수 있는 </span></p><p style=\"\"><span style=\"color:inherit\">성능척도 값이 옳지 않은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">예측 클래스</span></p><p style=\"\"><span style=\"color:inherit\">Spam</span></p><p style=\"\"><span style=\"color:inherit\">Non-Spam</span></p><p style=\"\"><span style=\"color:inherit\">정답 클래스</span></p><p style=\"\"><span style=\"color:inherit\">Spam</span></p><p style=\"\"><span style=\"color:inherit\">TP = 45</span></p><p style=\"\"><span style=\"color:inherit\">FN = 20</span></p><p style=\"\"><span style=\"color:inherit\">Non-Spam</span></p><p style=\"\"><span style=\"color:inherit\">FP = 5</span></p><p style=\"\"><span style=\"color:inherit\">TN = 30</span></p><p style=\"\"><span style=\"color:inherit\">  ① 정밀도(precision) = </span><span style=\"color:inherit\"></span></p><p style=\"\"><span style=\"color:inherit\"></span></p><p style=\"\"><span style=\"color:inherit\"></span></p><p style=\"\"><span style=\"color:inherit\">  ② 재현율(recall) = </span><span style=\"color:inherit\"></span></p><p style=\"\"><span style=\"color:inherit\"></span></p><p style=\"\"><span style=\"color:inherit\"></span></p><p style=\"\"><span style=\"color:inherit\">  ③ 특이도(specificity) = </span><span style=\"color:inherit\"></span></p><p style=\"\"><span style=\"color:inherit\"></span></p><p style=\"\"><span style=\"color:inherit\"></span><span style=\"color:inherit\"> </span></p><p style=\"\"><span style=\"color:inherit\">  ④ 정확도(accuracy) = </span><span style=\"color:inherit\"></span></p><p style=\"\"><span style=\"color:inherit\"></span></p><p style=\"\"><span style=\"color:inherit\"></span></p><p style=\"\"><span style=\"color:inherit\">75. 다음은 분산 데이터베이스에서의 투명성(transparency)</span></p><p style=\"\"><span style=\"color:inherit\">에 대한 설명이다. 다음 투명성에 대한 설명 중</span></p><p style=\"\"><span style=\"color:inherit\">에서 가장 적절하지 않은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 이름부여 투명성(naming transparency)은 분산 </span></p><p style=\"\"><span style=\"color:inherit\">데이터베이스가 어떻게 설계되는지와 어느 사</span></p><p style=\"\"><span style=\"color:inherit\">이트에서 트랜잭션이 실행되는지를 사용자에게 </span></p><p style=\"\"><span style=\"color:inherit\">가려주는 것을 의미한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ② 분산 투명성(distribution transparency) 또는 </span></p><p style=\"\"><span style=\"color:inherit\">네트워크 투명성(network transparency)은 사</span></p><p style=\"\"><span style=\"color:inherit\">용자에게 네트워크의 세부 사항과 분산 시스템 </span></p><p style=\"\"><span style=\"color:inherit\">내에서 데이터 저장 장소의 위치를 가려주는 </span></p><p style=\"\"><span style=\"color:inherit\">것을 의미한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 위치 투명성(location transparency)은 어떤 작</span></p><p style=\"\"><span style=\"color:inherit\">업을 수행하기 위해 사용된 명령은 데이터의 위</span></p><p style=\"\"><span style=\"color:inherit\">치와 명령이 입력된 시스템의 위치와 무관해야 </span></p><p style=\"\"><span style=\"color:inherit\">함을 의미한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ④ 중복 투명성(replication transparency)은 높은 </span></p><p style=\"\"><span style=\"color:inherit\">가용성, 성능, 신뢰도를 위해 데이터 사본들이 </span></p><p style=\"\"><span style=\"color:inherit\">여러 사이트에 중복될 수 있음을 의미하며, 중</span></p><p style=\"\"><span style=\"color:inherit\">복된 사본의 존재를 사용자에게 가려준다.</span></p><p style=\"\"><span style=\"color:inherit\">- 18 -</span></p><p style=\"\"><span style=\"color:inherit\">시스템 구조</span></p><p style=\"\"><span style=\"color:inherit\"> </span></p><p style=\"\"><span style=\"color:inherit\">76. 네트워크 장비를 그 기능에 따라 OSI 7 계층과 올</span></p><p style=\"\"><span style=\"color:inherit\">바르게 매핑한 것을 모두 고른 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 가, 나</span></p><p style=\"\"><span style=\"color:inherit\">② 가, 다</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 나, 다</span></p><p style=\"\"><span style=\"color:inherit\">④ 가, 나, 다</span></p><p style=\"\"><span style=\"color:inherit\">77. 성형(star) 토폴로지에 대한 설명으로 적절한 것</span></p><p style=\"\"><span style=\"color:inherit\">을 모두 고른 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 가, 나</span></p><p style=\"\"><span style=\"color:inherit\">② 가, 다</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 나, 다</span></p><p style=\"\"><span style=\"color:inherit\">④ 가, 나, 다</span></p><p style=\"\"><span style=\"color:inherit\">78. 다음 프로토콜 중에서 링크 계층의 주소를 네트</span></p><p style=\"\"><span style=\"color:inherit\">워크 계층의 주소로 변환하는 기능을 제공하는 </span></p><p style=\"\"><span style=\"color:inherit\">프로토콜로 가장 적절한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① ARP(Address Resolution Protocol)</span></p><p style=\"\"><span style=\"color:inherit\">  ② RARP(Reverse Address Resolution Protocol)</span></p><p style=\"\"><span style=\"color:inherit\">  ③ ICMP(Internet Control Message Protocol)</span></p><p style=\"\"><span style=\"color:inherit\">  ④ NAT(Network Address Translation)</span></p><p style=\"\"><span style=\"color:inherit\">79. 짝수 패리티 기법을 적용하여, 패리티 비트 포함  </span></p><p style=\"\"><span style=\"color:inherit\">8비트로 이루어진 아스키코드 대문자 B를 인코딩</span></p><p style=\"\"><span style=\"color:inherit\">할 때 올바른 메모리 비트 값으로 가장 적절한 </span></p><p style=\"\"><span style=\"color:inherit\">것은? (단, 패리티 비트는 MSB에 위치하며, 대문</span></p><p style=\"\"><span style=\"color:inherit\">자 A의 아스키코드 값은 10진수 65임)</span></p><p style=\"\"><span style=\"color:inherit\">  ① 0100 0010</span></p><p style=\"\"><span style=\"color:inherit\">② 0100 1010 </span></p><p style=\"\"><span style=\"color:inherit\">  ③ 1100 0010</span></p><p style=\"\"><span style=\"color:inherit\">④ 1100 1010</span></p><p style=\"\"><span style=\"color:inherit\">80. 컴퓨터는 2의 보수 (2`s complement) 체계를 사</span></p><p style=\"\"><span style=\"color:inherit\">용해 정수를 표현한다. 10진수 –5에 대한 4비트</span></p><p style=\"\"><span style=\"color:inherit\">를 사용한 2의 보수로 가장 적절한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 1110</span></p><p style=\"\"><span style=\"color:inherit\">② 1101</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 1011</span></p><p style=\"\"><span style=\"color:inherit\">④ 1010</span></p><p style=\"\"><span style=\"color:inherit\">81. 다음 중 선점(preemptive) CPU 스케줄링 정책에 </span></p><p style=\"\"><span style=\"color:inherit\">대한 설명으로 적절한 것을 모두 고른 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 가</span></p><p style=\"\"><span style=\"color:inherit\">② 가, 나</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 가, 다</span></p><p style=\"\"><span style=\"color:inherit\">④ 나, 다</span></p><p style=\"\"><span style=\"color:inherit\">82. 다음 중 경로설정(routing)에 대한 설명으로 가</span></p><p style=\"\"><span style=\"color:inherit\">장 적절하지 않은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 경로설정 테이블(routing table)은 정적 혹은 </span></p><p style=\"\"><span style=\"color:inherit\">동적으로 구성될 수 있다.</span></p><p style=\"\"><span style=\"color:inherit\">  ② 유니캐스트 경로설정 프로토콜과 멀티캐스트 경로</span></p><p style=\"\"><span style=\"color:inherit\">설정 프로토콜이 존재한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 자율 시스템(Autonomous System)내에서 사용되는 </span></p><p style=\"\"><span style=\"color:inherit\">IGP와 자율 시스템 간에 사용하는 EGP로 구분된</span></p><p style=\"\"><span style=\"color:inherit\">다.</span></p><p style=\"\"><span style=\"color:inherit\">  ④ Bellman-Ford 알고리즘을 사용하는 링크 상태 </span></p><p style=\"\"><span style=\"color:inherit\">라우팅과 Dijkstra 알고리즘을 사용하는 거리 </span></p><p style=\"\"><span style=\"color:inherit\">벡터 라우팅으로 구분된다.</span></p><p style=\"\"><span style=\"color:inherit\">83. TCP(Transmission Control Protocol) 헤더에 있</span></p><p style=\"\"><span style=\"color:inherit\">는 체크섬 계산에는 IP 헤더로부터 일부 필드 </span></p><p style=\"\"><span style=\"color:inherit\">정보를 가져와서 사용하며 이를 가상 헤더라</span></p><p style=\"\"><span style=\"color:inherit\">(Pseudoheader) 한다. 다음 중 가상 헤더 필드</span></p><p style=\"\"><span style=\"color:inherit\">로 가장 적절하지 않은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 프로토콜</span></p><p style=\"\"><span style=\"color:inherit\">② 수신자 IP 주소</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 송신자 IP 주소</span></p><p style=\"\"><span style=\"color:inherit\">④ 생존시간(TTL)</span></p><p style=\"\"><span style=\"color:inherit\">가. 라우터 – 네트워크 계층</span></p><p style=\"\"><span style=\"color:inherit\">나. 브리지 – 데이터링크 계층</span></p><p style=\"\"><span style=\"color:inherit\">다. 허브 – 물리 계층</span></p><p style=\"\"><span style=\"color:inherit\">가. 5개의 노드를 연결할 때 필요한 링크의 개수</span></p><p style=\"\"><span style=\"color:inherit\">는 4개이다.</span></p><p style=\"\"><span style=\"color:inherit\">나. 연결하는 노드의 개수가 동일할 때, 버스형</span></p><p style=\"\"><span style=\"color:inherit\">(bus) 토폴로지에 비해 네트워크 구축 비용이 </span></p><p style=\"\"><span style=\"color:inherit\">상대적으로 높다.</span></p><p style=\"\"><span style=\"color:inherit\">다. 임의의 한 노드에 장애가 발생해도 전체 네트</span></p><p style=\"\"><span style=\"color:inherit\">워크는 다운되지 않는다.</span></p><p style=\"\"><span style=\"color:inherit\">가. 라운드로빈 스케줄링 정책은 선점 스케줄링 </span></p><p style=\"\"><span style=\"color:inherit\">정책에 속한다.</span></p><p style=\"\"><span style=\"color:inherit\">나. 선점 스케줄링 정책을 사용하면 비선점 스케</span></p><p style=\"\"><span style=\"color:inherit\">줄링 정책을 사용할 때보다 문맥 교환이 덜 </span></p><p style=\"\"><span style=\"color:inherit\">빈번하다.</span></p><p style=\"\"><span style=\"color:inherit\">다. 선점 스케줄링 정책에서는 현재 실행 중인 프</span></p><p style=\"\"><span style=\"color:inherit\">로세스가 종료될 때와 블록(대기) 상태로 전</span></p><p style=\"\"><span style=\"color:inherit\">환될 때만 CPU 스케줄링이 실행된다.</span></p><p style=\"\"><span style=\"color:inherit\">- 19 -</span></p><p style=\"\"><span style=\"color:inherit\">84. 명령어 파이프라인은 해저드(Hazard)라는 중대한 </span></p><p style=\"\"><span style=\"color:inherit\">문제를 발생시킨다. 다음 중 일반적인 파이프라인 </span></p><p style=\"\"><span style=\"color:inherit\">해저드의 종류로 가장 적절하지 않은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① Structural Hazard</span></p><p style=\"\"><span style=\"color:inherit\">② Register Hazard</span></p><p style=\"\"><span style=\"color:inherit\">  ③ Data Hazard</span></p><p style=\"\"><span style=\"color:inherit\">④ Control Hazard</span></p><p style=\"\"><span style=\"color:inherit\">85. 하둡 Ver 3.0에서 새로 추가된 기술로 가장 적절</span></p><p style=\"\"><span style=\"color:inherit\">한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ①  Erasure Coding </span></p><p style=\"\"><span style=\"color:inherit\">  ②  Resource Manager</span></p><p style=\"\"><span style=\"color:inherit\">  ③  Secondary Namenode </span></p><p style=\"\"><span style=\"color:inherit\">  ④  YARN(Yet Another Resource Negotiator)</span></p><p style=\"\"><span style=\"color:inherit\">86. 두 네트워크 간의 상호 경쟁을 통해 네트워크의 </span></p><p style=\"\"><span style=\"color:inherit\">성능을 향상시키는 개념을 포함하고 있는 딥러닝 </span></p><p style=\"\"><span style=\"color:inherit\">방식으로 가장 적절한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① CNN(Convolutional Neural Network)</span></p><p style=\"\"><span style=\"color:inherit\">  ② GAN(Generative Adversarial Network)</span></p><p style=\"\"><span style=\"color:inherit\">  ③ RNN(Recurrent Neural Network)</span></p><p style=\"\"><span style=\"color:inherit\">  ④ SVM(Support Vector Machine)</span></p><p style=\"\"><span style=\"color:inherit\">87. 분산 패리티 기법을 사용하는 RAID 5 구축에 요구</span></p><p style=\"\"><span style=\"color:inherit\">되는 최소 디스크의 수로 가장 적절한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 2개</span></p><p style=\"\"><span style=\"color:inherit\">② 3개</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 4개</span></p><p style=\"\"><span style=\"color:inherit\">④ 5개</span></p><p style=\"\"><span style=\"color:inherit\">88. SDN(Software Defined Network) 기술 중 자신이 </span></p><p style=\"\"><span style=\"color:inherit\">속한 도메인에 있는 모든 네트워크 기기들과 대</span></p><p style=\"\"><span style=\"color:inherit\">화하고 관련 네트워크를 프로그래밍할 수 있는 </span></p><p style=\"\"><span style=\"color:inherit\">기술로 가장 적절한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 스위칭 기술</span></p><p style=\"\"><span style=\"color:inherit\">② 오버레이 기술</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 라우팅 기술</span></p><p style=\"\"><span style=\"color:inherit\">④ 컨트롤러 기술</span></p><p style=\"\"><span style=\"color:inherit\">89. LAN 스위칭 기술을 구분할 때, Cut-Through 스위</span></p><p style=\"\"><span style=\"color:inherit\">치, Interim Cut-Through 스위치, Store-and </span></p><p style=\"\"><span style=\"color:inherit\">-Forward 스위치로 나눌 수 있다. 이를 구분하는 </span></p><p style=\"\"><span style=\"color:inherit\">기준으로 가장 적절한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 포트 인터페이스</span></p><p style=\"\"><span style=\"color:inherit\">② 학습 로직</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 입출력 포트</span></p><p style=\"\"><span style=\"color:inherit\">④ 전송 로직</span></p><p style=\"\"><span style=\"color:inherit\">90. IPv4에서 단편화(fragmentation)가 발생된 패킷</span></p><p style=\"\"><span style=\"color:inherit\">은 헤더의 내용이 수정되어야 한다. 다음 IPv4</span></p><p style=\"\"><span style=\"color:inherit\">의 헤더 정보 중에서 변경되지 않는 헤더의 정</span></p><p style=\"\"><span style=\"color:inherit\">보로 가장 적절한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 전체 길이 정보</span></p><p style=\"\"><span style=\"color:inherit\">  ② 체크섬(checksum) 정보</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 식별자(identification) 정보</span></p><p style=\"\"><span style=\"color:inherit\">  ④ 단편화 오프셋(fragmentation offset) 정보</span></p><p style=\"\"><span style=\"color:inherit\">91. 다음 멀티캐스트 라우팅 프로토콜 중에서 그룹 </span></p><p style=\"\"><span style=\"color:inherit\">공유 트리(group-shared tree) 방식을 사용하는 </span></p><p style=\"\"><span style=\"color:inherit\">프로토콜로 가장 적절한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① MOSPF </span></p><p style=\"\"><span style=\"color:inherit\">② DVMRP </span></p><p style=\"\"><span style=\"color:inherit\">  ③ CBT</span></p><p style=\"\"><span style=\"color:inherit\">④ PIM-DM</span></p><p style=\"\"><span style=\"color:inherit\">92. 다음 그림은 SCTP(Stream Control Transmission </span></p><p style=\"\"><span style=\"color:inherit\">Protocol)의 연결설정 과정을 보여주고 있다. 괄호</span></p><p style=\"\"><span style=\"color:inherit\">에 들어가야 하는 메시지로 가장 적절한 것은?</span></p><img style=\"max-width: 100%; height: auto; display: block; margin: 0.5rem 0; border-radius: 4px; border: 1px solid rgba(255,255,255,0.06);\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABALDA4MChAODQ4SERATGCgaGBYWGDEjJR0oOjM9PDkzODdASFxOQERXRTc4UG1RV19iZ2hnPk1xeXBkeFxlZ2P/2wBDARESEhgVGC8aGi9jQjhCY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2P/wAARCAC7APUDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwDv6pT6rb28zRSJcFl67LeRx+YGKu1wurRhNVuU8o3LKw3SOsIJJAPeM+o70Adc+qWiWcV28u2GXGxip5z7YzSwajbXLRCB94mVmRgDj5SAf1NZKLdW2iaeLaS82kjf5KxyPGmw4UcYIBwM4otEka+sUie6iKiZnNzEoeTLIT7Dr1FAGwuoWjXps1uENwOqZ59cfXHamnUrZbQXLOyxs21flJZjkjAA5J4rNSG4MsVmbVwY7szm4ONhXcWyDnOTnbj69qauI/D8Vz5vlNbyu6vtDAHey8jI4wx7igDUh1K2nMXlOW81mUfKQQVGSCD0P1pJtW063laKe+topF+8jyqCPwrMtrS3/tWC6W7guLpndpnRwMgpgBVBPAwPes64u1F9dSQ3uI5ZNwC ess Translation) 방식에서는 </span></p><p style=\"\"><span style=\"color:inherit\">소수의 공인 IP를 내부 네트워크의 다수의 컴</span></p><p style=\"\"><span style=\"color:inherit\">퓨터가 공유해서 사용할 수 있다.</span></p><p style=\"\"><span style=\"color:inherit\">- 20 -</span></p><p style=\"\"><span style=\"color:inherit\">94. 다음 활성화 함수 중에 오류 역전파 학습 알고리</span></p><p style=\"\"><span style=\"color:inherit\">즘의 적용에 필수인 미분 가능한 특징을 갖고 있</span></p><p style=\"\"><span style=\"color:inherit\">지만 기울기 소실(vanishing gradient) 문제를 </span></p><p style=\"\"><span style=\"color:inherit\">발생시키는 활성화 함수로 가장 적절한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 계단 함수</span></p><p style=\"\"><span style=\"color:inherit\">② 렐루 함수</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 시그모이드 함수</span></p><p style=\"\"><span style=\"color:inherit\">④ 선형 함수</span></p><p style=\"\"><span style=\"color:inherit\">95. 다음 중 오픈소스 라이선스를 침해하는 행위에 </span></p><p style=\"\"><span style=\"color:inherit\">해당하는 것을 모두 고른 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 가</span></p><p style=\"\"><span style=\"color:inherit\">② 가, 나</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 가, 나, 다</span></p><p style=\"\"><span style=\"color:inherit\">④ 모두 해당 없음</span></p><p style=\"\"><span style=\"color:inherit\">96. 다음 중 시계열 데이터를 예측하는데 주로 사용</span></p><p style=\"\"><span style=\"color:inherit\">되는 딥러닝 모델로서 시간 t에서의 은닉층</span></p><p style=\"\"><span style=\"color:inherit\">(hidden layer) 출력값이 시간 t+1에서의 은닉층 </span></p><p style=\"\"><span style=\"color:inherit\">입력값으로 사용되는 특징을 가진 것으로 가장 </span></p><p style=\"\"><span style=\"color:inherit\">적절한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 로지스틱회귀(logistic regression) </span></p><p style=\"\"><span style=\"color:inherit\">  ② 순환신경망(recurrent neural network)</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 퍼셉트론(perceptron)</span></p><p style=\"\"><span style=\"color:inherit\">  ④ 합성곱신경망(convolutional neural network)</span></p><p style=\"\"><span style=\"color:inherit\">97. 정보시스템 하드웨어 규모산정 지침(정보통신단체</span></p><p style=\"\"><span style=\"color:inherit\">표준, TTAK.KO-10.0292, 2018.12.19.)에서 CPU의 </span></p><p style=\"\"><span style=\"color:inherit\">규모를 산정할 때 OLTP와 WEB/WAS 서버 모두에서 고</span></p><p style=\"\"><span style=\"color:inherit\">려하는 공통 항목으로 가장 적절하지 않은 것은? </span></p><p style=\"\"><span style=\"color:inherit\">  ① 사용자당 오퍼레이션 수</span></p><p style=\"\"><span style=\"color:inherit\">  ② 시스템 목표 활용률</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 클러스터 보정</span></p><p style=\"\"><span style=\"color:inherit\">  ④ 피크타임 부하 보정</span></p><p style=\"\"><span style=\"color:inherit\">98. 인-메모리 방식으로 연산을 수행하는 Spark에 관</span></p><p style=\"\"><span style=\"color:inherit\">한 설명으로 가장 적절하지 않은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 하둡2.0(YARN 환경)에서는 Spark를 지원하지 않는</span></p><p style=\"\"><span style=\"color:inherit\">다.</span></p><p style=\"\"><span style=\"color:inherit\">  ② 맵리듀스 연산에 비해 그 계산 속도가 매우 빠</span></p><p style=\"\"><span style=\"color:inherit\">르다, </span></p><p style=\"\"><span style=\"color:inherit\">  ③ 파이썬, 스칼라, 자바 언어를 사용하여 개발할 </span></p><p style=\"\"><span style=\"color:inherit\">수 있다. </span></p><p style=\"\"><span style=\"color:inherit\">  ④ 기계학습, 그래프 연산 등 반복적인 계산 문제</span></p><p style=\"\"><span style=\"color:inherit\">를 해결하는 데 적합하다.</span></p><p style=\"\"><span style=\"color:inherit\">99. </span></p><p style=\"\"><span style=\"color:inherit\">다음 </span></p><p style=\"\"><span style=\"color:inherit\">중 </span></p><p style=\"\"><span style=\"color:inherit\">DHCP(Dynamic </span></p><p style=\"\"><span style=\"color:inherit\">Host </span></p><p style=\"\"><span style=\"color:inherit\">Configuration </span></p><p style=\"\"><span style=\"color:inherit\">Protocol) 프로토콜에서 사용하는 메시지에 대한 </span></p><p style=\"\"><span style=\"color:inherit\">설명으로 가장 적절하지 않은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① DHCP ACK는 DHCP Request에 대한 응답으로 보낸다. </span></p><p style=\"\"><span style=\"color:inherit\">  ② DHCP Request는 클라이언트가 DHCP 서버에게 IP</span></p><p style=\"\"><span style=\"color:inherit\">주소를 요청한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ③ DHCP Discover는 DHCP 서버가 IP 주소 할당 서</span></p><p style=\"\"><span style=\"color:inherit\">버임을 알린다.</span></p><p style=\"\"><span style=\"color:inherit\">  ④ DHCP Offer는 DHCP 서버가 요청 클라이언트에게 </span></p><p style=\"\"><span style=\"color:inherit\">할당할 IP주소를 제공한다.</span></p><p style=\"\"><span style=\"color:inherit\">100. 읽기 및 쓰기 성능이 각각 100,000 IOPS(Input </span></p><p style=\"\"><span style=\"color:inherit\">/Output Operations Per Second)인 8개의 동일한 </span></p><p style=\"\"><span style=\"color:inherit\">하드디스크로 RAID 10을 구성할 때 RAID 10의 읽</span></p><p style=\"\"><span style=\"color:inherit\">기 성능과 쓰기 성능으로 가장 적절한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 읽기: 400,000 IOPS, 쓰기: 400,000 IOPS</span></p><p style=\"\"><span style=\"color:inherit\">  ② 읽기: 400,000 IOPS, 쓰기: 800,000 IOPS</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 읽기: 800,000 IOPS, 쓰기: 400,000 IOPS</span></p><p style=\"\"><span style=\"color:inherit\">  ④ 읽기: 800,000 IOPS, 쓰기: 800,000 IOPS</span></p><p style=\"\"><span style=\"color:inherit\">가. GPL3.0 라이브러리를 정적 링크 방식으로 연결</span></p><p style=\"\"><span style=\"color:inherit\">하여 상업용 소프트웨어를 개발, 배포하고 자체 </span></p><p style=\"\"><span style=\"color:inherit\">개발한 모듈의 소스코드를 공개하지 않았다.</span></p><p style=\"\"><span style=\"color:inherit\">나. LGPL3.0 라이브러리를 정적 링크 방식으로 연결</span></p><p style=\"\"><span style=\"color:inherit\">하여 상업용 소프트웨어를 개발, 배포하고 자체 </span></p><p style=\"\"><span style=\"color:inherit\">개발한 모듈의 소스코드를 공개하지 않았다.</span></p><p style=\"\"><span style=\"color:inherit\">다. Apache2.0 라이브러리를 정적 링크 방식으로 연</span></p><p style=\"\"><span style=\"color:inherit\">결하여 상업용 소프트웨어를 개발, 배포하고 자</span></p><p style=\"\"><span style=\"color:inherit\">체 개발한 모듈의 소스코드를 공개하지 않았다.</span></p><p style=\"\"><span style=\"color:inherit\">- 21 -</span></p><p style=\"\"><span style=\"color:inherit\">보  안</span></p><p style=\"\"><span style=\"color:inherit\"> </span></p><p style=\"\"><span style=\"color:inherit\">101. 다음 중 전자서명(Digital signature)의 역할로 </span></p><p style=\"\"><span style=\"color:inherit\">가장 적절하지 않은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 메시지 송신자 인증</span></p><p style=\"\"><span style=\"color:inherit\">  ② 메시지 무결성 검증</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 메시지 기밀성 검증</span></p><p style=\"\"><span style=\"color:inherit\">  ④ 부인 방지</span></p><p style=\"\"><span style=\"color:inherit\">102. AES(Advanced Encryption Standard)에 대한 설</span></p><p style=\"\"><span style=\"color:inherit\">명으로 가장 적절하지 않은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 입력 블록의 크기는 128 비트 고정이고, 키 길</span></p><p style=\"\"><span style=\"color:inherit\">이는 128, 192, 256 비트 3가지 중 하나를 선택</span></p><p style=\"\"><span style=\"color:inherit\">할 수 있다.</span></p><p style=\"\"><span style=\"color:inherit\">  ② DES에서 사용한 Feistel 구조가 아닌 SPN </span></p><p style=\"\"><span style=\"color:inherit\">(Substitution–Permutation Network) 구조를 </span></p><p style=\"\"><span style=\"color:inherit\">사용한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ③ SubBytes 연산에서는 4 바이트의 값을 비트 연</span></p><p style=\"\"><span style=\"color:inherit\">산을 이용하여 새로운 4 바이트 값으로 변환하</span></p><p style=\"\"><span style=\"color:inherit\">는 과정을 수행한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ④ 복수 라운드로 구성되어 있으며, 각 라운드는 </span></p><p style=\"\"><span style=\"color:inherit\">SubBytes, ShiftRows, MixColumns, AddRoundKey </span></p><p style=\"\"><span style=\"color:inherit\">라는 4개의 서브 함수로 구성된다.</span></p><p style=\"\"><span style=\"color:inherit\">103. 다음 중 접근통제에 대한 설명으로 가장 적절한 </span></p><p style=\"\"><span style=\"color:inherit\">것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 임의적 접근통제는 관리자가 부여한 사용자와 </span></p><p style=\"\"><span style=\"color:inherit\">정보객체의 보안등급으로 정보의 접근 허가여</span></p><p style=\"\"><span style=\"color:inherit\">부를 결정한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ② 역할 기반 접근통제는 권한관리를 사용자와 정</span></p><p style=\"\"><span style=\"color:inherit\">보 객체간의 관계가 아닌 기업 환경에서의 역할</span></p><p style=\"\"><span style=\"color:inherit\">과 정보 객체 간의 관계로 설정하여 관리한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ③ ACL(Access Control List) 기반의 접근통제는 </span></p><p style=\"\"><span style=\"color:inherit\">객체에 접근통제 정보를 저장하는 방식으로, </span></p><p style=\"\"><span style=\"color:inherit\">주체의 수가 많아져도 효율적인 관리가 가능하</span></p><p style=\"\"><span style=\"color:inherit\">다는 장점이 있다.</span></p><p style=\"\"><span style=\"color:inherit\">  ④ 강제적 접근통제는 정보 객체의 사용을 요청하</span></p><p style=\"\"><span style=\"color:inherit\">는 사용자의 신원에 근거하여 접근 허가를 결정</span></p><p style=\"\"><span style=\"color:inherit\">하는 방식이다.</span></p><p style=\"\"><span style=\"color:inherit\">104. 메시지 인증 코드(MAC)는 메시지의 인증에 사용</span></p><p style=\"\"><span style=\"color:inherit\">되는 작은 크기의 정보이다. 다음 중 메시지 인</span></p><p style=\"\"><span style=\"color:inherit\">증 코드에 대한 설명으로 가장 적절한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 메시지 인증 코드는 두 사용자만이 공유한 키를 </span></p><p style=\"\"><span style=\"color:inherit\">사용하기 때문에 부인 방지가 가능하다.</span></p><p style=\"\"><span style=\"color:inherit\">  ② 블록 암호와 CBC 블록암호 모드를 사용하여 메</span></p><p style=\"\"><span style=\"color:inherit\">시지 인증 코드를 구현할 수 있다.</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 메시지 인증 코드를 사용하면 메시지에 대한 기</span></p><p style=\"\"><span style=\"color:inherit\">밀성과 무결성을 모두 제공한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ④ 메시지 인증 코드는 키에 의존하는 양방향 해시 </span></p><p style=\"\"><span style=\"color:inherit\">함수이다.</span></p><p style=\"\"><span style=\"color:inherit\">105. 다음 설명에 해당하는 공격으로 가장 적절한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① Evil Twin AP 공격</span></p><p style=\"\"><span style=\"color:inherit\">② Hacktivism AP 공격</span></p><p style=\"\"><span style=\"color:inherit\">  ③ Proxy AP 공격</span></p><p style=\"\"><span style=\"color:inherit\">④ AP to AP 공격</span></p><p style=\"\"><span style=\"color:inherit\">106. TCP SYN FLOODING 공격이 성공하기 위해서는 서</span></p><p style=\"\"><span style=\"color:inherit\">버의 TCB 큐에 연결요청이 쌓여서 더 이상의 연</span></p><p style=\"\"><span style=\"color:inherit\">결요청을 받지 못하는 상황이 되어야 한다. 아</span></p><p style=\"\"><span style=\"color:inherit\">래 설명 중 TCB 큐에 연결정보를 제거(Dequeue) </span></p><p style=\"\"><span style=\"color:inherit\">시키는 상황으로 가장 적절하지 않은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 클라이언트가 3-way handshake 과정을 종료함</span></p><p style=\"\"><span style=\"color:inherit\">  ② TCB 큐의 레코드가 정해진 기준시간 보다 더 길</span></p><p style=\"\"><span style=\"color:inherit\">게 머무름</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 공격자가 SYN 패킷을 보낼 때 랜덤하게 생성한 </span></p><p style=\"\"><span style=\"color:inherit\">근원지 IP 주소를 사용함</span></p><p style=\"\"><span style=\"color:inherit\">  ④ TCB 큐의 레코드에 해당하는 연결에 대해 RST </span></p><p style=\"\"><span style=\"color:inherit\">패킷이 도착함</span></p><p style=\"\"><span style=\"color:inherit\">공격자 AP(Access Point)는 정상적인 AP보다 강력</span></p><p style=\"\"><span style=\"color:inherit\">한 전파를 발생시켜 무선랜 이용자가 공격자 AP에 </span></p><p style=\"\"><span style=\"color:inherit\">접속하도록 유도한 후, 무선랜 이용자의 정보를 중</span></p><p style=\"\"><span style=\"color:inherit\">간에서 획득하는 공격</span></p><p style=\"\"><span style=\"color:inherit\">- 22 -</span></p><p style=\"\"><span style=\"color:inherit\">107. 방화벽의 패킷 필터링 규칙이 다음과 같을 때 </span></p><p style=\"\"><span style=\"color:inherit\">적용되는 규칙에 대한 설명으로 가장 적절하지 </span></p><p style=\"\"><span style=\"color:inherit\">않은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 내부와 외부에서 웹 서버(192.168.1.10)에 접근</span></p><p style=\"\"><span style=\"color:inherit\">하는 것을 허용한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ② 외부의 모든 시스템에서 내부 시스템으로 SMTP </span></p><p style=\"\"><span style=\"color:inherit\">패킷을 보내지 못하도록 설정한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 내부 메일 서버(192.168.1.11)에서 외부 메일 </span></p><p style=\"\"><span style=\"color:inherit\">서버(10.10.10.21)로 가는 IMAP 접근을 금지한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ④ 내부 메일 서버(192.168.1.11)에서 외부 메일 </span></p><p style=\"\"><span style=\"color:inherit\">서버(10.10.10.21)로 가는 SMTP 패킷을 허용한다.</span></p><p style=\"\"><span style=\"color:inherit\">108. 다음 중 네트워크 기반 공격 기술에 대한 설명으로 </span></p><p style=\"\"><span style=\"color:inherit\">가장 적절한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① Smurf 공격: 공격자가 송신자 IP 주소를 존재하</span></p><p style=\"\"><span style=\"color:inherit\">지 않거나 다른 시스템의 IP 주소로 위장하여 </span></p><p style=\"\"><span style=\"color:inherit\">목적 시스템으로 패킷을 연속해서 보내는 공격</span></p><p style=\"\"><span style=\"color:inherit\">기법이다.</span></p><p style=\"\"><span style=\"color:inherit\">  ② SYN Flooding 공격: 공격자가 공격 대상의 IP </span></p><p style=\"\"><span style=\"color:inherit\">주소로 위장하여 패킷을 브로드캐스트 주소로 </span></p><p style=\"\"><span style=\"color:inherit\">전송하는 공격이다.</span></p><p style=\"\"><span style=\"color:inherit\">  ③ ARP Redirect 공격: TCP/IP의 구조적인 허점을 </span></p><p style=\"\"><span style=\"color:inherit\">이용한 공격으로, 신뢰관계에 있는 두 개의 호</span></p><p style=\"\"><span style=\"color:inherit\">스트 중 하나를 마비시킨 후 IP 주소를 속이는 </span></p><p style=\"\"><span style=\"color:inherit\">공격이다.</span></p><p style=\"\"><span style=\"color:inherit\">  ④ Switch Jamming 공격: 위조된 MAC 주소를 지속</span></p><p style=\"\"><span style=\"color:inherit\">적으로 보내 스위치의 주소 테이블을 가득 채운 </span></p><p style=\"\"><span style=\"color:inherit\">후 스니핑을 진행하는 공격이다.</span></p><p style=\"\"><span style=\"color:inherit\">109. 리눅스 시스템의 기본 방화벽인 iptables에서 </span></p><p style=\"\"><span style=\"color:inherit\">192.168.20.22 으로부터 들어오는 패킷들을 차</span></p><p style=\"\"><span style=\"color:inherit\">단하는 정책으로 가장 적절한 명령어는?</span></p><p style=\"\"><span style=\"color:inherit\">  ① # iptables –A INPUT 192.168.20.22 –j DROP</span></p><p style=\"\"><span style=\"color:inherit\">  ② # iptables –I INPUT 192.168.20.22 –j LOG</span></p><p style=\"\"><span style=\"color:inherit\">  ③ # iptables –A INPUT 192.168.20.22 –j ACCEPT</span></p><p style=\"\"><span style=\"color:inherit\">  ④ # iptables –A INPUT 192.168.20.22 –j RETURN</span></p><p style=\"\"><span style=\"color:inherit\">110. 다음 중 ARP Poisoning 공격을 방지하는 방법으로 </span></p><p style=\"\"><span style=\"color:inherit\">가장 적절하지 않은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① ARP request 및 ARP reply를 이용하여 MAC 주소</span></p><p style=\"\"><span style=\"color:inherit\">를 현행화하지 못하도록 한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ② 외부 PC가 로컬 네트워크에 접근하지 못하도록 </span></p><p style=\"\"><span style=\"color:inherit\">한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 정적 ARP table을 사용하도록 세팅한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ④ 컴퓨터의 MAC 주소를 주기적으로 변경해 준다.</span></p><p style=\"\"><span style=\"color:inherit\">111. 악성 프로그램은 컴퓨터, 서버, 클라이언트 및 </span></p><p style=\"\"><span style=\"color:inherit\">컴퓨터 네트워크에 악영향을 끼칠 수 있는 소프</span></p><p style=\"\"><span style=\"color:inherit\">트웨어이다. 다음 중 악성 프로그램과 그 특징</span></p><p style=\"\"><span style=\"color:inherit\">에 대한 설명으로 가장 적절하지 않은 것은? </span></p><p style=\"\"><span style=\"color:inherit\">  ① 트로이 목마(Trojan horse)는 정상적인 기능을 </span></p><p style=\"\"><span style=\"color:inherit\">하는 프로그램 속에 숨어 정보를 빼내거나 원</span></p><p style=\"\"><span style=\"color:inherit\">격으로 제어 받도록 하는 악성 프로그램이다. </span></p><p style=\"\"><span style=\"color:inherit\">  ② 스파이웨어(Spyware)는 사용자의 정보를 빼내서 </span></p><p style=\"\"><span style=\"color:inherit\">전송하는 악성 프로그램이다. </span></p><p style=\"\"><span style=\"color:inherit\">  ③ 드로퍼(Dropper)는 다른 프로그램을 감염시키지</span></p><p style=\"\"><span style=\"color:inherit\">는 않지만 네트워크를 통해 자기 복제를 하며 </span></p><p style=\"\"><span style=\"color:inherit\">전파된다.</span></p><p style=\"\"><span style=\"color:inherit\">  ④ 펍(PUP)은 사용자의 동의를 얻어 설치되었으나 </span></p><p style=\"\"><span style=\"color:inherit\">프로그램과는 상관없이 시스템의 성능 저하 또</span></p><p style=\"\"><span style=\"color:inherit\">는 사용자의 결제를 유도하기도 한다.</span></p><p style=\"\"><span style=\"color:inherit\">112. 다음 중 공격자가 리눅스 시스템을 원격에서 공</span></p><p style=\"\"><span style=\"color:inherit\">격하지 못하도록 root 계정으로 원격 접속을 금</span></p><p style=\"\"><span style=\"color:inherit\">지하고자 할 때 파일 내용을 수정해야 하는 것</span></p><p style=\"\"><span style=\"color:inherit\">으로 가장 적절한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① /etc/passwd, /etc/crontab</span></p><p style=\"\"><span style=\"color:inherit\">  ② /etc/pam.d/login, /etc/shadow</span></p><p style=\"\"><span style=\"color:inherit\">  ③ /etc/passwd, /etc/securetty</span></p><p style=\"\"><span style=\"color:inherit\">  ④ /etc/pam.d/login, /etc/securetty</span></p><p style=\"\"><span style=\"color:inherit\">No</span></p><p style=\"\"><span style=\"color:inherit\">From</span></p><p style=\"\"><span style=\"color:inherit\">Service</span></p><p style=\"\"><span style=\"color:inherit\">To</span></p><p style=\"\"><span style=\"color:inherit\">Action</span></p><p style=\"\"><span style=\"color:inherit\">1</span></p><p style=\"\"><span style=\"color:inherit\">Internal </span></p><p style=\"\"><span style=\"color:inherit\">80</span></p><p style=\"\"><span style=\"color:inherit\">External</span></p><p style=\"\"><span style=\"color:inherit\">Allow</span></p><p style=\"\"><span style=\"color:inherit\">2</span></p><p style=\"\"><span style=\"color:inherit\">Any</span></p><p style=\"\"><span style=\"color:inherit\">80</span></p><p style=\"\"><span style=\"color:inherit\">192.168.1.10</span></p><p style=\"\"><span style=\"color:inherit\">Allow</span></p><p style=\"\"><span style=\"color:inherit\">3</span></p><p style=\"\"><span style=\"color:inherit\">192.168.1.11</span></p><p style=\"\"><span style=\"color:inherit\">25</span></p><p style=\"\"><span style=\"color:inherit\">10.10.10.21</span></p><p style=\"\"><span style=\"color:inherit\">Allow</span></p><p style=\"\"><span style=\"color:inherit\">4</span></p><p style=\"\"><span style=\"color:inherit\">192.168.1.11</span></p><p style=\"\"><span style=\"color:inherit\">110</span></p><p style=\"\"><span style=\"color:inherit\">10.10.10.21</span></p><p style=\"\"><span style=\"color:inherit\">Deny</span></p><p style=\"\"><span style=\"color:inherit\">5</span></p><p style=\"\"><span style=\"color:inherit\">192.168.1.11</span></p><p style=\"\"><span style=\"color:inherit\">143</span></p><p style=\"\"><span style=\"color:inherit\">10.10.10.21</span></p><p style=\"\"><span style=\"color:inherit\">Allow</span></p><p style=\"\"><span style=\"color:inherit\">6</span></p><p style=\"\"><span style=\"color:inherit\">10.10.10.21</span></p><p style=\"\"><span style=\"color:inherit\">25</span></p><p style=\"\"><span style=\"color:inherit\">192.168.1.11</span></p><p style=\"\"><span style=\"color:inherit\">Allow</span></p><p style=\"\"><span style=\"color:inherit\">7</span></p><p style=\"\"><span style=\"color:inherit\">External</span></p><p style=\"\"><span style=\"color:inherit\">25</span></p><p style=\"\"><span style=\"color:inherit\">Internal</span></p><p style=\"\"><span style=\"color:inherit\">Deny</span></p><p style=\"\"><span style=\"color:inherit\">...</span></p><p style=\"\"><span style=\"color:inherit\">- 23 -</span></p><p style=\"\"><span style=\"color:inherit\">113. </span><span style=\"color:inherit\">위험관리(Risk management) 과정을 순서대로 나</span></p><p style=\"\"><span style=\"color:inherit\">열한 것으로 가장 적절한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">가. 위험 모니터링 및 통제</span></p><p style=\"\"><span style=\"color:inherit\">나. 위험 식별</span></p><p style=\"\"><span style=\"color:inherit\">다. 위험 분석</span></p><p style=\"\"><span style=\"color:inherit\">라. 위험 대응 계획</span></p><p style=\"\"><span style=\"color:inherit\">  ① (다) - (가) - (나) - (라)</span></p><p style=\"\"><span style=\"color:inherit\">  ② (나) - (다) - (라) - (가) </span></p><p style=\"\"><span style=\"color:inherit\">  ③ (나) - (다) - (가) - (라)</span></p><p style=\"\"><span style=\"color:inherit\">  ④ (다) - (나) - (라) - (가) </span></p><p style=\"\"><span style=\"color:inherit\">114. 가명정보의 안전한 관리를 위한 기술적 보호조</span></p><p style=\"\"><span style=\"color:inherit\">치로 가장 적절하지 않은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 개인정보처리자는 추가정보와 가명정보를 반드</span></p><p style=\"\"><span style=\"color:inherit\">시 물리적으로 분리하여 별도로 저장·관리해</span></p><p style=\"\"><span style=\"color:inherit\">야 한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ② 추가정보가 가명정보와 불법적으로 결합되어 재</span></p><p style=\"\"><span style=\"color:inherit\">식별에 악용되지 않도록 접근권한을 최소화하고 </span></p><p style=\"\"><span style=\"color:inherit\">접근통제를 강화해야 한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 개인정보처리자는 가명정보의 처리목적, 가명처</span></p><p style=\"\"><span style=\"color:inherit\">리한 개인정보 항목, 가명정보의 이용내역, 제3</span></p><p style=\"\"><span style=\"color:inherit\">자 제공 시 제공받는 자를 작성하여 보관하여야 </span></p><p style=\"\"><span style=\"color:inherit\">한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ④ 개인정보처리자는 가명정보 또는 추가정보에 접</span></p><p style=\"\"><span style=\"color:inherit\">근할 수 있는 담당자를 가명정보 처리 업무 목</span></p><p style=\"\"><span style=\"color:inherit\">적 달성에 필요한 최소한의 인원으로 엄격하게 </span></p><p style=\"\"><span style=\"color:inherit\">통제하여야 한다.</span></p><p style=\"\"><span style=\"color:inherit\">115. 다음 설명에 해당하는 레지스터로 가장 적절한 </span></p><p style=\"\"><span style=\"color:inherit\">것은?</span></p><p style=\"\"><span style=\"color:inherit\">스택 오버플로우 공격을 실행하는데 있어서 활용되</span></p><p style=\"\"><span style=\"color:inherit\">는 정보를 보유하고 있는 CPU의 레지스터로서, 해</span></p><p style=\"\"><span style=\"color:inherit\">당 레지스터는 현재 실행 중인 스택에서 argument </span></p><p style=\"\"><span style=\"color:inherit\">및 지역변수의 위치를 참조하기 위한 기준 주소값</span></p><p style=\"\"><span style=\"color:inherit\">을 가지고 있다.</span></p><p style=\"\"><span style=\"color:inherit\">  ① EAX</span></p><p style=\"\"><span style=\"color:inherit\">② ESP</span></p><p style=\"\"><span style=\"color:inherit\">  ③ EDX </span></p><p style=\"\"><span style=\"color:inherit\">④ EBP</span></p><p style=\"\"><span style=\"color:inherit\">116. 딥페이크(Deepfake)에 대한 설명으로 가장 적절</span></p><p style=\"\"><span style=\"color:inherit\">하지 않은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 딥페이크는 인공지능 기술을 이용하여 진위 여</span></p><p style=\"\"><span style=\"color:inherit\">부를 구별하기 어려운 가짜 이미지나 영상물을 </span></p><p style=\"\"><span style=\"color:inherit\">제작하는 기술이다.</span></p><p style=\"\"><span style=\"color:inherit\">  ② 딥페이크를 이용한 가짜뉴스, 불법 성인용 콘텐</span></p><p style=\"\"><span style=\"color:inherit\">츠 제작으로 인한 피해를 감소시키기 위해 법적 </span></p><p style=\"\"><span style=\"color:inherit\">단속이 강화되고 있다.  </span></p><p style=\"\"><span style=\"color:inherit\">  ③ 딥페이크는 영화제작 분야에서 활용되는 등 부</span></p><p style=\"\"><span style=\"color:inherit\">작용 없이 사회, 정치 분야에 도움이 되고 있</span></p><p style=\"\"><span style=\"color:inherit\">다.</span></p><p style=\"\"><span style=\"color:inherit\">  ④ 딥페이크 기술이 스캔들의 진위여부에도 영향을 </span></p><p style=\"\"><span style=\"color:inherit\">미치는 등 사회적 파급력이 커지고 있다.</span></p><p style=\"\"><span style=\"color:inherit\">117. 블록체인(Blockchain)은 P2P 방식을 기반으로 </span></p><p style=\"\"><span style=\"color:inherit\">생성된 체인 형태의 연결고리 기반 분산 데이터 </span></p><p style=\"\"><span style=\"color:inherit\">저장 환경이다. 다음 중 블록체인에 대한 설명</span></p><p style=\"\"><span style=\"color:inherit\">으로 가장 적절하지 않은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 블록체인의 블록 내 헤더에는 해시 값과 거래별 </span></p><p style=\"\"><span style=\"color:inherit\">트랜잭션의 원본 값이 저장된다.</span></p><p style=\"\"><span style=\"color:inherit\">  ② 블록체인 기반 시스템은 거래기록이 구성원들에</span></p><p style=\"\"><span style=\"color:inherit\">게 공개되기 때문에 거래의 투명성을 보장한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 블록체인은 참여한 구성원이 네트워크를 통해 </span></p><p style=\"\"><span style=\"color:inherit\">서로 데이터를 검증함으로써 임의적인 조작이 </span></p><p style=\"\"><span style=\"color:inherit\">어렵도록 설계되었다.</span></p><p style=\"\"><span style=\"color:inherit\">  ④ 퍼블릭 블록체인(Public Blockchain)은 모든 구</span></p><p style=\"\"><span style=\"color:inherit\">성원들이 참여 가능하나, 비교적 네트워크 확</span></p><p style=\"\"><span style=\"color:inherit\">장이 어렵고 거래 속도가 느리다.</span></p><p style=\"\"><span style=\"color:inherit\">118. 다음 중 클라우드 보안 위협에 대한 설명으로 </span></p><p style=\"\"><span style=\"color:inherit\">가장 적절하지 않은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① 고객 정보에 대해 제3자 위탁 저장방식을 활용</span></p><p style=\"\"><span style=\"color:inherit\">할 경우 클라우드 사업자 내부의 관리 부주의로 </span></p><p style=\"\"><span style=\"color:inherit\">인한 정보 유출의 위협이 있다.</span></p><p style=\"\"><span style=\"color:inherit\">  ② 여러 고객사의 정보가 클라우드에 집중됨에 따라 </span></p><p style=\"\"><span style=\"color:inherit\">DDoS, APT 공격 등 다양한 공격의 목표가 될 수 </span></p><p style=\"\"><span style=\"color:inherit\">있다.</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 논리적 자원을 물리적으로 통합 및 재분배하여 </span></p><p style=\"\"><span style=\"color:inherit\">사용함에 따라 가상화 문제가 발생된다.</span></p><p style=\"\"><span style=\"color:inherit\">  ④ 인프라 서비스(IaaS) 이용시 효과적인 자원의 분리</span></p><p style=\"\"><span style=\"color:inherit\">가 이뤄지지 않을 경우 클라우드 서버 내부의 가상</span></p><p style=\"\"><span style=\"color:inherit\">머신 간 도청 및 해킹 피해가 발생할 수 있다.</span></p><p style=\"\"><span style=\"color:inherit\">- 24 -</span></p><p style=\"\"><span style=\"color:inherit\">119. 다음 설명에 해당하는 것으로 가장 적절한 것은?</span></p><p style=\"\"><span style=\"color:inherit\">- 내부 정보보호를 목적으로 하는 보안 솔루션으로 </span></p><p style=\"\"><span style=\"color:inherit\">중요 자료가 외부로 유출되는 것을 탐지하여 통</span></p><p style=\"\"><span style=\"color:inherit\">제하는 기술이다.</span></p><p style=\"\"><span style=\"color:inherit\">- 솔루션 종류에 따라 내용 기반 통제를 통해 중요 </span></p><p style=\"\"><span style=\"color:inherit\">정보를 식별하고 정보 유출을 통제할 수 있으며, </span></p><p style=\"\"><span style=\"color:inherit\">이밖에도 블루투스 통신, 테더링 등의 통신채널</span></p><p style=\"\"><span style=\"color:inherit\">에 대한 차단 기능을 제공한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ① 디지털 권리 관리(Digital Rights Management)</span></p><p style=\"\"><span style=\"color:inherit\">  ② 정보 유출 방지 솔루션(Data Leakage Prevention)</span></p><p style=\"\"><span style=\"color:inherit\">  ③ 디지털 워터마킹(Digital Watermarking)</span></p><p style=\"\"><span style=\"color:inherit\">  ④ 전자서명(Digital Signature)</span></p><p style=\"\"><span style=\"color:inherit\">120. 다음 중 VPN 관련 프로토콜에 대한 설명으로 가</span></p><p style=\"\"><span style=\"color:inherit\">장 적절하지 않은 것은?</span></p><p style=\"\"><span style=\"color:inherit\">  ① L2F(Layer 2 Forwarding)는 CISCO사에서 개발한 </span></p><p style=\"\"><span style=\"color:inherit\">터널링 프로토콜로 데이터 링크 계층에서 캡슐화</span></p><p style=\"\"><span style=\"color:inherit\">를 지원한다.</span></p><p style=\"\"><span style=\"color:inherit\">  ② IPSec은 IP망에서 안전한 전송을 위해 표준화된 </span></p><p style=\"\"><span style=\"color:inherit\">3계층 터널링 프로토콜이다.</span></p><p style=\"\"><span style=\"color:inherit\">  ③ L2TP는 L2F 기반으로 PPTP와의 호환성을 고려하</span></p><p style=\"\"><span style=\"color:inherit\">여 만들어진 터널링 프로토콜이다.</span></p><p style=\"\"><span style=\"color:inherit\">  ④ PPTP는 링크 계층의 PPP 프로토콜에 보안기능을 </span></p><p style=\"\"><span style=\"color:inherit\">추가하여 만든 것이고, 네트워크 계층에 적용되</span></p><p style=\"\"><span style=\"color:inherit\">는 프로토콜이다.</span></p>",
