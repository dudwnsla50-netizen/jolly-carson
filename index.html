<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기출분석 — 로그인</title>
    <meta name="description" content="로그인 페이지">
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap"
        rel="stylesheet">
    <style>
        /* ==================================
           디자인 토큰 — 대시보드와 동일한 테마
         ================================== */
        :root {
            --bg-color: #080b13;
            --card-bg: rgba(17, 24, 39, 0.75);
            --border-color: rgba(255, 255, 255, 0.06);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent-violet: #8b5cf6;
            --accent-blue: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%);
            --accent-glow: rgba(139, 92, 246, 0.12);
            --error-color: #ef4444;
            --card-hover-border: rgba(139, 92, 246, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* 대시보드와 동일한 배경 그라데이션 */
            background-image:
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.06) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.06) 0px, transparent 50%);
            background-attachment: fixed;
            overflow: hidden;
        }

        /* ==================================
           배경 애니메이션 파티클
         ================================== */
        .bg-particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .bg-particles .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            animation: float 12s ease-in-out infinite;
        }

        .bg-particles .orb:nth-child(1) {
            width: 350px;
            height: 350px;
            background: rgba(139, 92, 246, 0.15);
            top: -5%;
            left: -5%;
            animation-duration: 14s;
        }

        .bg-particles .orb:nth-child(2) {
            width: 280px;
            height: 280px;
            background: rgba(59, 130, 246, 0.12);
            bottom: -8%;
            right: -3%;
            animation-duration: 18s;
            animation-delay: -4s;
        }

        .bg-particles .orb:nth-child(3) {
            width: 200px;
            height: 200px;
            background: rgba(139, 92, 246, 0.08);
            top: 50%;
            left: 60%;
            animation-duration: 20s;
            animation-delay: -8s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-30px) scale(1.08);
            }
        }

        /* ==================================
           로그인 카드
         ================================== */
        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 0 1.25rem;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2.75rem 2.25rem 2.25rem;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow:
                0 0 60px rgba(139, 92, 246, 0.06),
                0 20px 40px rgba(0, 0, 0, 0.3);
            animation: cardEntry 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(24px);
        }

        @keyframes cardEntry {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- 헤더 로고 영역 --- */
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-logo {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.15rem;
            font-size: 1.6rem;
            box-shadow: 0 8px 24px rgba(139, 92, 246, 0.25);
        }

        .login-header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.35rem;
        }

        .login-header p {
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        /* --- 입력 필드 --- */
        .form-group {
            margin-bottom: 1.1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
            letter-spacing: 0.02em;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            color: var(--text-muted);
            pointer-events: none;
            transition: color 0.25s;
        }

        .form-input {
            width: 100%;
            padding: 0.72rem 0.85rem 0.72rem 2.6rem;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.88rem;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
        }

        .form-input::placeholder {
            color: var(--text-muted);
            font-size: 0.82rem;
        }

        .form-input:focus {
            border-color: var(--accent-violet);
            background: rgba(139, 92, 246, 0.04);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        .form-input:focus+.icon,
        .form-input:focus~.icon {
            color: var(--accent-violet);
        }

        /* --- 비밀번호 토글 --- */
        .toggle-pw {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            padding: 4px;
            transition: color 0.2s;
        }

        .toggle-pw:hover {
            color: var(--accent-violet);
        }

        /* --- 로그인 버튼 --- */
        .btn-login {
            width: 100%;
            padding: 0.78rem 1rem;
            margin-top: 0.6rem;
            border: none;
            border-radius: 12px;
            background: var(--accent-gradient);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.02em;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(139, 92, 246, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* 버튼 클릭 시 물결 효과 */
        .btn-login::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.15);
            border-radius: inherit;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .btn-login:active::after {
            opacity: 1;
        }

        /* --- 로딩 스피너 --- */
        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        .btn-login.loading .spinner {
            display: inline-block;
        }

        .btn-login.loading .btn-text {
            opacity: 0.7;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* --- 에러 메시지 --- */
        .error-msg {
            text-align: center;
            font-size: 0.8rem;
            color: var(--error-color);
            margin-top: 0.85rem;
            min-height: 1.2rem;
            opacity: 0;
            transform: translateY(-6px);
            transition: opacity 0.3s, transform 0.3s;
        }

        .error-msg.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* --- 입력 에러 테두리 --- */
        .form-input.input-error {
            border-color: var(--error-color);
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.12);
        }

        /* --- 하단 푸터 --- */
        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .login-footer p {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        /* ==================================
           흔들림 애니메이션 (로그인 실패 시)
         ================================== */
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            15%,
            45%,
            75% {
                transform: translateX(-8px);
            }

            30%,
            60%,
            90% {
                transform: translateX(8px);
            }
        }

        .login-card.shake {
            animation: shake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97);
        }

        /* ==================================
           반응형
         ================================== */
        @media (max-width: 480px) {
            .login-card {
                padding: 2rem 1.5rem 1.75rem;
            }

            .login-logo {
                width: 48px;
                height: 48px;
                font-size: 1.3rem;
            }

            .login-header h1 {
                font-size: 1.15rem;
            }
        }
    </style>
    <!-- Google Identity Services (GIS) SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
    <!-- 배경 오브 파티클 -->
    <div class="bg-particles">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <div class="login-wrapper">
        <div class="login-card" id="loginCard">
            <!-- 헤더 -->
            <div class="login-header">
                <div class="login-logo">🛡️</div>
                <h1>기출분석</h1>
                <p>12개년 빈출 개념 정밀 뷰어</p>
            </div>

            <!-- 로그인 폼 (임시 주석 처리) -->
            <!--
            <form id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label for="username">아이디</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" class="form-input" placeholder="아이디를 입력하세요" autofocus>
                        <span class="icon">👤</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="form-input" placeholder="비밀번호를 입력하세요">
                        <span class="icon">🔒</span>
                        <button type="button" class="toggle-pw" id="togglePw" title="비밀번호 표시/숨기기">👁️</button>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="btnLogin">
                    <span class="spinner"></span>
                    <span class="btn-text">로그인</span>
                </button>
            </form>

            <div class="error-msg" id="errorMsg"></div>
            -->

            <!-- 구글 로그인 연동 버튼 영역 -->
            <div
                style="margin-top: 2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; width: 100%;">
                <!-- [주의] 실제 서비스 환경에서는 아래 client_id 값을 발급받으신 클라이언트 ID로 대치해 주셔야 합니다. -->
                <div id="g_id_onload"
                    data-client_id="908779603767-94di2gh9bai86dkqnlcrhom9cm17g1d0.apps.googleusercontent.com"
                    data-context="signin" data-ux_mode="popup" data-callback="handleCredentialResponse"
                    data-auto_prompt="false">
                </div>
                <div class="g_id_signin" data-type="standard" data-shape="pill" data-theme="filled_blue"
                    data-text="signin_with" data-size="large" data-logo_alignment="left" style="width: 100%;">
                </div>
            </div>

            <!-- 구글 로그인 전용 에러 메시지 래퍼 -->
            <div class="error-msg" id="errorMsg"
                style="margin-top: 1.2rem; color: #f87171; font-size: 0.85rem; text-align: center; display: none;">
            </div>

            <!-- 푸터 -->
            <div class="login-footer">
                <p>© 2026 기출분석 시스템</p>
            </div>
        </div>
    </div>

    <script>
        // JWT(인증 토큰)를 안전하게 디코딩하여 JSON 페이로드를 추출하는 함수
        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function (c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) {
                console.error("JWT 파싱 에러:", e);
                return null;
            }
        }

        // 에러 메시지 표시 헬퍼
        function showError(msg) {
            const errorMsg = document.getElementById('errorMsg');
            const loginCard = document.getElementById('loginCard');
            if (errorMsg) {
                errorMsg.textContent = msg;
                errorMsg.style.display = 'block';
                // 카드 흔들림 효과 추가
                if (loginCard) {
                    loginCard.classList.add('shake');
                    setTimeout(() => loginCard.classList.remove('shake'), 500);
                }
            }
        }

        // 구글 로그인 성공 콜백 함수
        window.handleCredentialResponse = function (response) {
            const errorMsg = document.getElementById('errorMsg');
            if (errorMsg) {
                errorMsg.style.display = 'none'; // 이전 에러 메시지 감춤
            }

            if (!response.credential) {
                showError("인증 정보를 가져오지 못했습니다.");
                return;
            }

            const payload = parseJwt(response.credential);
            if (!payload || !payload.email) {
                showError("토큰에서 이메일 주소를 분석하지 못했습니다.");
                return;
            }

            const email = payload.email.toLowerCase().trim();
            const allowedEmails = ['dudwnsla50@gmail.com', 'dudwnsla50@gmial.com'];

            if (allowedEmails.includes(email)) {
                // 인증 성공 → 세션스토리지에 상태 저장 후 리다이렉트
                sessionStorage.setItem('dashboard_auth', 'authenticated');
                window.location.href = 'reports/se_official_scopes.html';
            } else {
                // 비인가 이메일 차단
                showError(`허용되지 않은 구글 계정입니다: ${payload.email}`);
            }
        };

        // 이미 인증을 통과한 유저는 로그인 페이지를 우회하고, 타이틀에 DB 모드를 주입합니다.
        (function () {
            const AUTH_KEY = 'dashboard_auth';
            if (sessionStorage.getItem(AUTH_KEY) === 'authenticated') {
                window.location.href = 'reports/se_official_scopes.html';
            }

            fetch('/api/db-mode')
                .then(res => res.ok ? res.json() : null)
                .then(data => {
                    if (data && data.db_type) {
                        const dbTypeStr = data.db_type.toUpperCase();
                        if (!document.title.includes(`[${dbTypeStr}]`)) {
                            document.title = `${document.title} [${dbTypeStr}]`;
                        }
                    }
                })
                .catch(err => console.warn("DB 모드 조회 실패:", err));
        })();
    </script>
</body>

</html>
